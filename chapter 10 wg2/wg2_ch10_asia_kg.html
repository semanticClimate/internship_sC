er at least the past 3,000 years. The rate accelerated to 4.62 mm (0.182 in)/yr for the decade 2013\u20132022. Climate change due to human activities is the main cause of this persistent acceleration. Between 1993 and 2018, melting ice sheets and glaciers accounted for 44% of sea level rise, with another 42% resulting from thermal expansion of water . The global average sea level has risen about 25 centimetres (9.8 in) since 1880."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "risk perception", "label": "risk perception", "shape": "dot", "size": 12, "title": "\u003cb\u003erisk perception\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: risk perception Wikipedia URL: Risk perception Risk perception is the subjective judgement that people make about the characteristics and severity of a risk . Risk perceptions often differ from statistical assessments of risk since they are affected by a wide range of affective (emotions, feelings, moods, etc.), cognitive (gravity of events, media coverage, risk-mitigating measures, etc.), contextual (framing of risk information, availability of alternative information sources, etc.), and individual (personality traits, previous experience, age, etc.) factors. Several theories have been proposed to explain why different people make different estimates of the dangerousness of risks. Three major families of theory have been developed: psychology approaches (heuristics and cognit"}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "vulnerability", "label": "vulnerability", "shape": "dot", "size": 22, "title": "\u003cb\u003evulnerability\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: vulnerability Wikipedia URL: Vulnerability Vulnerability refers to \"the quality or state of being exposed to the possibility of being attacked or harmed, either physically or emotionally.\" The understanding of social and environmental vulnerability, as a methodological approach, involves the analysis of the risks and assets of disadvantaged groups , such as the elderly. The approach of vulnerability in itself brings great expectations of social policy and gerontological planning . Types of vulnerability include social, cognitive, environmental, emotional or military. CDC/ATSDR Social Vulnerability Index variables grouped into four themes"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "adaptation measures", "label": "adaptation measures", "shape": "dot", "size": 12, "title": "\u003cb\u003eadaptation measures\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: adaptation measures Wikipedia URL: adaptation measures The page \" Adaptation measures \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "citizen science", "label": "citizen science", "shape": "dot", "size": 12, "title": "\u003cb\u003ecitizen science\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: citizen science Wikipedia URL: Citizen science The term citizen science (synonymous to terms like community science , crowd science , crowd-sourced science , civic science , participatory monitoring , or volunteer monitoring ) is research conducted with the participation of the general public, amateur or nonprofessional researchers, or participants from the fields of science , social science , and many other disciplines. The exact definition of citizen science varies, with different individuals and organizations having their own specific interpretations of its scope. Citizen science is employed in a wide range of areas of study, including ecology , biology , conservation , health and medical research , astronomy , media and communications , and information science . A high sch"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "climate variability", "label": "climate variability", "shape": "dot", "size": 12, "title": "\u003cb\u003eclimate variability\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: climate variability Wikipedia URL: Climate variability Climate variability includes all the variations in the climate that last longer than individual weather events, whereas the term climate change only refers to those variations that persist for a longer period of time, typically decades or more. Climate change may refer to any time in Earth\u0027s history, but the term is now commonly used to describe contemporary climate change, often popularly referred to as global warming. Since the Industrial Revolution , the climate has increasingly been affected by human activities . There is seasonal variability in how new high temperature records have outpaced new low temperature records."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "gender", "label": "gender", "shape": "dot", "size": 14, "title": "\u003cb\u003egender\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: gender Wikipedia URL: Gender Gender is the range of social, psychological, cultural, and behavioral aspects of being a man (or boy ), woman (or girl ), or portraying a third gender . Although gender often corresponds to sex , a transgender person may identify with a gender other than their sex assigned at birth . Most cultures use a gender binary , in which gender is divided into two categories, and people are considered part of one or the other; those who are outside these groups may fall under the umbrella term non-binary . Some societies have third genders (and fourth genders , etc.) such as the hijras of South Asia and two-spirit persons native to North America . Most scholars agree that gender is a central characteristic for social organization ; this may include social c"}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "United Nations", "label": "United Nations", "shape": "dot", "size": 26, "title": "\u003cb\u003eUnited Nations\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: United Nations Wikipedia URL: United Nations The United Nations ( UN ) is a global intergovernmental organization established by the signing of the UN Charter on 26 June 1945 with the articulated mission of maintaining international peace and security , to develop friendly relations among states , to promote international cooperation, and to serve as a centre for harmonizing the actions of states in achieving those goals. Haile Selassie I at the League of Nations appealing Italy\u0027s 1936 invasion in which the League failed to intervene."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "adaptation planning", "label": "adaptation planning", "shape": "dot", "size": 12, "title": "\u003cb\u003eadaptation planning\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: adaptation planning Wikipedia URL: adaptation planning The page \" Adaptation planning \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Singapore", "label": "Singapore", "shape": "dot", "size": 20, "title": "\u003cb\u003eSingapore\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Singapore Wikipedia URL: Singapore Singapore , officially the Republic of Singapore , is an island country and city-state in Southeast Asia . Its territory comprises a main island , over 60 satellite islands and islets , and one outlying islet . The country is about one degree of latitude (137 kilometres or 85 miles) north of the equator , off the southern tip of the Malay Peninsula , bordering the Strait of Malacca to the west, the Singapore Strait to the south along with the Riau Islands in Indonesia , the South China Sea to the east and the Straits of Johor along with the State of Johor in Malaysia to the north. Letter from William Farquhar to Sultan Muhammad Kanzul Alam, the 21st Sultan of Brunei , dated 28 November 1819. In the first line, Farquhar mentions that Sultan Hu"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "adaptation options", "label": "adaptation options", "shape": "dot", "size": 12, "title": "\u003cb\u003eadaptation options\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: adaptation options Wikipedia URL: adaptation options The page \" Adaptation options \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "climate action", "label": "climate action", "shape": "dot", "size": 14, "title": "\u003cb\u003eclimate action\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: climate action Wikipedia URL: Climate action Climate action (or climate change action ) refers to a range of activities, mechanisms, policy instruments, and so forth that aim at reducing the severity of human-induced climate change and its impacts . \"More climate action\" is a central demand of the climate movement . Climate inaction is the absence of climate action."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "social protection", "label": "social protection", "shape": "dot", "size": 14, "title": "\u003cb\u003esocial protection\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: social protection Wikipedia URL: Social protection Social protection , as defined by the United Nations Research Institute for Social Development , is concerned with preventing, managing, and overcoming situations that adversely affect people\u0027s well-being . Social protection consists of policies and programs designed to reduce poverty and vulnerability by promoting efficient labour markets , diminishing people\u0027s exposure to risks, and enhancing their capacity to manage economic and social risks, such as unemployment, exclusion, sickness, disability, and old age. An emerging approach within social protection frameworks is Adaptive Social Protection, which integrates disaster risk management and climate change adaptation to strengthen resilience against shocks.It is one of the t"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "seagrass meadows", "label": "seagrass meadows", "shape": "dot", "size": 12, "title": "\u003cb\u003eseagrass meadows\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: seagrass meadows Wikipedia URL: Seagrass meadows A seagrass meadow or seagrass bed is an underwater ecosystem formed by seagrasses. Seagrasses are marine (saltwater) plants found in shallow coastal waters and in the brackish waters of estuaries . Seagrasses are flowering plants with stems and long green, grass-like leaves. They produce seeds and pollen and have roots and rhizomes which anchor them in seafloor sand."}, {"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "Mongolia", "label": "Mongolia", "shape": "dot", "size": 30, "title": "\u003cb\u003eMongolia\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Mongolia Wikipedia URL: Mongolia Mongolia is a landlocked country in the East Asia region. It is bordered by Russia to the north and China to the south, and covers an area of 1,564,116 square kilometers (603,909 square miles), making it the 18th-largest country in the world and the second largest landlocked country after Kazakhstan , as well as the largest landlocked country that does not border an inland sea . With a population of 3.5 million, Mongolia is the world\u0027s most sparsely populated sovereign state , excluding partially unrecognized Western Sahara . The country constitutes a significant portion of the Mongolian Plateau , and its natural environment is characterized by grassy steppe , mountains to the north and west, and the Gobi Desert to the south. Ulaanbaatar , the "}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "remote sensing", "label": "remote sensing", "shape": "dot", "size": 12, "title": "\u003cb\u003eremote sensing\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: remote sensing Wikipedia URL: Remote sensing Remote sensing is the acquisition of information about an object or phenomenon without making physical contact with the object, in contrast to in situ or on-site observation . The term is applied especially to acquiring information about Earth and other planets . Remote sensing is used in numerous fields, including geophysics , geography , land surveying and most Earth science disciplines (e.g. exploration geophysics , hydrology , ecology , meteorology , oceanography , glaciology , geology ). It also has military, intelligence, commercial, economic, planning, and humanitarian applications, among others. Synthetic aperture radar image of Death Valley colored using polarimetry"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "population", "label": "population", "shape": "dot", "size": 16, "title": "\u003cb\u003epopulation\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: population Wikipedia URL: Population In biology , a population of organisms is a group of individuals of the same species , defined by a discontinuity or disjunction from other groups of individuals in certain characteristics, such as living area, genetic attributes, demographic structure. Among biologists, the term definition varies, in some cases significantly, and sometimes those variations can be confusing. There are also plenty of other terms to describe groups of individuals if no clear disjunction is present. Commonly, a population can be described by what individuals constitute the population, its size, a geographical area it occupies, and the time within which the population is examined. In qualitative terms, it is usually defined like \"a group of organisms of the sam"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "water security", "label": "water security", "shape": "dot", "size": 18, "title": "\u003cb\u003ewater security\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: water security Wikipedia URL: Water security The aim of water security is to maximize the benefits of water for humans and ecosystems. The second aim is to limit the risks of destructive impacts of water to an acceptable level. These risks include too much water ( flood ), too little water ( drought and water scarcity ), and poor quality ( polluted ) water. People who live with a high level of water security always have access to \"an acceptable quantity and quality of water for health, livelihood, and production\". For example, access to water, sanitation, and hygiene services is one part of water security. Some organizations use the term \"water security\" more narrowly, referring only to water supply aspects. Ethiopia\u0027s move to fill the GERD dam \u0027s reservoir could reduce Nile f"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Paris Agreement", "label": "Paris Agreement", "shape": "dot", "size": 16, "title": "\u003cb\u003eParis Agreement\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Paris Agreement Wikipedia URL: Paris Agreement The Paris Agreement (also called the Paris Accords or Paris Climate Accords ) is an international treaty on climate change that was signed in 2016. The treaty covers climate change mitigation , adaptation , and finance . The Paris Agreement was negotiated by 196 parties at the 2015 United Nations Climate Change Conference near Paris , France. As of January 2026, 194 members of the United Nations Framework Convention on Climate Change (UNFCCC) are parties to the agreement. Of the three UNFCCC member states which have not ratified the agreement, the only major emitter is Iran . The United States, the second largest emitter, withdrew from the agreement in 2020, rejoined in 2021, and withdrew again in 2026 ."}, {"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "Tajikistan", "label": "Tajikistan", "shape": "dot", "size": 28, "title": "\u003cb\u003eTajikistan\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Tajikistan Wikipedia URL: Tajikistan Tajikistan , officially the Republic of Tajikistan , is a landlocked country in Central Asia . Dushanbe is its capital and most populous city with a population of 1.24 million people. Tajikistan borders Afghanistan to the south , Uzbekistan to the west , Kyrgyzstan to the north , and China to the east and is narrowly separated from Pakistan by Afghanistan\u0027s Wakhan Corridor . It has a population of more than 10.7 million people. Ambassador to the Tang dynasty , coming from Kumedh ( \u80e1\u5bc6\u4e39 ). Wanghuitu circa 650 AD."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "SDGs", "label": "SDGs", "shape": "dot", "size": 20, "title": "\u003cb\u003eSDGs\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: SDGs Wikipedia URL: SDGs The 2030 Agenda for Sustainable Development , adopted by all United Nations (UN) members in 2015, created 17 world Sustainable Development Goals ( abbr. SDGs ). The aim of these global goals is \"peace and prosperity for people and the planet\" \u2013 while tackling climate change and working to preserve oceans and forests. The SDGs highlight the connections between the environmental, social and economic aspects of sustainable development . Sustainability is at the center of the SDGs, as the term sustainable development implies."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "GHG emissions", "label": "GHG emissions", "shape": "dot", "size": 16, "title": "\u003cb\u003eGHG emissions\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: GHG emissions Wikipedia URL: GHG emissions Greenhouse gas emissions ( GHG emissions ) from human activities intensify the greenhouse effect which contributes to climate change . Carbon dioxide (CO 2 ) from burning fossil fuels (such as coal , oil , and natural gas ) is the main cause of climate change. The largest annual emissions are from China followed by the United States, which has higher emissions per capita . The main producers fueling the emissions globally are large oil and gas companies . Emissions from human activities have increased atmospheric carbon dioxide by about 50% over pre-industrial levels. The growing levels of emissions have varied, but have been consistent among all greenhouse gases . Emissions in the 2010s averaged 56 billion tons a year, higher than an"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Ecosyst", "label": "Ecosyst", "shape": "dot", "size": 12, "title": "\u003cb\u003eEcosyst\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Ecosyst Wikipedia URL: Ecosyst The page \" Ecosyst \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Sixth Assessment Report", "label": "Sixth Assessment Report", "shape": "dot", "size": 16, "title": "\u003cb\u003eSixth Assessment Report\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Sixth Assessment Report Wikipedia URL: Sixth Assessment Report The Sixth Assessment Report ( AR6 ) of the United Nations (UN) Intergovernmental Panel on Climate Change (IPCC) is the sixth in a series of reports which assess the available scientific information on climate change . Three Working Groups (WGI, II, and III) covered the following topics: The Physical Science Basis (WGI); Impacts, Adaptation and Vulnerability (WGII); Mitigation of Climate Change (WGIII). Of these, the first study was published in 2021, the second report February 2022, and the third in April 2022. The final synthesis report was finished in March 2023. It includes a summary for policymakers and was the basis for the 2023 United Nations Climate Change Conference (COP28) in Dubai . Variation of annual ob"}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "water supply", "label": "water supply", "shape": "dot", "size": 22, "title": "\u003cb\u003ewater supply\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: water supply Wikipedia URL: Water supply Water supply is the provision of water by public utilities , commercial organisations, community endeavors or by individuals, usually via a system of pumps and pipes . Public water supply systems are crucial to properly functioning societies. These systems are what supply drinking water to populations around the globe. Aspects of service quality include continuity of supply, water quality and water pressure. The institutional responsibility for water supply is arranged differently in different countries and regions (urban versus rural). It usually includes issues surrounding policy and regulation, service provision and standardization . A girl collects clean water from a communal water supply in Kawempe , Uganda ."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "socioeconomic changes", "label": "socioeconomic changes", "shape": "dot", "size": 12, "title": "\u003cb\u003esocioeconomic changes\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: socioeconomic changes Wikipedia URL: socioeconomic changes The page \" Socioeconomic changes \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "western", "label": "western", "shape": "dot", "size": 12, "title": "\u003cb\u003ewestern\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: western Wikipedia URL: Western Western may refer to:"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "capacity building", "label": "capacity building", "shape": "dot", "size": 12, "title": "\u003cb\u003ecapacity building\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: capacity building Wikipedia URL: Capacity building Capacity building (or capacity development, capacity strengthening ) is the improvement in an individual\u0027s or organization\u0027s facility (or capability) \"to produce, perform or deploy\". The terms capacity building and capacity development have often been used interchangeably, although a publication by OECD-DAC stated in 2006 that capacity development was the preferable term. Since the 1950s, international organizations, governments, non-governmental organizations (NGOs) and communities use the concept of capacity building as part of \" social and economic development \" in national and subnational plans. The United Nations Development Programme defines itself by \"capacity development\" in the sense of \"\u0027how UNDP works\" to fulfill it"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "malaria", "label": "malaria", "shape": "dot", "size": 12, "title": "\u003cb\u003emalaria\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: malaria Wikipedia URL: Malaria Malaria is a mosquito-borne infectious disease which is transmitted by the bite of Anopheles mosquitoes . Human malaria causes symptoms that typically include fever , fatigue , vomiting , and headaches . In severe cases, it can cause jaundice , seizures , coma , or death . Symptoms usually begin 10 to 15 days after being bitten by an infected Anopheles mosquito. If not properly treated, people may have recurrences of the disease months later. In those who have recently survived an infection, reinfection usually causes milder symptoms. This partial resistance disappears over months to years if the person has no continuing exposure to malaria. The mosquitoes themselves are harmed by malaria, causing reduced lifespans in those infected by it."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "medium agreement", "label": "medium agreement", "shape": "dot", "size": 12, "title": "\u003cb\u003emedium agreement\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: medium agreement Wikipedia URL: medium agreement The page \" Medium agreement \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "Afghanistan", "label": "Afghanistan", "shape": "dot", "size": 28, "title": "\u003cb\u003eAfghanistan\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Afghanistan Wikipedia URL: Afghanistan Afghanistan , officially the Islamic Emirate of Afghanistan , is a landlocked country located at the crossroads of Central and South Asia . It is bordered by Pakistan to the east and south , Iran to the west , Turkmenistan to the northwest , Uzbekistan to the north , Tajikistan to the northeast , and China to the northeast and east . Occupying 652,864 square kilometers (252,072 sq mi) of land, the country is predominantly mountainous with plains in the north and the southwest , which are separated by the Hindu Kush mountain range. Kabul is the country\u0027s capital and largest city. Afghanistan\u0027s population is estimated to be between 40 and 50 million. Tents of Afghan nomads in the northern Badghis Province . Early peasant farming villages ca"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "natural hazards", "label": "natural hazards", "shape": "dot", "size": 16, "title": "\u003cb\u003enatural hazards\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: natural hazards Wikipedia URL: Natural hazards A natural disaster is the very harmful impact on a society or community brought by natural phenomenon or hazard . Some examples of natural hazards include avalanches , droughts , earthquakes , floods , heat waves , landslides - including submarine landslides , tropical cyclones , volcanic activity and wildfires . Additional natural hazards include blizzards , dust storms , firestorms , hails , ice storms , sinkholes , thunderstorms , tornadoes and tsunamis . Economic loss risk for six natural disasters: tropical cyclones , droughts , earthquakes , floods , landslides , and volcanoes ."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "disasters", "label": "disasters", "shape": "dot", "size": 14, "title": "\u003cb\u003edisasters\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: disasters Wikipedia URL: Disasters A disaster is an event that causes such serious harm to people, buildings, economies, or the environment that the affected community cannot handle it [ clarification needed ] alone. The United Nations Office for Disaster Risk Reduction defines a disaster as \"a serious disruption of the functioning of a community or a society at any scale due to hazardous events interacting with conditions of exposure, vulnerability and capacity, leading to one or more of the following: human, material, economic and environmental losses and impacts\". Natural disasters like avalanches , floods , earthquakes , and wildfires are caused by natural hazards . Human-made disasters like oil spills , terrorist attacks and power outages are caused by people. It may be d"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "agriculture sector", "label": "agriculture sector", "shape": "dot", "size": 16, "title": "\u003cb\u003eagriculture sector\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: agriculture sector Wikipedia URL: Agriculture sector In economics , the primary sector is the economic sector which comprises industry involved in the extraction and production of raw materials , such as farming , logging , fishing , forestry and mining . The primary sector tends to make up a larger portion of the economy in developing countries than it does in developed countries . For example, in 2018, agriculture, forestry, and fishing comprised more than 15% of GDP in sub-Saharan Africa but less than 1% of GDP in North America ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "uncertainty", "label": "uncertainty", "shape": "dot", "size": 16, "title": "\u003cb\u003euncertainty\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: uncertainty Wikipedia URL: Uncertainty Uncertainty or incertitude refers to situations involving imperfect or unknown information . It applies to predictions of future events, to physical measurements that are already made, or to the unknown, and is particularly relevant for decision-making . Uncertainty arises in partially observable or stochastic or complex or dynamic environments, as well as due to ignorance , indolence , or both. It arises in any number of fields, including insurance , philosophy , physics , statistics , economics , entrepreneurship , finance , medicine , psychology , sociology , engineering , metrology , meteorology , ecology and information science . Situations often arise wherein a decision must be made when the results of each possible choice are uncer"}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Persian Gulf", "label": "Persian Gulf", "shape": "dot", "size": 22, "title": "\u003cb\u003ePersian Gulf\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Persian Gulf Wikipedia URL: Persian Gulf The Persian Gulf , sometimes called the Arabian Gulf , is a mediterranean sea in West Asia . The body of water is an extension of the Arabian Sea and the larger Indian Ocean located between the Arabian Peninsula and Iran (Persia). It is connected to the Gulf of Oman in the east by the Strait of Hormuz . The river delta of the Shatt al-Arab forms the north-west shoreline."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "sustainability", "label": "sustainability", "shape": "dot", "size": 18, "title": "\u003cb\u003esustainability\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: sustainability Wikipedia URL: Sustainability Sustainability (from the latin sustinere - hold up, hold upright; furnish with means of support; bear, undergo, endure) is the ability to continue over a long period of time. In modern usage it generally refers to a state in which the environment, economy, and society will continue to exist over a long period of time. Many definitions emphasize the environmental dimension. This can include addressing key environmental problems , such as climate change and biodiversity loss . The idea of sustainability can guide decisions at the global, national, organizational, and individual levels. A related concept is that of sustainable development , and the terms are often used to mean the same thing. UNESCO distinguishes the two like this: \" S"}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "infrastructure", "label": "infrastructure", "shape": "dot", "size": 20, "title": "\u003cb\u003einfrastructure\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: infrastructure Wikipedia URL: Infrastructure Infrastructure is the set of facilities and systems that serve a country, city, or other area, and encompasses the services and facilities necessary for its economy, households and firms to function. Infrastructure is composed of public and private physical structures such as roads , railways , bridges , airports , public transit systems , tunnels , water supply , sewers , electrical grids , and telecommunications (including Internet connectivity and broadband access ). In general, infrastructure has been defined as \"the physical components of interrelated systems providing commodities and services essential to enable, sustain, or enhance societal living conditions \" and maintain the surrounding environment. San Francisco Ferry Buil"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "preparedness", "label": "preparedness", "shape": "dot", "size": 12, "title": "\u003cb\u003epreparedness\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: preparedness Wikipedia URL: Preparedness Preparedness is a set of actions that are taken as precautionary measures in the face of potential disasters. Being prepared helps in achieving goals and in avoiding and mitigating negative outcomes."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "disaster management", "label": "disaster management", "shape": "dot", "size": 18, "title": "\u003cb\u003edisaster management\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: disaster management Wikipedia URL: Disaster management Emergency management (also disaster management or emergency preparedness ) refers to the systematic reduction of a community\u0027s vulnerability to natural and man-made hazards as well as the coordinated response to disasters after they occur. Emergency management focuses on destructive events that overwhelm a community\u0027s ability to handle on its own, such as hurricanes , pandemics , and terrorism . Professional emergency management activities include search and rescue , providing for the basic needs of affected individuals, and issuing evacuation alerts . The management of disasters requires collaboration between individuals, households, non-governmental organizations, and local, provincial, and federal governments. A mobile "}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "UNESCAP", "label": "UNESCAP", "shape": "dot", "size": 12, "title": "\u003cb\u003eUNESCAP\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: UNESCAP Wikipedia URL: UNESCAP The United Nations Economic and Social Commission for Asia and the Pacific ( ESCAP or UNESCAP ) is one of the five regional commissions under the jurisdiction of the United Nations Economic and Social Council . It was established in order to increase economic activity in Asia and the Far East, as well as to foster economic relations between the region and other areas of the world."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "BDP 2100", "label": "BDP 2100", "shape": "dot", "size": 12, "title": "\u003cb\u003eBDP 2100\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: BDP 2100 Wikipedia URL: BDP 2100 The page \" BDP 2100 \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Land Use Policy", "label": "Land Use Policy", "shape": "dot", "size": 14, "title": "\u003cb\u003eLand Use Policy\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Land Use Policy Wikipedia URL: Land Use Policy Land use policy is a monthly peer-reviewed scientific journal covering various aspects of land use research. It is published by Elsevier and was established in 2004. The editors-in-chief are Uchendu Chigbu ( Namibia University of Science and Technology ) and Xiaoling Zhang ( University of Hong Kong )."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "climate change scenarios", "label": "climate change scenarios", "shape": "dot", "size": 14, "title": "\u003cb\u003eclimate change scenarios\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: climate change scenarios Wikipedia URL: Climate change scenarios A climate change scenario is a hypothetical future based on a \"set of key driving forces\". Scenarios explore the long-term effectiveness of mitigation and adaptation . Scenarios help to understand what the future may hold. They can show which decisions will have the most meaningful effects on mitigation and adaptation . Four climate change scenarios, based on 2015 data. Left: emissions pathways following the scenarios of (1) no policy, (2) current policy, (3) meeting the governments\u2019 announcements with constant country decarbonization rates past 2030, and (4) meeting the governments\u2019 announcements with higher rates of decarbonization past 2030. Right: global temperatures, depending on the amount of greenhouse gas"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "invasive species", "label": "invasive species", "shape": "dot", "size": 16, "title": "\u003cb\u003einvasive species\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: invasive species Wikipedia URL: Invasive species An invasive species is an introduced species that harms its new environment. Invasive species adversely affect habitats and bioregions , causing ecological , environmental , and/or economic damage. Since the 20th century, invasive species have become serious economic, social, and environmental threats worldwide. North American beaver ( Castor canadensis ) dam in Tierra del Fuego"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "livestock production", "label": "livestock production", "shape": "dot", "size": 14, "title": "\u003cb\u003elivestock production\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: livestock production Wikipedia URL: Livestock production Intensive agriculture , also known as intensive farming (as opposed to extensive farming ), conventional , or industrial agriculture , is a type of agriculture , both of crop plants and of animals , with higher levels of input and output per unit of agricultural land area. It is characterized by a low fallow ratio, higher use of inputs such as capital , labour , agrochemicals and water, and higher crop yields per unit land area. Intensive farming of wheat in Lund , Sweden"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "agricultural productivity", "label": "agricultural productivity", "shape": "dot", "size": 14, "title": "\u003cb\u003eagricultural productivity\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: agricultural productivity Wikipedia URL: Agricultural productivity Agricultural productivity is measured as the ratio of agricultural outputs to inputs. While individual products are usually measured by weight, which is known as crop yield , varying products make measuring overall agricultural output difficult. Therefore, agricultural productivity is usually measured as the market value of the final output. This productivity can be compared to many different types of inputs such as labour or land. Such comparisons are called partial measures of productivity. The Green Revolution significantly increased food production, enabling it to outpace population growth reducing the risk of food scarcity as population increased in the latter half of the 20th century."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "AR5", "label": "AR5", "shape": "dot", "size": 12, "title": "\u003cb\u003eAR5\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: AR5 Wikipedia URL: AR5 AR5 , AR 5 , or AR-5 can refer to:"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "western North Pacific", "label": "western North Pacific", "shape": "dot", "size": 12, "title": "\u003cb\u003ewestern North Pacific\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: western North Pacific Wikipedia URL: western North Pacific The page \" Western North Pacific \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "ASEAN", "label": "ASEAN", "shape": "dot", "size": 14, "title": "\u003cb\u003eASEAN\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: ASEAN Wikipedia URL: ASEAN The Association of Southeast Asian Nations ( ASEAN ) is a regional grouping of all 11 states in Southeast Asia , which aims to promote economic and security cooperation among its members. Together, its member states represent a population of more than 680 million people and a land area of over 4.5 million km 2 (1.7 million sq mi). The bloc generated a purchasing power parity (PPP) gross domestic product (GDP) of around US$13.152 trillion in 2025, constituting approximately 6.5% of global GDP (PPP) . ASEAN member states include some of the fastest growing economies in the world, and the institution plays an integral role in East Asian regionalism. Singapore\u0027s Tommy Koh (middle) leads the ASEAN Coalition at a UN press conference during the Cambodian\u2013Vi"}, {"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "Climate", "label": "Climate", "shape": "dot", "size": 28, "title": "\u003cb\u003eClimate\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Climate Wikipedia URL: Climate Climate is the long-term weather pattern in a region, typically averaged over 30 years. More rigorously, it is the mean and variability of meteorological variables over a time spanning from months to millions of years. Some of the meteorological variables that are commonly measured are temperature , humidity , atmospheric pressure , wind , and precipitation . In a broader sense, climate is the state of the components of the climate system , including the atmosphere , hydrosphere , cryosphere , lithosphere and biosphere and the interactions between them. The climate of a location is affected by its latitude , longitude , terrain , altitude , land use and nearby water bodies and their currents. Worldwide K\u00f6ppen climate classifications"}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "temperature", "label": "temperature", "shape": "dot", "size": 20, "title": "\u003cb\u003etemperature\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: temperature Wikipedia URL: Temperature Temperature is a numerical expression of hotness or coldness . Temperature is measured with a thermometer . It reflects the average kinetic energy of the vibrating and colliding atoms making up a substance."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "South Asian countries", "label": "South Asian countries", "shape": "dot", "size": 12, "title": "\u003cb\u003eSouth Asian countries\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: South Asian countries Wikipedia URL: South Asian countries The page \" South Asian countries \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "Saudi Arabia", "label": "Saudi Arabia", "shape": "dot", "size": 30, "title": "\u003cb\u003eSaudi Arabia\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Saudi Arabia Wikipedia URL: Saudi Arabia Saudi Arabia , officially the Kingdom of Saudi Arabia ( KSA ), is a country in West Asia . Located in the centre of the Middle East , it covers the bulk of the Arabian Peninsula and has a land area of about 2,150,000 km 2 (830,000 sq mi), making it the fifth-largest country in Asia , the largest in the Middle East, and the twelfth-largest in the world. It is bordered by the Red Sea to the west; Jordan , Iraq , and Kuwait to the north; the Persian Gulf , Bahrain , Qatar and the United Arab Emirates to the east; Oman to the southeast; and Yemen to the south . The Gulf of Aqaba in the northwest separates Saudi Arabia from Egypt and Israel . Saudi Arabia is the only country with a coastline along both the Red Sea and the Arabian Gulf , and "}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "climate resilience", "label": "climate resilience", "shape": "dot", "size": 12, "title": "\u003cb\u003eclimate resilience\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: climate resilience Wikipedia URL: Climate resilience Climate resilience is a concept to describe how well p Climate Resilience Graphic used in re-election campaign of Joe Biden in the U.S."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "GDP", "label": "GDP", "shape": "dot", "size": 14, "title": "\u003cb\u003eGDP\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: GDP Wikipedia URL: GDP Gross domestic product ( GDP ) is a monetary measure of the total market value of all of the final goods and services which are produced and rendered during a specific period of time (usually a year) by a country or countries. GDP is often used to measure the economic activity of a country or region. The major components of GDP are consumption, government spending, net exports (exports minus imports), and investment. Changing any of these factors can increase the size of the economy. For example, population growth through mass immigration can raise consumption and demand for public services, thereby contributing to GDP growth. However, GDP is not a measure of overall standard of living or well-being, as it does not account for how income is distributed a"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "ambient temperature", "label": "ambient temperature", "shape": "dot", "size": 14, "title": "\u003cb\u003eambient temperature\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: ambient temperature Wikipedia URL: Ambient temperature Room temperature , colloquially, denotes the range of air temperatures most people find comfortable indoors while dressed in typical clothing. Comfortable temperatures can be extended beyond this range depending on humidity , air circulation , and other factors. Mercury-in-glass thermometer measuring an ambient temperature of 23 \u00b0C (73 \u00b0F) a little above the normal \"room temperature\" range"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "climate justice", "label": "climate justice", "shape": "dot", "size": 16, "title": "\u003cb\u003eclimate justice\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: climate justice Wikipedia URL: Climate justice Climate justice is a type of environmental justice that focuses on the unequal impacts of climate change on marginalized or otherwise vulnerable populations. Climate justice seeks to achieve an equitable distribution of both the burdens of climate change and the efforts to mitigate climate change through advocacy and policy change. The economic burden of climate change mitigation is estimated by some at around 1% to 2% of GDP . Climate justice examines concepts such as equality , human rights , collective rights , justice and the historical responsibilities for climate change. Fridays for Future demonstration in Berlin in September 2021 with the slogan \"fight for climate justice\""}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "energy demand", "label": "energy demand", "shape": "dot", "size": 14, "title": "\u003cb\u003eenergy demand\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: energy demand Wikipedia URL: Energy demand World energy supply and consumption refers to the global supply of energy resources and its consumption . The system of global energy supply consists of the energy development , refinement , and trade of energy. Energy supplies may exist in various forms such as raw resources or more processed and refined forms of energy. The raw energy resources include for example coal , unprocessed oil and gas , uranium . In comparison, the refined forms of energy include for example refined oil that becomes fuel and electricity . Energy resources may be used in various different ways, depending on the specific resource (e.g. coal), and intended end use (industrial, residential, etc.). Energy production and consumption play a significant role in th"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "coastal ecosystems", "label": "coastal ecosystems", "shape": "dot", "size": 12, "title": "\u003cb\u003ecoastal ecosystems\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: coastal ecosystems Wikipedia URL: Coastal ecosystems A marine coastal ecosystem is a marine ecosystem which occurs where the land meets the ocean. Worldwide there is about 620,000 kilometres (390,000 mi) of coastline. Coastal habitats extend to the margins of the continental shelves , occupying about 7 percent of the ocean surface area. Marine coastal ecosystems include many very different types of marine habitats , each with their own characteristics and species composition. They are characterized by high levels of biodiversity and productivity. Coastal gannet colony"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "food systems", "label": "food systems", "shape": "dot", "size": 16, "title": "\u003cb\u003efood systems\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: food systems Wikipedia URL: Food systems The term food system describes the interconnected systems and processes that influence nutrition , food , health , community development , and agriculture . A food system includes all processes and infrastructure involved in feeding a population: growing, harvesting, processing, packaging , transporting , marketing , consumption, distribution , and disposal of food and food-related items. It also includes the inputs needed and outputs generated at each of these steps. Quantified hidden costs of agrifood systems by cost category (left) and subcategory (right), 2020"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Hindu Kush Himalaya", "label": "Hindu Kush Himalaya", "shape": "dot", "size": 12, "title": "\u003cb\u003eHindu Kush Himalaya\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Hindu Kush Himalaya Wikipedia URL: Hindu Kush Himalaya The page \" Hindu Kush Himalaya \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "North Pacific", "label": "North Pacific", "shape": "dot", "size": 12, "title": "\u003cb\u003eNorth Pacific\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: North Pacific Wikipedia URL: North Pacific Main five oceans division:"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "high confidence", "label": "high confidence", "shape": "dot", "size": 12, "title": "\u003cb\u003ehigh confidence\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: high confidence Wikipedia URL: High confidence Analytic confidence is a rating employed by intelligence analysts to convey doubt to decision makers about a statement of estimative probability . The need for analytic confidence ratings arise from analysts\u0027 imperfect knowledge of a conceptual model . An analytic confidence rating pairs with a statement using a word of estimative probability to form a complete analytic statement. Scientific methods for determining analytic confidence remain in infancy. Cover of a National Intelligence Estimate"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Republic", "label": "Republic", "shape": "dot", "size": 14, "title": "\u003cb\u003eRepublic\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Republic Wikipedia URL: Republic A republic , based on the Latin phrase res publica (\u0027public thing\u0027 or \u0027people\u0027s thing\u0027), is a state in which political power rests with the public ( people ), typically through their representatives \u2014in contrast to a monarchy . Although a republic is most often a single sovereign state , subnational state entities that have governments that are republican in nature may be referred to as republics. Sculpture of Cicero"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "UNICEF", "label": "UNICEF", "shape": "dot", "size": 14, "title": "\u003cb\u003eUNICEF\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: UNICEF Wikipedia URL: UNICEF UNICEF ( / \u02c8 j u\u02d0 n i \u02cc s \u025b f / YOO -nee- SEF ), originally the United Nations International Children\u0027s Emergency Fund , officially United Nations Children\u0027s Fund since 1953, is an agency of the United Nations responsible for providing humanitarian and developmental aid to children worldwide. The organization is one of the most widely known and visible social welfare entities globally, operating in 192 countries and territories. UNICEF\u0027s activities include providing immunizations and disease prevention, administering treatment for children and mothers with HIV , enhancing childhood and maternal nutrition , improving sanitation , promoting education, and providing emergency relief in response to disasters."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "energy efficiency", "label": "energy efficiency", "shape": "dot", "size": 12, "title": "\u003cb\u003eenergy efficiency\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: energy efficiency Wikipedia URL: Energy efficiency Energy efficiency may refer to:"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "investment", "label": "investment", "shape": "dot", "size": 12, "title": "\u003cb\u003einvestment\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: investment Wikipedia URL: Investment Investment is traditionally defined as the \"commitment of resources into something expected to gain value over time\". If an investment involves money, then it can be defined as a \"commitment of money to receive more money later\". From a broader viewpoint, an investment can be defined as \"to tailor the pattern of expenditure and receipt of resources to optimise the desirable patterns of these flows\". When expenditures and receipts are defined in terms of money, then the net monetary receipt in a time period is termed cash flow , while money received in a series of several time periods is termed cash flow stream. Dollar cost averaging: If an individual invested $500 per month into the stock market for 40 years at a 10% annual return rate, the"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "protected areas", "label": "protected areas", "shape": "dot", "size": 12, "title": "\u003cb\u003eprotected areas\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: protected areas Wikipedia URL: Protected areas Protected areas or conservation areas are locations that receive protection because of their recognized natural or cultural values. Protected areas are those areas in which human presence or the exploitation of natural resources (e.g. firewood, non-timber forest products , water, ...) is limited. World map with percentage of each country under protection (2005 data) 0\u20133.9% of the country is protected 3.9\u201311.3% protected 11.3\u201322.7% protected 22.7\u201341.8% protected 41.8\u201372.3% protected No data"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "landslides", "label": "landslides", "shape": "dot", "size": 12, "title": "\u003cb\u003elandslides\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: landslides Wikipedia URL: Landslides Landslides , also known as landslips , rockslips or rockslides , are several forms of mass wasting that may include a wide range of ground movements, such as rockfalls , mudflows , shallow or deep-seated slope failures and debris flows . Landslides occur in a variety of environments, characterized by either steep or gentle slope gradients, from mountain ranges to coastal cliffs or even underwater, in which case they are called submarine landslides . A landslide near Cusco, Peru , in 2018"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Central Siberia", "label": "Central Siberia", "shape": "dot", "size": 12, "title": "\u003cb\u003eCentral Siberia\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Central Siberia Wikipedia URL: Central Siberia The Central Siberian Plateau ( Russian : \u0421\u0440\u0435\u0434\u043d\u0435\u0441\u0438\u0431\u0438\u0440\u0441\u043a\u043e\u0435 \u043f\u043b\u043e\u0441\u043a\u043e\u0433\u043e\u0440\u044c\u0435 , romanized : Srednesibirskoye ploskogorye ; Yakut : \u041e\u0440\u0442\u043e \u0421\u0438\u0431\u0438\u0438\u0440 \u0445\u0430\u043f\u0442\u0430\u043b \u0445\u0430\u0439\u0430\u043b\u0430\u0430\u0445 \u0441\u0438\u0440\u044d , romanized: Orto Sib\u00eer xaptal xayal\u00e2x sire ) is a vast mountainous area in Siberia, one of the Great Russian Regions ."}, {"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "Kazakhstan", "label": "Kazakhstan", "shape": "dot", "size": 30, "title": "\u003cb\u003eKazakhstan\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Kazakhstan Wikipedia URL: Kazakhstan Kazakhstan , officially the Republic of Kazakhstan , is a landlocked country situated primarily in Central Asia , with a small portion of its territory extending into Eastern Europe . It borders Russia to the north and west , China to the east , Kyrgyzstan to the southeast , Uzbekistan to the south , and Turkmenistan to the southwest , and it has a coastline along the Caspian Sea . The capital is Astana , and Almaty , the country\u2019s largest city and principal cultural and economic center, served as the capital until 1997. Padishah (Emperor) of Dast-i Qipchaq, (1550). Possible portrait of Kazakh khan ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "deforestation", "label": "deforestation", "shape": "dot", "size": 16, "title": "\u003cb\u003edeforestation\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: deforestation Wikipedia URL: Deforestation Deforestation or forest clearance is the removal and destruction of a forest or stand of trees from land that is then converted to non-forest use. Deforestation can involve conversion of forest land to farms , ranches , or urban use. About 31% of Earth\u0027s land surface is covered by forests at present. This is one-third less than the forest cover before the expansion of agriculture, with half of that loss occurring in the last century. On average 2,400 trees are cut down each minute. Estimates vary widely as to the extent of deforestation in the tropics . In 2019, nearly a third of the overall tree cover loss, or 3.8 million hectares, occurred within humid tropical primary forests . These are areas of mature rainforest that are especial"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Himalayan region", "label": "Himalayan region", "shape": "dot", "size": 14, "title": "\u003cb\u003eHimalayan region\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Himalayan region Wikipedia URL: Himalayan region The Himalayas , or Himalaya , is a mountain range in Asia separating the plains of the Indian subcontinent from the Tibetan Plateau . The range has some of the Earth \u0027s highest peaks, including the highest, Mount Everest . More than 100 peaks exceeding elevations of 7,200 m (23,600 ft) above sea level lie in the Himalayas."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Oman", "label": "Oman", "shape": "dot", "size": 22, "title": "\u003cb\u003eOman\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Oman Wikipedia URL: Oman Oman , officially the Sultanate of Oman , is a country in the southeastern Arabian Peninsula in West Asia . It shares land borders with Saudi Arabia , the United Arab Emirates , and Yemen . Oman\u0027s coastline faces the Arabian Sea to the southeast and the Gulf of Oman on the northeast. The exclaves of Madha and Musandam are surrounded by the UAE on their land borders, while Musandam\u0027s coastal boundaries are formed by the Strait of Hormuz and the Gulf of Oman. It has a population of approximately 5.46 million and an area of 315,331 km 2 (121,750 sq mi). Muscat is the capital and largest city. The Archaeological Sites of Bat, Al-Khutm and Al-Ayn in Ad Dhahirah , built in the 3rd millennium BCE and a UNESCO World Heritage Site"}, {"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "Indian Ocean", "label": "Indian Ocean", "shape": "dot", "size": 32, "title": "\u003cb\u003eIndian Ocean\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Indian Ocean Wikipedia URL: Indian Ocean Main five oceans division:"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "mangroves", "label": "mangroves", "shape": "dot", "size": 12, "title": "\u003cb\u003emangroves\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: mangroves Wikipedia URL: Mangroves A mangrove is a shrub or tree that grows mainly in coastal saline or brackish water . Mangroves grow in an equatorial climate, typically along coastlines and tidal rivers . They have particular adaptations to take in extra oxygen and remove salt, allowing them to tolerate conditions that kill most plants. The term is also used for tropical coastal vegetation consisting of such species. Mangroves are taxonomically diverse due to convergent evolution in several plant families. They occur worldwide in tropical and subtropical coastal areas, mainly between latitudes 30\u00b0 N and 30\u00b0 S, with the greatest mangrove area within 5\u00b0 of the equator . Mangrove plant families first appeared during the Late Cretaceous to Paleocene epochs and became widely dis"}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Uzbekistan", "label": "Uzbekistan", "shape": "dot", "size": 24, "title": "\u003cb\u003eUzbekistan\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Uzbekistan Wikipedia URL: Uzbekistan Uzbekistan , officially the Republic of Uzbekistan , is a doubly landlocked country located in Central Asia . It is surrounded by five countries: Kazakhstan to the north , Kyrgyzstan to the northeast , Tajikistan to the southeast , Afghanistan to the south , and Turkmenistan to the southwest , making it one of only two doubly landlocked countries on Earth, the other being Liechtenstein . The country has a population of more than 38.2 million, making it the most populous country in Central Asia. Uzbekistan is a member of the Organization of Turkic States . Uzbek , spoken by the Uzbek people , is the official language and is spoken by the majority of its inhabitants, while Russian and Tajik are significant minority languages. Islam is the pre"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "vulnerability assessment", "label": "vulnerability assessment", "shape": "dot", "size": 18, "title": "\u003cb\u003evulnerability assessment\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: vulnerability assessment Wikipedia URL: Vulnerability assessment A vulnerability assessment is the process of identifying, quantifying, and prioritizing (or ranking) the vulnerabilities in a system. Examples of systems for which vulnerability assessments are performed include, but are not limited to, information technology systems, energy supply systems, water supply systems, transportation systems, and communication systems. Such assessments may be conducted on behalf of a range of different organizations, from small businesses up to large regional infrastructures. Vulnerability from the perspective of disaster management means assessing the threats from potential hazards to the population and to infrastructure. It may be conducted in the political, social, economic or enviro"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "land subsidence", "label": "land subsidence", "shape": "dot", "size": 12, "title": "\u003cb\u003eland subsidence\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: land subsidence Wikipedia URL: Land subsidence Subsidence is a general term for downward vertical movement of the Earth\u0027s surface, which can be caused by both natural processes and human activities. Subsidence involves little or no horizontal movement, which distinguishes it from slope movement . Subsided house, called The Crooked House , the result of 19th-century mining subsidence in Staffordshire, England"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "water conservation", "label": "water conservation", "shape": "dot", "size": 14, "title": "\u003cb\u003ewater conservation\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: water conservation Wikipedia URL: Water conservation Water conservation aims to sustainably manage the natural resource of fresh water , protect the hydrosphere , and meet current and future human demand . Water conservation makes it possible to avoid water scarcity . It covers all the policies, strategies and activities to reach these aims. Population, household size and growth and affluence all affect how much water is used. United States 1960 postal stamp advocating water conservation"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "climate risk", "label": "climate risk", "shape": "dot", "size": 18, "title": "\u003cb\u003eclimate risk\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: climate risk Wikipedia URL: Climate risk Climate risk is the potential for problems for societies or ecosystems from the impacts of climate change . The assessment of climate risk is based on formal analysis of the consequences, likelihoods and responses to these impacts. Societal constraints can also shape adaptation options. There are different values and preferences around risk, resulting in differences of risk perception. The risk equation shows that climate risk is a product of hazard , exposure, and climate change vulnerability (where \u0027x\u0027 represents interaction between the components)."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "rice", "label": "rice", "shape": "dot", "size": 20, "title": "\u003cb\u003erice\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: rice Wikipedia URL: Rice Rice is a cereal grain and in its domesticated form is the staple food of over half of the world\u0027s population , particularly in Asia and Africa . Rice is the seed of the grass species Oryza sativa (Asian rice)\u2014or, much less commonly, Oryza glaberrima (African rice). Asian rice was domesticated in China some 13,500 to 8,200 years ago; African rice was domesticated in Africa about 3,000 years ago. Rice has become commonplace in many cultures worldwide; in 2023, 800 million tons were produced, placing it third after sugarcane and maize . Only some 8% of rice is traded internationally. China, India, and Indonesia are the largest consumers of rice. A substantial amount of the rice produced in developing nations is lost after harvest through factors such as "}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "rainfall", "label": "rainfall", "shape": "dot", "size": 16, "title": "\u003cb\u003erainfall\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: rainfall Wikipedia URL: Rainfall Rain is a form of precipitation where water droplets that have condensed from atmospheric water vapor fall by gravity . Rain is a major component of the water cycle and is responsible for depositing most of the fresh water on the Earth. It provides water for hydroelectric power plants , crop irrigation , and suitable conditions for many types of ecosystems . Heavy rainfall on a roof"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Ho Chi Minh City", "label": "Ho Chi Minh City", "shape": "dot", "size": 14, "title": "\u003cb\u003eHo Chi Minh City\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Ho Chi Minh City Wikipedia URL: Ho Chi Minh City Ho Chi Minh City ( HCMC ; Vietnamese : Th\u00e0nh ph\u1ed1 H\u1ed3 Ch\u00ed Minh , IPA: [t\u02b0a\u0272\u02e8\u02e9 fow\u02e6\u02e5 ho\u02e8\u02e9 c\u026aj\u02e6\u02e5 m\u0268n\u02e7\u02e7] \u24d8 ), formerly and still commonly referred to as Saigon ( Vietnamese : S\u00e0i G\u00f2n , IPA: [\u0282a\u02d0j\u02e8\u02e9 \u0263\u0254\u014b\u02e8\u02e9] ), is the most populous city in Vietnam , with a population of more than 14 million in 2025. Saigon is written here as \u67f4\u68cd along with other Southern Vietnamese cities. (On the left of the page, first row after \" \u57ce\u5eaf\u4e09 \")"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "urban agriculture", "label": "urban agriculture", "shape": "dot", "size": 16, "title": "\u003cb\u003eurban agriculture\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: urban agriculture Wikipedia URL: Urban agriculture Urban agriculture refers to various practices of cultivating , processing, and distributing food in urban areas . The term also applies to the area activities of animal husbandry , aquaculture , beekeeping , and horticulture in an urban context. Urban agriculture is distinguished from peri-urban agriculture , which takes place in rural areas at the edge of suburbs. In many urban areas, efforts to expand agriculture also require addressing legacy soil contamination, particularly from lead and other heavy metals, which can pose risks to human health and food safety. An urban farm in Chicago ."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "adaptation strategy", "label": "adaptation strategy", "shape": "dot", "size": 12, "title": "\u003cb\u003eadaptation strategy\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: adaptation strategy Wikipedia URL: adaptation strategy The page \" Adaptation strategy \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "smallholder farmers", "label": "smallholder farmers", "shape": "dot", "size": 12, "title": "\u003cb\u003esmallholder farmers\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: smallholder farmers Wikipedia URL: smallholder farmers The page \" Smallholder farmers \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "adverse selection", "label": "adverse selection", "shape": "dot", "size": 14, "title": "\u003cb\u003eadverse selection\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: adverse selection Wikipedia URL: Adverse selection In economics , insurance , and risk management , adverse selection is a market situation where asymmetric information results in a party taking advantage of undisclosed information to benefit more from a contract or trade. The spiralling effect of how adverse selection worsens the quality of goods in the market"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "SP programmes", "label": "SP programmes", "shape": "dot", "size": 12, "title": "\u003cb\u003eSP programmes\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: SP programmes Wikipedia URL: SP programmes The page \" SP programmes \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "social justice", "label": "social justice", "shape": "dot", "size": 14, "title": "\u003cb\u003esocial justice\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: social justice Wikipedia URL: Social justice Social justice is justice in relation to the distribution of wealth , opportunities , and privileges within a society where individuals\u0027 rights are recognized and protected. In Western and Asian cultures , the concept of social justice has often referred to the process of ensuring that individuals fulfill their societal roles and receive their due from society. In the current movements for social justice , the emphasis has been on the breaking of barriers for social mobility , the creation of safety nets , and economic justice . [ excessive citations ] Social justice assigns rights and duties in the institutions of society, which enables people to receive the basic benefits and burdens of cooperation. The relevant institutions often"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Oceanogr", "label": "Oceanogr", "shape": "dot", "size": 12, "title": "\u003cb\u003eOceanogr\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Oceanogr Wikipedia URL: Oceanogr The page \" Oceanogr \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Hindu Kush Himalaya Assessment", "label": "Hindu Kush Himalaya Assessment", "shape": "dot", "size": 12, "title": "\u003cb\u003eHindu Kush Himalaya Assessment\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Hindu Kush Himalaya Assessment Wikipedia URL: Hindu Kush Himalaya Assessment The page \" Hindu Kush Himalaya Assessment \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Working Group II", "label": "Working Group II", "shape": "dot", "size": 12, "title": "\u003cb\u003eWorking Group II\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Working Group II Wikipedia URL: Working Group II The page \" Working Group II \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "informal settlements", "label": "informal settlements", "shape": "dot", "size": 14, "title": "\u003cb\u003einformal settlements\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: informal settlements Wikipedia URL: Informal settlements Informal housing or informal settlement can include any form of housing , shelter , or settlement (or lack thereof) which is illegal, falls outside of government control or regulation, or is not afforded protection by the state. As such, the informal housing industry is part of the informal sector . Informal housing settlement in Soweto , South Africa"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "mangrove restoration", "label": "mangrove restoration", "shape": "dot", "size": 12, "title": "\u003cb\u003emangrove restoration\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: mangrove restoration Wikipedia URL: Mangrove restoration Mangrove restoration is the regeneration of mangrove forest ecosystems in areas where they have previously existed. Restoration can be defined as \"the process of assisting the recovery of an ecosystem that has been degraded, damaged, or destroyed.\" Mangroves can be found throughout coastal wetlands of tropical and subtropical environments. Mangroves provide essential ecosystem services such as water filtration, aquatic nurseries, medicinal materials, food, and lumber. Additionally, mangroves play a vital role in climate change mitigation through carbon sequestration and protection from coastal erosion, sea level rise, and storm surges. Mangrove habitat is declining due to human activities such as clearing land for indust"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "finance", "label": "finance", "shape": "dot", "size": 14, "title": "\u003cb\u003efinance\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: finance Wikipedia URL: Finance Finance refers to monetary resources and to the study and discipline of money , currency , assets and liabilities . As a subject of study, it is a field of business administration which involves the planning, organizing, leading, and controlling of an organization\u0027s resources to achieve its goals. Based on the scope of financial activities in financial systems , the discipline can be divided into personal , corporate , and public finance . Bond issued by The Baltimore and Ohio Railroad. Bonds are a form of borrowing used by corporations to finance their operations."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "vulnerable populations", "label": "vulnerable populations", "shape": "dot", "size": 12, "title": "\u003cb\u003evulnerable populations\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: vulnerable populations Wikipedia URL: vulnerable populations The page \" Vulnerable populations \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "tourism", "label": "tourism", "shape": "dot", "size": 12, "title": "\u003cb\u003etourism\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: tourism Wikipedia URL: Tourism Tourism is travel for pleasure , and the commercial activity of providing and supporting such travel. UN Tourism defines tourism more generally, in terms which go \"beyond the common perception of tourism as being limited to holiday activity only\", as people \"travelling to and staying in places outside their usual environment for not more than one consecutive year for leisure and not less than 24 hours, business and other purposes\". Tourism can be domestic (within the traveller\u0027s own country) or international . International tourism has both incoming and outgoing implications on a country\u0027s balance of payments . The first sunrise seen from the torii gate on the sea, which is considered a sacred place ( \u014carai in Japan )"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "freshwater resources", "label": "freshwater resources", "shape": "dot", "size": 12, "title": "\u003cb\u003efreshwater resources\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: freshwater resources Wikipedia URL: freshwater resources The page \" Freshwater resources \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "economic growth", "label": "economic growth", "shape": "dot", "size": 12, "title": "\u003cb\u003eeconomic growth\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: economic growth Wikipedia URL: Economic growth In economics , economic growth is an increase in the quantity and quality of the economic goods and services that a society produces . It can be measured as the increase in the inflation-adjusted output of an economy in a given year or over a period of time. Historic world GDP per capita"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "uncertainties", "label": "uncertainties", "shape": "dot", "size": 12, "title": "\u003cb\u003euncertainties\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: uncertainties Wikipedia URL: uncertainties The page \" Uncertainties \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "livestock", "label": "livestock", "shape": "dot", "size": 18, "title": "\u003cb\u003elivestock\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: livestock Wikipedia URL: Livestock Livestock are the domesticated animals that are raised in an agricultural setting to provide labor and produce diversified animal products for human consumption such as meat , eggs , milk , fur , leather , and wool . The term is sometimes used to refer solely to animals which are raised for consumption, and sometimes used to refer solely to farmed ruminants , such as cattle , sheep , and goats . Livestock production are mainly a source for farm work and human consumption. Cows on a pasture in Austria"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "habitat loss", "label": "habitat loss", "shape": "dot", "size": 12, "title": "\u003cb\u003ehabitat loss\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: habitat loss Wikipedia URL: Habitat loss Habitat destruction (also termed habitat loss ) occurs when a natural habitat is no longer able to support its native species . The organisms once living there have either moved elsewhere, or are dead, leading to a decrease in biodiversity and species numbers . Habitat destruction is in fact the leading cause of biodiversity loss and species extinction worldwide. Map of the world\u0027s biodiversity hot spots, all of which are heavily threatened by habitat loss and degradation"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "coastal protection", "label": "coastal protection", "shape": "dot", "size
