shi"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Asian region", "label": "Asian region", "shape": "dot", "size": 12, "title": "\u003cb\u003eAsian region\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Asian region Wikipedia URL: Asian region The page \" Asian region \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "salt marshes", "label": "salt marshes", "shape": "dot", "size": 12, "title": "\u003cb\u003esalt marshes\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: salt marshes Wikipedia URL: Salt marshes A salt marsh , saltmarsh or salting , also known as a coastal salt marsh or a tidal marsh , is a coastal ecosystem in the upper coastal intertidal zone between land and open saltwater or brackish water that is regularly flooded by the tides. It is dominated by dense stands of salt-tolerant plants such as herbs , grasses , or low shrubs . These plants are terrestrial in origin and are essential to the stability of the salt marsh in trapping and binding sediments . Salt marshes play a large role in the aquatic food web and the delivery of nutrients to coastal waters. They also support terrestrial animals and provide coastal protection . Salt marsh during low tide , mean low tide, high tide and very high tide ( spring tide )."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "saltwater intrusion", "label": "saltwater intrusion", "shape": "dot", "size": 14, "title": "\u003cb\u003esaltwater intrusion\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: saltwater intrusion Wikipedia URL: Saltwater intrusion Saltwater intrusion is the movement of saline water into freshwater aquifers , which can lead to groundwater quality degradation, including drinking water sources, and other consequences. Saltwater intrusion can naturally occur in coastal aquifers, owing to the hydraulic connection between groundwater and seawater . Because saline water has a higher mineral content than freshwater, it is denser and has a higher water pressure. As a result, saltwater can push inland beneath the freshwater. In other topologies, submarine groundwater discharge can push fresh water into saltwater. Cause and impact of saltwater intrusion"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "security", "label": "security", "shape": "dot", "size": 12, "title": "\u003cb\u003esecurity\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: security Wikipedia URL: Security Security is protection from, or resilience against, potential harm (or other unwanted coercion ). Beneficiaries (technically referents ) of security may be persons and social groups, objects and institutions, ecosystems, or any other entity or phenomenon vulnerable to unwanted change. Refugees fleeing war and insecurity in Iraq and Syria arrive at Lesbos Island , supported by Spanish volunteers, 2015"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "livelihoods", "label": "livelihoods", "shape": "dot", "size": 12, "title": "\u003cb\u003elivelihoods\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: livelihoods Wikipedia URL: livelihoods The page \" Livelihoods \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Siberia", "label": "Siberia", "shape": "dot", "size": 22, "title": "\u003cb\u003eSiberia\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Siberia Wikipedia URL: Siberia Siberia ( / s a\u026a \u02c8 b \u026a\u0259r i \u0259 / sy- BEER -ee-\u0259 ; Russian : \u0421\u0438\u0431\u0438\u0440\u044c , romanized : Sibir\u0027 , IPA: [s\u02b2\u026a\u02c8b\u02b2ir\u02b2] \u24d8 ), is an extensive geographical region comprising all of North Asia , from the Ural Mountains in the west (with the Ural River usually forming the southernmost portion of its western boundary) to the Pacific Ocean in the east. It has formed a part of the sovereign territory of Russia and its predecessor states since the lengthy conquest of Siberia , which began with the fall of the Khanate of Sibir in 1582 and concluded with the annexation of Chukotka in 1778. Siberia is vast and sparsely populated, covering an area of over 13.1 million square kilometres (5,100,000 mi 2 ) \u2013 about three-quarters of Russia\u0027s total area, but home to roughly a q"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "waves", "label": "waves", "shape": "dot", "size": 12, "title": "\u003cb\u003ewaves\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: waves Wikipedia URL: Waves Waves most often refers to:"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "pH", "label": "pH", "shape": "dot", "size": 14, "title": "\u003cb\u003epH\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: pH Wikipedia URL: PH In chemistry , pH ( / p i\u02d0 \u02c8 h e\u026a t\u0283 / or / p i\u02d0 \u02c8 e\u026a t\u0283 / ; pee- AYCH ) is a logarithmic scale used to specify the acidity or basicity of aqueous solutions . Acidic solutions (solutions with higher concentrations of hydrogen ( H + ) cations ) are measured to have lower pH values than basic or alkaline solutions. While the origin of the symbol \u0027pH\u0027 can be traced back to its original inventor, and the \u0027H\u0027 refers clearly to hydrogen, the exact original meaning of the letter \u0027p\u0027 in pH is still disputed; it has since acquired a more general technical meaning that is used in numerous other contexts. Test tubes containing solutions of pH 1\u201310 colored with an indicator"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "monsoon regions", "label": "monsoon regions", "shape": "dot", "size": 12, "title": "\u003cb\u003emonsoon regions\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: monsoon regions Wikipedia URL: monsoon regions The page \" Monsoon regions \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "CIDs", "label": "CIDs", "shape": "dot", "size": 12, "title": "\u003cb\u003eCIDs\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: CIDs Wikipedia URL: CIDs The nucleoid (meaning nucleus -like ) is an irregularly shaped region within the prokaryotic cell that contains all or most of the genetic material . The chromosome of a typical prokaryote is circular , and its length is very large compared to the cell dimensions, so it needs to be compacted in order to fit. In contrast to the nucleus of a eukaryotic cell , it is not surrounded by a nuclear membrane . Instead, the nucleoid forms by condensation and functional arrangement with the help of chromosomal architectural proteins and RNA molecules as well as DNA supercoiling . Genome length varies widely (generally a few Mbp within a prokaryote phylum), and a cell may contain multiple copies of its genome. Formation of the Escherichia coli nucleoid A. An illus"}, {"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "Arabian Peninsula", "label": "Arabian Peninsula", "shape": "dot", "size": 30, "title": "\u003cb\u003eArabian Peninsula\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Arabian Peninsula Wikipedia URL: Arabian Peninsula The Arabian Peninsula ( Arabic : \u0634\u0628\u0647 \u0627\u0644\u062c\u0632\u064a\u0631\u0629 \u0627\u0644\u0639\u0631\u0628\u064a\u0629 , romanized : shibh al-jaz\u012bra al-\u02bfarabiyya , or \u062c\u0632\u064a\u0631\u0629 \u0627\u0644\u0639\u0631\u0628 , jaz\u012brat al-\u02bfarab , \u0027 the Island of Arabs \u0027 ), or simply Arabia , is a peninsula in West Asia , situated north-east of Africa on the Arabian plate . At 3,237,500 km 2 (1.25 million mi 2 ), comparable in size to India , the Arabian Peninsula is the largest peninsula in the world."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "hydropower", "label": "hydropower", "shape": "dot", "size": 16, "title": "\u003cb\u003ehydropower\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: hydropower Wikipedia URL: Hydropower Hydropower (from Ancient Greek \u1f51\u03b4\u03c1\u03bf -, \"water\"), also known as water power or water energy , is the use of falling or fast-running water to produce electricity or to power machines. This is achieved by converting the gravitational potential or kinetic energy of a water source to produce power. Hydropower is a method of sustainable energy production. Hydropower is now used principally for hydroelectric power generation , and is also applied as one half of an energy storage system known as pumped-storage hydroelectricity . The Three Gorges Dam in China; the hydroelectric dam is the world\u0027s largest power station by installed capacity ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "deserts", "label": "deserts", "shape": "dot", "size": 16, "title": "\u003cb\u003edeserts\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: deserts Wikipedia URL: Deserts A desert is a landscape where little precipitation occurs and, consequently, living conditions create unique biomes and ecosystems. The lack of vegetation exposes the unprotected surface of the ground to denudation . About one-third of the land surface of the Earth is arid or semi-arid . This includes much of the polar regions , where little precipitation occurs, and which are sometimes called polar deserts or \"cold deserts\". Deserts can be classified by the amount of precipitation that falls, by the temperature that prevails, by the causes of desertification or by their geographical location. Sand dunes in the Rub\u0027 al Khali (\"Empty quarter\") of Arabia"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "socioeconomic development", "label": "socioeconomic development", "shape": "dot", "size": 12, "title": "\u003cb\u003esocioeconomic development\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: socioeconomic development Wikipedia URL: Socioeconomic development Prescriptive and policy Three-sector circular flow of income diagram"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "mangrove forests", "label": "mangrove forests", "shape": "dot", "size": 12, "title": "\u003cb\u003emangrove forests\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: mangrove forests Wikipedia URL: Mangrove forests Mangrove forests , also called mangrove swamps , mangrove thickets or mangals , are productive wetlands located in tropical and subtropical intertidal zones . Approximately 80 mangrove species exist, all adapted to areas where slow-moving water allows for the deposition of fine sediment and low-oxygen soil conditions. These trees cannot endure freezing temperatures, which restricts their distribution to warmer climates. Mangroves in an ebb tide"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "cycl", "label": "cycl", "shape": "dot", "size": 12, "title": "\u003cb\u003ecycl\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: cycl Wikipedia URL: Cycl CycL in computer science and artificial intelligence , is an ontology language used by Douglas Lenat \u0027s Cyc artificial intelligence project . Ramanathan V. Guha was instrumental in designing early versions of the language. A close CycL variant exists named MELD ."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "humanity", "label": "humanity", "shape": "dot", "size": 12, "title": "\u003cb\u003ehumanity\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: humanity Wikipedia URL: Humanity Humanity most commonly refers to:"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "natural gas", "label": "natural gas", "shape": "dot", "size": 16, "title": "\u003cb\u003enatural gas\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: natural gas Wikipedia URL: Natural gas Natural gas (also gas , and methane gas ) is a naturally occurring mixture composed of gaseous hydrocarbons , primarily methane (95%), small amounts of higher alkanes , and traces of carbon dioxide and nitrogen , hydrogen sulfide and helium . Methane is a colorless and odorless gas, and, after carbon dioxide, is the second-greatest greenhouse gas that contributes to global climate change . Because natural gas is odorless, a commercial odorizer , such as methanethiol , that smells of hydrogen sulfide (rotten eggs) is added to the gas for the ready detection of gas leaks. Natural gas burning on a gas stove"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "USA", "label": "USA", "shape": "dot", "size": 12, "title": "\u003cb\u003eUSA\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: USA Wikipedia URL: USA The United States of America ( USA ), also known as the United States ( U.S. ) or America , is a country primarily located in North America . It is a federal republic of 50 states and a federal capital district , Washington, D.C. The 48 contiguous states border Canada to the north and Mexico to the south, with the semi-exclave of Alaska in the northwest and the archipelago of Hawaii in the Pacific Ocean . The United States also asserts sovereignty over five major island territories and various uninhabited islands in Oceania and the Caribbean . It is a megadiverse country , with the world\u0027s third-largest land area and third-largest population , exceeding 341 million. Cliff Palace , a settlement of ancestors of the Native American Pueblo peoples in present"}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Middle East", "label": "Middle East", "shape": "dot", "size": 20, "title": "\u003cb\u003eMiddle East\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Middle East Wikipedia URL: Middle East The Middle East is a geopolitical region encompassing the Arabian Peninsula , Egypt , Iran , Iraq , the Levant , and Turkey ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "North Africa", "label": "North Africa", "shape": "dot", "size": 16, "title": "\u003cb\u003eNorth Africa\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: North Africa Wikipedia URL: North Africa North Africa , also known as Northern Africa , is a region encompassing the northern portion of the African continent . There is no singularly accepted scope for the region. However, it is sometimes defined as stretching from the Atlantic shores of the Western Sahara in the west, to Egypt and Sudan\u0027s Red Sea coast in the east."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Jordan", "label": "Jordan", "shape": "dot", "size": 18, "title": "\u003cb\u003eJordan\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Jordan Wikipedia URL: Jordan Jordan , officially the Hashemite Kingdom of Jordan , is a country in the Southern Levant region of West Asia . Jordan is bordered by Syria to the north, Iraq to the east, Saudi Arabia to the south, and both Israel and Palestine ( West Bank ) to the west. The Jordan River , flowing into the Dead Sea , is located along the country\u0027s western border within the Jordan Rift Valley . Jordan has a small coastline along the Red Sea in its southwest, separated by the Gulf of Aqaba from Egypt . Amman is the country\u0027s capital and largest city , as well as the most populous city in the Levant . The \u0027Ain Ghazal Statues , c. 7250 BC, uncovered in Amman, are some of the oldest human statues ever found."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "financing", "label": "financing", "shape": "dot", "size": 12, "title": "\u003cb\u003efinancing\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: financing Wikipedia URL: Financing Funding is the act of providing resources to finance a need, program, or project. While this is usually in the form of money , it can also take the form of effort or time from an organization or company. Generally, this word is used when a firm uses its internal reserves to satisfy its necessity for cash, while the term financing is used when the firm acquires capital from external sources. [ citation needed ] The flow of funds from lender to borrower"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "climate vulnerability", "label": "climate vulnerability", "shape": "dot", "size": 18, "title": "\u003cb\u003eclimate vulnerability\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: climate vulnerability Wikipedia URL: Climate vulnerability Climate change vulnerability is a concept that describes how strongly people or ecosystems are likely to be affected by climate change . Its formal definition is the \" propensity or predisposition to be adversely affected\" by climate change. It can apply to humans and also to natural systems (or ecosystems). Issues around the capacity to cope and adapt are also part of this concept. Vulnerability is a component of climate risk . It differs within communities and also across societies, regions, and countries. It can increase or decrease over time. Vulnerability is generally a bigger problem for people in low-income countries than for those in high-income countries. World gross national income per capita: Lower income co"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "United Arab Emirates", "label": "United Arab Emirates", "shape": "dot", "size": 18, "title": "\u003cb\u003eUnited Arab Emirates\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: United Arab Emirates Wikipedia URL: United Arab Emirates in the Arabian Peninsula"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "institutional capacity", "label": "institutional capacity", "shape": "dot", "size": 12, "title": "\u003cb\u003einstitutional capacity\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: institutional capacity Wikipedia URL: institutional capacity The page \" Institutional capacity \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "rapid urbanisation", "label": "rapid urbanisation", "shape": "dot", "size": 12, "title": "\u003cb\u003erapid urbanisation\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: rapid urbanisation Wikipedia URL: rapid urbanisation The page \" Rapid urbanisation \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "environmental change", "label": "environmental change", "shape": "dot", "size": 14, "title": "\u003cb\u003eenvironmental change\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: environmental change Wikipedia URL: Environmental change Environmental change is a change or disturbance of the environment most often caused by human influences and natural ecological processes . Environmental changes include various factors, such as natural disasters , of human interferences, or animal interaction . Environmental change encompasses not only physical changes, but also factors like an infestation of invasive species ."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "R", "label": "R", "shape": "dot", "size": 12, "title": "\u003cb\u003eR\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: R Wikipedia URL: R R , or r , is the eighteenth letter of the Latin alphabet , used in the modern English alphabet , the alphabets of other western European languages and others worldwide. Its name in English is ar (pronounced / \u02c8 \u0251\u02d0r / \u24d8 ), plural ars ."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "risk reduction", "label": "risk reduction", "shape": "dot", "size": 12, "title": "\u003cb\u003erisk reduction\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: risk reduction Wikipedia URL: Risk reduction Risk reduction may refer to:"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "internal migration", "label": "internal migration", "shape": "dot", "size": 12, "title": "\u003cb\u003einternal migration\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: internal migration Wikipedia URL: Internal migration Internal migration or domestic migration is human migration within a country. Internal migration tends to be travel for education and for economic improvement or because of a natural disaster or civil disturbance, though a study based on the full formal economy of the United States found that the median post-move rise in income was only 1%. The impact from volcanic eruption of Mount Nyiragongo has caused domestic migration in Democratic Republic of the Congo population."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "age", "label": "age", "shape": "dot", "size": 12, "title": "\u003cb\u003eage\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: age Wikipedia URL: Age Age or AGE may refer to:"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "social capital", "label": "social capital", "shape": "dot", "size": 12, "title": "\u003cb\u003esocial capital\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: social capital Wikipedia URL: Social capital Social capital is a concept used in sociology and economics to define networks of relationships which are productive towards advancing the goals of individuals and groups. It involves the effective functioning of social groups through interpersonal relationships , a shared sense of identity , a shared understanding, shared norms , shared values , trust , cooperation , and reciprocity . Some have described it as a form of capital that produces public goods for a common purpose , although this does not align with how it has been measured."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "social norms", "label": "social norms", "shape": "dot", "size": 12, "title": "\u003cb\u003esocial norms\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: social norms Wikipedia URL: Social norms A social norm or norm is a shared standard of acceptable behavior by a group. Social norms can both be informal understandings that govern the behavior of members of a society , as well as be codified into rules and laws . Social normative influences or social norms, are deemed to be powerful drivers of human behavioural changes and well organized and incorporated by major theories which explain human behaviour . Institutions are composed of multiple norms. Norms are shared social beliefs about behavior; thus, they are distinct from \"ideas\", \"attitudes\", and \"values\", which can be held privately, and which do not necessarily concern behavior. Norms are contingent on context, social group, and historical circumstances. Shaking hands afte"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Yakutia", "label": "Yakutia", "shape": "dot", "size": 16, "title": "\u003cb\u003eYakutia\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Yakutia Wikipedia URL: Yakutia Sakha , officially the Republic of Sakha (Yakutia) , is a republic of Russia , and the largest federal subject of Russia by area. It is located in the Russian Far East , along the Arctic Ocean , with a population of one million. Sakha comprises half of the area of its governing Far Eastern Federal District , and is the world\u0027s largest country subdivision , covering over 3,083,523 km 2 (1,190,555 sq mi). Yakutsk , which is the world\u0027s coldest major city, is its capital and largest city."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "polar bears", "label": "polar bears", "shape": "dot", "size": 12, "title": "\u003cb\u003epolar bears\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: polar bears Wikipedia URL: Polar bears The polar bear ( Ursus maritimus ) is a large bear native to the Arctic and nearby areas. It is closely related to the brown bear , and the two species can interbreed . The polar bear is the largest extant species of bear and land carnivore by body mass, with adult males weighing 300\u2013800 kg (660\u20131,760 lb). The species is sexually dimorphic , as adult females are much smaller. The polar bear is white- or yellowish-furred with black skin and a thick layer of fat. It is more slender than the brown bear, with a narrower skull, longer neck and lower shoulder hump. Its teeth are sharper and more adapted to cutting meat. The paws are large and allow the bear to walk on ice and paddle in the water."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "local extinction", "label": "local extinction", "shape": "dot", "size": 12, "title": "\u003cb\u003elocal extinction\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: local extinction Wikipedia URL: Local extinction Local extinction , also extirpation , is the termination of a species (or other taxon ) in a chosen geographic area of study, though it still exists elsewhere. Local extinctions are contrasted with global extinctions . Canis lupus"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "mammals", "label": "mammals", "shape": "dot", "size": 12, "title": "\u003cb\u003emammals\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: mammals Wikipedia URL: Mammals A mammal (from Latin mamma \u0027 breast \u0027 ) is a vertebrate animal of the class Mammalia ( / m \u0259 \u02c8 m e\u026a l i . \u0259 / ). Mammals are characterised by the presence of milk -producing mammary glands for feeding their young, a broad neocortex region of the brain, fur or hair , and three middle ear bones . These characteristics distinguish them from reptiles and birds , from which their ancestors diverged in the Carboniferous Period over 300 million years ago. Around 6,640 extant species of mammals have been described and divided into 27 orders . The study of mammals is called mammalogy ."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "development", "label": "development", "shape": "dot", "size": 12, "title": "\u003cb\u003edevelopment\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: development Wikipedia URL: Development Development or developing may refer to:"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "fire frequency", "label": "fire frequency", "shape": "dot", "size": 12, "title": "\u003cb\u003efire frequency\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: fire frequency Wikipedia URL: fire frequency The page \" Fire frequency \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "increased", "label": "increased", "shape": "dot", "size": 12, "title": "\u003cb\u003eincreased\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: increased Wikipedia URL: increased The page \" Increased \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "population density", "label": "population density", "shape": "dot", "size": 16, "title": "\u003cb\u003epopulation density\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: population density Wikipedia URL: Population density Population density is a measurement of population size per unit land area . It is mostly applied to humans , but sometimes to other living organisms too. It is a key concept in population geography . In botany and agronomy , it\u0027s known as plant density . Population density (people per square kilometre) by country in 2023"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "phenology", "label": "phenology", "shape": "dot", "size": 14, "title": "\u003cb\u003ephenology\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: phenology Wikipedia URL: Phenology Phenology is the study of periodic events in biological life cycles and how these are influenced by seasonal and interannual variations in climate , as well as habitat factors (such as elevation ). Historical day of year for first bloom index (FBI) for the Tallgrass Prairie National Preserve, Kansas (dots) fitted with a local polynomial regression model ( loess in red) and a 2 standard error band (blue). Data from William Monahan."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "bioclimatic zones", "label": "bioclimatic zones", "shape": "dot", "size": 12, "title": "\u003cb\u003ebioclimatic zones\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: bioclimatic zones Wikipedia URL: bioclimatic zones The page \" Bioclimatic zones \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "larch forests", "label": "larch forests", "shape": "dot", "size": 12, "title": "\u003cb\u003elarch forests\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: larch forests Wikipedia URL: larch forests The page \" Larch forests \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "southwest coastal Bangladesh", "label": "southwest coastal Bangladesh", "shape": "dot", "size": 12, "title": "\u003cb\u003esouthwest coastal Bangladesh\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: southwest coastal Bangladesh Wikipedia URL: southwest coastal Bangladesh The page \" Southwest coastal Bangladesh \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "pathogens", "label": "pathogens", "shape": "dot", "size": 12, "title": "\u003cb\u003epathogens\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: pathogens Wikipedia URL: Pathogens In biology , a pathogen ( Greek : \u03c0\u03ac\u03b8\u03bf\u03c2 , pathos \"suffering\", \"passion\" and -\u03b3\u03b5\u03bd\u03ae\u03c2 , -gen\u0113s \"producer of\"), in the oldest and broadest sense, is any organism , agent or micro-organism that can produce disease . A pathogen may also be referred to as an infectious agent , or simply a germ . A photomicrograph of a stool that has shigella dysentery. These bacteria typically cause foodborne illness."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "climatic gradients", "label": "climatic gradients", "shape": "dot", "size": 12, "title": "\u003cb\u003eclimatic gradients\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: climatic gradients Wikipedia URL: climatic gradients The page \" Climatic gradients \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "United Nations Climate Change Secretariat", "label": "United Nations Climate Change Secretariat", "shape": "dot", "size": 12, "title": "\u003cb\u003eUnited Nations Climate Change Secretariat\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: United Nations Climate Change Secretariat Wikipedia URL: United Nations Climate Change Secretariat The United Nations Framework Convention on Climate Change ( UNFCCC ) is the UN process for negotiating an agreement to limit dangerous climate change. It is an international treaty among countries to combat \"dangerous human interference with the climate system \". The main way to do this is limiting the increase in greenhouse gases in the atmosphere . It was signed in 1992 by 154 states at the United Nations Conference on Environment and Development (UNCED), informally known as the Earth Summit , held in Rio de Janeiro . The treaty entered into force on 21 March 1994. \"UNFCCC\" is also the name of the Secretariat charged with supporting the operation of the convention, with offices"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "hydrological processes", "label": "hydrological processes", "shape": "dot", "size": 12, "title": "\u003cb\u003ehydrological processes\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: hydrological processes Wikipedia URL: hydrological processes The page \" Hydrological processes \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "coral growth", "label": "coral growth", "shape": "dot", "size": 12, "title": "\u003cb\u003ecoral growth\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: coral growth Wikipedia URL: coral growth The page \" Coral growth \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "anthropogenic activities", "label": "anthropogenic activities", "shape": "dot", "size": 12, "title": "\u003cb\u003eanthropogenic activities\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: anthropogenic activities Wikipedia URL: anthropogenic activities The page \" Anthropogenic activities \" does not exist. You can create a draft and submit it for "color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "coral reef ecosystems", "label": "coral reef ecosystems", "shape": "dot", "size": 12, "title": "\u003cb\u003ecoral reef ecosystems\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: coral reef ecosystems Wikipedia URL: coral reef ecosystems The page \" Coral reef ecosystems \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Sundarbans", "label": "Sundarbans", "shape": "dot", "size": 16, "title": "\u003cb\u003eSundarbans\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Sundarbans Wikipedia URL: Sundarbans Sundarbans ( Bengali : \u09b8\u09c1\u09a8\u09cd\u09a6\u09b0\u09ac\u09a8 ; pronounced / s \u028c n \u02c8 d \u0251\u02d0r b \u0259 n z / ) is a mangrove forest area in the Ganges Delta formed by the confluence of the Ganges , Brahmaputra and Meghna Rivers in the Bay of Bengal . It spans the area from the Hooghly River in India \u0027s state of West Bengal to the Baleswar River in Bangladesh \u0027s Khulna Division . It comprises closed and open mangrove forests, land used for agricultural purpose, mudflats and barren land, and is intersected by multiple tidal streams and channels. Spread across 10,277 km 2 (3,968 sq mi), it is the world\u0027s largest mangrove forest. It covers over 6,017 km 2 (2,323 sq mi) in Bangladesh\u0027s Khulna Division . In West Bengal\u0027s Presidency division , they extend over 4,260 km 2 (1,640 sq mi)"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "mangrove deforestation", "label": "mangrove deforestation", "shape": "dot", "size": 12, "title": "\u003cb\u003emangrove deforestation\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: mangrove deforestation Wikipedia URL: mangrove deforestation The page \" Mangrove deforestation \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "acidification", "label": "acidification", "shape": "dot", "size": 12, "title": "\u003cb\u003eacidification\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: acidification Wikipedia URL: Acidification Acidification may refer to:"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "economic", "label": "economic", "shape": "dot", "size": 14, "title": "\u003cb\u003eeconomic\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: economic Wikipedia URL: Economic Prescriptive and policy Gross domestic product per capita of countries (2024, PPP ) \u003e$60,000 $50,000 \u2013 $60,000 $40,000 \u2013 $50,000 $30,000 \u2013 $40,000 $20,000 \u2013 $30,000 $10,000 \u2013 $20,000 $5,000 \u2013 $10,000 $2,500 \u2013 $5,000 $1,000 \u2013 $2,500 \u003c$1,000 No data"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Yellow Sea", "label": "Yellow Sea", "shape": "dot", "size": 14, "title": "\u003cb\u003eYellow Sea\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Yellow Sea Wikipedia URL: Yellow Sea The Yellow Sea ( simplified Chinese : \u9ec4\u6d77 ; traditional Chinese : \u9ec3\u6d77 ; pinyin : Hu\u00e1ng H\u01cei ; Korean : \ud669\ud574 ; Hanja : \u9ec3\u6d77 ; RR : Hwanghae ), also known as the North Sea , is a marginal sea of the Western Pacific Ocean located between mainland China and the Korean Peninsula , and can be considered the northwestern part of the East China Sea . Brown sediment spills out into the Yellow Sea from rivers in eastern China and Korea. The nutrients in the sediment may be responsible for the bloom of phytoplankton seen as blue-green swirls."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "recovery", "label": "recovery", "shape": "dot", "size": 12, "title": "\u003cb\u003erecovery\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: recovery Wikipedia URL: Recovery Recovery or Recover may refer to:"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Marine heatwaves", "label": "Marine heatwaves", "shape": "dot", "size": 14, "title": "\u003cb\u003eMarine heatwaves\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Marine heatwaves Wikipedia URL: Marine heatwaves A marine heatwave is a period of abnormally high sea surface temperatures (SST) compared to typical temperatures for a particular season and locale. Marine heatwaves are caused by a variety of drivers. These include short term weather events such as fronts , intraseasonal events (30 to 90 days), annual, and decadal (10-year) modes like El Ni\u00f1o events , and human-caused climate change . Such heatwaves affect marine ecosystems . For example, heatwaves can lead to events such as coral bleaching , sea star wasting disease , harmful algal blooms , and mass mortality of benthic communities. Unlike heatwaves on land, marine heatwaves can extend over vast areas, persist for weeks to months to years, and extend to subsurface levels. Worl"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "average", "label": "average", "shape": "dot", "size": 12, "title": "\u003cb\u003eaverage\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: average Wikipedia URL: Average In mathematics , average means arithmetic mean (aka expected value ), though occasionally it is instead used to mean other central values such as median , mode , geometric mean , or harmonic mean . Outside of mathematics, it can mean common, typical, or normal. Four means of two numbers, a and b, constructed as chords on a semicircle"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "glacier melt", "label": "glacier melt", "shape": "dot", "size": 12, "title": "\u003cb\u003eglacier melt\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: glacier melt Wikipedia URL: glacier melt The page \" Glacier melt \" does not exi en melts, filling the depression created by the glacier. The Great Lakes as seen from space. The Great Lakes are the largest glacial lakes in the world."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "pesticides", "label": "pesticides", "shape": "dot", "size": 12, "title": "\u003cb\u003epesticides\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: pesticides Wikipedia URL: Pesticides Pesticides are substances that are used to control pests . They include herbicides , insecticides , nematicides , fungicides , and many others (see table). The most common of these are herbicides, which account for approximately 50% of all pesticide use globally. Most pesticides are used as plant protection products (also known as crop protection products), which in general protect plants from weeds , fungi, or insects . A self-propelled crop sprayer spraying pesticide on a field"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "local communities", "label": "local communities", "shape": "dot", "size": 12, "title": "\u003cb\u003elocal communities\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: local communities Wikipedia URL: Local communities A local community has been defined as a group of interacting people living in a common location. The word is often used to refer to a group that is organized around common values and is attributed with social cohesion within a shared geographical location, generally in social units larger than a household. The word can also refer to the national community or global community."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "precipitation extremes", "label": "precipitation extremes", "shape": "dot", "size": 12, "title": "\u003cb\u003eprecipitation extremes\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: precipitation extremes Wikipedia URL: precipitation extremes The page \" Precipitation extremes \" does not exist. You can create a draft and submit it for review or request that a redirect be create
