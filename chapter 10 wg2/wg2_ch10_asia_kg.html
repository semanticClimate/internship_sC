              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "climate change", "label": "climate change", "shape": "dot", "size": 50, "title": "\u003cb\u003eclimate change\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: climate change Wikipedia URL: Climate change Present-day climate change includes both global warming \u2014the ongoing increase in global average temperature \u2014and its wider effects on Earth\u0027s climate system . Climate change in a broader sense also includes previous long-term changes to Earth\u0027s climate . The modern-day rise in global temperatures is driven by human activities , especially fossil fuel ( coal , oil and natural gas ) burning since the Industrial Revolution . Fossil fuel use, deforestation , and some agricultural and industrial practices release greenhouse gases . These gases absorb some of the heat that the Earth radiates after it warms from sunlight, warming the lower atmosphere. Earth\u0027s atmosphere now has roughly 50% more carbon dioxide , the main gas driving global "}, {"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "Asia", "label": "Asia", "shape": "dot", "size": 42, "title": "\u003cb\u003eAsia\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Asia Wikipedia URL: Asia Asia ( / \u02c8 e\u026a \u0292 \u0259 / \u24d8 AY -zh\u0259 , UK also / \u02c8 e\u026a \u0283 \u0259 / AY -sh\u0259 ) is the largest continent in the world by both land area and population. It covers an area of more than 44 million square kilometres, about 30% of Earth\u0027s total land area and 8% of Earth\u0027s total surface area. The continent, which has long been home to the majority of the human population , was the site of many of the first civilisations . Its 4.7 billion people constitute roughly 60% of the world\u0027s population."}, {"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "China", "label": "China", "shape": "dot", "size": 58, "title": "\u003cb\u003eChina\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: China Wikipedia URL: China China , officially the People\u0027s Republic of China ( PRC ), is a country in East Asia . It is the second-most populous country after India , with a population exceeding 1.4 billion, representing 17% of the world\u0027s population. China borders fourteen countries by land across an area of 9.6 million square kilometers (3,700,000 sq mi), making it the third-largest country by area . The country is divided into 33 province-level divisions : 22 provinces , 5 autonomous regions , 4 municipalities , and 2 semi-autonomous special administrative regions . Beijing is the capital, while Shanghai is the most populous city by urban area and largest financial center ."}, {"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "India", "label": "India", "shape": "dot", "size": 48, "title": "\u003cb\u003eIndia\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: India Wikipedia URL: India India , officially the Republic of India , is a country in South Asia . It is the seventh-largest country by area ; the most populous country since 2023; and, since its independence in 1947, the world\u0027s most populous democracy. Bounded by the Indian Ocean on the south, the Arabian Sea on the southwest, and the Bay of Bengal on the southeast, it shares land borders with Pakistan to the west; China , Nepal , and Bhutan to the north; and Bangladesh and Myanmar to the east. In the Indian Ocean , India is near Sri Lanka and the Maldives ; its Andaman and Nicobar Islands share a maritime border with Myanmar, Thailand , and Indonesia ."}, {"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "South Asia", "label": "South Asia", "shape": "dot", "size": 48, "title": "\u003cb\u003eSouth Asia\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: South Asia Wikipedia URL: South Asia South Asia is the southern subregion of Asia that is defined in both geographical and ethnic - cultural terms. South Asia, with a population of 2.04 billion, contains a quarter (25%) of the world\u0027s population. As commonly conceptualised, the modern states of South Asia include Bangladesh , Bhutan , India , the Maldives , Nepal , Pakistan , and Sri Lanka , with Afghanistan also often included, which may otherwise be classified as part of Central Asia . South Asia borders East Asia to the northeast, Central Asia to the northwest, West Asia to the west and Southeast Asia to the east. Southeast Asia and Maritime South Asia are the only subregions of Asia that lie partly within the Southern Hemisphere . The British Indian Ocean Territory and two"}, {"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "Bangladesh", "label": "Bangladesh", "shape": "dot", "size": 32, "title": "\u003cb\u003eBangladesh\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Bangladesh Wikipedia URL: Bangladesh Bangladesh , officially the People\u0027s Republic of Bangladesh , is a country in South Asia . It is the eighth-most populous country in the world and among the most densely populated with a population of over 171 million within an area of 148,460 square kilometres (57,320 sq mi). Bangladesh shares land borders with India to the north, west, and east, and Myanmar to the southeast. It has a coastline along the Bay of Bengal to its south and is separated from Bhutan and Nepal by the Siliguri Corridor , and from China by the Indian state of Sikkim to its north. Dhaka , the capital and largest city , is the nation\u0027s political, financial, and cultural centre. Chittagong is the second-largest city and the busiest port of the country."}, {"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "Philippines", "label": "Philippines", "shape": "dot", "size": 28, "title": "\u003cb\u003ePhilippines\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Philippines Wikipedia URL: Philippines The Philippines , officially the Republic of the Philippines , is an archipelagic country in Southeast Asia . Located in the western Pacific Ocean , it consists of about 7,641 islands , with a total area of about 300,000 square kilometers, which are broadly categorized in three main geographical divisions from north to south: Luzon , Visayas , and Mindanao . With a population of over 112 million, it is the world\u0027s fourteenth-most-populous country ."}, {"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "Southeast Asia", "label": "Southeast Asia", "shape": "dot", "size": 44, "title": "\u003cb\u003eSoutheast Asia\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Southeast Asia Wikipedia URL: Southeast Asia Southeast Asia is the geographical southeastern region of Asia , consisting of the regions that are situated south of China , east of the Indian subcontinent , and northwest of mainland Australia , which is part of Oceania . Southeast Asia is bordered to the north by East Asia , to the west by South Asia and the Bay of Bengal , to the east by Oceania and the Pacific Ocean , and to the south by Australia and the Indian Ocean . Apart from the British Indian Ocean Territory and two out of 26 atolls of the Maldives in South Asia, Maritime Southeast Asia is the only other subregion of Asia that lies partly within the Southern Hemisphere . Mainland Southeast Asia is entirely in the Northern Hemisphere . Timor-Leste and the southern portio"}, {"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "Central Asia", "label": "Central Asia", "shape": "dot", "size": 52, "title": "\u003cb\u003eCentral Asia\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Central Asia Wikipedia URL: Central Asia Central Asia is a region of Asia consisting of Kyrgyzstan , Tajikistan , Turkmenistan , Uzbekistan , and most of Kazakhstan . The countries as a group are also colloquially referred to as the \"-stans\" as all have names ending with the Persian suffix \" -stan \" (meaning \u0027 land \u0027 ) in both respective native languages and most other languages. The region is bounded by the Caspian Sea to the southwest, European Russia to the northwest, China and Mongolia to the east, Afghanistan and Iran to the south, and Siberia to the north. Together, the five Central Asian countries have a total population of around 76 million."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Japan", "label": "Japan", "shape": "dot", "size": 26, "title": "\u003cb\u003eJapan\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Japan Wikipedia URL: Japan Japan is an island country in East Asia . Located in the Pacific Ocean off the northeast coast of the Asian mainland , it is bordered to the west by the Sea of Japan and extends from the Sea of Okhotsk in the north to the East China Sea in the south. The Japanese archipelago consists of four major islands alongside 14,121 smaller islands . Japan is divided into 47 administrative prefectures and eight traditional regions , and around 75% of its terrain is mountainous and heavily forested, concentrating its agriculture and highly urbanized population along its eastern coastal plains . With a population of almost 123 million as of 2026, it is the world\u0027s 11th most populous country . Tokyo is the country\u0027s capital and largest city ."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Nepal", "label": "Nepal", "shape": "dot", "size": 22, "title": "\u003cb\u003eNepal\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Nepal Wikipedia URL: Nepal Nepal , officially the Federal Democratic Republic of Nepal , is a landlocked country in South Asia . It is mainly situated in the Himalayas , but also includes parts of the Indo-Gangetic Plain . It borders the Tibet Autonomous Region of China to the north , and India to the south, east, and west , while it is narrowly separated from Bangladesh by the Siliguri Corridor , and from Bhutan by the Indian state of Sikkim . Nepal has a diverse geography , including fertile plains , subalpine forested hills, and eight of the world\u0027s ten highest mountains , including Mount Everest , the highest point above mean sea level on Earth. Kathmandu is the nation\u0027s capital and its largest city . Nepal is a multi-ethnic, multi-lingual, multi-religious, and multi-cultu"}, {"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "agriculture", "label": "agriculture", "shape": "dot", "size": 40, "title": "\u003cb\u003eagriculture\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: agriculture Wikipedia URL: Agriculture Agriculture is the practice of cultivating the soil, planting, raising, and harvesting both food and non-food crops, as well as livestock production. Broader definitions also include forestry and aquaculture . Agriculture was a key factor in the rise of sedentary human civilization , whereby farming of domesticated plants and animals created food surpluses that enabled people to live in the cities. While humans started gathering grains at least 105,000 years ago, nascent farmers only began planting them around 11,500 years ago. Sheep, goats, pigs, and cattle were domesticated around 10,000 years ago. Plants were independently cultivated in at least 11 regions of the world. In the 20th century, industrial agriculture based on large-scale m"}, {"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "Indonesia", "label": "Indonesia", "shape": "dot", "size": 28, "title": "\u003cb\u003eIndonesia\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Indonesia Wikipedia URL: Indonesia Indonesia , officially the Republic of Indonesia , is a country in Southeast Asia and Oceania , between the Indian and Pacific oceans. Comprising over 17,000 islands , including Sumatra , Java , Sulawesi , and parts of Borneo and New Guinea , Indonesia is the world\u0027s largest archipelagic state and the 14th-largest country by area , at 1,904,569 square kilometres (735,358 square miles). Indonesia has significant areas of wilderness that support one of the world\u0027s highest levels of biodiversity . It shares land borders with Papua New Guinea , Timor-Leste , and Malaysia , as well as maritime borders with seven other countries, including Australia , Singapore , and the Philippines . One of the oldest known figurative paintings , a depiction of a "}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "medium confidence", "label": "medium confidence", "shape": "dot", "size": 12, "title": "\u003cb\u003emedium confidence\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: medium confidence Wikipedia URL: medium confidence The page \" Medium confidence \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "East Asia", "label": "East Asia", "shape": "dot", "size": 42, "title": "\u003cb\u003eEast Asia\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: East Asia Wikipedia URL: East Asia East Asia is a geocultural region of Asia . It includes China , Japan , Mongolia , North Korea , South Korea , and Taiwan , plus two special administrative regions of China , Hong Kong and Macau . The economies of China , Japan , South Korea , and Taiwan are among the world\u0027s largest and most prosperous. East Asia borders North Asia to the north, Southeast Asia to the south, South Asia to the southwest, and Central Asia to the west. To its east is the Pacific Ocean . Map showing the boundary of the 13th-century Mongol Empire compared to today\u0027s Mongols"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "food security", "label": "food security", "shape": "dot", "size": 14, "title": "\u003cb\u003efood security\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: food security Wikipedia URL: Food security Food security is the state of having reliable access to a sufficient quantity of affordable, healthy food . The availability of food for people of any class, gender, status, ethnicity, or religion is another element of food protection. Similarly, household food security is considered to exist when all the members of a family have consistent access to enough food for an active, healthy life. Food-secure individuals do not live in hunger or fear of starvation . Food security includes resilience to future disruptions of food supply. Such a disruption could occur due to various risk factors such as droughts and floods , shipping disruptions, fuel shortages, economic instability, and wars. Food insecurity is the opposite of food security: "}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "adaptation", "label": "adaptation", "shape": "dot", "size": 14, "title": "\u003cb\u003eadaptation\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: adaptation Wikipedia URL: Adaptation Collective intelligence Collective action Self-organized criticality Herd mentality Phase transition Agent-based modelling Synchronization Ant colony optimization Particle swarm optimization Swarm behaviour The second of Jean-Baptiste Lamarck \u0027s two factors (the first being a complexifying force) was an adaptive force that causes animals with a given body plan to adapt to circumstances by inheritance of acquired characteristics , creating a diversity of species and genera ."}, {"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "Vietnam", "label": "Vietnam", "shape": "dot", "size": 28, "title": "\u003cb\u003eVietnam\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Vietnam Wikipedia URL: Vietnam Vietnam , officially the Socialist Republic of Vietnam ( SRV ), is a country at the eastern edge of Mainland Southeast Asia . With an area of about 331,000 square kilometres (128,000 sq mi) and a population of over 102 million, it is the world\u0027s 16th-most populous country . One of two communist states in Southeast Asia , Vietnam is bordered by China to the north, and Laos and Cambodia to the west; it lies along the Gulf of Thailand to the southwest and the South China Sea to the east, where it has shared and disputed maritime borders with other countries. Its capital is Hanoi , while its largest city is Ho Chi Minh City . Ng\u01b0\u1eddi Vi\u1ec7t \ud840\ude9b\u8d8a written in ch\u1eef N\u00f4m"}, {"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "Pakistan", "label": "Pakistan", "shape": "dot", "size": 32, "title": "\u003cb\u003ePakistan\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Pakistan Wikipedia URL: Pakistan Pakistan , officially the Islamic Republic of Pakistan , is a country in South Asia . It is the fifth-most populous country , with a population of over 241.5 million, having the second-largest Muslim population as of 2023. Islamabad is the nation\u0027s capital, while Karachi is its largest city and financial centre . Pakistan is the 33rd-largest country by area . Bounded by the Arabian Sea on the south, the Gulf of Oman on the southwest, and the Sir Creek on the southeast, it shares land borders with India to the east; Afghanistan to the west; Iran to the southwest; and China to the northeast. It shares a maritime border with Oman in the Gulf of Oman, and is separated from Tajikistan in the northwest by Afghanistan\u0027s narrow Wakhan Corridor ."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "climate change adaptation", "label": "climate change adaptation", "shape": "dot", "size": 26, "title": "\u003cb\u003eclimate change adaptation\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: climate change adaptation Wikipedia URL: Climate change adaptation Climate change adaptation is the process of adjusting to the effects of climate change , both current and anticipated. Adaptation aims to moderate or avoid harm for people, and is usually done alongside climate change mitigation . It also aims to exploit opportunities. Adaptation can involve interventions to help natural systems cope with changes. Wetland restoration in Australia"}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Iran", "label": "Iran", "shape": "dot", "size": 24, "title": "\u003cb\u003eIran\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Iran Wikipedia URL: Iran Iran , officially the Islamic Republic of Iran , and also known as Persia , is a country in West Asia . It borders Iraq to the west, Turkey , Azerbaijan , and Armenia to the northwest, the Caspian Sea to the north, Turkmenistan to the northeast, Afghanistan to the east, Pakistan to the southeast, and the Gulf of Oman and the Persian Gulf to the south. With a population of over 90 million, Iran ranks 17th globally in both geographic size and population and is the sixth-largest country in Asia. It is divided into five regions with 31 provinces . Tehran is the nation\u0027s capital, largest city , and financial center . Map of West Asia in 1872, with \"Iran or Persia\" (ruled by the Qajar dynasty ) shaded in pink."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Thailand", "label": "Thailand", "shape": "dot", "size": 26, "title": "\u003cb\u003eThailand\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Thailand Wikipedia URL: Thailand Thailand , officially the Kingdom of Thailand , and formerly known as Siam until 1939, is a country located in mainland Southeast Asia . It shares land borders with Myanmar to the west and northwest, Laos to the east and northeast, Cambodia to the southeast, and Malaysia to the south. Its maritime boundaries include the Gulf of Thailand and the Andaman Sea , as well as maritime borders with Vietnam , Indonesia , and India . Thailand has a population of nearly 66 million people and covers an area of approximately 513,115 km 2 (198,115 sq mi). The country\u0027s capital and largest city is Bangkok . SPPM Mongkut Rex Siamensium , King Mongkut \u0027s signature"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "precipitation", "label": "precipitation", "shape": "dot", "size": 18, "title": "\u003cb\u003eprecipitation\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: precipitation Wikipedia URL: Precipitation In meteorology , precipitation is any product of the condensation of atmospheric water vapor that falls from clouds due to gravitational pull. The main forms of precipitation include drizzle , rain , rain and snow mixed (\"sleet\" in Commonwealth usage), snow , ice pellets , graupel and hail . Precipitation occurs when a portion of the atmosphere becomes saturated with water vapor (reaching 100% relative humidity ), so that the water condenses and \"precipitates\" or falls. Thus, fog and mist are not precipitation; their water vapor does not condense sufficiently to precipitate, so fog and mist do not fall. (Such a non-precipitating combination is a colloid .) Two processes, possibly acting together, can lead to air becoming saturated wit"}, {"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "North Asia", "label": "North Asia", "shape": "dot", "size": 30, "title": "\u003cb\u003eNorth Asia\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: North Asia Wikipedia URL: North Asia North Asia or Northern Asia ( Russian : \u0421\u0435\u0432\u0435\u0440\u043d\u0430\u044f \u0410\u0437\u0438\u044f ) is the northern region of Asia , which is defined in geographical terms and consists of three federal districts of Russia : Ural , Siberian , and the Far Eastern . North Asia is bordered by the Arctic Ocean to its north; by Eastern Europe to its west; by Central Asia and East Asia to its south; and by the Pacific Ocean and Northern America to its east. It covers an area of 13,100,000 square kilometres (5,100,000 sq mi), or 8.8% of Earth \u0027s total land area; and is the largest subregion of Asia by area, occupying approx. 29.4% of Asia\u0027s land area, but is also the least populated, with a population of around 37 million, accounting for merely 0.74% of Asia\u0027s population. Map of Northern Asi"}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "sustainable development", "label": "sustainable development", "shape": "dot", "size": 20, "title": "\u003cb\u003esustainable development\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: sustainable development Wikipedia URL: Sustainable development Sustainable development is an approach to growth and human development that aims to meet the needs of the present without compromising the ability of future generations to meet their own needs. The aim is to have a society where living conditions and resources meet human needs without undermining planetary integrity . Sustainable development aims to balance the needs of the economy , environment , and society. Sustainable development aims to balance the needs of the economy, environment, and society. Equitable health access is a pillar of social sustainability. The Brundtland Report in 1987 helped to make the concept of sustainable development better known. Three visual representations of sustainability and its thr"}, {"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "West Asia", "label": "West Asia", "shape": "dot", "size": 42, "title": "\u003cb\u003eWest Asia\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: West Asia Wikipedia URL: West Asia West Asia (also called Western Asia or Southwest Asia ) is the westernmost region of Asia . As defined by most academics, UN bodies and other institutions, the subregion consists of Anatolia , the Arabian Peninsula , Iran , Mesopotamia , the Armenian highlands , the Levant , the island of Cyprus , the Sinai Peninsula and the South Caucasus . The region is separated from Africa by the Isthmus of Suez in Egypt , and separated from Europe by the waterways of the Turkish Straits and the watershed of the Greater Caucasus . Central Asia lies to its northeast, while South Asia lies to its east. Twelve seas surround the region (clockwise): the Aegean Sea , the Sea of Marmara , the Black Sea , the Caspian Sea , the Persian Gulf , the Gulf of Oman , th"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "SLR", "label": "SLR", "shape": "dot", "size": 12, "title": "\u003cb\u003eSLR\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: SLR Wikipedia URL: SLR"}, {"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "Russia", "label": "Russia", "shape": "dot", "size": 36, "title": "\u003cb\u003eRussia\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Russia Wikipedia URL: Russia Russia , or the Russian Federation , is a country in Eastern Europe and North Asia . It is the largest country in the world , spanning eleven time zones and sharing land borders with fourteen countries . With a population of over 140 million, Russia is the most populous country in Europe and the ninth-most populous in the world . It is a highly urbanised country , with sixteen of its urban areas having more than 1 million inhabitants. Moscow , the most populous metropolitan area in Europe , is the capital and largest city of Russia , while Saint Petersburg is its second-largest city and a major cultural centre . Bronze Age spread of Yamnaya Steppe pastoralist ancestry between 3300 and 1500 BC, including the Afanasievo culture of southern Siberia"}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "floods", "label": "floods", "shape": "dot", "size": 22, "title": "\u003cb\u003efloods\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: floods Wikipedia URL: Floods A flood is an overflow of water ( or rarely other fluids ) that submerges land that is usually dry. In the sense of \"flowing water\", the word may also be applied to the inflow of the tide . Floods are of significant concern in agriculture , civil engineering and public health . Human changes to the environment often increase the intensity and frequency of flooding. Examples for human changes are land use changes such as deforestation and removal of wetlands , changes in waterway course or flood controls such as with levees . Global environmental issues also influence causes of floods, namely climate change which causes an intensification of the water cycle and sea level rise . For example, climate change makes extreme weather events more frequent a"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "developing countries", "label": "developing countries", "shape": "dot", "size": 18, "title": "\u003cb\u003edeveloping countries\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: developing countries Wikipedia URL: Developing countries A developing country is a country with a less-developed industrial base and a lower Human Development Index (HDI) relative to developed countries . However, this definition is not universally agreed upon. There is also no clear agreement on which countries fit this category. The terms low-and middle-income country ( LMIC ) and newly emerging economy ( NEE ) are often used interchangeably but they refer only to the economy of the countries. The World Bank classifies the world\u0027s economies into four groups, based on gross national income per capita: high-, upper-middle-, lower-middle-, and low-income countries. Least developed countries , landlocked developing countries , and small island developing states are all sub-group"}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "biodiversity", "label": "biodiversity", "shape": "dot", "size": 20, "title": "\u003cb\u003ebiodiversity\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: biodiversity Wikipedia URL: Biodiversity Biodiversity is the variability of life on Earth . It can be measured on various levels, for example, genetic variability , species diversity , ecosystem diversity and phylogenetic diversity. Diversity is not distributed evenly on Earth \u2014it is greater in the tropics as a result of the warm climate and high primary productivity in the region near the equator . Tropical forest ecosystems cover less than one-fifth of Earth\u0027s terrestrial area and contain about 50% of the world\u0027s species. There are latitudinal gradients in species diversity for both marine and terrestrial taxa . An example of the biodiversity of fungi in a forest in North Saskatchewan (in this photo, there are also leaf lichens and mosses )."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "coral reefs", "label": "coral reefs", "shape": "dot", "size": 14, "title": "\u003cb\u003ecoral reefs\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: coral reefs Wikipedia URL: Coral reefs A coral reef is an underwater ecosystem characterized by reef-building corals . Reefs are formed of colonies of coral polyps held together by calcium carbonate . Most coral reefs are built from stony corals , whose polyps cluster in groups. Biodiversity in a coral reef"}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "drought", "label": "drought", "shape": "dot", "size": 26, "title": "\u003cb\u003edrought\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: drought Wikipedia URL: Drought A drought is a period of drier-than-normal conditions. A drought can last for days, months or years. Drought often has large impacts on the ecosystems and agriculture of affected regions, and causes harm to the local economy . Annual dry seasons in the tropics significantly increase the chances of a drought developing, with subsequent increased wildfire risks. Heat waves can significantly worsen drought conditions by increasing evapotranspiration . This dries out forests and other vegetation, and increases the amount of fuel for wildfires. Fields outside Benambra , Australia suffering from drought in 2006."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "ecosystem services", "label": "ecosystem services", "shape": "dot", "size": 12, "title": "\u003cb\u003eecosystem services\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: ecosystem services Wikipedia URL: Ecosystem services Ecosystem services are the various benefits that humans derive from ecosystems . The interconnected living and non-living components of the natural environment offer benefits such as pollination of crops, clean air and water, decomposition of wastes, and flood control . An example of an ecosystem service is pollination , here by a honey bee on avocado crop."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "adaptive capacity", "label": "adaptive capacity", "shape": "dot", "size": 14, "title": "\u003cb\u003eadaptive capacity\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: adaptive capacity Wikipedia URL: Adaptive capacity Adaptive capacity relates to the capacity of systems , institutions, humans and other organisms to adjust to potential damage, to take advantage of opportunities, or to respond to consequences. In the context of ecosystems , adaptive capacity is the ability to maintain, recover, or adapt performance and function as climate conditions change. Species \u0027 adaptive capacity is generally characterized by phenotypic plasticity , dispersal ability, and genetic diversity , which are foundational to the species\u0027 ability to acclimate in situ or track suitable climate across the landscape. In the context of coupled socio-ecological social systems, adaptive capacity is commonly associated with the following characteristics: Firstly, the ab"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "women", "label": "women", "shape": "dot", "size": 12, "title": "\u003cb\u003ewomen\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: women Wikipedia URL: Women A woman is an adult female human. Before adulthood, a female child or adolescent is referred to as a girl . A woman"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Republic of Korea", "label": "Republic of Korea", "shape": "dot", "size": 18, "title": "\u003cb\u003eRepublic of Korea\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Republic of Korea Wikipedia URL: Republic of Korea South Korea , officially the Republic of Korea ( ROK ), is a country in East Asia . It constitutes the southern half of the Korean Peninsula and borders North Korea along the Korean Demilitarized Zone , with the Yellow Sea to the west and the Sea of Japan to the east. South Korea claims to be the sole legitimate government of the entire peninsula and adjacent islands . It has a population of about 52 million, of which half live in the Seoul metropolitan area , the ninth most populous metropolitan area in the world , with other major cities being Busan , Daegu , and Incheon . Seokguram Grotto from the Silla era, a UNESCO World Heritage Site"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "resilience", "label": "resilience", "shape": "dot", "size": 12, "title": "\u003cb\u003eresilience\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: resilience Wikipedia URL: Resilience Resilience , resilient , or resiliency may refer to:"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Disaster Risk Reduction", "label": "Disaster Risk Reduction", "shape": "dot", "size": 18, "title": "\u003cb\u003eDisaster Risk Reduction\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Disaster Risk Reduction Wikipedia URL: Disaster Risk Reduction Disaster risk reduction aims to make disasters less likely to happen. The approach, also called DRR or disaster risk management , also aims to make disasters less damaging when they do occur. DRR aims to make communities stronger and better prepared to handle disasters. In technical terms, it aims to make them more resilient or less vulnerable. When DRR is successful, it makes communities less the vulnerable because it mitigates the effects of disasters. This means DRR can make risky events fewer and less severe. Climate change can increase climate hazards . So development efforts often consider DRR and climate change adaptation together. Disaster risk reduction progress score for some countries in 2011. The score "}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Cambridge University Press", "label": "Cambridge University Press", "shape": "dot", "size": 12, "title": "\u003cb\u003eCambridge University Press\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Cambridge University Press Wikipedia URL: Cambridge University Press Cambridge University Press is the university press of the University of Cambridge . Granted a letters patent by King Henry VIII in 1534, it is the oldest university press in the world. Cambridge University Press merged with Cambridge Assessment to form Cambridge University Press and Assessment under Queen Elizabeth II \u0027s approval in August 2021. However, the Press retains an independent existence within the larger entity."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Asian countries", "label": "Asian countries", "shape": "dot", "size": 16, "title": "\u003cb\u003eAsian countries\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Asian countries Wikipedia URL: Asian countries This is a list of sovereign states and dependent territories in Asia . It includes fully recognized states , states with limited but substantial international recognition, de facto states with little or no international recognition, and dependencies of both Asian and non-Asian states. In particular, it lists (i) 49 generally recognized sovereign states , all of which are members of the United Nations ; (ii) two states with substantial but not general international recognition, one of which is a United Nations General Assembly non-member observer state; (iii) three largely unrecognized de facto states; and (iv) six dependent and other territories ."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "migration", "label": "migration", "shape": "dot", "size": 12, "title": "\u003cb\u003emigration\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: migration Wikipedia URL: Migration Migration , migratory , or migrate may refer to:"}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Taiwan", "label": "Taiwan", "shape": "dot", "size": 26, "title": "\u003cb\u003eTaiwan\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Taiwan Wikipedia URL: Taiwan Taiwan , officially the Republic of China ( ROC ), is a country in East Asia . The main island of Taiwan , also known as Formosa , lies between the East and South China Seas in the northwestern Pacific Ocean , with the People\u0027s Republic of China (PRC) to the northwest, Japan to the northeast, and the Philippines to the south. It has an area of 35,808 square kilometres (13,826 square miles), with mountain ranges dominating the eastern two-thirds and plains in the western third, where its highly urbanized population is concentrated. The combined territories under ROC control consist of 168 islands in total covering 36,193 square kilometres (13,974 square miles). The largest metropolitan area is formed by Taipei (the capital), New Taipei City , and Ke"}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Malaysia", "label": "Malaysia", "shape": "dot", "size": 26, "title": "\u003cb\u003eMalaysia\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Malaysia Wikipedia URL: Malaysia Malaysia is a country in Southeast Asia . A federal constitutional monarchy , it consists of 13 states and three federal territories , separated by the South China Sea into two regions: Peninsular Malaysia on the Indochinese Peninsula and East Malaysia on the island of Borneo . Peninsular Malaysia shares land and maritime borders with Thailand , as well as maritime borders with Singapore , Vietnam , and Indonesia ; East Malaysia shares land borders with Brunei and Indonesia, and maritime borders with the Philippines and Vietnam. Kuala Lumpur is the country\u0027s national capital, largest city , and the seat of the legislative branch of the federal government , while Putrajaya is the federal administrative capital, representing the seat of both the "}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "water resources", "label": "water resources", "shape": "dot", "size": 24, "title": "\u003cb\u003ewater resources\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: water resources Wikipedia URL: Water resources Water resources are natural resources of water that are potentially useful for humans, for example as a source of drinking water supply or irrigation water. These resources can be either freshwater from natural sources, or water produced artificially from other sources, such as from reclaimed water ( wastewater ) or desalinated water ( seawater ). 97% of the water on Earth is salt water and only three percent is fresh water ; slightly over two-thirds of this is frozen in glaciers and polar ice caps . The remaining unfrozen freshwater is found mainly as groundwater, with only a small fraction present above ground or in the air. Natural sources of fresh water include frozen water , groundwater , surface water , and under river flow."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "farmers", "label": "farmers", "shape": "dot", "size": 16, "title": "\u003cb\u003efarmers\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: farmers Wikipedia URL: Farmers A farmer is a person engaged in agriculture , raising living organisms for food or raw materials. The term usually applies to people who do some combination of raising field crops , orchards , vineyards , poultry , or other livestock . A farmer might own the farmland or might work as a laborer on land owned by others. In most developed economies , a \"farmer\" is usually a farm owner ( landowner ), while employees of the farm are known as farm workers (or farmhands). However, in other older definitions a farmer was a person who promotes or improves the growth of plants, land, or crops or raises animals (as livestock or fish) by labor and attention."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "fisheries", "label": "fisheries", "shape": "dot", "size": 14, "title": "\u003cb\u003efisheries\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: fisheries Wikipedia URL: Fisheries Fishery can mean either the enterprise of raising or harvesting fish and other aquatic life or, more commonly, the site where such enterprise takes place ( a.k.a. , fishing grounds ). Commercial fisheries include wild fisheries and fish farms , both in freshwater waterbodies (about 10% of all catch) and the oceans (about 90%). About 500 million people worldwide are economically dependent on fisheries. 171 million tonnes of fish were produced in 2016, but overfishing is an increasing problem, causing declines in some populations. Salmon spawn in a salmon fishery within the Becharof Wilderness in Southwest Alaska ."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Asian cities", "label": "Asian cities", "shape": "dot", "size": 12, "title": "\u003cb\u003eAsian cities\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Asian cities Wikipedia URL: Asian cities The page \" Asian cities \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Korea", "label": "Korea", "shape": "dot", "size": 26, "title": "\u003cb\u003eKorea\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Korea Wikipedia URL: Korea Korea is a peninsular region in East Asia consisting of the Korean Peninsula , Jeju Island , and smaller islands. Since the end of World War II in Asia in 1945, it has been politically divided at or near the 38th parallel between North Korea (Democratic People\u0027s Republic of Korea; DPRK) and South Korea (Republic of Korea; ROK). Both countries proclaimed independence in 1948, and the two countries fought the Korean War from 1950 to 1953. The region is bordered by China to the north and Russia to the northeast, across the Amnok (Yalu) and Duman (Tumen) rivers, and is separated from Japan to the southeast by the Korea Strait . 7th century Tang dynasty painting of envoys from the Three Kingdoms of Korea: Baekje, Goguryeo, and Silla"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "World Bank", "label": "World Bank", "shape": "dot", "size": 14, "title": "\u003cb\u003eWorld Bank\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: World Bank Wikipedia URL: World Bank The World Bank Group ( WBG ) is a family of five international organizations that make leveraged loans to developing countries . It is the largest and best-known development bank in the world and an observer at the United Nations Development Group . The bank is headquartered in Washington, D.C. , in the United States . It provided around $98.83 billion in loans and assistance to \"developing\" and transition countries in the 2021 fiscal year. The bank\u0027s stated mission is to achieve the twin goals of ending extreme poverty and building shared prosperity. Total lending as of 2015 for the last 10 years through Development Policy Financing was approximately $117 billion. Its five organizations have been established over time:"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Public Health", "label": "Public Health", "shape": "dot", "size": 14, "title": "\u003cb\u003ePublic Health\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Public Health Wikipedia URL: Public Health Public Health may refer to:"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "extreme events", "label": "extreme events", "shape": "dot", "size": 12, "title": "\u003cb\u003eextreme events\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: extreme events Wikipedia URL: Extreme Events Rare or extreme events are events that occur with low frequency, and often refers to infrequent events that have a widespread effect and which might destabilize systems (for example, stock markets, ocean wave intensity or optical fibers or society). Rare events encompass natural phenomena (major earthquakes, tsunamis, hurricanes, floods, asteroid impacts, solar flares, etc.), anthropogenic hazards ( warfare and related forms of violent conflict, acts of terrorism , industrial accidents, financial and commodity market crashes, etc.), as well as phenomena for which natural and anthropogenic factors interact in complex ways (epidemic disease spread, global warming -related changes in climate and weather, etc.). One way of judging which"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "dust storms", "label": "dust storms", "shape": "dot", "size": 12, "title": "\u003cb\u003edust storms\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: dust storms Wikipedia URL: Dust storms A dust storm , also called a sandstorm , is a meteorological phenomenon common in arid and semi-arid regions. Dust storms arise when a gust front or other strong wind blows loose sand and dirt from a dry surface. Fine particles are transported by saltation and suspension, a process that moves soil from one place and deposits it in another. These storms can reduce visibility, disrupt transportation, and pose serious health risks. Over time, repeated dust storms can reduce agricultural productivity and contribute to desertification. An aerial view of a sandstorm over the Namib Desert"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "governance", "label": "governance", "shape": "dot", "size": 12, "title": "\u003cb\u003egovernance\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: governance Wikipedia URL: Governance Governance is the overall complex system or framework of processes , functions, structures, rules , laws and norms born out of the relationships , interactions , power dynamics and communication within an organized group of individuals. It sets the boundaries of acceptable conduct and practices of different actors of the group and controls their decision-making processes through the creation and enforcement of rules and guidelines. Furthermore, it also manages , allocates and mobilizes relevant resources and capacities of different members and sets the overall direction of the group in order to effectively address its specific collective needs, problems and challenges."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "extreme weather events", "label": "extreme weather events", "shape": "dot", "size": 14, "title": "\u003cb\u003eextreme weather events\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: extreme weather events Wikipedia URL: Extreme weather events Extreme weather includes unexpected, unusual, severe , or unseasonal weather ; weather at the extremes of the historical distribution\u2014the range that has been seen in the past. Extreme events are based on a location\u0027s recorded weather history. The main types of extreme weather include heat waves , cold waves , droughts , and heavy precipitation or storm events, such as tropical cyclones . Extreme weather can have various effects, from natural hazards such as floods and landslides to social costs on human health and the economy. Severe weather is a particular type of extreme weather which poses risks to life and property. A tornado is an example of an extreme weather event."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Indigenous knowledge", "label": "Indigenous knowledge", "shape": "dot", "size": 12, "title": "\u003cb\u003eIndigenous knowledge\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Indigenous knowledge Wikipedia URL: Indigenous knowledge Traditional knowledge ( TK ), indigenous knowledge ( IK ), folk knowledge , and local knowledge generally refers to knowledge systems embedded in the cultural traditions of regional , indigenous , or local communities . Tribal Colleges preserve and pass on both general knowledge and, through employing community Elders, traditional Indigenous knowledge. ( Leech Lake Tribal College , Minnesota)"}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Sri Lanka", "label": "Sri Lanka", "shape": "dot", "size": 24, "title": "\u003cb\u003eSri Lanka\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Sri Lanka Wikipedia URL: Sri Lanka Sri Lanka , officially the Democratic Socialist Republic of Sri Lanka , formerly known as Ceylon , is an island country in South Asia . It is located in the Indian Ocean , southwest of the Bay of Bengal , and is separated from India by the Gulf of Mannar and the Palk Strait . Sri Lanka shares a maritime border with the Maldives to the southwest and India to the northwest, and lies across the Bay of Bengal from Bangladesh and Myanmar to the northeast and the Andaman and Nicobar Islands of India to the east. Its capital is Sri Jayawardenepura Kotte , while Colombo is its largest city and the political, financial and cultural centre. Sri Lanka\u0027s population is 22 million ; with the Sinhalese people , who speak the Sinhala language , forming the v"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "ocean acidification", "label": "ocean acidification", "shape": "dot", "size": 14, "title": "\u003cb\u003eocean acidification\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: ocean acidification Wikipedia URL: Ocean acidification Ocean acidification is the ongoing decrease in the pH of the Earth\u0027s ocean . Between 1950 and 2020, the average pH of the ocean surface fell from approximately 8.15 to 8.05. Carbon dioxide emissions from human activities are the primary cause of ocean acidification, with atmospheric carbon dioxide (CO 2 ) levels exceeding 422 ppm (as of 2024 [update] ). CO 2 from the atmosphere is absorbed by the oceans. This chemical reaction produces carbonic acid ( H 2 CO 3 ) which dissociates into a bicarbonate ion ( HCO \u2212 3 ) and a hydrogen ion ( H + ). The presence of free hydrogen ions ( H + ) lowers the pH of the ocean, increasing acidity (this does not mean that seawater is acidic yet; it is still alkaline , with a pH higher than "}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Myanmar", "label": "Myanmar", "shape": "dot", "size": 26, "title": "\u003cb\u003eMyanmar\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Myanmar Wikipedia URL: Myanmar Myanmar , officially the Republic of the Union of Myanmar and also referred to as Burma (the official English name until 1989), is a country in northwest Southeast Asia . It is the largest country by area in Mainland Southeast Asia and has a population of about 55 million. It is bordered by India and Bangladesh to the northwest, China to the northeast, Laos and Thailand to the east and southeast, and the Andaman Sea and the Bay of Bengal to the south and southwest. The country\u0027s capital city is Naypyidaw , while its largest city is Yangon (formerly Rangoon). Pyu city-states , c. 8th century"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "coastal cities", "label": "coastal cities", "shape": "dot", "size": 12, "title": "\u003cb\u003ecoastal cities\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: coastal cities Wikipedia URL: coastal cities The page \" Coastal cities \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "land use", "label": "land use", "shape": "dot", "size": 20, "title": "\u003cb\u003eland use\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: land use Wikipedia URL: Land use Land use is an umbrella term to describe what happens on a parcel of land . It concerns the benefits derived from using the land, and also the land management actions that humans carry out there. The following categories are used for land use: forest land , cropland ( agricultural land ), grassland , wetlands , settlements and other lands. The way humans use land, and how land use is changing, has many impacts on the environment . Effects of land use choices and changes by humans include, for example, urban sprawl , soil erosion , soil degradation , land degradation and desertification . Land use and land management practices have a major impact on natural resources including water , soil , nutrients , plants and animals . Cumulative CO2 emissi"}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "irrigation", "label": "irrigation", "shape": "dot", "size": 22, "title": "\u003cb\u003eirrigation\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: irrigation Wikipedia URL: Irrigation Irrigation is the practice of applying controlled amounts of water to land to help grow crops , landscape plants , and lawns . Irrigation has been a key aspect of agriculture for over 5,000 years and has been developed by many cultures around the world. Irrigation helps to grow crops, maintain landscapes, and revegetate disturbed soils in dry areas and during times of below-average rainfall. In addition to these uses, irrigation is also employed to protect crops from frost , suppress weed growth in grain fields, and prevent soil consolidation . It is also used to cool livestock , reduce dust , dispose of sewage , and support mining operations. Drainage , which involves the removal of surface and sub-surface water from a given location, is o"}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "water scarcity", "label": "water scarcity", "shape": "dot", "size": 24, "title": "\u003cb\u003ewater scarcity\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: water scarcity Wikipedia URL: Water scarcity Water scarcity (closely related to water stress or water crisis ) is the lack of any, local or economically viably transportable, sources of fresh water resources to meet the standard water demand in a region. There are two types of water scarcity. One is physical. The other is economic water scarcity . Physical water scarcity is where there is not enough water to meet all demands. This includes water needed for ecosystems to function. Regions with a desert climate often face physical water scarcity. Central Asia , West Asia , and North Africa are examples of arid areas. Economic water scarcity results from a lack of investment in infrastructure or technology to draw water from rivers, aquifers , or other water sources. It also resu"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "IPCC", "label": "IPCC", "shape": "dot", "size": 16, "title": "\u003cb\u003eIPCC\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: IPCC Wikipedia URL: IPCC The Intergovernmental Panel on Climate Change ( IPCC ) is an intergovernmental body of the United Nations (UN). Its job is to \"provide governments at all levels with scientific information that they can use to develop climate policies \". The World Meteorological Organization (WMO) and the United Nations Environment Programme (UNEP) set up the IPCC in 1988. The UN endorsed the creation of the IPCC later that year. It has a secretariat in Geneva , Switzerland, hosted by the WMO. It has 195 member states who govern the IPCC. The member states elect a bureau of scientists to serve through an assessment cycle. A cycle is usually six to seven years. The bureau selects experts in their fields to prepare IPCC reports. There is a formal nomination process by go"}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Africa", "label": "Africa", "shape": "dot", "size": 24, "title": "\u003cb\u003eAfrica\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Africa Wikipedia URL: Africa Africa is the world\u0027s second-largest and second-most populous continent after Asia . At about 30.3 million km 2 (11.7 million square miles) including adjacent islands, it covers around 20% of Earth \u0027s land area and 6% of its total surface area. With nearly 1.4 billion people as of 2021, it accounts for about 18% of the world\u0027s human population . Africa\u0027s population is the youngest among all the continents; the median age in 2012 was 19.7, when the worldwide median age was 30.4. Based on 2024 projections, Africa\u0027s population will exceed 3.8 billion people by 2100. Africa is the least wealthy inhabited continent per capita and second-least wealthy by total wealth, ahead of Oceania . Scholars have attributed this to different factors including geograp"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "adaptation costs", "label": "adaptation costs", "shape": "dot", "size": 12, "title": "\u003cb\u003eadaptation costs\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: adaptation costs Wikipedia URL: adaptation costs The page \" Adaptation costs \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "insurance", "label": "insurance", "shape": "dot", "size": 20, "title": "\u003cb\u003einsurance\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: insurance Wikipedia URL: Insurance Insurance is a means of protection from financial loss in which, in exchange for a fee , a party agrees to compensate another party in the event of a certain loss, damage, or injury. It is a form of risk management , primarily used to protect against the risk of a contingent or uncertain loss. An advertisement for a fire insurance company Norwich Union , showing the amount of assets in coverage and paid insurance (1910)"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "IKLK", "label": "IKLK", "shape": "dot", "size": 12, "title": "\u003cb\u003eIKLK\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: IKLK Wikipedia URL: IKLK The page \" IKLK \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "heatwaves", "label": "heatwaves", "shape": "dot", "size": 16, "title": "\u003cb\u003eheatwaves\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: heatwaves Wikipedia URL: Heatwaves A heat wave or heatwave , sometimes described as extreme heat , is a period of abnormally hot weather and natural disaster that lasts for multiple days. A heat wave is usually measured relative to the usual climate in the area and to normal temperatures for the season. The main difficulties with this broad definition emerge when one must quantify what the \u0027normal\u0027 temperature state is, and what the spatial extent of the event may or must be. Temperatures that humans from a hotter climate consider normal can be regarded as a heat wave in a cooler area. This would be the case if the warm temperatures are outside the normal climate pattern for that area. Heat waves have become more frequent, and more intense over land, across almost every area o"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "urban adaptation", "label": "urban adaptation", "shape": "dot", "size": 12, "title": "\u003cb\u003eurban adaptation\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: urban adaptation Wikipedia URL: urban adaptation The page \" Urban adaptation \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "poverty", "label": "poverty", "shape": "dot", "size": 14, "title": "\u003cb\u003epoverty\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: poverty Wikipedia URL: Poverty Poverty is a state or condition in which an individual lacks the financial resources and essentials for a basic standard of living . Poverty can have diverse environmental , legal , social , economic , and political causes and effects. When evaluating poverty in statistics or economics there are two main measures: absolute poverty which compares income against the amount needed to meet basic personal needs , such as food , clothing , and shelter ; secondly, relative poverty measures when a person cannot meet a minimum level of living standards , compared to others in the same time and place. The definition of relative poverty varies from one country to another, or from one society to another. Global income distribution over time. The chart shows "}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "urban areas", "label": "urban areas", "shape": "dot", "size": 18, "title": "\u003cb\u003eurban areas\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: urban areas Wikipedia URL: Urban areas An urban area is a human settlement with a high population density and an infrastructure of built environment . Urban areas originate through urbanization , and researchers categorize them as cities, towns, conurbations or suburbs . In urbanism , the term \"urban area\" contrasts to rural areas such as villages and hamlets ; in urban sociology or urban anthropology , it often contrasts with natural environment . Skyline of Seoul at night"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "tropical cyclones", "label": "tropical cyclones", "shape": "dot", "size": 14, "title": "\u003cb\u003etropical cyclones\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: tropical cyclones Wikipedia URL: Tropical cyclones A tropical cyclone is a rapidly rotating storm system with a low-pressure area , a closed low-level atmospheric circulation , strong winds, and a spiral arrangement of thunderstorms that produce heavy rain and squalls . Depending on its location and strength, a tropical cyclone is called a hurricane ( / \u02c8 h \u028cr \u026a k \u0259n , - k e\u026a n / ), typhoon ( / t a\u026a \u02c8 f u\u02d0 n / ), tropical storm , cyclonic storm , tropical depression , or simply cyclone . A hurricane is a strong tropical cyclone that occurs in the Atlantic Ocean or northeastern Pacific Ocean . A typhoon is the same thing which occurs in the northwestern Pacific Ocean. In the Indian Ocean and South Pacific, comparable storms are referred to as \"tropical cyclones\". In modern time"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "heat stress", "label": "heat stress", "shape": "dot", "size": 12, "title": "\u003cb\u003eheat stress\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: heat stress Wikipedia URL: Heat stress Hyperthermia , also known as overheating , is a condition in which an individual\u0027s body temperature is elevated beyond normal due to failed thermoregulation . The person\u0027s body produces or absorbs more heat than it dissipates. According to the International Emergency Medicine Education Project , severe hyperthermia (body temperature elevation of beyond 40 \u00b0C (104 \u00b0F)) \"becomes a medical emergency requiring immediate treatment to prevent disability or death\". Almost half a million deaths are recorded every year from hyperthermia."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "mortality", "label": "mortality", "shape": "dot", "size": 12, "title": "\u003cb\u003emortality\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: mortality Wikipedia URL: Mortality Mortality may refer to:"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "ecosystems", "label": "ecosystems", "shape": "dot", "size": 14, "title": "\u003cb\u003eecosystems\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: ecosystems Wikipedia URL: Ecosystems An ecosystem (or ecological system ) is a system formed by organisms in interaction with their environment . The biotic and abiotic components are linked together through nutrient cycles and energy flows. Rainforest ecosystems are rich in biodiversity . This is the Gambia River in Senegal \u0027s Niokolo-Koba National Park ."}, {"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "Tibetan Plateau", "label": "Tibetan Plateau", "shape": "dot", "size": 34, "title": "\u003cb\u003eTibetan Plateau\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Tibetan Plateau Wikipedia URL: Tibetan Plateau The Tibetan Plateau , also known as the Qinghai\u2013Tibet Plateau , Qingzang Plateau , or as the Himalayan Plateau , [ better source needed ] is a vast elevated plateau located at the intersection of Central , South , and East Asia . Geographically, it is located to the north of the Himalayas and the Indian subcontinent , and to the south of Tarim Basin and Mongolian Plateau . Geopolitically, it covers most of the Tibet Autonomous Region , most of Qinghai , the western half of Sichuan , Southern Gansu provinces, southern Xinjiang province in Western China , Bhutan , the Indian regions of Ladakh and Lahaul and Spiti ( Himachal Pradesh ) as well as Gilgit-Baltistan in Pakistan , northwestern Nepal , eastern Tajikistan and southern Kyrgy"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "human health", "label": "human health", "shape": "dot", "size": 12, "title": "\u003cb\u003ehuman health\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: human health Wikipedia URL: Human health Health has a variety of definitions, which have been used for different purposes over time. In general, it refers to physical and emotional well-being , especially that associated with normal functioning of the human body , absent of disease , pain (including mental pain ), or injury . Donald Henderson as part of the CDC\u0027s smallpox eradication team in 1966"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "cyclones", "label": "cyclones", "shape": "dot", "size": 12, "title": "\u003cb\u003ecyclones\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: cyclones Wikipedia URL: Cyclones In meteorology , a cyclone ( / \u02c8 s a\u026a . k l o\u028a n / ) is a large air mass that rotates around a strong center of low atmospheric pressure , counterclockwise in the Northern Hemisphere and clockwise in the Southern Hemisphere as viewed from above (opposite to an anticyclone ). Cyclones are characterized by inward-spiraling winds that rotate about a zone of low pressure . An extratropical cyclone near Iceland"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "urbanisation", "label": "urbanisation", "shape": "dot", "size": 12, "title": "\u003cb\u003eurbanisation\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: urbanisation Wikipedia URL: Urbanisation Urbanization (or urbanisation in British English ) is the population shift from rural to urban areas , the corresponding decrease in the proportion of people living in rural areas, and the ways in which societies adapt to this change. It can also mean population growth in urban areas instead of rural ones. It is predominantly the process by which towns and cities are formed and become larger as more people begin to live and work in central areas. Global urbanization map showing the percentage of urbanization and the biggest global population centres per country in 2018, based on UN estimates."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Disaster Risk Reduct", "label": "Disaster Risk Reduct", "shape": "dot", "size": 12, "title": "\u003cb\u003eDisaster Risk Reduct\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Disaster Risk Reduct Wikipedia URL: Disaster Risk Reduct The page \" Disaster Risk Reduct \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Climatol", "label": "Climatol", "shape": "dot", "size": 12, "title": "\u003cb\u003eClimatol\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Climatol Wikipedia URL: Climatol The page \" Climatol \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "food production", "label": "food production", "shape": "dot", "size": 16, "title": "\u003cb\u003efood production\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: food production Wikipedia URL: Food production The food industry is a complex, global network of diverse businesses that supplies most of the food consumed by the world\u0027s population . The food industry today has become highly diversified, with manufacturing ranging from small, traditional, family-run activities that are highly labour-intensive, to large, capital-intensive and highly mechanized industrial processes. Many food industries depend almost entirely on local agriculture , animal farms , produce , and/or fishing . Packaged food aisles at an American grocery store"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "aquaculture", "label": "aquaculture", "shape": "dot", "size": 18, "title": "\u003cb\u003eaquaculture\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: aquaculture Wikipedia URL: Aquaculture Aquaculture (less commonly spelled aquiculture ), also known as aquafarming , is the controlled cultivation (\"farming\") of aquatic organisms such as fish , crustaceans , mollusks , algae and other organisms of value such as aquatic plants (e.g. lotus ). Aquaculture involves cultivating freshwater , brackish water , and saltwater populations under controlled or semi-natural conditions and can be contrasted with commercial fishing , which is the harvesting of wild fish . Aquaculture is also a practice used for restoring and rehabilitating marine and freshwater ecosystems. Mariculture , commonly known as marine farming, is aquaculture in seawater habitats and lagoons, as opposed to freshwater aquaculture. Pisciculture is a type of aquacultur"}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Cambodia", "label": "Cambodia", "shape": "dot", "size": 20, "title": "\u003cb\u003eCambodia\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Cambodia Wikipedia URL: Cambodia Cambodia , officially the Kingdom of Cambodia , is a country in Mainland Southeast Asia . It is bordered by Thailand to the northwest, Laos to the north, and Vietnam to the east, and has a coastline along the Gulf of Thailand in the southwest. It spans an area of 181,035 square kilometres (69,898 square miles ), dominated by a low-lying plain and the confluence of the Mekong river and Tonl\u00e9 Sap , Southeast Asia \u0027s largest lake. It is dominated by a tropical climate . Cambodia has a population of about 17 million people, the majority of which are ethnically Khmer . Its capital and most populous city is Phnom Penh , followed by Siem Reap and Battambang . Glazed stoneware dating back to the 12th century"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "modelling", "label": "modelling", "shape": "dot", "size": 12, "title": "\u003cb\u003emodelling\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: modelling Wikipedia URL: Modelling A model is an informative representation of an object, person, or system. The term originally denoted the plans of a building in late 16th-century English, and derived via French and Italian ultimately from Latin modulus , \u0027 a measure \u0027 . Model of a molecule, with coloured balls representing different atoms"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "permafrost", "label": "permafrost", "shape": "dot", "size": 12, "title": "\u003cb\u003epermafrost\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: permafrost Wikipedia URL: Permafrost Permafrost (from perma- \u0027 permanent \u0027 and frost ) is soil or underwater sediment which continuously remains below 0 \u00b0C (32 \u00b0F) for two years or more; the oldest permafrost has been continuously frozen for around 700,000 years. Whilst the shallowest permafrost has a vertical extent of below a meter (3 ft), the deepest is greater than 1,500 m (4,900 ft). Similarly, the area of individual permafrost zones may be limited to narrow mountain summits or extend across vast Arctic regions. The ground beneath glaciers and ice sheets is not usually defined as permafrost, so on land, permafrost is generally located beneath a so-called active layer of soil which freezes and thaws depending on the season."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "South China Sea", "label": "South China Sea", "shape": "dot", "size": 22, "title": "\u003cb\u003eSouth China Sea\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: South China Sea Wikipedia URL: South China Sea The South China Sea is a marginal sea of the Western Pacific Ocean . It is bounded in the north by South China , in the west by the Indochinese Peninsula , in the east by the islands of Taiwan and northwestern Philippines (mainly Luzon , Mindoro , and Palawan ), and in the south by Borneo , eastern Sumatra , and the Bangka Belitung Islands , encompassing an area of around 3,500,000 km 2 (1,400,000 sq mi). It communicates with the East China Sea via the Taiwan Strait , the Philippine Sea via the Luzon Strait , the Sulu Sea via the straits around Palawan , the Java Sea via the Karimata and Bangka Straits , and directly with the Gulf of Thailand . Additionally, the Gulf of Tonkin is part of the South China Sea. Sunset on the South Ch"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "HKH region", "label": "HKH region", "shape": "dot", "size": 12, "title": "\u003cb\u003eHKH region\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: HKH region Wikipedia URL: HKH region The page \" HKH region \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "children", "label": "children", "shape": "dot", "size": 12, "title": "\u003cb\u003echildren\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: children Wikipedia URL: Children A child ( pl. children ) is a human being between the stages of birth and puberty , or between the developmental period of infancy and puberty. The term may also refer to an unborn human being. In English-speaking countries, the legal definition of child generally refers to a minor , in this case as a person younger than the local age of majority (there are exceptions such as, for example, the consumption and purchase of alcoholic beverages even after said age of majority), regardless of their physical, mental and sexual development as biological adults . Children generally have fewer rights and responsibilities than adults. They are generally classed as unable to make serious decisions. International children in traditional clothing at Liberty"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Islam", "label": "Islam", "shape": "dot", "size": 16, "title": "\u003cb\u003eIslam\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Islam Wikipedia URL: Islam Islam is an Abrahamic monotheistic religion based on the Quran and the teachings of Muhammad . The religion\u0027s adherents, called Muslims , are estimated to number 2 billion worldwide and are the world\u0027s second-largest religious population , after Christians ."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "PLoS ONE", "label": "PLoS ONE", "shape": "dot", "size": 12, "title": "\u003cb\u003ePLoS ONE\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: PLoS ONE Wikipedia URL: PLoS ONE PLOS One (stylized PLOS ONE , and formerly PLoS ONE ) is a peer-reviewed open access mega journal published by the Public Library of Science (PLOS) since 2006. The journal covers primary research from any discipline within science and medicine . The Public Library of Science began in 2000 with an online petition initiative by Nobel Prize winner Harold Varmus , formerly director of the National Institutes of Health and at that time director of Memorial Sloan\u2013Kettering Cancer Center ; Patrick O. Brown , a biochemist at Stanford University; and Michael Eisen , a computational biologist at the University of California, Berkeley , and the Lawrence Berkeley National Laboratory ."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Water Resour", "label": "Water Resour", "shape": "dot", "size": 12, "title": "\u003cb\u003eWater Resour\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Water Resour Wikipedia URL: Water Resour The page \" Water Resour \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "population growth", "label": "population growth", "shape": "dot", "size": 14, "title": "\u003cb\u003epopulation growth\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: population growth Wikipedia URL: Population growth Population growth is the increase in the number of people in a population or dispersed group. The global population has grown from 1 billion in 1800 to 8.2 billion in 2025. Actual global human population growth amounts to around 70 million annually, or 0.85% per year. As of 2024, The United Nations projects that global population will peak in the mid-2080s at around 10.3 billion. The UN\u0027s estimates have decreased strongly in recent years due to sharp declines in global birth rates. Others have challenged many recent population projections as having underestimated population growth."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "sea level rise", "label": "sea level rise", "shape": "dot", "size": 24, "title": "\u003cb\u003esea level rise\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: sea level rise Wikipedia URL: Sea level rise The sea level has been rising since the end of the Last Glacial Maximum , which was around 20,000 years ago. Between 1901 and 2018, the average sea level rose by 15\u201325 cm (6\u201310 in), with an increase of 2.3 mm (0.091 in) per year since the 1970s. This was faster than the sea level had ever risen ov
