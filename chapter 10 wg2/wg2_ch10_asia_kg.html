": 16, "title": "\u003cb\u003ecoastal protection\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: coastal protection Wikipedia URL: Coastal protection Coastal management is defence against flooding and erosion , and techniques that stop erosion to claim lands. Protection against rising sea levels in the 21st century is crucial, as sea level rise accelerates due to climate change . Changes in sea level damage beaches and coastal systems are expected to rise at an increasing rate throughout the century, causing coastal sediments to be disturbed by tidal energy. Oosterscheldekering sea wall, the Netherlands."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "rural areas", "label": "rural areas", "shape": "dot", "size": 16, "title": "\u003cb\u003erural areas\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: rural areas Wikipedia URL: Rural areas In general, a rural area or a countryside is a geographic area that is located outside towns and cities . Typical rural areas have a low population density and small settlements. Agricultural areas and areas with forestry are typically described as rural, as well as other areas lacking substantial development. Different countries have varying definitions of rural for statistical and administrative purposes. Barossa Valley in South Australia , noted for its vineyards"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "rural households", "label": "rural households", "shape": "dot", "size": 12, "title": "\u003cb\u003erural households\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: rural households Wikipedia URL: rural households The page \" Rural households \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Syria", "label": "Syria", "shape": "dot", "size": 20, "title": "\u003cb\u003eSyria\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Syria Wikipedia URL: Syria Syria , officially the Syrian Arab Republic , is a country in West Asia located in the Eastern Mediterranean and the Levant . It borders the Mediterranean Sea to the west, Turkey to the north and northwest , Iraq to the east and southeast , Jordan to the south , and Israel and Lebanon to the southwest . It is a republic under a provisional government and comprises 14 governorates . Damascus is the capital and largest city. With a population of 26 million across an area of 185,180 square kilometres (71,500 sq mi), it is the 56th-most populous and 87th-largest country. Reconstructed sculpture of a bird from Tell Halaf"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Lebanon", "label": "Lebanon", "shape": "dot", "size": 18, "title": "\u003cb\u003eLebanon\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Lebanon Wikipedia URL: Lebanon Lebanon , officially the Lebanese Republic , is a country in the Levant region of West Asia . Situated at the crossroads of the Mediterranean Basin and the Arabian Peninsula , it is bordered by Syria to the north and east, Israel to the south, and the Mediterranean Sea to the west; Cyprus lies a short distance from the coastline. Lebanon has a population of more than five million and an area of 10,452 square kilometres (4,036 sq mi). Beirut is the country\u0027s capital and largest city."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "renewable energy", "label": "renewable energy", "shape": "dot", "size": 16, "title": "\u003cb\u003erenewable energy\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: renewable energy Wikipedia URL: Renewable energy Renewable energy (also called green energy ) is energy made from renewable natural resources that are replenished on a human timescale . The most widely used renewable energy types are solar energy , wind power , and hydropower . Bioenergy and geothermal power are also significant in some countries. Renewable energy installations can be large or small and are suited for both urban and rural areas. Renewable energy is often deployed together with further electrification . This has several benefits: electricity can move heat and vehicles efficiently and is clean at the point of consumption. Variable renewable energy sources are those that have a fluctuating nature, such as wind power and solar power. In contrast, controllable rene"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "wind speed", "label": "wind speed", "shape": "dot", "size": 12, "title": "\u003cb\u003ewind speed\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: wind speed Wikipedia URL: Wind speed In meteorology , wind speed , or wind flow speed , is a fundamental atmospheric quantity caused by air moving from high to low pressure , usually due to changes in temperature. Wind speed is now commonly measured with an anemometer . An anemometer is commonly used to measure wind speed."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "developing Asia", "label": "developing Asia", "shape": "dot", "size": 12, "title": "\u003cb\u003edeveloping Asia\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: developing Asia Wikipedia URL: developing Asia The page \" Developing Asia \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "conflict", "label": "conflict", "shape": "dot", "size": 12, "title": "\u003cb\u003econflict\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: conflict Wikipedia URL: Conflict Conflict may refer to:"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "medium evidence", "label": "medium evidence", "shape": "dot", "size": 12, "title": "\u003cb\u003emedium evidence\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: medium evidence Wikipedia URL: medium evidence The page \" Medium evidence \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Kyrgyzstan", "label": "Kyrgyzstan", "shape": "dot", "size": 26, "title": "\u003cb\u003eKyrgyzstan\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Kyrgyzstan Wikipedia URL: Kyrgyzstan Kyrgyzstan , officially the Kyrgyz Republic , is a landlocked country in the eastern regions of Central Asia , lying in the Tian Shan and Pamir mountain ranges. It is bordered by Kazakhstan to the north , Uzbekistan to the west , Tajikistan to the south , and China to the east and southeast . Kyrgyzstan\u0027s capital and largest city is Bishkek which lies on the northern border with Kazakhstan. Ethnic Kyrgyz make up the majority of the country\u0027s over 7 million people, followed by significant minorities of Uzbeks and Russians . Tian Shan Mountains in East Kyrgyzstan"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "education", "label": "education", "shape": "dot", "size": 12, "title": "\u003cb\u003eeducation\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: education Wikipedia URL: Education Education is the transmission of knowledge and skills and the development of character traits . Formal education happens in a complex institutional framework, like public schools . Non-formal education is also structured but takes place outside the formal schooling system, while informal education is unstructured learning through daily experiences. Formal and non-formal education are divided into levels that include early childhood education , primary education , secondary education , and tertiary education . Other classifications focus on the teaching method, like teacher-centered and student-centered education , and on the subject, like science education , language education , and physical education . The term \"education\" can also refer to "}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Asia Pacific region", "label": "Asia Pacific region", "shape": "dot", "size": 24, "title": "\u003cb\u003eAsia Pacific region\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Asia Pacific region Wikipedia URL: Asia Pacific region The Asia-Pacific ( APAC ), also known as the Indo-Pacific , is a major geopolitical and economic region of the world adjoining the western Pacific Ocean and comprising the part of the Old World located outside the EMEA region. The region\u0027s precise boundaries vary depending on context, but countries and territories in the Far East ( East Asia , North Asia , and Southeast Asia ) and Oceania are often included while countries in South Asia are also sometimes included. In a wider context, even countries and territories in Central Asia , West Asia and the Pacific-adjoining countries in the Americas can be included. For example, the Asia-Pacific Economic Cooperation (APEC) includes five economies ( Canada , Chile , Mexico , Peru"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "boreal forest", "label": "boreal forest", "shape": "dot", "size": 12, "title": "\u003cb\u003eboreal forest\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: boreal forest Wikipedia URL: Boreal forest Taiga or tayga ( / \u02c8 t a\u026a \u0261 \u0259 / TY -g\u0259 ; Russian : \u0442\u0430\u0439\u0433\u0430\u0301 , IPA: [t\u0250j\u02c8\u0261a] ), also known as boreal forest or snow forest , is a biome characterized by coniferous forests consisting mostly of pines , spruces , and larches ."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Russian Far East", "label": "Russian Far East", "shape": "dot", "size": 26, "title": "\u003cb\u003eRussian Far East\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Russian Far East Wikipedia URL: Russian Far East The Russian Far East (Russian: \u0414\u0430\u043b\u044c\u043d\u0438\u0439 \u0412\u043e\u0441\u0442\u043e\u043a \u0420\u043e\u0441\u0441\u0438\u0438 , IPA: [\u02c8dal\u02b2n\u02b2\u026aj v\u0250\u02c8stok r\u0250\u02c8s\u02b2i\u026a] ) is a region in North Asia . It is the easternmost part of Russia and the Asian continent , and is coextensive with the Far Eastern Federal District , which encompasses the area between Lake Baikal and the Pacific Ocean . The area\u0027s largest city is Khabarovsk , followed by Vladivostok . The region shares land borders with the countries of Mongolia , China , and North Korea to its south, as well as maritime boundaries with Japan to its southeast, and with the United States along the Bering Strait to its northeast."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "forest fires", "label": "forest fires", "shape": "dot", "size": 12, "title": "\u003cb\u003eforest fires\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: forest fires Wikipedia URL: Forest fires A wildfire , forest fire , or a bushfire is an unplanned and uncontrolled fire in an area of combustible vegetation . Some natural forest ecosystems depend on wildfire . Modern forest management often engages in prescribed burns to mitigate fire risk and promote natural forest cycles. However, controlled burns can turn into wildfires by mistake. Wildfire burning in the Kaibab National Forest , Arizona , United States, in 2020. The Mangum Fire burned more than 70,000 acres (280 km 2 ) of forest ."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "productivity", "label": "productivity", "shape": "dot", "size": 14, "title": "\u003cb\u003eproductivity\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: productivity Wikipedia URL: Productivity Prescriptive and policy Labour productivity levels in 2012 in Europe. OECD"}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "pine wilt disease", "label": "pine wilt disease", "shape": "dot", "size": 22, "title": "\u003cb\u003epine wilt disease\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: pine wilt disease Wikipedia URL: Pine wilt disease Bursaphelenchus xylophilus , commonly known as pine wood nematode or pine wilt nematode (PWN), is a species of nematode that infects trees in the Pinus genus of coniferous trees and causes the disease pine wilt . While native to North America, it spread in the early 20th century to Japan and in the latter half of the century to other areas of Asia , including China , Taiwan , and Korea , as well as to Europe , including Portugal and Spain ."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "human activities", "label": "human activities", "shape": "dot", "size": 12, "title": "\u003cb\u003ehuman activities\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: human activities Wikipedia URL: Human activities 1800s: Martineau \u00b7 Tocqueville \u00b7 Marx \u00b7 Spencer \u00b7 Le Bon \u00b7 Ward \u00b7 Pareto \u00b7 T\u00f6nnies \u00b7 Veblen \u00b7 Simmel \u00b7 Durkheim \u00b7 Addams \u00b7 Mead \u00b7 Weber \u00b7 Du Bois \u00b7 Mannheim \u00b7 Elias Social interaction and creative expression are forms of human behavior"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "coastal communities", "label": "coastal communities", "shape": "dot", "size": 12, "title": "\u003cb\u003ecoastal communities\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: coastal communities Wikipedia URL: coastal communities The page \" Coastal communities \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "groundwater", "label": "groundwater", "shape": "dot", "size": 20, "title": "\u003cb\u003egroundwater\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: groundwater Wikipedia URL: Groundwater Groundwater is the water present beneath Earth \u0027s surface in rock and soil pore spaces and in the fractures of rock formations . About 30 percent of all readily available fresh water in the world is groundwater. A unit of rock or an unconsolidated deposit is called an aquifer when it can yield a usable quantity of water. The depth at which soil pore spaces or fractures and voids in rock become completely saturated with water is called the water table . Groundwater is recharged from the surface; it may discharge from the surface naturally at springs and seeps , and can form oases or wetlands . Groundwater is also often withdrawn for agricultural, municipal, and industrial use by constructing and operating extraction wells . The study of th"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "water availability", "label": "water availability", "shape": "dot", "size": 12, "title": "\u003cb\u003ewater availability\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: water availability Wikipedia URL: Water availability Water availability may refer to:"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Mekong Delta", "label": "Mekong Delta", "shape": "dot", "size": 14, "title": "\u003cb\u003eMekong Delta\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Mekong Delta Wikipedia URL: Mekong Delta The Mekong Delta ( Vietnamese : \u0110\u1ed3ng b\u1eb1ng S\u00f4ng C\u1eedu Long , lit. \u0027 Nine Dragon River Delta \u0027 or simply \u0110\u1ed3ng B\u1eb1ng S\u00f4ng M\u00ea K\u00f4ng , \u0027 Mekong River Delta \u0027 ), also known as the South-western Region (Vietnamese: T\u00e2y Nam B\u1ed9 ) or the Western Region (Vietnamese: Mi\u1ec1n T\u00e2y ), is the region in southwestern Vietnam where the Mekong River approaches and empties into the sea through a network of distributaries . The Mekong delta region encompasses a large portion of south-western Vietnam , of an area of over 40,500 km 2 (15,600 sq mi). The size of the area covered by water depends on the season. Its wet coastal geography makes it an important source of agriculture and aquaculture for the country."}, {"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "water", "label": "water", "shape": "dot", "size": 28, "title": "\u003cb\u003ewater\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: water Wikipedia URL: Water Water is an inorganic compound with the chemical formula H 2 O . It is a transparent, tasteless, odorless, and nearly colorless chemical substance . It is the main constituent of Earth\u0027s streams , lakes , and oceans and the fluids of all known living organisms, in which it acts as a solvent . Water, being a polar molecule, undergoes strong intermolecular hydrogen bonding which is a large contributor to its physical and chemical properties. It is vital for all known forms of life, despite not providing food energy or being an organic micronutrient . Due to its presence in all organisms, its chemical stability, its worldwide abundance, and its strong polarity relative to its small molecular size, water is often referred to as the \"universal solvent\"."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "economic development", "label": "economic development", "shape": "dot", "size": 16, "title": "\u003cb\u003eeconomic development\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: economic development Wikipedia URL: Economic development Prescriptive and policy"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "adaptation strategies", "label": "adaptation strategies", "shape": "dot", "size": 12, "title": "\u003cb\u003eadaptation strategies\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: adaptation strategies Wikipedia URL: adaptation strategies The page \" Adaptation strategies \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "drought risk", "label": "drought risk", "shape": "dot", "size": 12, "title": "\u003cb\u003edrought risk\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: drought risk Wikipedia URL: drought risk The page \" Drought risk \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Early warning systems", "label": "Early warning systems", "shape": "dot", "size": 12, "title": "\u003cb\u003eEarly warning systems\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Early warning systems Wikipedia URL: Early warning systems An early warning system is a warning system that can be implemented as a chain of information communication systems and comprises sensors , event detection and decision subsystems for early identification of hazards. They work together to forecast and signal disturbances that adversely affect the stability of the physical world, providing time for the response system to prepare for the adverse event and to minimize its impact. A HSS Engineering TWS 295 electronic Civil Defense siren."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "permeability", "label": "permeability", "shape": "dot", "size": 12, "title": "\u003cb\u003epermeability\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: permeability Wikipedia URL: Permeability Permeability , permeable , and semipermeable may refer to:"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "climatic risks", "label": "climatic risks", "shape": "dot", "size": 12, "title": "\u003cb\u003eclimatic risks\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: climatic risks Wikipedia URL: climatic risks The page \" Climatic risks \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Chinese cities", "label": "Chinese cities", "shape": "dot", "size": 16, "title": "\u003cb\u003eChinese cities\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Chinese cities Wikipedia URL: Chinese cities According to the administrative divisions of the People\u0027s Republic of China , there are three levels of cities: provincial-level cities (consisting of directly-administered municipalities and the special administrative regions of Hong Kong and Macau ), prefecture-level cities , and county-level cities . As of January 2024, the PRC has a total of 707 cities: 4 municipalities, 2 SARs, 293 prefecture-level cities (including the 15 sub-provincial cities ) and 408 county-level cities (including the 38 sub-prefectural cities and 12 XXPC cities). This list does not include any cities in the disputed Taiwan Province and portions of Fujian Province , which are claimed by the PRC under the One China Policy , as these areas are controlled by t"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "forest governance", "label": "forest governance", "shape": "dot", "size": 12, "title": "\u003cb\u003eforest governance\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: forest governance Wikipedia URL: Forest governance Forest management is a branch of forestry concerned with overall administrative, legal, economic, and social aspects, as well as scientific and technical aspects, such as silviculture , forest protection , and regulation. This includes management for timber, aesthetics , recreation , urban values, water , wildlife , inland and nearshore fisheries, wood products , plant genetic resources , and other forest resource values . Management objectives can be for conservation, utilisation, or a mixture of the two. Techniques include timber extraction, planting and replanting of different species , building and maintenance of roads and pathways through forests, and preventing fire . Sustainable forest management balances local socioeco"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "knowledge gaps", "label": "knowledge gaps", "shape": "dot", "size": 12, "title": "\u003cb\u003eknowledge gaps\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: knowledge gaps Wikipedia URL: knowledge gaps The page \" Knowledge gaps \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "South Africa", "label": "South Africa", "shape": "dot", "size": 20, "title": "\u003cb\u003eSouth Africa\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: South Africa Wikipedia URL: South Africa South Africa , officially the Republic of South Africa ( RSA ), is the southernmost country in Africa . Its nine provinces are bounded to the south by 2,798 kilometres (1,739 miles) of coastline that stretches along the South Atlantic and Indian Ocean ; to the north by the neighbouring countries of Namibia , Botswana , and Zimbabwe ; to the east and northeast by Mozambique and Eswatini ; and it encloses Lesotho . Covering an area of 1,221,037 square kilometres (471,445 square miles), the country has a population of over 63 million people, making it the sixth-most populated country in Africa. Pretoria is the administrative capital, while Cape Town , as the seat of Parliament , is the legislative capital, and Bloemfontein is regarded as t"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Asian Development Bank", "label": "Asian Development Bank", "shape": "dot", "size": 16, "title": "\u003cb\u003eAsian Development Bank\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Asian Development Bank Wikipedia URL: Asian Development Bank The Asian Development Bank ( ADB ) is a regional development bank to promote social and economic development in Asia. The bank is headquartered in the city of Mandaluyong , in Metro Manila , Philippines, and maintains 31 field offices around the world."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Maldives", "label": "Maldives", "shape": "dot", "size": 22, "title": "\u003cb\u003eMaldives\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Maldives Wikipedia URL: Maldives Maldives , officially the Republic of Maldives , and historically known as the Maldive Islands , is an archipelagic country in South Asia , located in the eastern Arabian Sea , within the northern Indian Ocean . Maldives is southwest of Sri Lanka and India , about 750 kilometres (470 miles; 400 nautical miles) from the Asian continent\u0027s mainland. Maldives\u0027 chain of 26 atolls stretches across the equator from Ihavandhippolhu Atoll in the north to Addu Atoll in the south. Isdhoo L\u014dm\u0101f\u0101nu is the oldest copper-plate book to have been discovered in Maldives to date. The book was written in 1194 CE (590 AH) in the Ev\u0113la form of the Divehi akuru , during the reign of Siri Fennaadheettha Mahaa Radun (Dhinei Kalaminja) ."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Twitter", "label": "Twitter", "shape": "dot", "size": 14, "title": "\u003cb\u003eTwitter\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Twitter Wikipedia URL: Twitter X , formerly known as Twitter , is an American microblogging and social networking service . It is one of the world\u0027s largest social media platforms and one of the most-visited websites . Users can share short text messages , images, and videos in short posts (commonly and unofficially known as \" tweets \") and like other users\u0027 content. The platform also includes direct messaging , video and audio calling, bookmarks, lists, communities, Grok chatbot integration, job search, and a social audio feature (X Spaces). Users can vote on context added by approved users using the Community Notes feature."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "crop insurance", "label": "crop insurance", "shape": "dot", "size": 14, "title": "\u003cb\u003ecrop insurance\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: crop insurance Wikipedia URL: Crop insurance Crop insurance is insurance purchased by agricultural producers and subsidized by a country\u0027s government to protect against either the loss of their crops due to natural disasters , such as hail, drought, and floods (\"crop-yield insurance\"), or the loss of revenue due to declines in the prices of agricultural commodities (\"crop-revenue insurance\")."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "outheast Asia", "label": "outheast Asia", "shape": "dot", "size": 12, "title": "\u003cb\u003eoutheast Asia\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: outheast Asia Wikipedia URL: outheast Asia The page \" Outheast Asia \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search result below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "adaptation finance", "label": "adaptation finance", "shape": "dot", "size": 12, "title": "\u003cb\u003eadaptation finance\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: adaptation finance Wikipedia URL: adaptation finance The page \" Adaptation finance \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "CRDPs", "label": "CRDPs", "shape": "dot", "size": 12, "title": "\u003cb\u003eCRDPs\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: CRDPs Wikipedia URL: CRDPs The page \" CRDPs \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "terrestrial ecosystems", "label": "terrestrial ecosystems", "shape": "dot", "size": 14, "title": "\u003cb\u003eterrestrial ecosystems\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: terrestrial ecosystems Wikipedia URL: Terrestrial ecosystems Terrestrial ecosystems are ecosystems that are found on land. Examples include tundra , taiga , temperate deciduous forest , tropical rain forest , grassland , deserts ."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Northeast Asia", "label": "Northeast Asia", "shape": "dot", "size": 14, "title": "\u003cb\u003eNortheast Asia\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Northeast Asia Wikipedia URL: Northeast Asia Northeast Asia , sometimes called Northeastern Asia or Northeast Eurasia , is a geographical subregion of Asia . Its northeastern landmass and islands are bounded by the North Pacific Ocean ."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "global greenhouse gas emission pathways", "label": "global greenhouse gas emission pathways", "shape": "dot", "size": 12, "title": "\u003cb\u003eglobal greenhouse gas emission pathways\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: global greenhouse gas emission pathways Wikipedia URL: global greenhouse gas emission pathways The page \" Global greenhouse gas emission pathways \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Urban Plan", "label": "Urban Plan", "shape": "dot", "size": 16, "title": "\u003cb\u003eUrban Plan\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Urban Plan Wikipedia URL: Urban plan Urban planning (also called city planning or town planning in some contexts) is the process of developing and designing land use and the built environment, including air, water, and the infrastructure passing into and out of urban areas , such as transportation , communications , and distribution networks , and their accessibility . Traditionally, urban planning followed a top-down approach in master planning the physical layout of human settlements . The primary concern was the public welfare , which included considerations of efficiency, sanitation , protection and use of the environment, as well as taking account of effects of the master plans on the social and economic activities. Over time, urban planning has adopted a focus on the soc"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Biodivers", "label": "Biodivers", "shape": "dot", "size": 12, "title": "\u003cb\u003eBiodivers\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Biodivers Wikipedia URL: Biodivers The page \" Biodivers \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "permafrost thawing", "label": "permafrost thawing", "shape": "dot", "size": 12, "title": "\u003cb\u003epermafrost thawing\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: permafrost thawing Wikipedia URL: permafrost thawing The page \" Permafrost thawing \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "drought stress", "label": "drought stress", "shape": "dot", "size": 16, "title": "\u003cb\u003edrought stress\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: drought stress Wikipedia URL: Drought stress In botany, drought tolerance is the ability by which a plant maintains its biomass production during arid or drought conditions. Some plants are naturally adapted to dry conditions , surviving with protection mechanisms such as desiccation tolerance , detoxification , or repair of xylem embolism. Other plants, specifically crops like corn , wheat , and rice , have become increasingly tolerant to drought with new varieties created via genetic engineering . From an evolutionary perspective, the type of mycorrhizal associations formed in the roots of plants can determine how fast plants can adapt to drought. Abiotic stresses (such as drought) induce the expression of the following transcription factors. They bind to cis-elements, resul"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "lightning", "label": "lightning", "shape": "dot", "size": 12, "title": "\u003cb\u003elightning\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: lightning Wikipedia URL: Lightning Lightning is a natural phenomenon consisting of electrostatic discharges occurring through the atmosphere between two electrically charged regions. One or both regions are within the atmosphere, with the second region sometimes occurring on the ground . Following the lightning, the regions become partially or wholly electrically neutralized. Strokes of cloud-to-ground lightning strike the Mediterranean Sea off of Port-la-Nouvelle in southern France."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "spatial distribution", "label": "spatial distribution", "shape": "dot", "size": 12, "title": "\u003cb\u003espatial distribution\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: spatial distribution Wikipedia URL: Spatial distribution A spatial distribution in statistics is the arrangement of a phenomenon across the Earth\u0027s surface and a graphical display of such an arrangement is an important tool in geographical and environmental statistics . A graphical display of a spatial distribution may summarize raw data directly or may reflect the outcome of a more sophisticated data analysis . Many different aspects of a phenomenon can be shown in a single graphical display by using a suitable choice of different colours to represent differences. The curve above expresses the slope of the seismic intensity as a function of the distance from the epicenter, R 2 =0.26 . When in a certain methodology the influence of the geological structure variable of each obs"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "mountain treeline", "label": "mountain treeline", "shape": "dot", "size": 12, "title": "\u003cb\u003emountain treeline\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: mountain treeline Wikipedia URL: mountain treeline The page \" Mountain treeline \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "IPCC AR5", "label": "IPCC AR5", "shape": "dot", "size": 14, "title": "\u003cb\u003eIPCC AR5\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: IPCC AR5 Wikipedia URL: IPCC AR5 The Fifth Assessment Report ( AR5 ) of the United Nations Intergovernmental Panel on Climate Change (IPCC) is the fifth in a series of such reports and was completed in 2014. As had been the case in the past, the outline of the AR5 was developed through a scoping process which involved climate change experts from all relevant disciplines and users of IPCC reports, in particular representatives from governments. Governments and organizations involved in the Fourth Report were asked to submit comments and observations in writing with the submissions analysed by the panel. Projections in AR5 are based on \" Representative Concentration Pathways \" (RCPs). The RCPs are consistent with a wide range of possible changes in future anthropogenic greenhous"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "typhoons", "label": "typhoons", "shape": "dot", "size": 16, "title": "\u003cb\u003etyphoons\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: typhoons Wikipedia URL: Typhoons A typhoon is a tropical cyclone that develops between 180\u00b0 and 100\u00b0E in the Northern Hemisphere and which produces sustained hurricane-force winds of at least 119 km/h (74 mph). This region is referred to as the Northwestern Pacific Basin , accounting for almost one third of the world\u0027s tropical cyclones. For organizational purposes, the northern Pacific Ocean is divided into three regions: the eastern (North America to 140\u00b0W ), central (140\u00b0W to 180\u00b0), and western (180\u00b0 to 100\u00b0E). The Regional Specialized Meteorological Center (RSMC) for tropical cyclone forecasts is in Japan , with other tropical cyclone warning centres for the northwest Pacific in Hawaii (the Joint Typhoon Warning Center ), the Philippines , and Hong Kong . Although the RSMC"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "urban", "label": "urban", "shape": "dot", "size": 12, "title": "\u003cb\u003eurban\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: urban Wikipedia URL: Urban Urban means \"related to a city\". In that sense, the term may refer to:"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "adaptation interventions", "label": "adaptation interventions", "shape": "dot", "size": 12, "title": "\u003cb\u003eadaptation interventions\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: adaptation interventions Wikipedia URL: adaptation interventions The page \" Adaptation interventions \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "mental disorders", "label": "mental disorders", "shape": "dot", "size": 12, "title": "\u003cb\u003emental disorders\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: mental disorders Wikipedia URL: Mental disorders A mental disorder , also referred to as a mental illness , a mental health condition , or a psychiatric disability , is a behavioral or mental pattern that causes significant distress or impairment of personal functioning. A mental disorder is also characterized by a clinically significant disturbance in an individual\u0027s cognition, emotional regulation, or behavior, often in a social context . Such disturbances may occur as single episodes, may be persistent, or may be relapsing\u2013remitting . There are many different types of mental disorders, with signs and symptoms that vary widely between specific disorders. A mental disorder is one aspect of mental health . The prevalence of mental illness is higher in more economically unequal"}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "public health", "label": "public health", "shape": "dot", "size": 24, "title": "\u003cb\u003epublic health\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: public health Wikipedia URL: Public health Public health is \"the science and art of preventing disease, prolonging life and promoting health through the organized efforts and informed choices of society, organizations, public and private, communities and individuals\". Analyzing the determinants of health of a population and the threats it faces is the basis for public health. The public can be as small as a handful of people or as large as a village or an entire city; in the case of a pandemic it may encompass several continents. The concept of health takes into account physical, psychological , and social well-being , among other factors. A community health worker in Korail Basti, a slum in Dhaka , Bangladesh"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "storm surge", "label": "storm surge", "shape": "dot", "size": 12, "title": "\u003cb\u003estorm surge\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: storm surge Wikipedia URL: Storm surge A storm surge is a coastal flood or tsunami -like phenomenon of rising water commonly associated with low-pressure weather systems, such as tropical cyclones . Alternatively, it may be known as a storm flood , tidal surge , or storm tide . It is measured as the rise in water level above the normal tidal level, and does not include waves. Storm surge of the North Sea on February 9, 2014, as seen on the South Beach (S\u00fcdstrand) in Wilhelmshaven, Germany."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Inner Mongolia", "label": "Inner Mongolia", "shape": "dot", "size": 18, "title": "\u003cb\u003eInner Mongolia\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Inner Mongolia Wikipedia URL: Inner Mongolia Inner Mongolia , officially the Inner Mongolia Autonomous Region , is an autonomous region of China . Its border includes two-thirds of the length of China\u0027s border with the country of Mongolia , as well as a small section with Russia ( Zabaykalsky Krai ). Its capital is Hohhot ; other major cities include Baotou , Chifeng , Tongliao and Ordos . Persian miniature depicting Genghis Khan entering Beijing"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "coastal regions", "label": "coastal regions", "shape": "dot", "size": 12, "title": "\u003cb\u003ecoastal regions\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: coastal regions Wikipedia URL: coastal regions The page \" Coastal regions \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "climate risks", "label": "climate risks", "shape": "dot", "size": 12, "title": "\u003cb\u003eclimate risks\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: climate risks Wikipedia URL: climate risks The page \" Climate risks \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "OECD", "label": "OECD", "shape": "dot", "size": 16, "title": "\u003cb\u003eOECD\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: OECD Wikipedia URL: OECD Prescriptive and policy"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "energy security", "label": "energy security", "shape": "dot", "size": 14, "title": "\u003cb\u003eenergy security\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: energy security Wikipedia URL: Energy security Energy security is the association between national security and the availability of natural resources for energy consumption (as opposed to household energy insecurity ). Access to cheaper energy has become essential to the functioning of modern economies. However, the uneven distribution of energy supplies among countries has led to significant vulnerabilities . International energy relations have contributed to the globalization of the world leading to energy security and energy vulnerability at the same time. A U.S. Navy F/A-18 Super Hornet displaying an \"Energy Security\" logo."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "adaptation actions", "label": "adaptation actions", "shape": "dot", "size": 12, "title": "\u003cb\u003eadaptation actions\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: adaptation actions Wikipedia URL: adaptation actions The page \" Adaptation actions \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "remittances", "label": "remittances", "shape": "dot", "size": 12, "title": "\u003cb\u003eremittances\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: remittances Wikipedia URL: Remittances A remittance is a non-commercial transfer of money by a foreign worker , a member of a diaspora community, or a citizen with familial ties abroad, for household income in their home country or homeland . \"Work in Poland legally\" street advertisement in Transnistria"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "mountain tundra", "label": "mountain tundra", "shape": "dot", "size": 12, "title": "\u003cb\u003emountain tundra\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: mountain tundra Wikipedia URL: Mountain tundra Alpine tundra is a type of natural region or biome that does not contain trees because it is at high elevation , with an associated harsh climate . As the latitude of a location approaches the poles, the threshold elevation for alpine tundra gets lower until it reaches sea level and merges with polar tundra . Hikers traversing the Franconia Ridge in the White Mountains of New Hampshire, much of which is in the alpine zone."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Jeju Island", "label": "Jeju Island", "shape": "dot", "size": 14, "title": "\u003cb\u003eJeju Island\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Jeju Island Wikipedia URL: Jeju Island Jeju Island ( Jeju and Korean : \uc81c\uc8fc\ub3c4 ; Hanja : \u6fdf\u5dde\u5cf6 ; RR : Jejudo ; pronounced [t\u0255e\u02d0d\u0291udo] ) is South Korea\u0027s largest island, covering an area of 1,833.2 km 2 (707.8 sq mi), which is 1.83% of the total area of the country. Alongside outlying islands, it is part of Jeju Province and makes up the majority of the province. It is also claimed by North Korea, though it abandoned peaceful Korean reunification as of 2024."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "climatic range", "label": "climatic range", "shape": "dot", "size": 12, "title": "\u003cb\u003eclimatic range\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: climatic range Wikipedia URL: climatic range The page \" Climatic range \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "West Siberia", "label": "West Siberia", "shape": "dot", "size": 20, "title": "\u003cb\u003eWest Siberia\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: West Siberia Wikipedia URL: West Siberia Western Siberia or West Siberia (Russian: \u0417\u0430\u043f\u0430\u0434\u043d\u0430\u044f \u0421\u0438\u0431\u0438\u0440\u044c , IPA: [\u02c8zap\u0259dn\u0259j\u0259 s\u02b2\u026a\u02c8b\u02b2ir\u02b2] ; Kazakh: Batys S\u0131b\u0131r , IPA: [b\u0251\u02c8t\u0259\u0325s s\u0258\u02c8b\u0258r] ) is a region in North Asia . It is part of the wider region of Siberia that is mostly located in the Russian Federation , with a Southern part in Kazakhstan . It lies between the Ural region and the Yenisei River , which conventionally divides Siberia into two halves. Map of Western Siberia"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Ilmen Nature Reserve", "label": "Ilmen Nature Reserve", "shape": "dot", "size": 12, "title": "\u003cb\u003eIlmen Nature Reserve\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Ilmen Nature Reserve Wikipedia URL: Ilmen Nature Reserve Ilmensky Nature Reserve ( Russian : \u0418\u043b\u044c\u043c\u0435\u043d\u0441\u043a\u0438\u0439 \u0437\u0430\u043f\u043e\u0432\u0435\u0434\u043d\u0438\u043a ) is a Russian zapovednik (strict nature reserve) that was created by decree of Vladimir Lenin in 1920 as a mineralogical nature reserve. The reserve is situated just north and east of the city of Miass , in the Chebarkulsky District of Chelyabinsk Oblast . It is 20 km east of Taganay National Park and 75 km west of Chelyabinsk ."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "endemic species", "label": "endemic species", "shape": "dot", "size": 14, "title": "\u003cb\u003eendemic species\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: endemic species Wikipedia URL: Endemic species Endemism is the state of a species being found only in a single defined geographic location, such as an island , state , nation , country or other defined zone; organisms that are indigenous to a place are not endemic to it if they are also found elsewhere. For example, the Cape sugarbird ( Promerops cafer ) is found exclusively in southwestern South Africa and is therefore said to be endemic to that particular part of the world . An endemic species can also be referred to as an endemism or, in scientific literature , as an endemite . Both the orange-breasted sunbird ( Anthobaphes violacea ) and the Kniphofia uvaria plant it feeds on are found exclusively in South Africa ."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "South Siberia", "label": "South Siberia", "shape": "dot", "size": 22, "title": "\u003cb\u003eSouth Siberia\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: South Siberia Wikipedia URL: South Siberia South Central Siberia is a geographical region in North Asia , just north of the meeting point between Russia , China , Kazakhstan and Mongolia . Kemerovo Oblast highlighted Kuznetsk Basin to the west and Minusinsk basin to the east. Altai Republic to the south, Altai Krai northwest of that, Khakassia and Tuva to the southeast"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Tianshan Mountains", "label": "Tianshan Mountains", "shape": "dot", "size": 14, "title": "\u003cb\u003eTianshan Mountains\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Tianshan Mountains Wikipedia URL: Tianshan Mountains The Tian Shan , also known as the Tengri Tagh or Tengir-Too , is a large system of mountain ranges in Central Asia . The highest peak is Jengish Chokusu at 7,439 metres (24,406 ft) high and located in Kyrgyzstan. Its lowest point is at the Turpan Depression , which is 154 m (505 ft) below sea level . Tian Shan with the ancient Silk Road"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Siberian larch", "label": "Siberian larch", "shape": "dot", "size": 16, "title": "\u003cb\u003eSiberian larch\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Siberian larch Wikipedia URL: Siberian larch Larix sibirica , the Siberian larch or Russian larch , is a frost-hardy tree native to western Russia , from close to the Finnish border east to the Yenisei valley in central Siberia , where it hybridises with the Dahurian larch L. gmelinii of eastern Siberia; the hybrid is known as Larix \u00d7 czekanowskii ."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "RCP scenarios", "label": "RCP scenarios", "shape": "dot", "size": 12, "title": "\u003cb\u003eRCP scenarios\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: RCP scenarios Wikipedia URL: RCP scenarios Representative Concentration Pathways ( RCP ) are climate change scenarios to project future greenhouse gas concentrations. These pathways (or trajectories ) describe future greenhouse gas concentrations (not emissions ) and have been formally adopted by the IPCC. The pathways describe different climate change scenarios, all of which were considered possible depending on the amount of greenhouse gases (GHG) emitted in the years to come. The four RCPs \u2013 originally RCP2.6, RCP4.5, RCP6, and RCP8.5 \u2013 are labelled after the expected changes in radiative forcing values from the year 1750 to the year 2100 (2.6, 4.5, 6, and 8.5 W/m 2 , respectively). The IPCC Fifth Assessment Report (AR5) began to use these four pathways for climate modeling"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "dust events", "label": "dust events", "shape": "dot", "size": 12, "title": "\u003cb\u003edust events\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: dust events Wikipedia URL: dust events The page \" Dust events \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "thermal stress", "label": "thermal stress", "shape": "dot", "size": 14, "title": "\u003cb\u003ethermal stress\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: thermal stress Wikipedia URL: Thermal stress In mechanics and thermodynamics , thermal stress is mechanical stress created by any change in temperature of a material. These stresses can lead to fracturing or plastic deformation depending on the other variables of heating, which include material types and constraints. Temperature gradients , thermal expansion or contraction and thermal shocks are things that can lead to thermal stress. This type of stress is highly dependent on the thermal expansion coefficient which varies from material to material. In general, the greater the temperature change, the higher the level of stress that can occur. Thermal shock can result from a rapid change in temperature, resulting in cracking or shattering. Example of deformation induced by ther"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Ocean Health index", "label": "Ocean Health index", "shape": "dot", "size": 12, "title": "\u003cb\u003eOcean Health index\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Ocean Health index Wikipedia URL: Ocean Health index The page \" Ocean Health index \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "river systems", "label": "river systems", "shape": "dot", "size": 12, "title": "\u003cb\u003eriver systems\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: river systems Wikipedia URL: River systems In geomorphology , drainage systems , also known as river systems , are the patterns formed by the streams , rivers , and lakes in a particular drainage basin . They are governed by the topography of land, whether a particular region is dominated by hard or soft rocks, and the gradient of the land. Geomorphologists and hydrologists often view streams as part of drainage basins (and sub-basins ). This is the topographic region from which a stream receives runoff , throughflow , and its saturated equivalent, groundwater flow . The number, size, and shape of the drainage basins varies and the larger and more detailed the topographic map , the more information is available. Dendritic drainage: the Yarlung Tsangpo River , Tibet, seen from "}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Brahmaputra river basins", "label": "Brahmaputra river basins", "shape": "dot", "size": 12, "title": "\u003cb\u003eBrahmaputra river basins\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Brahmaputra river basins Wikipedia URL: Brahmaputra river basins The page \" Brahmaputra river basins \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Indus", "label": "Indus", "shape": "dot", "size": 20, "title": "\u003cb\u003eIndus\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Indus Wikipedia URL: Indus The Indus ( / \u02c8 \u026a n d \u0259 s / IN -d\u0259s ) is a transboundary river of Asia and a trans- Himalayan river of South and Central Asia . The 3,180 km (1,980 mi) river rises in the Tibet Autonomous Region of China where it is known as Sengge Zangbo , flows northwest through the disputed Kashmir region, first through the Indian-administered Ladakh , and then the Pakistani-administered Gilgit-Baltistan , bends sharply to the left after the Nanga Parbat massif , and flows south-by-southwest through Pakistan , before bifurcating and emptying into the Arabian Sea , its main stem located near the port city of Karachi ."}, {"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "Xinjiang", "label": "Xinjiang", "shape": "dot", "size": 34, "title": "\u003cb\u003eXinjiang\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Xinjiang Wikipedia URL: Xinjiang Xinjiang , officially the Xinjiang Uygur Autonomous Region ( XUAR ), is an autonomous region of the People\u0027s Republic of China (PRC), in the northwest of the country at the crossroads of Central Asia and East Asia . The largest province-level division of China by area and the 8th-largest country subdivision in the world, Xinjiang spans over 1.6 million square kilometres (620,000 sq mi) and has about 25 million inhabitants. Xinjiang borders the countries of Afghanistan , India , Kazakhstan , Kyrgyzstan , Mongolia , Pakistan , Russia , and Tajikistan . The rugged Karakoram , Kunlun , and Tian Shan mountain ranges occupy much of Xinjiang\u0027s borders, as well as its western and southern regions. The Aksai Chin and Trans-Karakoram Tract regions are cl"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "hydrological regime", "label": "hydrological regime", "shape": "dot", "size": 14, "title": "\u003cb\u003ehydrological regime\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: hydrological regime Wikipedia URL: Hydrological regime Discharge regime , flow regime, or hydrological regime (commonly termed river regime , but that term is also used for other measurements) is the long-term pattern of annual changes to a stream\u0027s discharge at a particular point. Hence, it shows how the discharge of a stream at that point is expected to change over the year. It is thus the hydrological equivalent of climate . The main factor affecting the regime is climate, along with relief , bedrock , soil and vegetation , as well as human activity. The four different river regimes according to Pard\u00e9 (1955)"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "streamflow", "label": "streamflow", "shape": "dot", "size": 16, "title": "\u003cb\u003estreamflow\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: streamflow Wikipedia URL: Streamflow Streamflow , or channel runoff , is the flow of water in streams and other channels , and is a major element of the water cycle . It is one runoff component, the movement of water from the land to waterbodies , the other component being surface runoff . Water flowing in channels comes from surface runoff from adjacent hillslopes, from groundwater flow out of the ground, and from water discharged from pipes. The discharge of water flowing in a channel is measured using stream gauges or can be estimated by the Manning equation . The record of flow over time is called a hydrograph . Flooding occurs when the volume of water exceeds the capacity of the channel. Mississippi River streamflow in log 10 cubic meters per second measured daily at Vick"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "permafrost degradation", "label": "permafrost degradation", "shape": "dot", "size": 12, "title": "\u003cb\u003epermafrost degradation\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: permafrost degradation Wikipedia URL: permafrost degradation The page \" Permafrost degradation \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "flood events", "label": "flood events", "shape": "dot", "size": 12, "title": "\u003cb\u003eflood events\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: flood events Wikipedia URL: flood events The page \" Flood events \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "river basins", "label": "river basins", "shape": "dot", "size": 14, "title": "\u003cb\u003eriver basins\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: river basins Wikipedia URL: River basins A drainage basin is an area of land in which all flowing surface water converges to a single point, such as a river mouth , or flows into another body of water , such as a lake or ocean . A basin is separated from adjacent basins by a perimeter, the drainage divide , made up of a succession of elevated features, such as ridges and hills . A basin may consist of smaller basins that merge at river confluences , forming a hierarchical pattern . The Mississippi River drains the largest area of any U.S. river, much of it agricultural regions. Agricultural runoff and other water pollution that flows to the outlet is the cause of the hypoxic or dead zone in the Gulf of Mexico ."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Mekong River basin", "label": "Mekong River basin", "shape": "dot", "size": 26, "title": "\u003cb\u003eMekong River basin\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Mekong River basin Wikipedia URL: Mekong River basin The Mekong or Mekong River ( UK : / m i\u02d0 \u02c8 k \u0252 \u014b / mee- KONG , US : / \u02cc m e\u026a \u02c8 k \u0254\u02d0 \u014b / may- KAWNG ) is a transboundary river in East Asia and Southeast Asia . It is the world\u0027s twelfth-longest river and the third-longest in Asia with an estimated length of 4,909 km (3,050 mi) and a drainage area of 795,000 km 2 (307,000 sq mi), discharging 475 km 3 (114 cu mi) of water annually. From its headwaters in the Tibetan Plateau , the river runs through Southwest China (where it is officially called the Lancang River ), Myanmar , Laos , Thailand , Cambodia , and southern Vietnam . The extreme seasonal variations in flow and the presence of rapids and waterfalls in the Mekong make navigation difficult, though the river remains a maj"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "management", "label": "management", "shape": "dot", "size": 12, "title": "\u003cb\u003emanagement\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: management Wikipedia URL: Management Management (or managing ) is the administration of organizations, whether businesses , nonprofit organizations , or government bodies through business administration , nonprofit management , or the political science sub-field of public administration respectively. It is the process of managing the resources of businesses, governments, and other organizations. An organization chart for the United States Coast Guard shows the hierarchy of managerial roles in that organization."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Asian agriculture", "label": "Asian agriculture", "shape": "dot", "size": 12, "title": "\u003cb\u003eAsian agriculture\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Asian agriculture Wikipedia URL: Asian agriculture The page \" Asian agriculture \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "crop yields", "label": "crop yields", "shape": "dot", "size": 14, "title": "\u003cb\u003ecrop yields\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: crop yields Wikipedia URL: Crop yields In agriculture , the yield is a measurement of the amount of a crop grown, or product such as wool, meat or milk produced, per unit area of land. The seed ratio is another way of calculating yields. Cereal yield in tons per hectare and kilograms of nitrogenous fertilizer applied per hectare of cropland."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "shrimp farming", "label": "shrimp farming", "shape": "dot", "size": 16, "title": "\u003cb\u003eshrimp farming\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: shrimp farming Wikipedia URL: Shrimp farming Shrimp farming is a form of aquaculture that takes place in marine or freshwater environments, producing shrimp or prawns (crustaceans of the groups Caridea or Dendrobranchiata ) for human consumption. However, the industry has raised concerns about environmental damage to mangrove ecosystems, reliance on slave labor , and animal welfare issues. The gate of a traditional shrimp farm in Kerala , India which uses the tide to harvest shrimp"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Odisha", "label": "Odisha", "shape": "dot", "size": 16, "title": "\u003cb\u003eOdisha\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Odisha Wikipedia URL: Odisha Odisha ( Odia : o\u1e5bi\u015b\u0101 , pronounced [o\u02c8\u027disa] \u24d8 ), spelled Orissa until 2011, is a state located in Eastern India . It is the eighth-largest state by area , and the eleventh-largest by population , with over 41 million inhabitants. The state also has the third-largest population of Scheduled Tribes in India . It neighbours the states of Jharkhand and West Bengal to the north, Chhattisgarh to the west, and Andhra Pradesh to the south. Odisha has a coastline of 485 kilometres (301 mi) along the Bay of Bengal in the Indian Ocean . The region is also known as Utka\u1e37a and is mentioned by this name in India\u0027s national anthem, Jana Gana Mana ."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "civil conflict", "label": "civil conflict", "shape": "dot", "size": 12, "title": "\u003cb\u003ecivil conflict\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: civil conflict Wikipedia URL: Civil conflict A civil war is a war between organized groups within the same state (or country ). The aim of one side may be to take control of the country or a region, to achieve independence for a region, or to change government policies. The term is a calque of Latin bellum civile which was used to refer to the various civil wars of the Roman Republic in the 1st century BC. Civil here means \"of/related to citizens\", a civil war being a war between the citizenry, rather than with an outsider. The destruction wrought on Granollers after a raid by German aircraft on 31 May 1938 during the Spanish Civil War"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "climate mitigation", "label": "climate mitigation", "shape": "dot", "size": 14, "title": "\u003cb\u003eclimate mitigation\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: climate mitigation Wikipedia URL: Climate mitigation Climate change mitigation , also called climate change decarbonisation , is an action to limit the greenhouse gases in the atmosphere that cause climate change . Climate change mitigation actions include conserving energy and replacing fossil fuels with clean energy sources . Secondary mitigation strategies include changes to land use and removing carbon dioxide (CO 2 ) from the atmosphere. 2022 assessments emphasize that global greenhouse gas emissions must peak before 2025 and decline by about 43% by 2030 to limit warming to 1.5 \u00b0C, requiring rapid transitions in energy, transport, and land-use systems. Global greenhouse gas emission scenarios, based on policies and pledges as of 11/21"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Manila", "label": "Manila", "shape": "dot", "size": 16, "title": "\u003cb\u003eManila\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Manila Wikipedia URL: Manila Manila , officially the City of Manila , is the capital and second-most populous city of the Philippines after Quezon City . According to the 2024 census, it has a population of 1,902,590 people. Located on the eastern shore of Manila Bay on the island of Luzon , it is classified as a highly urbanized city . With 44,935 inhabitants per square kilometer (116,380/sq mi), Manila is one of the world\u0027s most densely populated cities proper ."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "coastal flooding", "label": "coastal flooding", "shape": "dot", "size": 14, "title": "\u003cb\u003ecoastal flooding\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: coastal flooding Wikipedia URL: Coastal flooding Coastal flooding occurs when dry and low-lying land is submerged ( flooded ) by seawater . The range of a coastal flooding is a result of the elevation of floodwater that penetrates the inland which is controlled by the topography of the coastal land exposed to flooding. The seawater can flood the land via several different paths: direct flooding, overtopping or breaching of a barrier. Coastal flooding is largely a natural event. Due to the effects of climate change (e.g. sea level rise and an increase in extreme weather events) and an increase in the population living in coastal areas, the damage caused by coastal flood events has intensified and more people are being affected. Coastal flooding during Hurricane Lili in 2002 on "}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Guangzhou", "label": "Guangzhou", "shape": "dot", "size": 12, "title": "\u003cb\u003eGuangzhou\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Guangzhou Wikipedia URL: Guangzhou Guangzhou is the capital and largest city of the Guangdong province of southern China . Located on the Pearl River , about 120 kilometres (75 mi) northwest of Hong Kong and 145 kilometres (90 mi) north of Macau , Guangzhou has a history of over 2,200 years and was a major terminus of the Silk Road . Portrait of the Grotto of the Five Immortals , the Taoist temple around the five stones which gave Guangzhou its nickname \"The City of Rams\""}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Jakarta", "label": "Jakarta", "shape": "dot", "size": 14, "title": "\u003cb\u003eJakarta\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Jakarta Wikipedia URL: Jakarta Jakarta , officially the Special Capital Region of Jakarta , is the de facto capital and largest city of Indonesia and an autonomous region with a status equivalent to that of a province . It is located on the northwest coast of Java , the world\u0027s most populous island , bordered by the province of West Java to the south and east and Banten to the west. Its coastline faces the Java Sea to the north, and it shares a maritime border with Lampung to the west."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Bhutan", "label": "Bhutan", "shape": "dot", "size": 24, "title": "\u003cb\u003eBhutan\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Bhutan Wikipedia URL: Bhutan Bhutan , officially the Kingdom of Bhutan , is a landlocked country in South Asia , located in the Eastern Himalayas , bordering China to the north and northwest and India to the south and southeast. With a population of over 727,145 and a territory of 38,394 square kilometres (14,824 mi 2 ), Bhutan ranks 133rd in land area and 160th in population. It is a democratic constitutional monarchy with a King as the head of state and a prime minister as the head of government . The Je Khenpo is the head of the state religion , Vajrayana Buddhism."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Mumbai", "label": "Mumbai", "shape": "dot", "size": 16, "title": "\u003cb\u003eMumbai\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Mumbai Wikipedia URL: Mumbai Mumbai ( / m \u028a m \u02c8 b a\u026a / muum- BY ; Marathi : Mumba\u012b , pronounced [\u02c8mumb\u0259i] \u24d8 ), also known as Bombay ( / b \u0252 m \u02c8 b e\u026a / bom- BAY ; its official name until 1995), is the capital city of the Indian state of Maharashtra . Mumbai is the financial capital and the most populous city proper of India, with an estimated population of 12.5 million (1.25 crore ). Mumbai is the centre of the Mumbai Metropolitan Region , which is among the most populous metropolitan areas in the world with a population of over 23 million (2.3 crore). Mumbai lies on the Konkan coast on the west coast of India and has a deep natural harbour . In 2008, Mumbai was named a alpha world city . Mumbai has the highest number of billionaires out of any city in Asia . The Mumba Devi Tem"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "social media", "label": "social media", "shape": "dot", "size": 14, "title": "\u003cb\u003esocial media\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: social media Wikipedia URL: Social media Social media are new media technologies that facilitate the creation , sharing and aggregation of content (such as ideas, interests, and other forms of expression) amongst virtual communities and networks . Common features include: A variety of popular social media app icons"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "World Health Organization", "label": "World Health Organization", "shape": "dot", "size": 16, "title": "\u003cb\u003eWorld Health Organization\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: World Health Organization Wikipedia URL: World Health Organization The World Health Organization ( WHO ) is a specialized agency of the United Nations (UN) which coordinates responses to international public health issues and emergencies . It is headquartered in Geneva , Switzerland, and has six regional offices and 150 field offices worldwide. Only sovereign states are eligible to join, and it is the largest intergovernmental health organization at the international level."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Dhaka", "label": "Dhaka", "shape": "dot", "size": 16, "title": "\u003cb\u003eDhaka\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: Dhaka Wikipedia URL: Dhaka Dhaka ( / \u02c8 d \u0251\u02d0 k \u0259 / DAH -k\u0259 or / \u02c8 d \u00e6 k \u0259 / DAK -\u0259 ; Bengali : \u09a2\u09be\u0995\u09be , romanized : \u1e0ch\u0101k\u0101 , pronounced [\u02c8\u0256\u02b1aka] \u24d8 ), formerly known as Dacca , is the capital and largest city of Bangladesh . With an estimated population of 36.6 million, Dhaka is the second largest city by population in the world, and is widely considered to be the most densely populated built-up urban area in the world. Dhaka is an important cultural, economic, and scientific hub of Eastern South Asia . Dhaka ranks fourth in South Asia and 55th in the world in terms of GDP . Lying on the Ganges Delta , it is bounded by the Buriganga , Turag , Dhaleshwari and Shitalakshya rivers. It is also the largest Bengali-speaking city in the world."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "social vulnerability", "label": "social vulnerability", "shape": "dot", "size": 22, "title": "\u003cb\u003esocial vulnerability\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: social vulnerability Wikipedia URL: Social vulnerability In its broadest sense, social vulnerability is one dimension of vulnerability to multiple stressors and shocks , including abuse , social exclusion and natural hazards . Social vulnerability refers to the inability of people , organizations, and societies to withstand adverse impacts from multiple stressors to which they are exposed. These impacts are due in part to characteristics inherent in social interactions , institutions , and systems of cultural values . Risk-Hazard (RH) model, showing the impact of a hazard as a function of exposure and sensitivity. The chain sequence begins with the hazard, and the concept of vulnerability is noted implicitly as represented by white arrows."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "conservation", "label": "conservation", "shape": "dot", "size": 12, "title": "\u003cb\u003econservation\u003c/b\u003e\u003cbr\u003e\u003cbr\u003esearch term: conservation Wikipedia URL: Conservation Conservation is the preservation or efficient use of resources, or the conservation of various quantities under physical laws."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "least developed countries", "label": "least developed countries", "shape": "dot", "size": 16, "title": "\u003cb
