              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Atmosphere", "label": "Atmosphere", "shape": "dot", "size": 24, "title": "\u003cb\u003eAtmosphere\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMain Topic\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Atmosphere Wikipedia URL: Atmosphere An atmosphere is a layer of gases that envelop an astronomical object , held in place by the gravity of the object. The name originates from Ancient Greek \u1f00\u03c4\u03bc\u03cc\u03c2 ( atm\u00f3s ) \u0027 vapour, steam \u0027 and \u03c3\u03c6\u03b1\u1fd6\u03c1\u03b1 ( spha\u00eera ) \u0027 sphere \u0027 . An object acquires most of its atmosphere during its primordial epoch, either by accretion of matter or by outgassing of volatiles . The chemical interaction of the atmosphere with the solid surface can change its fundamental composition, as can photochemical interaction with the Sun. A planet retains an atmosphere for longer durations when the gravity is high and the temperature is low. The solar wind works to strip away a planet\u0027s outer atmosphere, although this process is slowed by a magnetosphere . The further a body is from the Sun, the lower the rate of atmospheric stripping. The atmospheric gases around Earth scatter blue light (shorter wavelengths) more than light toward the red end (longer wavelengths) of t"}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Troposphere", "label": "Troposphere", "shape": "dot", "size": 26, "title": "\u003cb\u003eTroposphere\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMain Topic\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Troposphere Wikipedia URL: Troposphere The troposphere is the lowest layer of the atmosphere of Earth . Pronounced / \u02c8 t r \u0252 p \u0259 s f \u026a\u0259r \u02cc - p o\u028a -/ , the name comes from Ancient Greek \u03c4\u03c1\u03cc\u03c0\u03bf\u03c2 ( tr\u00f3pos ) \u0027 turning, change \u0027 and - sphere . It contains 80% of the total mass of the planetary atmosphere and 99% of the total mass of water vapor and aerosols , and is where most weather phenomena occur. From the planetary surface of the Earth, the average height of the troposphere is 18 km (11 mi; 59,000 ft) in the tropics ; 11 km (6.8 mi; 36,000 ft) in the middle latitudes ; and 6 km (3.7 mi; 20,000 ft) in the high latitudes of the polar regions in winter; thus the average height of the troposphere is 13 km (8.1 mi; 43,000 ft). A picture of Earth\u0027s troposphere with its different cloud types of low to high altitudes casting shadows. Sunlight is reflected off the ocean, after it was filtered into a reddish light by passing through much of the troposphere at sunset. The above lying "}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Stratosphere", "label": "Stratosphere", "shape": "dot", "size": 16, "title": "\u003cb\u003eStratosphere\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Stratosphere Wikipedia URL: Stratosphere The stratosphere is the second-lowest layer of the atmosphere of Earth , located above the troposphere and below the mesosphere . Pronounced / \u02c8 s t r \u00e6 t \u0259 \u02cc s f \u026a\u0259r , - t o\u028a -/ , the name originates from Ancient Greek \u03c3\u03c4\u03c1\u03c9\u03c4\u03cc\u03c2 ( str\u014dt\u00f3s ) \u0027 layer, stratum \u0027 and - sphere . The stratosphere is composed of stratified temperature zones, with the warmer layers of air located higher (closer to outer space ) and the cooler layers lower (closer to the planetary surface of the Earth). The increase of temperature with altitude is a result of the absorption of the Sun \u0027s ultraviolet (UV) radiation by the ozone layer , where ozone is exothermically photolyzed into oxygen in a cyclical fashion . This temperature inversion is in contrast to the troposphere, where temperature decreases with altitude, and between the troposphere and stratosphere is the tropopause border that demarcates the beginning of the temperature inversion. Afterglow of the t"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Ozone layer", "label": "Ozone layer", "shape": "dot", "size": 16, "title": "\u003cb\u003eOzone layer\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Ozone layer Wikipedia URL: Ozone layer The ozone layer or ozone shield is a region of Earth \u0027s stratosphere that absorbs most of the Sun \u0027s ultraviolet radiation. It contains a high concentration of ozone (O 3 ) in relation to other parts of the atmosphere, although still small in relation to other gases in the stratosphere. The ozone layer peaks at 8 to 15 parts per million of ozone, while the average ozone concentration in Earth\u0027s atmosphere as a whole is about 0.3 parts per million. The ozone layer is mainly found in the lower portion of the stratosphere, from approximately 15 to 35 kilometers (9 to 22 mi) above Earth, although its thickness varies seasonally and geographically. The ozone layer visible from space at Earth\u0027s horizon as a blue band of afterglow within the bottom of the large bright blue band that is the stratosphere , with a silhouette of a cumulonimbus in the orange afterglow of the troposphere ."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Stratospheric ozone depletion", "label": "Stratospheric ozone depletion", "shape": "dot", "size": 12, "title": "\u003cb\u003eStratospheric ozone depletion\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Stratospheric ozone depletion Wikipedia URL: Stratospheric ozone depletion The page \" Stratospheric ozone depletion \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Surface temperature", "label": "Surface temperature", "shape": "dot", "size": 12, "title": "\u003cb\u003eSurface temperature\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Surface temperature Wikipedia URL: Surface temperature Surface temperature is the temperature at a surface."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Global surface temperature", "label": "Global surface temperature", "shape": "dot", "size": 20, "title": "\u003cb\u003eGlobal surface temperature\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMain Topic\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Global surface temperature Wikipedia URL: Global surface temperature Global surface temperature ( GST ) is the average temperature of Earth \u0027s surface at a given time. It is a combination of sea surface temperature and the near-surface air temperature over land, weighted by their respective areas. Temperature data comes mainly from weather stations and satellites . To estimate data in the distant past, proxy data can be used for example from tree rings , corals , and ice cores . Observing the rising GST over time is one of the many lines of evidence supporting the scientific consensus on climate change , which is that human activities are causing climate change . Alternative terms for the same concept are global mean surface temperature ( GMST ) or global average surface temperature . The blue line represents global surface temperature reconstructed over the last 2,000 years using proxy data from tree rings , corals , and ice cores . The red line shows direct surface tempe"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Climate variability", "label": "Climate variability", "shape": "dot", "size": 14, "title": "\u003cb\u003eClimate variability\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Climate variability Wikipedia URL: Climate variability Climate variability includes all the variations in the climate that last longer than individual weather events, whereas the term climate change only refers to those variations that persist for a longer period of time, typically decades or more. Climate change may refer to any time in Earth\u0027s history, but the term is now commonly used to describe contemporary climate change, often popularly referred to as global warming. Since the Industrial Revolution , the climate has increasingly been affected by human activities . There is seasonal variability in how new high temperature records have outpaced new low temperature records."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Internal variability", "label": "Internal variability", "shape": "dot", "size": 12, "title": "\u003cb\u003eInternal variability\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Internal variability Wikipedia URL: Internal variability The page \" Internal variability \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Anthropogenic climate change", "label": "Anthropogenic climate change", "shape": "dot", "size": 22, "title": "\u003cb\u003eAnthropogenic climate change\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMain Topic\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Anthropogenic climate change Wikipedia URL: Anthropogenic climate change Present-day climate change includes both global warming \u2014the ongoing increase in global average temperature \u2014and its wider effects on Earth\u0027s climate system . Climate change in a broader sense also includes previous long-term changes to Earth\u0027s climate . The modern-day rise in global temperatures is driven by human activities , especially fossil fuel ( coal , oil and natural gas ) burning since the Industrial Revolution . Fossil fuel use, deforestation , and some agricultural and industrial practices release greenhouse gases . These gases absorb some of the heat that the Earth radiates after it warms from sunlight, warming the lower atmosphere. Earth\u0027s atmosphere now has roughly 50% more carbon dioxide , the main gas driving global warming, than it did at the end of the pre-industrial era , reaching levels not seen for millions of years. Global surface temperature reconstruction over the past 2000 yea"}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Fossil fuel", "label": "Fossil fuel", "shape": "dot", "size": 22, "title": "\u003cb\u003eFossil fuel\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMain Topic\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Fossil fuel Wikipedia URL: Fossil fuel A fossil fuel is a flammable carbon compound- or hydrocarbon -containing material formed naturally in the Earth\u0027s crust from the buried remains of prehistoric organisms (animals, plants or microplanktons ), a process that occurs within geological formations . Reservoirs of such compound mixtures, such as coal , petroleum and natural gas , can be extracted and burnt as fuel for human consumption to provide energy for direct use (such as for cooking, heating or lighting), to power heat engines (such as steam or internal combustion engines) that can propel vehicles, or to generate electricity via steam turbine generators. Some fossil fuels are further refined into derivatives such as kerosene , gasoline and diesel , or converted into petrochemicals such as polyolefins ( plastics ), aromatics and synthetic resins . Fossil fuels share energy"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Coal", "label": "Coal", "shape": "dot", "size": 18, "title": "\u003cb\u003eCoal\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Coal Wikipedia URL: Coal Coal is a combustible black or brownish-black sedimentary rock , formed as layers called coal seams . Coal is mostly carbon with variable amounts of other elements , chiefly hydrogen , sulfur , oxygen , and nitrogen . It is a fossil fuel , formed when plants decay into peat which is converted into coal by the heat and pressure of deep burial over millions of years. Vast deposits formed from wetlands called coal forests that covered much of the tropics during the late Carboniferous and early Permian ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Natural gas", "label": "Natural gas", "shape": "dot", "size": 18, "title": "\u003cb\u003eNatural gas\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Natural gas Wikipedia URL: Natural gas Natural gas (also gas , and methane gas ) is a naturally occurring mixture composed of gaseous hydrocarbons , primarily methane (95%), small amounts of higher alkanes , and traces of carbon dioxide and nitrogen , hydrogen sulfide and helium . Methane is a colorless and odorless gas, and, after carbon dioxide, is the second-greatest greenhouse gas that contributes to global climate change . Because natural gas is odorless, a commercial odorizer , such as methanethiol , that smells of hydrogen sulfide (rotten eggs) is added to the gas for the ready detection of gas leaks. Natural gas burning on a gas stove"}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Industrial Revolution", "label": "Industrial Revolution", "shape": "dot", "size": 22, "title": "\u003cb\u003eIndustrial Revolution\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMain Topic\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Industrial Revolution Wikipedia URL: Industrial Revolution The Industrial Revolution , sometimes divided into the First Industrial Revolution and Second Industrial Revolution , was a transitional period of the global economy toward more widespread, efficient and stable manufacturing processes, succeeding the Second Agricultural Revolution . Beginning in Great Britain around 1760, the Industrial Revolution had spread to continental Europe and the United States by about 1840. This transition included going from hand production methods to machines ; new chemical manufacturing and iron production processes; the increasing use of water power and steam power ; the development of machine tools ; and rise of the mechanised factory system . Output greatly increased, and the result was an unprecedented rise in population and population growth . The textile industry was the first to use modern production methods, and textiles became the dominant industry in terms of employment, value"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Aerosol", "label": "Aerosol", "shape": "dot", "size": 18, "title": "\u003cb\u003eAerosol\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Aerosol Wikipedia URL: Aerosol An aerosol is a suspension of fine solid particles or liquid droplets in air or another gas . Aerosols can be generated from natural or human causes . The scientific term aerosol refers to the mixture of particulates in gas, and not to the particulate matter alone. The liquid or solid particles in an aerosol have diameters typically less than 1 \u03bcm . Larger particles with a significant settling speed make the mixture a suspension, although the distinction is not clear. Mist and fog are aerosols"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Sulfate aerosol", "label": "Sulfate aerosol", "shape": "dot", "size": 14, "title": "\u003cb\u003eSulfate aerosol\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Sulfate aerosol Wikipedia URL: Sulfate aerosol Particulate matter (PM) or particulates are microscopic particles of solid or liquid matter suspended in the air. An aerosol is a mixture of particulates and air, as opposed to the particulate matter alone, though it is sometimes defined as a subset of aerosol terminology. Sources of particulate matter can be natural or anthropogenic . Particulates have impacts on climate and precipitation that adversely affect human health. PM 2.5 and PM 10 compared with a human hair in a graphic from the Environmental Protection Agency"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Black carbon", "label": "Black carbon", "shape": "dot", "size": 12, "title": "\u003cb\u003eBlack carbon\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Black carbon Wikipedia URL: Black carbon Black carbon ( BC ) is the light-absorbing refractory form of elemental carbon remaining after pyrolysis (e.g., charcoal ) or produced by incomplete combustion (e.g. soot ). Black carbon is found worldwide, but its presence and impact are particularly strong in Asia."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Solar radiation", "label": "Solar radiation", "shape": "dot", "size": 12, "title": "\u003cb\u003eSolar radiation\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Solar radiation Wikipedia URL: Solar radiation Sunlight is the portion of the electromagnetic radiation which is emitted by the Sun (i.e. solar radiation) and received by the Earth , in particular the visible light perceptible to the human eye as well as invisible infrared (typically perceived by humans as warmth) and ultraviolet (which can have physiological effects such as sunburn ) lights. However, according to the American Meteorological Society , there are \"conflicting conventions as to whether all three [...] are referred to as light, or whether that term should only be applied to the visible portion of the spectrum\". Upon reaching the Earth, sunlight is scattered and filtered through the Earth\u0027s atmosphere as daylight when the Sun is above the horizon . When direct solar radiation is not blocked by clouds , it is experienced as sunshine , a combination of bright light and radiant heat (atmospheric). When blocked by clouds or reflected off other objects , sunlight is"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Incoming solar radiation", "label": "Incoming solar radiation", "shape": "dot", "size": 12, "title": "\u003cb\u003eIncoming solar radiation\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Incoming solar radiation Wikipedia URL: Incoming solar radiation The page \" Incoming solar radiation \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Outgoing longwave radiation", "label": "Outgoing longwave radiation", "shape": "dot", "size": 12, "title": "\u003cb\u003eOutgoing longwave radiation\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Outgoing longwave radiation Wikipedia URL: Outgoing longwave radiation In climate science , longwave radiation ( LWR ) is electromagnetic thermal radiation emitted by Earth\u0027s surface, atmosphere, and clouds. It is also referred to as terrestrial radiation . This radiation is in the infrared portion of the spectrum, but is distinct from the shortwave (SW) near-infrared radiation found in sunlight. Spectral intensity of sunlight (average at top of atmosphere) and thermal radiation emitted by Earth\u0027s surface."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Energy balance", "label": "Energy balance", "shape": "dot", "size": 12, "title": "\u003cb\u003eEnergy balance\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Energy balance Wikipedia URL: Energy balance Energy balance may refer to:"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Radiation budget", "label": "Radiation budget", "shape": "dot", "size": 14, "title": "\u003cb\u003eRadiation budget\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Radiation budget Wikipedia URL: Radiation budget Earth\u0027s energy budget (or Earth\u0027s energy balance ) is the balance between the energy that Earth receives from the Sun and the energy the Earth loses back into outer space . Smaller energy sources, such as Earth\u0027s internal heat, are taken into consideration, but make a tiny contribution compared to solar energy. The energy budget also takes into account how energy moves through the climate system . The Sun heats the equatorial tropics more than the polar regions . Therefore, the amount of solar irradiance received by a certain region is unevenly distributed. As the energy seeks equilibrium across the planet, it drives interactions in Earth\u0027s climate system, i.e., Earth\u0027s water , ice , atmosphere , rocky crust , and all living things . The result is Earth\u0027s climate . Earth\u0027s energy balance and imbalance, showing where the excess energy goes: Outgoing radiation is decreasing owing to increasing greenhouse gases in the atmospher"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Water vapor", "label": "Water vapor", "shape": "dot", "size": 14, "title": "\u003cb\u003eWater vapor\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Water vapor Wikipedia URL: Water vapor Water vapor , water vapour , or aqueous vapor is the gaseous phase of water . It is one state of water within the hydrosphere . Water vapor can be produced from the evaporation or boiling of liquid water or from the sublimation of ice . Water vapor is transparent, like most constituents of the atmosphere. Under typical atmospheric conditions, water vapor is continuously generated by evaporation and removed by condensation . It is less dense than most of the other constituents of air and triggers convection currents that can lead to clouds and fog. The amount of water vapor in Earth\u0027s atmosphere has risen over recent decades, making heavy rainfall events more severe."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Cloud feedback", "label": "Cloud feedback", "shape": "dot", "size": 12, "title": "\u003cb\u003eCloud feedback\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Cloud feedback Wikipedia URL: Cloud feedback A cloud feedback is a climate change feedback where some aspects of cloud characteristics (e.g. cloud cover, composition or height) are altered due to climate change , and these changes then further affect the Earth\u0027s energy balance . On their own, clouds are already an important part of the climate system , as they consist of liquid droplets and ice particles, which absorb infrared radiation and reflect visible solar radiation. Clouds at low altitudes have a stronger cooling effect, and those at high altitudes have a stronger warming effect. Altogether, clouds make the Earth cooler than it would have been without them. Clouds affect the amount of reflected shortwave and emitted longwave radiation, which in turn affects global temperature. Changes in global temperature can then cause changes to clouds. The overall interaction can lead to a feedback."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Climate feedback", "label": "Climate feedback", "shape": "dot", "size": 16, "title": "\u003cb\u003eClimate feedback\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Climate feedback Wikipedia URL: Climate feedback Climate change feedbacks are natural processes that impact how much global temperatures will increase for a given amount of greenhouse gas emissions . Positive feedbacks amplify global warming while negative feedbacks diminish it. Feedbacks influence both the amount of greenhouse gases in the atmosphere and the amount of temperature change that happens in response . While emissions are the forcing that causes climate change, feedbacks combine to control climate sensitivity to that forcing. The relative magnitude of the top 6 climate change feedbacks and what they influence. Positive feedbacks amplify the global warming response to greenhouse gas emissions and negative feedbacks reduce it. In this chart, the horizontal lengths of the red and blue bars indicate the strength of respective feedbacks."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Positive feedback", "label": "Positive feedback", "shape": "dot", "size": 16, "title": "\u003cb\u003ePositive feedback\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Positive feedback Wikipedia URL: Positive feedback Positive feedback ( exacerbating feedback , self-reinforcing feedback ) is a process that occurs in a feedback loop where the outcome of a process reinforces the inciting process to build momentum. As such, these forces can exacerbate the effects of a small disturbance. That is, the effects of a perturbation on a system include an increase in the magnitude of the perturbation. That is, A produces more of B which in turn produces more of A . In contrast, a system in which the results of a change act to reduce or counteract it has negative feedback . Both concepts play an important role in science and engineering, including biology, chemistry, and cybernetics . Causal loop diagram that depicts the causes of a stampede as a positive feedback loop. Alarm or panic can sometimes be spread by positive feedback among a herd of animals to cause a stampede ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Negative feedback", "label": "Negative feedback", "shape": "dot", "size": 16, "title": "\u003cb\u003eNegative feedback\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Negative feedback Wikipedia URL: Negative feedback Negative feedback (or balancing feedback ) occurs when some function of the output of a system, process, or mechanism is fed back in a manner that tends to reduce the fluctuations in the output, whether caused by changes in the input or by other disturbances. A simple negative feedback system is descriptive, for example, of some electronic amplifiers. The feedback is negative if the loop gain AB is negative."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Ice\u2013albedo feedback", "label": "Ice\u2013albedo feedback", "shape": "dot", "size": 12, "title": "\u003cb\u003eIce\u2013albedo feedback\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Ice\u2013albedo feedback Wikipedia URL: Ice%E2%80%93albedo feedback Ice\u2013albedo feedback is a climate change feedback , in which a change in the area of ice caps , glaciers , and sea ice alters the albedo and surface temperature of a planet. Because ice is very reflective, it reflects far more solar energy back to space than open water or any other land cover . It occurs on Earth , and can also occur on exoplanets . Diagram of ice\u2013albedo feedback. Ice reflects more light back into space, whereas land and water absorb more of the sunlight."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Glacier", "label": "Glacier", "shape": "dot", "size": 20, "title": "\u003cb\u003eGlacier\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMain Topic\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Glacier Wikipedia URL: Glacier A glacier ( US : / \u02c8 \u0261 l e\u026a \u0283 \u0259r / ; UK : / \u02c8 \u0261 l \u00e6 s i \u0259 / or / \u02c8 \u0261 l e\u026a s i \u0259 / ) is a persistent body of dense ice, a form of rock, that is constantly moving downhill under its own weight. A glacier forms where the accumulation of snow exceeds its ablation over many years, often centuries. It acquires distinguishing features, such as crevasses and seracs , as it slowly flows and deforms under stresses induced by its weight. As it moves, it abrades rock and debris from its substrate to create landforms such as cirques , moraines , or fjords . Although a glacier may flow into a body of water, it forms only on land and is distinct from the much thinner sea ice and lake ice that form on the surface of bodies of water. Glacier of the Geikie Plateau in Greenland"}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Ice sheet", "label": "Ice sheet", "shape": "dot", "size": 22, "title": "\u003cb\u003eIce sheet\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMain Topic\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Ice sheet Wikipedia URL: Ice sheet In glaciology , an ice sheet , also known as a continental glacier , is a mass of glacial ice that covers surrounding terrain and is greater than 50,000 km 2 (19,000 sq mi). The only current ice sheets are the Antarctic ice sheet and the Greenland ice sheet . Ice sheets are bigger than ice shelves or alpine glaciers . Masses of ice covering less than 50,000 km 2 are termed an ice cap . An ice cap will typically feed a series of glaciers around its periphery. One of Earth\u0027s two ice sheets: The Antarctic ice sheet covers about 98% of the Antarctic continent and is the largest single mass of ice on Earth. It has an average thickness of over 2 kilometers."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Ice core", "label": "Ice core", "shape": "dot", "size": 18, "title": "\u003cb\u003eIce core\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Ice core Wikipedia URL: Ice core An ice core is a core sample that is typically removed from an ice sheet or a high mountain glacier . Since the ice forms from the incremental buildup of annual layers of snow, lower layers are older than upper ones, and an ice core contains ice formed over a range of years. Cores are drilled with hand augers (for shallow holes) or powered drills; they can reach depths of over two miles (3.2 km), and contain ice up to 800,000 years old. Ice core sample taken from drill"}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Cryosphere", "label": "Cryosphere", "shape": "dot", "size": 20, "title": "\u003cb\u003eCryosphere\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMain Topic\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Cryosphere Wikipedia URL: Cryosphere The cryosphere is an umbrella term for those portions of Earth \u0027s surface where water is in solid form. This includes sea ice , ice on lakes or rivers, snow , glaciers , ice caps , ice sheets , and frozen ground (which includes permafrost ). Thus, there is an overlap with the hydrosphere . The cryosphere is an integral part of the global climate system . It also has important feedbacks on the climate system . These feedbacks come from the cryosphere\u0027s influence on surface energy and moisture fluxes, clouds , the water cycle , atmospheric and oceanic circulation . Overview of the cryosphere and its larger components"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Snow cover", "label": "Snow cover", "shape": "dot", "size": 14, "title": "\u003cb\u003eSnow cover\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Snow cover Wikipedia URL: Snow cover Snow consists of individual ice crystals that grow while suspended in the atmosphere \u2014usually within clouds\u2014and then fall, accumulating on the ground where they undergo further changes. It consists of frozen crystalline water throughout its life cycle, starting when, under suitable conditions, the ice crystals form in the atmosphere, increase to millimeter size, precipitate and accumulate on surfaces, then metamorphose in place, and ultimately melt, slide, or sublimate away."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Sea surface temperature", "label": "Sea surface temperature", "shape": "dot", "size": 20, "title": "\u003cb\u003eSea surface temperature\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMain Topic\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Sea surface temperature Wikipedia URL: Sea surface temperature Sea surface temperature (or ocean surface temperature ) is the temperature of ocean water close to the surface. The exact meaning of surface varies in the literature and in practice. It is usually between 1 millimetre (0.04 in) and 20 metres (70 ft) below the sea surface. Sea surface temperatures greatly modify air masses in the Earth\u0027s atmosphere within a short distance of the shore. The thermohaline circulation has a major impact on average sea surface temperature throughout most of the world\u0027s oceans. Sea-surface temperature since 1979 in the extrapolar region (between 60 degrees south and 60 degrees north latitude)"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Ocean heat content", "label": "Ocean heat content", "shape": "dot", "size": 12, "title": "\u003cb\u003eOcean heat content\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Ocean heat content Wikipedia URL: Ocean heat content Ocean heat content (OHC) or ocean heat uptake (OHU) is the energy absorbed and stored by oceans . It is an important indicator of global warming . Ocean heat content is calculated by measuring ocean temperature at many different locations and depths, and integrating the areal density of a change in enthalpic energy over an ocean basin or entire ocean. The ocean heat content (OHC) has been increasing for decades as the ocean has been absorbing most of the excess heat resulting from greenhouse gas emissions from human activities. The graph shows OHC calculated to a water depth of 700 and to 2000 meters."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Thermal expansion", "label": "Thermal expansion", "shape": "dot", "size": 12, "title": "\u003cb\u003eThermal expansion\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Thermal expansion Wikipedia URL: Thermal expansion Thermal expansion is the tendency of matter to increase in length , area , or volume , changing its size and density , in response to an increase in temperature (usually excluding phase transitions ). In simple words, the change in size of a body due to heating is called thermal expansion. Substances usually contract with decreasing temperature ( thermal contraction ), with rare exceptions within limited temperature ranges ( negative thermal expansion ). The SI unit of thermal expansion is inverse Kelvin (1/K). Expansion joint in a road bridge used to avoid damage from thermal expansion."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Coral bleaching", "label": "Coral bleaching", "shape": "dot", "size": 14, "title": "\u003cb\u003eCoral bleaching\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Coral bleaching Wikipedia URL: Coral bleaching Coral bleaching is the process when corals become white due to loss of symbiotic algae and photosynthetic pigments. This loss of pigment can be caused by various stressors, such as changes in water temperature, light, salinity , or nutrients. A bleached coral is not necessarily dead, and some corals may survive. However, a bleached coral is under stress, more vulnerable to starvation and disease, and at risk of death. The leading cause of coral bleaching is rising ocean temperatures due to climate change . Large-scale bleaching events can devastate entire reef ecosystems, affecting biodiversity and the livelihoods of coastal communities that depend on healthy reefs for food, tourism, and protection from storm surges. Coral bleaching in ecosystems is a complex dynamic. Coral is able to slowly recover after experiencing bleaching, however, it is a slow process which typically results in re-bleaching."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Marine heatwave", "label": "Marine heatwave", "shape": "dot", "size": 16, "title": "\u003cb\u003eMarine heatwave\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Marine heatwave Wikipedia URL: Marine heatwave A marine heatwave is a period of abnormally high sea surface temperatures (SST) compared to typical temperatures for a particular season and locale. Marine heatwaves are caused by a variety of drivers. These include short term weather events such as fronts , intraseasonal events (30 to 90 days), annual, and decadal (10-year) modes like El Ni\u00f1o events , and human-caused climate change . Such heatwaves affect marine ecosystems . For example, heatwaves can lead to events such as coral bleaching , sea star wasting disease , harmful algal blooms , and mass mortality of benthic communities. Unlike heatwaves on land, marine heatwaves can extend over vast areas, persist for weeks to months to years, and extend to subsurface levels. World map showing several marine heatwaves at different locations in August and September 2023. The marine heatwave west of South America is a prominent example."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Monsoon", "label": "Monsoon", "shape": "dot", "size": 14, "title": "\u003cb\u003eMonsoon\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Monsoon Wikipedia URL: Monsoon A monsoon ( / m \u0252 n \u02c8 s u\u02d0 n / ) is traditionally a seasonal reversing wind accompanied by corresponding changes in precipitation but is now used to describe seasonal changes in atmospheric circulation and precipitation associated with annual latitudinal oscillation of the Intertropical Convergence Zone (ITCZ) between its limits to the north and south of the equator. Usually, the term monsoon is used to refer to the rainy phase of a seasonally changing pattern, although technically there is also a dry phase. The term is also sometimes used to describe locally heavy but short-term rains. Advancing monsoon clouds and showers in Aralvaimozhy, near Nagercoil , Tamil Nadu , India"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Indian monsoon", "label": "Indian monsoon", "shape": "dot", "size": 14, "title": "\u003cb\u003eIndian monsoon\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Indian monsoon Wikipedia URL: Indian monsoon The Monsoon of South Asia is among several geographically distributed global monsoons . It affects the Indian subcontinent , where it is one of the oldest and most anticipated weather phenomena and an economically important pattern every year from June through September, but it is only partly understood and notoriously difficult to predict. Several theories have been proposed to explain the origin, process, strength, variability, distribution, and general vagaries of the monsoon, but understanding and predictability are still evolving. A visualisation of the South Asian Monsoon based on the Climate Hazards Group InfraRed Precipitation with Station data (CHIRPS) 30+ year quasi-global rainfall dataset, analysed and visualised using Google Earth Engine."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Atmospheric circulation", "label": "Atmospheric circulation", "shape": "dot", "size": 16, "title": "\u003cb\u003eAtmospheric circulation\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Atmospheric circulation Wikipedia URL: Atmospheric circulation Atmospheric circulation is the large-scale movement of air and together with ocean circulation is the means by which thermal energy is redistributed on the surface of Earth . Earth\u0027s atmospheric circulation varies from year to year, but the large-scale structure of its circulation remains fairly constant. The smaller-scale weather systems \u2013 mid-latitude depressions , or tropical convective cells \u2013 occur chaotically, and long-range weather predictions of those cannot be made beyond ten days in practice, or a month in theory (see chaos theory and the butterfly effect ). Idealised depiction (at equinox ) of large-scale atmospheric circulation on Earth"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Jet stream", "label": "Jet stream", "shape": "dot", "size": 14, "title": "\u003cb\u003eJet stream\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Jet stream Wikipedia URL: Jet stream Jet streams are fast flowing, narrow air currents in the atmosphere . The main terrestrial jet streams are located near the altitude of the tropopause and are westerly winds, flowing west to east around the globe. The Northern Hemisphere and the Southern Hemisphere each have a polar jet around their respective polar vortex at around 30,000 ft (5.7 mi; 9.1 km) above sea level and typically travelling at around 110 mph (180 km/h) although often considerably faster. Closer to the equator, somewhat higher and somewhat weaker, is a subtropical jet . The polar jet stream can travel at speeds greater than 180 km/h (110 mph). Here, the fastest winds are coloured red; slower winds are blue."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Hadley cell", "label": "Hadley cell", "shape": "dot", "size": 16, "title": "\u003cb\u003eHadley cell\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Hadley cell Wikipedia URL: Hadley cell The Hadley cell , also known as the Hadley circulation , is a global-scale tropical atmospheric circulation that features air rising near the equator , flowing poleward near the tropopause at a height of 12\u201315 km (7.5\u20139.3 mi) above the Earth\u0027s surface, cooling and descending in the subtropics at around 30 degrees latitude, and then returning equatorward near the surface. It is a thermally direct circulation within the troposphere that emerges due to differences in insolation and heating between the tropics and the subtropics. On a yearly average, the circulation is characterized by a circulation cell on each side of the equator. The Southern Hemisphere Hadley cell is slightly stronger on average than its northern counterpart, extending slightly beyond the equator into the Northern Hemisphere. During the summer and winter months, the Hadley circulation is dominated by a single, cross-equatorial cell with air rising in the summer hemisp"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Walker circulation", "label": "Walker circulation", "shape": "dot", "size": 14, "title": "\u003cb\u003eWalker circulation\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Walker circulation Wikipedia URL: Walker circulation The Walker circulation , also known as the Walker cell , is a conceptual model of the air flow in the tropics in the lower atmosphere ( troposphere ). According to this model, parcels of air follow a closed circulation in the zonal and vertical directions. This circulation, which is roughly consistent with observations, is caused by differences in heat distribution between ocean and land. In addition to motions in the zonal and vertical direction the tropical atmosphere also has considerable motion in the meridional direction as part of, for example, the Hadley Circulation . A schematic diagram of the quasi-equilibrium and La Ni\u00f1a phase of the southern oscillation. The Walker circulation is seen at the surface as easterly trade winds which move water and air warmed by the sun towards the west. The western side of the equatorial Pacific is characterized by warm, wet low pressure weather as the collected moisture is dumped"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Blocking (meteorology)", "label": "Blocking (meteorology)", "shape": "dot", "size": 12, "title": "\u003cb\u003eBlocking (meteorology)\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Blocking (meteorology) Wikipedia URL: Blocking (meteorology) The page \" Blocking (meteorology) \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Atmospheric river", "label": "Atmospheric river", "shape": "dot", "size": 14, "title": "\u003cb\u003eAtmospheric river\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Atmospheric river Wikipedia URL: Atmospheric river An atmospheric river ( AR ) is a narrow corridor or filament of concentrated moisture in the atmosphere . Other names for this phenomenon are tropical plume , tropical connection , moisture plume , water vapor surge , and cloud band . An explanation from the National Weather Service on atmospheric rivers"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Storm surge", "label": "Storm surge", "shape": "dot", "size": 12, "title": "\u003cb\u003eStorm surge\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Storm surge Wikipedia URL: Storm surge A storm surge is a coastal flood or tsunami -like phenomenon of rising water commonly associated with low-pressure weather systems, such as tropical cyclones . Alternatively, it may be known as a storm flood , tidal surge , or storm tide . It is measured as the rise in water level above the normal tidal level, and does not include waves. Storm surge of the North Sea on February 9, 2014, as seen on the South Beach (S\u00fcdstrand) in Wilhelmshaven, Germany."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Hurricane", "label": "Hurricane", "shape": "dot", "size": 16, "title": "\u003cb\u003eHurricane\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Hurricane Wikipedia URL: Hurricane A tropical cyclone is a rapidly rotating storm system with a low-pressure area , a closed low-level atmospheric circulation , strong winds, and a spiral arrangement of thunderstorms that produce heavy rain and squalls . Depending on its location and strength, a tropical cyclone is called a hurricane ( / \u02c8 h \u028cr \u026a k \u0259n , - k e\u026a n / ), typhoon ( / t a\u026a \u02c8 f u\u02d0 n / ), tropical storm , cyclonic storm , tropical depression , or simply cyclone . A hurricane is a strong tropical cyclone that occurs in the Atlantic Ocean or northeastern Pacific Ocean . A typhoon is the same thing which occurs in the northwestern Pacific Ocean. In the Indian Ocean and South Pacific, comparable storms are referred to as \"tropical cyclones\". In modern times, on average around 80 to 90 named tropical cyclones form each year around the world, over half of which develop hurricane-force winds of 65 kn (120 km/h; 75 mph) or more. Hurricane Florence viewed from the Internat"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Typhoon", "label": "Typhoon", "shape": "dot", "size": 14, "title": "\u003cb\u003eTyphoon\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Typhoon Wikipedia URL: Typhoon A typhoon is a tropical cyclone that develops between 180\u00b0 and 100\u00b0E in the Northern Hemisphere and which produces sustained hurricane-force winds of at least 119 km/h (74 mph). This region is referred to as the Northwestern Pacific Basin , accounting for almost one third of the world\u0027s tropical cyclones. For organizational purposes, the northern Pacific Ocean is divided into three regions: the eastern (North America to 140\u00b0W ), central (140\u00b0W to 180\u00b0), and western (180\u00b0 to 100\u00b0E). The Regional Specialized Meteorological Center (RSMC) for tropical cyclone forecasts is in Japan , with other tropical cyclone warning centres for the northwest Pacific in Hawaii (the Joint Typhoon Warning Center ), the Philippines , and Hong Kong . Although the RSMC names each system, the main name list itself is coordinated among 18 countries that have territories threatened by typhoons each year. Typhoon Noru over the Pacific Ocean"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Cyclogenesis", "label": "Cyclogenesis", "shape": "dot", "size": 12, "title": "\u003cb\u003eCyclogenesis\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Cyclogenesis Wikipedia URL: Cyclogenesis Cyclogenesis is the development or strengthening of cyclonic circulation in the atmosphere (a low-pressure area ). Cyclogenesis is an umbrella term for at least three different processes, all of which result in the development of some sort of cyclone , and at any size from the microscale to the synoptic scale . This collage of GOES 13 satellite images shows the development of a nor\u0027easter over two days."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Extreme event attribution", "label": "Extreme event attribution", "shape": "dot", "size": 12, "title": "\u003cb\u003eExtreme event attribution\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Extreme event attribution Wikipedia URL: Extreme event attribution In general, extreme event attribution , also known as attribution science , evaluates relative contributions of multiple causes of an event, and assigns statistical confidence to that evaluation. Most often, the term is applied to the science of identifying and quantifying the role that human-caused climate change plays in the frequency, intensity, duration, and impacts of individual extreme weather events . Attribution science aims to determine the degree to which such events can be explained by or linked to human-caused global warming, and are not simply due to random climate variability or natural weather patterns . Since the industrial revolution, global warming has increased the frequency, intensity, duration and impacts of weather events\u2014heatwaves, hurricane winds, etc.(red vs blue curve). Accordingly, the number of extreme events is substantially greater today (red area) than in the pre-industrial er"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Climate risk", "label": "Climate risk", "shape": "dot", "size": 12, "title": "\u003cb\u003eClimate risk\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Climate risk Wikipedia URL: Climate risk Climate risk is the potential for problems for societies or ecosystems from the impacts of climate change . The assessment of climate risk is based on formal analysis of the consequences, likelihoods and responses to these impacts. Societal constraints can also shape adaptation options. There are different values and preferences around risk, resulting in differences of risk perception. The risk equation shows that climate risk is a product of hazard , exposure, and climate change vulnerability (where \u0027x\u0027 represents interaction between the components)."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Vulnerability", "label": "Vulnerability", "shape": "dot", "size": 12, "title": "\u003cb\u003eVulnerability\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Vulnerability Wikipedia URL: Vulnerability Vulnerability refers to \"the quality or state of being exposed to the possibility of being attacked or harmed, either physically or emotionally.\" The understanding of social and environmental vulnerability, as a methodological approach, involves the analysis of the risks and assets of disadvantaged groups , such as the elderly. The approach of vulnerability in itself brings great expectations of social policy and gerontological planning . Types of vulnerability include social, cognitive, environmental, emotional or military. CDC/ATSDR Social Vulnerability Index variables grouped into four themes"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Exposure", "label": "Exposure", "shape": "dot", "size": 12, "title": "\u003cb\u003eExposure\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Exposure Wikipedia URL: Exposure Exposure or Exposures may refer to:"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Resilience", "label": "Resilience", "shape": "dot", "size": 12, "title": "\u003cb\u003eResilience\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Resilience Wikipedia URL: Resilience Resilience , resilient , or resiliency may refer to:"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Sustainable development", "label": "Sustainable development", "shape": "dot", "size": 12, "title": "\u003cb\u003eSustainable development\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Sustainable development Wikipedia URL: Sustainable development Sustainable development is an approach to growth and human development that aims to meet the needs of the present without compromising the ability of future generations to meet their own needs. The aim is to have a society where living conditions and resources meet human needs without undermining planetary integrity . Sustainable development aims to balance the needs of the economy , environment , and society. Sustainable development aims to balance the needs of the economy, environment, and society. Equitable health access is a pillar of social sustainability. The Brundtland Report in 1987 helped to make the concept of sustainable development better known. Three visual representations of sustainability and its three dimensions. The left image shows sustainability as three intersecting circles. The top right is a nested approach where social and economic sustainability are contained within environmental sustain"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "United Nations Framework Convention on Climate Change", "label": "United Nations Framework Convention on Climate Change", "shape": "dot", "size": 18, "title": "\u003cb\u003eUnited Nations Framework Convention on Climate Change\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: United Nations Framework Convention on Climate Change Wikipedia URL: United Nations Framework Convention on Climate Change The United Nations Framework Convention on Climate Change ( UNFCCC ) is the UN process for negotiating an agreement to limit dangerous climate change. It is an international treaty among countries to combat \"dangerous human interference with the climate system \". The main way to do this is limiting the increase in greenhouse gases in the atmosphere . It was signed in 1992 by 154 states at the United Nations Conference on Environment and Development (UNCED), informally known as the Earth Summit , held in Rio de Janeiro . The treaty entered into force on 21 March 1994. \"UNFCCC\" is also the name of the Secretariat charged with supporting the operation of the convention, with offices on the UN Campus in Bonn , Germany."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Kyoto Protocol", "label": "Kyoto Protocol", "shape": "dot", "size": 14, "title": "\u003cb\u003eKyoto Protocol\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Kyoto Protocol Wikipedia URL: Kyoto Protocol The Kyoto Protocol ( Japanese : \u4eac\u90fd\u8b70\u5b9a\u66f8 , Hepburn : Ky\u014dto Giteisho ) was an international treaty which extended the 1992 United Nations Framework Convention on Climate Change (UNFCCC) that commits state parties to reduce greenhouse gas emissions , based on the scientific consensus that global warming is occurring and that human-made CO 2 emissions are driving it. The Kyoto Protocol was adopted in Kyoto , Japan, on 11 December 1997 and entered into force on 16 February 2005. There were 192 parties ( Canada withdrew from the protocol, effective December 2012) to the Protocol in 2020. Kyoto International Conference Center"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Climate mitigation", "label": "Climate mitigation", "shape": "dot", "size": 14, "title": "\u003cb\u003eClimate mitigation\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Climate mitigation Wikipedia URL: Climate mitigation Climate change mitigation , also called climate change decarbonisation , is an action to limit the greenhouse gases in the atmosphere that cause climate change . Climate change mitigation actions include conserving energy and replacing fossil fuels with clean energy sources . Secondary mitigation strategies include changes to land use and removing carbon dioxide (CO 2 ) from the atmosphere. 2022 assessments emphasize that global greenhouse gas emissions must peak before 2025 and decline by about 43% by 2030 to limit warming to 1.5 \u00b0C, requiring rapid transitions in energy, transport, and land-use systems. Global greenhouse gas emission scenarios, based on policies and pledges as of 11/21"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Carbon budget", "label": "Carbon budget", "shape": "dot", "size": 12, "title": "\u003cb\u003eCarbon budget\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Carbon budget Wikipedia URL: Carbon budget A carbon budget is a concept used in politics of climate change to help set greenhouse gas emissions reduction targets in a fair and effective way. It examines the \"maximum amount of cumulative net global anthropogenic carbon dioxide (CO 2 ) emissions that would result in limiting global warming to a given level\". It can be expressed relative to the pre-industrial period (the year 1750). In this case, it is the total carbon budget. Or it can be expressed from a recent specified date onwards. In that case it is the remaining carbon budget . This figure depicts the rates at which global CO 2 emissions must decline after 2024 to limit the global temperature increase to 1.5, 1.7, or 2.0 degrees Celsius without relying on net-negative emissions."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Carbon sequestration", "label": "Carbon sequestration", "shape": "dot", "size": 18, "title": "\u003cb\u003eCarbon sequestration\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Carbon sequestration Wikipedia URL: Carbon sequestration Carbon sequestration is a natural process of storing carbon in a carbon pool . It plays a crucial role in effectively managing the global carbon cycle and limiting climate change by reducing the amount of carbon dioxide in the atmosphere . There are two main types of carbon sequestration: biologic (also called biosequestration ) and geologic. Geologic and biologic carbon sequestration of excess carbon dioxide in the atmosphere emitted by human activities"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Afforestation", "label": "Afforestation", "shape": "dot", "size": 14, "title": "\u003cb\u003eAfforestation\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Afforestation Wikipedia URL: Afforestation Afforestation is the establishment of a forest or stand of trees in an area where there was no recent tree cover. There are three types of afforestation: natural regeneration , agroforestry and tree plantations . In the context of climate change , afforestation can be helpful for climate change mitigation through the route of carbon sequestration . Afforestation can also improve the local climate through increased rainfall and by being a barrier against high winds. The additional trees can also prevent or reduce topsoil erosion (from water and wind), floods and landslides. Finally, additional trees can be a habitat for wildlife, and provide employment and wood products. An afforestation project in Rand Wood, Lincolnshire , England (this patch was open ground before)"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Reforestation", "label": "Reforestation", "shape": "dot", "size": 12, "title": "\u003cb\u003eReforestation\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Reforestation Wikipedia URL: Reforestation Reforestation is the practice of restoring previously existing forests and woodlands that have been destroyed or damaged. The prior forest destruction might have happened through deforestation , clearcutting or wildfires . Three important purposes of reforestation programs are for harvesting of wood , for climate change mitigation , and for ecosystem and habitat restoration purposes. One method of reforestation is to establish tree plantations , also called plantation forests. They cover about 131 million ha worldwide, which is 3% of the global forest area and 45% of the total area of planted forests. A forest, six years after reforestation efforts in Panama ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Renewable energy", "label": "Renewable energy", "shape": "dot", "size": 18, "title": "\u003cb\u003eRenewable energy\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Renewable energy Wikipedia URL: Renewable energy Renewable energy (also called green energy ) is energy made from renewable natural resources that are replenished on a human timescale . The most widely used renewable energy types are solar energy , wind power , and hydropower . Bioenergy and geothermal power are also significant in some countries. Renewable energy installations can be large or small and are suited for both urban and rural areas. Renewable energy is often deployed together with further electrification . This has several benefits: electricity can move heat and vehicles efficiently and is clean at the point of consumption. Variable renewable energy sources are those that have a fluctuating nature, such as wind power and solar power. In contrast, controllable renewable energy sources include dammed hydroelectricity , bioenergy , or geothermal power . Percentages of various types of sources in the top renewable energy-producing countries across each geographica"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Solar power", "label": "Solar power", "shape": "dot", "size": 12, "title": "\u003cb\u003eSolar power\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Solar power Wikipedia URL: Solar power Solar power , also known as solar electricity , is the conversion of energy from sunlight into electricity , either directly using photovoltaics (PV) or indirectly using concentrated solar power . Solar panels use the photovoltaic effect to convert light into an electric current . Concentrated solar power systems use lenses or mirrors and solar tracking systems to focus a large area of sunlight to a hot spot, often to drive a steam turbine . Schematics of a grid-connected residential PV power system"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Wind power", "label": "Wind power", "shape": "dot", "size": 14, "title": "\u003cb\u003eWind power\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Wind power Wikipedia URL: Wind power Wind power is the use of wind energy to generate useful work. Historically, wind power was used by sails , windmills and windpumps , but today it is mostly used to generate electricity . This article deals only with wind power for electricity generation. Today, wind power is generated almost completely using wind turbines , generally grouped into wind farms and connected to the electrical grid . Wind farm in Xinjiang , China"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Hydropower", "label": "Hydropower", "shape": "dot", "size": 16, "title": "\u003cb\u003eHydropower\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Hydropower Wikipedia URL: Hydropower Hydropower (from Ancient Greek \u1f51\u03b4\u03c1\u03bf -, \"water\"), also known as water power or water energy , is the use of falling or fast-running water to produce electricity or to power machines. This is achieved by converting the gravitational potential or kinetic energy of a water source to produce power. Hydropower is a method of sustainable energy production. Hydropower is now used principally for hydroelectric power generation , and is also applied as one half of an energy storage system known as pumped-storage hydroelectricity . The Three Gorges Dam in China; the hydroelectric dam is the world\u0027s largest power station by installed capacity ."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Energy transition", "label": "Energy transition", "shape": "dot", "size": 20, "title": "\u003cb\u003eEnergy transition\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMain Topic\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Energy transition Wikipedia URL: Energy transition An energy transition (or energy system transformation ) is a major structural change to energy supply and consumption in an energy system . Currently, a transition to sustainable energy is underway to limit climate change . Most of the sustainable energy is renewable energy. Therefore, another term for energy transition is renewable energy transition . The current transition aims to reduce greenhouse gas emissions from energy quickly and sustainably, mostly by phasing-down fossil fuels and changing as many processes as possible to operate on low carbon electricity . A previous energy transition perhaps took place during the Industrial Revolution from 1760 onwards, from wood and other biomass to coal , followed by oil and later natural gas . Progress of current energy transition to renewable energy: Fossil fuels such as coal, oil, and natural gas still remain the world\u0027s primary energy sources, even as renewables are increa"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Climate justice", "label": "Climate justice", "shape": "dot", "size": 12, "title": "\u003cb\u003eClimate justice\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Climate justice Wikipedia URL: Climate justice Climate justice is a type of environmental justice that focuses on the unequal impacts of climate change on marginalized or otherwise vulnerable populations. Climate justice seeks to achieve an equitable distribution of both the burdens of climate change and the efforts to mitigate climate change through advocacy and policy change. The economic burden of climate change mitigation is estimated by some at around 1% to 2% of GDP . Climate justice examines concepts such as equality , human rights , collective rights , justice and the historical responsibilities for climate change. Fridays for Future demonstration in Berlin in September 2021 with the slogan \"fight for climate justice\""}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Climate finance", "label": "Climate finance", "shape": "dot", "size": 16, "title": "\u003cb\u003eClimate finance\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Climate finance Wikipedia URL: Climate finance Climate finance is an umbrella term for financial resources such as loans, grants, or domestic budget allocations for climate change mitigation , adaptation or resiliency . Finance can come from private and public sources. It can be channeled by various intermediaries such as multilateral development banks or other development agencies. Those agencies are particularly important for the transfer of public resources from developed to developing countries in light of UN Climate Convention obligations that developed countries have. Investments in sustainable energy (clean energy) is an example of climate finance. It has increased due to high fossil fuel prices and growing policy support across various nations. By 2025, investment in the energy transition had grown to about twice that for fossil fuels (oil, natural gas and coal)."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Loss and damage (climate policy)", "label": "Loss and damage (climate policy)", "shape": "dot", "size": 12, "title": "\u003cb\u003eLoss and damage (climate policy)\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Loss and damage (climate policy) Wikipedia URL: Loss and damage (climate policy) The page \" Loss and damage (climate policy) \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Nationally Determined Contributions", "label": "Nationally Determined Contributions", "shape": "dot", "size": 16, "title": "\u003cb\u003eNationally Determined Contributions\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Nationally Determined Contributions Wikipedia URL: Nationally Determined Contributions The nationally determined contributions ( NDCs ) are commitments that countries make to reduce their greenhouse gas emissions as part of climate change mitigation . These commitments include the necessary policies and measures for achieving the global targets set out in the Paris Agreement . The Paris Agreement has a long-term temperature goal which is to keep the rise in global surface temperature to well below 2 \u00b0C (3.6 \u00b0F) above pre-industrial levels. The treaty also states that preferably the limit of the increase should only be 1.5 \u00b0C (2.7 \u00b0F). To achieve this temperature goal, greenhouse gas emissions should be reduced as soon as, and by as much as, possible. To stay below 1.5 \u00b0C of global warming, emissions need to be cut by roughly 50% by 2030. This figure takes into account each country\u0027s documented pledges or NDCs. Probability that countries achieve their Paris Agreement Goals "}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Emission scenario", "label": "Emission scenario", "shape": "dot", "size": 12, "title": "\u003cb\u003eEmission scenario\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Emission scenario Wikipedia URL: Emission scenario A climate change scenario is a hypothetical future based on a \"set of key driving forces\". Scenarios explore the long-term effectiveness of mitigation and adaptation . Scenarios help to understand what the future may hold. They can show which decisions will have the most meaningful effects on mitigation and adaptation . Four climate change scenarios, based on 2015 data. Left: emissions pathways following the scenarios of (1) no policy, (2) current policy, (3) meeting the governments\u2019 announcements with constant country decarbonization rates past 2030, and (4) meeting the governments\u2019 announcements with higher rates of decarbonization past 2030. Right: global temperatures, depending on the amount of greenhouse gases emitted in each of the four scenarios."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Radiative equilibrium", "label": "Radiative equilibrium", "shape": "dot", "size": 12, "title": "\u003cb\u003eRadiative equilibrium\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Radiative equilibrium Wikipedia URL: Radiative equilibrium Radiative equilibrium is the condition where the total thermal radiation leaving an object is equal to the total thermal radiation entering it. It is one of the several requirements for thermodynamic equilibrium , but it can occur in the absence of thermodynamic equilibrium. There are various types of radiative equilibrium, which is itself a kind of dynamic equilibrium ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Climate tipping point", "label": "Climate tipping point", "shape": "dot", "size": 16, "title": "\u003cb\u003eClimate tipping point\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Climate tipping point Wikipedia URL: Climate tipping point In climate science , a tipping point is a critical threshold that, when crossed, leads to large, accelerating and often irreversible changes in the climate system . If tipping points are crossed, they are likely to have severe impacts on human society and may accelerate global warming . Tipping behavior is found across the climate system, for example in ice sheets , mountain glaciers , circulation patterns in the ocean , in ecosystems , and the atmosphere. Examples of tipping points include thawing permafrost , which will release methane , a powerful greenhouse gas , or melting ice sheets and glaciers reducing Earth\u0027s albedo , which would warm the planet faster. Thawing permafrost is a threat multiplier because it holds roughly twice as much carbon as the amount currently circulating in the atmosphere. Map showing global and regional tipping elements: if the global temperature increases past a certain point (color-"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Permafrost thaw", "label": "Permafrost thaw", "shape": "dot", "size": 16, "title": "\u003cb\u003ePermafrost thaw\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Permafrost thaw Wikipedia URL: Permafrost thaw Permafrost (from perma- \u0027 permanent \u0027 and frost ) is soil or underwater sediment which continuously remains below 0 \u00b0C (32 \u00b0F) for two years or more; the oldest permafrost has been continuously frozen for around 700,000 years. Whilst the shallowest permafrost has a vertical extent of below a meter (3 ft), the deepest is greater than 1,500 m (4,900 ft). Similarly, the area of individual permafrost zones may be limited to narrow mountain summits or extend across vast Arctic regions. The ground beneath glaciers and ice sheets is not usually defined as permafrost, so on land, permafrost is generally located beneath a so-called active layer of soil which freezes and thaws depending on the season."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Methane emissions", "label": "Methane emissions", "shape": "dot", "size": 12, "title": "\u003cb\u003eMethane emissions\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Methane emissions Wikipedia URL: Methane emissions Increasing methane emissions are a major contributor to the rising concentration of greenhouse gases in Earth\u0027s atmosphere , and are responsible for up to one-third of near-term global heating . During 2019, about 60% (360 million tons) of methane released globally was from human activities, while natural sources contributed about 40% (230 million tons). Reducing methane emissions by capturing and utilizing the gas can produce simultaneous environmental and economic benefits. The main sources of methane for the decade 2008\u20132017, estimated by the Global Carbon Project"}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Carbon sink", "label": "Carbon sink", "shape": "dot", "size": 20, "title": "\u003cb\u003eCarbon sink\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMain Topic\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Carbon sink Wikipedia URL: Carbon sink A carbon sink is a natural or artificial carbon sequestration process that \"removes a greenhouse gas , an aerosol or a precursor of a greenhouse gas from the atmosphere \". These sinks form an important part of the natural carbon cycle . An overarching term is carbon pool , which is all the places where carbon on Earth can be, i.e. the atmosphere , oceans , soil , florae , fossil fuel reservoirs and so forth. A carbon sink is a type of carbon pool that has the capability to take up more carbon from the atmosphere than it releases. Carbon sinks (green bars on the right) remove carbon from the atmosphere, whereas carbon sources ( greenhouse gas emissions ) (grey bars on the left) add them. Since the 1850s, there are more carbon sources than sinks and therefore the carbon dioxide in Earth\u0027s atmosphere is rising."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Ocean circulation", "label": "Ocean circulation", "shape": "dot", "size": 16, "title": "\u003cb\u003eOcean circulation\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Ocean circulation Wikipedia URL: Ocean circulation An ocean current is a continuous, directed movement of seawater generated by a number of forces acting upon the water, including wind, the Coriolis effect , breaking waves , cabbeling , and temperature and salinity differences. Depth contours
