, shoreline configurations, and interactions with other currents influence a current\u0027s direction and strength. Ocean currents move both horizontally, on scales that can span entire oceans, as well as vertically, with vertical currents ( upwelling and downwelling ) playing an important role in the movement of nutrients and gases, such as carbon dioxide, between the surface and the deep ocean. Ocean surface currents"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "ENSO", "label": "ENSO", "shape": "dot", "size": 14, "title": "\u003cb\u003eENSO\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: ENSO Wikipedia URL: ENSO El Ni\u00f1o\u2013Southern Oscillation ( ENSO ) is a global climate phenomenon that emerges from variation in winds and sea surface temperatures over the tropical Pacific Ocean . Those variations have an irregular pattern but do have some semblance of cycles. The occurrence of ENSO is not predictable. It affects the climate of much of the tropics and subtropics , and has links ( teleconnections ) to higher-latitude regions of the world. The warming phase of the sea surface temperature is known as \" El Ni\u00f1o \" and the cooling phase as \" La Ni\u00f1a \". The Southern Oscillation is the accompanying atmospheric oscillation , which is coupled with the sea temperature change. Southern Oscillation Index timeseries from 1876 to 2025. The Southern Oscillation is the atmospheric component of El Ni\u00f1o. This component is an oscillation in surface air pressure between the tropical eastern and the western Pacific Ocean waters."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Atlantic Multidecadal Oscillation", "label": "Atlantic Multidecadal Oscillation", "shape": "dot", "size": 14, "title": "\u003cb\u003eAtlantic Multidecadal Oscillation\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Atlantic Multidecadal Oscillation Wikipedia URL: Atlantic Multidecadal Oscillation The Atlantic Multidecadal Oscillation ( AMO ), also known as Atlantic Multidecadal Variability ( AMV ), is the theorized variability of the sea surface temperature (SST) of the North Atlantic Ocean on the timescale of several decades. Atlantic multidecadal oscillation spatial pattern obtained as the regression of monthly HadISST sea surface temperature anomalies (1870\u20132013)."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Pacific Decadal Oscillation", "label": "Pacific Decadal Oscillation", "shape": "dot", "size": 12, "title": "\u003cb\u003ePacific Decadal Oscillation\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Pacific Decadal Oscillation Wikipedia URL: Pacific Decadal Oscillation The Pacific decadal oscillation ( PDO ) is a robust, recurring pattern of ocean-atmosphere climate variability centered over the mid-latitude Pacific basin. The PDO is detected as warm or cool surface waters in the Pacific Ocean, north of 20\u00b0N. Over the past century, the amplitude of this climate pattern has varied irregularly at interannual-to-interdecadal time scales (meaning time periods of a few years to as much as time periods of multiple decades). There is evidence of reversals in the prevailing polarity (meaning changes in cool surface waters versus warm surface waters within the region) of the oscillation occurring around 1925, 1947, and 1977; the last two reversals corresponded with dramatic shifts in salmon production regimes in the North Pacific Ocean . This climate pattern also affects coastal sea and continental surface air temperatures from Alaska to California . PDO positive phase global "}]);

<script>
// Search functionality
document.getElementById("searchButton").onclick = function() {
  var query = document.getElementById("searchInput").value.trim().toLowerCase();
  if (!query) return;

  var nodes = network.body.data.nodes.get();
  var found = nodes.find(n => n.label.toLowerCase() === query);

  if (found) {
    network.focus(found.id, {scale: 1.6, animation: true});
    network.selectNodes([found.id]);
  }

  document.getElementById("searchInput").value = "";
};

document.getElementById("searchInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    document.getElementById("searchButton").click();
  }
});
</script>
