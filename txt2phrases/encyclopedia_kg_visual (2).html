r:#ddd;line-height:1.4;\u0027\u003esearch term: anthracnose Wikipedia URL: Anthracnose A plant canker is a small area of dead tissue, which grows slowly, often over years. Some cankers are of only minor consequence, but others are ultimately lethal and therefore can have major economic implications for agriculture and horticulture . Their causes include a wide range of organisms such as fungi , bacteria , mycoplasmas and viruses . The majority of canker-causing organisms are bound to a unique host species or genus , but a few wil...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "antioxidants", "label": "antioxidants", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/d6/Glutathione-skeletal.svg/250px-Glutathione-skeletal.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eantioxidants\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: antioxidants Wikipedia URL: Antioxidants Antioxidants are compounds that inhibit oxidation , a chemical reaction that can produce free radicals . Autoxidation leads to degradation of organic compounds, including living matter. Antioxidants are frequently added to industrial products, such as polymers , fuels , and lubricants , to extend their usable lifetimes. Foods are also treated with antioxidants to prevent spoilage , in particular the rancidification of oils and fats . In cells...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Anuj Kumar", "label": "Anuj Kumar", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max t-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: aromatic plants Wikipedia URL: Aromatic plants Essential oils are compodes of hydrophobic volatile organic compounds , usually in liquid form, obtained from plant material. Essential oils are also known as volatile oils , ethereal oils , aetheroleum , or simply as the oil of the plant from which they were extracted, such as oil of clove . An essential oil is essential in the sense that the oil contains the fragrance or essence of the plant. The term \"essential\" used here does not in...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Artificial Intelligence", "label": "Artificial Intelligence", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/64/Dall-e_3_%28jan_%2724%29_artificial_intelligence_icon.png/120px-Dall-e_3_%28jan_%2724%29_artificial_intelligence_icon.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eArtificial Intelligence\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Artificial Intelligence Wikipedia URL: Artificial Intelligence Artificial intelligence ( AI ) is the capability of computational systems to perform tasks typically associated with human intelligence , such as learning , reasoning , problem-solving , perception , and decision-making . It is a field of research in computer science that develops and studies methods and software that enable machines to perceive their environment and use learning and intelligence to take actions that max...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": ine-height:1.4;\u0027\u003esearch term: Bacillus thuringiensis Wikipedia URL: Bacillus thuringiensis Bacillus thuringiensis (or Bt ) is a gram-positive , soil-dwelling bacterium , and is the most commonly used biological pesticide worldwide. B. thuringiensis also occurs naturally in the gut of caterpillars of various types of moths and butterflies , as well as on leaf surfaces, aquatic environments, animal feces, insect-rich environments, flour mills and grain-storage facilities. It has also been observed to parasitize mo...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#66b2ff", "font": {"color": "#FFFFFF"}, "id": "bacteria", "label": "bacteria", "shape": "dot", "size": 16.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/E._coli_Bacteria_%287316101966%29.jpg/250px-E._coli_Bacteria_%287316101966%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ebacteria\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: bacteria Wikipedia URL: Bacteria And see text\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "bacterial blight", "label": "bacterial blight", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ebacterial blight\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: bacterial blight Wikipedia URL: Bacterial blight Blight is a specific symptom affecting plants in response to infection by a pathogen ht:1.4;\u0027\u003esearch term: banana Wikipedia URL: Banana A banana is an elongated, edible fruit \u2014botanically a berry \u2014produced by several kinds of large treelike herbaceous flowering plants in the genus Musa . In some countries, cooking bananas are called plantains, distinguishing them from dessert bananas . The fruit is variable in size, color and firmness, but is usually elongated and curved, with soft flesh rich in starch covered with a peel , which may have a variety of colors when ripe. It grows upward in...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "Bangladesh", "label": "Bangladesh", "shape": "dot", "size": 14.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eBangladesh\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Bangladesh Wikipedia URL: Bangladesh Bangladesh , officially the People\u0027s Republic of Bangladesh , is a country in South Asia . It is the eighth-most populous country in the world and among the most densely populated with a population of over 171 million within an area of 148,460 square kilometres (57,320 sq mi). Bangladesh shares land borders with India to the north, west, and east, and Myanmar to the southeast. It has a coastline along the Bay of Bengal to its south and is separat...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "barley", "label": "barley", "shape": "dot", "size": 14.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/0/09/Barley_Barn_%28cropped%29.jpg/500px-Barley_Barn_%28cropped%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ebarley\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: barley Wikipedia URL: Barley Barley ( Hordeum vulgare ), a member of the grass family , is a major cereal grain grown in temperate climates globally. One of the first cultivated grains , it was domesticated in the Fertile Crescent around 9000 BC, giving it nonshattering spikelets and making it much easier to harvest . Its use then spread throughout Eurasia by 2000 BC. Barley prefers relatively low temperatures and well-drained soil to grow. It is relatively tolerant of drought and s...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Barnyard millet", "label": "Barnyard millet", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/24/Echinochloa_crus-galli_2006.08.27_14.59.37-p8270051.jpg/250px-Echinochloa_crus-galli_2006.08.27_14.59.37-p8270051.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eBarnyard millet\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Barnyard millet Wikipedia URL: Barnyard millet Echinochloa is a very widespread genus of plants in the grass family and tribe Paniceae . Some of the species are known by the common names barnyard grass or cockspur grass.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "basella", "label": "basella", "shape": "dot", "size": 10.6, "title": "\n        \u0 x-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ebean\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: bean Wikipedia URL: Bean A bean is the seed of plants in many genera of the legume family ( Fabaceae ) used as a vegetable for human consumption or animal feed. The seeds are sold fresh or preserved through drying (a pulse ). Beans have been cultivated since the seventh millennium BCE in Thailand, and since the second millennium BCE in Europe and in Peru. Most beans, with the exception of peas, are summer crops. As legumes, the plants fix nitrogen and form seeds with a high protein ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "beekeeping", "label": "beekeeping", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/Beekeeper_2017_Honeybee_Conservancy%2C_College_of_DuPage.jpg/250px-Beekeeper_2017_Honeybee_Conservancy%2C_College_of_DuPage.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ebeekeeping\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: beekeeping Wikipedia URL: Beekeeping Beekeeping (or apiculture , from Latin : apis + culture ) is the maintenance of bee colonies, commonly in artificial beehives . Honey bees in the genus Apis are the most commonly kept species but other honey producing bees such as Melipona stingless bees are also kept. Beekeepers (or apiarists) keep bees to collect honey and other products of the hive: beeswax , propolis , bee pollen , and royal jelly . Other sources of beekeeping income include ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "begomovirus", "label": "begomovirus", "shape": "dot", "size": 13.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/27/Abutilon_pictum_serres_du_Luxembourg.jpg/250px-Abutilon_pictum_serres_du_Luxembourg.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ebegomovirus\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: begomovirus Wikipedia URL: Begomovirus Begomovirus is a genus of viruses , in the family Geminiviridae . They are plant viruses that as a group have a very wide host range, infecting dicotyledonous plants. Worldwide they are responsible for a considerable amount of economic damage to many important crops such as tomatoes , beans , squash , cassava and cotton . There are 464 species in this genus.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "bell pepper", "label": "bell pepper", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/Colorful_Bell_Peppers.JPG/250px-Colorful_Bell_Peppers.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ebell pepper\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: bell pepper Wikipedia URL: Bell pepper The bell pepper (also known as sweet pepper , paprika , pepper , capsicum / \u02c8 k \u00e6 p s \u026a k \u0259 m / or, in some parts of the U.S. Midwest , mango ) is the fruit of plants in the Grossum Group of the species Capsicum annuum . Cultivars of the plant produce fruits in different colors, including red, yellow, orange, green, white, and purple. Bell peppers are sometimes grouped with less pungent chili varieties as \"sweet peppers\". While they are botanic...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "biochar", "label": "biochar", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/c/c6/Biochar_pile.jpg/250px-Biochar_pile.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ebiochar\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: biochar Wikipedia URL: Biochar Biochar is a form of charcoal , sometimes modified, that is intended for organic use, as in soil. It is the lightweight black remnants remaining after the pyrolysis of biomass , consisting of carbon and ashes . Despite its name, biochar is sterile immediately after production and only gains biological life following assisted or incidental exposure to biota. Biochar is defined by the International Biochar Initiative as the \"solid material obtained from ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "Biochemistry", "label": "Biochemistry", "shape": "dot", "size": 13.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Gerty_Theresa_Radnitz_Cori_%281896-1957%29_and_Carl_Ferdinand_Cori_-_restoration1.jpg/250px-Gerty_Theresa_Radnitz_Cori_%281896-1957%29_and_Carl_Ferdinand_Cori_-_restoration1.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eBiochemistry\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Biochemistry Wikipedia URL: Biochemistry Biochemistry , or biological chemistry (distinct from chemical biology ), is the study of chemical processes within and relating to living organisms . A sub-discipline of both chemistry and biology , biochemistry may be divided into three fields: structural biology , enzymology , and metabolism . Over the last decades of the 20th century, biochemistry has become successful at explaining living processes through these three disciplines. Almost...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "biofertilizers", "label": "biofertilizers", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/Blue-green_algae_cultured_in_specific_media.jpg/250px-Blue-green_algae_cultured_in_specific_media.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ebiofertilizers\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: biofertilizers Wikipedia URL: Biofertilizers A biofertilizer is a substance containing living micro-organisms which, when applied to seeds, plant surfaces, or soil, colonize the rhizosphere or the interior of the plant and promotes growth by increasing the supply or availability of primary nutrients to the host plant. Blue-green algae cultured in specific media. Blue-green algae can be helpful in agriculture as they have the capability to fix atmospheric nitrogen to soil. This nitro...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "biomass", "label": "biomass", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/d6/Rice_chaffs.jpg/250px-Rice_chaffs.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ebiomass\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: biomass Wikipedia URL: Biomass Biomass is material produced by the growth of microorganisms , plants or animals . Beyond this general definition, there are differences in how the term is used and applied depending on industry or subject-matter norms. For example, it may be more narrowly defined as just plant matter, or as a combination of plant and animal matter. A collection of rice husks, an example of lignocellulosic biomass .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Biosafety", "label": "Biosafety", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/8e/Positive-pressure_biosafety_suit.jpg/250px-Positive-pressure_biosafety_suit.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eBiosafety\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Biosafety Wikipedia URL: Biosafety Biosafety is the prevention of large-scale loss of biological integrity , focusing both on ecology and human health . These prevention mechanisms include the conduction of regular reviews of biosafety in laboratory settings, as well as strict guidelines to follow. Biosafety is used to protect from harmful incidents. Many laboratories handling biohazards employ an ongoing risk management assessment and enforcement process for biosafety. Failures to ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Biosecurity", "label": "Biosecurity", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/Influenza_virus_research.jpg/250px-Influenza_virus_research.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eBiosecurity\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Biosecurity Wikipedia URL: Biosecurity Biosecurity refers to measures aimed at preventing the introduction or spread of harmful organisms (e.g. viruses , bacteria , plants , animals etc.) intentionally or unintentionally outside their native range or within new environments. In agriculture , these measures are aimed at protecting food crops and livestock from pests , invasive species , and other organisms not conducive to the welfare of the human population . The term includes biolo...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Biotechnology", "label": "Biotechnology", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/dc/Faculty_of_Food_Engineering_and_Biotechnology_4.jpg/250px-Faculty_of_Food_Engineering_and_Biotechnology_4.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eBiotechnology\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Biotechnology Wikipedia URL: Biotechnology Biotechnology is a multidisciplinary field that involves the integration of natural sciences and engineering sciences in order to achieve the application of organisms and parts thereof for products and services. Specialists in the field are known as biotechnologists . A biologist conducting research in a biotechnology laboratory\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "BIS", "label": "BIS", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eBIS\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: BIS Wikipedia URL: BIS Bis or BIS may refer to:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "BISA", "label": "BISA", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#f width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eblack rust\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: black rust Wikipedia URL: Black rust Stem rust , also known as cereal rust , black rust , red rust or red dust , is caused by the fungus Puccinia graminis , which causes significant disease in cereal crops. Crop species that are affected by the disease include bread wheat , durum wheat , barley and triticale . These diseases have affected cereal farming throughout history. The annual recurrence of stem rust of wheat in North Indian plains was discovered by K. C. Mehta. Since the 195...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Blackgram", "label": "Blackgram", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Mas_Ko_Dal.jpg/250px-Mas_Ko_Dal.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eBlackgram\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Blackgram Wikipedia URL: Blackgram The black gram or urad bean ( Vigna mungo ) is a bean grown in South Asia . Like its relative the mung bean , it has been reclassified from the genus Phaseolus to Vigna . The product sold as black gram is usually the whole urad bean, whereas the split bean (the interior being white) is called white lentil . It should not be confused with the much smaller true black lentil ( Lens culinaris ). Dry split urad beans.\u003c/div\u003e\n        \u003c/div\u003e"}, { ed in 1969. Canara Bank also has offices in London , Dubai and New York .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "capacity building", "label": "capacity building", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/76/Launching_of_the_%E2%80%9CStrengthening_Capacity_and_Institutional_Reform_for_Green_Growth_and_Sustainable_Development_in_Vietnam%E2%80%9D_Project_%2816143587120%29.jpg/250px-Launching_of_the_%E2%80%9CStrengthening_Capacity_and_Institutional_Reform_for_Green_Growth_and_Sustainable_Development_in_Vietnam%E2%80%9D_Project_%2816143587120%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecapacity building\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: capacity building Wikipedia URL: Capacity building Capacity building (or capacity development, capacity strengthening ) is the improvement in an individual\u0027s or organization\u0027s facility (or capability) \"to produce, perform or deploy\". The terms capacity building and capacity development have often been used interchangeably, although a publication by OECD-DAC stated in 2006 that capacity development was the preferable term. Since the 1950s, international organizations, governments, no...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "capsicum", "label": "capsicum", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thu d from the species Brassica oleracea in the genus Brassica , which is in the Brassicaceae (or mustard) family. Cauliflower usually grows with one main stem that carries a large, rounded \"head\" made of tightly clustered, immature white or off-white flower buds called the \"curd\". Typically, only the \"head\" is eaten. Cauliflower plants growing in a nursery\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Central Government", "label": "Central Government", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eCentral Government\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Central Government Wikipedia URL: Central Government A central government is the government that is a controlling power over a unitary state . Another distinct but sovereign political entity is a federal government , which may have distinct powers at various levels of government, authorized or delegated to it by the federation and mutually agreed upon by each of the federated states .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Central Institute", "label": "Central Institute", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/19/HendrixCollegeMainEntrance.JPG/250px-HendrixCollegeMainEntrance.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eCentral Institute\u003c/h3\u003e\n            \u003cdiv style=\u0027font-siz 003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: coconut oil Wikipedia URL: Coconut oil Coconut oil (or coconut fat ) is an edible oil derived from the meat of the coconut palm fruit. Coconut oil is a white solid fat below around 25 \u00b0C (77 \u00b0F), and a clear thin liquid oil at higher temperatures. Unrefined varieties have a distinct coconut aroma. Coconut oil is used as a food oil, and in industrial applications for cosmetics and detergent production. The oil is rich in medium-chain fatty acids . Traditional ( lana ) extraction dire...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "coconut rhinoceros beetle", "label": "coconut rhinoceros beetle", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/5/58/Oryctes_rhinoceros_male.jpg/250px-Oryctes_rhinoceros_male.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecoconut rhinoceros beetle\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: coconut rhinoceros beetle Wikipedia URL: Coconut rhinoceros beetle Oryctes rhinoceros , also known as coconut rhinoceros beetle , Asiatic rhinoceros beetle , and coconut palm rhinoceros beetle , is a large species of beetle (typically 4\u20135 cm long), belonging to the rhinoceros beetles subfamily Dynastinae . Oryctes rhinoceros attacks coconut palms and other palms such as the economically important oil palm . It can cause serious damage to the developing fronds (leaves) up to death of...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "cole crops", "la i,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/77/Colletotrichum_lindemuthianum.jpg/250px-Colletotrichum_lindemuthianum.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eColletotrichum\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Colletotrichum Wikipedia URL: Colletotrichum Colletotrichum (sexual stage: Glomerella ) is a genus of fungi that are symbionts to plants as endophytes (living within the plant) or phytopathogens . Many of the species in this genus are plant pathogens , but some species may have a mutualistic relationship with hosts .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Colletotrichum falcatum", "label": "Colletotrichum falcatum", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eColletotrichum falcatum\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Colletotrichum falcatum Wikipedia URL: Colletotrichum falcatum Glomerella tucumanensis is a species of fungus in the family Glomerellaceae . It is a pathogen of sugarcane responsible for the disease known as red rot of sugarcane, this disease impacts sugarcane production in South and South-East Asia and has spread to 69 countries. It has been responsible for the elimination of many commercial varieties of sugarcane.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "colour", "label": "colour", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/b1/Colouring_pencils.jpg/330px-Colouring_pencils.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecolour\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: colour Wikipedia URL: Colour Color (or colour in Commonwealth English ) is the visual perception produced by the activation of the different types of cone cells in the eye caused by light . Though color is not an inherent property of matter , color perception is related to an object\u0027s light absorption , emission , reflection and transmission . For most humans, visible wavelengths of light are the ones perceived in the visible light spectrum , with three types of cone cells ( trichro...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "commercialization", "label": "commercialization", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecommercialization\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: commercialization Wikipedia URL: Commercialization Commercialisation or commercialization is the process of introducing a new product or production method into commerce \u2014making it available on the market . The term often connotes especially entry into the mass market (as opposed to entry into earlier niche markets ), but it also includes a move from the laboratory into (even limited) commerce. Many technologies begin in a research and development laboratory or in an inventor\u0027s works...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "composting", "label": "composting", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e5/Compost_site_germany.JPG/330px-Compost_site_germany.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecomposting\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: composting Wikipedia URL: Composting Compost is a mixture of ingredients used as plant fertilizer and to improve soil \u0027s physical, chemical, and biological properties. It is commonly prepared by decomposing plant and food waste, recycling organic materials, and manure. The resulting mixture is rich in plant nutrients and beneficial organisms , such as bacteria, protozoa, nematodes, and fungi. Compost improves soil fertility in gardens , landscaping , horticulture , urban agriculture...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "conservation", "label": "conservation", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003econservation\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: conservation Wikipedia URL: Conservation Conservation is the preservation or efficient use of resources, or the conservation of various quantities under physical laws.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "conservation agriculture", "label": "conservation agriculture", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/en/thumb/9/91/Elements_in_an_ecoagriculture_landscape.jpg/960px-Elements_in_an_ecoagriculture_landscape.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003econservation agriculture\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: conservation agriculture Wikipedia URL: Conservation agriculture Conservation agriculture ( CA ) can be defined by a statement given by the Food and Agriculture Organization of the United Nations as \"Conservation Agriculture (CA) is a farming system that can prevent losses of arable land while regenerating degraded lands. It promotes minimum soil disturbance (i.e. no-till farming ), maintenance of a permanent soil cover, and diversification of plant species. It enhances biodiversity...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "constitution", "label": "constitution", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/6f/Constitution_de_l%27an_XII._Page_1_-_Archives_Nationales_-_AE-II-1512.jpg/250px-Constitution_de_l%27an_XII._Page_1_-_Archives_Nationales_-_AE-II-1512.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003econstitution\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: constitution Wikipedia URL: Constitution A constitution , or supreme law , is the aggregate of fundamental principles or established precedents that constitute the legal basis of a polity , organization or other type of entity , and commonly determines how that entity is to be governed. Constitution of the Year XII ( First French Empire )\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Consultancy", "label": "Consultancy", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eConsultancy\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Consultancy Wikipedia URL: Consultancy A consultant (from Latin : consultare \"to deliberate\") is a professional (also known as expert , specialist , see variations of meaning below) who provides advice or services in an area of specialization (generally to medium or large-size corporations). Consulting services generally fall under the domain of professional services , as contingent work .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "conventional tillage", "label": "conventional tillage", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003econventional tillage\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: conventional tillage Wikipedia URL: Conventional tillage Conventional tillage refers to tillage operations considered standard for a specific location and crop and that tend to bury the crop residues ; usually considered as a base for determining the cost effectiveness of erosion control practices.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "copra", "label": "copra", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/Kerala_coconut.jpg/250px-Kerala_coconut.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecopra\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: copra Wikipedia URL: Copra Copra (from Malayalam : \u0d15\u0d4a\u0d2a\u0d4d\u0d30 , Koppara/Kopra ; Kannada : \u0c95\u0cca\u0cac\u0ccd\u0cac\u0cb0\u0cbf , Kobbari ; Telugu : \u0c15\u0c4a\u0c2c\u0c4d\u0c2c\u0c30\u0c3f , Kobbari ; Tamil : \u0b95\u0bca\u0baa\u0bcd\u0baa\u0bb0\u0bc8 , Kopparai ; Sinhala : \u0d9a\u0ddc\u0db4\u0dca\u0db4\u0dbb\u0dcf , Koppara ) is the dried, white flesh of the coconut from which coconut oil is extracted. Traditionally, the coconuts are sun-dried, especially for export, before the oil, also known as copra oil, is pressed out. The oil extracted from copra is rich in lauric acid , making it an important commodity in the...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Coprinopsis", "label": "Coprinopsis", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/30/Coprinopsis_atramentaria_3_-_Lindsey.jpg/250px-Coprinopsis_atramentaria_3_-_Lindsey.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eCoprinopsis\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Coprinopsis Wikipedia URL: Coprinopsis Coprinopsis is a genus of mushrooms in the family Psathyrellaceae . Coprinopsis was split out of the genus Coprinus based on molecular data . The species Coprinopsis cinerea is a model organism for mushroom-forming basidiomycota , and its genome has recently been sequenced completely .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "coreid bug", "label": "coreid bug", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/Anoplocnemis_curvipes.jpg/250px-Anoplocnemis_curvipes.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecoreid bug\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: coreid bug Wikipedia URL: Coreid bug Coreidae is a large family of predominantly sap-sucking insects in the Hemipteran suborder Heteroptera . The name \"Coreidae\" derives from the genus Coreus , which derives from the Ancient Greek \u03ba\u03cc\u03c1\u03b9\u03c2 ( k\u00f3ris ) meaning bug .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "cotton", "label": "cotton", "shape": "dot", "size": 13.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/BALLS_OF_COTTON_%28ANDHRA_-SOUTH_INDIA%29_READY_FOR_HARVEST.jpg/250px-BALLS_OF_COTTON_%28ANDHRA_-SOUTH_INDIA%29_READY_FOR_HARVEST.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecotton\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: cotton Wikipedia URL: Cotton Cotton (from Arabic qutn ) is a soft, fluffy staple fiber that grows in a boll , or protective case, around the seeds of the cotton plants of the genus Gossypium in the mallow family Malvaceae . The fiber is almost pure cellulose and may contain minor percentages of waxes, fats, pectins, and water. Under natural conditions, cotton bolls facilitate the dispersal of the seeds. Cotton ready for harvest in Andhra Pradesh , India.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "cottonseed", "label": "cottonseed", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/Cotton_seeds_-_01.jpg/250px-Cotton_seeds_-_01.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecottonseed\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: cottonseed Wikipedia URL: Cottonseed Cottonseed is the seed of the cotton plant , formed inside the cotton boll . Cottonseed is the source of cottonseed oil and cottonseed meal . Cottonseed, like the rest of the cotton plant, contains high amounts of gossypol that can be toxic to humans. Cottonseed has been historically used as an ersatz protein-rich food in cotton-producing regions, but the modern biofortification of cotton cultivars with tolerable gossypol levels has particular re...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "cowpea", "label": "cowpea", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/d0/BlackEyedPeas.JPG/250px-BlackEyedPeas.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecowpea\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: cowpea Wikipedia URL: Cowpea The cowpea ( Vigna unguiculata ) is an annual herbaceous legume from the genus Vigna . It can be erect, semierect ( trailing ), or climbing . A high level of morphological diversity is found within the species with large variations in the size, shape, and structure of the plant. Four subspecies are recognised, three of which are cultivated. Black-eyed peas , a common name for a cowpea cultivar, are named due to the presence of a distinctive black spot on...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "CPCRI", "label": "CPCRI", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/CPCRI_Main_Building.jpg/250px-CPCRI_Main_Building.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027m a/commons/thumb/f/fd/Crop_Duster.jpg/500px-Crop_Duster.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eCrop Protection\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Crop Protection Wikipedia URL: Crop Protection Pest control is the regulation or management of a species defined as a pest ; such as any animal, plant or fungus that impacts adversely on human activities or environment. The human response depends on the importance of the damage done and will range from tolerance, through deterrence and management, to attempts to completely eradicate the pest. Pest control measures may be performed as part of an integrated pest management strategy. A...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "crop wild relatives", "label": "crop wild relatives", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/d/d9/Wild_emmer_wheat.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecrop wild relatives\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: crop wild relatives Wikipedia URL: Crop wild relatives A crop wild relative ( CWR ) is a wild plant closely related to a domesticated plant . It may be a wild ancestor of the domesticated (cultivated) plant or another closely related taxon . Wild emmer wheat ( Triticum dicoccoides ), a CWR of cultivated wheats ( Triticum spp), can be found in northern Israel .\u003c/div\u003e\n        \u003c/div\u003 search Institute\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Crops Research Institute Wikipedia URL: Crops Research Institute CSIR - Crops Research Institute (CRI) is one of the thirteen (13) research Institutes of the Council for Scientific and Industrial Research of Ghana (CSIR) . CSIR-CRI evolved from the Specialists\u0027 branch of the Gold Coast Department of Agriculture. In 1959, the Specialists\u0027 branch and the Soil and Land Use Survey Department were merged to form the Scientific Services Division of the then Ministry of Agriculture (MOFA) ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Cryopreservation", "label": "Cryopreservation", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/9/95/Cryopreservation_USDA_Gene_Bank.jpg/330px-Cryopreservation_USDA_Gene_Bank.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eCryopreservation\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Cryopreservation Wikipedia URL: Cryopreservation Cryopreservation or cryoconservation is a process where biological material\u2014 cells , tissues , or organs \u2014are frozen to preserve the material for an extended period of time. At low temperatures (typically \u221280 \u00b0C (\u2212112 \u00b0F) or \u2212196 \u00b0C (\u2212321 \u00b0F) using liquid nitrogen ) any cell metabolism which might cause damage to the biological material in question is effectively stopped. Cryopreservation is an effective way to transport biological sa...\u003c/div\u003e\n        \u003c/div\u0 uction during arid or drought conditions. Some plants are naturally adapted to dry conditions , surviving with protection mechanisms such as desiccation tolerance , detoxification , or repair of xylem embolism. Other plants, specifically crops like corn , wheat , and rice , have become increasingly tolerant to drought with new varieties created vi...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "dry season", "label": "dry season", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/3c/Long_shadow_of_a_dead_tree_with_its_branches_on_the_dry_fields_of_Laos_-_landscape.jpg/250px-Long_shadow_of_a_dead_tree_with_its_branches_on_the_dry_fields_of_Laos_-_landscape.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003edry season\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: dry season Wikipedia URL: Dry season The dry season is a yearly period of low rainfall, especially in the tropics . The weather in the tropics is dominated by the tropical rain belt , which moves from the northern to the southern tropics and back over the course of the year. The temperate counterpart to the tropical dry season is summer or winter . Dry season in Laos . Long shadow of a dead tree with its branches on the dry fields of Don Det , a sunny day with blue sky and white clo...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "dryer", "label": "dryer", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n le=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Eastern Ghats Wikipedia URL: Eastern Ghats The Eastern Ghats is a mountain range that stretches 1,750 km (1,090 mi) along the eastern coast of the Indian peninsula . Covering an area of 75,000 km 2 (29,000 sq mi), it traverses the states of Odisha , Telangana , Andhra Pradesh , Karnataka , and Tamil Nadu . The range forms a discontinuous chain of mountains along the eastern edge of the Deccan Plateau , stretching from north of the Mahanadi River in Odisha to Vaigai River in Tamil Na...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Eastern India", "label": "Eastern India", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/East_India.svg/250px-East_India.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eEastern India\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Eastern India Wikipedia URL: Eastern India East India is a region consisting of the Indian states of Bihar , Jharkhand , Odisha and West Bengal and also the union territory of the Andaman and Nicobar Islands . Chhattisgarh is sometimes included, due to its geographical proximity and cultural and economic integration with the Eastern region.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Eastern Uttar Pradesh", "label": "Eastern Uttar Pradesh", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin rgin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eedible oils\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: edible oils Wikipedia URL: Edible oils Cooking oil (also known as edible oil ) is a plant or animal liquid fat used in frying , baking , and other types of cooking . Oil allows higher cooking temperatures than water, making cooking faster and more flavorful, while likewise distributing heat, reducing burning and uneven cooking. It sometimes imparts its own flavor. Cooking oil is also used in food preparation and flavoring not involving heat, such as salad dressings and bread dips.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "elephant foot", "label": "elephant foot", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eelephant foot\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: elephant foot Wikipedia URL: Elephant foot Elephant\u0027s foot may refer to:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "elephant foot yam", "label": "elephant foot yam", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/61/Amorphophallus_Paeoniifolius_g.jpg/250px-Amorphophallus_Paeoniifolius_g.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eelephant foot yam\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: elephant foot yam Wikipedia URL: Elephant foot yam Amorphophallus paeoniifolius , the elephant foot yam or whitespot giant arum , is a tropical plant native to Island Southeast Asia . It is cultivated for its edible tubers in Southeast Asia, South Asia, Madagascar, New Guinea, and the Pacific islands. Because of its production potential and popularity as a vegetable in various cuisines, it can be raised as a cash crop .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Emamectin benzoate", "label": "Emamectin benzoate", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/en/thumb/8/8a/OOjs_UI_icon_edit-ltr-progressive.svg/20px-OOjs_UI_icon_edit-ltr-progressive.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eEmamectin benzoate\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Emamectin benzoate Wikipedia URL: Emamectin benzoate Emamectin is the 4\u2033-deoxy-4\u2033-methylamino derivative of abamectin , a 16-membered macrocyclic lactone produced by the fermentation of the soil actinomycete Streptomyces avermitilis . It is generally prepared as the salt with benzoic acid , emamectin benzoate, which is a white or faintly yellow powder. Emamectin is widely used in the US and Canada as an insecticide because of its chloride channel activation properties.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "EMS", "label": "EMS", "shape": "dot", "size": 10.6, "title": "\n or": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Entomology", "label": "Entomology", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/Insecta_Diversity.jpg/330px-Insecta_Diversity.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eEntomology\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Entomology Wikipedia URL: Entomology Entomology , from Ancient Greek \u1f14\u03bd\u03c4\u03bf\u03bc\u03bf\u03bd ( \u00e9ntomon ), meaning \"insect\", and \u03bb\u03cc\u03b3\u03bf\u03c2 ( l\u00f3gos ), meaning \"study\", is the branch of zoology that focuses on insects . Those who study entomology are known as entomologists. In the past, the term insect was less specific, and historically the definition of entomology would also include the study of animals in other arthropod groups, such as arachnids , myriapods , and crustaceans . The field is also referr...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "entomopathogenic fungi", "label": "entomopathogenic fungi", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/34/Pandora_neoaphidis.jpg/250px-Pandora_neoaphidis.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eentomopathogenic fungi\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: entomopathogenic fungi Wikipedia URL: Entomopathogenic fungi Entomopathogenic fungi are parasitic unicellular or multicellular microorganisms belonging to the kingdom of Fungi , that can infect and seriously disable or kill insects. Green peach aphid , Myzus persicae , killed by the fungus Pandora neoaphidis ( Entomophthoromycota : Entomophthorales ) Scale bar = 0.3 mm\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "entrepreneurship", "label": "entrepreneurship", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/67/Wimbit-Jellinek-Phoenix8hp.jpg/250px-Wimbit-Jellinek-Phoenix8hp.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eentrepreneurship\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: entrepreneurship Wikipedia URL: Entrepreneurship Prescriptive and policy Emil Jellinek-Mercedes (1853\u20131918), here at the steering wheel of his Phoenix Double-Phaeton\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "ery", "label": "ery", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/d8/Cyrillic_letter_Yery_-_uppercase_and_lowercase.svg/250px-Cyrillic_letter_Yery_-_uppercase_and_lowercase.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eery\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: ery Wikipedia URL: Ery Yeru or Eru (\u042b \u044b; italics: \u042b \u044b or \u042b \u044b ; italics: \u042b \u044b ), usually called Y [\u0268] in modern Russian or Yery or Ery historically and in modern Church Slavonic , is a letter in the Cyrillic script . It represents the close central unrounded vowel /\u0268/ (more rear or upper than i) after non-palatalised (hard) consonants in the Belarusian and Russian alphabets .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "External examiner", "label": "External examiner", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/8a/ExamInCosin.jpg/330px-ExamInCosin.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eExternal examiner\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: External examiner Wikipedia URL: External examiner The external examiner plays an important role in degree -level examinations in higher education in the United Kingdom . The external examiner system originated in 1832 with the establishment of the University of Durham , and was then adopted by other British universities in the 19th century before spreading to other countries. Examination at Durham University in 1842, where the external examiner system originated.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "F1 hybrids", "label": "F1 hybrids", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:4
