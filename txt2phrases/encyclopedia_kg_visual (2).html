": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/d1/CIP-Afiche-papa-ingles.jpg/250px-CIP-Afiche-papa-ingles.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epotato\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: potato Wikipedia URL: Potato The potato ( / p \u0259 \u02c8 t e\u026a t o\u028a / ) is a starchy tuberous vegetable native to the Americas that is consumed as a staple food in many parts of the world. Potatoes are underground stem tubers of the plant Solanum tuberosum , a perennial in the nightshade family Solanaceae . Morphology of the potato plant; tubers are forming from stolons .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "potting mixture", "label": "potting mixture", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/0/03/Potting_soil.jpg/250px-Potting_soil.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epotting mixture\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: potting mixture Wikipedia URL: Potting mixture Potting soil or growing media , also known as potting mix or potting compost (UK), is a substrate used to grow plants in containers. The first recorded use of the term is from an 1861 issue of the American Agriculturist . Despite its name, little or no soil is usually used in potting soil. A flowerpot filled with potting soil\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "powdery mildew", "label": "powdery mildew", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/fb/Golovinomyces_sordidus_on_Broadleaf_Plantain_-_Plantago_major_%2844171864324%29.jpg/250px-Golovinomyces_sordidus_on_Broadleaf_Plantain_-_Plantago_major_%2844171864324%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epowdery mildew\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: powdery mildew Wikipedia URL: Powdery mildew Erysiphaceae (commonly known as powdery mildews ) is a family of ascomycete fungi in the order Helotiales . The members of this family are obligate parasites with a superficial mycelium that forms a characteristic white, powdery coating on their host plants .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "PPVFR Act", "label": "PPVFR Act", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/5/55/Emblem_of_India.svg/250px-Emblem_of_India.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ePPVFR Act\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: PPVFR Act Wikipedia URL: PPVFR Act The Protection of Plant Variety and Farmers Right Act, 2001 ( PPVFR Act ) is an Act of the Parliament of India granting intellectual property rights to plant breeders, researchers and farmers who develop new or extant plant varieties. This act received the assent of the President of India on the 30 October 2001.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "praecox", "label": "praecox", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/b9/Chimonanthus_praecox_001.JPG/250px-Chimonanthus_praecox_001.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epraecox\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: praecox Wikipedia URL: Praecox Praecox is a Latin term meaning \"very early\". It is often used as a qualifying adjective in Latin binomials, and could mean \"early flowering\", \"primitive\", \"premature\" or \"early onset\" (in the case of medical conditions). Chimonanthus praecox in January, Karlsruhe Botanical Garden , Germany\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Predominant", "label": "Predominant", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/7f/V_of_V_in_C_four-part_harmony.png/250px-V_of_V_in_C_four-part_harmony.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003 olor": "#FFFFFF"}, "id": "propiconazole", "label": "propiconazole", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/en/thumb/8/8a/OOjs_UI_icon_edit-ltr-progressive.svg/20px-OOjs_UI_icon_edit-ltr-progressive.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epropiconazole\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: propiconazole Wikipedia URL: Propiconazole Propiconazole is a triazole fungicide , also known as a DMI, or demethylation inhibiting fungicide due to its binding with and inhibiting the 14-alpha demethylase enzyme from demethylating a precursor to ergosterol . Without this demethylation step, the ergosterols are not incorporated into the growing fungal cell membranes, and cellular growth is stopped. [ citation needed ]\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Protien", "label": "Protien", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/60/Myoglobin.png/250px-Myoglobin.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eProtien\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Protien Wikipedia URL: Protien Proteins are large biomolecules and macromolecules that comprise one or more long chains of amino acid residues . Proteins perform x\u0027\u003eResistant starch\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Resistant starch Wikipedia URL: Resistant starch Resistant starch ( RS ) is starch , including its degradation products, that escapes (resists) digestion in the small intestine of healthy individuals. Resistant starch occurs naturally in foods, but it can also be added as part of dried raw foods or used as an additive in manufactured foods. It is considered to be one of three starch types, along with rapidly digested starch and slowly digested starch. All three may affect levels of ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "rhinoceros beetle", "label": "rhinoceros beetle", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/Dynastinae.jpg/250px-Dynastinae.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003erhinoceros beetle\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: rhinoceros beetle Wikipedia URL: Rhinoceros beetle Dynastinae or rhinoceros beetles are a subfamily of the scarab beetle family (Scarabaeidae), named for their rhinoceros -like horns. Other common names \u2013 some for particular groups of rhinoceros beetles \u2013 include Hercules beetles , unicorn beetles or horn beetles . Over 1,500 species and 225 genera of rhinoceros beetles are known.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#66b2ff", "font": {"color": "#FFFFFF"}, "id": "rice", "label": "rice", "shape": "dot", "size": 22.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/0/0a/20201102.Hengnan.Hybrid_rice_Sanyou-1.6.jpg/500px-20201102.Hengnan.Hybrid_rice_Sanyou-1.6.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003erice\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: rice Wikipedia URL: Rice Rice is a cereal grain and in its domesticated form is the staple food of over half of the world\u0027s population , particularly in Asia and Africa . Rice is the seed of the grass species Oryza sativa (Asian rice)\u2014or, much less commonly, Oryza glaberrima (African rice). Asian rice was domesticated in China some 13,500 to 8,200 years ago; African rice was domesticated in Africa about 3,000 years ago. Rice has become commonplace in many cultures worldwide; in 2023...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "rice bean", "label": "rice bean", "shape": "dot", "size": 14.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/%E8%B5%A4%E5%B0%8F%E8%B1%86.jpg/250px-%E8%B5%A4%E5%B0%8F%E8%B1%86.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003erice bean\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: rice bean Wikipedia URL: Rice bean Vigna umbellata , previously Phaseolus calcaratus , is a warm-season annual vine legume with yellow flowers and small edible beans . It is commonly called ricebean or rice bean . To date, it is little known, little researched, and little exploited. It is regarded as a minor food and fodder crop and is often grown as intercrop or mixed crop with maize ( Zea mays ), sorghum ( Sorghum bicolor ) or cowpea ( V. unguiculata ), as well as a sole crop in t...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "rice cultivation", "label": "rice cultivation", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/9/90/KITLV_40091_-_Kassian_C%C3%A9phas_-_Relief_of_the_hidden_base_of_Borobudur_-_1890-1891.jpg/330px-KITLV_40091_-_Kassian_C%C3%A9phas_-_Relief_of_the_hidden_base_of_Borobudur_-_1890-1891.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003erice cultivation\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: rice cultivation Wikipedia URL: Rice cultivation The history of rice cultivation is an interdisciplinary subject that studies archaeological and documentary evidence to explain how rice was first domesticated and cultivated by humans, the spread of cultivation to different regions of the planet, and the technological changes that have impacted cultivation over time. Bas-relief at Karmawibhanga Museum in Central Java of 9th century Borobudur describes rice barn and rice plants being ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "rice moth", "label": "rice moth", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/5/57/Corcyra_cephalonica_female.jpg/250px-Corcyra_cephalonica_female.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003erice moth\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: rice moth Wikipedia URL: Rice moth The rice moth ( Corcyra cephalonica ) is a moth of the family Pyralidae . This small moth can become a significant pest . Its caterpillars feed on dry plantstuffs such as seeds , including cereals (e.g. rice ). Other recorded foods are flour and dried fruits .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "rice straw", "label": "rice straw", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/5/51/Rice_straw.jpg/250px-Rice_straw.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003erice straw\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: rice straw Wikipedia URL: Rice straw Straw is an agricultural byproduct consisting of the dry stalks of cereal plants after the grain and chaff have been removed. It makes up about half of the yield by weight of cereal crops such as barley , oats , rice , rye and wheat . It has a number of different uses, including fuel , livestock bedding and fodder , thatching and basket making . Bundles of rice straw\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "rice varieties", "label": "rice varieties", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/ba/Rice_grains_%28IRRI%29.jpg/250px-Rice_grains_%28IRRI%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003erice varieties\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: rice varieties Wikipedia URL: Rice varieties This is a list of rice cultivars , also known as rice varieties . There are several species of grain called rice. Asian rice ( Oryza sativa) is most widely known and most widely grown, with two major subspecies ( indica and japonica ) and over 40,000 varieties. Also included in this list are varieties of African rice ( Oryza glaberrima ) and wild rice (genus Zizania ). Rice can come in many shapes, colours and sizes.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "ridge gourd", "label": "ridge gourd", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/7d/Luffa_aegyptica.jpg/250px-Luffa_aegyptica.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eridge gourd\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: ridge gourd Wikipedia URL: Ridge gourd Luffa is a genus of tropical and subtropical vines in the pumpkin , squash and gourd family ( Cucurbitaceae ).\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Rights", "label": "Rights", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Brueghel_Jan_II_God_creating.jpg/250px-Brueghel_Jan_II_God_creating.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eRights\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Rights Wikipedia URL: Rights Rights are legal , social, or ethical principles of freedom or entitlement ; that is, rights are the fundamental normative rules about what is allowed of people or owed to people according to some legal system, social convention , or ethical theory. Rights are an important concept in law and ethics , especially theories of justice and deontology . According to some views, certain rights derive from deities or nature .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "RNF5", "label": "RNF5", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eRNF5\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: RNF5 Wikipedia URL: RNF5 ENSG00000225452 ENSG00000228405\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "robustum", "label": "robustum", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003erobustum\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: robustum Wikipedia URL: Robustum Robustum nodum is the one species of a problematic genus of Ordovician hemithecellid mollusc proposed by Stinchcomb and Darrough in 1995. Its similarities to Matthevia were outlined by Vendrasco \u0026 Runnegar.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Rock phosphate", "label": "Rock phosphate", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/1f/Peloidal_phosphorite_Phosphoria_Formation_Simplot_Mine_Idaho.jpg/250px-Peloidal_phosphorite_Phosphoria_Formation_Simplot_Mine_Idaho.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eRock phosphate\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Rock phosphate Wikipedia URL: Rock phosphate Phosphorite , phosphate rock or rock phosphate is a non- detrital sedimentary rock that contains high amounts of phosphate minerals . The phosphate content of phosphorite (or grade of phosphate rock) varies greatly, from 4% to 20% phosphorus pentoxide (P 2 O 5 ). Marketed phosphate rock is enriched (\"beneficiated\") to at least 28%, often more than 30% P 2 O 5 . This occurs through washing, screening, deliming, magnetic separation or flota...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Root Crops", "label": "Root Crops", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/CarrotDiversityLg.jpg/330px-CarrotDiversityLg.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eRoot Crops\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Root Crops Wikipedia URL: Root crops Root vegetables are underground plant parts eaten by humans or animals as food . In agricultural and culinary terminology, the term applies to true roots , such as taproots and root tubers , as well as non-roots such as bulbs , corms , rhizomes , and stem tubers . Carrot roots come in various shapes and colors\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "root knot nematode", "label": "root knot nematode", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e6/A_juvenile_root-knot_nematode_%28Meloidogyne_incognita%29_penetrates_a_tomato_root_-_USDA-ARS.jpg/250px-A_juvenile_root-knot_nematode_%28Meloidogyne_incognita%29_penetrates_a_tomato_root_-_USDA-ARS.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eroot knot nematode\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: root knot nematode Wikipedia URL: Root knot nematode Root-knot nematodes are plant- parasitic nematodes from the genus Meloidogyne . They exist in soil in areas with hot climates or short winters. About 2000 species of plants worldwide are susceptible to infection by root-knot nematodes and they cause approximately 5% of global crop loss . Root-knot nematode larvae infect plant roots , causing the development of root-knot galls that drain the plant\u0027s photosynthate and nutrients. Inf...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "root rot", "label": "root rot", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/Root_rot_in_cicer_arietinum_%28hydro-grown%29.jpg/250px-Root_rot_in_cicer_arietinum_%28hydro-grown%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eroot rot\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: root rot Wikipedia URL: Root rot Root rot is a condition in which anoxic conditions in the soil or potting media around the roots of a plant cause them to rot. This occurs due to excessive standing water around the roots. It is found in both indoor and outdoor plants, although it is more common in indoor plants due to overwatering, heavy potting media, or containers with poor drainage . The leaves of plants experiencing root rot often yellow and die, and if allowed to continue, the ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "rust", "label": "rust", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/Rust_on_iron.jpg/500px-Rust_on_iron.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003erust\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: rust Wikipedia URL: Rust Rust is an iron oxide , a usually reddish-brown oxide formed by the reaction of iron and oxygen in the catalytic presence of water or air moisture . Rust consists of hydrous iron(III) oxides (Fe 2 O 3 \u00b7nH 2 O) and iron(III) oxide-hydroxide (FeO(OH), Fe(OH) 3 ), and is typically associated with the corrosion of refined iron . Colors and porous surface texture of rust\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Saccharum", "label": "Saccharum", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/74/Saccharum_officinarum_-_K%C3%B6hler%E2%80%93s_Medizinal-Pflanzen-125.jpg/250px-Saccharum_officinarum_-_K%C3%B6hler%E2%80%93s_Medizinal-Pflanzen-125.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eSaccharum\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Saccharum Wikipedia URL: Saccharum Saccharum is a genus of tall perennial plants of the broomsedge tribe within the grass family .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "safflower", "label": "safflower", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://uploa obal consulting. At its height in the fall of 2000, it had quarterly revenues of US$100 million, 1,180 employees and a stock price of US$133. In August 20...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Sclerostachya", "label": "Sclerostachya", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/Japanese_pampas_grass_%E3%82%B9%E3%82%B9%E3%82%AD%E3%81%AE%E7%A9%82%E6%B3%A2PB080105.jpg/250px-Japanese_pampas_grass_%E3%82%B9%E3%82%B9%E3%82%AD%E3%81%AE%E7%A9%82%E6%B3%A2PB080105.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eSclerostachya\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Sclerostachya Wikipedia URL: Sclerostachya Miscanthus , or silvergrass , is a genus of African, Eurasian, and Pacific Island plants in the grass family, Poaceae . The name is derived from the Greek words \" miskos\" , meaning \"stem\", and \" anthos\" , meaning \"flower\", in reference to the stalked spikelets on plants of this genus. Several species are known for their height and biomass production, and may be used as ornamental grasses.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "SCSP", "label": "SCSP", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eSCSP\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: SCSP Wikipedia URL: SCSP The ough the term seed treatment is used often and indeed typically to mean seed coating, there are other methods of seed treatment. Corn kernels treated with a fungicide. A dye is added to the coating, since seeds coated with chemicals ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "seeds", "label": "seeds", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/dc/%D0%A0%D0%B0%D0%B7%D0%BD%D0%BE%D0%BE%D0%B1%D1%80%D0%B0%D0%B7%D0%B8%D0%B5_%D1%81%D0%B5%D0%BC%D1%8F%D0%BD.jpg/500px-%D0%A0%D0%B0%D0%B7%D0%BD%D0%BE%D0%BE%D0%B1%D1%80%D0%B0%D0%B7%D0%B8%D0%B5_%D1%81%D0%B5%D0%BC%D1%8F%D0%BD.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eseeds\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: seeds Wikipedia URL: Seeds In botany , a seed is a plant structure containing an embryo and stored nutrients in a protective coat called a testa . More generally, the term seed means anything that can be sown , which may include seed and husk or tuber . Seeds are the product of the ripened ovule , after the embryo sac is fertilized by sperm from pollen , forming a zygote . The embryo within a seed develops from the zygote and grows within the mother plant to a certain size before gr...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "selection committee", "label": "selection committee", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font- 003esearch term: spices Wikipedia URL: Spices In the culinary arts , a spice is a seed , fruit , root , bark , or other plant substance primarily used for flavoring or coloring food. Spices are distinguished from herbs , which are the leaves, flowers, or stems of plants used for flavoring or as a garnish . Spices and herbs are both seasonings . Spices are sometimes used in medicine , religious rituals , cosmetics , or perfume production. They are usually classified into spices, spice seeds, and herb...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "spine gourd", "label": "spine gourd", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/Erumapaval.JPG/250px-Erumapaval.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003espine gourd\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: spine gourd Wikipedia URL: Spine gourd Momordica dioica , commonly known as spiny gourd or spine gourd or teasle gourd and also known as bristly balsam pear , is a species of flowering plant in the Cucurbitaceae/gourd family. It is propagated by underground tubers. It has small leaves, small yellow flowers, it has small, dark green, round or oval fruits. It is dioecious , which means that it has distinct male and female individual organisms, hence its name.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "split plot design", "label": "split plot design", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003 %80%93s_Medizinal-Pflanzen-125.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003esugarcane\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: sugarcane Wikipedia URL: Sugarcane Sugarcane or sugar cane is a species of tall, perennial grass (in the genus Saccharum , tribe Andropogoneae ) that is used for sugar production . The plants are 2\u20136 m (6\u201320 ft) tall with stout, jointed, fibrous stalks that are rich in sucrose , which accumulates in the stalk internodes . Sugarcanes belong to the grass family, Poaceae , an economically important flowering plant family that includes maize, wheat, rice, and sorghum , and many forage c...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Sugarcane Breeding Institute", "label": "Sugarcane Breeding Institute", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/b8/SBI_Coimbatore.jpg/250px-SBI_Coimbatore.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eSugarcane Breeding Institute\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Sugarcane Breeding Institute Wikipedia URL: Sugarcane Breeding Institute Sugarcane Breeding Institute ( SBI ) is a central research institute in Coimbatore , India . It was established in 1912 and is affiliated to Indian Council of Agricultural Research . It was established to promote research efforts in sugarcane production and is the only sugarcane research institute in the country.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "sugarcane juice", "label": "sugarcane juice", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/63/Sugarcanejuice.jpg/250px-Sugarcanejuice.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003esugarcane juice\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: sugarcane juice Wikipedia URL: Sugarcane juice Sugarcane juice is the liquid extracted from pressed sugarcane . It is consumed as a beverage in many places, especially where sugarcane is commercially grown, such as Southeast Asia , the Indian subcontinent , North Africa , mainly Egypt , and also in South America , especially Brazil . Sugarcane juice is obtained by crushing peeled sugarcane in a mill and is one of the main precursors of rum . Sugarcane juice\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "sunflower", "label": "sunflower", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/40/Sunflower_sky_backdrop.jpg/250px-Sunflower_sky_backdrop.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003esunflower\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: sunflower Wikipedia U                           var widthFactor = params.iterations/params.total;
                          var width = Math.max(minWidth,maxWidth * widthFactor);
                          document.getElementById('bar').style.width = width + 'px';
                          document.getElementById('text').innerHTML = Math.round(widthFactor*100) + '%';
                      });
                      network.once("stabilizationIterationsDone", function() {
                          document.getElementById('text').innerHTML = '100%';
                          document.getElementById('bar').style.width = '496px';
                          document.getElementById('loadingBar').style.opacity = 0;
                          // really clean the dom element
                          setTimeout(function () {document.getElementById('loadingBar').style.display = 'none';}, 500);
                      });
                  

                  return network;

              }
              drawGraph();
        </script>

#legendBox {
  position: fixed; top: 20px; right: 20px; background: rgba(0,0,0,0.6);

}
.legend-item { display: flex; align-items: center; margin-bottom: 5px; }
.legend-dot { width: 14px; height: 14px; border-radius: 50%; margin-right: 8px; }
.legend-blue { background: #66b2ff; }
.legend-orange { background: #ff9933; }

.legend-green { background: #00ff99; }
</style>

<div id="searchBox">

</div>

  <div class="legend-item"><span class="legend-dot legend-orange"></span>Subfields / Categories</div>
  <div class="legend-item"><span class="legend-dot legend-red"></span>Related Concepts</div>
</div>

<script>
document.getElementById('searchButton').onclick = function() {
  var query = document.getElementById('searchInput').value.trim().toLowerCase();
  if (!query) return;
  var nodes = network.body.data.nodes.get();
  var found = nodes.find(n => n.label.toLowerCase() === query);
  if (found) {
    network.focus(found.id, {scale: 1.5, animation: true});
    network.selectNodes([found.id]);
  }
  document.getElementById('searchInput').value = '';
};
document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('searchButton').click();
});
</script>
