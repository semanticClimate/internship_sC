          \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eIndia\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: India Wikipedia URL: India India , officially the Republic of India , is a country in South Asia . It is the seventh-largest country by area ; the most populous country since 2023; and, since its independence in 1947, the world\u0027s most populous democracy. Bounded by the Indian Ocean on the south, the Arabian Sea on the southwest, and the Bay of Bengal on the southeast, it shares land borders with Pakistan to the west; China , Nepal , and Bhutan to the north; and Bangladesh and Myanma...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "Indian Council of Agricultural Research", "label": "Indian Council of Agricultural Research", "shape": "dot", "size": 14.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eIndian Council of Agricultural Research\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Indian Council of Agricultural Research Wikipedia URL: Indian Council of Agricultural Research The Indian Council of Agricultural Research ( ICAR ) is an autonomous body responsible for co-ordinating agricultural education and research in India. It reports to the Department of Agricultural Research and Education, Ministry of Agriculture. The Union Minister of Agriculture serves as its president. It is the largest network of agricultural research and education institutes in the world...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "indigenous", "label": "indigenous", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eindigenous\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: indigenous Wikipedia URL: Indigenous Indigenous may refer to:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Indoxacarb", "label": "Indoxacarb", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/en/thumb/8/8a/OOjs_UI_icon_edit-ltr-progressive.svg/20px-OOjs_UI_icon_edit-ltr-progressive.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eIndoxacarb\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Indoxacarb Wikipedia URL: Indoxacarb Indoxacarb is an oxadiazine pesticide developed by DuPont that acts against lepidopteran larvae. It is marketed under the names Indoxacarb Technical Insecticide, Steward Insecticide and Avaunt Insecticide. It is also used as the active ingredient in the Syngenta line of commercial pesticides: Advion and Arilon .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "inoculation", "label": "inoculation", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Mary_Wortley_Montagu_by_Charles_Jervas%2C_after_1716.jpg/250px-Mary_Wortley_Montagu_by_Charles_Jervas%2C_after_1716.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003einoculation\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: inoculation Wikipedia URL: Inoculation Inoculation is the act of implanting a pathogen or other microbe or virus into a person or other organism. It is a method of artificially inducing immunity against various infectious diseases . The term \"inoculation\" is also used more generally to refer to intentionally depositing microbes into any growth medium , as into a Petri dish used to culture the microbe, or into food ingredients for making cultured foods such as yoghurt and fermented b...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "insect pest", "label": "insect pest", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/1f/Curtis_potato_pests.jpg/250px-Curtis_potato_pests.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003einsect pest\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: insect pest Wikipedia URL: Insect pest Economic entomology is a field of entomology , which involves the study of insects that benefit or harm humans, domestic animals , and crops . Insects that pose disadvantages are considered pests . Some species can cause indirect damage by spreading diseases, and these are termed as disease vectors . Those that are beneficial include those that are reared for food such as honey , substances such as lac or pigments, and for their role in pollina...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "insecticides", "label": "insecticides", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/FLIT_Spray_Can_1.jpg/250px-FLIT_Spray_Can_1.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003einsecticides\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: insecticides Wikipedia URL: Insecticides Insecticides are pesticides used to kill insects . They include ovicides and larvicides used against insect eggs and larvae , respectively. The major use of insecticides is in agriculture , but they are also used in home and garden settings, industrial buildings, for vector control , and control of insect parasites of animals and humans. FLIT manual spray pump from 1928\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "insects", "label": "insects", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/ed/Insects_-_Neoptera_-_Paleoptera_-_Apterygota.jpg/250px-Insects_-_Neoptera_-_Paleoptera_-_Apterygota.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003einsects\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: insects Wikipedia URL: Insects Insects (from Latin insectum ) are hexapod invertebrates of the class Insecta . They are the largest group within the arthropod phylum . Insects have a chitinous exoskeleton , a three-part body ( head , thorax and abdomen ), three pairs of jointed legs , compound eyes , and a pair of antennae . Insects are the most diverse group of animals, with more than a million described species ; they represent more than half of all animal species.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Institute", "label": "Institute", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/0/08/Aleksanteri_Institute_Building_Facade_2021-06-08.jpg/250px-Aleksanteri_Institute_Building_Facade_2021-06-08.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eInstitute\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Institute Wikipedia URL: Institute An institute is an organizational body created for a certain purpose. They are often research organisations ( research institutes ) created to do research on specific topics, or can also be a professional body. The Aleksanteri Institute in Helsinki , Finland (2021)\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Intellectual Property Rights", "label": "Intellectual Property Rights", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/0/07/Nike%2C_McDonald%E2%80%99s_copyright_infringing_sandals_in_China.jpg/250px-Nike%2C_McDonald%E2%80%99s_copyright_infringing_sandals_in_China.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eIntellectual Property Rights\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Intellectual Property Rights Wikipedia URL: Intellectual Property Rights Intellectual property ( IP ) is a category of property that includes intangible creations of the human intellect. There are many types of intellectual property, and some countries recognize more than others. The best-known types are patents , copyrights , trademarks , and trade secrets . The modern concept of intellectual property was developed in England in the 17th and 18th centuries. The term \"intellectual p...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "internal transcribed spacer", "label": "internal transcribed spacer", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/ac/Eucaryot_rdna.png/250px-Eucaryot_rdna.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003einternal transcribed spacer\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: internal transcribed spacer Wikipedia URL: Internal transcribed spacer Internal transcribed spacer ( ITS ) is the spacer DNA situated between the small-subunit ribosomal RNA (rRNA) and large-subunit rRNA genes in the chromosome or the corresponding transcribed region in the polycistronic rRNA precursor transcript. Organization of the eukaryotic nuclear ribosomal DNA tandem repeats\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "International Treaty", "label": "International Treaty", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/0/0d/Treaty_of_Kadesh.jpg/250px-Treaty_of_Kadesh.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eInternational Treaty\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: International Treaty Wikipedia URL: International treaty A treaty is a recorded international agreement between sovereign states or other subjects of international law (including international organizations ) that is governed by international law . A treaty may also be known as an international agreement , protocol , covenant , convention , pact , or exchange of letters , among other terms; however, only documents that are legally binding on the parties are considered treaties under...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "internodes", "label": "internodes", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/29/Plant_nodes_c.jpg/250px-Plant_nodes_c.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003einternodes\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: internodes Wikipedia URL: Internodes A stem is one of two main structural axes of a vascular plant , the other being the root . It supports leaves , flowers and fruits , transports water and dissolved substances between the roots and the shoots in the xylem and phloem , engages in photosynthesis, stores nutrients, and produces new living tissue. The stem can also be called the culm , halm , haulm , stalk , or thyrsus . Stem showing internode and nodes plus leaf petioles\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "interspecific hybrids", "label": "interspecific hybrids", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Juancito.jpg/500px-Juancito.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003einterspecific hybrids\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: interspecific hybrids Wikipedia URL: Interspecific hybrids In biology , a hybrid is the offspring resulting from combining the qualities of two organisms of different varieties , subspecies , species or genera through sexual reproduction . Generally, it means that each cell has genetic material from two different organisms, whereas an individual where some cells are derived from a different organism is called a chimera . Hybrids are not always intermediates between their parents suc...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "IR64", "label": "IR64", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/5/58/Oryza_glaberrima_seeds.jpg/250px-Oryza_glaberrima_seeds.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eIR64\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: IR64 Wikipedia URL: IR64 Oryza glaberrima , commonly known as African rice , is one of the two domesticated rice species.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "IRC", "label": "IRC", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/Tolsun_2.jpg/250px-Tolsun_2.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eIRC\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: IRC Wikipedia URL: IRC IRC ( Internet Relay Chat ) is a text-based chat system for instant messaging . IRC is designed for group communication in discussion forums, called channels , but also allows one-on-one communication via private messages as well as chat and data transfer , including file sharing . The first IRC server, tolsun.oulu.fi, a Sun-3 server on display near the University of Oulu computer centre\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Iron", "label": "Iron", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/ad/Iron_electrolytic_and_1cm3_cube.jpg/250px-Iron_electrolytic_and_1cm3_cube.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eIron\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Iron Wikipedia URL: Iron Iron is a chemical element ; it has symbol Fe (from Latin ferrum \u0027 iron \u0027 ) and atomic number 26. It is a metal that belongs to the first transition series and group 8 of the periodic table . It is, by mass, the most common element on Earth , forming much of Earth\u0027s outer and inner core . It is the fourth most abundant element in the Earth\u0027s crust . In its metallic state it was mainly deposited by meteorites .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "IRRI", "label": "IRRI", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/IRRI_wordmark_logo.svg/250px-IRRI_wordmark_logo.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eIRRI\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: IRRI Wikipedia URL: IRRI The International Rice Research Institute ( IRRI ) is an international agricultural research and training organization with its headquarters in Los Ba\u00f1os , Philippines, and offices in seventeen countries. IRRI is known for its work in developing rice varieties that contributed to the Green Revolution in the 1960s which preempted the famine in Asia.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "irrigation", "label": "irrigation", "shape": "dot", "size": 14.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/5/51/Fields_SW_from_Sevilla.jpg/250px-Fields_SW_from_Sevilla.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eirrigation\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: irrigation Wikipedia URL: Irrigation Irrigation is the practice of applying controlled amounts of water to land to help grow crops , landscape plants , and lawns . Irrigation has been a key aspect of agriculture for over 5,000 years and has been developed by many cultures around the world. Irrigation helps to grow crops, maintain landscapes, and revegetate disturbed soils in dry areas and during times of below-average rainfall. In addition to these uses, irrigation is also employed ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "ISMA", "label": "ISMA", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eISMA\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: ISMA Wikipedia URL: ISMA Isma is a genus of butterflies.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "ISO", "label": "ISO", "shape #ddd;line-height:1.4;\u0027\u003esearch term: ISO 9001 Wikipedia URL: ISO 9001 The ISO 9000 family is a set of international standards for quality management systems . It was developed in March 1987 by the International Organization for Standardization . The goal of these standards is to help organizations ensure that they meet customer and other stakeholder needs within the statutory and regulatory requirements related to a product or service. The standards were designed to fit into an integrated management system. The ISO ref...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "isolates", "label": "isolates", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eisolates\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: isolates Wikipedia URL: Isolates Isolates is a term used in developmental psychology and family studies to describe members of a study group, usually children through young adults, who do not actively participate in cliques or friendship groups . Isolates are one of four types of participants in friendship networks, the other three being dyads , liaisons , and cliques.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "ITPGRFA", "label": "ITPGRFA", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eITPGRFA\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: ITPGRFA Wikipedia URL: ITPGRFA The International Treaty on Plant Genetic Resources for Food an 027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eleaf webber\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: leaf webber Wikipedia URL: Leaf webber Loboschiza koenigiana , the orange tortricid moth or leaf webber , is a moth of the family Tortricidae . The species was first described by Johan Christian Fabricius in 1775. It is found in the United Arab Emirates , Pakistan , India , Sri Lanka , Myanmar , China , Malaysia , Thailand , Java in Indonesia, New Guinea , Queensland in Australia, the Philippines , Taiwan , Japan and Korea .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "leafhopper", "label": "leafhopper", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Two-lined_gum_treehopper03.jpg/250px-Two-lined_gum_treehopper03.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eleafhopper\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: leafhopper Wikipedia URL: Leafhopper Leafhopper is the common name for any species from the family Cicadellidae : based on the type genus Cicadella . These minute insects , colloquially known as hoppers , are plant feeders that suck plant sap from grass, shrubs, or trees. Their hind legs are modified for jumping, and are covered with hairs that facilitate the spreading of a secretion over their bodies that acts as a water repellent and carrier of pheromones . They undergo a partial ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "leafy vegetables", "label": "leafy vegetables", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/fe/Spinach_leaves.jpg/250px-Spinach_leaves.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eleafy vegetables\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: leafy vegetables Wikipedia URL: Leafy vegetables Leaf vegetables , also called leafy greens , vegetable greens , or simply greens , are plant leaves eaten as a vegetable . Those eaten raw in a salad can be called salad greens , whereas leaf vegetables eaten cooked can be called pot herbs . Spinach leaves in a colander\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Legal Advisor", "label": "Legal Advisor", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eLegal Advisor\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Legal Advisor Wikipedia URL: Legal Advisor A Legal Advisor is a person who provides legal advice , often in an official capacity. Government officials that qualify as lawyers (jurist) in certain countries can get the title Legal Adviser.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "lentil", "label": "lentil", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/39/Llenties_maig.JPG/250px-Llenties_maig.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003elentil\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: lentil Wikipedia URL: Lentil The lentil ( Vicia lens or Lens culinaris ) is an annual legume grown for its lens -shaped edible seeds or pulses , also called lentils . It is about 40 cm (16 in) tall, and the seeds grow in pods , usually with two seeds in each. Lentil plants in the field before flowering\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "linseed", "label": "linseed", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/28/The_Women%27s_Land_Army_in_Britain%2C_1915-1918_Q30890.jpg/250px-The_Women%27s_Land_Army_in_Britain%2C_1915-1918_Q30890.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003elinseed\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: linseed Wikipedia URL: Linseed Flax , also known as common flax or linseed , is a flowering plant , Linum usitatissimum , in the family Linaceae . It is cultivated as a food and fiber crop in regions of the world with temperate climates . In 2022, France produced 75% of the world\u0027s supply of flax. Flax being harvested by the Women\u0027s Land Army in Britain, during World War I\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "linseed oil", "label": "linseed oil", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/3c/From_flax_to_linseed_oil..JPG/500px-From_flax_to_linseed_oil..JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003elinseed oil\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: linseed oil Wikipedia URL: Linseed oil Linseed oil , also known as flaxseed oil or flax oil (in its edible form), is a colorless to yellowish oil obtained from the dried, ripened seeds of the flax plant ( Linum usitatissimum ). The oil is obtained by pressing , sometimes followed by solvent extraction . Flax, flax seeds, linseed oil, linseed cake\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Little millet", "label": "Little millet", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eLittle millet\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Little millet Wikipedia URL: Little millet Panicum miliare auct. non Lam.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "logistics support", "label": "logistics support", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003elogistics support\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: logistics support Wikipedia URL: Logistics support Integrated logistics support ( ILS ) is a technology in the system engineering to lower a product life cycle cost and decrease demand for logistics by the maintenance system optimization to ease the product support . Although originally developed for military purposes, it is also widely used in commercial customer service organisations.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "lycopersicum", "label": "lycopersicum", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/Colorful_Red_and_Yellow_Tomatoes_2816px.jpg/250px-Colorful_Red_and_Yellow_Tomatoes_2816px.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003elycopersicum\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: lycopersicum Wikipedia URL: Lycopersicum Lycopersicon was a genus in the flowering plant family Solanaceae (the nightshades and relatives). It contained about 13 species in the tomato group of nightshades. First removed from the genus Solanum by Philip Miller in 1754, its removal leaves the latter genus paraphyletic , so modern botanists generally accept the names in Solanum . The name Lycopersicon (from Greek \u03bb\u03c5\u03ba\u03bf\u03c0\u03ad\u03c1\u03c3\u03b9\u03ba\u03bf\u03bd meaning \"wolf peach\") is a reference to German folklore abou...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "m", "label": "m", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/c/cb/Latin_letter_M.svg/250px-Latin_letter_M.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003em\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: m Wikipedia URL: M M , or m , is the thirteenth letter of the Latin alphabet , used in the modern English alphabet , the alphabets of several western European languages and others worldwide. Its name in English is em (pronounced / \u02c8 \u025b m / \u24d8 ), plural ems .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Maharashtra", "label": "Maharashtra", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/f1/Maharashtra_in_India_%28claimed_and_disputed_hatched%29.svg/330px-Maharashtra_in_India_%28claimed_and_disputed_hatched%29.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eMaharashtra\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Maharashtra Wikipedia URL: Maharashtra Maharashtra is a state in the western peninsular region of India occupying a substantial portion of the Deccan Plateau . It is bordered by the Arabian Sea to the west, the Indian states of Karnataka and Goa to the south, Telangana to the southeast and Chhattisgarh to the east, Gujarat and Madhya Pradesh to the north, and the Indian union territory of Dadra and Nagar Haveli and Daman and Diu to the northwest. Maharashtra is the second-most popul...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "maintenance", "label": "maintenance", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/da/Bundesarchiv_Bild_183-E0208-0005-001%2C_Reparatur_eines_Traktors.jpg/250px-Bundesarchiv_Bild_183-E0208-0005-001%2C_Reparatur_eines_Traktors.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emaintenance\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: maintenance Wikipedia URL: Maintenance The technical meaning of maintenance involves functional checks, servicing, repairing or replacing of necessary devices, equipment, machinery , building infrastructure and supporting utilities in industrial, business, and residential installations. Terms such as \"predictive\" or \"planned\" maintenance describe various cost-effective practices aimed at keeping equipment operational; these activities occur either before or after a potential failure...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#66b2ff", "font": {"color": "#FFFFFF"}, "id": "maize", "label": "maize", "shape": "dot", "size": 17.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/db/Maize_plant_diagram%2C_large_labels.svg/250px-Maize_plant_diagram%2C_large_labels.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emaize\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: maize Wikipedia URL: Maize Maize ( / m e\u026a z / ; Zea mays ), also known as corn in North American English , is a tall stout grass that produces cereal grain . The leafy stalk of the plant gives rise to male inflorescences or tassels which produce pollen , and female inflorescences called ears . The ears yield grain, known as kernels or seeds. In modern commercial varieties, these are usually yellow or white; other varieties can be of many colors. Maize was domesticated by indigenous ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "male sterility", "label": "male sterility", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emale sterility\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: male sterility Wikipedia URL: Male sterility Cytoplasmic male sterility is total or partial male sterility in hermaphrodite organisms, as the result of specific nuclear and mitochondrial interactions. Male sterility is the failure to produce functional anthers , pollen , or male gametes . Such male sterility in hermaphrodite populations leads to gynodioecious populations (populations with coexisting fully functioning hermaphrodites and male-sterile hermaphrodites).\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "marketing", "label": "marketing", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/dd/Steve_Jobs_and_Macintosh_computer%2C_January_1984%2C_by_Bernard_Gotfryd_-_edited.jpg/250px-Steve_Jobs_and_Macintosh_computer%2C_January_1984%2C_by_Bernard_Gotfryd_-_edited.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emarketing\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: marketing Wikipedia URL: Marketing Marketing is the act of acquiring, satisfying and retaining customers . It is one of the primary components of business management and commerce . Steve Jobs \u0027s marketing skills have been credited for reviving Apple Inc. and turning it into one of the most valuable brands .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "mauritiana", "label": "mauritiana", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emauritiana\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: mauritiana Wikipedia URL: Mauritiana Mauritiana is a genus of lichenized fungi in the family Halotthiaceae .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "mealybug", "label": "mealybug", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Mealybugs_on_flower_stem%2C_Yogyakarta%2C_2014-10-31.jpg/250px-Mealybugs_on_flower_stem%2C_Yogyakarta%2C_2014-10-31.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emealybug\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: mealybug Wikipedia URL: Mealybug Mealybugs are insects in the family Pseudococcidae , unarmored scale insects found in moist, warm habitats. Of the more than 2,000 described species, many are considered pests as they feed on plant juices of greenhouse plants, house plants and subtropical trees and also act as a vector for several plant diseases. Some ants live in symbiotic relationships with them, protecting them from predators and feeding off the honeydew which they excrete.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "mechanization", "label": "mechanization", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/0/0d/Agricola1.jpg/250px-Agricola1.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emechanization\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: mechanization Wikipedia URL: Mechanization Mechanization (or mechanisation ) is the process of changing from working largely or exclusively by hand or with animals to doing that work with machinery. In an early engineering text, a machine is defined as follows: A water-powered mine hoist used for raising ore. This woodblock is ica . It is the northernmost country in Latin America and borders the United States to the north, and Guatemala and Belize to the southeast; while having maritime boundaries with the Pacific Ocean to the west, the Caribbean Sea to the southeast, and the Gulf of Mexico to the east. Mexico covers 1,972,550 km 2 (761,610 sq mi), and is the thirteenth-largest country in the world by la...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Microbiology", "label": "Microbiology", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/9/93/Agar_plate_with_colonies.jpg/250px-Agar_plate_with_colonies.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eMicrobiology\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Microbiology Wikipedia URL: Microbiology Microbiology (from Ancient Greek \u03bc\u1fd1\u03ba\u03c1\u03bf\u03c2 ( m\u012bkros ) \u0027 small \u0027 \u03b2\u03af\u03bf\u03c2 ( b\u00edos ) \u0027 life \u0027 and -\u03bb\u03bf\u03b3\u03af\u03b1 ( -log\u00eda ) \u0027 study of \u0027 ) is the scientific study of microorganisms , those being of unicellular (single-celled), multicellular (consisting of complex cells), or acellular (lacking cells). Microbiology encompasses numerous sub-disciplines including virology , bacteriology , protistology , mycology , immunology , and parasitology . An agar plate stre...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "micronaire", "label": "micronaire", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;fon h year to mark the discovery of the Raman effect by Indian physicist Sir C. V. Raman on 28 February 1928. Meenu Khare receiving the National Award from Kapil Sibal.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "natural dyes", "label": "natural dyes", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/42/Naturally_dyed_skeins.jpg/250px-Naturally_dyed_skeins.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003enatural dyes\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: natural dyes Wikipedia URL: Natural dyes Natural dyes are dyes or colorants derived from plants , invertebrates , or minerals . The majority of natural dyes are vegetable dyes from plant sources\u2014 roots , berries , bark , leaves , and wood \u2014and other biological sources such as fungi . Naturally dyed skeins made with madder root, Colonial Williamsburg, VA\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "natural farming", "label": "natural farming", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/fa/Masanobu-Fukuoka.jpg/250px-Masanobu-Fukuoka.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003enatural farming\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: natural farming Wikipedia URL: Natural farming Natural farming ( \u81ea\u7136\u8fb2\u6cd5 , shizen n\u014dh\u014d), also referred to as \"the Fukuoka Method\", \"the natural way of farming\", or \"do-nothing farming\", is an ecological farming approach established by Masanobu Fukuoka (1913\u20132008). Fukuoka, a Japanese farmer and philosopher, introduced the term in his 1975 book The One-Straw Revolution . The title refers not to lack of effort, but to the avoidance of manufactured inputs and equipment. Natural farming is...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Natural Fibres", "label": "Natural Fibres", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/f8/Cotton_plant%2C_Ware_County%2C_GA%2C_US.jpg/250px-Cotton_plant%2C_Ware_County%2C_GA%2C_US.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eNatural Fibres\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Natural Fibres Wikipedia URL: Natural fibres Natural fibers or natural fibres (see spelling differences ) are fibers that are produced by geological processes , or from the bodies of plants or animals . They can be used as a component of composite materials, where the orientation of fibers impacts the properties. Natural fibers can also be matted into sheets to make paper or felt . Cotton growing on the plant Cotton growing on the plant\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "neem cake", "label": "neem cake", "shape": "dot", "size": 11.2, "title": "\n        \u003c r": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "nematodes", "label": "nematodes", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/CelegansGoldsteinLabUNC.jpg/250px-CelegansGoldsteinLabUNC.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003enematodes\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: nematodes Wikipedia URL: Nematodes The nematodes ( / \u02c8 n \u025b m \u0259 t o\u028a d z / / \u02c8 n i\u02d0 m -/ NEM -\u0259-tohdz or NEEM - ; Ancient Greek : \u039d\u03b7\u03bc\u03b1\u03c4\u03ce\u03b4\u03b7 ; Latin : Nematoda ), roundworms or eelworms constitute the phylum Nematoda . Species in the phylum inhabit a broad range of environments . Most species are free-living, feeding on microorganisms , but many are parasitic . Parasitic worms (helminths) are the cause of soil-transmitted helminthiases .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "net income", "label": "net income", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003enet income\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: net income Wikipedia URL: Net income In business and accounting , net income is an entity\u0027s income minus cost of goods sold , expenses, depreciation and amortization , interest , and taxes, and other expenses for an accounting period . [ better source needed ]\u003c/div\u003e\ ants with blooms that are often colourful and fragrant. Orchids are cosmopolitan plants, living in diverse habitats on every continent except Antarctica. The world\u0027s richest diversity of orchid genera and species is in the tropics . Many species are epiphytes , living on trees. The flowers and their poll...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "organic carbon", "label": "organic carbon", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e5/POC.png/500px-POC.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eorganic carbon\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: organic carbon Wikipedia URL: Organic carbon Total organic carbon ( TOC ) is an analytical parameter representing the concentration of organic carbon in a sample. TOC determinations are made in a variety of application areas. For example, TOC may be used as a non-specific indicator of water quality, or TOC of source rock may be used as one factor in evaluating a petroleum play . For marine surface sediments average TOC content is 0.5% in the deep ocean, and 2% along the eastern marg...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "organic farming", "label": "organic farming", "shape": "dot", "size": 13.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/38/Organic-vegetable-cultivation.jpeg/250px-Organic-vegetable-cultivation.jpeg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eorganic farming\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: organic farming Wikipedia URL: Organic farming Organic farming , also known as organic agriculture or ecological farming , or biological farming , is an agricultural system that emphasizes the use of naturally occurring, non-synthetic inputs, such as compost manure , green manure , and bone meal and places emphasis on techniques such as crop rotation , companion planting , and mixed cropping . Biological pest control methods, such as the fostering of insect predators, are also encou...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "organic system", "label": "organic system", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/d9/Internal_organs.png/330px-Internal_organs.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eorganic system\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: organic system Wikipedia URL: Organic system In a multicellular organism , an organ is a collection of tissues joined in a structural unit to serve a common function . In the hierarchy of life , an organ lies between tissue and an organ system . Tissues are formed from same type cells to act together in a function. Tissues of different types combine to form an organ which has a specific function. The intestinal wall for example is formed by epithelial tissue and smooth muscle tissue...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Oryza", "label": "Oryza", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/Gealypic5.JPG/250px-Gealypic5.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eOryza\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Oryza Wikipedia URL: Oryza Oryza is a genus of plants in the grass family . It includes the major food crop rice (species Oryza sativa and Oryza glaberrima ). Members of the genus grow as tall, wetland grasses, growing to 1\u20132 metres (3\u20137 ft) tall; the genus includes both annual and perennial species.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Oryza sativa", "label": "Oryza sativa", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Mature_Rice_%28India%29_by_Augustus_Binu.jpg/250px-Mature_Rice_%28India%29_by_Augustus_Binu.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eOryza sativa\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Oryza sativa Wikipedia URL: Oryza sativa Oryza sativa , having the common name Asian cultivated rice , is the much more common of the two rice species cultivated as a cereal , the other species being O. glaberrima , African rice. It was first domesticated in the Yangtze River basin in China 13,500 to 8,200 years ago.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "oryzae", "label": "oryzae", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/c/c9/Aspergillus_oryzae_%28%E9%BA%B9%29.jpg/250px-Aspergillus_oryzae_%28%E9%BA%B9%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eoryzae\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: oryzae Wikipedia URL: Oryzae Aspergillus oryzae , also known as k\u014dji mold ( Japanese : \u30cb\u30db\u30f3\u30b3\u30a6\u30b8\u30ab\u30d3 (\u65e5\u672c\u9eb9\u9ef4) , Hepburn : nihon k\u014dji kabi ) , is a mold used in East Asia to saccharify rice, sweet potato , and barley in the making of alcoholic beverages such as sake and sh\u014dch\u016b , and also to ferment soybeans for making soy sauce and miso . It is one of the different koji molds used for food fermentation.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "packaging", "label": "packaging", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Ritual_wine_vessel_-_The_Met.png/250px-Ritual_wine_vessel_-_The_Met.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epackaging\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: packaging Wikipedia URL: Packaging Packaging is the science , art , and technology of enclosing or protecting products for distribution, storage, sale, and use. Packaging also refers to the process of designing, evaluating, and producing packages. Packaging can be described as a coordinated system of preparing goods for transport, warehousing, logistics , sale, and end use. Packaging contains, protects, preserves, transports, informs, and sells. In many countries it is fully integra...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "palmyrah", "label": "palmyrah", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/32/Asian_palmyra_%28Borassus_flabellifer%29.JPG/250px-Asian_palmyra_%28Borassus_flabellifer%29.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epalmyrah\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: palmyrah Wikipedia URL: Palmyrah Borassus ( palmyra palm ) is a genus of five species of fan palms , native to tropical regions of Africa, Asia, and Papua New Guinea .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "paprika", "label": "paprika", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/34/1902-11-17%2C_La_Ilustraci%C3%B3n_Art%C3%ADstica%2C_Abriendo_el_pimiento%2C_Medina_Vera.jpg/250px-1902-11-17%2C_La_Ilustraci%C3%B3n_Art%C3%ADstica%2C_Abriendo_el_pimiento%2C_Medina_Vera.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epaprika\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: paprika Wikipedia URL: Paprika Paprika is a spice made from dried and ground red peppers, Capsicum annuum . It can have varying levels of heat , but the peppers used for hot paprika tend to be milder and have thinner flesh than those used to produce chili powder . The milder, sweet paprika is mostly composed of the fruit of the pepper with most of the seeds removed; whereas some seeds and stalks are retained in the peppers used for hotter paprika. Opening the pepper, an illustration...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "parasitism", "label": "parasitism", "shape": "dot", "size": 14.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Nuvola_apps_kaboodle.svg/20px-Nuvola_apps_kaboodle.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eparasitism\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: parasitism Wikipedia URL: Parasitism Parasitism is a close relationship between species , where one organism, the parasite , lives (at least some of the time) on or inside another organism, the host , causing it some harm, and is adapted structurally to this way of life. The entomologist E. O. Wilson characterised parasites\u0027 way of feeding as \"predators that eat prey in units of less than one\". Parasites include single-celled protozoans such as the agents of malaria , sleeping sickn...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "parasitoids", "label": "parasitoids", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/0/04/CSIRO_ScienceImage_2357_Spotted_alfalfa_aphid_being_attacked_by_parasitic_wasp.jpg/330px-CSIRO_ScienceImage_2357_Spotted_alfalfa_aphid_being_attacked_by_parasitic_wasp.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eparasitoids\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: parasitoids Wikipedia URL: Parasitoids In evolutionary ecology , a parasitoid is an organism that lives in close association with its host at the host\u0027s expense, eventually resulting in the death of the host. Parasitoidism is one of six major evolutionary strategies within parasitism , distinguished by the fatal prognosis for the host, which makes the strategy close to predation . A parasitoid wasp ( Trioxys complanatus , Aphidiinae ) ovipositing into the body of a spotted alfalfa a...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "particle size", "label": "particle size", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Sample_Net-withGraphic.png/250px-Sample_Net-withGraphic.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eparticle size\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: particle size Wikipedia URL: Particle size Particle size is a notion introduced for comparing dimensions of solid particles ( flecks ), liquid particles ( droplets ), or gaseous particles ( bubbles ). The notion of particle size applies to particles in colloids , in ecology , in granular material (whether airborne or not), and to particles that form a granular material (see also grain size ).\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "patents", "label": "patents", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/f5/US_Patent_cover_%28US_Patent_5%2C860%2C492%29.jpg/250px-US_Patent_cover_%28US_Patent_5%2C860%2C492%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epatents\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: patents Wikipedia URL: Patents A patent is a type of intellectual property that gives its owner the legal right to exclude others from making, using, or selling an invention for a limited period of time, in exchange for publishing an enabling disclosure of the invention. In most countries, patent rights fall under private law and the patent holder must sue someone infringing the patent in order to enforce their rights. A patent issued by the U.S. Patent and Trademark Office\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "pathogen", "label": "pathogen", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/29/Shigella_stool.jpg/330px-Shigella_stool.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epathogen\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: pathogen Wikipedia URL: Pathogen In biology , a pathogen ( Greek : \u03c0\u03ac\u03b8\u03bf\u03c2 , pathos \"suffering\", \"passion\" and -\u03b3\u03b5\u03bd\u03ae\u03c2 , -gen\u0113s \"producer of\"), in the oldest and broadest sense, is any organism , agent or micro-organism that can produce disease . A pathogen may also be referred to as an infectious agent , or simply a germ . A photomicrograph of a stool that has shigella dysentery. These bacteria typically cause foodborne illness.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "pathotypes", "label": "pathotypes", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e6/Bacterial_black_spot_of_mango_caused_by_Xanthomonas_citri_pv._mangiferae_indicae_%2835616210646%29.jpg/250px-Bacterial_black_spot_of_mango_caused_by_Xanthomonas_citri_pv._mangiferae_indicae_%2835616210646%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epathotypes\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: pathotypes Wikipedia URL: Pathotypes A pathovar is a bacterial strain or set of strains with the same or similar characteristics, that is differentiated at infrasubspecific level from other strains of the same species or subspecies on the basis of distinctive pathogenicity to one or more plant hosts. Bacterial black spot of mango caused by Xanthomonas citri pv. mangiferaeindicae\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "PAU", "label": "PAU", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ePAU\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: PAU Wikipedia URL: PAU Pau or PAU may refer to:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "pea", "label": "pea", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/Doperwt_rijserwt_bloemen_Pisum_sativum.jpg/250px-Doperwt_rijserwt_bloemen_Pisum_sativum.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epea\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: pea Wikipedia URL: Pea Pea is a pulse or fodder crop, but the word often refers to the seed or sometimes the pod of this flowering plant species. Peas are eaten as a vegetable. Flowers\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Pearl Millet", "label": "Pearl Millet", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/f0/Grain_millet%2C_early_grain_fill%2C_Tifton%2C_7-3-02.jpg/250px-Grain_millet%2C_early_grain_fill%2C_Tifton%2C_7-3-02.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ePearl Millet\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Pearl Millet Wikipedia URL: Pearl Millet Pearl millet ( Cenchrus americanus , commonly known as the synonym Pennisetum glaucum ) is the most widely grown type of millet . It has been grown in Africa and the Indian subcontinent since prehistoric times. The center of diversity and suggested area of domestication for the crop is in the Sahel zone of West Africa .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "pectin", "label": "pectin", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/dd/Pectin.jpg/250px-Pectin.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epectin\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: pectin Wikipedia URL: Pectin Pectin ( Ancient Greek : \u03c0\u03b7\u03ba\u03c4\u03b9\u03ba\u03cc\u03c2 p\u0113ktik\u00f3s : \u0027congealed\u0027 and \u0027curdled\u0027) is a heteropolysaccharide , a structural polymer contained in the cell walls and middle lamellae of terrestrial plants . The principal chemical component of pectin is galacturonic acid (a sugar acid derived from galactose ) which was isolated and described by Henri Braconnot in 1825. [ dubious \u2013 discuss ] Commercially produced pectin is a white-to-light-brown powder, produced from ci...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Peltier module", "label": "Peltier module", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Peltierelement.png/330px-Peltierelement.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ePeltier module\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Peltier module Wikipedia URL: Peltier module Thermoelectric heat pumps use the thermoelectric effect , specifically the Peltier effect , to heat or cool materials by applying an electrical current across them. A Peltier cooler, heater, or thermoelectric heat pump is a solid-state active heat pump which transfers heat from one side of the device to the other, with consumption of electrical energy , depending on the direction of the current. Such an instrument is also called a Peltier...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Personality Development", "label": "Personality Development", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n term: Photosynthetic Efficiency Wikipedia URL: Photosynthetic efficiency The photosynthetic efficiency (i.e. oxygenic photosynthesis efficiency ) is the fraction of light energy converted into chemical energy during photosynthesis in green plants and algae. Photosynthesis can be described by the simplified chemical reaction\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "phyllody", "label": "phyllody", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/c/c0/Phyllody_on_Coneflower_with_aster_yellows.jpg/250px-Phyllody_on_Coneflower_with_aster_yellows.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ephyllody\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: phyllody Wikipedia URL: Phyllody Phyllody is the abnormal development of floral parts into leafy structures. It is generally caused by phytoplasma or virus infections, though it may also be because of environmental factors that result in an imbalance in plant hormones . Phyllody causes the affected plant to become partially or entirely sterile, as it is unable to produce normal flowers . Phyllody on a purple coneflower ( Echinacea purpurea )\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Phylogenetic analysis", "label": "Phylogenetic analysis", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Clade_of_the_fish_tree_of_life.png/250px-Cla
