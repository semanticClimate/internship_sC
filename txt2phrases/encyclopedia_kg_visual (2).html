 a cover crop . Varieties with smaller, harder seeds that are fed to horses or other animals are called field bean , tic bean or tick bean . This legume is commonly consumed in many national and regional cuisines. Worldwide broad...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "fabric structure", "label": "fabric structure", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003efabric structure\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: fabric structure Wikipedia URL: Fabric structure A fabric structure is a structure made of fabric , with or without a structural frame made from the weaving of the fabric itself . The technology provides end users a variety of aesthetic free-form building designs. Custom-made structures are engineered and fabricated to meet worldwide structural, flame retardant , weather-resistant, and natural force requirements. Fabric structures are considered a sub-category of tensile structure .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "false smut", "label": "false smut", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/5/58/U.Virens.jpg/250px-U.Virens.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003efalse smut\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: false smut Wikipedia URL: False smut Sphacelotheca virens Omori{?}, (1896) Tilletia oryzae Pat., (1887) Ustilaginoidea oryzae (Pat.) Bref., (1895) Ustilago virens Cooke, (1878)\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "FAO", "label": "FAO", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/db/FAO_logo.svg/120px-FAO_logo.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eFAO\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: FAO Wikipedia URL: FAO The Food and Agriculture Organization of the United Nations ( FAO ) is a specialized agency of the United Nations that leads international efforts to defeat hunger and improve nutrition and food security . Its Latin motto, fiat panis , translates to \"let there be bread\". It was founded on 16 October 1945 in Quebec City , Canada.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Farm Income", "label": "Farm Income", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eFarm Income\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Farm Income Wikipedia URL: Farm income Farm income is a statistical indicator of the income from farming for a particular country per year or some other period. This statistic is used by governments to determine agricultural policy and performance of the agricultural sector by financial markets.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "farmers", "label": "farmers", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/81/Woman_at_work%2C_Gujarat.jpg/250px-Woman_at_work%2C_Gujarat.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003efarmers\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: farmers Wikipedia URL: Farmers A farmer is a person engaged in agriculture , raising living organisms for food or raw materials. The term usually applies to people who do some combination of raising field crops , orchards , vineyards , poultry , or other livestock . A farmer might own the farmland or might work as a laborer on land owned by others. In most developed economies , a \"farmer\" is usually a farm owner ( landowner ), while employees of the farm are known as farm workers (o...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "farmyard manure", "label": "farmyard manure", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/c/c2/Hestem%C3%B8j.jpg/250px-Hestem%C3%B8j.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003efarmyard manure\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: farmyard manure Wikipedia URL: Farmyard manure Manure is organic matter that is used as organic fertilizer in agriculture . Most manure consists of animal feces ; other sources include compost and green manure . Manures contribute to the fertility of soil by adding organic matter and nutrients , such as nitrogen , that are utilised by bacteria , fungi , and other organisms in the soil . Higher organisms then feed on the fungi and bacteria in a chain of life that comprises the soil f...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "fatty acids", "label": "fatty acids", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/19/Rasyslami.jpg/250px-Rasyslami.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003efatty acids\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: fatty acids Wikipedia URL: Fatty acids In chemistry , particularly in biochemistry , a fatty acid is a carboxylic acid with an aliphatic chain, which is either saturated or unsaturated . Most naturally occurring fatty acids have an unbranched chain of an even number of carbon atoms, from 4 to 28. Fatty acids are a major component of the lipids (up to 70% by weight) in some species such as microalgae but in some other organisms are not found in their standalone form, but instead exis...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "fertigation", "label": "fertigation", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/25/Polibeg_putih_fertigasi_2.JPG/250px-Polibeg_putih_fertigasi_2.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003efertigation\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: fertigation Wikipedia URL: Fertigation Fertigation is the injection of fertilizers , used for soil amendments , water amendments and other water - soluble products into an irrigation system. Fertigation using white poly bag\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "fertilizers", "label": "fertilizers", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/5/53/Manure_spreading_Hlokozi_2007_11_29.jpg/500px-Manure_spreading_Hlokozi_2007_11_29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003efertilizers\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: fertilizers Wikipedia URL: Fertilizers A fertilizer or fertiliser is any material of natural or synthetic origin that is applied to soil or to plant tissues to supply plant nutrients . Fertilizers may be distinct from liming materials or other non-nutrient soil amendments . Many sources of fertilizer exist, both natural and industrially produced. For most modern agricultural practices, fertilization focuses on three main macro nutrients: nitrogen (N), phosphorus (P), and potassium (...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "fibres", "label": "fibres", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/Fibreoptic.jpg/250px-Fibreoptic.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003efibres\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: fibres Wikipedia URL: Fibres Fiber (spelled fibre in British English ; from Latin: fibra ) is a natural or artificial substance that is significantly longer than it is wide. Fibers are often used in the manufacture of other materials. The strongest engineering materials often incorporate fibers, for example carbon fiber and ultra-high-molecular-weight polyethylene . A bundle of optical fibers\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Financial Advisor", "label": "Financial Advisor", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eFinancial Advisor\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Financial Advisor Wikipedia URL: Financial Advisor A financial adviser or financial advisor is a professional who provides financial services to clients based on their financial situation. In many countries, financial advisors must complete specific training and be registered with a regulatory body in order to provide advice.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Finger millet", "label": "Finger millet", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/ff/Eleusine_coracana_MHNT.BOT.2015.34.17.jpg/250px-Eleusine_coracana_MHNT.BOT.2015.34.17.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eFinger millet\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Finger millet Wikipedia URL: Finger millet Finger millet ( Eleusine coracana ) is an annual herbaceous plant. It is a tetraploid and self-pollinating species probably evolved from its wild relative Eleusine africana . Eleusine coracana ( MHNT )\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Floriculture", "label": "Floriculture", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/37/Floriculture.jpg/250px-Floriculture.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eFloriculture\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Floriculture Wikipedia URL: Floriculture Floriculture (from Latin : floris + culture ) is the study of the efficient production of the plants that produce showy, colourful and even edible flowers and foliage . It is a commercially successful branch of horticulture and agriculture found throughout the world. Efficient production practices have been developed over the years, for the hundreds of plant taxa used in the floral industry , increasing the overall knowledge of whole plant bi...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "foxtail millet", "label": "foxtail millet", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/Japanese_Foxtail_millet_02.jpg/250px-Japanese_Foxtail_millet_02.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003efoxtail millet\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: foxtail millet Wikipedia URL: Foxtail millet Foxtail millet , scientific name Setaria italica (synonym Panicum italicum L.), is an annual grass grown for human food. It is the second-most widely planted species of millet and the most grown millet species in Asia. The oldest evidence of foxtail millet cultivation was found along the ancient course of the Yellow River in Cishan, China , carbon dated to be from around 8,000 years before present.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "FPCs", "label": "FPCs", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/dd/Free_Presbyterian_Church_of_Scotland%2C_Glendale_-_geograph.org.uk_-_952130.jpg/250px-Free_Presbyterian_Church_of_Scotland%2C_Glendale_-_geograph.org.uk_-_952130.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eFPCs\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: FPCs Wikipedia URL: FPCS The Free Presbyterian Church of Scotland ( FPC Church ; Scottish Gaelic : An Eaglais Shaor Chl\u00e8ireach , IPA: [\u0259\u0272 \u02ccek\u026b\u032a\u0259\u0283 \u02cch\u026f\u02d0\u027e \u02c8\u00e7le\u02d0\u027e\u02b2\u0259x] ) was formed in 1893. The Church identifies itself as the spiritual descendant of the Scottish Reformation . The Church web-site states that it is \"the constitutional heir of the historic Church of Scotland\". Its adherents are occasionally referred to as Seceders or the Wee Wee Frees . Although small, the church has congre...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "French bean", "label": "French bean", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Heaps_of_beans.jpg/330px-Heaps_of_beans.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eFrench bean\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: French bean Wikipedia URL: French bean Green beans are young, unripe fruits of various cultivars of the common bean ( Phaseolus vulgaris ). Green beans are known by several common names, including French beans , string beans (although most modern varieties are \"stringless\"), and snap beans or simply \"snaps\". In the Philippines, they are also known as \"Baguio beans\" or \" habichuelas \" to distinguish them from yardlong beans . A pile of raw green beans\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "fruit rind", "label": "fruit rind", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/bf/Orange_zest_and_peel.jpg/250px-Orange_zest_and_peel.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003efruit rind\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: fruit rind Wikipedia URL: Fruit rind Peel , also known as rind or skin , is the outer protective layer of a fruit or vegetable which can be peeled off. The rind is usually the botanical exocarp , but the term exocarp also includes the hard cases of nuts , which are not named peels since they are not peeled off by hand or peeler, but rather shells because of their hardness. Orange flavedo and albedo\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "fruit rot", "label": "fruit rot", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003efruit rot\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: fruit rot Wikipedia URL: Fruit rot Fruit rot disease may refer to:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "fruits", "label": "fruits", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/35/Fruit_Platter-_Seasonal_Fruits.jpg/250px-Fruit_Platter-_Seasonal_Fruits.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003efruits\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: fruits Wikipedia URL: Fruits In botany , a fruit is the seed -bearing structure in flowering plants (angiosperms) that is formed from the ovary after flowering . Fruit platter \u2013 seasonal fruits\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "fungal diseases", "label": "fungal diseases", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/34/Candida_pap_1.jpg/250px-Candida_pap_1.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003efungal diseases\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: fungal diseases Wikipedia URL: Fungal diseases Pathogenic fungi are fungi that cause disease in humans or other organisms . Although fungi are eukaryotic , many pathogenic fungi are microorganisms . Approximately 300 fungi are pathogenic to humans; their study is called \" medical mycology \". Fungal infections are estimated to kill more people than either tuberculosis or malaria \u2014about two million people per year. Candida. Pap test specimen. Pap stain .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "fungi", "label": "fungi", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/fc/Fungi_collage.jpg/330px-Fungi_collage.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003efungi\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: fungi Wikipedia URL: Fungi A fungus ( pl. : fungi or funguses) is any member of the group of eukaryotic organisms that includes microorganisms such as yeasts and molds , as well as the more familiar mushrooms . These organisms are classified in the kingdom Fungi .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "fungicides", "label": "fungicides", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/c/c0/Captan_Structural_Formula_V.1.svg/120px-Captan_Structural_Formula_V.1.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003efungicides\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: fungicides Wikipedia URL: Fungicides Fungicides are pesticides used to kill parasitic fungi or their spores . Fungi can cause serious damage in agriculture , resulting in losses of yield and quality. Fungicides are used both in agriculture and to fight fungal infections in animals , including humans. Fungicides are also used to control oomycetes , which are not taxonomically /genetically fungi, although sharing similar methods of infecting plants. Fungicides can either be contact, t...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "furrow irrigation", "label": "furrow irrigation", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/9/9b/Furrow_irrigated_Sugar.JPG/250px-Furrow_irrigated_Sugar.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003efurrow irrigation\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: furrow irrigation Wikipedia URL: Furrow irrigation Surface irrigation is where water is applied and distributed over the soil surface by gravity. It is by far the most common form of irrigation throughout the world and has been practiced in many areas virtually unchanged for thousands of years. Furrow irrigation of sugar cane in Australia , 2006\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Fusarium oxysporum", "label": "Fusarium oxysporum", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/f9/K7725-1-sm.jpg/250px-K7725-1-sm.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eFusarium oxysporum\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Fusarium oxysporum Wikipedia URL: Fusarium oxysporum Fusarium oxysporum (Schlecht as emended by Snyder and Hansen), an ascomycete fungus, comprises all the species, varieties and forms recognized by Wollenweber and Reinking within an infrageneric grouping called section Elegans. It is part of the family Nectriaceae .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "garlic", "label": "garlic", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/Opened_garlic_bulb_with_garlic_clove.jpg/250px-Opened_garlic_bulb_with_garlic_clove.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egarlic\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: garlic Wikipedia URL: Garlic Garlic ( Allium sativum ) is a species of bulbous flowering plants in the genus Allium . Its close relatives include the onion , shallot , leek , chives , Welsh onion , and Chinese onion . Garlic is native to central and western Asia , stretching from the Black Sea through the southern Caucasus , northeastern Iran , and the Hindu Kush . It has naturalized in many other parts of the world, including Mediterranean Europe and China. There are two subspecies...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "gen", "label": "gen", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egen\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: gen Wikipedia URL: Gen Gen is most commonly seen as a contraction (such as Gen. ) and it may refer to:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "gene bank", "label": "gene bank", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/15/ICRISAT_active_genebank.jpg/250px-ICRISAT_active_genebank.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egene bank\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: gene bank Wikipedia URL: Gene bank A gene bank is a type of biorepository that is used across the world to store the genetic material of animals, plants, and other organisms. It preserves their genetic information in the form of reproductive material like seeds, sperm, eggs, embryos , cells and other kinds of DNA. Oftentimes, these banks house the genetic material of species that are endangered or close to extinction. They are also used for the preservation of major crop species and...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "GENEPOOL", "label": "GENEPOOL", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eGENEPOOL\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: GENEPOOL Wikipedia URL: Genepool The gene pool is the set of all genes , or genetic information , in any population , usually of a particular species .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "genes", "label": "genes", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/d6/Gregor_Mendel_-_American_Breeders_Magazine%2C_1910.jpg/250px-Gregor_Mendel_-_American_Breeders_Magazine%2C_1910.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egenes\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: genes Wikipedia URL: Genes In biology , the word gene has two meanings. The Mendelian gene is a basic unit of heredity . The molecular gene is a sequence of nucleotides in DNA that is transcribed to produce RNA . There are two types of molecular genes: protein-coding genes and non-coding genes. During gene expression (the synthesis of RNA or protein from a gene), DNA is first copied into RNA . RNA can be directly functional or be the intermediate template for the synthesis of a prot...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "genetic diversity", "label": "genetic diversity", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Human_karyotype.svg/500px-Human_karyotype.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egenetic diversity\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: genetic diversity Wikipedia URL: Genetic diversity Genetic diversity is the total number of genetic characteristics in the genetic makeup of a species. It ranges widely, from the number of species to differences within species , and can be correlated to the span of survival for a species. It is distinguished from genetic variability , which describes the tendency of genetic characteristics to vary. A graphical representation of the typical human karyotype .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Genetic Improvement", "label": "Genetic Improvement", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eGenetic Improvement\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Genetic Improvement Wikipedia URL: Genetic improvement In computer software development, genetic improvement is the use of optimisation and machine learning techniques, particularly search-based software engineering techniques such as genetic programming to improve existing software . The improved program need not behave identically to the original. For example, automatic bug fixing improves executable code by reducing or eliminating buggy behaviour. In other cases the improved soft...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "genetic resources", "label": "genetic resources", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egenetic resources\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: genetic resources Wikipedia URL: Genetic resources Genetic resources are genetic material of actual or potential value, where genetic material means any material of plant, animal, microbial or other origin containing functional units of heredity . Genetic resources is one of the three levels of biodiversity defined by the Convention on Biological Diversity in Rio, 1992.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "genetic variability", "label": "genetic variability", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egenetic variability\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: genetic variability Wikipedia URL: Genetic variability Genetic variability is either the presence of, or the generation of, genetic differences. It is defined as \"the formation of individuals differing in genotype , or the presence of genotypically different individuals, in contrast to environmentally induced differences which, as a rule, cause only temporary, nonheritable changes of the phenotype .\" Genetic variability in a population promotes biodiversity , as it ensures that no t...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "Genetics", "label": "Genetics", "shape": "dot", "size": 16.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/Festetics_Imre-Oelenhainz.jpg/250px-Festetics_Imre-Oelenhainz.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eGenetics\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Genetics Wikipedia URL: Genetics Genetics is the study of genes , genetic variation , and heredity in organisms . It is an important branch in biology because heredity is vital to organisms\u0027 evolution . Gregor Mendel , a Moravian Augustinian friar working in the 19th century in Brno , was the first to study genetics scientifically. Mendel studied \"trait inheritance\", patterns in the way traits are handed down from parents to offspring over time. He observed that organisms (pea plant...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "genome editing", "label": "genome editing", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/MEGANUCLEASE-ZFN-TALEN-CRISPR-text-to-path.svg/500px-MEGANUCLEASE-ZFN-TALEN-CRISPR-text-to-path.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egenome editing\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: genome editing Wikipedia URL: Genome editing Genome editing , or genome engineering , or gene editing , is a type of genetic engineering in which DNA is inserted, deleted, modified or replaced in the genome of a living organism. Unlike early genetic engineering techniques that randomly insert genetic material into a host genome, genome editing targets the insertions to site-specific locations. The basic mechanism involved in genetic manipulations through programmable nucleases is th...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "genomics", "label": "genomics", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/73/Number_of_prokaryotic_genomes_and_sequencing_costs.svg/330px-Number_of_prokaryotic_genomes_and_sequencing_costs.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egenomics\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: genomics Wikipedia URL: Genomics Genomics is an interdisciplinary field of molecular biology focusing on the structure, function, evolution, mapping, and editing of genomes . A genome is an organism\u0027s complete set of DNA , including all of its genes as well as its hierarchical, three-dimensional structural configuration. [ excessive citations ] In contrast to genetics , which refers to the study of individual genes and their roles in inheritance, genomics aims at the collective char...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "genotypes", "label": "genotypes", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/17/Punnett_square_mendel_flowers.svg/250px-Punnett_square_mendel_flowers.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egenotypes\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: genotypes Wikipedia URL: Genotypes The genotype of an organism is its complete set of genetic material. Genotype can also be used to refer to the alleles or variants an individual carries in a particular gene or genetic location. The number of alleles an individual can have in a specific gene depends on the number of copies of each chromosome found in that species, also referred to as ploidy . In diploid species like humans, two full sets of chromosomes are present, meaning each ind...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "germ", "label": "germ", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egerm\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: germ Wikipedia URL: Germ Germ or germs may refer to:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Germany", "label": "Germany", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/Trier_012.JPG/250px-Trier_012.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eGermany\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Germany Wikipedia URL: Germany Germany , officially the Federal Republic of Germany , is a country in Western and Central Europe . It lies between the Baltic Sea and the North Sea to the north with the Alps to the south. Its sixteen constituent states have a total population of over 82 million, making it the most populous member state of the European Union . Germany borders Denmark to the north; Poland and the Czech Republic to the east; Austria and Switzerland to the south; and Fra...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "germination", "label": "germination", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/75/Sunflower_seedlings.jpg/250px-Sunflower_seedlings.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egermination\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: germination Wikipedia URL: Germination Germination is the process by which an organism grows from a seed or spore . The term is applied to the sprouting of a seedling from a seed of an angiosperm or gymnosperm , the growth of a sporeling from a spore , such as the spores of fungi , ferns, bacteria , and the growth of the pollen tube from the pollen grain of a seed plant . Sunflower seedlings, three days after germination\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "germplasm", "label": "germplasm", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/b2/INTA_-_Banco_de_germoplasma.jpg/250px-INTA_-_Banco_de_germoplasma.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egermplasm\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: germplasm Wikipedia URL: Germplasm Germplasm refers to genetic resources such as seeds, tissues, and DNA sequences that are maintained for the purpose of animal and plant breeding , conservation efforts, agriculture, and other research uses. These resources may take the form of seed collections stored in seed banks , trees growing in nurseries, animal breeding lines maintained in animal breeding programs or gene banks . Germplasm collections can range from collections of wild specie...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "ginger", "label": "ginger", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/5/51/Flower_of_Ginger1.jpg/250px-Flower_of_Ginger1.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eginger\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: ginger Wikipedia URL: Ginger Ginger ( Zingiber officinale ) is a flowering plant whose rhizome , ginger root or ginger, is widely used as a spice and a folk medicine . It is an herbaceous perennial that grows annual pseudostems (false stems made of the rolled bases of leaves) about one meter tall, bearing narrow leaf blades. The inflorescences bear flowers having pale yellow petals with purple edges, and arise directly from the rhizome on separate shoots . Ginger flower\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "ginning", "label": "ginning", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/5/54/Cotton_gin_EWM_2007.jpg/250px-Cotton_gin_EWM_2007.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eginning\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: ginning Wikipedia URL: Ginning A cotton gin \u2014meaning \"cotton engine \"\u2014is a machine that quickly and easily separates cotton fibers from their seeds, enabling much greater productivity than manual cotton separation. The separated seeds may be used to grow more cotton or to produce cottonseed oil . Handheld roller gins had been used in the Indian subcontinent since at earliest 500 and later in other regions. The Indian worm-gear roller gin was invented sometime around the 16th century...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "gluten sensitivity", "label": "gluten sensitivity", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egluten sensitivity\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: gluten sensitivity Wikipedia URL: Gluten sensitivity Non-celiac gluten sensitivity ( NCGS ) or gluten sensitivity is a disorder which can cause both gastrointestinal and other problems. A man with gluten ataxia: previous situation and evolution after three months of gluten-free diet\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "glycemic index", "label": "glycemic index", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/4d/Suckale08_fig3_glucose_insulin_day.png/250px-Suckale08_fig3_glucose_insulin_day.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eglycemic index\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: glycemic index Wikipedia URL: Glycemic index The glycemic ( glycaemic ) index ( GI ; / \u0261 l a\u026a \u02c8 s i\u02d0 m \u026a k / ) is a number from 0 to 100 assigned to a food, with pure glucose arbitrarily given the value of 100, which represents the relative rise in the blood glucose level two hours after consuming that food. The GI of a specific food depends primarily on the type of carbohydrate it contains, but is also affected by the amount of entrapment of the carbohydrate molecules within the fo...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Government", "label": "Government", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/0/04/Forms_of_government.svg/500px-Forms_of_government.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eGovernment\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Government Wikipedia URL: Government A government is the system or group of people governing an organized community, generally a state . World\u0027s states colored by systems of government : Parliamentary systems : Head of government is elected or nominated by and accountable to the legislature. Constitutional monarchy with a ceremonial monarch Parliamentary republic with a ceremonial president Parliamentary republic with an executive president Presidential system : Head of government (...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "grain amaranth", "label": "grain amaranth", "shape": "dot", "size": 13.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/Amaranth_und_WW.jpg/250px-Amaranth_und_WW.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egrain amaranth\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: grain amaranth Wikipedia URL: Grain amaranth Species belonging to the genus Amaranthus have been cultivated for their grains for 8,000 years. Amaranth plants are classified as pseudocereals that are grown for their edible starchy seeds, but they are not in the same botanical family as true cereals , such as wheat and rice . Amaranth species that are still used as a grain are Amaranthus caudatus L. , Amaranthus cruentus L. , and Amaranthus hypochondriacus L . The yield of grain amara...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "grain quality", "label": "grain quality", "shape": "dot", "size"  grains of sediment , or the lithified particles in clastic rocks . The term may also be applied to other granular materials . This is different from the crystallite size, which refers to the size of a single crystal inside a particle or grain. A single grain can be composed of several crystals . Granular material can range from very small colloidal particles , through clay , silt , sand...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "grain yield", "label": "grain yield", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/c/c4/Cereal-crop-yield-vs-fertilizer-application_%28OWID_0112%29.png/330px-Cereal-crop-yield-vs-fertilizer-application_%28OWID_0112%29.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egrain yield\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: grain yield Wikipedia URL: Grain yield In agriculture , the yield is a measurement of the amount of a crop grown, or product such as wool, meat or milk produced, per unit area of land. The seed ratio is another way of calculating yields. Cereal yield in tons per hectare and kilograms of nitrogenous fertilizer applied per hectare of cropland.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "grasspea", "label": "grasspea", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/ae/Lathyrus_sativus_flowers_Bangladesh_cropped.JPG/250px-Lathyrus_sativus_flowers_Bangladesh_cropped.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egrasspea\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: grasspea Wikipedia URL: Grasspea Lathyrus sativus , also known as grass pea , cicerchia , blue sweet pea , chickling pea , chickling vetch , Indian pea , white pea and white vetch , is a legume (family Fabaceae ) commonly grown for human consumption and livestock feed in Asia and East Africa . It is a particularly important crop in areas that are prone to drought and famine , and is thought of as an \u0027insurance crop\u0027 as it produces reliable yields when all other crops fail. The seeds...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "gray mold", "label": "gray mold", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e4/Aardbei_Lambada_vruchtrot_Botrytis_cinerea.jpg/250px-Aardbei_Lambada_vruchtrot_Botrytis_cinerea.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egray mold\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: gray mold Wikipedia URL: Gray mold Botrytis cinerea is a necrotrophic fungus that affects many plant species, including wine grapes . In viticulture , it is commonly known as \"botrytis bunch rot\"; in horticulture , it is usually called \"grey mould\" or \"gray mold\".\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFF  radiata ) is a plant species in the legume family . It is mainly cultivated in East , Southeast , and South Asia and used as an ingredient in both savoury and sweet dishes. Vigna radiata - MHNT\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "groundnut", "label": "groundnut", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egroundnut\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: groundnut Wikipedia URL: Groundnut Groundnut may refer to:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "growth ring", "label": "growth ring", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/7d/Tree.ring.arp.jpg/250px-Tree.ring.arp.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egrowth ring\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: growth ring Wikipedia URL: Growth ring Dendrochronology (or tree-ring dating ) is the scientific method of dating tree rings (also called growth rings) to the exact year they were formed in a tree. As well as dating them, this can give data for dendroclimatology , the study of climate and atmospheric conditions during different periods in history from the wood of old trees. Dendrochronology derives from the Ancient Greek dendron ( \u03b4\u03ad\u03bd\u03b4\u03c1\u03bf\u03bd ), meaning \"tree\", khronos ( =\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eheat stress tolerance\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: heat stress tolerance Wikipedia URL: Heat stress tolerance Plant breeding is process of development of new cultivars . Plant breeding involves development of varieties for different environmental conditions \u2013 some of them are not favorable. Among them, heat stress is one of such factor that reduces the production and quality significantly. So breeding against heat is a very important criterion for breeding for current as well as future environments produced by global climate change ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "herbicides", "label": "herbicides", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/9/98/Direktsaat_Probleme001.JPG/250px-Direktsaat_Probleme001.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eherbicides\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: herbicides Wikipedia URL: Herbicides Herbicides ( US : / \u02c8 \u025c\u02d0r b \u026a s a\u026a d z / , UK : / \u02c8 h \u025c\u02d0r -/ ), also commonly known as weed killers , are substances used to control undesired plants , also known as weeds . Selective herbicides control specific weed species while leaving the desired crop relatively unharmed, while non-selective herbicides (sometimes called \"total weed killers\") kill plants indiscriminately. The combined effects of herbicides, nitrogen fertilizer, and improved cu...\u003c/div\u003e\n
