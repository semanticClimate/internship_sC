sed in W/...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "Remote Sensing", "label": "Remote Sensing", "shape": "dot", "size": 13.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/20/Death-valley-sar.jpg/250px-Death-valley-sar.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eRemote Sensing\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Remote Sensing Wikipedia URL: Remote Sensing Remote sensing is the acquisition of information about an object or phenomenon without making physical contact with the object, in contrast to in situ or on-site observation . The term is applied especially to acquiring information about Earth and other planets . Remote sensing is used in numerous fields, including geophysics , geography , land surveying and most Earth science disciplines (e.g. exploration geophysics , hydrology , ecology...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Remote Sensing of Environment", "label": "Remote Sensing of Environment", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/en/3/3d/Remote_Sensing_of_Environment_cover.gif\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eRemote Sensing of Environment\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Remote Sensing of Environment Wikipedia URL: Remote Sensing of Environment Remote Sensing of Environment is an academic journal of remote sensing published by Elsevier . The journal was established in 1969 by Elsevier. Its editors-in-chief are Jing. M. Chen, Menghua Wang, and Marie Weiss.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Representative Concentration Pathway", "label": "Representative Concentration Pathway", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/ab/All_forcing_agents_CO2_equivalent_concentration.svg/500px-All_forcing_agents_CO2_equivalent_concentration.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eRepresentative Concentration Pathway\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Representative Concentration Pathway Wikipedia URL: Representative Concentration Pathway Representative Concentration Pathways ( RCP ) are climate change scenarios to project future greenhouse gas concentrations. These pathways (or trajectories ) describe future greenhouse gas concentrations (not emissions ) and have been formally adopted by the IPCC. The pathways describe different climate change scenarios, all of which were considered possible depending on the amount of greenhouse...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "resolution", "label": "resolution", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003 ociety\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Royal Society Wikipedia URL: Royal Society The Royal Society , formally The Royal Society of London for Improving Natural Knowledge , is a learned society and the United Kingdom\u0027s national academy of sciences . The society fulfils a number of roles: promoting science and its benefits, recognising excellence in science, supporting outstanding science, providing scientific advice for policy, education and public engagement and fostering international and global co-operation. Founded o...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Russian Arctic", "label": "Russian Arctic", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/c/c7/Map_of_the_Russian_Extreme_North.svg/330px-Map_of_the_Russian_Extreme_North.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eRussian Arctic\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Russian Arctic Wikipedia URL: Russian Arctic The Extreme North or the Far North is a large part of Russia located mainly north of the Arctic Circle and boasting enormous mineral and natural resources . Its total area is about 5,500,000 square kilometres (2,100,000 mi 2 ), comprising about one-third of Russia\u0027s total area. Formally, the regions of the Extreme North comprise the whole of Chukotka Autonomous Okrug , Kamchatka Krai , Magadan Oblast , Murmansk Oblast and Sakha , as well ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "salinity", "label": "salinity", "shape": "dot", "size": 14.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/WOA09_sea-surf_SAL_AYool.png/330px-WOA09_sea-surf_SAL_AYool.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003esalinity\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: salinity Wikipedia URL: Salinity Salinity ( / s \u0259 \u02c8 l \u026a n \u026a t i / ) is the saltiness or amount of salt dissolved in a body of water , called saline water (see also soil salinity ). It is usually measured in g/L or g/kg (grams of salt per liter/kilogram of water; the latter is dimensionless and equal to \u2030 ). Annual mean sea surface salinity for the World Ocean . Data from the World Ocean Atlas 2009.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "SAMW", "label": "SAMW", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eSAMW\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: SAMW Wikipedia URL: SAMW Sub-Antarctic Mode Water (SAMW) is an important water mass in Earth\u0027s oceans. It is formed near the Sub-Antarctic Front on the northern flank of the Antarctic Circumpolar Current . The surface density of Sub-Antarctic Mode Water ranges between about 1026.0 and 1027.0 kg/m 3 , and the core of this water mass is often identified as a region of particularly low stratification.\u003c/div\u003e\n        \u0 ch term: satellite era Wikipedia URL: Satellite era A satellite or an artificial satellite is an object, typically a spacecraft , placed into orbit around a celestial body . They have a variety of uses, including communication relay, weather forecasting , navigation ( GPS ), broadcasting , scientific research, and Earth observation. Additional military uses are reconnaissance, early warning , signals intelligence and, potentially, weapon delivery. Other satellites include the final rocket st...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "sea ice concentration", "label": "sea ice concentration", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a9/Oldest_Arctic_Sea_Ice_is_Disappearing.png/250px-Oldest_Arctic_Sea_Ice_is_Disappearing.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003esea ice concentration\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: sea ice concentration Wikipedia URL: Sea ice concentration Sea ice concentration is a useful variable for climate scientists and nautical navigators . It is defined as the area of sea ice relative to the total at a given point in the ocean . This article will deal primarily with its determination from remote sensing measurements. Arctic sea ice coverage in 1980 (bottom) and 2012 (top), as observed by passive microwave sensors on NASA\u2019s Nimbus-7 satellite and by the Special Sensor Mi...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "sea ice loss", "label": "sea ice loss", "shape": "dot", "size": 10.6, "title": "\n as its mode of variability. The Southern Annular Mode is usually defined as the difference in the zo...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "Southern Hemisphere", "label": "Southern Hemisphere", "shape": "dot", "size": 14.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/Southern_Hemisphere_LamAz.png/250px-Southern_Hemisphere_LamAz.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eSouthern Hemisphere\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Southern Hemisphere Wikipedia URL: Southern Hemisphere The Southern Hemisphere is the half ( hemisphere ) of Earth that is south of the equator . It contains all or part of five continents (the whole of Antarctica , the whole of Australia , about 90% of South America , about one-third of Africa , and some islands off the continental mainland of Asia ) and four oceans (the whole Southern Ocean , the majority of the Indian Ocean , the South Atlantic Ocean , and the South Pacific Ocean...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "Southern Ocean", "label": "Southern Ocean", "shape": "dot", "size": 16.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/28/Location_Southern_Ocean.svg/500px-Location_Southern_Ocean.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16 ax-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/en/thumb/3/33/IPCC_Special_Report_on_the_Ocean_and_Cryosphere_LR.jpg/250px-IPCC_Special_Report_on_the_Ocean_and_Cryosphere_LR.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eSROCC\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: SROCC Wikipedia URL: SROCC The United Nations \u0027 Intergovernmental Panel on Climate Change \u0027s (IPCC) Special Report on the Ocean and Cryosphere in a Changing Climate ( SROCC ) is a report about the effects of climate change on the world\u0027s seas , sea ice , icecaps and glaciers . It was approved at the IPCC\u0027s 51st Session (IPCC-51) in September 2019 in Monaco . The SROCC\u0027s approved Summary for Policymakers (SPM) was released on 25 September 2019. The 1,300-page report by 104 authors an...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "SSP", "label": "SSP", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eSSP\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: SSP Wikipedia URL: SSP SSP or ssp may refer to:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "SSPs", "label": "SSPs", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eS dd;line-height:1.4;\u0027\u003esearch term: subsidence Wikipedia URL: Subsidence Subsidence is a general term for downward vertical movement of the Earth\u0027s surface, which can be caused by both natural processes and human activities. Subsidence involves little or no horizontal movement, which distinguishes it from slope movement . Subsided house, called The Crooked House , the result of 19th-century mining subsidence in Staffordshire, England\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "subsurface ocean", "label": "subsurface ocean", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/70/PIA19656-SaturnMoon-Enceladus-Ocean-ArtConcept-20150915.jpg/500px-PIA19656-SaturnMoon-Enceladus-Ocean-ArtConcept-20150915.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003esubsurface ocean\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: subsurface ocean Wikipedia URL: Subsurface ocean Planetary oceanography , also called astro-oceanography or exo-oceanography , is the study of oceans on planets and moons other than Earth . This field developed after the discovery of sub-surface oceans in Saturn\u0027s moon Titan and Jupiter\u0027s moon Europa during the Voyager missions . The Cassini mission observed surface lakes of liquid methane on Titan, and directly sampled a plume of sub-surface ocean water from Enceladus . Artist\u0027s co...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "surface mass balance", "label": "surface mass balance", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/ed/2000-_Glacier_mass_change_-_global.svg/500px-2000-_Glacier_mass_change_-_global.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003esurface mass balance\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: surface mass balance Wikipedia URL: Surface mass balance A glacier\u0027s mass balance or surface mass balance (SMB)\u2014the difference between accumulation and ablation ( sublimation and melting)\u2014is crucial to the survival of the glacier . Climate change may cause variations in both temperature and snowfall, causing changes in the surface mass balance. Changes in mass balance control a glacier\u0027s long-term behavior and are the most sensitive climate indicators on a glacier. From 1980 to 2012...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "surface waters", "label": "surface waters", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/5/53/Lake_Kinney_mit_Mount_Whitehorn.jpg/250px-Lake_Kinney_mit_Mount_Whitehorn.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003esurface waters\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: surface waters Wikipedia URL: Surface waters Surface water is water located on top of land , forming terrestrial (surrounding by land on all sides) waterbodies , and may also be referred to as blue water , opposed to the seawater and waterbodies like the ocean . An inland lake, an example of surface water\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "Svalbard", "label": "Svalbard", "shape": "dot", "size": 13.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/b2/W_W_Svalbard_LandSat7_21.14475E_78.71545N.png/250px-W_W_Svalbard_LandSat7_21.14475E_78.71545N.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eSvalbard\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Svalbard Wikipedia URL: Svalbard Svalbard ( US : / \u02c8 s v \u0251\u02d0 l b \u0251\u02d0r ( d )/ SVAHL -bar(d) , UK : also / \u02c8 s v \u00e6 l -/ SVAL - , Urban East Norwegian: [\u02c8sv\u0251\u0302\u02d0\u026bb\u0251r] ), formerly Spitsbergen or Spitzbergen , is a Norwegian archipelago that lies at the convergence of the Arctic Ocean with the Atlantic Ocean . North of mainland Europe , it lies about midway between the northern coast of Norway and the North Pole . The islands of the group range from 74\u00b0 to 81\u00b0 north latitude, and from 10\u00b0 to...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "thermal expansion", "label": "thermal expansion", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/d6/Dehnungsfuge.jpg/250px-Dehnungsfuge.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ethermal expansion\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: thermal expansion Wikipedia URL: Thermal expansion Thermal expansion is the tendency of matter to increase in length , area , or volume , changing its size and density , in response to an increase in temperature (usually excluding phase transitions ). In simple words, the change in size of a body due to heating is called thermal expansion. Substances usually contract with decreasing temperature ( thermal contraction ), with rare exceptions within limited temperature ranges ( negativ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Thwaites Glacier", "label": "Thwaites Glacier", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/c/cf/Thwaites_Glacier.jpg/330px-Thwaites_Glacier.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eThwaites Glacier\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Thwaites Glacier Wikipedia URL: Thwaites Glacier Thwaites Glacier is an unusually broad and vast Antarctic glacier located east of Mount Murphy , on the Walgreen Coast of Marie Byrd Land . It was initially sighted by polar researchers in 1940, mapped in 1959\u20131966 and officially named in 1967, after the late American glaciologist Fredrik T. Thwaites. The glacier flows into Pine Island Bay , part of the Amundsen Sea , at surface speeds which exceed 2 kilometres (1.2 mi) per year near ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "tide gauges", "label": "tide gauges", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/f7/Tidal_gauge_dsc06189.jpg/250px-Tidal_gauge_dsc06189.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003etide gauges\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: tide gauges Wikipedia URL: Tide gauges A tide gauge is a device for measuring the change in sea level relative to a vertical datum . It is also known as a mareograph , marigraph , and sea-level recorder . When applied to freshwater continental water bodies , the instrument may also be called a limnimeter . A tide gauge\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "tides", "label": "tides", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/Tide_overview.svg/330px-Tide_overview.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003etides\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: tides Wikipedia URL: Tides Tides are the periodic rise and fall of sea level resulting from the differential gravitational forces exerted primarily by the Moon and the Sun , combined with inertial effects associated with the Earth\u2013Moon system\u2019s orbital motion and the Earth\u0027s rotation . Simplified schematic of only the lunar portion of Earth\u0027s tides, showing (exaggerated) high tides at the sublunar point and its antipode for the hypothetical case of an ocean of constant depth without...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "time series", "label": "time series", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/77/Random-data-plus-trend-r2.png/250px-Random-data-plus-trend-r2.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003etime series\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: time series Wikipedia URL: Time series In mathematics , a time series is a series of data points indexed (or listed or graphed) in time order. Most commonly, a time series is a sequence taken at successive equally spaced points in time. Thus it is a sequence of discrete-time data. Examples of time series are heights of ocean tides , counts of sunspots , and the daily closing value of the Dow Jones Industrial Average . Time series: random data plus trend, with best-fit line and diffe...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "tropics", "label": "tropics", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/b0/World_map_indicating_tropics_and_subtropics.png/500px-World_map_indicating_tropics_and_subtropics.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003etropics\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: tropics Wikipedia URL: Tropics The tropics are the region of Earth surrounding the equator , where the Sun may shine directly overhead . This contrasts with the temperate or polar regions of Earth, where the Sun can never be directly overhead. Because of Earth\u0027s axial tilt , the width of the tropics (in latitude) is twice the tilt. The tropics are also referred to as the tropical zone and the torrid zone (see geographical zone ). World map with the intertropical zone highlighted in ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "uncertainty", "label": "uncertainty", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/8b/Blank_Fork.png/250px-Blank_Fork.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003euncertainty\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: uncertainty Wikipedia URL: Uncertainty Uncertainty or incertitude refers to situations involving imperfect or unknown information . It applies to predictions of future events, to physical measurements that are already made, or to the unknown, and is particularly relevant for decision-making . Uncertainty arises in partially observable or stochastic or complex or dynamic environments, as well as due to ignorance , indolence , or both. It arises in any number of fields, including insu...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "United Kingdom", "label": "United Kingdom", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e9/Coat_of_arms_of_the_United_Kingdom_%282022%2C_both_variants%29.svg/250px-Coat_of_arms_of_the_United_Kingdom_%282022%2C_both_variants%29.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eUnited Kingdom\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: United Kingdom Wikipedia URL: United Kingdom The United Kingdom of Great Britain and Northern Ireland , commonly known as the United Kingdom ( UK ) or Britain , is a country in northwestern Europe , off the coast of the continental mainland . It comprises England , Scotland , Wales and Northern Ireland , with a population of over 69 million in 2024. The UK includes the island of Great Britain , the north-eastern part of the island of Ireland , and most of the smaller islands within ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "United States of America", "label": "United States of America", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/Extreme_Makeover%2C_Mesa_Verde_Edition_-_panoramio.jpg/250px-Extreme_Makeover%2C_Mesa_Verde_Edition_-_panoramio.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eUnited States of America\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: United States of America Wikipedia URL: United States of America The United States of America ( USA ), also known as the United States ( U.S. ) or America , is a country primarily located in North America . It is a federal republic of 50 states and a federal capital district , Washington, D.C. The 48 contiguous states border Canada to the north and Mexico to the south, with the semi-exclave of Alaska in the northwest and the archipelago of Hawaii in the Pacific Ocean . The United St...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "volcanic eruptions", "label": "volcanic eruptions", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/65/Lava_forms.jpg/250px-Lava_forms.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003evolcanic eruptions\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: volcanic eruptions Wikipedia URL: Volcanic eruptions A volcanic eruption occurs when material is expelled from a volcanic vent or fissure . Several types of volcanic eruptions have been distinguished by volcanologists . These are often named after famous volcanoes where that type of behavior has been observed. Some volcanoes may exhibit only one characteristic type of eruption during a period of activity, while others may display an entire sequence of types all in one eruptive serie...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Walker circulation", "label": "Walker circulation", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/68/LaNina.png/330px-LaNina.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eWalker circulation\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Walker circulation Wikipedia URL: Walker circulation The Walker circulation , also known as the Walker cell , is a conceptual model of the air flow in the tropics in the lower atmosphere ( troposphere ). According to this model, parcels of air follow a closed circulation in the zonal and vertical directions. This circulation, which is roughly consistent with observations, is caused by differences in heat distribution between ocean and land. In addition to motions in the zonal and ve...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "water masses", "label": "water masses", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Antarctic_bottom_water.svg/500px-Antarctic_bottom_water.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ewater masses\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: water masses Wikipedia URL: Water masses An oceanographic water mass is an identifiable body of water with a common formation history which has physical properties distinct from surrounding water. Properties include temperature , salinity , chemical - isotopic ratios, and other physical quantities which are conservative flow tracers . Water mass is also identified by its non-conservative flow tracers such as silicate, nitrate, oxygen, and phosphate. An example of different water mas...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "wave setup", "label": "wave setup", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/WaveMomentum.jpg/250px-WaveMomentum.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ewave setup\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: wave setup Wikipedia URL: Wave setup In fluid dynamics , wave setup is the increase in mean water level due to the presence of breaking waves . Similarly, wave setdown is a wave-induced decrease of the mean water level before the waves break (during the shoaling process). For short, the whole phenomenon is often denoted as wave setup, including both increase and decrease of mean elevation. This setup is primarily present in and near the coastal surf zone . Besides a spatial variatio...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "WBCs", "label": "WBCs", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/1f/Blausen_0909_WhiteBloodCells.png/330px-Blausen_0909_WhiteBloodCells.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eWBCs\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: WBCs Wikipedia URL: WBCs White blood cells (scientific name leukocytes ), also called immune cells or immunocytes , are cells of the immune system that are involved in protecting the body against both infectious disease and foreign entities. White blood cells are generally larger than red blood cells . They include three main subtypes: granulocytes , lymphocytes and monocytes .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Weddell Sea", "label": "Weddell Sea", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/Antarctic-seas-en.svg/330px-Antarctic-seas-en.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eWeddell Sea\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Weddell Sea Wikipedia URL: Weddell Sea The Weddell Sea is part of the Southern Ocean and contains the Weddell Gyre . Its land boundaries are defined by the bay formed from the coasts of Coats Land and the Antarctic Peninsula . The easternmost point is Cape Norvegia at Princess Martha Coast , Queen Maud Land . To the east of Cape Norvegia is the King Haakon VII Sea . Much of the southern part of the sea is co \u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "West Greenland", "label": "West Greenland", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/24/Greenland_west.PNG/250px-Greenland_west.PNG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eWest Greenland\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: West Greenland Wikipedia URL: West Greenland Kitaa , originally Vestgr\u00f8nland (\"West Greenland\"), is a former administrative division of Greenland . It was by far the most populated of the divisions, being home to almost 90% of the total population. The divisions were de facto replaced by statistical regions after Greenland received home rule in 1979. Map of West Greenland\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "western boundary currents", "label": "western boundary currents", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/1f/North_Pacific_Subtropical_Convergence_Zone.jpg/250px-North_Pacific_Subtropical_Convergence_Zone.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ewestern boundary currents\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: western boundary currents Wikipedia URL: Western boundary currents Boundary currents are ocean currents with dynamics determined by the presence of a coastline , and fall into two distinct categories: western boundary currents and eastern boundary currents . The main ocean currents involved with the North Pacific Gyre\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Wilkes Subglacial Basin", "label": "Wilkes Subglacial Basin", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eWilkes Subglacial Basin\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Wilkes Subglacial Basin Wikipedia URL: Wilkes Subglacial Basin The Wilkes Basin is a large subglacial basin situated generally southward of George V Coast and westward of Prince Albert Mountains in East Antarctica . The feature is approximately 1400 km long and 400 km wide. The Wilkes Basin is considered to be the largest marine-based drainage basin in East Antarctica, and may be in a state of marine ice sheet instability , caused by warm water intrusion into the shelf cavities.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "wind stress", "label": "wind stress", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/24/Sketch_zonal_wind_ocean_at_rest.jpg/500px-Sketch_zonal_wind_ocean_at_rest.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ewind stress\u003c/h3\u003e\n            \u003cdiv style <style>
#searchBox {
  position: fixed; top: 20px; left: 20px; z-index: 9999;
  background: rgba(0,0,0,0.6); padding: 10px 15px;
  border-radius: 8px; border: 1px solid #66b2ff;
}
#searchInput {
  width: 160px; padding: 5px; border: none; outline: none;
  background: #222; color: #fff; border-radius: 4px;
}
#searchButton {
  padding: 5px 8px; background: #66b2ff; color: #000;
  border: none; border-radius: 4px; cursor: pointer;
}
#legendBox {
  position: fixed; top: 20px; right: 20px; background: rgba(0,0,0,0.6);
  border: 1px solid #66b2ff; border-radius: 8px; padding: 10px 14px;
  z-index: 9999; color: #fff; font-family: system-ui, Helvetica, Arial;
  font-size: 13px; max-width: 200px; line-height: 1.6;
}
.legend-item { display: flex; align-items: center; margin-bottom: 5px; }
.legend-dot { width: 14px; height: 14px; border-radius: 50%; margin-right: 8px; }
.legend-blue { background: #66b2ff; }
.legend-orange { background: #ff9933; }
.legend-red { background: #ff5555; }
.legend-green { background: #00ff99; }
</style>

<div id="searchBox">
  <input id="searchInput" type="text" placeholder="Search node...">
  <button id="searchButton">Go</button>
</div>

<div id="legendBox">
  <div style="font-weight:bold;margin-bottom:5px;">🗺️ Node Colors</div>
  <div class="legend-item"><span class="legend-dot legend-green"></span>Highly Connected Nodes</div>
  <div class="legend-item"><span class="legend-dot legend-blue"></span>Main Topics</div>
  <div class="legend-item"><span class="legend-dot legend-orange"></span>Subfields / Categories</div>
  <div class="legend-item"><span class="legend-dot legend-red"></span>Related Concepts</div>
</div>

<script>
document.getElementById('searchButton').onclick = function() {
  var query = document.getElementById('searchInput').value.trim().toLowerCase();
  if (!query) return;
  var nodes = network.body.data.nodes.get();
  var found = nodes.find(n => n.label.toLowerCase() === query);
  if (found) {
    network.focus(found.id, {scale: 1.5, animation: true});
    network.selectNodes([found.id]);
  }
  document.getElementById('searchInput').value = '';
};
document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('searchButton').click();
});
</script>
