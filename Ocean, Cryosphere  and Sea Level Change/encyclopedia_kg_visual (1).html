                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "AABW", "label": "AABW", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Antarctic_bottom_water.svg/500px-Antarctic_bottom_water.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eAABW\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: AABW Wikipedia URL: AABW The Antarctic bottom water ( AABW ) is a type of water mass in the Southern Ocean surrounding Antarctica with temperatures ranging from \u22120.8 to 2 \u00b0C (35 \u00b0F) and absolute salinities from 34.6 to 35.0 g/kg. As the densest water mass of the oceans, AABW is found to occupy the depth range below 4000 m of all ocean basins that have a connection to the Southern Ocean at that level. AABW forms the lower branch of the large-scale movement in the world\u0027s oceans throu...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "AAIW", "label": "AAIW", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eAAIW\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: AAIW Wikipedia URL: AAIW Antarctic Intermediate Water (AAIW) is a cold, relatively low salinity water mass found mostly at intermediate depths in the Southern Ocean . The AAIW is formed at the ocean surface in the Antarctic Convergence zone or more commonly called the Antarctic Polar Front zone. This convergence zone is normally located between 50\u00b0S and 60\u00b0S, hence this is where almost all of the AAIW is formed.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "ACC", "label": "ACC", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eACC\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: ACC Wikipedia URL: ACC ACC most often refers to:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Agulhas leakage", "label": "Agulhas leakage", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/dc/Agulhas_pathway.png/500px-Agulhas_pathway.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eAgulhas leakage\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Agulhas leakage Wikipedia URL: Agulhas Leakage The Agulhas Leakage is an inflow of anomalously warm and saline water from the Indian Ocean into the South Atlantic due to the limited latitudinal extent of the African continent compared to the southern extension of the subtropical super gyre in the Indian Ocean. The process occurs during the retroflection of the Agulhas Current via shedding of anticyclonic Agulhas Rings , cyclonic eddies and direct inflow. The leakage contributes to t...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "AIS", "label": "AIS", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eAIS\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: AIS Wikipedia URL: AIS\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Alaska", "label": "Alaska", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/Russian_Sloop-of-War_Neva.jpg/250px-Russian_Sloop-of-War_Neva.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eAlaska\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Alaska Wikipedia URL: Alaska Alaska ( / \u0259 \u02c8 l \u00e6 s k \u0259 / \u24d8 \u0259- LASS -k\u0259 ) is a non-contiguous U.S. state located in the northwestern regions of North America. Part of the Western United States region, it is one of the two non-contiguous U.S. states, alongside Hawaii . Alaska is considered to be the northernmost, westernmost, and, longitudinally, the easternmost state in the United States. It is a semi-exclave of the U.S., bordering the Canadian territory of Yukon and the province of B...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "American Meteorological Society", "label": "American Meteorological Society", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/en/thumb/9/91/American_Meteorological_Society_logo.png/250px-American_Meteorological_Society_logo.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eAmerican Meteorological Society\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: American Meteorological Society Wikipedia URL: American Meteorological Society The American Meteorological Society ( AMS ) is a scientific and professional organization in the United States promoting and disseminating information about the atmospheric , oceanic , and hydrologic sciences . Its mission is to advance the atmospheric and related sciences, technologies, specifications, applications and services for the benefit of society.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "AMOC", "label": "AMOC", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/d4/OCP07_Fig-6.jpg/250px-OCP07_Fig-6.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eAMOC\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: AMOC Wikipedia URL: AMOC The Atlantic meridional overturning circulation ( AMOC ) is the main ocean current system in the Atlantic Ocean . It is a component of Earth\u0027s ocean circulation system and plays an important role in the climate system . The AMOC includes Atlantic currents at the surface and at great depths that are driven by changes in weather, temperature and salinity . Those currents comprise half of the global thermohaline circulation that includes the flow of major ocean...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Amundsen Sea Embayment", "label": "Amundsen Sea Embayment", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/ee/AmundsenSea.jpg/250px-AmundsenSea.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eAmundsen Sea Embayment\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Amundsen Sea Embayment Wikipedia URL: Amundsen Sea Embayment The Amundsen Sea is an arm of the Southern Ocean off Marie Byrd Land in western Antarctica . It lies between Cape Flying Fish (the northwestern tip of Thurston Island ) to the east and Cape Dart on Siple Island to the west. Cape Flying Fish marks the boundary between the Amundsen Sea and the Bellingshausen Sea . West of Cape Dart there is no named marginal sea of the Southern Ocean between the Amundsen and Ross Seas. The N...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Andes", "label": "Andes", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/17/Cordillera_de_los_Andes.jpg/330px-Cordillera_de_los_Andes.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eAndes\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Andes Wikipedia URL: Andes The Andes ( / \u02c8 \u00e6 n d i\u02d0 z / AN -deez ), Andes Mountains or Andean Mountain Range ( Spanish : Cordillera de los Andes ; Quechua : Anti ) are the longest continental mountain range in the world , forming a continuous highland along the western edge of South America . The range is 8,900 km (5,500 mi) long and 200 to 700 km (120 to 430 mi) wide (widest between 18\u00b0S and 20\u00b0S latitude ) and has an average height of about 4,000 m (13,000 ft). The Andes extend fr...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Antarctic", "label": "Antarctic", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/74/Antarctic-Overview-Map-EN.tif/lossless-page1-250px-Antarctic-Overview-Map-EN.tif.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eAntarctic\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Antarctic Wikipedia URL: Antarctic The Antarctic ( / \u00e6 n \u02c8 t \u0251\u02d0r ( k ) t \u026a k / , US also / \u00e6 n t \u02c8 \u0251\u02d0r ( k ) t \u026a k / ; commonly / \u00e6 n \u02c8 \u0251\u02d0r t \u026a k / ) is the polar region of Earth that surrounds the South Pole , lying within the Antarctic Circle . It is diametrically opposite of the Arctic region around the North Pole . A map of the Antarctic region, including the Antarctic Convergence and the 60th parallel south\u003c/div\u003e\n        \u003c/div\ ing it the second-largest country by total area , with the longest coastline of any country. Its border with the United States is the longest international land border. The country is characterized by a wide range of both meteorologic and geological regions. With a population of over 41...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "CDW", "label": "CDW", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/24/Cdw-c-orbital-logo-2023-rgb.svg/250px-Cdw-c-orbital-logo-2023-rgb.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eCDW\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: CDW Wikipedia URL: CDW CDW Corporation is an American multi-brand provider of information technology services, serving business, government, education, and healthcare sectors across the United States, the United Kingdom, and Canada. Headquartered in Vernon Hills, Illinois, CDW is a Fortune 500 and generated $21 billion in annual net sales in 2023.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Circumpolar Deep Water", "label": "Circumpolar Deep Water", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Antarctic_bottom_water.svg/500px-Antarctic_bottom_water.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eCircumpolar Deep Water\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Circumpolar Deep Water Wikipedia URL: Circumpolar Deep Water Circumpolar Deep Water ( CDW ) is a designation given to the water mass in the Pacific and Indian oceans that is a mixing of other water masses in the region. It is characteristically warmer and saltier than the surrounding water masses, causing CDW to contribute to the melting of ice shelves in the Antarctic region. North Atlantic Deep Water and Antarctic Bottom Water blend to form Circumpolar Deep Water.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#66b2ff", "font": {"color": "#FFFFFF"}, "id": "climate change", "label": "climate change", "shape": "dot", "size": 19.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Common_Era_Temperature.svg/500px-Common_Era_Temperature.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eclimate change\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: climate change Wikipedia URL: Climate change Present-day climate change includes both global warming \u2014the ongoing increase in global average temperature \u2014and its wider effects on Earth\u0027s climate system . Climate change in a broader sense also includes previous long-term changes to Earth\u0027s climate . The modern-day rise in global temperatures is driven by human activities , especially fossil fuel ( coal , oil and natural gas ) burning since the Industrial Revolution . Fossil fuel use,...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Climate Dynamics", "label": "Climate Dynamics", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/en/f/f3/Climate_Dynamics.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eClimate Dynamics\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Climate Dynamics Wikipedia URL: Climate Dynamics Climate Dynamics is a peer-reviewed scientific journal published by Springer Science+Business Media . It covers all aspects of the dynamics of global climate systems, including analytical and numerical modeling research on the structure and behavior of the atmosphere , oceans , cryosphere , biomass , and land surface as interacting components of the dynamics of global climate . The journal also publishes reviews and papers emphasizing...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "climate models", "label": "climate models", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/43/20250712_Climate_model_inputs_and_outputs.svg/500px-20250712_Climate_model_inputs_and_outputs.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eclimate models\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: climate models Wikipedia URL: Climate models Numerical climate models (or climate system models ) are mathematical models that can simulate the interactions of important drivers of climate . These drivers are the atmosphere , oceans , land surface and ice . Scientists use climate models to study the dynamics of the climate system and to make projections of future climate and of climate change . Climate models can also be qualitative (i.e. not numerical) models and contain narratives...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "climate variability", "label": "climate variability", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/1951%2B_Percent_of_global_area_at_temperature_records_-_Seasonal_comparison_-_NOAA.svg/500px-1951%2B_Percent_of_global_area_at_temperature_records_-_Seasonal_comparison_-_NOAA.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eclimate variability\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: climate variability Wikipedia URL: Climate variability Climate variability includes all the variations in the climate that last longer than individual weather events, whereas the term climate change only refers to those variations that persist for a longer period of time, typically decades or more. Climate change may refer to any time in Earth\u0027s history, but the term is now commonly used to describe contemporary climate change, often popularly referred to as global warming. Since th...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "coastal upwelling", "label": "coastal upwelling", "shape": "dot", "size": ean Wikipedia URL: Deep ocean The deep sea is broadly defined as the ocean depth where light begins to fade, at an approximate depth of 200 m (660 ft) or the point of transition from continental shelves to continental slopes . Conditions within the deep sea are a combination of low temperatures, darkness, and high pressure . The deep sea is considered the least explored Earth biome as the extreme conditions make the environment difficult to access and explore. Schematic repre...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "deglaciation", "label": "deglaciation", "shape": "dot", "size": 14.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/db/Retrait_des_glaces_en_Am%C3%A9rique.svg/250px-Retrait_des_glaces_en_Am%C3%A9rique.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003edeglaciation\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: deglaciation Wikipedia URL: Deglaciation Deglaciation is the transition from full glacial conditions during ice ages , to warm interglacials , characterized by global warming and sea level rise due to change in continental ice volume. Thus, it refers to the retreat of a glacier , an ice sheet or frozen surface layer, and the resulting exposure of the Earth \u0027s surface. The decline of the cryosphere due to ablation can occur on any scale from global to localized to a particular glacie...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "dynamic response", "label": "dynamic response", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:4 ht;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eGeophysics\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Geophysics Wikipedia URL: Geophysics Geophysics ( / \u02cc d\u0292 i\u02d0 o\u028a \u02c8 f \u026a z \u026a k s / ) is a physical science concerned with the processes and properties of Earth and its surrounding space environment , studied using quantitative and observational methods. It focuses primarily on Earth\u2019s shape and its gravitational , magnetic , and electromagnetic fields . It also studies internal structure , composition , and dynamics , and their surface expression in tectonics , volcanism , and rock form...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Geoscientific Model Development", "label": "Geoscientific Model Development", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/en/f/fb/Gmd_cover.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eGeoscientific Model Development\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Geoscientific Model Development Wikipedia URL: Geoscientific Model Development Geoscientific Model Development is a peer-reviewed open access scientific journal published by Copernicus Publications on behalf of the European Geosciences Union . It covers the description, development, and evaluation of numerical models of the Earth system and its components.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#F  are the gases in an atmosphere that trap heat, raising the surface temperature of astronomical bodies such as Earth. Unlike other gases, greenhouse gases absorb the radiations that a planet emits , resulting in the greenhouse effect . The Earth is warmed by sunlight, causing its surface to radiate heat , which is then mostly absorbed by greenhouse gases. Without greenhouse gases in the atmosphere, the average...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "Greenland", "label": "Greenland", "shape": "dot", "size": 14.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/17/Denmark-Greenland_%28orthographic_projection%29.svg/250px-Denmark-Greenland_%28orthographic_projection%29.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eGreenland\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Greenland Wikipedia URL: Greenland in the Kingdom of Denmark (light green)\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "Greenland Ice Sheet", "label": "Greenland Ice Sheet", "shape": "dot", "size": 13.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/9/98/Greenland_ice_sheet_AMSL_thickness_map-en.png/330px-Greenland_ice_sheet_AMSL_thickness_map-en.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eGreenland Ice Sheet\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Greenland Ice Sheet Wikipedia URL: Greenland Ice Sheet The Greenland ice sheet is an ice sheet which forms the second-largest body of ice in the world. It is an average of 1,673 m (5,489 ft) thick and over 3,488 m (11,444 ft) thick at its maximum. It is almost 2,900 kilometres (1,800 mi) long in a north\u2013south direction, with a maximum width of 1,100 kilometres (680 mi) at a latitude of 77\u00b0N , near its northern edge. The ice sheet covers 1,710,000 square kilometres (660,000 sq mi), a...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "groundwater", "label": "groundwater", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/38/Groundwater_%28aquifer%2C_aquitard%2C_3_type_wells%29.PNG/500px-Groundwater_%28aquifer%2C_aquitard%2C_3_type_wells%29.PNG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egroundwater\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: groundwater Wikipedia URL: Groundwater Groundwater is the water present beneath Earth \u0027s surface in rock and soil pore spaces and in the fractures of rock formations . About 30 percent of all readily available fresh water in the world is groundwater. A unit of rock or an unconsolidated deposit is called an aquifer when it can yield a usable quantity of water. The depth at which soil pore spaces or fractures and voids in rock become completely saturated with water is called the water...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "groundwater extraction", "label": "groundwater extraction", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/Water_extraction_plant_-_geograph.org.uk_-_955088.jpg/250px-Water_extraction_plant_-_geograph.org.uk_-_955088.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egroundwater extraction\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: groundwater extraction Wikipedia URL: Groundwater extraction Water extraction (also known as water withdrawal , water abstraction , and water intake ) is the process of taking water from any source, either temporarily or permanently, for flood control or to obtain water for purposes such as irrigation . The extracted water could also be used as drinking water after suitable treatment. Water extraction plant alongside the flooding River Dove near Egginton , England, UK\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "GSAT", "label": "GSAT", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/GSAT-7A_in_delpoyed_configuration.png/330px-GSAT-7A_in_delpoyed_configuration.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eGSAT\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: GSAT Wikipedia URL: GSAT The GSAT (Geosynchronous Satellite) series is a family of Indian communications satellites , indigenously developed and operated by the ISRO . The prorgamme was initiated in the early 2000s to create indigenous, multi-purpose, geostationary spacecrafts capable of supporting India\u0027s growing needs in telecommunications , broadcasting , broadband , emergency management , reconnaissance and navigation . The programme was supported by the development of Geosynchr...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Gulf Stream", "label": "Gulf Stream", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/19/Golfstrom.jpg/363px-Golfstrom.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eGulf Stream\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Gulf Stream Wikipedia URL: Gulf Stream The Gulf Stream is a warm and swift Atlantic ocean current that originates in the Gulf of Mexico and flows through the Straits of Florida and up the eastern coastline of the United States, then veers east near 36\u00b0N latitude (North Carolina) and moves toward Northwest Europe as the North Atlantic Current . The process of western intensification causes the Gulf Stream to be a northward-accelerating current off the east coast of North America. Aro...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "gyres", "label": "gyres", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u  Holocene is an interglacial period within the ongoing glacial cycles of the Quaternary, and is equivalent to Marine Isotope Stage 1...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "hydrological cycle", "label": "hydrological cycle", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/60/USGS_WaterCycle_English_ONLINE_20221013.png/500px-USGS_WaterCycle_English_ONLINE_20221013.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ehydrological cycle\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: hydrological cycle Wikipedia URL: Hydrological cycle The water cycle (or hydrologic cycle or hydrological cycle ) is a biogeochemical cycle that involves the continuous change in form of water on, above and below the surface of the Earth across different reservoirs. The mass of water on Earth remains fairly constant over time. However, the partitioning of the water into the major reservoirs of ice , fresh water , salt water and atmospheric water is variable and depends on climatic v...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "Hydrology", "label": "Hydrology", "shape": "dot", "size": 13.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/da/Rain_over_Beinn_Eich%2C_Luss_Hills%2C_Scotland.jpg/330px-Rain_over_Beinn_Eich%2C_Luss_Hills%2C_Scotland.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4p  An ice cap will typically feed a series of glaciers around it...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "ice shelves", "label": "ice shelves", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a1/Larsen_Ice_Shelf_in_Antarctica.jpg/330px-Larsen_Ice_Shelf_in_Antarctica.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eice shelves\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: ice shelves Wikipedia URL: Ice shelves An ice shelf is a large platform of glacial ice floating on the ocean, fed by one or multiple tributary glaciers . Ice shelves form along coastlines where the ice thickness is insufficient to displace the more dense surrounding ocean water . The boundary between the ice shelf (floating) and grounded ice (resting on bedrock or sediment ) is referred to as the grounding line; the boundary between the ice shelf and the open ocean (often covered by...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "iceberg calving", "label": "iceberg calving", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/8f/SantaCruz-Spegazzini-CaidaAnimation.gif/250px-SantaCruz-Spegazzini-CaidaAnimation.gif\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eiceberg calving\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: iceberg calving Wikipedia URL: Iceberg calving Ice calving , also known as glacier calving or iceberg calving , is the breaking of ice chunks from the edge of a glacier. It is a form of ice ablation or ice disruption . It is the sudden release and breaking away of a mass of ice from a glacier , iceberg , ice front , ice shelf , or crevasse . The ice that breaks away can be classified as an iceberg, but may also be a growler, bergy bit, or a crevasse wall breakaway. A mass of ice cal...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "Iceland", "label": "Iceland", "shape": "dot", "size": 14.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/d0/Norsemen_Landing_in_Iceland.jpg/250px-Norsemen_Landing_in_Iceland.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eIceland\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Iceland Wikipedia URL: Iceland Iceland is a Nordic island country between the Arctic Ocean and the North Atlantic Ocean , located on the Mid-Atlantic Ridge between Europe and North America . It is culturally and politically linked with Europe and is the region\u0027s westernmost and most sparsely populated country . Its capital and largest city is Reykjav\u00edk , which is home to about 36% of the country\u0027s roughly 390,000 residents (excluding nearby towns/suburbs, which are separate municipa...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "IMBIE", "label": "IMBIE", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eIMBIE\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: IMBIE Wikipedia URL: IMBIE The Ice Sheet Mass Balance Inter-comparison Exercise (IMBIE) is an international scientific collaboration attempting to improve estimates of the Antarctic and Greenland ice sheet contribution to sea level rise and to publish data and analyses concerning these subjects. IMBIE was founded in 2011 and is a collaboration between the European Space Agency (ESA) and the National Aeronautics and Space Administration ( NASA ) of the United States, and contributes ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Indian Ocean", "label": "Indian Ocean", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/d3/Indian_Ocean-CIA_WFB_Map.png/330px-Indian_Ocean-CIA_WFB_Map.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eIndian Ocean\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Indian Ocean Wikipedia URL: Indian Ocean Main five oceans division:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Indonesian Throughflow", "label": "Indonesian Throughflow", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eIndonesian Throughflow\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Indonesian Throughflow Wikipedia URL: Indonesian Throughflow The Indonesian Throughflow (ITF; Indonesian : Arus Lintas Indonesia ) is an ocean current with importance for global climate as is the low-latitude movement of warm, relative freshwater from the north Pacific to the Indian Ocean . It thus serves as a main upper branch of the global heat/salt conveyor belt .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "interglacial period", "label": "interglacial period", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/f8/Ice_Age_Temperature.png/330px-Ice_Age_Temperature.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003einterglacial period\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: interglacial period Wikipedia URL: Interglacial period An interglacial period (or alternatively interglacial , interglaciation ) is a geological interval of warmer global average temperature lasting thousands of years that separates consecutive glacial periods within an ice age . The current Holocene interglacial began at the end of the Pleistocene , about 11,700 years ago. Shows the pattern of temperature and ice volume changes associated with recent glacials and interglacials\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Irminger Sea", "label": "Irminger Sea", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/da/Tasiilaq.jpg/330px-Tasiilaq.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eIrminger Sea\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Irminger Sea Wikipedia URL: Irminger Sea The Irminger Sea is a marginal sea of the North Atlantic Ocean . It is bordered to the west by southern Greenland , to the north by Iceland and the Denmark Strait , to the east by the Reykjanes Ridge (a northern part of the Mid-Atlantic Ridge ), and to the south by open waters of the North Atlantic.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Labrador Sea", "label": "Labrador Sea", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/70/Labrador-sea-paamiut.jpg/330px-Labrador-sea-paamiut.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eLabrador Sea\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Labrador Sea Wikipedia URL: Labrador Sea The Labrador Sea ( French : mer du Labrador ; Danish : Labradorhavet ) is an arm of the North Atlantic Ocean between the Labrador Peninsula and Greenland . The sea is flanked by continental shelves to the southwest, northwest, and northeast. It connects to the north with Baffin Bay through the Davis Strait . It is a marginal sea of the Atlantic.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "Last Glacial Maximum", "label": "Last Glacial Maximum", "shape": "dot", "size": 13.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/19/CLIMAP.jpg/250px-CLIMAP.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eLast Glacial Maximum\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Last Glacial Maximum Wikipedia URL: Last Glacial Maximum The Last Glacial Maximum ( LGM ), also referred to as the Last Glacial Coldest Period , was the most recent time during the Last Glacial Period where ice sheets were at their greatest extent between 26,000 and 20,000 years ago. Ice sheets covered much of Northern North America , Northern Europe , and Asia and profoundly affected Earth \u0027s climate by causing a major expansion of deserts, along with a large drop in sea levels. A ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Last Interglacial", "label": "Last Interglacial", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/EPICA_delta_D_plot.svg/250px-EPICA_delta_D_plot.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eLast Interglacial\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Last Interglacial Wikipedia URL: Last Interglacial The Last Interglacial was the interglacial period that began about 130,000 years ago at the end of the Penultimate Glacial Period , and ended about 115,000 years ago at the beginning of the Last Glacial Period . It corresponds to Marine Isotope Stage 5e . It was the second-to-latest interglacial of the current Ice Age, the most recent being the Holocene which extends to the present day (having followed the Last Glacial Period). Duri...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "LIG", "label": "LIG", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eLIG\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: LIG Wikipedia URL: LIG The Laboratoire d\u0027Informatique de Grenoble ( LIG , Grenoble Computer Science Laboratory) is the largest research laboratory of Informatics in Grenoble , France . It was created 1 January 2007, as the result of a union of the 24 research teams of the previous IMAG Institute and the INRIA Rh\u00f4ne-Alpes.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "low confidence", "label": "low confidence", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/NIE_cover_Iran_2007.jpg/250px-NIE_cover_Iran_2007.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003elow confidence\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: low confidence Wikipedia URL: Low confidence Analytic confidence is a rating employed by intelligence analysts to convey doubt to decision makers about a statement of estimative probability . The need for analytic confidence ratings arise from analysts\u0027 imperfect knowledge of a conceptual model . An analytic confidence rating pairs with a statement using a word of estimative probability to form a complete analytic statement. Scientific methods for determining analytic confidence rem...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "marine heatwaves", "label": "marine heatwaves", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/Recent_marine_heatwaves.png/500px-Recent_marine_heatwaves.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emarine heatwaves\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: marine heatwaves Wikipedia URL: Marine heatwaves A marine heatwave is a period of abnormally high sea surface temperatures (SST) compared to typical temperatures for a particular season and locale. Marine heatwaves are caused by a variety of drivers. These include short term weather events such as fronts , intraseasonal events (30 to 90 days), annual, and decadal (10-year) modes like El Ni\u00f1o events , and human-caused climate change . Such heatwaves affect marine ecosystems . For exa...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Marine Isotope Stage 11", "label": "Marine Isotope Stage 11", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/f7/Five_Myr_Climate_Change.svg/500px-Five_Myr_Climate_Change.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eMarine Isotope Stage 11\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Marine Isotope Stage 11 Wikipedia URL: Marine Isotope Stage 11 Marine Isotope Stage 11 or MIS 11 is a Marine Isotope Stage in the geologic temperature record , covering the interglacial period between 424,000 and 374,000 years ago. It corresponds to the Hoxnian Stage in Britain. 5 million year history, representing the Lisiecki and Raymo (2005) LR04 Benthic Stack\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Marine Science", "label": "Marine Science", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/4c/Thermohaline_Circulation_2.png/250px-Thermohaline_Circulation_2.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eMarine Science\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Marine Science Wikipedia URL: Marine Science Oceanography (from Ancient Greek \u1f60\u03ba\u03b5\u03b1\u03bd\u03cc\u03c2 ( \u014dkean\u00f3s ) \u0027 ocean \u0027 and \u03b3\u03c1\u03b1\u03c6\u03ae ( graph\u1e17 ) \u0027 writing \u0027 ), also known as oceanology , sea science , ocean science , and marine science , is the scientific study of the ocean , including its physics , chemistry , biology , and geology . Thermohaline circulation\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "mass balance", "label": "mass balance", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/15/Mass_bal_clarifier.svg/500px-Mass_bal_clarifier.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emass balance\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: mass balance Wikipedia URL: Mass balance In physics , a mass balance , also called a material balance , is an application of conservation of mass to the analysis of physical systems . By accounting for material entering and leaving a system, mass flows can be identified which might have been unknown, or difficult to measure without this technique. The exact conservation law used in the analysis of the system depends on the context of the problem, but all revolve around mass conserva...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "mass loss", "label": "mass loss", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/13/NASA_Unveils_Celestial_Fireworks_as_Official_Hubble_25th_Anniversary_Image.jpg/330px-NASA_Unveils_Celestial_Fireworks_as_Official_Hubble_25th_Anniversary_Image.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emass loss\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: mass loss Wikipedia URL: Mass loss Stellar mass loss is a phenomenon observed in stars by which stars lose some mass over their lives. Mass loss can be caused by triggering events that cause the sudden ejection of a large portion of the star\u0027s mass. It can also occur when a star gradually loses material to a binary companion or due to strong stellar winds . Massive stars are particularly susceptible to losing mass in the later stages of evolution. The amount and rate of mass loss va...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "MHWs", "label": "MHWs", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/19/Tide_legal_use.gif/500px-Tide_legal_use.gif\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eMHWs\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: MHWs Wikipedia URL: MHWS A chart datum is the water surface serving as origin (or coordinate surface ) of depths displayed on a nautical chart and for reporting and predicting tide heights . A chart datum is generally derived from some tidal phase , in which case it is also known as a tidal datum . Common chart datums are lowest astronomical tide (LAT) and mean lower low water (MLLW). In non-tidal areas, e.g., the Baltic Sea , argin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eNordic Seas\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Nordic Seas Wikipedia URL: Nordic Seas The Nordic Seas are located north of Iceland and south of Svalbard . They have also been defined as the region located north of the Greenland-Scotland Ridge and south of the Fram Strait-Spitsbergen-Norway intersection. Known to connect the North Pacific and the North Atlantic waters, this region is also known as having some of the densest waters, creating the densest region found in the North Atlantic Deep Water . The deepest waters of the Arct...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "North America", "label": "North America", "shape": "dot", "size": 16.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/43/Location_North_America.svg/250px-Location_North_America.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eNorth America\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: North America Wikipedia URL: North America North America is a continent in the Northern and Western hemispheres. North America is bordered to the north by the Arctic Ocean , to the east by the Atlantic Ocean , to the southeast by South America and the Caribbean Sea , and to the south and west by the Pacific Ocean . The region includes Middle America comprising the Caribbean , Central America , and Northern America .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "North Atlantic", "label": "North Atlantic", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/Atlantic_Ocean_-_en.png/328px-Atlantic_Ocean_-_en.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eNorth Atlantic\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: North Atlantic Wikipedia URL: North Atlantic The Atlantic Ocean is the second largest of the world\u0027s five oceanic divisions , with an area of about 85,133,000 km 2 (32,870,000 sq mi). It covers approximately 17% of Earth\u0027s surface and about 24% of its water surface area. During the Age of Discovery , it was known for separating the New World of the Americas ( North America and South America ) from the Old World of Afro-Eurasia ( Africa , Asia , and Europe ).\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "North Atlantic Deep Water", "label": "North Atlantic Deep Water", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e9/Climate-tipping-points-en.svg/330px-Climate-tipping-points-en.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eNorth Atlantic Deep Water\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: North Atlantic Deep Water Wikipedia URL: North Atlantic Deep Water North Atlantic Deep Water ( NADW ) is a deep water mass formed in the North Atlantic Ocean . Thermohaline circulation (properly described as meridional overturning circulation) of the world\u0027s oceans involves the flow of warm surface waters from the southern hemisphere into the North Atlantic. Water flowing northward becomes modified through evaporation and mixing with other water masses, leading to increased salinity...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "North Atlantic Oscillation", "label": "North Atlantic Oscillation", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/0/08/Nao_indices_comparison.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eNorth Atlantic Oscillation\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: North Atlantic Oscillation Wikipedia URL: North Atlantic Oscillation The North Atlantic Oscillation ( NAO ) is a weather phenomenon over the North Atlantic Ocean of fluctuations in the difference of atmospheric pressure at sea level (SLP) between the Icelandic Low and the Azores High . Through fluctuations in the strength of the Icelandic Low and the Azores High, it controls the strength and direction of westerly winds and location of storm tracks across the North Atlantic.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "North Pacific", "label": "North Pacific", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/  circulation An ocean current is a continuous, directed movement of seawater generated by a number of forces acting upon the water, including wind, the Coriolis effect , breaking waves , cabbeling , and temperature and salinity differences. Depth contours , shoreline configurations, and interactions with other currents influence a current\u0027s direction and strength. Ocean currents move both horizontally, on scales that can span entire oceans, as w...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Ocean Dynamics", "label": "Ocean Dynamics", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eOcean Dynamics\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Ocean Dynamics Wikipedia URL: Ocean Dynamics Dol Ammad is a heavy metal band formed in 2000 by Greek keyboard player Thanasis Lightbridge. Dol Ammad is characterizeded with instrumentation which layers conventional metal instrumentation (bass, drums, and electric guitar), synthesizers, and the vocal support of a fourteen-member four-part choir. Lightbridge describes his music as \" electronica art metal\" and cites electronic music pioneers Jean Michel Jarre and Vangelis as key influe...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "ocean dynamics", "label": "ocean dynamics", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eocean dynamics\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: ocean dynamics Wikipedia URL: Ocean dynamics Ocean dynamics define and describe the flow of water within the oceans. Ocean temperature and motion fields can be separated into three distinct layers: mixed (surface) layer, upper ocean (above the thermocline ), and deep ocean.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "ocean stratification", "label": "ocean stratification", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/c/c0/CLINES1.png/960px-CLINES1.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eocean stratification\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: ocean stratification Wikipedia URL: Ocean stratification Ocean stratification is the natural separation of an ocean\u0027s water into horizontal layers by density . This is generally stable stratification , because warm water floats on top of cold water, and heating is mostly from the sun, which reinforces that arrangement. Stratification is reduced by wind-forced mechanical mixing, but reinforced by convection (warm water rising, cold water sinking). Stratification occurs in all ocean b...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "ocean surface", "label": "ocean surface", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/bb/Ocean_surface_slick_%28cropped%29.jpg/330px-Ocean_surface_slick_%28cropped%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eocean surface\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: ocean surface Wikipedia URL: Ocean surface The sea surface microlayer ( SML ) is the boundary interface between the atmosphere and ocean , covering about 70% of Earth \u0027s surface. With an operationally defined thickness between 1 and 1,000 \u03bcm (1.0 mm ), the SML has physicochemical and biological properties that are measurably distinct from underlying waters. Recent studies now indicate that the SML covers the ocean to a significant extent, and evidence shows that it is an aggregate-e...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "ocean temperature", "label": "ocean temperature", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/5/57/1997_Thermoclines.svg/250px-1997_Thermoclines.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eocean temperature\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: ocean temperature Wikipedia URL: Ocean temperature The ocean temperature plays a crucial role in the global climate system , ocean currents and for marine habitats . It varies depending on depth , geographical location and season . Not only does the temperature differ in seawater , so does the salinity . Warm surface water is generally saltier than the cooler deep or polar waters. In polar regions, the upper layers of ocean water are cold and fresh. Deep ocean water is cold, salty w...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "ocean warming", "label": "ocean warming", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/15/1955-_Ocean_heat_content_-_NOAA.svg/500px-1955-_Ocean_heat_content_-_NOAA.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eocean warming\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: ocean warming Wikipedia URL: Ocean warming Ocean heat content (OHC) or ocean heat uptake (OHU) is the energy absorbed and stored by oceans . It is an important indicator of global warming . Ocean heat content is calculated by measuring ocean temperature at many different locations and depths, and integrating the areal density of a change in enthalpic energy over an ocean basin or entire ocean. The ocean heat content (OHC) has been increasing for decades as the ocean has been absorbi...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "OHC", "label": "OHC", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Head_D15A3.JPG/250px-Head_D15A3.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eOHC\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: OHC Wikipedia URL: OHC An overhead camshaft ( OHC ) engine is a piston engine in which the camshaft is located in the cylinder head above the combustion chamber . This contrasts with earlier overhead valve engines (OHV), where the camshaft is located below the combustion chamber in the engine block . OHC cylinder head (for a 1987 Honda D15A3 engine)\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "OHT", "label": "OHT", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eOHT\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: OHT Wikipedia URL: OHT OHT or oht may refer to:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "orbital forcing", "label": "orbital forcing", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/b8/Vostok_Petit_data.svg/500px-Vostok_Petit_data.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eorbital forcing\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: orbital forcing Wikipedia URL: Orbital forcing Orbital forcing is the effect on climate of slow changes in the tilt of the Earth \u0027s axis and shape of the Earth\u0027s orbit around the Sun (see Milankovitch cycles ). These orbital changes modify the total amount of sunlight reaching the Earth by up to 25% at mid-latitudes (from 400 to 500 W/(m 2 ) at latitudes of 60 degrees). [ citation needed ] In this context, the term \"forcing\" signifies a physical process that affects the Earth\u0027s clim...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "overlay", "label": "overlay", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eoverlay\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: overlay Wikipedia URL: Overlay Overlay may refer to:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Paleoceanography", "label": "Paleoceanography", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ePaleoceanography\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Paleoceanography Wikipedia URL: Paleoceanography Paleoceanography is the study of the history of the oceans in the geologic past with regard to biology , chemistry , circulation, geology, and patterns of biological productivity and sedimentation . Paleoceanographic studies using environment models and different proxies enable the scientific community to assess the role of the oceanic processes in the global climate by the re-construction of past climate at various intervals. Paleoce...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "permafrost", "label": "permafrost", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui, e motions and physical properties of ocean waters.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Pine Island Glacier", "label": "Pine Island Glacier", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/30/Fieldcamp.jpg/330px-Fieldcamp.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ePine Island Glacier\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Pine Island Glacier Wikipedia URL: Pine Island Glacier Pine Island Glacier ( PIG ) is a large ice stream , and the fastest melting glacier in Antarctica . responsible for about 13% of Antarctica\u0027s ice loss. The glacier flows west-northwest along the south side of the Hudson Mountains into Pine Island Bay , part of the Amundsen Sea . The area drained by Pine Island Glacier comprises about 10% of the West Antarctic Ice Sheet . Satellite measurements have shown that the Pine Island Gla...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "polar regions", "label": "polar regions", "shape": "dot", "size": 13.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epolar regions\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: polar regions Wikipedia URL: Polar regions The polar regions , also called the frigid zones or polar zones , of Earth are Earth\u0027s polar ice caps , the regions of the planet that surround its geographical poles (the North Pole and the South Pole ), lying within the polar circles . These high latitudes are dominated by floating sea ice covering much of the Arctic Ocean in the north, and by the Antarctic ice sheet on the continent of Antarctica and the Southern Ocean in the south. Visu...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "precipitation", "label": "precipitation", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e9/ERA5_global_precipitation_sum.png/500px-ERA5_global_precipitation_sum.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eprecipitation\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: precipitation Wikipedia URL: Precipitation In meteorology , precipitation is any product of the condensation of atmospheric water vapor that falls from clouds due to gravitational pull. The main forms of precipitation include drizzle , rain , rain and snow mixed (\"sleet\" in Commonwealth usage), snow , ice pellets , graupel and hail . Precipitation occurs when a portion of the atmosphere becomes saturated with water vapor (reaching 100% relative humidity ), so that the water condense...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "projections", "label": "projections", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eprojections\u003c/h3\u003e\n            \u003
