                  nodes = new vis.DataSet([{"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "adaptation", "label": "adaptation", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/22/Lamarck%27s_Two-Factor_Theory.svg/500px-Lamarck%27s_Two-Factor_Theory.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eadaptation\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: adaptation Wikipedia Page Collective intelligence Collective action Self-organized criticality Herd mentality Phase transition Agent-based modelling Synchronization Ant colony optimization Particle swarm optimization Swarm behaviour The second of Jean-Baptiste Lamarck \u0027s two factors (the first being a complexifying force) was an adaptive force that causes animals with a given body plan to adapt to circumstances by inheritance of acquired characteristics , creating a diversity of spe...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "Africa", "label": "Africa", "shape": "dot", "size": 14.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/31/Lucy_blackbg.jpg/250px-Lucy_blackbg.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eAfrica\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Africa Wikipedia Page Africa is the world\u0027s second-largest and second-most populous continent after Asia . At about 30.3 million km 2 (11.7 million square miles) including adjacent islands, it covers 20% of Earth \u0027s land area and 6% of its total surface area. With nearly 1.4 billion people as of 2021, it accounts for about 18% of the world\u0027s human population . Africa\u0027s population is the youngest among all the continents; the median age in 2012 was 19.7, when the worldwide median age...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "African Sahel", "label": "African Sahel", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Sahel_forest_near_Kayes_Mali.jpg/250px-Sahel_forest_near_Kayes_Mali.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eAfrican Sahel\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: African Sahel Wikipedia Page The Sahel region ( / s \u0259 \u02c8 h \u025b l / ; from Arabic \u0633\u0627\u062d\u0644 ( s\u0101\u1e25il [\u02c8sa\u02d0\u0127il] ) \u0027 coast, shore \u0027 ), or Sahelian acacia savanna , is a biogeographical region in Africa . It is the transition zone between the more humid Sudanian savannas to its south and the drier Sahara to the north. The Sahel has a hot semi-arid climate and stretches across the southernmost latitudes of North Africa between the Atlantic Ocean and the Red Sea . Although geographically located i...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "agriculture", "label": "agriculture", "shape": "dot", "size": 14.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/PivotWithDrops.JPG/250px-PivotWithDrops.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eagriculture\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: agriculture Wikipedia Page Agriculture is the practice of cultivating the soil, planting, raising, and harvesting both food and non-food crops, as well as livestock production. Broader definitions also include forestry and aquaculture . Agriculture was a key factor in the rise of sedentary human civilization , whereby farming of domesticated plants and animals created food surpluses that enabled people to live in the cities. While humans started gathering grains at least 105,000 yea...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "Alaska", "label": "Alaska", "shape": "dot", "size": 13.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/Russian_Sloop-of-War_Neva.jpg/250px-Russian_Sloop-of-War_Neva.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eAlaska\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Alaska Wikipedia Page Alaska ( / \u0259 \u02c8 l \u00e6 s k \u0259 / \u24d8 \u0259- LASS -k\u0259 ) is a non-contiguous U.S. state on the northwest extremity of North America . Part of the Western United States region, it is one of the two non-contiguous U.S. states, alongside Hawaii . Alaska is considered to be the northernmost, westernmost, and easternmost (the Aleutian Islands cross the 180th meridian into the eastern hemisphere) state in the United States. It borders the Canadian territory of Yukon and the provin...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Amazon rainforest", "label": "Amazon rainforest", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/5/56/Amazon17_%285641020319%29.jpg/330px-Amazon17_%285641020319%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eAmazon rainforest\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Amazon rainforest Wikipedia Page The Amazon rainforest , also called the Amazon jungle or Amazonia , is a moist broadleaf tropical rainforest in the Amazon biome that covers most of the Amazon basin of South America . This basin encompasses 7 million km 2 (2.7 million sq mi), of which 6 million km 2 (2.3 million sq mi) are covered by the rainforest . This region includes territory belonging to nine nations and 3,344 indigenous territories .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "animals", "label": "animals", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/6f/Animal_diversity_b.png/330px-Animal_diversity_b.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eanimals\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: animals Wikipedia Page Animals are multicellular , eukaryotic organisms comprising the biological kingdom Animalia ( / \u02cc \u00e6 n \u026a \u02c8 m e\u026a l i \u0259 / ). With few exceptions, animals consume organic material , breathe oxygen , have myocytes and are able to move , can reproduce sexually , and grow from a hollow sphere of cells , the blastula , during embryonic development . Animals form a clade , meaning that they arose from a single common ancestor . Over 1.5 million living animal species ha...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Arctic", "label": "Arctic", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/73/Laponie001.jpg/250px-Laponie001.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eArctic\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Arctic Wikipedia Page The Arctic ( / \u02c8 \u0251\u02d0r ( k ) t \u026a k / ; from Ancient Greek \u1f04\u03c1\u03ba\u03c4\u03bf\u03c2 ( \u00e1rktos ) \u0027 bear \u0027 ) is the polar region of Earth that surrounds the North Pole , lying north of the Arctic Circle . The Arctic region, from the IERS Reference Meridian travelling east, consists of parts of northern Norway ( Nordland , Troms , Finnmark , Svalbard and Jan Mayen ), northernmost Sweden ( V\u00e4sterbotten , Norrbotten and s:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eAustralia\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Australia Wikipedia Page Australia , officially the Commonwealth of Australia , is a country comprising the mainland of the Australian continent , the island of Tasmania and numerous smaller islands . It has a total area of 7,688,287 km 2 (2,968,464 sq mi), making it the sixth-largest country in the world and the largest in Oceania . Australia is the world\u0027s flattest and driest inhabited continent. It is a megadiverse country , and its size gives it a wide variety of landscapes and ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#66b2ff", "font": {"color": "#FFFFFF"}, "id": "biodiversity", "label": "biodiversity", "shape": "dot", "size": 18.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Fungi_of_Saskatchewan.JPG/250px-Fungi_of_Saskatchewan.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ebiodiversity\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: biodiversity Wikipedia Page Biodiversity is the variability of life on Earth . It can be measured on various levels, for example, genetic variability , species diversity , ecosystem diversity and phylogenetic diversity. Diversity is not distributed evenly on Earth \u2014it is greater in the tropics as a result of the warm climate and high primary productivity in the region near the equator . Tropical forest ecosystems cover less than one-fifth of Earth\u0027s terrestrial area and contain abou...\u003c/div\u003e percentage_change_%28red%29_relative_to_baseline_-_fcosc-01-615419-g001.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ebiodiversity loss\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: biodiversity loss Wikipedia Page Biodiversity loss happens when species disappear completely from Earth ( extinction ) or when there is a decrease or disappearance of species in a specific area. Biodiversity loss means that there is a reduction in biological diversity in a given area. The decrease can be temporary or permanent. It is temporary if the damage that led to the loss is reversible in time, for example through ecological restoration . If this is not possible, then the decr...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "biomes", "label": "biomes", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e4/Vegetation.png/500px-Vegetation.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ebiomes\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: biomes Wikipedia Page A biome ( / \u02c8 b a\u026a . o\u028a m / , BYE -ome ) is a distinct geographical region with specific climate , vegetation , animal life , and an ecosystem . It consists of a biological community that has formed in response to its physical environment and regional climate . In 1935, Tansley added the climatic and soil aspects to the idea, calling it ecosystem . The Internatio rgin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eBrazil\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Brazil Wikipedia Page Brazil , officially the Federative Republic of Brazil , is the largest country in South America . It is also the world\u0027s fifth-largest country by area and the seventh-largest by population , with over 213 million people. The country is a federation composed of 26 states and a Federal District , which hosts the capital, Bras\u00edlia . Its most populous city is S\u00e3o Paulo , followed by Rio de Janeiro . Brazil has the most Portuguese speakers in the world and is the on...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Brazilian Amazon", "label": "Brazilian Amazon", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/bf/Amazonia_legal.png/500px-Amazonia_legal.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eBrazilian Amazon\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Brazilian Amazon Wikipedia Page Brazil\u0027s Legal Amazon ( abbreviation BLA ), in Portuguese Amaz\u00f4nia Legal ( Portuguese pronunciation: [ama\u02c8zonj\u0250 le\u02c8\u0261aw] ), is the largest socio-geographic division in Brazil , containing all nine states in the Amazon basin . The government designated this region in 1948 based on its studies on how to plan the economic and social development of the Amazon region. States within Amaz\u00f4nia Legal.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": " nt-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Canada Wikipedia Page Canada is a country in North America . Its ten provinces and three territories extend from the Atlantic Ocean to the Pacific Ocean and northward into the Arctic Ocean, making it the second-largest country by total area , with the longest coastline of any country. Its border with the United States is the longest international land border. The country is characterized by a wide range of both meteorologic and geological regions. With a population of over 41 millio...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "carbon cycle", "label": "carbon cycle", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/Carbon_cycle.jpg/500px-Carbon_cycle.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecarbon cycle\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: carbon cycle Wikipedia Page The carbon cycle is a part of the biogeochemical cycle where carbon is exchanged among the biosphere , pedosphere , geosphere , hydrosphere , and atmosphere of Earth . Other major biogeochemical cycles include the nitrogen cycle and the water cycle . Carbon is the main component of biological compounds as well as a major component of many rocks such as limestone . The carbon cycle comprises a sequence of events that are key to making Earth capable of sust...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "carbon sink", "label": "carbon sink", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/62/1850-_Global_carbon_budget_-_Global_Carbon_Project_-_offset-stacked_bar_chart.svg/500px-1850-_Global_carbon_budget_-_Global_Carbon_Project_-_offset-stacked_bar_chart.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecarbon sink\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: carbon sink Wikipedia Page A carbon sink is a natural or artificial carbon sequestration process that \"removes a greenhouse gas , an aerosol or a precursor of a greenhouse gas from the atmosphere \". These sinks form an important part of the natural carbon cycle . An overarching term is carbon pool , which is all the places where carbon on Earth can be, i.e. the atmosphere , oceans , soil , florae , fossil fuel reservoirs and so forth. A carbon sink is a type of carbon pool that has ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "carbon storage", "label": "carbon storage", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/Carbon_sequestration-2009-10-07.svg/330px-Carbon_sequestration-2009-10-07.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecarbon storage\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: carbon storage Wikipedia Page Carbon sequestration is a natural process of storing carbon in a carbon pool . It plays a crucial role in effectively managing the global carbon cycle and limiting climate change by reducing the amount of carbon dioxide in the atmosphere . There are two main types of carbon sequestration: biologic (also called biosequestration ) and geologic. Geologic and biologic carbon sequestration of excess carbon dioxide in the atmosphere emitted by human activitie...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Chile", "label": "Chile", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/Chile_%28orthographic_projection%29.svg/330px-Chile_%28orthographic_projection%29.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eChile\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Chile Wikipedia Page Chile , officially the Republic of Chile , is a country in western South America . It is the southernmost country in the world and the closest to Antarctica , extending along a narrow strip of land between the Andes Mountains and the Pacific Ocean . According to the 2024 census, Chile had an enumerated population of 18.5 million. The country covers a territorial area of 756,102 square kilometers (291,933 sq mi), sharing borders with Peru to the north, Bolivia to...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "China", "label": "China", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/CHN_orthographic.svg/250px-CHN_orthographic.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eChina\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: China Wikipedia Page China , officially the People\u0027s Republic of China ( PRC ), is a country in East Asia . With a population exceeding 1.4 billion, it is the second-most populous country after India , representing 17% of the world population. China borders fourteen countries by land across an area of 9.6 million square kilometers (3,700,000 sq mi), making it the third-largest country by area . The country is divided into 33 province-level divisions : 22 provinces , 5 autonomous reg...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#66b2ff", "font": {"color": "#FFFFFF"}, "id": "climate", "label": "climate", "shape": "dot", "size": 17.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/K%C3%B6ppen-Geiger_climate_classification_%281980-2016%29.png/250px-K%C3%B6ppen-Geiger_climate_classification_%281980-2016%29.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eclimate\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: climate Wikipedia Page Climate is the long-term weather pattern in a region, typically averaged over 30 years. More rigorously, it is the mean and variability of meteorological variables over a time spanning from months to millions of years. Some of the meteorological variables that are commonly measured are temperature , humidity , atmospheric pressure , wind , and precipitation . In a broader sense, climate is the state of the components of the climate system , including the atmos...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#66b2ff", "font": {"color": "#FFFFFF"}, "id": "climate change", "label": "climate change", "shape": "dot", "size": 19.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Common_Era_Temperature.svg/500px-Common_Era_Temperature.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eclimate change\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: climate change Wikipedia Page Present-day climate change includes both global warming \u2014the ongoing increase in global average temperature \u2014and its wider effects on Earth\u0027s climate system . Climate change in a broader sense also includes previous long-term changes to Earth\u0027s climate . The modern-day rise in global temperatures is driven by human activities , especially fossil fuel ( coal , oil and natural gas ) burning since the Industrial Revolution . Fossil fuel use, deforestation ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "climate change adaptation", "label": "climate change adaptation", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/Wetland_restoration_in_Australia.jpg/250px-Wetland_restoration_in_Australia.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eclimate change adaptation\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: climate change adaptation Wikipedia Page Climate change adaptation is the process of adjusting to the effects of climate change , both current and anticipated. Adaptation aims to moderate or avoid harm for people, and is usually done alongside climate change mitigation . It also aims to exploit opportunities. Adaptation can involve interventions to help natural systems cope with changes. Wetland restoration in Australia\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "climate change attribution", "label": "climate change attribution", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Physical_Drivers_of_climate_change.svg/500px-Physical_Drivers_of_climate_change.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eclimate change attribution\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: climate change attribution Wikipedia Page The scientific community has been investigating the causes of current climate change for decades. After thousands of studies, the scientific consensus is that it is \"unequivocal that human influence has warmed the atmosphere, ocean and land since pre-industrial times.\" This consensus is supported by around 200 scientific organizations worldwide. The scientific principle underlying current climate change is the greenhouse effect , which provi...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "climate change impacts", "label": "climate change impacts", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/4c/20200118_Global_warming_and_climate_change_-_vertical_block_diagram_-_causes_effects_feedback.svg/500px-20200118_Global_warming_and_climate_change_-_vertical_block_diagram_-_causes_effects_feedback.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eclimate change impacts\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: climate change impacts Wikipedia Page Effects of climate change are well documented and growing for Earth\u0027s natural environment and human societies. Changes to the climate system include an overall warming trend , changes to precipitation patterns , and more extreme weather . As the climate changes it impacts the natural environment with effects such as more intense forest fires , thawing permafrost , and desertification . These changes impact ecosystems and societies, and can becom...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "climate change mitigation", "label": "climate change mitigation", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/6e/Greenhouse_gas_emission_scenarios_01.svg/500px-Greenhouse_gas_emission_scenarios_01.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eclimate change mitigation\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: climate change mitigation Wikipedia Page Climate change mitigation (or decarbonisation ) is action to limit the greenhouse gases in the atmosphere that cause climate change . Climate change mitigation actions include conserving energy and replacing fossil fuels with clean energy sources . Secondary mitigation strategies include changes to land use and removing carbon dioxide (CO 2 ) from the atmosphere. Recent assessments emphasize that global greenhouse gas emissions must peak befo...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "climate extremes", "label": "climate extremes", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/A_tornado_near_Anadarko%2C_Oklahoma%2C_on_May_3%2C_1999.jpg/250px-A_tornado_near_Anadarko%2C_Oklahoma%2C_on_May_3%2C_1999.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eclimate extremes\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: climate extremes Wikipedia Page Extreme weather includes unexpected, unusual, severe , or unseasonal weather ; weather at the extremes of the historical distribution\u2014the range that has been seen in the past. Extreme events are based on a location\u0027s recorded weather history. The main types of extreme weather include heat waves , cold waves , droughts , and heavy precipitation or storm events, such as tropical cyclones . Extreme weather can have various effects, from natural hazards s...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "climate models", "label": "climate models", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/43/20250712_Climate_model_inputs_and_outputs.svg/500px-20250712_Climate_model_inputs_and_outputs.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eclimate models\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: climate models Wikipedia Page Numerical climate models (or climate system models ) are mathematical models that can simulate the interactions of important drivers of climate . These drivers are the atmosphere , oceans , land surface and ice . Scientists use climate models to study the dynamics of the climate system and to make projections of future climate and of climate change . Climate models can also be qualitative (i.e. not numerical) models and contain narratives, largely descr...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Climatic Change", "label": "Climatic Change", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/en/5/55/Climatic_Change.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eClimatic Change\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Climatic Change Wikipedia Page Climatic Change is a biweekly peer-reviewed scientific journal published by Springer Science+Business Media covering cross-disciplinary work on all aspects of climate change and variability. It was established in 1977 by Stephen H. Schneider, and the current editors-in-chief are Michael Oppenheimer ( Princeton University ) and Gary Yohe ( Wesleyan University ).\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "cyanobacteria", "label": "cyanobacteria", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/15/CSIRO_ScienceImage_4203_A_bluegreen_algae_species_Cylindrospermum_sp_under_magnification.jpg/330px-CSIRO_ScienceImage_4203_A_bluegreen_algae_species_Cylindrospermum_sp_under_magnification.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecyanobacteria\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: cyanobacteria Wikipedia Page Cyanobacteria ( / s a\u026a \u02cc \u00e6 n o\u028a b \u00e6 k \u02c8 t \u026a\u0259r i \u0259 / sy- AN -oh-bak- TEER -ee-\u0259 ) are a group of autotrophic gram-negative bacteria of the phylum Cyanobacteriota that can obtain biological energy via oxygenic photosynthesis . The name \"cyanobacteria\" (from Ancient Greek \u03ba\u03cd\u03b1\u03bd\u03bf\u03c2 ( k\u00faanos ) \u0027 blue \u0027 ) refers to their bluish green ( cyan ) color, which forms the basis of cyanobacteria\u0027s informal common name , blue-green algae .\u003c/div\u003e\n        \u003c/  Page Dengue fever is a mosquito-borne disease caused by dengue virus , prevalent in tropical and subtropical areas. Most cases of dengue fever are either asymptomatic or manifest mild symptoms. Symptoms typically begin 3 to 14 days after infection. They may include a high fever , headache , vomiting , muscle and joint pains , and a characteristic skin itching and skin rash . Recovery generally takes two to seven days. In a small proportion of cases, the disease deve...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "desertification", "label": "desertification", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Global_distribution_of_dryland_subtypes_based_on_the_aridity_index.png/500px-Global_distribution_of_dryland_subtypes_based_on_the_aridity_index.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003edesertification\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: desertification Wikipedia Page Desertification is a type of gradual land degradation of fertile land into arid desert due to a combination of natural processes and human activities. Global distribution of dryland areas based on the aridity index computed over a 30-year average during 1981 to 2010. Typical deserts are indicated by the hyper-arid category (light yellow).\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "dragonflies", "label": "dragonflies", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n 12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Ecohydrology Wikipedia Page Ecohydrology (from Greek \u03bf\u1f36\u03ba\u03bf\u03c2 , oikos , \"house(hold)\"; \u1f55\u03b4\u03c9\u03c1 , hyd\u014dr , \"water\"; and -\u03bb\u03bf\u03b3\u03af\u03b1 , -logia ) is an interdisciplinary scientific field studying the interactions between water and ecological systems . It is considered a sub discipline of hydrology , with an ecological focus. These interactions may take place within water bodies , such as rivers and lakes, or on land, in forests , deserts , and other terrestrial ecosystems. Areas of research in ecoh...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "ecology", "label": "ecology", "shape": "dot", "size": 13.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/70/Bufo_boreas.jpg/250px-Bufo_boreas.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eecology\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: ecology Wikipedia Page Ecology (from Ancient Greek \u03bf\u1f36\u03ba\u03bf\u03c2 ( o\u00eekos ) \u0027 house \u0027 and -\u03bb\u03bf\u03b3\u03af\u03b1 ( -log\u00eda ) \u0027 study of \u0027 ) is the natural science of the relationships among living organisms and their environment . Ecology considers organisms at the individual, population , community , ecosystem , and biosphere levels. Ecology overlaps with the closely related sciences of biogeography , evolutionary biology , genetics , ethology , and natural history .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "ecosystem restoration", "label": "ecosystem restoration", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/Wetland_restoration_in_Australia.jpg/250px-Wetland_restoration_in_Australia.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eecosystem restoration\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: ecosystem restoration Wikipedia Page Ecological restoration , or ecosystem restoration, is the process of assisting the recovery of an ecosystem that has been degraded, damaged, destroyed or transformed. It is distinct from conservation in that it attempts to retroactively repair already damaged ecosystems rather than take preventative measures. Ecological restoration can help to reverse biodiversity loss, combat climate change , support the provision of ecosystem services and suppo...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "ecosystem services", "label": "ecosystem services", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/26/Honeybee_%28Apis_mellifera%29_pollinating_Avocado_cv.jpg/250px-Honeybee_%28Apis_mellifera%29_pollinating_Avocado_cv.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eecosystem services\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: ecosystem services Wikipedia Page Ecosystem services are the various benefits that humans derive from ecosystems . The interconnected living and non-living components of the natural environment offer benefits such as pollination of crops, clean air and water, decomposition of wastes, and flood control . An example of an ecosystem service is pollination , here by a honey bee on avocado crop.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "ecosystems", "label": "ecosystems", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/River_gambia_Niokolokoba_National_Park.gif/250px-River_gambia_Niokolokoba_National_Park.gif\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eecosystems\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: ecosystems Wikipedia Page An ecosystem (or ecological system ) is a system formed by organisms in interaction with their environment . The biotic and abiotic components are linked together through nutrient cycles and energy flows. Rainforest ecosystems are rich in biodiversity . This is the Gambia River in Senegal \u0027s Niokolo-Koba National Park .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "endemic species", "label": "endemic species", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/29/Orange-breasted_Sunbird_%28Nectarinia_violacea%29.jpg/250px-Orange-breasted_Sunbird_%28Nectarinia_violacea%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eendemic species\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: endemic species Wikipedia Page Endemism is the state of a species being found only in a single defined geographic location, such as an island , state , nation , country or other defined zone; organisms that are indigenous to a place are not endemic to it if they are also found elsewhere. For example, the Cape sugarbird ( Promerops cafer ) is found exclusively in southwestern South Africa and is therefore said to be endemic to that particular part of the world . An endemic species ca...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "England", "label": "England", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/b3/England_in_the_UK_and_Europe.svg/250px-England_in_the_UK_and_Europe.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eEngland\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: England Wikipedia Page \u2013 in Europe (green \u0026 dark grey) \u2013 in the United Kingdom (green)\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "ENSO", "label": "ENSO", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/SOI.svg/250px-SOI.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eENSO\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: ENSO Wikipedia Page El Ni\u00f1o\u2013Southern Oscillation ( ENSO ) is a global climate phenomenon that emerges from variation in winds and sea surface temperatures over the tropical Pacific Ocean . Those variations have an irregular pattern but do have some semblance of cycles. The occurrence of ENSO is not predictable. It affects the climate of much of the tropics and subtropics , and has links ( teleconnections ) to higher-latitude regions of the world. The warming phase of the sea surface...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "erosion control", "label": "erosion control", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/c/c4/TerracesBuffers.JPG/250px-TerracesBuffers.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eerosion control\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: erosion control Wikipedia Page Erosion control is the practice of preventing or controlling wind or water erosion in agriculture , land development , coastal areas , river banks and construction . Effective erosion controls handle surface runoff and are important techniques in preventing water pollution , soil loss , wildlife habitat loss and human property loss. Terraces, conservation tillage, and conservation buffers save soil and improve water quality on this Iowa farm.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "Europe", "label": "Europe", "shape": "dot", "size": 13.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/15/Anaximander_world_map_%28mul%29.svg/250px-Anaximander_world_map_%28mul%29.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eEurope\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Europe Wikipedia Page Europe is a continent located entirely in the Northern Hemisphere and mostly in the Eastern Hemisphere . It is bordered by the Arctic Ocean to the north, the Atlantic Ocean to the west, the Mediterranean Sea to the south, and Asia to the east. Europe shares the landmass of Eurasia with Asia, and of Afro-Eurasia with both Africa and Asia. Europe is commonly considered to be separated from Asia by the watershed of the Ural Mountains , the Ural River , the Caspian...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "evapotranspiration", "label": "evapotranspiration", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/Surface_water_cycle.svg/260px-Surface_water_cycle.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eevapotranspiration\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: evapotranspiration Wikipedia Page Evapotranspiration ( ET ) refers to the combined processes which move water from the Earth\u0027s surface (open water and ice surfaces, bare soil and vegetation ) into the atmosphere . It covers both water evaporation (movement of water to the air directly from soil, canopies , and water bodies) and transpiration (evaporation that occurs through the stomata , or openings, in plant leaves). Evapotranspiration is an important part of the local water cycle ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "evolution", "label": "evolution", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/10/Darwin_Tree_1837.png/250px-Darwin_Tree_1837.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eevolution\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: evolution Wikipedia Page Evolution is the change in the heritable characteristics of biological populations over successive generations. It occurs when evolutionary processes such as genetic drift and natural selection act on genetic variation, resulting in certain characteristics becoming more or less common within a population over successive generations. The process of evolution has given rise to biodiversity at every level of biological organisation .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "exotic species", "label": "exotic species", "shape": "do h of its last member if it loses the capacity to reproduce and recover. As a species \u0027 potential range may be very large, determining this moment is difficult, and is usually done retrospectively. This difficulty leads to phenomena such as Lazarus taxa , where a species presumed extinct abruptly \"reappears\" (typically in the ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "fauna", "label": "fauna", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/7/72/Fauna.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003efauna\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: fauna Wikipedia Page The Fauna ( pl. : faunae or faunas ) is the whole of animal life present in a particular region or time. The corresponding terms for plants and fungi are flora and funga , respectively. Flora, fauna, funga and other forms of life are collectively referred to as biota . Zoologists and paleontologists use fauna to refer to a typical collection of animals found in a specific time or place, e.g. the \" Sonoran Desert fauna\" or the \" Burgess Shale fauna\". Paleontologi...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Finland", "label": "Finland", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eFinland\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esear v style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: fire weather Wikipedia Page Fire Weather: A True Story from a Hotter World , also published as Fire Weather: On the Front Lines of a Burning World , is a 2023 book by Canadian-American journalist John Vaillant . It was published by Knopf , a subsidiary of Penguin Random House . The book details the 2016 Fort McMurray wildfire which led to the evacuation of more than 88,000 residents of Fort McMurray , in the province of Alberta , Canada and the destruction of much of the town.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "fish", "label": "fish", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/7f/Balantiocheilos_melanopterus_-_Karlsruhe_Zoo_02_%28cropped%29.jpg/250px-Balantiocheilos_melanopterus_-_Karlsruhe_Zoo_02_%28cropped%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003efish\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: fish Wikipedia Page A fish is an aquatic , anamniotic , gill -bearing vertebrate animal with swimming fins and a hard skull , but lacking limbs with digits . Fish can be grouped into the more basal jawless fish and the more common jawed fish , the latter including all living cartilaginous and bony fish , as well as the extinct placoderms and acanthodians . In a break from the long tradition of grouping all fish into a single class ( Pisces ), modern phylogenetics views fish as a par...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "fisheries", "label": "fisheries", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/b9/Becharof_Wilderness_Salmon.jpg/330px-Becharof_Wilderness_Salmon.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003efisheries\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: fisheries Wikipedia Page Fishery can mean either the enterprise of raising or harvesting fish and other aquatic life or, more commonly, the site where such enterprise takes place ( a.k.a. , fishing grounds ). Commercial fisheries include wild fisheries and fish farms , both in freshwater waterbodies (about 10% of all catch) and the oceans (about 90%). About 500 million people worldwide are economically dependent on fisheries. 171 million tonnes of fish were produced in 2016, but ove...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "floods", "label": "floods", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/36/Urban_flood_cropped.jpg/250px-Urban_flood_cropped.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003efloods\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: floods Wikipedia Page A flood is an overflow of water ( or rarely other fluids ) that submerges land that is usually dry. In the sense of \"flowing water\", the word may also be applied to the inflow of the tide . Floods are of significant concern in agriculture , civil engineering and public health . Human changes to the environment often increase the intensity and frequency of flooding. Examples for human changes are land use changes such as deforestation and removal of wetlands , c...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "food security", "label": "food security", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a1/Africa_Food_Security_18_%2810665134354%29.jpg/250px-Africa_Food_Security_18_%2810665134354%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003efood security\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: food security Wikipedia Page Food security is the state of having reliable access to a sufficient quantity of affordable, healthy food . The availability of food for people of any class, gender, status, ethnicity, or religion is another element of food protection. Similarly, household food security is considered to exist when all the members of a family have consistent access to enough food for an active, healthy life. Food-secure individuals do not live in hunger or fear of starvat...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Forest Ecology", "label": "Forest Ecology", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/Daintree_Rainforest.JPG/250px-Daintree_Rainforest.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eForest Ecology\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Forest Ecology Wikipedia Page Forest ecology is the scientific study of the interrelated patterns, processes, flora , fauna , funga , and ecosystems in forests . The management of forests is known as forestry , silviculture , and forest management . A forest ecosystem is a natural woodland unit consisting of all plants, animals, and micro-organisms ( biotic components ) in that area functioning together with all of the non-living physical ( abiotic ) factors of the environment. The ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "genetic diversity", "label": "genetic diversity", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Human_karyotype.svg/500px-Human_karyotype.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egenetic diversity\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: genetic diversity Wikipedia Page Genetic diversity is the total number of genetic characteristics in the genetic makeup of a species. It ranges widely, from the number of species to differences within species , and can be correlated to the span of survival for a species. It is distinguished from genetic variability , which describes the tendency of genetic characteristics to vary. A graphical representation of the typical human karyotype .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Germany", "label": "Germany", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/Trier_012.JPG/250px-Trier_012.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eGermany\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Germany Wikipedia Page Germany , officially the Federal Republic of Germany , is a country in Western and Central Europe . It lies between the Baltic Sea and the North Sea to the north and the Alps to the south. Its sixteen constituent states have a total population of over 83 million, making it the most populous member state of the European Union . Germany borders Denmark to the north; Poland and the Czech Republic to the east; Austria and Switzerland to the south; and France , Lux...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "GHG emissions", "label": "GHG emissions", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/f3/20210626_Variwide_chart_of_greenhouse_gas_emissions_per_capita_by_country.svg/500px-20210626_Variwide_chart_of_greenhouse_gas_emissions_per_capita_by_country.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eGHG emissions\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: GHG emissions Wikipedia Page Greenhouse gas ( GHG ) emissions from human activities intensify the greenhouse effect . This contributes to climate change . Carbon dioxide (CO 2 ), from burning fossil fuels such as coal , oil , and natural gas , is the main cause of climate change. The largest annual emissions are from China followed by the United States. The United States has higher emissions per capita . The main producers fueling the emissions globally are large oil and gas compani...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "glacier retreat", "label": "glacier retreat", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/1c/McCarty_Glacier.jpg/500px-McCarty_Glacier.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eglacier retreat\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: glacier retreat Wikipedia Page The retreat of glaciers since 1850 is a well-documented effect of climate change . The retreat of mountain glaciers provides evidence for the rise in global temperatures since the late 19th century. Examples include mountain glaciers in western North America, Asia, the Alps in central Europe, and tropical and subtropical regions of South America and Africa. Since glacial mass is affected by long-term climatic changes, e.g. precipitation , mean temperat...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "grasslands", "label": "grasslands", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a1/Nachusa_Grasslands_Spring_2016.jpg/500px-Nachusa_Grasslands_Spring_2016.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egrasslands\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: grasslands Wikipedia Page A grassland is an area (or ecosystem) where the vegetation is dominated by grasses . However, sedges and rushes can also be found along with variable proportions of legumes such as clover , and other herbs . Grasslands occur naturally on all continents except Antarctica and are found in most ecoregions of the Earth . Furthermore, grasslands are one of the largest biomes on Earth and dominate the landscape worldwide. There are different types of grasslands: ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "grazing", "label": "grazing", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Nordrhein-Westfalen_weidende_Milchk%C3%BChe.JPG/250px-Nordrhein-Westfalen_weidende_Milchk%C3%BChe.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egrazing\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: grazing Wikipedia Page In agriculture , grazing is a method of animal husbandry whereby domestic livestock are allowed outdoors to free range (roam around) and consume wild vegetations in order to convert the otherwise indigestible (by human gut ) cellulose within grass and other forages into meat , milk , wool and other animal products . Grazing is often done on lands that are unsuitable for arable farming , although there are occasions where arable lands and even prior farmlands a...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Great Barrier Reef", "label": "Great Barrier Reef", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/ISS-45_StoryOfWater%2C_Great_Barrier_Reef%2C_Australia.jpg/330px-ISS-45_StoryOfWater%2C_Great_Barrier_Reef%2C_Australia.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eGreat Barrier Reef\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Great Barrier Reef Wikipedia Page The Great Barrier Reef is the world\u0027s largest coral reef system, composed of over 2,900 individual reefs and 900 islands stretching for over 2,300 kilometres (1,400 mi) over an area of approximately 344,400 square kilometres (133,000 sq mi). The reef is located in the Coral Sea , off the coast of Queensland , Australia , separated from the coast by a channel 160 kilometres (100 mi) wide in places and over 61 metres (200 ft) deep. The Great Barrier R...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "heat tolerance", "label": "heat tolerance", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eheat tolerance\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: heat tolerance Wikipedia Page Plant breeding is process of development of new cultivars . Plant breeding involves development of varieties for different environmental conditions \u2013 some of them are not favorable. Among them, heat stress is one of such factor that reduces the production and quality significantly. So breeding against heat is a very important criterion for breeding for current as well as future environments produced by global climate change (e.g. global warming ).\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "heat waves", "label": "heat waves", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/Heat_Wave.jpg/500px-Heat_Wave.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eheat waves\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: heat waves Wikipedia Page A heat wave or heatwave , sometimes described as extreme heat , is a period of abnormally hot weather that lasts for multiple days. A heat wave is usually measured relative to the usual climate in the area and to normal temperatures for the season. The main difficulties with this broad definition emerge when one must quantify what the \u0027normal\u0027 temperature state is, and what the spatial extent of the event may or must be. Temperatures that humans from a hott...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "human populations", "label": "human populations", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Nuvola_apps_kaboodle.svg/20px-Nuvola_apps_kaboodle.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ehuman populations\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: human populations Wikipedia Page In world demographics , the world population is the total number of humans currently alive. It was estimated by the United Nations to have exceeded eight billion in mid-November 2022. It took around 300,000 years of human prehistory and history for the human population to reach a billion and only 218 more years from there to reach 8 billion.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "hydrology", "label": "hydrology", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/da/Rain_over_Beinn_Eich%2C_Luss_Hills%2C_Scotland.jpg/330px-Rain_over_Beinn_Eich%2C_Luss_Hills%2C_Scotland.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ehydrology\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: hydrology Wikipedia Page Hydrology (from Ancient Greek \u1f55\u03b4\u03c9\u03c1 ( h\u00fad\u014dr ) \u0027 water \u0027 and -\u03bb\u03bf\u03b3\u03af\u03b1 ( -log\u00eda ) \u0027 study of \u0027 ) is the scientific study of the movement, distribution, and management of water on Earth and other planets, including the water cycle , water resources , and drainage basin sustainability. A practitioner of hydrology is called a hydrologist . Hydrologists are scientists studying earth or environmental science , civil or environmental engineering , and physical geograph...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "India", "label": "India", "shape": "dot", "size": 13.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/bb/India_%28orthographic_projection%29.svg/250px-India_%28orthographic_projection%29.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eIndia\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: India Wikipedia Page India , officially the Republic of India , is a country in South Asia . It is the seventh-largest country by area ; the most populous country since 2023; and, since its independence in 1947, the world\u0027s most populous democracy. Bounded by the Indian Ocean on the south, the Arabian Sea on the southwest, and the Bay of Bengal on the southeast, it shares land borders with Pakistan to the west; China , Nepal , and Bhutan to the north; and Bangladesh and Myanmar to t...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Indonesia", "label": "Indonesia", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/62/1855_Colton_Map_of_the_East_Indies_%28Singapore%2C_Thailand%2C_Borneo%2C_Malaysia%29_-_Geographicus_-_EastIndies-colton-1855.jpg/250px-1855_Colton_Map_of_the_East_Indies_%28Singapore%2C_Thailand%2C_Borneo%2C_Malaysia%29_-_Geographicus_-_EastIndies-colton-1855.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eIndonesia\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Indonesia Wikipedia Page Indonesia , officially the Republic of Indonesia , is a country in Southeast Asia and Oceania , between the Indian and Pacific oceans. Comprising over 17,000 islands , including Sumatra , Java , Sulawesi , and parts of Borneo and New Guinea , Indonesia is the world\u0027s largest archipelagic state and the 14th-largest country by area , at 1,904,569 square kilometres (735,358 square miles). With over 280 million people, Indonesia is the world\u0027s fourth-most-populo...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "insects", "label": "insects", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/ed/Insects_-_Neoptera_-_Paleoptera_-_Apterygota.jpg/250px-Insects_-_Neoptera_-_Paleoptera_-_Apterygota.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003einsects\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: insects Wikipedia Page Insects (from Latin insectum ) are hexapod invertebrates of the class Insecta . They are the largest group within the arthropod phylum . Insects have a chitinous exoskeleton , a three-part body ( head , thorax and abdomen ), three pairs of jointed legs , compound eyes , and a pair of antennae . Insects are the most diverse group of animals, with more than a million described species ; they represent more than half of all animal species.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "invasive species", "label": "invasive species", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/c/c2/Beaver_dam_in_Tierra_del_Fuego.jpg/250px-Beaver_dam_in_Tierra_del_Fuego.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003einvasive species\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: invasive species Wikipedia Page An invasive species is an introduced species that harms its new environment. Invasive species adversely affect habitats and bioregions , causing ecological , environmental , and/or economic damage. Since the 20th century, invasive species have become serious economic, social, and environmental threats worldwide. North American beaver ( Castor canadensis ) dam in Tierra del Fuego\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "IPBES", "label": "IPBES", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/co
