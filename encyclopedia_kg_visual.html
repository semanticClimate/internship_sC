 in 1988. The United Nations endorsed the creation of the IPCC later that year. It has a secretariat in Geneva , Switzerla...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "IUCN Red List", "label": "IUCN Red List", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/en/thumb/e/ec/IUCN_Red_List.svg/250px-IUCN_Red_List.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eIUCN Red List\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: IUCN Red List Wikipedia Page The International Union for Conservation of Nature (IUCN) Red List of Threatened Species , also known as the IUCN Red List or Red Data Book , founded in 1964, is an inventory of the global conservation status and extinction risk of biological species . A series of Regional Red Lists , which assess the risk of extinction to species within a political management unit, are also produced by countries and organizations.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Joshua Tree National Park", "label": "Joshua Tree National Park", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/f9/Joshua_Tree_-_Cyclops_%2B_Potato_Head_-_Sunrise.jpg/330px-Joshua_Tree_-_Cyclops_%2B_Potato_Head_-_Sunrise.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size: b/0/04/Lake_Idro_Italy_2005-08-16.jpg/330px-Lake_Idro_Italy_2005-08-16.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003elakes\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: lakes Wikipedia Page A lake is often a naturally occurring, relatively large and fixed body of water on or near the Earth\u0027s surface. It is localized in a basin or interconnected basins surrounded by dry land . Lakes lie completely on land and are separate from the ocean , although they may be connected with the ocean by rivers . Lakes, like other bodies of water , are part of the water cycle , the processes by which water moves around the Earth. Most lakes are fresh water and accoun...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "land degradation", "label": "land degradation", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/65/Cattle.jpg/250px-Cattle.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eland degradation\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: land degradation Wikipedia Page Land degradation is a process where land becomes less healthy and productive due to a combination of human activities or natural conditions. The causes for land degradation are numerous and complex. Human activities are often the main cause, such as unsustainable land management practices. Natural hazards are excluded as a cause; however human activities ology\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Landscape Ecology Wikipedia Page Landscape ecology is the science of studying and improving relationships between ecological processes in the environment and particular ecosystems. This is done within a variety of landscape scales, development spatial patterns, and organizational levels of research and policy. Landscape ecology can be described as the science of \"landscape diversity\" as the synergetic result of biodiversity and geodiversity . Land cover surrounding Madison, Wisconsi...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "livestock", "label": "livestock", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e8/20150728_xl_P1000804_Leck_mich_Zaertlichkeit_der_Rinder.JPG/250px-20150728_xl_P1000804_Leck_mich_Zaertlichkeit_der_Rinder.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003elivestock\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: livestock Wikipedia Page Livestock are the domesticated animals that are raised in an agricultural setting to provide labor and produce diversified animal products for human consumption such as meat , eggs , milk , fur , leather , and wool . The term is sometimes used to refer solely to animals which are raised for consumption, and sometimes used to refer solely to farmed ruminants , such as cattle , sheep , and goats . Livestock production are mainly a source for farm work and huma...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"colo _the_Sun_from_Pyramid_of_the_Moon%2C_Teotihuacan.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eMexico\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Mexico Wikipedia Page Mexico , officially the United Mexican States , is a country in North America . It is the northernmost country in Latin America and borders the United States to the north, and Guatemala and Belize to the southeast; while having maritime boundaries with the Pacific Ocean to the west, the Caribbean Sea to the southeast, and the Gulf of Mexico to the east. Mexico covers 1,972,550 km 2 (761,610 sq mi), and is the thirteenth-largest country in the world by land area...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Microbiology", "label": "Microbiology", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/9/93/Agar_plate_with_colonies.jpg/250px-Agar_plate_with_colonies.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eMicrobiology\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Microbiology Wikipedia Page Microbiology (from Ancient Greek \u03bc\u1fd1\u03ba\u03c1\u03bf\u03c2 ( m\u012bkros ) \u0027 small \u0027 \u03b2\u03af\u03bf\u03c2 ( b\u00edos ) \u0027 life \u0027 and -\u03bb\u03bf\u03b3\u03af\u03b1 ( -log\u00eda ) \u0027 study of \u0027 ) is the scientific study of microorganisms , those being of unicellular (single-celled), multicellular (consisting of complex cells), or acellular (lacking cells). Microbiology encompasses numerous sub-disciplines including virology , bacteriology , protistology , mycology , immunology , and parasitology . An agar plate streaked with mic...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Millennium Ecosystem Assessment", "label": "Millennium Ecosystem Assessment", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/en/a/a8/Millennium_Ecosystem_Assessment_logo.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eMillennium Ecosystem Assessment\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Millennium Ecosystem Assessment Wikipedia Page The Millennium Ecosystem Assessment ( MA ) is a major assessment of the human impact on the environment , called for by the United Nations Secretary-General Kofi Annan in 2000, launched in 2001 and published in 2005 with more than $14 million of grants. It popularized the term ecosystem services , the benefits gained by humans from ecosystems .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "mosquitoes", "label": "mosquitoes", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/d0/Aedes_aegypti.jpg/250px-Aedes_aegypti.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emosquitoes\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: mosquitoes Wikipedia Page Mosquitoes , the Culicidae , are a family of small flies consisting of 3,600 species . The word mosquito (formed by mosca and diminutive -ito ) is Spanish and Portuguese for little fly . Mosquitoes have a slender segmented body , one pair of wings, three pairs of long hair-like legs, and specialized, highly elongated, piercing-sucking mouthparts . All mosquitoes drink nectar from flowers ; females of many species have adapted to also drink blood. The group ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "natural environment", "label": "natural environment", "shape": "dot", "size": 14.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/36/Hopetoun_falls.jpg/250px-Hopetoun_falls.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003enatural environment\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: natural environment Wikipedia Page The natural environment or natural world encompasses all biotic and abiotic things occurring naturally , meaning in this case not artificial . The term is most often applied to Earth or some parts of Earth. This environment encompasses the interaction of all living species , climate , weather and natural resources that affect human survival and economic activity. The concept of the natural environment can be distinguished as components: Land manage...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Nepal", "label": "Nepal" e north by the Arctic Ocean , to the east by the Atlantic Ocean , to the southeast by South America and the Caribbean Sea , and to the south and west by the Pacific Ocean . The region includes Middle America comprising the Caribbean , Central America , and Northern America .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "northern Europe", "label": "northern Europe", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/0/0b/Satellite_image_of_Northern_Europe2.jpg/330px-Satellite_image_of_Northern_Europe2.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003enorthern Europe\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: northern Europe Wikipedia Page The northern region of Europe has several definitions. A restrictive definition may describe northern Europe as being roughly north of the southern coast of the Baltic Sea , which is about 54\u00b0N , or may be based on other geographical factors such as climate and ecology . A composed satellite photograph of islands and continental areas in and surrounding the North Sea and Baltic Sea\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Northern Hemisphere", "label": "Northern Hemisphere", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e4/Northern_Hemisphere_LamAz.png/250px-Northern_Hemisphere_LamAz.png\u0027 style=\u0027max-width:120px;float:right;ma : "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/8b/Basilikumwurzling.jpg/250px-Basilikumwurzling.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eorganisms\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: organisms Wikipedia Page An organism is any living thing that functions as an individual . Such a definition raises more problems than it solves, not least because the concept of an individual is also difficult. Several criteria, few of which are widely accepted, have been proposed to define what constitutes an organism. Among the most common is that an organism has autonomous reproduction , growth , and metabolism . This would exclude viruses , even though they evolve like organism...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Parasitology", "label": "Parasitology", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/c/cb/Onchocerca_volvulus_emerging_from_a_black_fly.jpg/250px-Onchocerca_volvulus_emerging_from_a_black_fly.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eParasitology\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Parasitology Wikipedia Page Parasitology is the study of parasites , their hosts , and the relationship between them. As a biological discipline , the scope of parasitology is not determined by the organism or environment in question but by their way of life. This means it forms a synthesis of other disciplines, and draws on techniques from fields such as cell biology , bioinformatics , biochemistry , molecular biology , immunology , genetics , evolution and ecology . Adult black fl...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "peatland restoration", "label": "peatland restoration", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/d9/PEATMAP.jpg/330px-PEATMAP.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epeatland restoration\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: peatland restoration Wikipedia Page Peatland restoration is a term describing measures to restore the original form and function of peatlands , or wet peat -rich areas. This landscape globally occupies 400 million hectares or 3% of land surface on Earth. Historically, peatlands have been drained for several main reasons; peat extraction , creation of agricultural land, and forestry usage. However, this activity has caused degradation affecting this landscape\u0027s structure through dama...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "peatlands", "label": "peatlands", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/77  oldest permafrost has been continuously frozen for around 700,000 years. Whilst the shallowest permafrost has a vertical extent of below a meter (3 ft), the deepest is greater than 1,500 m (4,900 ft). Similarly, the area of individual permafrost zones may be limited to narrow mountain summits or exten...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Peru", "label": "Peru", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/5/55/Caral-25.jpg/250px-Caral-25.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ePeru\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Peru Wikipedia Page Peru , officially the Republic of Peru , is a country in western South America . It is bordered to the north by Ecuador and Colombia , to the east by Brazil , to the southeast by Bolivia , to the south by Chile , and to the south and west by the Pacific Ocean. Peru is a megadiverse country , with habitats ranging from the arid plains of the Pacific coastal region in the west, to the peaks of the Andes mountains extending from the north to the southeast of the cou...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "phenology", "label": "phenology", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/9/97/First_bloom_index.png/330px-First_bloom_index.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ephenology\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: phenology Wikipedia Page Phenology is the study of periodic events in biological life cycles and how these are influenced by seasonal and interannual variations in climate , as well as habitat factors (such as elevation ). Historical day of year for first bloom index (FBI) for the Tallgrass Prairie National Preserve, Kansas (dots) fitted with a local polynomial regression model ( loess in red) and a 2 standard error band (blue). Data from William Monahan.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "photosynthesis", "label": "photosynthesis", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/5/55/Photosynthesis_en.svg/380px-Photosynthesis_en.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ephotosynthesis\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: photosynthesis Wikipedia Page Photosynthesis ( / \u02cc f o\u028a t \u0259 \u02c8 s \u026a n \u03b8 \u0259 s \u026a s / FOH -t\u0259- SINTH -\u0259-sis ) is a system of biological processes by which photopigment -bearing autotrophic organisms , such as most plants , algae and cyanobacteria , convert light energy \u2014 typically from sunlight \u2014 into the chemical energy necessary to fuel their metabolism . The term photosynthesis usually refers to oxygenic photosynthesis , a process that releases oxygen as a byproduct of water splitting ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "precipitation", "label": "precipitation", "shape": "dot", "size": 13.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/d0/Countries_by_average_annual_precipitation.png/500px-Countries_by_average_annual_precipitation.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eprecipitation\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: precipitation Wikipedia Page In meteorology , precipitation is any product of the condensation of atmospheric water vapor that falls from clouds due to gravitational pull. The main forms of precipitation include drizzle , rain , rain and snow mixed (\"sleet\" in Commonwealth usage), snow , ice pellets , graupel and hail . Precipitation occurs when a portion of the atmosphere becomes saturated with water vapor (reaching 100% relative humidity ), so that the water condenses and \"precipi...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "primary productivity", "label": "primary productivity", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/44/Seawifs_global_biosphere.jpg/500px-Seawifs_global_biosphere.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eprimary productivity\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: primary productivity Wikipedia Page In ecology , primary production is the synthesis of organic compounds from atmospheric or aqueous carbon dioxide . It principally occurs through the process of photosynthesis , which uses light as its source of energy, but it also occurs through chemosynthesis , which uses the oxidation or reduction of inorganic chemical compounds as its source of energy. Almost all life on Earth relies directly or indirectly on primary production. The organisms r...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "rainfall", "label": "rainfall", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/65/Hard_rain_on_a_roof.jpg/500px-Hard_rain_on_a_roof.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003erainfall\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: rainfall Wikipedia Page Rain is a form of precipitation where water droplets that have condensed from atmospheric water vapor fall by gravity . Rain is a major component of the water cycle and is responsible for depositing most of the fresh water on the Earth. It provides water for hydroelectric power plants , crop irrigation , and suitable conditions for many types of ecosystems . Heavy rainfall on a roof\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "rivers", "label": "rivers", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e heast Asia", "label": "Southeast Asia", "shape": "dot", "size": 14.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/f7/Southeast_Asia_%28orthographic_projection%29.svg/250px-Southeast_Asia_%28orthographic_projection%29.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eSoutheast Asia\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Southeast Asia Wikipedia Page Southeast Asia is the geographical southeastern region of Asia , consisting of the regions that are situated south of China , east of the Indian subcontinent , and northwest of mainland Australia , which is part of Oceania . Southeast Asia is bordered to the north by East Asia , to the west by South Asia and the Bay of Bengal , to the east by Oceania and the Pacific Ocean , and to the south by Australia and the Indian Ocean . Apart from the British Indi...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "southern Africa", "label": "southern Africa", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/f/f5/LocationSouthernAfrica.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003esouthern Africa\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: southern Africa Wikipedia Page Southern Africa is the southernmost region of Africa . No definition is agreed upon, but some groupings include the United Nations geoscheme , the intergovernmental Southern African Development Community , and the physical geography definition based on the physical characteristics of the land. The most restrictive definition considers the region of Southern Africa to consist of Botswana , Eswatini , Lesotho , Namibia , and South Africa , while other de...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "southwestern USA", "label": "southwestern USA", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/ef/Southwest_map.png/250px-Southwest_map.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003esouthwestern USA\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: southwestern USA Wikipedia Page The Southwestern United States , also known as the American Southwest or simply the Southwest , is a geographic and cultural region of the United States that includes Arizona and New Mexico , along with adjacent portions of California , Colorado , Nevada , Oklahoma , Texas , and Utah . The largest cities by metropolitan area are Phoenix , Las Vegas , El Paso , Albuquerque , and Tucson . Before 1848, in the historical region of Santa Fe de Nuevo M\u00e9xico...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Spain", "label": "Spain", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/ae/2014_Castro_de_Santa_Trega._Galiza-2.jpg/250px-2014_Castro_de_Santa_Trega._Galiza-2.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eSpain\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Spain Wikipedia Page Spain , officially the Kingdom of Spain , is a country in Southern and Western Europe with territories in North Africa . Featuring the southernmost point of continental Europe , it is the largest country in Southern Europe and the fourth-most populous European Union (EU) member state. Spanning the majority of the Iberian Peninsula , its territory also includes the Canary Islands , in the Eastern Atlantic Ocean ; the Balearic Islands , in the Western Mediterranea...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#66b2ff", "font": {"color": "#FFFFFF"}, "id": "species", "label": "species", "shape": "dot", "size": 20.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Biological_classification_L_Pengo_vflip.svg/150px-Biological_classification_L_Pengo_vflip.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003especies\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: species Wikipedia Page A species ( pl. species ) is the basic unit of classification and a taxonomic rank of an organism, as well as a unit of biodiversity . It can be defined as the largest group of organisms in which any two individuals of the appropriate sexes or mating types can produce fertile offspring , typically by sexual reproduction . Other ways of defining species include their karyotype , DNA sequence, morphology , behaviour, or ecological niche . In addition, palaeontol...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "species composition", "label": "species composition", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Hollow_curve_beetles.png/250px-Hollow_curve_beetles.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003especies composition\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: species composition Wikipedia Page Relative species abundance is a component of biodiversity and is a measure of how common or rare a species is relative to other species in a defined location or community. Relative abundance is the percent composition of an organism of a particular kind relative to the total number of organisms in the area. [ citation needed ] Relative species abundances tend to conform to specific patterns that are among the best-known and most-studied patterns in...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "species richness", "label": "species richness", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e8/Global_Mammal_Richness_Grids%2C_2015_Release%2C_All_Mammals_%2828871815285%29.jpg/330px-Global_Mammal_Richness_Grids%2C_2015_Release%2C_All_Mammals_%2828871815285%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003especies richness\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: species richness Wikipedia Page Species richness is the number of different species represented in an ecological community , landscape or region. Species richness is simply a count of species, and it does not take into account the abundances of the species or their relative abundance distributions . Species richness is sometimes considered synonymous with species diversity, but the formal metric species diversity takes into account both species richness and species evenness . Global...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "Sustainability", "label": "Sustainability", "shape": "dot", "size": 13.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Visualization_of_pillars_of_sustainability.webp/250px-Visualization_of_pillars_of_sustainability.webp.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eSustainability\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Sustainability Wikipedia Page Sustainability (from the latin sustinere - hold up, hold upright; furnish with means of support; bear, undergo, endure) is the ability to continue over a long period of time. In modern usage it generally refers to a state in which the environment, economy, and society will continue to exist over a long period of time. Many definitions emphasize the environmental dimension. This can include addressing key environmental problems , such as climate change a...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "sustainable development", "label": "sustainable development", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Visualization_of_pillars_of_sustainability.webp/250px-Visualization_of_pillars_of_sustainability.webp.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003esustainable development\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: sustainable development Wikipedia Page Sustainable development is an approach to growth and human development that aims to meet the needs of the present without compromising the ability of future generations to meet their own needs. The aim is to have a society where living conditions and resources meet human needs without undermining planetary integrity . Sustainable development aims to balance the needs of the economy , environment , and society. The Brundtland Report in 1987 help...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "sustainable development goals", "label": "sustainable development goals", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/en/thumb/3/31/Sustainable_Development_Goals_logo.svg/250px-Sustainable_Development_Goals_logo.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003esustainable development goals\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: sustainable development goals Wikipedia Page The 2030 Agenda for Sustainable Development , adopted by all United Nations (UN) members in 2015, created 17 world Sustainable Development Goals ( abbr. SDGs ). The aim of these global goals is \"peace and prosperity for people and the planet\" \u2013 while tackling climate change and working to preserve oceans and forests. The SDGs highlight the connections between the environmental, social and economic aspects of sustainable development . Sust...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "sustainable management", "label": "sustainable management", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003esustainable management\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: sustainable management Wikipedia Page Sustainable management takes the concepts from sustainability and synthesizes them with the concepts of management . Sustainability has three branches: the environment , the needs of present and future generations , and the economy . Using these branches, it creates the ability of a system to thrive by maintaining economic viability and also nourishing the needs of the present and future generations by limiting resource depletion .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Tasmania", "label": "Tasmania", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Tasmania.A2005320.2355.250m.jpg/250px-Tasmania.A2005320.2355.250m.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eTasmania\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Tasmania Wikipedia Page Tasmania ( /t\u00e6z\u02c8me\u026ani\u0259/ ; palawa kani : Lutruwita ) is an island state of Australia . It is located 240 kilometres (150 miles) to the south of the Australian mainland , and is separated from it by the Bass Strait . The state encompasses the main island of Tasmania, the 26th-largest island in the world , and the surrounding 1000 islands . It is Australia\u0027s smallest and least populous state, with 573,479 residents as of June 2023 [update] . The state capital an...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Tasmanian Wilderness World Heritage Area", "label": "Tasmanian Wilderness World Heritage Area", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a3/Lake_Judd_from_Mt_Eliza.jpg/250px-Lake_Judd_from_Mt_Eliza.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eTasmanian Wilderness World Heritage Area\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Tasmanian Wilderness World Heritage Area Wikipedia Page The Tasmanian Wilderness World Heritage Area , abbreviated to TWWHA , is a World Heritage Site in Tasmania , Australia . It is one of the largest conservation areas in Australia, covering 15,800 km 2 (6,100 sq mi), or almost 25 per cent of Tasmania. It is also one of the last expanses of temperate wilderness in the world, and includes the South West Wilderness .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "taxonomic groups", "label": "taxonomic groups", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/bf/Huang-Quan-Xie-sheng-zhen-qin-tu.jpg/500px-Huang-Quan-Xie-sheng-zhen-qin-tu.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003etaxonomic groups\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: taxonomic groups Wikipedia Page In biology , taxonomy (from Ancient Greek \u03c4\u03ac\u03be\u03b9\u03c2 ( taxis ) \u0027 arrangement \u0027 and -\u03bd\u03bf\u03bc\u03af\u03b1 ( -nomia ) \u0027 method \u0027 ) is the scientific study of naming, defining ( circumscribing ) and classifying groups of biological organisms based on shared characteristics. Organisms are grouped into taxa (singular: taxon), and these groups are given a taxonomic rank ; groups of a given rank can be aggregated to form a more inclusive group of higher rank, thus creating a ta...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "temperate regions", "label": "temperate regions", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/b1/Koppen-Geiger_Map_v2_C_1991%E2%80%932020.svg/500px-Koppen-Geiger_Map_v2_C_1991%E2%80%932020.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003etemperate regions\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: temperate regions Wikipedia Page In geography , the temperate climates of Earth occur in the middle latitudes (approximately 23.5\u00b0 to 66.5\u00b0 N/S of the Equator), which span between the tropics and the polar regions of Earth . These zones generally have wider temperature ranges throughout the year and more distinct seasonal changes compared to tropical climates , where such variations are often small; they usually differ only in the amount of precipitation . A K\u00f6ppen\u2013Geiger climate ma...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "temperature", "label": "temperature", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/23/Thermally_Agitated_Molecule.gif/250px-Thermally_Agitated_Molecule.gif\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003etemperature\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: temperature Wikipedia Page Temperature quantitatively expresses the attribute of hotness or coldness . Temperature is measured with a thermometer . It reflects the average kinetic energy of the vibrating and colliding atoms making up a substance.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "terrestrial ecosystems", "label": "terrestrial ecosystems", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eterrestrial ecosystems\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: terrestrial ecosystems Wikipedia Page Terrestrial ecosystems are ecosystems that are found on land. Examples include tundra , taiga , temperate deciduous forest , tropical rain forest , grassland , deserts .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Thailand", "label": "Thailand", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/Kingdom_%26_People_of_Siam_%28Vol_1%2C_1857%2C_15%29.svg/250px-Kingdom_%26_People_of_Siam_%28Vol_1%2C_1857%2C_15%29.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eThailand\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Thailand Wikipedia Page Thailand , officially the Kingdom of Thailand , and formerly known as Siam until 1939, is a country located in mainland Southeast Asia . It shares land borders with Myanmar to the west and northwest, Laos to the east and northeast, Cambodia to the southeast, and Malaysia to the south. Its maritime boundaries include the Gulf of Thailand and the Andaman Sea , as well as maritime borders with Vietnam , Indonesia , and India . Thailand has a population of nearly...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Tibetan Plateau", "label": "Tibetan Plateau", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/84/Himalaya_composite.jpg/330px-Himalaya_composite.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eTibetan Plateau\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Tibetan Plateau Wikipedia Page The Tibetan Plateau , also known as the Qinghai\u2013Tibet Plateau , Qingzang Plateau , or as the Himalayan Plateau , [ better source needed ] is a vast elevated plateau located at the intersection of Central , South , and East Asia . Geographically, it is located to the north of Himalayas and the Indian subcontinent , and to the south of Tarim Basin and Mongolian Plateau . Geopolitically, it covers most of the Tibet Autonomous Region , most of Qinghai , th...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "tree mortality", "label": "tree mortality", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/0/0c/Acid_rain_woods1.JPG/250px-Acid_rain_woods1.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003etree mortality\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: tree mortality Wikipedia Page Forest dieback (also \" Waldsterben \", a German loan word , pronounced [\u02c8valt\u02cc\u0283t\u025b\u0281bn\u0329] \u24d8 ) is a condition in trees or woody plants in which peripheral parts are killed, either by pathogens , parasites or conditions like acid rain , drought , and more. Jizera Mountains in Central Europe in 2006\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "tropical rainforests", "label": "tropical rainforests", "shape": "dot", "size": 13.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/d0/Aerial_view_of_the_Amazon_Rainforest.jpg/330px-Aerial_view_of_the_Amazon_Rainforest.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003etropical rainforests\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: tropical rainforests Wikipedia Page Tropical rainforests are dense and warm rainforests with high rainfall typically found between 10\u00b0 north and south of the Equator . They are a subset of the tropical forest biome that occurs roughly within the 28\u00b0 latitudes (in the torrid zone between the Tropic of Cancer and Tropic of Capricorn ). Tropical rainforests are a type of tropical moist broadleaf forest , that includes the more extensive seasonal tropical forests . True rainforests usua...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "Tropics", "label": "Tropics", "shape": "dot", "size": 14.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/b0/World_map_indicating_tropics_and_subtropics.png/500px-World_map_indicating_tropics_and_subtropics.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eTropics\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Tropics Wikipedia Page The tropics are the region of Earth surrounding the equator , where the sun may shine directly overhead . This contrasts with the temperate or polar regions of Earth, where the Sun can never be directly overhead. Because of Earth\u0027s axial tilt , the width of the tropics (in latitude) is twice the tilt. The tropics are also referred to as the tropical zone and the torrid zone (see geographical zone ). World map with the intertropical zone highlighted in crimson\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "tundra", "label": "tundra", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/17/Greenland_scoresby-sydkapp2_hg.jpg/330px-Greenland_scoresby-sydkapp2_hg.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003etundra\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: tundra Wikipedia Page In physical geography , a tundra ( / \u02c8 t \u028c n d r \u0259 , \u02c8 t \u028a n -/ ) is a type of biome where tree growth is hindered by frigid temperatures and short growing seasons. There are three regions and associated types of tundra: Arctic , Alpine , and Antarctic .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "UK", "label": "UK", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e9/Coat_of_arms_of_the_United_Kingdom_%282022%2C_both_variants%29.svg/250px-Coat_of_arms_of_the_United_Kingdom_%282022%2C_both_variants%29.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eUK\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: UK Wikipedia Page The United Kingdom of Great Britain and Northern Ireland , commonly known as the United Kingdom ( UK ) or Britain , is a country in Northwestern Europe , off the coast of the continental mainland . It comprises England , Scotland , Wales and Northern Ireland , with a population of over 69 million in 2024. The UK includes the island of Great Britain , the north-eastern part of the island of Ireland , and most of the smaller islands within the British Isles , coverin...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "United Nations", "label": "United Nations", "shape": "dot", "size": 13.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/16/Emperor_Haile_Selassie_League_of_Nations_speech.png/250px-Emperor_Haile_Selassie_League_of_Nations_speech.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66 nical or geographic characteristics. It is broader than the term flora which refers to species composition . Perhaps the closest synonym is plant community , but \"vegetation\" can, and often does, refer to a wider range of spatial scales than that term d...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "vulnerable species", "label": "vulnerable species", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/7b/Brachypelma_smithi_2009_G09.jpg/250px-Brachypelma_smithi_2009_G09.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003evulnerable species\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: vulnerable species Wikipedia Page A vulnerable species is a species which has been categorized by the International Union for Conservation of Nature as being threatened with extinction unless the circumstances that are threatening its survival and reproduction improve. Mexican red-knee tarantula ( Brachypelma hamorii ), a vulnerable species from Mexico\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "water", "label": "water", "shape": "dot", "size": 15.399999999999999, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/en/thumb/8/8a/OOjs_UI_icon_edit-ltr-progressive.svg/20px-OOjs_UI_icon_edit-ltr-progressive.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ewater\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: water Wikipedia Page Water is an inorganic compound with the chemical formula H 2 O . It is a transparent, tasteless, odorless, and nearly colorless chemical substance . It is the main constituent of Earth\u0027s hydrosphere and the fluids of all known living organisms, in which it acts as a solvent . Water, being a polar molecule, undergoes strong intermolecular hydrogen bonding which is a large contributor to its physical and chemical properties. It is vital for all known forms of life...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "water purification", "label": "water purification", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/37/Illustration_of_a_typical_drinking_water_treatment_process.png/330px-Illustration_of_a_typical_drinking_water_treatment_process.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ewater purification\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: water purification Wikipedia Page Water purification is the process of removing undesirable chemicals, biological contaminants, suspended solids, and gases from water . The goal is to produce water that is fit for specific purposes. Most water is purified and disinfected for human consumption ( drinking water ), but water purification may also be carried out for a variety of other purposes, including medical, pharmacological, chemical, and industrial applications. The history of wat...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "water quality", "label": "water quality", "shape": "dot", "size": 13.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/0/03/Rosette_sampler_EPA.gif/250px-Rosette_sampler_EPA.gif\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ewater quality\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: water quality Wikipedia Page Water quality refers to the chemical , physical , and biological characteristics of water based on the standards of its usage. It is most frequently used by reference to a set of standards against which compliance, generally achieved through treatment of the water, can be assessed. The most common standards used to monitor and assess water quality convey the health of ecosystems , safety of human contact, extent of water pollution and condition of drinki...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "water resources", "label": "water resources", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/Parinacota.jpg/250px-Parinacota.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ewater resources\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: water resources Wikipedia Page Water resources are natural resources of water that are potentially useful for humans, for example as a source of drinking water supply or irrigation water. These resources can be either freshwater from natural sources, or water produced artificially from other sources, such as from reclaimed water ( wastewater ) or desalinated water ( seawater ). 97% of the water on Earth is salt water and only three percent is fresh water ; slightly over two-thirds o...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "water security", "label": "water security", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/41/Vallee_fertile_du_Nil_a_Louxor.jpg/250px-Vallee_fertile_du_Nil_a_Louxor.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ewater security\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: water security Wikipedia Page The aim of water security is to maximize the benefits of water for humans and ecosystems. The second aim is to limit the risks of destructive impacts of water to an acceptable level. These risks include too much water ( flood ), too little water ( drought and water scarcity ), and poor quality ( polluted ) water. People who live with a high level of water security always have access to \"an acceptable quantity and quality of water for health, livelihood,...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "water storage", "label": "water storage", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-famil                           document.getElementById('bar').style.width = '496px';
                          document.getElementById('loadingBar').style.opacity = 0;
                          // really clean the dom element
                          setTimeout(function () {document.getElementById('loadingBar').style.display = 'none';}, 500);
                      });
                  

                  return network;

              }
              drawGraph();
        </script>
    
<!-- 🔍 Search and Legend -->
<style>
#searchBox {
  position: fixed; top: 20px; left: 20px; z-index: 9999;
  background: rgba(0,0,0,0.6); padding: 10px 15px;
  border-radius: 8px; border: 1px solid #66b2ff;
}
#searchInput {
  width: 160px; padding: 5px; border: none; outline: none;
  background: #222; color: #fff; border-radius: 4px;
}
#searchButton {
  padding: 5px 8px; background: #66b2ff; color: #000;
  border: none; border-radius: 4px; cursor: pointer;
}
#legendBox {
  position: fixed; top: 20px; right: 20px; background: rgba(0,0,0,0.6);
  border: 1px solid #66b2ff; border-radius: 8px; padding: 10px 14px;
  z-index: 9999; color: #fff; font-family: system-ui, Helvetica, Arial;
  font-size: 13px; max-width: 200px; line-height: 1.6;
}
.legend-item { display: flex; align-items: center; margin-bottom: 5px; }
.legend-dot { width: 14px; height: 14px; border-radius: 50%; margin-right: 8px; }
.legend-blue { background: #66b2ff; }
.legend-orange { background: #ff9933; }
.legend-red { background: #ff5555; }
.legend-green { background: #00ff99; }
</style>

<div id="searchBox">
  <input id="searchInput" type="text" placeholder="Search node...">
  <button id="searchButton">Go</button>
</div>

<div id="legendBox">
  <div style="font-weight:bold;margin-bottom:5px;">🗺️ Node Colors</div>
  <div class="legend-item"><span class="legend-dot legend-green"></span>Highly Connected Nodes</div>
  <div class="legend-item"><span class="legend-dot legend-blue"></span>Main Topics</div>
  <div class="legend-item"><span class="legend-dot legend-orange"></span>Subfields / Categories</div>
  <div class="legend-item"><span class="legend-dot legend-red"></span>Related Concepts</div>
</div>

<script>
document.getElementById('searchButton').onclick = function() {
  var query = document.getElementById('searchInput').value.trim().toLowerCase();
  if (!query) return;
  var nodes = network.body.data.nodes.get();
  var found = nodes.find(n => n.label.toLowerCase() === query);
  if (found) {
    network.focus(found.id, {scale: 1.5, animation: true});
    network.selectNodes([found.id]);
  }
  document.getElementById('searchInput').value = '';
};
document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('searchButton').click();
});
</script>

</body>
