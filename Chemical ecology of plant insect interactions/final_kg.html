Hungary \u2013 in Europe (green \u0026 dark grey) \u2013 in the European Union (green) \u2013 [ Legend ]"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Ent", "label": "Ent", "shape": "dot", "size": 10, "title": "search term: Ent Wikipedia URL: Ent Ents are giant humanoids in J. R. R. Tolkien \u0027s fantasy world of Middle-earth who closely resemble trees ; their leader is Treebeard of Fangorn forest. Their name is derived from an Old English word for \" giant \"."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Chemical defense", "label": "Chemical defense", "shape": "dot", "size": 10, "title": "search term: Chemical defense Wikipedia URL: Chemical defense Chemical defense is a strategy employed by many organisms to avoid consumption by producing toxic or repellent metabolites or chemical warnings which incite defensive behavioral changes. The production of defensive chemicals occurs in plants, fungi, and bacteria, as well as invertebrate and vertebrate animals. The class of chemicals produced by organisms that are considered defensive may be considered in a strict sense to only apply to those aiding an organism in escaping herbivory or predation . However, the distinction between types of chemical interaction is subjective and defensive chemicals may also be considered to protect against reduced fitness by pests , parasites , and competitors . Repellent rather than toxic metabolites are allomones, a sub category signaling metabolites known as semiochemicals . Many chemicals used for defensive purposes are secondary metabolites derived from primary metabolites which serve a ph"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "social networks", "label": "social networks", "shape": "dot", "size": 10, "title": "search term: social networks Wikipedia URL: Social networks 1800s: Martineau \u00b7 Tocqueville \u00b7 Marx \u00b7 Spencer \u00b7 Le Bon \u00b7 Ward \u00b7 Pareto \u00b7 T\u00f6nnies \u00b7 Veblen \u00b7 Simmel \u00b7 Durkheim \u00b7 Addams \u00b7 Mead \u00b7 Weber \u00b7 Du Bois \u00b7 Mannheim \u00b7 Elias Evolution graph of a social network: Barab\u00e1si model ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "lifespan", "label": "lifespan", "shape": "dot", "size": 10, "title": "search term: lifespan Wikipedia URL: Lifespan Lifespan or life span may refer to:"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "eusocial wasps", "label": "eusocial wasps", "shape": "dot", "size": 10, "title": "search term: eusocial wasps Wikipedia URL: eusocial wasps The page \" Eusocial wasps \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "gut symbionts", "label": "gut symbionts", "shape": "dot", "size": 14, "title": "search term: gut symbionts Wikipedia URL: Gut symbionts Gut microbiota , gut microbiome , or gut flora are the microorganisms , including bacteria , archaea , fungi , and viruses , that live in the digestive tracts of animals . The gastrointestinal metagenome is the aggregate of all the genomes of the gut microbiota . The gut is the main location of the human microbiome . The gut microbiota has broad impacts, including effects on colonization , resistance to pathogens , maintaining the intestinal epithelium , metabolizing dietary and pharmaceutical compounds, controlling immune function, and even behavior through the gut\u2013brain axis . Imbalances in the gut microbiota ( dysbiosis ) have been associated with numerous diseases, including inflammatory bowel disease, certain cancers, and even neurological disorders, prompting increased efforts to develop microbiome-targeted therapies. Escherichia coli , one of the many species of bacteria present in the human gut"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Microbiol", "label": "Microbiol", "shape": "dot", "size": 10, "title": "search term: Microbiol Wikipedia URL: Microbiol The page \" Microbiol \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "intestinal symbiotic bacteria", "label": "intestinal symbiotic bacteria", "shape": "dot", "size": 10, "title": "search term: intestinal symbiotic bacteria Wikipedia URL: intestinal symbiotic bacteria The page \" Intestinal symbiotic bacteria \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "microbiota", "label": "microbiota", "shape": "dot", "size": 16, "title": "search term: microbiota Wikipedia URL: Microbiota Microbiota are the range of microorganisms that may be commensal , mutualistic , or pathogenic found in and on all multicellular organisms , including plants . Microbiota include bacteria , archaea , protists , fungi , and viruses , and have been found to be crucial for immunologic, hormonal, and metabolic homeostasis of their host. Diverse microbial communities of characteristic microbiota are part of plant microbiomes , and are found on the outside surfaces and in the internal tissues of the host plant, as well as in the surrounding soil."}, {"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "bacteria", "label": "bacteria", "shape": "dot", "size": 44, "title": "search term: bacteria Wikipedia URL: Bacteria And see text"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "symbiotic bacteria", "label": "symbiotic bacteria", "shape": "dot", "size": 10, "title": "search term: symbiotic bacteria Wikipedia URL: Symbiotic bacteria Symbiotic bacteria are bacteria living in symbiosis with another organism or each other. For example, rhizobia living in root nodules of legumes provide nitrogen fixing activity for these plants."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Riptortus pedestris", "label": "Riptortus pedestris", "shape": "dot", "size": 10, "title": "search term: Riptortus pedestris Wikipedia URL: Riptortus pedestris The page \" Riptortus pedestris \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "symbionts", "label": "symbionts", "shape": "dot", "size": 12, "title": "search term: symbionts Wikipedia URL: Symbionts Symbiosis is any close and long-term biological interaction between two organisms of different species . In 1879, Heinrich Anton de Bary defined symbiosis as \"the living together of unlike organisms\". The term is sometimes more exclusively used in a restricted, mutualistic sense, where both symbionts contribute to each other\u0027s subsistence. This means that they benefit each other in some way. In a cleaning symbiosis , the clownfish feeds on small invertebrates, that otherwise have potential to harm the sea anemone , and the fecal matter from the clownfish provides nutrients to the sea anemone. The clownfish is protected from predators by the anemone\u0027s stinging cells, to which the clownfish is immune. The relationship is therefore classified as mutualistic ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "insect gut symbionts", "label": "insect gut symbionts", "shape": "dot", "size": 10, "title": "search term: insect gut symbionts Wikipedia URL: insect gut symbionts The page \" Insect gut symbionts \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "defensive compounds", "label": "defensive compounds", "shape": "dot", "size": 10, "title": "search term: defensive compounds Wikipedia URL: defensive compounds The page \" Defensive compounds \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "essential amino acids", "label": "essential amino acids", "shape": "dot", "size": 10, "title": "search term: essential amino acids Wikipedia URL: Essential amino acids An essential amino acid , or indispensable amino acid , is an amino acid that cannot be synthesized from scratch by the organism fast enough to supply its demand, and must therefore come from the diet. Of the 21 amino acids common to all life forms, the nine amino acids humans cannot synthesize are valine , isoleucine , leucine , methionine , phenylalanine , tryptophan , threonine , histidine , and lysine . Unspecified L-amino acid"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "vitamins", "label": "vitamins", "shape": "dot", "size": 10, "title": "search term: vitamins Wikipedia URL: Vitamins Vitamins are organic molecules (or a set of closely related molecules called vitamers ) that are essential to an organism in small quantities for proper metabolic function. These essential nutrients cannot be synthesized in the organism in sufficient quantities for survival, and therefore must be obtained through consumption . For example, vitamin C can be synthesized by some species but not by others; it is not considered a vitamin in the first instance but is in the second. Most vitamins are not single molecules, but groups of related molecules called vitamers. For example, there are eight vitamers of vitamin E : four tocopherols and four tocotrienols ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "reactive oxygen species", "label": "reactive oxygen species", "shape": "dot", "size": 14, "title": "search term: reactive oxygen species Wikipedia URL: Reactive oxygen species In chemistry and biology , reactive oxygen species ( ROS ) are highly reactive chemicals formed from diatomic oxygen ( O 2 ), water , and hydrogen peroxide . Some prominent ROS are hydroperoxide , superoxide (O 2 \u2212 ), hydroxyl radical (OH . ), and singlet oxygen ( 1 O 2 ). ROS are pervasive because they are readily produced from O 2 , which is abundant. ROS are important in many ways, both beneficial and otherwise. ROS function as signals, that turn on and off biological functions. They are intermediates in the redox behavior of O 2 , which is central to fuel cells . ROS are central to the photodegradation of organic pollutants in the atmosphere. Most often, however, ROS are discussed in a biological context, ranging from their effects on aging and their role in causing dangerous genetic mutations. Lewis structure of some of the reactive oxygen species. A : hydroxyl radical ( HO \u2022 ); B : hydroxide ion ( HO \u2212 );"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "rice", "label": "rice", "shape": "dot", "size": 12, "title": "search term: rice Wikipedia URL: Rice Rice is a cereal grain and in its domesticated form is the staple food of over half of the world\u0027s population , particularly in Asia and Africa . Rice is the seed of the grass species Oryza sativa (Asian rice)\u2014or, much less commonly, Oryza glaberrima (African rice). Asian rice was domesticated in China some 13,500 to 8,200 years ago; African rice was domesticated in Africa about 3,000 years ago. Rice has become commonplace in many cultures worldwide; in 2023, 800 million tons were produced, placing it third after sugarcane and maize . Only some 8% of rice is traded internationally. China, India, and Indonesia are the largest consumers of rice. A substantial amount of the rice produced in developing nations is lost after harvest through factors such as poor transport and storage. Rice yields can be reduced by pests including insects , rodents , and birds , as well as by weeds , and by diseases such as rice blast . Traditional rice polycultures such "}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Bombyx mori", "label": "Bombyx mori", "shape": "dot", "size": 12, "title": "search term: Bombyx mori Wikipedia URL: Bombyx mori Bombyx mori , commonly known as the domestic silk moth , is a domesticated moth species belonging to the family Bombycidae . It is the closest relative of Bombyx mandarina , the wild silk moth. Silkworms are the larvae of silk moths. The silkworm is of particular economic value, being a primary producer of silk . The silkworm\u0027s preferred food are the leaves of white mulberry , though they may eat other species of mulberry, and even leaves of other plants. Domestic silk moths are entirely dependent on humans for reproduction, as a result of millennia of selective breeding. Wild silk moths, which are other species of Bombyx , are not as commercially viable in the production of silk."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "pesticides", "label": "pesticides", "shape": "dot", "size": 10, "title": "search term: pesticides Wikipedia URL: Pesticides Pesticides are substances that are used to control pests . They include herbicides , insecticides , nematicides , fungicides , and many others (see table). The most common of these are herbicides, which account for approximately 50% of all pesticide use globally. Most pesticides are used as plant protection products (also known as crop protection products), which in general protect plants from weeds , fungi, or insects . A self-propelled crop sprayer spraying pesticide on a field"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Plutella xylostella", "label": "Plutella xylostella", "shape": "dot", "size": 12, "title": "search term: Plutella xylostella Wikipedia URL: Plutella xylostella The diamondback moth ( Plutella xylostella ), sometimes called the cabbage moth , is a moth species of the family Plutellidae and genus Plutella . The small, grayish-brown moth sometimes has a cream-colored band that forms a diamond along its back. The species may have originated in Europe , South Africa , or the Mediterranean region, but it has now spread worldwide."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "pectinase", "label": "pectinase", "shape": "dot", "size": 10, "title": "search term: pectinase Wikipedia URL: Pectinase Pectinases are a group of enzymes that breaks down pectin , a polysaccharide found in plant cell walls, through hydrolysis, transelimination and deesterification reactions. Commonly referred to as pectic enzymes, they include pectolyase , pectozyme, and polygalacturonase , one of the most studied and widely used [ citation needed ] commercial pectinases. It is useful because pectin is the jelly-like matrix which helps cement plant cells together and in which other cell wall components, such as cellulose fibrils, are embedded. Therefore, pectinase enzymes are commonly used in processes involving the degradation of plant materials, such as speeding up the extraction of fruit juice from fruit , including apples and sapota . Pectinases have also been used in wine production since the 1960s. The function of pectinase in brewing is twofold, first it helps break down the plant (typically fruit) material and so helps the extraction of flavors fro"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "nitrogen fixation", "label": "nitrogen fixation", "shape": "dot", "size": 10, "title": "search term: nitrogen fixation Wikipedia URL: Nitrogen fixation Nitrogen fixation is a chemical process by which molecular dinitrogen ( N 2 ) is converted into ammonia ( NH 3 ). It occurs both biologically and abiologically in chemical industries . Biological nitrogen fixation or diazotrophy is catalyzed by enzymes called nitrogenases . These enzyme complexes are encoded by the Nif genes (or Nif homologs ) and contain iron , often with a second metal (usually molybdenum , but sometimes vanadium ). Schematic representation of the nitrogen cycle . Abiotic nitrogen fixation has been omitted."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "secondary metabolites", "label": "secondary metabolites", "shape": "dot", "size": 18, "title": "search term: secondary metabolites Wikipedia URL: Secondary metabolites Secondary metabolites , also called specialised metabolites , secondary products , or natural products , are organic compounds produced by any lifeform, e.g. bacteria , archaea , fungi , animals , or plants , which are not directly involved in the normal growth , development , or reproduction of the organism. Instead, they generally mediate ecological interactions , which may produce a selective advantage for the organism by increasing its survivability or fecundity . Specific secondary metabolites are often restricted to a narrow set of species within a phylogenetic group. Secondary metabolites often play an important role in plant defense against herbivory and other interspecies defenses. Humans use secondary metabolites as medicines, flavourings, pigments, and recreational drugs. Structural formula for the amino acid pipecolic acid , which contrary to other amino acids is not used as a building block in proteins"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "insect herbivores", "label": "insect herbivores", "shape": "dot", "size": 10, "title": "search term: insect herbivores Wikipedia URL: insect herbivores The page \" Insect herbivores \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Lepidoptera", "label": "Lepidoptera", "shape": "dot", "size": 14, "title": "search term: Lepidoptera Wikipedia URL: Lepidoptera Aglossata Glossata Heterobathmiina Zeugloptera"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "detoxification", "label": "detoxification", "shape": "dot", "size": 12, "title": "search term: detoxification Wikipedia URL: Detoxification Detoxification or detoxication ( detox for short) is the physiological or medicinal removal of toxic substances from a living organism , including the human body, which is mainly carried out by the liver . Additionally, it can refer to the period of drug withdrawal during which an organism returns to homeostasis after long-term use of an addictive substance. In medicine , detoxification can be achieved by decontamination of poison ingestion and the use of antidotes as well as techniques such as dialysis and (in a limited number of cases) chelation therapy ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "phytophagous insects", "label": "phytophagous insects", "shape": "dot", "size": 10, "title": "search term: phytophagous insects Wikipedia URL: phytophagous insects The page \" Phytophagous insects \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "plant defense compounds", "label": "plant defense compounds", "shape": "dot", "size": 10, "title": "search term: plant defense compounds Wikipedia URL: plant defense compounds The page \" Plant defense compounds \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "plants", "label": "plants", "shape": "dot", "size": 16, "title": "search term: plants Wikipedia URL: Plants Plants are the eukaryotic organisms that constitute the kingdom Plantae . They are predominantly photosynthetic , meaning that they obtain their energy from sunlight . They do that using the green pigment chlorophyll in their chloroplasts to produce sugars from carbon dioxide and water. Exceptions are parasitic plants that have lost the genes for chlorophyll and photosynthesis, and obtain their energy from other plants or fungi. Most plants are multicellular , except for some green algae. The desmid Cosmarium botrytis is a single cell."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "herbivores", "label": "herbivores", "shape": "dot", "size": 12, "title": "search term: herbivores Wikipedia URL: Herbivores A herbivore is an animal anatomically and physiologically evolved to feed on plants , especially upon vascular tissues such as foliage , fruits or seeds , as the main component of its diet . These more broadly also encompass animals that eat non-vascular autotrophs such as mosses , algae and lichens , but do not include those feeding on decomposed plant matters (i.e. detritivores ) or macrofungi (i.e. fungivores ). A deer and two fawns feeding on foliage"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "plant cell walls", "label": "plant cell walls", "shape": "dot", "size": 10, "title": "search term: plant cell walls Wikipedia URL: Plant cell walls A cell wall is a structural layer that surrounds some cell types , found immediately outside the cell membrane . It can be tough, flexible, and sometimes rigid. Primarily, it provides the cell with structural support, shape, protection, and functions as a selective barrier. Another vital role of the cell wall is to help the cell withstand osmotic pressure and mechanical stress. Cell walls are found in most prokaryotes , with the exception of mollicute bacteria. Among the eukaryotes , cells walls are prevalent in fungi , algae and plants but absent from animals and many other taxa. Diagram of the plant cell, with the cell wall in green."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "insect secretions", "label": "insect secretions", "shape": "dot", "size": 10, "title": "search term: insect secretions Wikipedia URL: insect secretions The page \" Insect secretions \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "jasmonic acid", "label": "jasmonic acid", "shape": "dot", "size": 10, "title": "search term: jasmonic acid Wikipedia URL: Jasmonic acid Jasmonic acid ( JA ) is an organic compound found in several plants including jasmine . The molecule is a member of the jasmonate class of plant hormones . It is biosynthesized from linolenic acid by the octadecanoid pathway . It was first isolated in 1957 as the methyl ester of jasmonic acid by the Swiss chemist \u00c9douard Demole and his colleagues. Jasmonic acid"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "chemical signals", "label": "chemical signals", "shape": "dot", "size": 10, "title": "search term: chemical signals Wikipedia URL: chemical signals The page \" Chemical signals \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "microorganisms", "label": "microorganisms", "shape": "dot", "size": 14, "title": "search term: microorganisms Wikipedia URL: Microorganisms A microorganism , or microbe , is an organism of microscopic size, which may exist in its single-celled form or as a colony of cells . The possible existence of unseen microbial life was suspected from antiquity, with an early attestation in Jain literature authored in 6th-century BC India. The scientific study of microorganisms began with their observation under the microscope in the 1670s by Anton van Leeuwenhoek . In the 1850s, Louis Pasteur found that microorganisms caused food spoilage , debunking the theory of spontaneous generation . In the 1880s, Robert Koch discovered that microorganisms caused the diseases tuberculosis , cholera , diphtheria , and anthrax . A cluster of Escherichia coli bacteria magnified 10,000 times"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "intestinal barrier homeostasis", "label": "intestinal barrier homeostasis", "shape": "dot", "size": 10, "title": "search term: intestinal barrier homeostasis Wikipedia URL: intestinal barrier homeostasis The page \" Intestinal barrier homeostasis \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "15010014", "label": "15010014", "shape": "dot", "size": 10, "title": "search term: 15010014 Wikipedia URL: 15010014 The page \" 15010014 \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Pl", "label": "Pl", "shape": "dot", "size": 10, "title": "search term: Pl Wikipedia URL: Pl PL , P.L. , Pl , or .pl may refer to:"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "feeding", "label": "feeding", "shape": "dot", "size": 12, "title": "search term: feeding Wikipedia URL: Feeding Eating (also known as consuming ) is the ingestion of food . In biology, this is typically done to provide a heterotrophic organism with energy and nutrients and to allow for growth. Animals and other heterotrophs must eat in order to survive \u2013 carnivores eat other animals, herbivores eat plants, omnivores consume a mixture of both plant and animal matter, and detritivores eat detritus . Fungi digest organic matter outside their bodies as opposed to animals that digest their food inside their bodies. Amandines de Provence, poster by Leonetto Cappiello , 1900, which shows a woman eating almond cookies"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "defense signals", "label": "defense signals", "shape": "dot", "size": 10, "title": "search term: defense signals Wikipedia URL: defense signals The page \" Defense signals \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "multitrophic interactions", "label": "multitrophic interactions", "shape": "dot", "size": 10, "title": "search term: multitrophic interactions Wikipedia URL: multitrophic interactions The page \" Multitrophic interactions \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "abscisic acid", "label": "abscisic acid", "shape": "dot", "size": 10, "title": "search term: abscisic acid Wikipedia URL: Abscisic acid Abscisic acid ( ABA or abscisin II ) is a plant hormone . ABA functions in many plant developmental processes, including seed and bud dormancy , the control of organ size and stomatal closure. It is especially important for plants in the response to environmental stresses , including drought , soil salinity , cold tolerance, freezing tolerance , heat stress and heavy metal ion tolerance."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "JA pathway", "label": "JA pathway", "shape": "dot", "size": 10, "title": "search term: JA pathway Wikipedia URL: JA pathway The page \" JA pathway \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "SA pathway", "label": "SA pathway", "shape": "dot", "size": 10, "title": "search term: SA pathway Wikipedia URL: SA pathway The page \" SA pathway \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Spodoptera frugiperda", "label": "Spodoptera frugiperda", "shape": "dot", "size": 12, "title": "search term: Spodoptera frugiperda Wikipedia URL: Spodoptera frugiperda The fall armyworm ( Spodoptera frugiperda ) is a species in the order Lepidoptera and one of the species of the fall armyworm moths distinguished by their larval life stage. The term \"armyworm\" can refer to several species, often describing the large-scale invasive behavior of the species\u0027 larval stage. It is regarded as a pest and can damage and destroy a wide variety of crops , which causes large economic damage. Its scientific name derives from frugiperda, which is Latin for lost fruit , named because of the species\u0027 ability to destroy crops. Because of its propensity for destruction, the fall armyworm\u0027s habits and possibilities for crop protection have been studied in depth. It is also a notable case for studying sympatric speciation , as it appears to be diverging into two species currently. Another remarkable trait of the larva is that they consistently practice cannibalism , despite its fitness costs."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "tannins", "label": "tannins", "shape": "dot", "size": 10, "title": "search term: tannins Wikipedia URL: Tannins Tannins (or tannoids ) are a class of astringent , polyphenolic biomolecules that bind to and precipitate proteins and various other organic compounds including amino acids and alkaloids . The term tannin is widely applied to any large polyphenolic compound containing sufficient hydroxyls and other suitable groups (such as carboxyls ) to form strong compounds with various macromolecules . Representative chemical structure of a tannic acid , a type of tannin"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "alkaloids", "label": "alkaloids", "shape": "dot", "size": 10, "title": "search term: alkaloids Wikipedia URL: Alkaloids Alkaloids are a broad class of naturally occurring organic compounds that contain at least one nitrogen atom. Some synthetic compounds of similar structure may also be termed alkaloids. The first individual alkaloid, morphine , was isolated in 1804 from the opium poppy ( Papaver somniferum )."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "insect digestion", "label": "insect digestion", "shape": "dot", "size": 10, "title": "search term: insect digestion Wikipedia URL: Insect digestion Insect morphology is the study and description of the physical form of insects . The terminology used to describe insects is similar to that used for other arthropods due to their shared evolutionary history. Three physical features separate insects from other arthropods: they have a body divided into three regions (called tagmata) (head, thorax, and abdomen), three pairs of legs, and mouthparts located outside of the head capsule . This position of the mouthparts divides them from their closest relatives, the non-insect hexapods , which include Protura , Diplura , and Collembola . Insect morphology Legend of body parts Tagmata: A \u2013 Head, B \u2013 Thorax, C \u2013 Abdomen. antenna ocelli (lower) ocelli (upper) compound eye brain (cerebral ganglia ) prothorax dorsal blood vessel tracheal tubes (trunk with spiracle ) mesothorax metathorax forewing hindwing mid-gut (stomach) dorsal tube (heart) ovary hind-gut (intestine, rectum \u0026 anus) a"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "hydrolytic enzymes", "label": "hydrolytic enzymes", "shape": "dot", "size": 10, "title": "search term: hydrolytic enzymes Wikipedia URL: Hydrolytic enzymes In biochemistry , hydrolases constitute a class of enzymes that commonly function as biochemical catalysts that use water to break a chemical bond :"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Acinetobacter", "label": "Acinetobacter", "shape": "dot", "size": 12, "title": "search term: Acinetobacter Wikipedia URL: Acinetobacter Acinetobacter albensis Acinetobacter apis Acinetobacter baumannii Acinetobacter baylyi Acinetobacter beijerinckii Acinetobacter bereziniae Acinetobacter bohemicus Acinetobacter boissieri Acinetobacter bouvetii Acinetobacter brisouii Acinetobacter calcoaceticus Acinetobacter celticus Acinetobacter chengduensis Acinetobacter colistiniresistens Acinetobacter courvalinii Acinetobacter cumulans Acinetobacter defluvii Acinetobacter dispersus Acinetobacter dijkshoorniae Acinetobacter equi Acinetobacter gandensis Acinetobacter gerneri Acinetobacter guangdongensis Acinetobacter guerrae Acinetobacter guillouiae Acinetobacter gyllenbergii Acinetobacter haemolyticus Acinetobacter harbinensis Acinetobacter indicus Acinetobacter junii Acinetobacter kookii Acinetobacter lactucae Acinetobacter lanii Acinetobacter larvae Acinetobacter lwoffii Acinetobacter modestus Acinetobacter nectaris Acinetobacter nosocomialis Acinetobacter oryzae Acinetobacte"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Pseudomonas", "label": "Pseudomonas", "shape": "dot", "size": 12, "title": "search term: Pseudomonas Wikipedia URL: Pseudomonas Pseudomonas is a genus of Gram-negative bacteria belonging to the family Pseudomonadaceae in the class Gammaproteobacteria . The 348 members of the genus demonstrate a great deal of metabolic diversity and consequently are able to colonize a wide range of niches and hosts. Their ease of culture in vitro and availability of an increasing number of Pseudomonas strain genome sequences has made the genus an excellent focus for scientific research; the best studied species include P. aeruginosa in its role as an opportunistic human pathogen , the plant pathogen P. syringae , the soil bacterium P. putida , and the plant growth-promoting P. fluorescens , P. lini , P. migulae , and P. graminis ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "lignin", "label": "lignin", "shape": "dot", "size": 12, "title": "search term: lignin Wikipedia URL: Lignin Lignin is a class of complex organic polymers that form key structural materials in the support tissues of most plants. Lignins are particularly important in the formation of cell walls , especially in wood and bark , because they lend rigidity and do not rot easily. Chemically, lignins are polymers made by the cross-linking of phenolic precursors. Idealized structure of lignin from a softwood"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "AS23", "label": "AS23", "shape": "dot", "size": 10, "title": "search term: AS23 Wikipedia URL: AS23 The page \" AS23 \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "tea saponins", "label": "tea saponins", "shape": "dot", "size": 10, "title": "search term: tea saponins Wikipedia URL: tea saponins The page \" Tea saponins \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "kaempferol", "label": "kaempferol", "shape": "dot", "size": 10, "title": "search term: kaempferol Wikipedia URL: Kaempferol"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "antibiotic treatment", "label": "antibiotic treatment", "shape": "dot", "size": 10, "title": "search term: antibiotic treatment Wikipedia URL: antibiotic treatment The page \" Antibiotic treatment \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Hyphantria cunea", "label": "Hyphantria cunea", "shape": "dot", "size": 10, "title": "search term: Hyphantria cunea Wikipedia URL: Hyphantria cunea The fall webworm ( Hyphantria cunea ) is a moth in the family Erebidae known principally for its larval stage, which creates the characteristic webbed nests on the tree limbs of a wide variety of hardwoods in the late summer and fall. It is considered a pest but does not harm otherwise healthy trees. It is well known to commercial tree services and arboriculturists . Fall webworms are an invasive species in East Asia."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "microbial communities", "label": "microbial communities", "shape": "dot", "size": 12, "title": "search term: microbial communities Wikipedia URL: Microbial communities Microbial population biology is the application of the principles of population biology to microorganisms ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "northern population", "label": "northern population", "shape": "dot", "size": 10, "title": "search term: northern population Wikipedia URL: northern population The page \" Northern population \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "corn", "label": "corn", "shape": "dot", "size": 10, "title": "search term: corn Wikipedia URL: Corn Maize ( / m e\u026a z / ; Zea mays ), also known as corn in North American English , is a tall stout grass that produces cereal grain . The leafy stalk of the plant gives rise to male inflorescences or tassels which produce pollen , and female inflorescences called ears . The ears yield grain, known as kernels or seeds. In modern commercial varieties, these are usually yellow or white; other varieties can be of many colors. Maize was domesticated by indigenous peoples in southern Mexico about 9,000 years ago from wild teosinte . Native Americans planted it alongside beans and squashes in the Three Sisters polyculture ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "midgut", "label": "midgut", "shape": "dot", "size": 10, "title": "search term: midgut Wikipedia URL: Midgut The midgut is the portion of the human embryo from which almost all of the small intestine and approximately half of the large intestine develop. After it bends around the superior mesenteric artery , it is called the \"midgut loop\". It comprises the portion of the alimentary canal from the end of the foregut at the opening of the bile duct to the hindgut , about two-thirds of the way through the transverse colon. In addition to representing an important distinction in embryologic development, the tissues derived from the midgut additionally have distinct vascular supply and innervation patterns in the adult gastrointestinal system."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "chemical immune barrier", "label": "chemical immune barrier", "shape": "dot", "size": 10, "title": "search term: chemical immune barrier Wikipedia URL: chemical immune barrier The page \" Chemical immune barrier \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "bacteriocins", "label": "bacteriocins", "shape": "dot", "size": 12, "title": "search term: bacteriocins Wikipedia URL: Bacteriocins Bacteriocins are proteinaceous or peptidic toxins produced by bacteria to inhibit the growth of similar or closely related bacterial strain(s). They are similar to yeast and paramecium killing factors, and are structurally, functionally, and ecologically diverse. Applications of bacteriocins are being tested to assess their application as narrow-spectrum antibiotics . The bacteriocin Putidacin L1 provides robust disease protection against Pseudomonas syringae when expressed in Nicotiana benthamiana (commonly known as Australian dwarf tobacco)."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "frugiperda", "label": "frugiperda", "shape": "dot", "size": 10, "title": "search term: frugiperda Wikipedia URL: frugiperda The page \" Frugiperda \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "bacterial translocation", "label": "bacterial translocation", "shape": "dot", "size": 10, "title": "search term: bacterial translocation Wikipedia URL: Bacterial translocation Intestinal permeability is a term describing the control of material passing from inside the gastrointestinal tract through the cells lining the gut wall , into the rest of the body. The intestine normally exhibits some permeability, which allows nutrients to pass through the gut, while also maintaining a barrier function to keep potentially harmful substances (such as antigens ) from leaving the intestine and migrating to the body more widely. In a healthy human intestine, small particles (\u003c 4 \u00c5 in radius) can migrate through tight junction claudin pore pathways, and particles up to 10\u201315 \u00c5 (3.5 kDa ) can transit through the paracellular space uptake route. There is some evidence abnormally increased intestinal permeability may play a role in some chronic diseases and inflammatory conditions. The most well understood condition with observed increased intestinal permeability is celiac disease . Scheme of select"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Cry1Ac", "label": "Cry1Ac", "shape": "dot", "size": 12, "title": "search term: Cry1Ac Wikipedia URL: Cry1Ac Cry1Ac protoxin is a crystal protein produced by the gram-positive bacterium , Bacillus thuringiensis (Bt) during sporulation . Cry1Ac is one of the delta endotoxins produced by this bacterium which act as insecticides . Because of this, the genes for these have been introduced into commercially important crops by genetic engineering (such as cotton and corn) in order to confer pest resistance on those plants."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Gut", "label": "Gut", "shape": "dot", "size": 10, "title": "search term: Gut Wikipedia URL: Gut Gut , GUT or guts may refer to:"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Microbiota Enzyme", "label": "Microbiota Enzyme", "shape": "dot", "size": 10, "title": "search term: Microbiota Enzyme Wikipedia URL: Microbiota Enzyme The page \" Microbiota Enzyme \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "host", "label": "host", "shape": "dot", "size": 10, "title": "search term: host Wikipedia URL: Host A host is a person responsible for guests at an event or for providing hospitality during it."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "enzymes", "label": "enzymes", "shape": "dot", "size": 14, "title": "search term: enzymes Wikipedia URL: Enzymes An enzyme is a biological macromolecule , usually a protein , that acts as a biological catalyst , accelerating chemical reactions without being consumed in the process. The molecules on which enzymes act are called substrates , which are converted into products . Nearly all metabolic processes within a cell depend on enzyme catalysis to occur at biologically relevant rates. A metabolic pathway is typically composed of a series of enzyme-catalyzed steps. The study of enzymes is known as enzymology , and a related field focuses on pseudoenzymes \u2014proteins that have lost catalytic activity but may retain regulatory or scaffolding functions, often indicated by alterations in their amino acid sequences or unusual \u0027pseudocatalytic\u0027 behavior. The enzyme glucosidase converts the sugar maltose into two glucose sugars. Active site residues in red, maltose substrate in black, and NAD cofactor in yellow. ( PDB : 1OBB \u200b)"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "cellulase", "label": "cellulase", "shape": "dot", "size": 14, "title": "search term: cellulase Wikipedia URL: Cellulase Cellulase ( EC 3.2.1.4 ; systematic name 4-\u03b2- D -glucan 4-glucanohydrolase ) is any of several enzymes produced chiefly by fungi , bacteria , and protozoans that catalyze cellulolysis , the decomposition of cellulose and of some related polysaccharides : Ribbon representation of the Streptomyces lividans \u03b2-1,4-endoglucanase catalytic domain - an example from the family 12 glycoside hydrolases"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "coleoptera", "label": "coleoptera", "shape": "dot", "size": 12, "title": "search term: coleoptera Wikipedia URL: Coleoptera See subgroups of the order Coleoptera"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "insect gut bacteria", "label": "insect gut bacteria", "shape": "dot", "size": 10, "title": "search term: insect gut bacteria Wikipedia URL: insect gut bacteria The page \" Insect gut bacteria \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Ceratitis capitata", "label": "Ceratitis capitata", "shape": "dot", "size": 10, "title": "search term: Ceratitis capitata Wikipedia URL: Ceratitis capitata Ceratitis capitata , commonly known as the Mediterranean fruit fly or medfly , is a yellow-and-brown fly native to sub-Saharan Africa . It has no near relatives in the Western Hemisphere and is considered to be one of the most destructive fruit pests in the world. There have been occasional medfly infestations in California , Florida , and Texas that require extensive eradication efforts to prevent the fly from establishing itself in the United States ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Bactrocera dorsalis", "label": "Bactrocera dorsalis", "shape": "dot", "size": 12, "title": "search term: Bactrocera dorsalis Wikipedia URL: Bactrocera dorsalis Bactrocera dorsalis , previously known as Dacus dorsalis and commonly referred to as the oriental fruit fly , is a species of tephritid fruit fly that is endemic to Southeast Asia . It is one of the major pest species in the genus Bactrocera with a broad host range of cultivated and wild fruits. Male B. dorsalis respond strongly to methyl eugenol , which is used to monitor and estimate populations, as well as to annihilate males as a form of pest control. They are also important pollinators and visitors of wild orchids, Bulbophyllum cheiri and Bulbophyllum vinaceum in Southeast Asia, which lure the flies using methyl eugenol."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "nitrogen recycling", "label": "nitrogen recycling", "shape": "dot", "size": 10, "title": "search term: nitrogen recycling Wikipedia URL: nitrogen recycling The page \" Nitrogen recycling \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "insect gut microbiota", "label": "insect gut microbiota", "shape": "dot", "size": 10, "title": "search term: insect gut microbiota Wikipedia URL: insect gut microbiota The page \" Insect gut microbiota \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "southern population", "label": "southern population", "shape": "dot", "size": 10, "title": "search term: southern population Wikipedia URL: southern population The page \" Southern population \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "insect fitness", "label": "insect fitness", "shape": "dot", "size": 10, "title": "search term: insect fitness Wikipedia URL: insect fitness The page \" Insect fitness \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Microbial Symbiosis", "label": "Microbial Symbiosis", "shape": "dot", "size": 10, "title": "search term: Microbial Symbiosis Wikipedia URL: Microbial Symbiosis The page \" Microbial Symbiosis \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "honeybee gut bacteria", "label": "honeybee gut bacteria", "shape": "dot", "size": 10, "title": "search term: honeybee gut bacteria Wikipedia URL: honeybee gut bacteria The page \" Honeybee gut bacteria \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Colorado potato beetle", "label": "Colorado potato beetle", "shape": "dot", "size": 10, "title": "search term: Colorado potato beetle Wikipedia URL: Colorado potato beetle The Colorado potato beetle ( Leptinotarsa decemlineata ; also known as the Colorado beetle , the ten-striped spearman , the ten-lined potato beetle , and the potato bug ) is a beetle known for being a major pest of potato crops. It is about 10 mm ( 3 \u2044 8 in) long, with a bright yellow/orange body and five bold brown stripes along the length of each of its wings . Native to the Rocky Mountains , it spread rapidly in potato crops across the United States and then Europe from 1859 onwards."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "gut microbes", "label": "gut microbes", "shape": "dot", "size": 14, "title": "search term: gut microbes Wikipedia URL: Gut Microbes Gut Microbes is a peer-reviewed , open access scientific journal covering research on all aspects of the microorganisms inhabiting the intestines , including their broader effects on the physiology of human and model organism hosts . The journal publishes basic , translational , and clinical research. It was established in 2010 and is published by Taylor \u0026 Francis . The journal became fully open access in 2020. Its editor-in-chief is Beth McCormick ( UMass Chan Medical School )."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Bacillus thuringiensis", "label": "Bacillus thuringiensis", "shape": "dot", "size": 14, "title": "search term: Bacillus thuringiensis Wikipedia URL: Bacillus thuringiensis Bacillus thuringiensis (or Bt ) is a gram-positive , soil-dwelling bacterium , and is the most commonly used biological pesticide worldwide. B. thuringiensis also occurs naturally in the gut of caterpillars of various types of moths and butterflies , as well as on leaf surfaces, aquatic environments, animal feces, insect-rich environments, flour mills and grain-storage facilities. It has also been observed to parasitize moths such as Cadra calidella \u2014in laboratory experiments working with C. calidella , many of the moths were diseased due to this parasite."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Larval Nutrition", "label": "Larval Nutrition", "shape": "dot", "size": 10, "title": "search term: Larval Nutrition Wikipedia URL: Larval Nutrition The page \" Larval Nutrition \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Bactrocera", "label": "Bactrocera", "shape": "dot", "size": 12, "title": "search term: Bactrocera Wikipedia URL: Bactrocera B. correcta B. dorsalis B. oleae B. tryoni B. zonata B. divenderi Hundreds more"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Biofilms", "label": "Biofilms", "shape": "dot", "size": 10, "title": "search term: Biofilms Wikipedia URL: Biofilms Aggregate of microorganisms in which cells that are frequently embedded within a self-produced matrix of extracellular polymeric substances (EPSs) adhere to each other and/or to a surface. Staphylococcus aureus biofilm on an indwelling catheter"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Curculionidae", "label": "Curculionidae", "shape": "dot", "size": 12, "title": "search term: Curculionidae Wikipedia URL: Curculionidae The Curculionidae are a family of weevils , commonly called snout beetles or true weevils . They are one of the largest animal families with 6,800 genera and 83,000 species described worldwide. They are the sister group to the family Brentidae ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Myzus persicae", "label": "Myzus persicae", "shape": "dot", "size": 10, "title": "search term: Myzus persicae Wikipedia URL: Myzus persicae Myzus persicae , known as the green peach aphid , greenfly , or the peach-potato aphid , is a small green aphid belonging to the order Hemiptera . It is the most significant aphid pest of peach trees, causing decreased growth, shrivelling of the leaves and the death of various tissues. It also acts as a vector for the transport of plant viruses such as cucumber mosaic virus (CMV), potato virus Y (PVY) and tobacco etch virus (TEV). Potato virus Y and potato leafroll virus can be passed to members of the nightshade/potato family ( Solanaceae ), and various mosaic viruses to many other food crops."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "MDPI", "label": "MDPI", "shape": "dot", "size": 10, "title": "search term: MDPI Wikipedia URL: MDPI MDPI ( Multidisciplinary Digital Publishing Institute ) is a publisher of open-access scientific journals . It publishes over 390 peer-reviewed, open-access journals. MDPI is among the largest publishers in the world in terms of journal article output, and was the largest publisher of open access articles in 2020."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "License", "label": "License", "shape": "dot", "size": 12, "title": "search term: License Wikipedia URL: License A license ( American English ) or licence ( Commonwealth English ) is an official permission or permit to do, use, or own something (as well as the document of that permission or permit). Governments issue driver\u0027s licenses to people who are allowed to drive motor vehicles on public roads ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "open access article", "label": "open access article", "shape": "dot", "size": 10, "title": "search term: open access article Wikipedia URL: Open access article Open access ( OA ) is a set of principles and a range of practices through which nominally copyrightable publications are delivered to readers free of access charges or other barriers. With open access strictly defined (according to the 2001 definition), or libre open access, barriers to copying or reuse are also reduced or removed by applying an open license for copyright, which regulates post-publication uses of the work. Open access logo, originally designed by Public Library of Science"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Crop Pathogens", "label": "Crop Pathogens", "shape": "dot", "size": 10, "title": "search term: Crop Pathogens Wikipedia URL: Crop Pathogens The page \" Crop Pathogens \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "ecosystems", "label": "ecosystems", "shape": "dot", "size": 10, "title": "search term: ecosystems Wikipedia URL: Ecosystems An ecosystem (or ecological system ) is a system formed by organisms in interaction with their environment . The biotic and abiotic components are linked together through nutrient cycles and energy flows. Rainforest ecosystems are rich in biodiversity . This is the Gambia River in Senegal \u0027s Niokolo-Koba National Park ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "binary antagonistic relationship", "label": "binary antagonistic relationship", "shape": "dot", "size": 10, "title": "search term: binary antagonistic relationship Wikipedia URL: binary antagonistic relationship The page \" Binary antagonistic relationship \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "plant defense responses", "label": "plant defense responses", "shape": "dot", "size": 10, "title": "search term: plant defense responses Wikipedia URL: plant defense responses The page \" Plant defense responses \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "insect nutrient absorption", "label": "insect nutrient absorption", "shape": "dot", "size": 10, "title": "search term: insect nutrient absorption Wikipedia URL: insect nutrient absorption The page \" Insect nutrient absorption \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "immune phenotypes", "label": "immune phenotypes", "shape": "dot", "size": 10, "title": "search term: immune phenotypes Wikipedia URL: immune phenotypes The page \" Immune phenotypes \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "immune system", "label": "immune system", "shape": "dot", "size": 12, "title": "search term: immune system Wikipedia URL: Immune system The immune system is a network of biological systems that protects an organism from diseases . It detects and responds to a wide variety of pathogens , such as viruses , bacteria , and parasites , as well as cancer cells and objects, such as wood splinters \u2014distinguishing them from the organism\u0027s own healthy tissue . Many species have two major subsystems of the immune system. The innate immune system provides a preconfigured response to broad groups of situations and stimuli. The adaptive immune system provides a tailored response to each stimulus by learning to recognize molecules it has previously encountered. Both use molecules and cells to perform their functions."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "external stress", "label": "external stress", "shape": "dot", "size": 10, "title": "search term: external stress Wikipedia URL: external stress The page \" External stress \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "dynamic plasticity", "label": "dynamic plasticity", "shape": "dot", "size": 10, "title": "search term: dynamic plasticity Wikipedia URL: dynamic plasticity The page \" Dynamic plasticity \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "herbivorous insect", "label": "herbivorous insect", "shape": "dot", "size": 10, "title": "search term: herbivorous insect Wikipedia URL: Herbivorous insect Insect ecology is the interaction of insects , individually or as a community, with the surrounding environment or ecosystem . This interaction is mostly mediated by the secretion and detection of chemicals ( semiochemical ) in the environment by insects. Semiochemicals are secreted by the organisms (including insects) in the environment and they are detected by other organism such as insects. Semiochemicals used by organisms, including (insects) to interact with other organism either of the same species or different species can generally grouped into four. These are pheromone , synomones, allomone and kairomone . Pheromones are semiochemicals that facilitates interaction between organisms of same species. Synomones benefit both the producer and receiver, allomone is advantageous to only the producer whiles kairomones is beneficial to the receiver. Insect interact with other species within their community and these inter"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "interaction", "label": "interaction", "shape": "dot", "size": 10, "title": "search term: interaction Wikipedia URL: Interaction Interaction is action that occurs between two or more entities, generally used in philosophy and the sciences. It may refer to:"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "ecological effect", "label": "ecological effect", "shape": "dot", "size": 10, "title": "search term: ecological effect Wikipedia URL: ecological effect The page \" Ecological effect \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "terrestrial ecosystems", "label": "terrestrial ecosystems", "shape": "dot", "size": 10, "title": "search term: terrestrial ecosystems Wikipedia URL: Terrestrial ecosystems Terrestrial ecosystems are ecosystems that are found on land. Examples include tundra , taiga , temperate deciduous forest , tropical rain forest , grassland , deserts ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "chemical defense mechanisms", "label": "chemical defense mechanisms", "shape": "dot", "size": 10, "title": "search term: chemical defense mechanisms Wikipedia URL: chemical defense mechanisms The page \" Chemical defense mechanisms \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "adaptive strategies", "label": "adaptive strategies", "shape": "dot", "size": 10, "title": "search term: adaptive strategies Wikipedia URL: Adaptive strategies The expression adaptive strategies is used by anthropologist Yehudi Cohen to describe a society\u0027s system of economic production . Cohen argued that the most important reason for similarities between two (or more) unrelated societies is their possession of a similar adaptive strategy. In other words, similar economic causes have similar sociocultural effects."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "morphology", "label": "morphology", "shape": "dot", "size": 10, "title": "search term: morphology Wikipedia URL: Morphology Morphology , from the Greek and meaning \"study of shape\", may refer to:"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "molecular ecology", "label": "molecular ecology", "shape": "dot", "size": 12, "title": "search term: molecular ecology Wikipedia URL: Molecular ecology Molecular ecology is a subdiscipline of ecology that is concerned with applying molecular genetic techniques to ecological questions (e.g., population structure, phylogeography, conservation, speciation, hybridization, biodiversity). It is virtually synonymous with the field of \" Ecological Genetics \" as pioneered by Theodosius Dobzhansky , E. B. Ford , Godfrey M. Hewitt , and others. Molecular ecology is related to the fields of population genetics and conservation genetics ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "metabolomics", "label": "metabolomics", "shape": "dot", "size": 10, "title": "search term: metabolomics Wikipedia URL: Metabolomics Metabolomics is the scientific study of chemical processes involving metabolites , the small molecule substrates, intermediates, and products of cell metabolism . Specifically, metabolomics is the \"systematic study of the unique chemical fingerprints that specific cellular processes leave behind\", the study of their small-molecule metabolite profiles. The metabolome represents the complete set of metabolites in a biological cell, tissue, organ, or organism, which are the end products of cellular processes. The central principle of biology showing the flow of information from DNA to the phenotype . Associated with each stage is the corresponding systems biology tool, from genomics to metabolomics."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "microbiome research", "label": "microbiome research", "shape": "dot", "size": 10, "title": "search term: microbiome research Wikipedia URL: microbiome research The page \" Microbiome research \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "integrated life complexes", "label": "integrated life complexes", "shape": "dot", "size": 10, "title": "search term: integrated life complexes Wikipedia URL: integrated life complexes The page \" Integrated life complexes \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "symbiotic microbial communities", "label": "symbiotic microbial communities", "shape": "dot", "size": 10, "title": "search term: symbiotic microbial communities Wikipedia URL: symbiotic microbial communities The page \" Symbiotic microbial communities \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "invisible size": 14, "title": "search term: excretion Wikipedia URL: Excretion Excretion is elimination of metabolic waste , which is an essential process in all organisms . In vertebrates , this is primarily carried out by the lungs , kidneys , and skin . This is in contrast with secretion , where the substance may have specific tasks after leaving the cell . For example, placental mammals expel urine from the bladder through the urethra , which is part of the excretory system . Unicellular organisms discharge waste products directly through the surface of the cell. Another example would be how mammals release solid waste (feces) through the anus during defecation. Mammals excrete urine through the urinary system ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "honeydew", "label": "honeydew", "shape": "dot", "size": 10, "title": "search term: honeydew Wikipedia URL: Honeydew Honeydew may refer to:"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "plant signaling molecules", "label": "plant signaling molecules", "shape": "dot", "size": 10, "title": "search term: plant signaling molecules Wikipedia URL: plant signaling molecules The page \" Plant signaling molecules \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "lic acid", "label": "lic acid", "shape": "dot", "size": 10, "title": "search term: lic acid Wikipedia URL: lic acid The page \" Lic acid \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "calcium", "label": "calcium", "shape": "dot", "size": 10, "title": "search term: calcium Wikipedia URL: Calcium Calcium is a chemical element ; it has symbol Ca and atomic number 20. As an alkaline earth metal , calcium is a reactive metal that forms a dark oxide-nitride layer when exposed to air. Its physical and chemical properties are most similar to its heavier homologues strontium and barium . It is the fifth most abundant element in Earth\u0027s crust, and the third most abundant metal, after iron and aluminium . The most common calcium compound on Earth is calcium carbonate , found in limestone and the fossils of early sea life; gypsum , anhydrite , fluorite , and apatite are also sources of calcium. The name comes from Latin calx \" lime \", which was obtained from heating limestone."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "ions", "label": "ions", "shape": "dot", "size": 10, "title": "search term: ions Wikipedia URL: Ions An ion ( / \u02c8 a\u026a . \u0252 n , - \u0259n / ) is an atom or molecule with a net electrical charge . The charge of an electron is considered to be negative by convention and this charge is equal and opposite to the charge of a proton , which is considered to be positive by convention. The net charge of an ion is not zero because its total number of electrons is unequal to its total number of protons. Electron transfer from a neutral lithium (Li) atom on the left to a neutral fluorine (F) atom on the right would give Li + and F \u2212 ions."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "plant defense network", "label": "plant defense network", "shape": "dot", "size": 10, "title": "search term: plant defense network Wikipedia URL: plant defense network The page \" Plant defense network \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "insect activities", "label": "insect activities", "shape": "dot", "size": 10, "title": "search term: inse common in susceptible rice cultivars attacked by the insect."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "ractive volatiles", "label": "ractive volatiles", "shape": "dot", "size": 10, "title": "search term: ractive volatiles Wikipedia URL: ractive volatiles The page \" Ractive volatiles \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "predation efficiency", "label": "predation efficiency", "shape": "dot", "size": 10, "title": "search term: predation efficiency Wikipedia URL: predation efficiency The page \" Predation efficiency \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "parasitoid", "label": "parasitoid", "shape": "dot", "size": 12, "title": "search term: parasitoid Wikipedia URL: Parasitoid In evolutionary ecology , a parasitoid is an organism that lives in close association with its host at the host\u0027s expense, eventually resulting in the death of the host. Parasitoidism is one of six major evolutionary strategies within parasitism , distinguished by the fatal prognosis for the host, which makes the strategy close to predation . A parasitoid wasp ( Trioxys complanatus , Aphidiinae ) ovipositing into the body of a spotted alfalfa aphid ( Therioaphis maculata , Calaphidinae ), a behaviour that is used in biological pest control"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "wasps", "label": "wasps", "shape": "dot", "size": 14, "title": "search term: wasps Wikipedia URL: Wasps A wasp is any insect of the narrow-waisted suborder Apocrita of the order Hymenoptera which is neither a bee nor an ant ; this excludes the broad-waisted sawflies (Symphyta), which look somewhat like wasps, but are in a separate suborder. The wasps do not constitute a clade , a complete natural group with a single ancestor, as bees and ants are deeply nested within the wasps, having evolved from wasp ancestors. Wasps that are members of the clade Aculeata can sting their prey."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "spiders", "label": "spiders", "shape": "dot", "size": 14, "title": "search term: spiders Wikipedia URL: Spiders Spiders ( order Araneae ) are air-breathing arthropods that have eight limbs, chelicerae with fangs generally able to inject venom , and spinnerets that extrude silk . They are the largest order of arachnids and rank seventh in total species diversity among all orders of organisms . Spiders are found worldwide on every continent except Antarctica , and have become established in nearly every land habitat . As of January 2026 [update] , 53,680 spider species in 139 families have been recorded by taxonomists . However, there has been debate among scientists about how families should be classified, with over 20 different classifications proposed since 1900."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "regulatory signal", "label": "regulatory signal", "shape": "dot", "size": 10, "title": "search term: regulatory signal Wikipedia URL: regulatory signal The page \" Regulatory signal \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "ethyl palmitate", "label": "ethyl palmitate", "shape": "dot", "size": 10, "title": "search term: ethyl palmitate Wikipedia URL: Ethyl palmitate Ethyl palmitate is an organic compound with the chemical formula C 18 H 36 O 2 . It is a colorless solid with a wax-like odor. Chemically, ethyl palmitate is the ethyl ester tone fruit produced by the tropical tree Mangifera indica . It originated in the northeastern part of the Indian subcontinent , in what is now Bangladesh, northeastern India and Myanmar. M. indica has been cultivated in South and Southeast Asia since ancient times, resulting in two modern mango cultivar lineages: the \"Indian\" and the \"Southeast Asian\" types. Other species in the genus Mangifera also produce edible fruits called \"mangoes,\" most of which are found in the Malesian ecoregion. Mango fruits \u2013 single and halved"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "rostratum", "label": "rostratum", "shape": "dot", "size": 10, "title": "search term: rostratum Wikipedia URL: Rostratum Rostratus (masculine), rostrata (feminine) or rostratum (neuter) is a Latin adjective meaning \"beaked, curved, hooked, with a crooked point, or with a curved front\". Reproduction of the Columna rostrata of Gaius Duilius ( ca. 260 BC) at the Museum of Roman Civilization"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "resin acids", "label": "resin acids", "shape": "dot", "size": 10, "title": "search term: resin acids Wikipedia URL: Resin acids Resin acid refers to any of several related carboxylic acids found in tree resins . Nearly all resin acids have the same basic skeleton: three fused rings having the empirical formula C 19 H 29 COOH. Resin acids occur in nature as tacky, yellowish gums consisting of several compounds. They are water-insoluble. A common resin acid is abietic acid . Resin acids are used to produce soaps for diverse applications, but their use is being displaced increasingly by synthetic acids such as 2-ethylhexanoic acid or petroleum-derived naphthenic acids . The di terpenoid abietic acid , a common resin acid."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "phytochemicals", "label": "phytochemicals", "shape": "dot", "size": 10, "title": "search term: phytochemicals Wikipedia URL: Phytochemicals Phytochemicals are
