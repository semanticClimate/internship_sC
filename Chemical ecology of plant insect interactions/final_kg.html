or minerals onto the tongue for ingestion , or to communicate with other animals . Many animals both groom themselves , eat or drink by licking. Lick granuloma on a dog\u0027s paw"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "internal metabolism", "label": "internal metabolism", "shape": "dot", "size": 10, "title": "search term: internal metabolism Wikipedia URL: internal metabolism The page \" Internal metabolism \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "ae", "label": "ae", "shape": "dot", "size": 10, "title": "search term: ae Wikipedia URL: Ae AE , Ae , ae , aE , \u00c6 or \u00e6 may refer to:"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "alcohol", "label": "alcohol", "shape": "dot", "size": 10, "title": "search term: alcohol Wikipedia URL: Alcohol Alcohol may refer to:"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Ethical Approval", "label": "Ethical Approval", "shape": "dot", "size": 10, "title": "search term: Ethical Approval Wikipedia URL: Ethical approval Research is creative and systematic work undertaken to increase the stock of knowledge . It involves the collection, organization, and analysis of evidence to increase understanding of a topic, characterized by a particular attentiveness to controlling sources of bias and error . These activities are characterized by accounting and controlling for biases. A research project may be an expansion of past work in the field. To test the validity of instruments, procedures, or experiments, research may replicate elements of prior projects or the project as a whole."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "animal experimentation", "label": "animal experimentation", "shape": "dot", "size": 10, "title": "search term: animal experimentation Wikipedia URL: Animal experimentation Animal testing , also known as animal experimentation , animal research , and in vivo testing , is the use of non-human animals , as model organisms , in experiments that seek answers to scientific and medical questions. This approach can be contrasted with field studies in which animals are observed in their natural environments or habitats. Experimental research with animals is usually conducted in universities, medical schools, pharmaceutical companies, defense establishments, and commercial facilities that provide animal-testing services to the industry. The focus of animal testing varies on a continuum from pure research , focusing on developing fundamental knowledge of an organism, to applied research, which may focus on answering some questions of great practical importance, such as finding a cure for a disease. Examples of applied research include testing disease treatments, breeding, defense research, an"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "ethical standards", "label": "ethical standards", "shape": "dot", "size": 10, "title": "search term: ethical standards Wikipedia URL: Ethical standards Ethics is the philosophical study of moral phenomena. Also called moral philosophy , it investigates normative questions about what people ought to do or which behavior is morally right. Its main branches include normative ethics , applied ethics , and metaethics . According to Aristotle , how to lead a good life is one of the central questions of ethics."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Competing Interests", "label": "Competing Interests", "shape": "dot", "size": 10, "title": "search term: Competing Interests Wikipedia URL: Competing interests A conflict of interest ( COI ) is a situation in which a person or organization is involved in multiple interests , financial or otherwise, and serving one interest could involve working against another. Typically, this relates to situations in which the personal interest of an individual or organization might adversely affect a duty owed to make decisions for the benefit of a third party. Conflict of interest in legislation; the interests of the poor and the interests of the rich. A personification of corrupt legislation weighs a bag of money and denies an appeal of poverty."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Creative Commons", "label": "Creative Commons", "shape": "dot", "size": 12, "title": "search term: Creative Commons Wikipedia URL: Creative Commons Creative Commons ( CC ) is an American non-profit organization and international network devoted to educational access and expanding the range of creative works available for others to build upon legally and to share. The organization has released several copyright licenses , known as Creative Commons licenses , free of charge to the public, to allow authors of creative works to communicate which rights they reserve and which rights they waive for the benefit of recipients or other creators. Content owners still maintain their copyright, but Creative Commons licenses give standard releases that replace the individual negotiations for specific rights between copyright owner (licensor) and licensee , that are necessary under an \" all rights reserved \" copyright management."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "gous acquisition", "label": "gous acquisition", "shape": "dot", "size": 10, "title": "search term: gous acquisition Wikipedia URL: gous acquisition The page \" Gous acquisition \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "mating behavior", "label": "mating behavior", "shape": "dot", "size": 10, "title": "search term: mating behavior Wikipedia URL: Mating behavior Mating rituals may refer to:"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Cockroaches", "label": "Cockroaches", "shape": "dot", "size": 10, "title": "search term: Cockroaches Wikipedia URL: Cockroaches Anaplectidae Blaberidae Blattidae Corydiidae Cryptocercidae Ectobiidae Lamproblattidae Nocticolidae Tryonicidae"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "individuality", "label": "individuality", "shape": "dot", "size": 10, "title": "search term: individuality Wikipedia URL: Individuality An individual is one that exists as a distinct entity . Individuality (or self-hood ) is the state or quality of living as an individual; particularly (in the case of humans) as a person unique from other people and possessing one\u0027s own needs or goals , rights and responsibilities . The concept of an individual features in many fields, including biology , law , and philosophy . Every individual contributes significantly to the growth of a civilization. Society is a multifaceted concept that is shaped and influenced by a wide range of different things, including human behaviors, attitudes, and ideas. The culture, morals, and beliefs of others as well as the general direction and trajectory of the society can all be influenced and shaped by an individual\u0027s activities. Individuals may stand out from the crowd , or may blend in with it."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "learning", "label": "learning", "shape": "dot", "size": 10, "title": "search term: learning Wikipedia URL: Learning Learning is the process of acquiring new understanding , knowledge , behaviors , skills , values , attitudes , and preferences . The ability to learn is possessed by humans , non-human animals , and some machines ; there is also evidence for some kind of learning in certain plants . Some learning is immediate, induced by a single event (e.g. being burned by a hot stove ), but much skill and knowledge accumulate from repeated experiences. The changes induced by learning often last a lifetime, and it is hard to distinguish learned material that seems to be \"lost\" from that which cannot be retrieved. American students learning how to make and roll sushi"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "memory", "label": "memory", "shape": "dot", "size": 10, "title": "search term: memory Wikipedia URL: Memory Memory is the faculty of the mind by which data or information is encoded , stored, and retrieved when needed. It is the retention of information over time for the purpose of influencing future action . If past events could not be remembered, it would be impossible for language, relationships, or personal identity to develop. Memory loss is usually described as forgetfulness or amnesia . Overview of the forms and functions of memory"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "natural oxidation", "label": "natural oxidation", "shape": "dot", "size": 10, "title": "search term: natural oxidation Wikipedia URL: natural oxidation The page \" Natural oxidation \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "volatile semiochemicals", "label": "volatile semiochemicals", "shape": "dot", "size": 10, "title": "search term: volatile semiochemicals Wikipedia URL: volatile semiochemicals The page \" Volatile semiochemicals \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "selection", "label": "selection", "shape": "dot", "size": 10, "title": "search term: selection Wikipedia URL: Selection Selection may refer to:"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Med Vet", "label": h the general formula (C 5 H 8 ) n , where n \u2265 2. They serve as crucial biosynthetic building blocks in many organisms, particularly plants. Comprising more than 30,000 compounds, these unsaturated hydrocarbons are produced predominantly by plants , particularly conifers . In plants, terpenes and terpenoids are important mediators of ecological interactions , while some insects use some terpenes as a form of defense. Other functions of terpenoids include cell growth modulation and plant elongation, light harvesting and photoprotection, and membrane permeability and fluidity control. Many terpenes are derived commercially from conifer resins, such as those made by this pine ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "terpenoids", "label": "terpenoids", "shape": "dot", "size": 12, "title": "search term: terpenoids Wikipedia URL: Terpenoids The terpenoids , also known as isoprenoids , are a class of naturally occurring organic chemicals derived from the 5-carbon compound isoprene and its derivatives called terpenes , diterpenes , etc. While sometimes used interchangeably with \"terpenes\", terpenoids contain additional functional groups , usually containing oxygen. When combined with the hydrocarbon terpenes, terpenoids comprise about 80,000 compounds. They are the largest class of plant secondary metabolites , representing about 60% of known natural products . Many terpenoids have substantial pharmacological bioactivity and are therefore of interest to medicinal chemists."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "plant volatile blends", "label": "plant volatile blends", "shape": "dot", "size": 10, "title": "search term: plant volatile blends Wikipedia URL: plant volatile blends The page \" Plant volatile blends \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF99 ne of the most numerous bumblebee species in Europe . It is one of the main species used in greenhouse pollination , and so can be found in many countries and areas where it is not native, such as Tasmania . Moreover, it is a eusocial insect with an overlap of generations, a division of labour, and cooperative brood care. The queen is monogamous which means she mates with only one male. B. terrestris workers learn flower colours and forage efficiently."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "insect attractans", "label": "insect attractans", "shape": "dot", "size": 10, "title": "search term: insect attractans Wikipedia URL: insect attractans The page \" Insect attractans \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "chemistry", "label": "chemistry", "shape": "dot", "size": 14, "title": "search term: chemistry Wikipedia URL: Chemistry Chemistry is the scientific study of the properties and behavior of matter . It is a physical science within the natural sciences that studies the chemical elements that make up matter and compounds made of atoms , molecules and ions : their composition, structure, properties, behavior and the changes they undergo during reactions with other substances . Chemistry also addresses the nature of chemical bonds in chemical compounds ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "individualized niches", "label": "individualized niches", "shape": "dot", "size": 10, "title": "search term: individualized niches Wikipedia URL: individualized niches The page \" Individualized niches \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", l-known or economically important members of this order include aromatic, culinary, and medicinal herbs such as basil , mint , rosemary , sage , savory , marjoram , oregano , hyssop , thyme , lavender , perilla , lemon verbena , catnip , bee balm , wild dagga , and oriental motherwort , as well as olives , ash trees , teak , foxgloves , lilacs , jasmine , snapdragons , African violets , Jacarandas , Paulownias , butterfly bushes , sesame , and psyllium ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "sawfly genus", "label": "sawfly genus", "shape": "dot", "size": 10, "title": "search term: sawfly genus Wikipedia URL: sawfly genus The page \" Sawfly genus \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Athalia", "label": "Athalia", "shape": "dot", "size": 10, "title": "search term: Athalia Wikipedia URL: Athalia Athaliah ( Hebrew : \u05e2\u05b2\u05ea\u05b7\u05dc\u05b0\u05d9\u05b8\u05d4 , Modern : \u02bbAtalya , Tiberian : \u02bf\u0102\u1e6faly\u0101, Greek : \u0393\u03bf\u03b8\u03bf\u03bb\u03af\u03b1 Gothol\u00eda ; Latin : Athalia ) was the daughter of King Ahab and Queen Jezebel of Israel ; she was queen consort of Judah as the wife of King Jehoram , a descendant of King David , and was later queen regnant c. 841\u2013835 BC."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Phenotypic plasticity", "label": "Phenotypic plasticity", "shape": "dot", "size": 12, "title": "search term: Phenotypic plasticity Wikipedia URL: Phenotypic plasticity Phenotypic plasticity refers to some of the changes in an organism \u0027s behavior, morphology and physiology in response to a unique environment. Fundamental to the way in which organisms cope with environmental variation, phenotypic plasticity encompasses all types of environmentally induced changes (e.g. morphological , physiological , behavioural , phenological ) that may or may not be permanent throughout an individual\u0027s lifespan. Phenotypic plasticity is the ability of one genotype to produce more than one phenotype when exposed to different environments. Each line here represents a genotype. Horizontal lines show that the phenotype is the same in different environments; slanted lines show that there are different phenotypes in different environments, and thus indicate plasticity."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "olfaction", "label": "olfaction", "shape": "dot", "size": 12, "title": "search term: olfaction Wikipedia URL: Olfaction The sense of smell , or olfaction , is the special sense through which smells (or odors ) are perceived. The sense of smell has many functions, including detecting desirable foods, hazards, and pheromones , and plays a role in taste."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "cuticular compounds", "label": "cuticular compounds", "shape": "dot", "size": 10, "title": "search term: cuticular compounds Wikipedia URL: cuticular compounds The page \" Cuticular compounds \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "antennal detection", "label": "antennal detection", "shape": "dot", "size": 10, "title": "search term: antennal detection Wikipedia URL: antennal detection The page \" Antennal detection \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "genetic variance", "label": "genetic variance", "shape": "dot", "size": 10, "title": "search term: genetic variance Wikipedia URL: Genetic variance Genetic variance is a concept outlined by the English biologist and statistician Ronald Fisher in his fundamental theorem of natural selection . In his 1930 book The Genetical Theory of Natural Selection , Fisher postulates that the rate of change of biological fitness can be calculated by the genetic variance of the fitness itself. Fisher tried to give a statistical formula about how the change of fitness in a population can be attributed to changes in the allele frequency . Fisher made no restrictive assumptions in his formula concerning fitness parameters, mate choices or the number of alleles and loci involved. Ronald Fisher in 1913"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "codling moth larvae", "label": "codling moth larvae", "shape": "dot", "size": 10, "title": "search term: codling moth larvae Wikipedia URL: codling moth larvae The page \" Codling moth larvae \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "statistical computing", "label": "statistical computing", "shape": "dot", "size": 10, "title": "search term: statistical computing Wikipedia URL: Statistical computing Computational statistics , or statistical computing , is the study which is the intersection of statistics and computer science , and refers to the statistical methods that are enabled by using computational methods. It is the area of computational science (or scientific computing) specific to the mathematical science of statistics . This area is fast developing. The view that the broader concept of computing must be taught as part of general statistical education is gaining momentum. Students working in the Statistics Machine Room of the London School of Economics in 1964"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "parasitoid wasps", "label": "parasitoid wasps", "shape": "dot", "size": 18, "title": "search term: parasitoid wasps Wikipedia URL: Parasitoid wasps Parasitoid wasps are a large group of hymenopteran superfamilies , with all but the wood wasps ( Orussoidea ) being in the wasp-waisted Apocrita . As parasitoids , they lay their eggs on or in the bodies of other arthropods , sooner or later causing the death of these hosts . Different species specialise in hosts from different insect orders, most often Lepidoptera , though some select beetles , flies , or bugs ; the spider wasps ( Pompilidae ) exclusively attack spiders . Megarhyssa macrurus ( Ichneumonidae ), a parasitoid , ovipositing into its host through the wood of a tree. The body of a female is c. 2 inches (50 mm) long, with an ovipositor c. 4 inches (100 mm) long."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Insect allelochemicals", "label": "Insect allelochemicals", "shape": "dot", "size": 10, "title": "search term: Insect allelochemicals Wikipedia URL: Insect allelochemicals The page \" Insect allelochemicals \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "insect cuticular hydrocarbons", "label": "insect cuticular hydrocarbons", "shape": "dot", "size": 10, "title": "search term: insect cuticular hydrocarbons Wikipedia URL: insect cuticular hydrocarbons The page \" Insect cuticular hydrocarbons \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "adaptation", "label": "adaptation", "shape": "dot", "size": 16, "title": "search term: adaptation Wikipedia URL: Adaptation Collective intelligence Collective action Self-organized criticality Herd mentality Phase transition Agent-based modelling Synchronization Ant colony optimization Particle swarm optimization Swarm behaviour The second of Jean-Baptiste Lamarck \u0027s two factors (the first being a complexifying force) was an adaptive force that causes animals with a given body plan to adapt to circumstances by inheritance of acquired characteristics , creating a diversity of species and genera ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "structural elucidation", "label": "structural elucidation", "shape": "dot", "size": 10, "title": "search term: structural elucidation Wikipedia URL: Structural elucidation A chemical structure of a molecule is a spatial arrangement of its atoms and their chemical bonds. Its determination includes a chemist \u0027s specifying the molecular geometry and, when feasible and necessary, the electronic structure of the target molecule or other solid. Molecular geometry refers to the spatial arrangement of atoms in a molecule and the chemical bonds that hold the atoms together and can be represented using structural formulae and by molecular models ; complete electronic structure descriptions include specifying the occupation of a molecule\u0027s molecular orbitals . Structure determination can be applied to a range of targets from very simple molecules (e.g., diatomic oxygen or nitrogen ) to very complex ones (e.g., such as protein or DNA ). Phosphorus pentoxide chemical structure in 2D"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "biological activity", "label": "biological activity", "shape": "dot", "size": 10, "title": "search term: biological activity Wikipedia URL: Biological activity In pharmacology , biological activity or pharmacological activity describes the beneficial or adverse effects of a drug on living matter . When a drug is a complex chemical mixture, this activity is exerted by the substance\u0027s active ingredient or pharmacophore but can be modified by the other constituents. Among the various properties of chemical compounds, pharmacological/biological activity plays a crucial role since it suggests uses of the compounds in the medical applications. However, chemical compounds may show some adverse and toxic effects which may prevent their use in medical practice."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "gland", "label": "gland", "shape": "dot", "size": 10, "title": "search term: gland Wikipedia URL: Gland A gland is a cell or an organ in an animal\u0027s body that produces and secretes different substances that the organism needs, either into the bloodstream or into a body cavity or outer surface. A gland may also function to remove unwanted substances such as urine from the body."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "butterfly", "label": "butterfly", "shape": "dot", "size": 14, "title": "search term: butterfly Wikipedia URL: Butterfly Butterflies are winged insects from the lepidopteran superfamily Papilionoidea , characterised by large, often brightly coloured wings that often fold together when at rest, and a conspicuous, fluttering flight. The oldest butterfly fossils have been dated to the Paleocene , about 56 million years ago, though molecular evidence suggests that they likely originated in the Cretaceous ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Heliconius Erato", "label": "Heliconius Erato", "shape": "dot", "size": 12, "title": "search term: Heliconius Erato Wikipedia URL: Heliconius erato Heliconius erato , or the red postman , is one of about 40 neotropical species of butterfly belonging to the genus Heliconius . It is also commonly known as the small postman , the red passion flower butterfly , or the crimson-patched longwing . It was described by Carl Linnaeus in his 1758 10th edition of Systema Naturae ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "mimicry", "label": "mimicry", "shape": "dot", "size": 10, "title": "search term: mimicry Wikipedia URL: Mimicry In evolutionary biology , mimicry is the evolved resemblance of an organism to something else, often another organism of a different species. Mimicry may evolve between different species, or between individuals of the same species. In the simplest case, as in Batesian mimicry , a mimic resembles a model, so as to deceive a dupe, all three being of different species. A Batesian mimic, such as a hoverfly , is harmless, while its model, such as a wasp , is harmful, and is avoided by the dupe, such as an insect-eating bird. Birds hunt by sight, so the mimicry in that case is visual, but in other cases mimicry may make use of any of the senses. Most types of mimicry, including Batesian, are deceptive, as the mimics are not harmful, but M\u00fcllerian mimicry , where different harmful species resemble each other, is honest , as when species of wasps and of bees all have genuinely aposematic warning coloration. More complex types may be bipolar, involvin"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Essential oil composition", "label": "Essential oil composition", "shape": "dot", "size": 10, "title": "search term: Essential oil composition Wikipedia URL: Essential oil composition The page \" Essential oil composition \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "total metabolite content", "label": "total metabolite content", "shape": "dot", "size": 10, "title": "search term: total metabolite content Wikipedia URL: total metabolite content The page \" Total metabolite content \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"col s that receive olfactory information from the antennal lobe via projection neurons. They were first identified and described by French biologist F\u00e9lix Dujardin in 1850. Mushroom bodies visible in a Drosophila brain as two stalks. From Jenett et al., 2006"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Kenyon cell types", "label": "Kenyon cell types", "shape": "dot", "size": 10, "title": "search term: Kenyon cell types Wikipedia URL: Kenyon cell types The page \" Kenyon cell types \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "inhibitory sex pheromone tastes", "label": "inhibitory sex pheromone tastes", "shape": "dot", "size": 10, "title": "search term: inhibitory sex pheromone tastes Wikipedia URL: inhibitory sex pheromone tastes The page \" Inhibitory sex pheromone tastes \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "D", "label": "D", "shape": "dot", "size": 10, "title": "search term: D Wikipedia URL: D D , or d , is the fourth letter of the Latin alphabet , used in the modern English alphabet , the alphabets of other western European languages and others worldwide. Its name in English is dee (pronounced / \u02c8 d i\u02d0 / \u24d8 ), plural dees ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "oph", "label": "oph", "shape": "dot", "size": 10, "title": "search term: oph Wikipedia URL: Oph Ophiuchus ( / \u02cc \u0252 f i \u02c8 ju\u02d0 k \u0259 s / ) is a large constellation straddling the celestial equator . Its name comes from the Ancient Greek \u1f40\u03c6\u03b9\u03bf\u1fe6\u03c7\u03bf\u03c2 ( ophio\u00fbkhos ), meaning \"serpent-bearer\", and it is commonly represented as a man grasping a snake. The serpent is represented by the constellation Serpens . Ophiuchus was one of the 48 constellations listed by the 2nd-century astronomer Ptolemy , and it remains one of the 88 modern constellations . An old alternative name for the constellation was Serpentarius ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "male cuticular hydrocarbons", "label": "male cuticular hydrocarbons", "shape": "dot", "size": 10, "title": "search term: male cuticular hydrocarbons Wikipedia URL: male cuticular hydrocarbons The page \" Male cuticular hydrocarbons \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Insect chemical ecology", "label": "Insect chemical ecology", "shape": "dot", "size": 10, "title": "search term: Insect chemical ecology Wikipedia URL: Insect chemical ecology The page \" Insect chemical ecology \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "agriculture", "label": "agriculture", "shape": "dot", "size": 12, "title": "search term: agriculture Wikipedia URL: Agriculture Agriculture is the practice of cultivating the soil, planting, raising, and harvesting both food and non-food crops, as well as livestock production. Broader definitions also include forestry and aquaculture . Agriculture was a key factor in the rise of sedentary human civilization , whereby farming of domesticated plants and animals created food surpluses that enabled people to live in the cities. While humans started gathering grains at least 105,000 years ago, nascent farmers only began planting them around 11,500 years ago. Sheep, goats, pigs, and cattle were domesticated around 10,000 years ago. Plants were independently cultivated in at least 11 regions of the world. In the 20th century, industrial agriculture based on large-scale monocultures came to dominate agricultural output. Modern agriculture: a center pivot irrigation system on a field"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "species recognition", "label": "species recognition", "shape": "dot", "size": 12, "title": "search term: species recognition Wikipedia URL: Species recognition Intra-species recognition is the recognition by a member of an animal species of a conspecific (another member of the same species). In many species, such recognition is necessary for procreation."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "field crickets", "label": "field crickets", "shape": "dot", "size": 10, "title": "search term: field crickets Wikipedia URL: field crickets The page \" Field crickets \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "retention index", "label": "retention index", "shape": "dot", "size": 10, "title": "search term: retention index Wikipedia URL: retention index The page \" Retention index \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "colony recognition", "label": "colony recognition", "shape": "dot", "size": 10, "title": "search term: colony recognition Wikipedia URL: colony recognition The page \" Colony recognition \" does not exist. You can create a draft and submit it for review or request that a redirect be created , {"color": "#FFFFFF"}, "id": "Ajuga forrestii", "label": "Ajuga forrestii", "shape": "dot", "size": 10, "title": "search term: Ajuga forrestii Wikipedia URL: Ajuga forrestii The page \" Ajuga forrestii \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Elegant graphics", "label": "Elegant graphics", "shape": "dot", "size": 10, "title": "search term: Elegant graphics Wikipedia URL: Elegant graphics The page \" Elegant graphics \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "data analysis", "label": "data analysis", "shape": "dot", "size": 10, "title": "search term: data analysis Wikipedia URL: Data analysis Data analysis is the process of inspecting, cleansing , transforming , and modeling data with the goal of discovering useful information, informing conclusions, and supporting decision-making . Data analysis has multiple facets and approaches, encompassing diverse techniques under a variety of names, and is used in different business, science, and social science domains. In today\u0027s business world, data analysis plays a role in making decisions more scientific and helping businesses operate more effectively. Data science process flowchart from Doing Data Science , by Schutt \u0026 O\u0027Neil (2013)"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Plant secondary metabolites", "label": "Plant secondary metabolites", "shape": "dot", "size": 10, "title": "search term: Plant secondary metabolites Wikipedia URL: Plant secondary metabolites The page \" Plant secondary metabolites \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "addiction", "label": "addiction", "shape": "dot", "size": 12, "title": "search term: addiction Wikipedia URL: Addiction Addiction is a neuropsychological disorder characterized by a persistent and intense urge to use a drug or engage in a behavior that produces an immediate psychological reward, despite substantial harm and other negative consequences. Repetitive drug use can alter brain function in synapses similar to natural rewards like food or falling in love in ways that perpetuate craving and weakens self-control for people with pre-existing vulnerabilities. This phenomenon \u2013 drugs reshaping brain function \u2013 has led to an understanding of addiction as a brain disorder with a complex variety of psychosocial as well as neurobiological factors that are implicated in the development of addiction. While mice given cocaine showed the compulsive and involuntary nature of addiction, for humans this is more complex, related to behavior or personality traits. Acute confusional state caused by alcohol withdrawal , otherwise known as delirium tremens"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "ecological communities", "label": "ecological communities", "shape": "dot", "size": 12, "title": "search term: ecological communities Wikipedia URL: Ecological communities In ecology, a community is a group or association of populations of two or more different species occupying the same geographical area at the same time, also known as a biocoenosis , biotic community , biological community , ecological community , or life assemblage . The term community has a variety of uses. In its simplest form it refers to groups of organisms in a specific place or time, for example, \"the fish community of Lake Ontario before industrialization\". A bear with a salmon. Interspecific interactions such as predation are a key aspect of community ecology."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "information theory", "label": "information theory", "shape": "dot", "size": 12, "title": "search term: information theory Wikipedia URL: Information theory Information theory is the mathematical study of the quantification , storage , and communication of a particular type of mathematically defined information . The field was established and formalized by Claude Shannon in the 1940s, though early contributions were made in the 1920s through the works of Harry Nyquist and Ralph Hartley . It is at the intersection of electronic engineering , mathematics , statistics , computer science , neurobiology , physics , and electrical engineering . The entropy of a Bernoulli trial as a function of success probability, often called the binary entropy function , H b ( p ) . The entropy is maximized at 1 bit per trial when the two possible outcomes are equally probable, as in an unbiased coin toss."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Springer Nature", "label": "Springer Nature", "shape": "dot", "size": 10, "title": "search term: Springer Nature Wikipedia URL: Springer Nature Springer Nature or the Springer Nature Group is an academic publishing company created by the May 2015 merger of Springer Science+Business Media and Holtzbrinck Publishing Group \u0027s Nature Publishing Group , Palgrave Macmillan , and Macmillan Education ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "published maps", "label": "published maps", "shape": "dot", "size": 10, "title": "search term: published maps Wikipedia URL: published maps The page \" Published maps \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "instituti
