d": "oxidative stress", "label": "oxidative stress", "shape": "dot", "size": 14, "title": "search term: oxidative stress Wikipedia URL: Oxidative stress Oxidative stress reflects an imbalance between the systemic manifestation of reactive oxygen species and a biological system\u0027s ability to readily detoxify the reactive intermediates or to repair the resulting damage. Disturbances in the normal redox state of cells can cause toxic effects through the production of peroxides and free radicals that damage all components of the cell, including proteins , lipids , and DNA . Oxidative stress from oxidative metabolism causes base damage, as well as strand breaks in DNA . Base damage is mostly indirect and caused by the reactive oxygen species generated, e.g., O \u2212 2 ( superoxide radical), OH ( hydroxyl radical) and H 2 O 2 ( hydrogen peroxide ). Further, some reactive oxidative species act as cellular messengers in redox signaling. Thus, oxidative stress can cause disruptions in normal mechanisms of cellular signaling . [ citation needed ] Oxidative stress mechanisms in tissue injur"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Bacillus pumilu", "label": "Bacillus pumilu", "shape": "dot", "size": 10, "title": "search term: Bacillus pumilu Wikipedia URL: Bacillus pumilu The page \" Bacillus pumilu \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Acrobasis nuxvorella", "label": "Acrobasis nuxvorella", "shape": "dot", "size": 10, "title": "search term: Acrobasis nuxvorella Wikipedia URL: Acrobasis nuxvorella Acrobasis nuxvorella , the pecan nut casebearer , is a moth of the family Pyralidae described by Herbert H. Neunzig in 1970. It is found in the United States in eastern New Mexico , Texas , Oklahoma , Louisiana , Missouri , southern Illinois , Mississippi , Alabama , Florida , Georgia , South Carolina and North Carolina ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "tannase activity", "label": "tannase activity", "shape": "dot", "size": 10, "title": "search term: tannase activity Wikipedia URL: tannase activity The page \" Tannase activity \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "t", "label": "t", "shape": "dot", "size": 10, "title": "search term: t Wikipedia URL: T T , or t , is the twentieth letter of the Latin alphabet , used in the modern English alphabet , the alphabets of other western European languages and others worldwide. Its name in English is tee (pronounced / \u02c8 t i\u02d0 / \u24d8 ), plural tees ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "in", "label": "in", "shape": "dot", "size": 10, "title": "search term: in Wikipedia URL: In IN , In or in may refer to:"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "gallic acid", "label": "gallic acid", "shape": "dot", "size": 10, "title": "search term: gallic acid Wikipedia URL: Gallic acid Gallic acid (also known as 3,4,5-trihydroxybenzoic acid ) is a trihydroxybenzoic acid with the formula C 6 H 2 ( OH ) 3 CO 2 H. It is classified as a phenolic acid . It is found in gallnuts , sumac , witch hazel , tea leaves, oak bark , and other plants . It is a white solid, although samples are typically brown owing to partial oxidation. Salts and esters of gallic acid are termed \"gallates\"."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "glucose", "label": "glucose", "shape": "dot", "size": 18, "title": "search term: glucose Wikipedia URL: Glucose Glucose is a sugar with the molecular formula C 6 H 12 O 6 . It is the most abundant monosaccharide , a subcategory of carbohydrates . It is made from water and carbon dioxide during photosynthesis by plants and most algae . It is used by plants to make cellulose , the most abundant carbohydrate in the world, for use in cell walls , and by all living organisms to make adenosine triphosphate (ATP), which is used by the cell as energy. Glucose is often abbreviated as Glc ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Bacillus", "label": "Bacillus", "shape": "dot", "size": 14, "title": "search term: Bacillus Wikipedia URL: Bacillus Bacillus , from Latin \"bacillus\", meaning \"little staff, wand\", is a genus of Gram-positive , rod-shaped bacteria , a member of the phylum Bacillota , with 266 named species . The term is also used to describe the shape (rod) of other so-shaped bacteria; and the plural Bacilli is the name of the class of bacteria to which this genus belongs. Bacillus species can be either obligate aerobes which are dependent on oxygen , or facultative anaerobes which can survive in the absence of oxygen. Cultured Bacillus species test positive for the enzyme catalase if oxygen has been used or is present."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "reproductive performance", "label": "reproductive performance", "shape": "dot", "size": 10, "title": "search term: reproductive performance Wikipedia URL: reproductive performance The page \" Reproductive performance \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Monochamus saltuarius", "label": "Monochamus saltuarius", "shape": "dot", "size": 10, "title": "search term: Monochamus saltuarius Wikipedia URL: Monochamus saltuarius Monochamus saltuarius is a species of beetle in the family Cerambycidae . It was described by Gebler in 1830. It has a wide distribution throughout Europe . It measures between 11 and 19 mm (0.43 and 0.75 in)."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "metabolites", "label": "metabolites", "shape": "dot", "size": 12, "title": "search term: metabolites Wikipedia URL: Metabolites In biochemistry , a metabolite is an intermediate or end product of metabolism . The term is usually used for small molecules . Metabolites have various functions, including fuel, structure, signaling, stimulatory and inhibitory effects on enzymes , catalytic activity of their own (usually as a cofactor to an enzyme), defense, and interactions with other organisms (e.g. pigments , odorants , and pheromones )."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "phenolic acids", "label": "phenolic acids", "shape": "dot", "size": 10, "title": "search term: phenolic acids Wikipedia URL: Phenolic acids Phenolic acids or phenolcarboxylic acids [ citation needed ] are phenolic compounds and types of aromatic acid compounds. Included in that class are substances containing a phenolic ring and an organic carboxylic acid function (C6-C1 skeleton). Two important naturally occurring types of phenolic acids are hydroxybenzoic acids and hydroxycinnamic acids , which are derived from non-phenolic molecules of benzoic and cinnamic acid , respectively. Chemical structure of salicylic acid , a common phenolic acid"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "toxic defense compounds", "label": "toxic defense compounds", "shape": "dot", "size": 10, "title": "search term: toxic defense compounds Wikipedia URL: toxic defense compounds The page \" Toxic defense compounds \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Acinetob", "label": "Acinetob", "shape": "dot", "size": 10, "title": "search term: Acinetob Wikipedia URL: Acinetob The pa RL: Benzodiazines Diazanaphthalenes are a class of aromatic heterocyclic chemical compounds that have the formula C 8 H 6 N 2 . They consist of a naphthalene double ring in which two of the carbon atoms have been replaced with nitrogen atoms. There are ten positional isomers , which differ by the locations of the nitrogen atoms."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "activation threshold", "label": "activation threshold", "shape": "dot", "size": 10, "title": "search term: activation threshold Wikipedia URL: Activation threshold In the Arrhenius model of reaction rates, activation energy is the minimum amount of energy that must be available to reactants for a chemical reaction to occur. The activation energy ( E a ) of a reaction is measured in kilojoules per mole (kJ/mol) or kilocalories per mole (kcal/mol). Simplified: The sparks created by striking steel against a piece of flint provide the activation energy to initiate combustion in this Bunsen burner . The blue flame sustains itself after the sparks stop because the continued combustion of the flame is now energetically favorable."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "InSpodoptera littoralis", "label": "InSpodoptera littoralis", "shape": "dot", "size": 10, "title": "search term: InSpodoptera littoralis Wikipedia URL: InSpodoptera littoralis The page \" InSpodoptera littoralis \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "pathogenic bacteria", "label": "pathogenic bacteria", "shape": "dot", "size": 14, "title": "search term: pathogenic bacteria Wikipedia URL: Pathogenic bacteria Pathogenic bacteria are bacteria that can cause disease . This article focuses on the bacteria that are pathogenic to humans. Most species of bacteria are harmless and many are beneficial but others can cause infectious diseases . The number of these pathogenic species in humans is estimated to be fewer than a hundred. By contrast, several thousand species are considered part of the gut flora , with a few hundred species present in each individual human\u0027s digestive tract ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "intestinal homeostasis", "label": "intestinal homeostasis", "shape": "dot", "size": 10, "title": "search term: intestinal homeostasis Wikipedia URL: intestinal homeostasis The page \" Intestinal homeostasis \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "defensive line", "label": "defensive line", "shape": "dot", "size": 10, "title": "search term: defensive line Wikipedia URL: Defensive line In gridiron football , a lineman is a player who specializes in play at the line of scrimmage . The linemen of the team currently in possession of the ball are the offensive line (OL), while linemen on the opposing team are the defensive line (DL). A number of National Football League (NFL) rules specifically address restrictions and requirements for the offensive line, whose job is to help protect the quarterback from getting sacked for a loss or fumbling . The defensive line is covered by the same rules that apply to all defensive players. Linemen are usually the largest players on the field in both height and weight, since their positions usually require less running and more strength than skill positions . A diagram of the linemen, with defensive linemen (in 4-3 formation) in red and offensive linemen in green."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "physiological adaptability", "label": "physiological adaptability", "shape": "dot", "size": 10, "title": "search term: physiological adaptabili eakdown of lignin , a biopolymer commonly found in the cell walls of plants . The terms ligninases and lignases are older names for the same class, but the name \"lignin-modifying enzymes\" is now preferred, given that these enzymes are not hydrolytic but rather oxidative (electron withdrawing) by their enzymatic mechanisms. LMEs include peroxidases , such as lignin peroxidase ( EC 1.11.1.14 ), manganese peroxidase ( EC 1.11.1.13 ), versatile peroxidase ( EC 1.11.1.16 ), and many phenoloxidases of the laccase type."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "blattodea", "label": "blattodea", "shape": "dot", "size": 12, "title": "search term: blattodea Wikipedia URL: Blattodea Blattodea is an order of insects that contains cockroaches and termites . Collectively, Blattodea and the mantis order Mantodea are considered part of the superorder Dictyoptera . Formerly, termites were considered the separate order Isoptera , but genetic and molecular evidence suggests they evolved from within the cockroach lineage, which renders them cockroaches cladistically ; the group of termites were subsumed into Blattodea and they are considered by some to be a divergent group of cockroaches. Blattodea includes approximately 4,400 species of cockroach in almost 500 genera, and about 3,000 species in around 300 genera within the termite clade ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "actinomycetes", "label": "actinomycetes", "shape": "dot", "size": 12, "title": "search term: actinomycetes Wikipedia URL: Actinomycetes Actinomycetes is a class of bacteria ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Sirex", "label": "Sirex", "shape": "dot", "size": 10, "title": "search term: Sirex Wikipedia URL: Sirex Sirex is a genus of sawfly in the family Siricidae , the horntails or wood wasps. Their bodies are black with a dark blue or green metallic reflection with some species having reddish-brown portions."}, {"color": "#FF9933", "font": {"co alog of Life (2023)."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "longhorn beetles", "label": "longhorn beetles", "shape": "dot", "size": 10, "title": "search term: longhorn beetles Wikipedia URL: Longhorn beetles The longhorn beetles ( Cerambycidae ), also known as long-horned or longicorns (whose larvae are often referred to as roundheaded borers ), are a large family of beetles , with over 35,000 species described."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "digestive symbiosis", "label": "digestive symbiosis", "shape": "dot", "size": 10, "title": "search term: digestive symbiosis Wikipedia URL: digestive symbiosis The page \" Digestive symbiosis \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "plant material", "label": "plant material", "shape": "dot", "size": 10, "title": "search term: plant material Wikipedia URL: Plant material Vascular tissue is a complex transporting tissue , formed of more than one cell type, found in vascular plants . The primary components of vascular tissue are the xylem and phloem . These two tissues transport fluid and nutrients internally. There are also two meristems associated with vascular tissue: the vascular cambium and the cork cambium . All the vascular tissues within a particular plant together constitute the vascular tissue system of that plant. Cross section of celery stalk, showing vascular bundles, which include both phloem and xylem"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "structural carbon sources", "label": "structural carbon sources", "shape": "dot", "size": 10, "title": "search term: structural carbon sources Wikipedia URL: structural carbon sources The page \" Structural carbon sources \" does not exist. You can create a draft and submit it for review or re cesses (such as cellular respiration ) which cannot be used by the organism (they are surplus or toxic ), and must therefore be excreted . This includes nitrogen compounds, water , CO 2 , phosphates , sulphates , etc. Animals treat these compounds as excretes. Plants have metabolic pathways which transform some of them (primarily the oxygen compounds) into useful substances. Placental mammals expel urine from the bladder through the urethra during urination ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "nitrogen waste reuse pathway", "label": "nitrogen waste reuse pathway", "shape": "dot", "size": 10, "title": "search term: nitrogen waste reuse pathway Wikipedia URL: nitrogen waste reuse pathway The page \" Nitrogen waste reuse pathway \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "amino acids", "label": "amino acids", "shape": "dot", "size": 10, "title": "search term: amino acids Wikipedia URL: Amino acids Amino acids are organic compounds that contain both amino and carboxylic acid functional groups . Although over 500 amino acids exist in nature, by far the most important are the 22 \u03b1-amino acids incorporated into proteins . Only these 22 appear in the genetic code of life. Structure of a typical L -alpha-amino acid in the \"neutral\" form"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "B vitamins", "label": "B vitamins", "shape": "dot", "size": 10, "title": "search term: B vitamins Wikipedia URL: B vitamins B vitamins are a class of water-soluble vitamins that play important roles in cell metabolism and synthesis of red blood cells . They are a chemically diverse class of compounds."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "legume seeds", "label": "legume seeds", "shape": "dot", "size": 10, "title": " e dawn redwood , is a fast-growing, endangered deciduous conifer . It is the sole living species of the genus Metasequoia , one of three genera in the subfamily Sequoioideae of the family Cupressaceae. It now survives in the wild only in wet lower slopes and montane river and stream valleys in the border region of Hubei and Hunan provinces and Chongqing municipality in south-central China , notably in Lichuan county in Hubei. Although the shortest of the redwoods, it can grow to 167 ft (51 m) in height."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "survival rate", "label": "survival rate", "shape": "dot", "size": 10, "title": "search term: survival rate Wikipedia URL: Survival rate Survival rate is a part of survival analysis . It is the proportion of people in a study or treatment group still alive at a given period of time after diagnosis. It is a method of describing prognosis in certain disease conditions, and can be used for the assessment of standards of therapy. The survival period is usually reckoned from date of diagnosis or start of treatment. Survival rates are based on the population as a whole and cannot be applied directly to an individual. There are various types of survival rates (discussed below). They often serve as endpoints of clinical trials and should not be confused with mortality rates , a population metric."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "chemical defense barriers", "label": "chemical defense barriers", "shape": "dot", "size": 10, "title": "search term: chemical defense barriers Wikipedia URL: chemical defense barriers The page \" Chemical defense barriers \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "microbial partnerships", "label": "microbial partnerships", "shape": "dot", "size": 10, : "Immune Response", "label": "Immune Response", "shape": "dot", "size": 14, "title": "search term: Immune Response Wikipedia URL: Immune response An immune response is a physiological reaction which occurs within an organism in the context of inflammation for the purpose of defending against exogenous factors. These include a wide variety of different toxins , viruses , intra- and extracellular bacteria , protozoa , helminths , and fungi which could cause serious problems to the health of the host organism if not cleared from the body. Innate immune response to a gram-negative bacteria invasion"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Gene Expression", "label": "Gene Expression", "shape": "dot", "size": 10, "title": "search term: Gene Expression Wikipedia URL: Gene Expression Gene expression is the process by which the information contained within a gene is used to produce a functional gene product, such as a protein or a functional RNA molecule. This process involves multiple steps, including the transcription of the gene\u0027s sequence into RNA. For protein-coding genes, this RNA is further translated into a chain of amino acids that folds into a protein, while for non-coding genes, the resulting RNA itself serves a functional role in the cell. Gene expression enables cells to utilize the genetic information in genes to carry out a wide range of biological functions. While expression levels can be regulated in response to cellular needs and environmental changes, some genes are expressed continuously with little variation. The process of transcription is carried out by RNA polymerase (RNAP), which uses DNA (black) as a template and produces RNA (blue)."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Viral Infection", "label": "Viral Infection", "shape": "dot", "size": 10, "title": "search term: Viral Infection Wikipedia URL: Viral infection A viral disease (or viral infection ) occurs when an organism\u0027s body is invaded by pa color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "host specificity", "label": "host specificity", "shape": "dot", "size": 10, "title": "search term: host specificity Wikipedia URL: Host specificity In biology and medicine , a host is a larger organism that harbours a smaller organism ; whether a parasitic , a mutualistic , or a commensalist guest ( symbiont ). The guest is typically provided with nourishment and shelter. Examples include animals playing host to parasitic worms (e.g. nematodes ), cells harbouring pathogenic (disease-causing) viruses , or a bean plant hosting mutualistic (helpful) nitrogen-fixing bacteria . More specifically in botany , a host plant supplies food resources to micropredators, which have an evolutionarily stable relationship with their hosts similar to ectoparasitism . The host range is the collection of hosts that an organism can use as a partner. The black rat is a reservoir host for bubonic plague . The rat fleas that infest the rats are vectors for the disease."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Cell Rep", "label": "Cell Rep", "shape": "dot", "size": 10, "title": "search term: Cell Rep Wikipedia URL: Cell Rep Cell Reports is a peer-reviewed scientific journal publishing research papers across a broad range of disciplines within the life sciences . The journal was established in 2012 and is the first open access journal published by Cell Press , an imprint of Elsevier ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "spatial structure", "label": "spatial structure", "shape": "dot", "size": 10, "title": "search term: spatial structure Wikipedia URL: spatial structure The page \" Spatial structure \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "East African savanna", "label": "East A lant tissue, creating abnormal plant growths called galls . Cecidomyiidae are very fragile small insects usually only 2\u20133 mm (0.079\u20130.118 in) in length; many are less than 1 mm (0.039 in) long. They are characterised by hairy wings, unusual in the order Diptera , and have long antennae . Some Cecidomyiids are also known for the strange phenomenon of paedogenesis in which the larval stage reproduces without maturing first. In some species, the daughter larvae consume the mother, while in others, reproduction occurs later on in the egg or pupa."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Physiol", "label": "Physiol", "shape": "dot", "size": 10, "title": "search term: Physiol Wikipedia URL: Physiol The page \" Physiol \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "crosstalk", "label": "crosstalk", "shape": "dot", "size": 10, "title": "search term: crosstalk Wikipedia URL: Crosstalk In electronics , crosstalk ( XT ) is a phenomenon by which a signal transmitted on one circuit or channel of a transmission system creates an undesired effect in another circuit or channel. Crosstalk is usually caused by undesired capacitive , inductive , or conductive coupling from one circuit or channel to another."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Tritrophic Context", "label": "Tritrophic Context", "shape": "dot", "size": 10, "title": "search term: Tritrophic Context Wikipedia URL: Tritrophic Context The page \" Tritrophic Context \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "coexistence", "label": "coexistence", "sh ow to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Plant Microbe Interact", "label": "Plant Microbe Interact", "shape": "dot", "size": 10, "title": "search term: Plant Microbe Interact Wikipedia URL: Plant Microbe Interact The page \" Plant Microbe Interact \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "oral bacteria", "label": "oral bacteria", "shape": "dot", "size": 10, "title": "search term: oral bacteria Wikipedia URL: Oral bacteria Oral microbiology is the study of the microorganisms (microbiota) of the oral cavity and their interactions between oral microorganisms or with the host. The environment present in the human mouth is suited to the growth of characteristic microorganisms found there. It provides a source of water and nutrients, as well as a moderate temperature. Resident microbes of the mouth adhere to the teeth and gums to resist mechanical flushing from the mouth to stomach where acid-sensitive microbes are destroyed by hydrochloric acid . Thrush, a common condition caused by overgrowth of the fungus Candida albicans. Cases are characterized by growth of matted, yellow-white patches of fungus in the mouth."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Spodoptera", "label": "Spodoptera", "shape": "dot", "size": 10, "title": "search term: Spodoptera Wikipedia URL: Spodoptera Spodoptera is a genus of moths of the family Noctuidae erected by Achille Guen\u00e9e in 1852. Many are known as pest insects. The larvae are sometimes called armyworms . The roughly thirty species are distributed across six continents."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Plutellidae", "label": "Plutellidae", "shape": "dot", "size": 12, "title": "search term: Plutellidae Wiki
