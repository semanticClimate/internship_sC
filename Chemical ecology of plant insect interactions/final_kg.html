                  nodes = new vis.DataSet([{"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "pharmacophagy", "label": "pharmacophagy", "shape": "dot", "size": 10, "title": "search term: pharmacophagy Wikipedia URL: pharmacophagy The page \" Pharmacophagy \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Chemical Ecology", "label": "Chemical Ecology", "shape": "dot", "size": 12, "title": "search term: Chemical Ecology Wikipedia URL: Chemical ecology Chemical ecology is a vast and interdisciplinary field utilizing biochemistry , biology , ecology , and organic chemistry for explaining observed interactions of living things and their environment through chemical compounds (e.g. ecosystem resilience and biodiversity). Early examples of the field trace back to experiments with the same plant genus in different environments, interaction of plants and butterflies, and the behavioral effect of catnip. Chemical ecologists seek to identify the specific molecules (i.e. semiochemicals ) that function as signals mediating community or ecosystem processes and to understand the evolution of these signals. The chemicals behind such roles are typically small, readily-diffusible organic molecules that act over various distances that are dependent on the environment (i.e. terrestrial or aquatic) but can also include larger molecules and small peptides. Monarch butterfly caterpillar on mi"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "clerodanoids", "label": "clerodanoids", "shape": "dot", "size": 10, "title": "search term: clerodanoids Wikipedia URL: clerodanoids The page \" Clerodanoids \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search result below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "surface compounds", "label": "surface compounds", "shape": "dot", "size": 10, "title": "search term: surface compounds Wikipedia URL: surface compounds The page \" Surface compounds \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "sawflies", "label": "sawflies", "shape": "dot", "size": 14, "title": "search term: sawflies Wikipedia URL: Sawflies Sawflies are wasp -like insects that are in the suborder Symphyta within the order Hymenoptera . The common name comes from the saw-like appearance of the ovipositor , which females use to cut into the plants where they lay their eggs. The name is associated especially with the Tenthredinoidea , by far the largest superfamily in the suborder, with about 7,000 known species in the entire suborder. There are 8,000 described species in more than 800 genera."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "cuticular hydrocarbons", "label": "cuticular hydrocarbons", "shape": "dot", "size": 12, "title": "search term: cuticular hydrocarbons Wikipedia URL: Cuticular hydrocarbons Insects (from Latin insectum ) are hexapod invertebrates of the class Insecta . They are the largest group within the arthropod phylum . Insects have a chitinous exoskeleton , a three-part body ( head , thorax and abdomen ), three pairs of jointed legs , compound eyes , and a pair of antennae . Insects are the most diverse group of animals, with more than a million described species ; they represent more than half of all animal species."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "rosae", "label": "rosae", "shape": "dot", "size": 10, "title": "search term: rosae Wikipedia URL: rosae The page \" Rosae \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "reptans", "label": "reptans", "shape": "dot", "size": 10, "title": "search term: reptans Wikipedia URL: reptans The page \" Reptans \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "surface washes", "label": "surface washes", "shape": "dot", "size": 10, "title": "search term: surface washes Wikipedia URL: surface washes The page \" Surface washes \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "CHC profiles", "label": "CHC profiles", "shape": "dot", "size": 10, "title": "search term: CHC profiles Wikipedia URL: CHC profiles The page \" CHC profiles \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "adults", "label": "adults", "shape": "dot", "size": 10, "title": "search term: adults Wikipedia URL: Adults An adult is an animal that has reached full growth . The biological definition of adult is an organism that has reached sexual maturity and thus capable of reproduction ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Petri dish assay", "label": "Petri dish assay", "shape": "dot", "size": 10, "title": "search term: Petri dish assay Wikipedia URL: Petri dish assay The page \" Petri dish assay \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "mating", "label": "mating", "shape": "dot", "size": 12, "title": "search term: mating Wikipedia URL: Mating In biology , mating is the pairing of either opposite-sex or hermaphroditic organisms for the purposes of sexual reproduction . Fertilization is the fusion of two gametes . Copulation is the union of the sex organs of two sexually reproducing animals for insemination and subsequent internal fertilization . Mating may also lead to external fertilization , as seen in amphibians , bony fishes and plants. For most species, mating is between two individuals of opposite sexes. However, for some hermaphroditic species, copulation is not required because the parent organism is capable of self-fertilization ( autogamy ); for example, banana slugs . Blue-tailed damselflies ( Ischnura elegans ) mating"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "rept", "label": "rept", "shape": "dot", "size": 10, "title": "search term: rept Wikipedia URL: rept The page \" Rept \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "conspecifics", "label": "conspecifics", "shape": "dot", "size": 12, "title": "search term: conspecifics Wikipedia URL: Conspecifics Biological specificity is the tendency of a characteristic such as a behavior or a biochemical variation to occur in a particular species . Biochemist Linus Pauling stated that \"Biological specificity is the set of characteristics of living organisms or constituents of living organisms of being special or doing something special. Each animal or plant species is special. It differs in some way from all other species...biological specificity is the major problem about understanding life.\""}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "binomial test", "label": "binomial test", "shape": "dot", "size": 10, "title": "search term: binomial test Wikipedia URL: Binomial test Binomial test is an exact test of the statistical significance of deviations from a theoretically expected distribution of observations into two categories using sample data."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "females", "label": "females", "shape": "dot", "size": 12, "title": "search term: females Wikipedia URL: Females An organism \u0027s sex is female ( symbol : \u2640 ) if it produces, or is organized to produce, the ovum (egg cell), the type of gamete (sex cell) that fuses with the male gamete (sperm cell) during sexual reproduction . The symbol of the Roman goddess Venus is used to represent the female sex in biology."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "organisms", "label": "organisms", "shape": "dot", "size": 12, "title": "search term: organisms Wikipedia URL: Organisms An organism is any living thing that functions as an individual . Such a definition raises more problems than it solves, not least because the concept of an individual is also difficult. Several criteria, few of which are widely accepted, have been proposed to define what constitutes an organism. Among the most common is that an organism has autonomous reproduction , growth , and metabolism . This would exclude viruses , even though they evolve like organisms. One criterion proposes that an organism cannot be divided without losing functionality. This basil plant cutting is however developing new adventitious roots from a small bit of stem , forming a new plant."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "turnip sawfly", "label": "turnip sawfly", "shape": "dot", "size": 12, "title": "search term: turnip sawfly Wikipedia URL: Turnip sawfly Athalia rosae , the turnip sawfly , cabbage leaf sawfly or beet sawfly , is a typical sawfly with dark green or blackish 18\u201325 mm long larvae that feed on plants of the brassica family, and can sometimes be a pest. It winters below the ground, emerging in early summer as a 7\u20138 mm adult with a mainly orange body and a black head. The adult feeds on nectar ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "plant metabolites", "label": "plant metabolites", "shape": "dot", "size": 10, "title": "search term: plant metabolites Wikipedia URL: plant metabolites The page \" Plant metabolites \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "sex", "label": "sex", "shape": "dot", "size": 20, "title": "search term: sex Wikipedia URL: Sex Sex is the biological trait of a reproducing organism in producing gametes of one of two different sizes or shapes \u2014 male or female gametes. Thus, the typical classification for such organisms, their sex, is also known as either male or female. During sexual reproduction, a male and a female gamete fuse to form a zygote , which develops into an offspring that inherits traits from each parent. By convention, organisms that produce smaller gametes ( spermatozoa , sperm ) are called male , while organisms that produce larger gametes ( ova , often called egg cells) are called female . An organism that produces both types of gamete is a hermaphrodite . The life cycle of a sexually reproducing species cycles through haploid and diploid stages"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Ajuga reptans", "label": "Ajuga reptans", "shape": "dot", "size": 10, "title": "search term: Ajuga reptans Wikipedia URL: Ajuga reptans Ajuga reptans is commonly known as bugle , blue bugle , bugleherb , bugleweed , carpetweed , carpet bugleweed , carpet bugle , and common bugle , and traditionally (although less commonly) as St. Lawrence plant . It is an herbaceous flowering plant in the mint family Lamiaceae, native to Europe. It is also a component of purple moor grass and rush pastures , a Biodiversity Action Plan habitat in the United Kingdom."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Petri dish", "label": "Petri dish", "shape": "dot", "size": 12, "title": "search term: Petri dish Wikipedia URL: Petri dish A Petri dish (alternatively known as a Petri plate or cell-culture dish ) is a shallow transparent lidded dish that biologists use to hold growth medium in which cells can be cultured , originally, cells of bacteria , fungi , and small mosses . The container is named after its inventor, German bacteriologist Julius Richard Petri . It is the most common type of culture plate . The Petri dish is one of the most common items in biology laboratories and has entered popular culture . The term is sometimes written in lower case, especially in non-technical literature. A glass Petri dish with culture"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "dichloromethane", "label": "dichloromethane", "shape": "dot", "size": 10, "title": "search term: dichloromethane Wikipedia URL: Dichloromethane Dichloromethane ( DCM , methylene chloride , or methylene bichloride ) is an organochlorine compound with the formula C H 2 Cl 2 . This colorless, volatile liquid with a chloroform -like, sweet odor is widely used as a solvent . Although it is not miscible with water, it is slightly polar and miscible with many organic solvents ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Friedman test", "label": "Friedman test", "shape": "dot", "size": 10, "title": "search term: Friedman test Wikipedia URL: Friedman test The Friedman test is a non-parametric statistical test developed by Milton Friedman . Similar to the parametric repeated measures ANOVA , it is used to detect differences in treatments across multiple test attempts. The procedure involves ranking each row (or block ) together, and then considering the values of ranks by columns. Applicable to complete block designs , it is thus a special case of the Durbin test ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "beta dispersion", "label": "beta dispersion", "shape": "dot", "size": 10, "title": "search term: beta dispersion Wikipedia URL: Beta dispersion Beta dispersion is the phenomenon associated with the ability of a biological cell membrane to filter out low frequency currents and allow high frequency currents to pass through. It was originally hypothesized by Rudolf H\u00f6ber in 1910 and confirmed through a series of experiments between 1910 and 1913."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Boxplots", "label": "Boxplots", "shape": "dot", "size": 10, "title": "search term: Boxplots Wikipedia URL: Boxplots In descriptive statistics , a box plot or boxplot is a method for demonstrating graphically the locality, spread and skewness groups of numerical data through their quartiles . Box plot of data from the Michelson experiment"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "medians", "label": "medians", "shape": "dot", "size": 10, "title": "search term: medians Wikipedia URL: Medians The Medes were an Iron Age Iranian people who spoke the Median language and who inhabited an area known as Media between western and northern Iran . Around the 11th century BC, they occupied the mountainous region of northwestern Iran and the northeastern and eastern region of Mesopotamia in the vicinity of Ecbatana (present-day Hamadan ). Their consolidation in Iran is believed to have occurred during the 8th century BC. In the 7th century BC, all of western Iran and some other territories were under Median rule, but their precise geographic extent remains unknown. Artistic representation of a Median man"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "whiskers", "label": "whiskers", "shape": "dot", "size": 10, "title": "search term: whiskers Wikipedia URL: Whiskers Whiskers , also known as vibrissae ( / v \u0259 \u02c8 b r \u026a s i / ; sg. vibrissa ; / v \u0259 \u02c8 b r \u026a s \u0259 / ), are specialized sensory hairs that help most species of mammals sense their environment. Whiskers function as highly sensitive feelers that help mammals navigate the world in many different ways, including the detection of air currents and physical objects to aid in navigation, hunting, and spatial awareness. Whiskers can trigger reflexes to protect the eyes. Whiskers also play a significant role in the communication between individual animals in different species of mammals. They convey an animal\u0027s emotional state, essentially sending a message to other members of their species about what emotion they are feeling at the time. Whisker movement can be thought of as a form of language that animals use to silently communicate with the other animals around them. A cat with vibrissae"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "herbivorous insects", "label": "herbivorous insects", "shape": "dot", "size": 10, "title": "search term: herbivorous insects Wikipedia URL: herbivorous insects The page \" Herbivorous insects \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "insect species", "label": "insect species", "shape": "dot", "size": 10, "title": "search term: insect species Wikipedia URL: insect species The page \" Insect species \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Phytochemistry", "label": "Phytochemistry", "shape": "dot", "size": 10, "title": "search term: Phytochemistry Wikipedia URL: Phytochemistry Phytochemistry is the study of phytochemicals , which are chemicals derived from plants . Phytochemists strive to describe the structures of the large number of secondary metabolites found in plants, the functions of these compounds in human and plant biology, and the biosynthesis of these compounds. Plants synthesize phytochemicals for many reasons, including to protect themselves against insect attacks and plant diseases . The compounds found in plants are of many kinds, but most can be grouped into four major biosynthetic classes: alkaloids , phenylpropanoids , polyketides , and terpenoids ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Chemical communication", "label": "Chemical communication", "shape": "dot", "size": 10, "title": "search term: Chemical communication Wikipedia URL: Chemical communication A semiochemical , from the Greek \u03c3\u03b7\u03bc\u03b5\u1fd6\u03bf\u03bd ( semeion ), meaning \"signal\", is a chemical substance or mixture released by an organism that affects the behaviors of other individuals. Semiochemical communication can be divided into two broad classes: communication between individuals of the same species (intraspecific) or communication between different species ( interspecific )."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "chemical cues", "label": "chemical cues", "shape": "dot", "size": 10, "title": "search term: chemical cues Wikipedia URL: chemical cues The page \" Chemical cues \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "surface compound profiles", "label": "surface compound profiles", "shape": "dot", "size": 10, "title": "search term: surface compound profiles Wikipedia URL: surface compound profiles The page \" Surface compound profiles \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Hymenoptera", "label": "Hymenoptera", "shape": "dot", "size": 20, "title": "search term: Hymenoptera Wikipedia URL: Hymenoptera Hymenoptera is a large order of insects , comprising the sawflies , wasps , bees , and ants . Over 150,000 living species of Hymenoptera have been described, in addition to over 2,000 extinct ones. Many of the species are parasitic . Females typically have a special ovipositor for inserting eggs into hosts or places that are otherwise inaccessible. This ovipositor is often modified into a stinger . The young develop through holometabolism (complete metamorphosis )\u2014that is, they have a wormlike larval stage and an inactive pupal stage before they reach adulthood."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Perception", "label": "Perception", "shape": "dot", "size": 12, "title": "search term: Perception Wikipedia URL: Perception Perception (from Latin perceptio \u0027 gathering, receiving \u0027 ) is the organization, identification, and interpretation of sensory information, in order to represent and understand the presented information or environment. All perception involves signals that go through the nervous system , which in turn result from physical or chemical stimulation of the sensory system . Vision involves light striking the retina of the eye ; smell is mediated by odor molecules ; and hearing involves pressure waves . The Necker cube and Rubin vase can be perceived in more than one way."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Brassicaceae", "label": "Brassicaceae", "shape": "dot", "size": 14, "title": "search term: Brassicaceae Wikipedia URL: Brassicaceae See list of Brassicaceae genera"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "leaf surface", "label": "leaf surface", "shape": "dot", "size": 10, "title": "search term: leaf surface Wikipedia URL: leaf surface The page \" Leaf surface \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "oviposition", "label": "oviposition", "shape": "dot", "size": 12, "title": "search term: oviposition Wikipedia URL: Oviposition The ovipositor is a tube-like organ used by some animals , especially insects , for the laying of eggs . In insects, an ovipositor consists of a maximum of three pairs of appendages. The details and morphology of the ovipositor vary, but typically its form is adapted to functions such as preparing a place for the egg, transmitting the egg, and then placing it properly. For most insects, the organ is used merely to attach the egg to some surface, but for many parasitic species (primarily in wasps and other Hymenoptera ), it is a piercing organ as well. Ovipositor of long-horned grasshopper (the two cerci are also visible)"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "labial palps", "label": "labial palps", "shape": "dot", "size": 10, "title": "search term: labial palps Wikipedia URL: labial palps The page \" Labial palps \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Random forest analysis", "label": "Random forest analysis", "shape": "dot", "size": 10, "title": "search term: Random forest analysis Wikipedia URL: Random forest analysis The page \" Random forest analysis \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "males", "label": "males", "shape": "dot", "size": 12, "title": "search term: males Wikipedia URL: Males Male ( symbol : \u2642 ) is the sex of an organism that produces, or is organized to produce, the gamete (sex cell) known as sperm , which fuses with the larger female gamete, or ovum , in the process of fertilisation . A male organism cannot reproduce sexually without access to at least one ovum from a female, but some organisms can reproduce both sexually and asexually . Most male mammals , including male humans, have a Y chromosome , which codes for the production of larger amounts of testosterone to develop male reproductive organs . The symbol of the Roman god Mars (god of war) is often used to represent the male sex. It also stands for the planet Mars and is the alchemical symbol for iron ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "internal standard", "label": "internal standard", "shape": "dot", "size": 10, "title": "search term: internal standard Wikipedia URL: Internal standard In a chemical analysis , the internal standard method involves adding the same amount of a chemical substance to each sample and calibration solution. The internal standard responds proportionally to changes in the analyte and provides a similar, but not identical, measurement signal. It must also be absent from the sample matrix to ensure there is no other source of the internal standard present. Taking the ratio of analyte signal to internal standard signal and plotting it against the analyte concentrations in the calibration solutions will result in a calibration curve . The calibration curve can then be used to calculate the analyte concentration in an unknown sample. Spreadsheet for worked-example of plotting nickel concentrations in calibration solutions. The calibration curve on the top does not use the internal standard method. The calibration curve on the bottom does use the internal standard method."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "alkenes", "label": "alkenes", "shape": "dot", "size": 10, "title": "search term: alkenes Wikipedia URL: Alkenes In organic chemistry , an alkene , or olefin , is a hydrocarbon containing a carbon \u2013carbon double bond . The double bond may be internal or at the terminal position. Terminal alkenes are also known as \u03b1-olefins . A 3D model of ethylene , the simplest alkene"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "adult Athalia rosae", "label": "adult Athalia rosae", "shape": "dot", "size": 10, "title": "search term: adult Athalia rosae Wikipedia URL: adult Athalia rosae The page \" Adult Athalia rosae \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "adult sawflies", "label": "adult sawflies", "shape": "dot", "size": 10, "title": "search term: adult sawflies Wikipedia URL: adult sawflies The page \" Adult sawflies \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "interquartile range", "label": "interquartile range", "shape": "dot", "size": 10, "title": "search term: interquartile range Wikipedia URL: Interquartile range In descriptive statistics , the interquartile range ( IQR ) is a measure of statistical dispersion , which is the spread of the data. The IQR may also be called the midspread , middle 50% , fourth spread , or H\u2011spread. It is defined as the difference between the 75th and 25th percentiles of the data. To calculate the IQR, the data set is divided into quartiles , or four rank-ordered even parts via linear interpolation. These quartiles are denoted by Q 1 (also called the lower quartile), Q 2 (the median ), and Q 3 (also called the upper quartile). The lower quartile corresponds with the 25th percentile and the upper quartile corresponds with the 75th percentile, so IQR = Q 3 \u2212 Q 1 . Boxplot (with an interquartile range) and a probability density function (pdf) of a Normal N(0,\u03c3 2 ) Population"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "mating preferences", "label": "mating preferences", "shape": "dot", "size": 12, "title": "search term: mating preferences Wikipedia URL: Mating preferences Mating preferences are qualities that one desires in a romantic or sexual partner . Research across many domains, such as evolutionary biology , psychology , and anthropology , shows that humans display both widely shared (consensual) preferences \u2013 like preferences for kindness, intelligence, and health \u2013 as well as sex-differentiated preferences shaped by ancestral selection pressures. These preferences are understood within the framework of sexual selection (first proposed by Charles Darwin in 1871) and more contemporary theories that draw on evolutionary explanations , cultural variation , and evidence from actual mating behaviors. These theories account for the variation in desires for certain traits, the divergence of preference between men and women, and the adoption of short-term vs long-term mating strategies. Together, these approaches explain the origins, adaptive functions, and real-word outcomes of human mate"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "ant species", "label": "ant species", "shape": "dot", "size": 10, "title": "search term: ant species Wikipedia URL: ant species The page \" Ant species \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "CHC profile", "label": "CHC profile", "shape": "dot", "size": 10, "title": "search term: CHC profile Wikipedia URL: CHC profile The page \" CHC profile \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "bumblebees", "label": "bumblebees", "shape": "dot", "size": 10, "title": "search term: bumblebees Wikipedia URL: Bumblebees A bumblebee (or bumble bee, bumble-bee, or humble-bee) is any of over 250 species in the genus Bombus , part of Apidae , one of the bee families. This genus is the only extant group in the tribe Bombini , though a few extinct related genera (e.g., Calyptapis ) are known from fossils . They are found primarily in the Northern Hemisphere , although they are also found in South America, where a few lowland tropical species have been identified. European bumblebees have also been introduced to New Zealand and Tasmania . Female bumblebees can sting repeatedly, but generally ignore humans and other animals."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "ro", "label": "ro", "shape": "dot", "size": 10, "title": "search term: ro Wikipedia URL: Ro RO or Ro may refer to:"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Creative Commons licence", "label": "Creative Commons licence", "shape": "dot", "size": 10, "title": "search term: Creative Commons licence Wikipedia URL: Creative Commons licence A Creative Commons ( CC ) license is one of several public copyright licenses that enable the free distribution of an otherwise copyrighted \"work\". A CC license is used when an author wants to give other people the right to share, use, and build upon a work that the author has created. CC provides an author flexibility (for example, they might choose to allow only non-commercial uses of a given work) and protects the people who use or redistribute an author\u0027s work from concerns of copyright infringement as long as they abide by the conditions that are specified in the license by which the author distributes the work. Creative Commons logo"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "insect hydrocarbons", "label": "insect hydrocarbons", "shape": "dot", "size": 10, "title": "search term: insect hydrocarbons Wikipedia URL: insect hydrocarbons The page \" Insect hydrocarbons \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "CHC variation", "label": "CHC variation", "shape": "dot", "size": 10, "title": "search term: CHC variation Wikipedia URL: CHC variation The page \" CHC variation \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Formicidae", "label": "Formicidae", "shape": "dot", "size": 14, "title": "search term: Formicidae Wikipedia URL: Formicidae Ants are eusocial insects of the family Formicidae and, along with the related wasps and bees , belong to the order Hymenoptera . Ants evolved from vespoid wasp ancestors in the Cretaceous period. More than 13,800 of an estimated total of 22,000 species have been classified. They are easily identified by their geniculate (elbowed) antennae and the distinctive node-like structure that forms their slender waists."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "specificity", "label": "specificity", "shape": "dot y the architecture, which encloses all faculties in one great structure. It is among the first of the German universities to switch some faculties (e.g. biology) to bachelor\u0027s / master\u0027s degrees as part of the Bologna process . Bielefeld University"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "defense", "label": "defense", "shape": "dot", "size": 10, "title": "search term: defense Wikipedia URL: Defense Defense or defence may refer to:"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "bugleweed Ajuga reptans", "label": "bugleweed Ajuga reptans", "shape": "dot", "size": 10, "title": "search term: bugleweed Ajuga reptans Wikipedia URL: bugleweed Ajuga reptans The page \" Bugleweed Ajuga reptans \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "odors", "label": "odors", "shape": "dot", "size": 10, "title": "search term: odors Wikipedia URL: Odors An odor ( American English ) or odour ( Commonwealth English ; see spelling differences ) is a smell or a scent caused by one or more volatilized chemical compounds generally found in low concentrations that humans and many animals can perceive via their olfactory system . While smell can refer to pleasant and unpleasant odors, the terms scent , aroma , and fragrance are usually reserved for pleasant-smelling odors and are frequently used in the food and cosmetic industry to describe floral scents or to refer to perfumes . \"Smell\", from Allegory of the Senses by Jan Brueghel the Elder , Museo del Prado"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "bioassays", "label": "bioassays", "shape": "dot", "size": 10, "title": "search term: bioassays Wikipedia URL: Bioassays An assay is an investigative (analytic) procedure in laboratory medicine , mining , pharmacology , environmental biology and molecular biology for qualitatively assessing or quantitatively measuring the presence, amount, or functional activity of a target entity. The measured entity is often called the analyte , the measurand , or the target of the assay. The analyte can be a drug , biochemical substance , chemical element or compound , or cell in an organism or organic sample . An assay usually aims to measure an analyte\u0027s intensive property and express it in the relevant measurement unit (e.g. molarity , density , functional activity in enzyme international units, degree of effect in comparison to a standard, etc.)."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "cuticular surface composition", "label": "cuticular surface composition", "shape": "dot", "size": 10, "title": "search term: cuticular surface composition Wikipedia URL: cuticular surface composition The page \" Cuticular surface composition \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "cuticular hydrocarbon composition", "label": "cuticular hydrocarbon composition", "shape": "dot", "size": 10, "title": "search term: cuticular hydrocarbon composition Wikipedia URL: cuticular hydrocarbon composition The page \" Cuticular hydrocarbon composition \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "surface compound abundance", "label": "surface compound abundance", "shape": "dot", "size": 10, "title": "search term: surface compound abundance Wikipedia URL: surface compound abundance The page \" Surface compound abundance \" does not exist. You can create a draft and submit it for search term: water loss Wikipedia URL: Water loss Water loss may refer to:"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "insect cuticle", "label": "insect cuticle", "shape": "dot", "size": 10, "title": "search term: insect cuticle Wikipedia URL: Insect cuticle Arthropods are covered with a tough, resilient integument , cuticle or exoskeleton of chitin . Generally the exoskeleton will have thickened areas in which the chitin is reinforced or stiffened by materials such as minerals or hardened proteins. This happens in parts of the body where there is a need for rigidity or elasticity. Typically the mineral crystals, mainly calcium carbonate , are deposited among the chitin and protein molecules in a process called biomineralization . The crystals and fibres interpenetrate and reinforce each other, the minerals supplying the hardness and resistance to compression, while the chitin supplies the tensile strength. Biomineralization occurs mainly in crustaceans. In insects and arachnids , the main reinforcing materials are various proteins hardened by linking the fibres in processes called sclerotisation and the hardened proteins are called sclerotin. The dorsal tergum , ventral sternum , a"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "specific communication", "label": "specific communication", "shape": "dot", "size": 10, "title": "search term: specific communication Wikipedia URL: specific communication The page \" Specific communication \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "species", "label": "species", "shape": "dot", "size": 64, "title": "search term: species Wikipedia URL: Species A species ( pl. species ) is the basic unit of classification and a taxonomic rank of an organism, as well as a unit of biodiversity . It can be defined as the largest group of organisms in which any two individuals of the appropriate sexes or mating types can produce fertile offspring , typically by sexual reproduction . Other ways of defining species include their karyotype , DNA sequence, morphology , behaviour, or ecological niche . In addition, palaeontologists use the concept of the chronospecies since fossil reproduction cannot be examined. The most recent rigorous estimate for the total number of species of eukaryotes is between 8 and 8.7 million. About 14% of these had been described by 2011. All species (except viruses ) are given a two-part name , a \"binomen\". The first part of a binomen is the name of a genus to which the species belongs. The second part is called the specific name or the specific epithet (in botanical nomenclatur"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "colony", "label": "colony", "shape": "dot", "size": 10, "title": "search term: colony Wikipedia URL: Colony A colony is a territory subject to a form of foreign rule , which rules the territory and its indigenous peoples separated from the foreign rulers, the colonizer , and their metropole (or \"mother country\"). This separated rule was often organized into colonial empires , with their metropoles at their centers, making colonies neither annexed or even integrated territories, nor client states . Particularly new imperialism and its colonialism advanced this separated rule and its lasting coloniality . Colonies were most often set up and colonized for exploitation and possibly settlement by colonists . Dependent territories and their sovereign states. All territories are labeled according to ISO 3166-1 or with numbers. Colored areas without labels are integral parts of their respective countries. Antarctica is shown as a condominium instead of individual claims ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "solitary insect", "label": "solitary insect", "shape": "dot", "size": 10, "title": "search term: solitary insect Wikipedia URL: solitary insect The page \" Solitary insect \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "conspecific recognition", "label": "conspecific recognition", "shape": "dot", "size": 10, "title": "search term: conspecific recognition Wikipedia URL: conspecific recognition The page \" Conspecific recognition \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "genetics", "label": "genetics", "shape": "dot", "size": 20, "title": "search term: genetics Wikipedia URL: Genetics Genetics is the study of genes , genetic variation , and heredity in organisms . It is an important branch in biology because heredity is vital to organisms\u0027 evolution . Gregor Mendel , a Moravian Augustinian friar working in the 19th century in Brno , was the first to study genetics scientifically. Mendel studied \"trait inheritance\", patterns in the way traits are handed down from parents to offspring over time. He observed that organisms (pea plants) inherit traits by way of discrete \"units of inheritance\". This term, still used today, is a somewhat ambiguous definition of what is referred to as a gene. Portrait of Imre Festetics , the first geneticist and ethologist . His concepts of selection and evolution were later formulated in Charles Darwin\u0027s theory of evolution ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "physiology", "label": "physiology", "shape": "dot", "size": 18, "title": "search term: physiology Wikipedia URL: Physiology Physiology ( / \u02cc f \u026a z i \u02c8 \u0252 l \u0259 d\u0292 i / ; from Ancient Greek \u03c6\u03cd\u03c3\u03b9\u03c2 ( ph\u00fasis ) \u0027 nature, origin \u0027 and -\u03bb\u03bf\u03b3\u03af\u03b1 ( -log\u00eda ) \u0027 study of \u0027 ) is the scientific study of functions and mechanisms in a living system . As a subdiscipline of biology , physiology focuses on how organisms , organ systems , individual organs , cells , and biomolecules carry out chemical and physical functions in a living system. According to the classes of organisms , the field can be divided into medical physiology , animal physiology , plant physiology , cell physiology , and comparative physiology . Oil painting depicting Claude Bernard , the father of modern physiology, with his pupils"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "age", "label": "age", "shape": "dot", "size": 10, "title": "search term: age Wikipedia URL: Age Age or AGE may refer to:"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "temperature", "label": "temperature", "shape": "dot", "size": 10, "title": "search term: temperature Wikipedia URL: Temperature Temperature quantitatively expresses the attribute of hotness or coldness . Temperature is measured with a thermometer . It reflects the average kinetic energy of the vibrating and colliding atoms making up a substance."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "humidity", "label": "humidity", "shape": "dot", "size": 10, "title": "search term: humidity Wikipedia URL: Humidity Humidity is the concentration of water vapor present in the air. Water vapor, the gaseous state of water, is generally invisible to the naked eye. Humidity indicates the likelihood for precipitation , dew , or fog to be present. Global distribution of relative humidity at the surface averaged over the years 1981\u20132010 from the CHELSA-BIOCLIM+ data set"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "green leaf volatiles", "label": "green leaf volatiles", "shape": "dot", "size": 10, "title": "search term: green leaf volatiles Wikipedia URL: Green leaf volatiles Green leaf volatiles ( GLV ) are organic compounds released by plants. Some of these chemicals function as signaling compounds between either plants of the same species, of other species, or even different lifeforms like insects. Pathway for biosynthesis of the GLV cis-3-hexenal from linolenic acid . The first step involves formation of the hydroperoxide by the action of a lipoxygenase . Subsequently a hydroperoxide lyase induces formation of the hemiacetal, the precursor to a volatile C6 compound."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "oids", "label": "oids", "shape": "dot", "size": 10, "title": "search term: oids Wikipedia URL: Oids Oids is a multidirectional shooter developed and self-published by FTL Games in 1987. The game was originally released on the Atari ST , followed by a B\u0026W version for the classic 68k Macintosh in 1990. The Atari ST version, written by Dan Hewitt, was a cult favourite in the UK , where it received rave reviews."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "host plants", "label": "host plants", "shape": "dot", "size": 10, "title": "search term: host plants Wikipedia URL: host plants The page \" Host plants \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "olfactometer assays", "label": "olfactometer assays", "shape": "dot", "size": 10, "title": "search term: olfactometer assays Wikipedia URL: olfactometer assays The page \" Olfactometer assays \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "lower volatility", "label": "lower volatility", "shape": "dot", "size": 10, "title": "search term: lower volatility Wikipedia URL: lower volatility The page \" Lower volatility \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "taste", "label": "taste", "shape": "dot", "size": 16, "title": "search term: taste Wikipedia URL: Taste The gustatory system or sense of taste is the sensory system that is partially responsible for the perception of taste. Taste is the perception stimulated when a substance in the mouth reacts chemically with taste receptor cells located on taste buds in the oral cavity , mostly on the tongue . Taste, along with the sense of smell and trigeminal nerve stimulation (registering texture, pain, and temperature), determines flavors of food and other substances. Humans have taste receptors on taste buds and other areas, including the upper surface of the tongue and the epiglottis . The gustatory cortex is responsible for the perception of taste. Taste bud"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Drosophila melanogaster", "label": "Drosophila melanogaster", "shape": "dot", "size": 10, "title": "search term: Drosophila melanogaster Wikipedia URL: Drosophila melanogaster Drosophila melanogaster is a species of fly (an insect of the order Diptera) in the family Drosophilidae . The species is often referred to as the fruit fly or lesser fruit fly , or less commonly the \" vinegar fly\", \" pomace fly\", or \" banana fly\". In the wild, D. melanogaster is attracted to rotting fruit and fermenting beverages and often is found in orchards, kitchens, and pubs. View from above"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Tenthredinidae", "label": "Tenthredinidae", "shape": "dot", "size": 12, "title": "search term: Tenthredinidae Wikipedia URL: Tenthredinidae  was published in the journal Ecology by the Ecological Society of America . The phenomenon was first noticed in milkweed butterflies that were attacking caterpillars and drinking their internal liquid, proposedly to obtain toxic alkaloids used for defense, as well as for mating purposes. A group of danaine butterflies feeding on the caterpillar of Idea blanchardii blanchardii . From left to right: Euploea algea kirbyi , Ideopsis juventa tontoliensis , Danaus ismare ismare ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "semiochemical perception", "label": "semiochemical perception", "shape": "dot", "size": 10, "title": "search term: semiochemical perception Wikipedia URL: semiochemical perception The page \" Semiochemical perception \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "long distance responsiveness", "label": "long distance responsiveness", "shape": "dot", "size": 10, "title": "search term: long distance responsiveness Wikipedia URL: long distance responsiveness The page \" Long distance responsiveness \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Saw", "label": "Saw", "shape": "dot", "size": 10, "title": "search term: Saw Wikipedia URL: Saw A saw is a tool consisting of a tough blade , wire , or chain with a hard toothed edge used to cut through material . Various terms are used to describe toothed and abrasive saws ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Surfaces washes", "label": "Surfaces washes", "shape": "dot", "size": 10, "title": "search term: Surfaces washes Wikipedia URL: Surfaces washes The esophyll is present on both sides and the leaves are said to be isobilateral. The leaf is an integral part of the stem system, and most leaves are flattened and have distinct upper ( adaxial ) and lower ( abaxial ) surfaces that differ in color, hairiness , the number of stomata (pores that intake and output gases), the amount and structure of epicuticular wax , and other features. Leaves are mostly green in color due to the presenc"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "exposed conspecifics", "label": "exposed conspecifics", "shape": "dot", "size": 10, "title": "search term: exposed conspecifics Wikipedia URL: exposed conspecifics The page \" Exposed conspecifics \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "chemical phenotype", "label": "chemical phenotype", "shape": "dot", "size": 10, "title": "search term: chemical phenotype Wikipedia URL: chemical phenotype The page \" Chemical phenotype \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "laboratory culture", "label": "laboratory culture", "shape": "dot", "size": 10, "title": "search term: laboratory culture Wikipedia URL: laboratory culture The page \" Laboratory culture \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Sinapis alba", "label": "Sinapis alba", "shape": "dot", "size": 10, "title": "search term: Sinapis alba Wikipedia URL: Sinapis alba White mustard ( Sinapis alba ), also called yellow mustard , is an annual plant of the cabbage family . It is sometimes also referred to as Brassica alba or B. hirta . It is native to the Mediterranean region , Europe and Asia Tropical , but is now widespread worldwide. Grown for its seeds, it is used to make the condiment mustard , as a fodder crop, or as a green manure ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Brassica rapa", "label": "Brassica rapa", "shape": "dot", "size": 12, "title": "search term: Brassica rapa Wikipedia URL: Brassica rapa Brassica rapa is an annual to biennial plant species native to Eurasia that is from the Brassicaceae family . It has been widely cultivated into many forms, including the turnip (a root vegetable ), komatsuna , Chinese cabbage , bomdong , pak choi / bok choy , and rapini . Its domesticated forms include turnips and leafy greens, such as bok choy and napa cabbage. The oilseed types are grown for food and industrial uses. Genetic studies indicate that B. rapa was one of the earliest domesticated brassicas, with turnip-like forms arising first and additional morphotypes developing independently across Eurasia. Wild, feral, and cultivated populations are found worldwide, making the species important agriculturally, economically, and ecologically."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "university", "label": "university", "shape": "dot", "size": 10, "title": "search term: university Wikipedia URL: University A university (from Latin universitas \u0027 a whole \u0027 ) is an institution of tertiary education and research which awards academic degrees in several academic disciplines . University is derived from the Latin phrase universitas magistrorum et scholarium , which roughly means \"community of teachers and scholars\". Universities typically offer both undergraduate and postgraduate programs. Alma Mater by Daniel Chester French , Columbia University . The alma mater , meaning \"nourishing mother\" in Latin, is one of the most enduring symbols of the university. The phrase is associated with the University of Bologna , Italy , founded in 1088."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "night cycle", "label": "night cycle", "shape": "dot", "size": 10, "title": "search term: night cycle Wikipedia URL: night cycle The page \" Night cycle \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "volatile perception", "label": "volatile perception", "shape": "dot", "size": 10, "title": "search term: volatile perception Wikipedia URL: volatile perception The page \" Volatile perception \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "base tube length", "label": "base tube length", "shape": "dot", "size": 10, "title": "search term: base tube length Wikipedia URL: base tube length The page \" Base tube length \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Teflon tubing", "label": "Teflon tubing", "shape": "dot", "size": 10, "title": "search term: Teflon tubing Wikipedia URL: Teflon tubing The page \" Teflon tubing \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "air pump", "label": "air pump", "shape": "dot", "size": 10, "title": "search term: air pump Wikipedia URL: Air pump An air pump is a pump for pushing air. Examples include a bicycle pump , pumps that are used to aerate an aquarium or a pond via an airstone ; a gas compressor used to power a pneumatic tool , air horn or pipe organ ; a bellows used to encourage a fire; a vacuum cleaner and a vacuum pump . All air pumps contain a part that moves (vane, piston, impeller, diaphragm etc.) which drives the flow of air. When the air gets moved, an area of low pressure gets created which fills up with more air. Boyle\u0027s air pump"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Side panels", "label": "Side panels", "shape": "dot", "size": 10, "title": "search term: Side panels Wikipedia URL: Side panels The page \" Side panels \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "external stimuli", "label": "external stimuli", "shape": "dot", "size": 10, "title": "search term: external stimuli Wikipedia URL: external stimuli The page \" External stimuli \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "acetone", "label": "acetone", "shape": "dot", "size": 10, "title": "search term: acetone Wikipedia URL: Acetone Acetone ( 2-propanone or dimethyl ketone ) is an organic compound with the formula (CH 3 ) 2 CO . It is the simplest and smallest ketone ( R\u2212C(=O)\u2212R\u0027 ). It is a colorless, highly volatile , and flammable liquid with a characteristic pungent odor."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "200 \u00b0C", "label": "200 \u00b0C", "shape": "dot", "size": 10, "title": "search term: 200 \u  Analysis", "shape": "dot", "size": 10, "title": "search term: Statistical Analysis Wikipedia URL: Statistical Analysis Statistics (from German : Statistik , orig. \"description of a state , a country\") is the discipline that concerns the collection, organization, analysis, interpretation, and presentation of data . In applying statistics to a scientific, industrial, or social problem, it is conventional to begin with a statistical population or a statistical model to be studied. Populations can be diverse groups of people or objects such as \"all people living in a country\" or \"every atom composing a crystal\". Statistics deals with every aspect of data, including the planning of data collection in terms of the design of surveys and experiments . The normal distribution , a very common probability density , is used extensively in inferential statistics ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "paired data", "label": "paired data", "shape": "dot", "size": 10, "title": "search term: paired data Wikipedia URL: Paired data Scientific experiments often require comparing two (or more) sets of data. In some cases, the data sets are paired , meaning there is an obvious and meaningful one-to-one correspondence between the data in the first set and the data in the second set, compare Blocking (statistics) ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "metaMDS function", "label": "metaMDS function", "shape": "dot", "size": 10, "title": "search term: metaMDS function Wikipedia URL: metaMDS function The page \" MetaMDS function \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "fatty alcohol", "label": "fatty alcohol", "shape": "dot", "size": 10, "title": "search term: fatty alcohol Wikipedia URL: Fatty alcohol Fatty alcohols (or long-chain alcohols ) are usually high-molecular mass, straight-chain primary alcohols , but can also range from as few as 4\u20136 carbon atoms to as many as 22\u201326, derived from natural fats and oils. The precise chain length varies with the source. Some commercially important fatty alcohols are lauryl , stearyl , and oleyl alcohol . They are colourless oily liquids (for smaller carbon numbers) or waxy solids, although impure samples may appear yellow. Fatty alcohols usually have an even number of carbon atoms and a single alcohol group (\u2013OH) attached to the terminal carbon. Some are unsaturated and some are branched. They are widely used in industry. As with fatty acids, they are often referred to generically by the number of carbon atoms in the molecule, such as \"a C 12 alcohol\", that is an alcohol having 12 carbon atoms, for example dodecanol . An example of a fatty alcohol, oleyl alcohol"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "male washes", "label": "male washes", "shape": "dot", "size": 10, "title": "search term: male washes Wikipedia URL: male washes The page \" Male washes \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Female surface compositions", "label": "Female surface compositions", "shape": "dot", "size": 10, "title": "search term: Female surface compositions Wikipedia URL: Female surface compositions The page \" Female surface compositions \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "group centroids", "label": "group centroids", "shape": "dot", "size": 10, "title": "search term: group centroids Wikiped s a species of fly in the family Muscidae . It is a pest of the wheat plant, Triticum aestivum , and has also been known to affect maize crops."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "taxonomic groups", "label": "taxonomic groups", "shape": "dot", "size": 12, "title": "search term: taxonomic groups Wikipedia URL: Taxonomic groups In biology , taxonomy (from Ancient Greek \u03c4\u03ac\u03be\u03b9\u03c2 ( taxis ) \u0027 arrangement \u0027 and -\u03bd\u03bf\u03bc\u03af\u03b1 ( -nomia ) \u0027 method \u0027 ) is the scientific study of naming, defining ( circumscribing ) and classifying groups of biological organisms based on shared characteristics. Organisms are grouped into taxa (singular: taxon), and these groups are given a taxonomic rank ; groups of a given rank can be aggregated to form a more inclusive group of higher rank, thus creating a taxonomic hierarchy. The principal ranks in modern use are domain , kingdom , phylum ( division is sometimes used in botany in place of phylum ), class , order , family , genus , and species . The Swedish botanist Carl Linnaeus is regarded as the founder of the current system of taxonomy, having developed a ranked system known as Linnaean taxonomy for categorizing organisms. Description of rare animals (\u5199\u751f\u73cd\u79bd\u56fe), by Song dynasty painter Huang Quan (903\u2013965)"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "hexane", "label": "hexane", "shape": "dot", "size": 10, "title": "search term: hexane Wikipedia URL: Hexane Hexane ( / \u02c8 h \u025b k s e\u026a n / ) or n -hexane is an organic compound , a straight-chain alkane with six carbon atoms and the molecular formula C 6 H 14 ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Extracts", "label": "Extracts", "shape": "dot", "size": 10, "title": "search term: Extracts Wikipedia URL: Extracts An extract (essence) is a substance made by extracting a part of a raw material , often by using a solvent such as ethanol , oil or water . Extracts may be sold as tinctures or absolutes or dried and powdered. Vanilla extract"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "cinctus", "label": "cinctus", "shape": "dot", "size": 10, "title": "search term: cinctus Wikipedia URL: cinctus The page \" Cinctus \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "sexual dimorphism", "label": "sexual dimorphism", "shape": "dot", "size": 16, "title": "search term: sexual dimorphism Wikipedia URL: Sexual dimorphism Sexual dimorphism is the condition where different sexes of the same species exhibit different morphological characteristics, including characteristics not directly involved in reproduction . The condition occurs in most dioecious species, which consist of most animals and some plants. Differences may include secondary sex characteristics , size, weight, color, markings, or behavioral or cognitive traits. Male-male reproductive competition has evolved a diverse array of sexually dimorphic traits. Aggressive utility traits such as \"battle\" teeth and blunt heads reinforced as battering rams are used as weapons in aggressive interactions between rivals. Passive displays such as ornamental feathering or song-calling have also evolved mainly through sexual selection. These differences may be subtle or exaggerated and may be subjected to sexual selection and natural selection . The opposite of dimorphism is monomorphism , when b"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "higher dispersion", "label": "higher dispersion", "shape": "dot", "size": 10, "title": "search term: higher dispersion Wikipedia URL: higher dispersion The page \" Higher dispersion \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "selective pressures", "label": "selective pressures", "shape": "dot", "size": 10, "title": "search term: selective pressures Wikipedia URL: selective pressures The page \" Selective pressures \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "mating opportunities", "label": "mating opportunities", "shape": "dot", "size": 10, "title": "search term: mating opportunities Wikipedia URL: mating opportunities The page \" Mating opportunities \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "sexual selection", "label": "sexual selection", "shape": "dot", "size": 20, "title": "search term: sexual selection Wikipedia URL: Sexual selection Sexual selection is a mechanism of evolution in which members of one sex chooses mates of the other sex (intersexual selection) to mate with, and compete with members of the same sex for access to members of the opposite sex (intrasexual selection). These two forms of selection mean that some individuals have greater reproductive success than others within a population , for example because they are more attractive or prefer more attractive partners to produce offspring . Successful males benefit from frequent mating and monopolizing access to one or more fertile females. Females can maximise the return on the energy they invest in reproduction by selecting and mating with the best males. Sexual selection creates colourful differences between sexes in Goldie\u0027s bird-of-paradise eding stimulation The page \" Feeding stimulation \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "addictive behavior", "label": "addictive behavior", "shape": "dot", "size": 12, "title": "search term: addictive behavior Wikipedia URL: Addictive behavior An addictive behavior is a behavior, or a stimulus related to a behavior (e.g., sex or food), that is both rewarding and reinforcing , and is associated with the development of an addiction . There are two main forms of addiction: substance use disorders (including alcohol, tobacco, and cannabis) and behavioral addiction (including sex, gambling, eating, and shoplifting). The parallels and distinctions between behavioral addictions and other compulsive behavior disorders like bulimia nervosa and obsessive-compulsive disorder (OCD) are still being researched by behavioral scientists."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "actory senses", "label": "actory senses", "shape": "dot", "size": 10, "title": "search term: actory senses Wikipedia URL: actory senses The page \" Actory senses \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search result below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "visual cue", "label": "visual cue", "shape": "dot", "size": 10, "title": "search term: visual cue Wikipedia URL: visual cue The page \" Visual cue \" does not exist. You can create a draft and submit it for review or request that a redirect be created , but consider checking the search results below to see whether the topic is already covered."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "olfactory antennal sensilla", "label": "olfactory anten
