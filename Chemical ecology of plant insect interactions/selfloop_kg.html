u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emetabolic pathways\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: metabolic pathways Wikipedia URL: Metabolic pathways In biochemistry , a metabolic pathway is a linked series of chemical reactions occurring within a cell . The reactants , products, and intermediates of an enzymatic reaction are known as metabolites , which are modified by a sequence of chemical reactions catalyzed by enzymes . In most cases of a metabolic pathway, the product of one enzyme acts as the substrate for the next. However, side products are considered waste and removed...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "metabolic waste", "label": "metabolic waste", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/7c/Anatomytool_Male_and_female_urinary_tract_English.jpg/250px-Anatomytool_Male_and_female_urinary_tract_English.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emetabolic waste\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: metabolic waste Wikipedia URL: Metabolic waste Metabolic wastes or excrements are substances left over from metabolic processes (such as cellular respiration ) which cannot be used by the organism (they are surplus or toxic ), and must therefore be excreted . This includes nitrogen compounds, water , CO 2 , phosphates , sulphates , etc. Animals treat these compounds as excretes. Plants have metabolic pathways which transform some of them (primarily the oxygen compounds) into useful ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "metabolites", "label": "metabolites", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emetabolites\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: metabolites Wikipedia URL: Metabolites In biochemistry , a metabolite is an intermediate or end product of metabolism . The term is usually used for small molecules . Metabolites have various functions, including fuel, structure, signaling, stimulatory and inhibitory effects on enzymes , catalytic activity of their own (usually as a cofactor to an enzyme), defense, and interactions with other organisms (e.g. pigments , odorants , and pheromones ).\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "metabolomics", "label": "metabolomics", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/b8/The_central_dogma_of_biology_showing_the_flow_of_information_from_DNA_to_the_phenotype._Associated_with_each_stage_is_the_corresponding_systems_biology_tool_from_genomics_to_genomics_to_metabolomics.png/250px-thumbnail.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emetabolomics\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: metabolomics Wikipedia URL: Metabolomics Metabolomics is the scientific study of chemical processes involving metabolites , the small molecule substrates, intermediates, and products of cell metabolism . Specifically, metabolomics is the \"systematic study of the unique chemical fingerprints that specific cellular processes leave behind\", the study of their small-molecule metabolite profiles. The metabolome represents the complete set of metabolites in a biological cell, tissue, orga...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Metasequoia", "label": "Metasequoia", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/Metasequoia_glyptostroboides_in_Forest_park_of_Aichi_Prefecture.jpg/250px-Metasequoia_glyptostroboides_in_Forest_park_of_Aichi_Prefecture.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eMetasequoia\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Metasequoia Wikipedia URL: Metasequoia Metasequoia , or dawn redwood , is a genus of fast-growing coniferous trees. It contains one extant (living) species, Metasequoia glyptostroboides , which is one of three extant species of conifers known as redwoods in the world. Metasequoia glyptostroboides is native to Lichuan county in Hubei , China. Although the shortest of the redwoods , it grows to at least 165 feet (50 meters) in height. Local villagers refer to the original tree from wh...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Metasequoia glyptostroboides", "label": "Metasequoia glyptostroboides", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/Metasequoia_glyptostroboides_in_Forest_park_of_Aichi_Prefecture.jpg/250px-Metasequoia_glyptostroboides_in_Forest_park_of_Aichi_Prefecture.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eMetasequoia glyptostroboides\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Metasequoia glyptostroboides Wikipedia URL: Metasequoia glyptostroboides Metasequoia glyptostroboides , the dawn redwood , is a fast-growing, endangered deciduous conifer . It is the sole living species of the genus Metasequoia , one of three genera in the subfamily Sequoioideae of the family Cupressaceae. It now survives in the wild only in wet lower slopes and montane river and stream valleys in the border region of Hubei and Hunan provinces and Chongqing municipality in south-cen...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Methodology", "label": "Methodology", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/STARR-seq_Methodology.jpg/250px-STARR-seq_Methodology.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eMethodology\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Methodology Wikipedia URL: Methodology In its most common sense, methodology is the study of research methods. However, the term can also refer to the methods themselves or to the philosophical discussion of associated background assumptions. A method is a structured procedure for bringing about a certain goal, like acquiring knowledge or verifying knowledge claims. This normally involves various steps, like choosing a sample , collecting data from this sample, and interpreting the ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "microbial communities", "label": "microbial communities", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emicrobial communities\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: microbial communities Wikipedia URL: Microbial communities Microbial population biology is the application of the principles of population biology to microorganisms .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Microbiomes", "label": "Microbiomes", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/Microbiome_as_microbiota_plus_their_theatre_of_activity.webp/960px-Microbiome_as_microbiota_plus_their_theatre_of_activity.webp.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eMicrobiomes\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Microbiomes Wikipedia URL: Microbiomes A microbiome (from Ancient Greek \u03bc\u03b9\u03ba\u03c1\u03cc\u03c2 (mikr\u00f3s) \u0027 small \u0027 and \u03b2\u03af\u03bf\u03c2 (b\u00edos) \u0027 life \u0027 ) is the community of microorganisms that can usually be found living together in any given habitat . It was defined more precisely in 1988 by Whipps et al. as \"a characteristic microbial community occupying a reasonably well-defined habitat which has distinct physio-chemical properties. The term thus not only refers to the microorganisms involved but also encom...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "microbiota", "label": "microbiota", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/The_plant_microbiome.jpg/500px-The_plant_microbiome.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emicrobiota\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: microbiota Wikipedia URL: Microbiota Microbiota are the range of microorganisms that may be commensal , mutualistic , or pathogenic found in and on all multicellular organisms , including plants . Microbiota include bacteria , archaea , protists , fungi , and viruses , and have been found to be crucial for immunologic, hormonal, and metabolic homeostasis of their host. Diverse microbial communities of characteristic microbiota are part of plant microbiomes , and are found on the out...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "microorganisms", "label": "microorganisms", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/bc/E_coli_at_10000x%2C_original.jpg/500px-E_coli_at_10000x%2C_original.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emicroorganisms\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: microorganisms Wikipedia URL: Microorganisms A microorganism , or microbe , is an organism of microscopic size, which may exist in its single-celled form or as a colony of cells . The possible existence of unseen microbial life was suspected from antiquity, with an early attestation in Jain literature authored in 6th-century BC India. The scientific study of microorganisms began with their observation under the microscope in the 1670s by Anton van Leeuwenhoek . In the 1850s, Louis P...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "midgut", "label": "midgut", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/3d/Illu_small_intestine.jpg/330px-Illu_small_intestine.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emidgut\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: midgut Wikipedia URL: Midgut The midgut is the portion of the human embryo from which almost all of the small intestine and approximately half of the large intestine develop. After it bends around the superior mesenteric artery , it is called the \"midgut loop\". It comprises the portion of the alimentary canal from the end of the foregut at the opening of the bile duct to the hindgut , about two-thirds of the way through the transverse colon. In addition to representing an important ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "mimicry", "label": "mimicry", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/Wasp_mimicry.jpg/330px-Wasp_mimicry.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emimicry\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: mimicry Wikipedia URL: Mimicry In evolutionary biology , mimicry is the evolved resemblance of an organism to something else, often another organism of a different species. Mimicry may evolve between different species, or between individuals of the same species. In the simplest case, as in Batesian mimicry , a mimic resembles a model, so as to deceive a dupe, all three being of different species. A Batesian mimic, such as a hoverfly , is harmless, while its model, such as a wasp , i...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "mites", "label": "mites", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/8d/Trombidium_holosericeum_%28aka%29.jpg/250px-Trombidium_holosericeum_%28aka%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emites\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: mites Wikipedia URL: Mites Mites are small arachnids (eight-legged arthropods ) of two large orders, the Acariformes and the Parasitiformes , which were historically grouped together in the subclass Acari . However, most recent genetic analyses do not recover the two as each other\u0027s closest relative within Arachnida, rendering the group invalid as a clade . Most mites are tiny, less than 1 mm (0.04 in) in length, and have a simple, unsegmented body plan. The small size of most speci...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "molecular ecology", "label": "molecular ecology", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/74/Serratia_marcescens%2C_Micrococcus_luteus_and_Staphylococcus_epidermidis.jpg/250px-Serratia_marcescens%2C_Micrococcus_luteus_and_Staphylococcus_epidermidis.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emolecular ecology\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: molecular ecology Wikipedia URL: Molecular ecology Molecular ecology is a subdiscipline of ecology that is concerned with applying molecular genetic techniques to ecological questions (e.g., population structure, phylogeography, conservation, speciation, hybridization, biodiversity). It is virtually synonymous with the field of \" Ecological Genetics \" as pioneered by Theodosius Dobzhansky , E. B. Ford , Godfrey M. Hewitt , and others. Molecular ecology is related to the fields of po...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "molecular physiology", "label": "molecular physiology", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/dc/Omics-en.svg/250px-Omics-en.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emolecular physiology\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: molecular physiology Wikipedia URL: Molecular physiology Systems biology is the computational and mathematical analysis and modeling of complex biological systems . It is a biology -based interdisciplinary field of study that focuses on complex interactions within biological systems, using a holistic approach ( holism instead of the more traditional reductionism ) to biological research. This multifaceted research domain necessitates the collaborative efforts of chemists, biologists...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Monochamus saltuarius", "label": "Monochamus saltuarius", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/ef/Monochamus_saltuarius.jpg/250px-Monochamus_saltuarius.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eMonochamus saltuarius\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Monochamus saltuarius Wikipedia URL: Monochamus saltuarius Monochamus saltuarius is a species of beetle in the family Cerambycidae . It was described by Gebler in 1830. It has a wide distribution throughout Europe . It measures between 11 and 19 mm (0.43 and 0.75 in).\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "morphology", "label": "morphology", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emorphology\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: morphology Wikipedia URL: Morphology Morphology , from the Greek and meaning \"study of shape\", may refer to:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "movement", "label": "movement", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emovement\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: movement Wikipedia URL: Movement Movement may refer to:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Multiple", "label": "Multiple", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eMultiple\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Multiple Wikipedia URL: Multiple Multiple may refer to:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "mushroom body", "label": "mushroom body", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/dd/Drosophila_melanogaster_brain_expression_patterns.jpg/330px-Drosophila_melanogaster_brain_expression_patterns.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emushroom body\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: mushroom body Wikipedia URL: Mushroom body The mushroom bodies or corpora pedunculata are a pair of structures in the brain of arthropods , including insects and crustaceans , and some annelids (notably the ragworm Platynereis dumerilii ). They are known to play a role in olfactory learning and memory . In most insects, the mushroom bodies and the lateral horn are the two higher brain regions that receive olfactory information from the antennal lobe via projection neurons. They were...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "mutualism", "label": "mutualism", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emutualism\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: mutualism Wikipedia URL: Mutualism Mutualism may refer to:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Myzus persicae", "label": "Myzus persicae", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/11/Myzus_persicae.jpg/250px-Myzus_persicae.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eMyzus persicae\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Myzus persicae Wikipedia URL: Myzus persicae Myzus persicae , known as the green peach aphid , greenfly , or the peach-potato aphid , is a small green aphid belonging to the order Hemiptera . It is the most significant aphid pest of peach trees, causing decreased growth, shrivelling of the leaves and the death of various tissues. It also acts as a vector for the transport of plant viruses such as cucumber mosaic virus (CMV), potato virus Y (PVY) and tobacco etch virus (TEV). Potato ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "NADPH oxidase", "label": "NADPH oxidase", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/69/Figure_1._Overall_reaction_for_the_formation_of_superoxide_from_NADPH.png/500px-Figure_1._Overall_reaction_for_the_formation_of_superoxide_from_NADPH.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eNADPH oxidase\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: NADPH oxidase Wikipedia URL: NADPH oxidase NADPH oxidase (nicotinamide adenine dinucleotide phosphate oxidase) is a membrane-bound enzyme complex that faces the extracellular space. It can be found in the plasma membrane as well as in the membranes of phagosomes used by neutrophil white blood cells to engulf microorganisms. Human isoforms of the catalytic component of the complex include NOX1 , NOX2 , NOX3 , NOX4 , NOX5 , DUOX1 , and DUOX2 . Overall reaction for the formation of sup...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "natural enemies", "label": "natural enemies", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/44/Syrphid.maggot3554.5.13.08cw.jpg/250px-Syrphid.maggot3554.5.13.08cw.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003enatural enemies\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: natural enemies Wikipedia URL: Natural enemies Biological control or biocontrol is a method of controlling pests , whether pest animals such as insects and mites , weeds , or pathogens affecting animals or plants by using other organisms . It relies on predation , parasitism , herbivory , or other natural mechanisms, but typically also involves an active human management role. It can be an important component of integrated pest management (IPM) programs. Invertebrates and other macr...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Nezara viridula", "label": "Nezara viridula", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Nezara_viridula_MHNT_verte.jpg/250px-Nezara_viridula_MHNT_verte.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eNezara viridula\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Nezara viridula Wikipedia URL: Nezara viridula Nezara viridula , commonly known as the southern green stink bug (USA), southern green shield bug (UK) or green vegetable bug (Australia and New Zealand), is a plant-feeding stink bug . Believed to have originated in Ethiopia , it can now be found across the world. Because of its preference for certain species of legumes , such as beans and soybeans , it is an economically important pest on such crops.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Nilaparvata lugens", "label": "Nilaparvata lugens", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/d1/Nilaparvata_lugens_439632934.jpg/250px-Nilaparvata_lugens_439632934.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eNilaparvata lugens\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Nilaparvata lugens Wikipedia URL: Nilaparvata lugens The brown planthopper ( BPH ), Nilaparvata lugens (St\u00e5l) (Hemiptera: Delphacidae) is a planthopper species that feeds on rice plants ( Oryza sativa L.). These insects are among the most important pests of rice, which is the major staple crop for about half the world\u0027s population. They damage rice directly through feeding and also by transmitting two viruses, rice ragged stunt virus and rice grassy stunt virus . Up to 60% yield los...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "nitrogen fixation", "label": "nitrogen fixation", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/fe/Nitrogen_Cycle.svg/330px-Nitrogen_Cycle.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003enitrogen fixation\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: nitrogen fixation Wikipedia URL: Nitrogen fixation Nitrogen fixation is a chemical process by which molecular dinitrogen ( N 2 ) is converted into ammonia ( NH 3 ). It occurs both biologically and abiologically in chemical industries . Biological nitrogen fixation or diazotrophy is catalyzed by enzymes called nitrogenases . These enzyme complexes are encoded by the Nif genes (or Nif homologs ) and contain iron , often with a second metal (usually molybdenum , but sometimes vanadium ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Non-metric multidimensional scaling", "label": "Non-metric multidimensional scaling", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://wikimedia.org/api/rest_v1/media/math/render/svg/cc6e1f880981346a604257ebcacdef24c0aca2d6\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eNon-metric multidimensional scaling\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Non-metric multidimensional scaling Wikipedia URL: Non-metric multidimensional scaling Multidimensional scaling ( MDS ) is a means of visualizing the level of similarity of individual cases of a data set. MDS is used to translate distances between each pair of n {\\textstyle n} objects in a set into a configuration of n {\\textstyle n} points mapped into an abstract Cartesian space . An example of classical multidimensional scaling applied to voting patterns in the United States House...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "nutritional", "label": "nutritional", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/f5/Close_wing_posture_of_Amblypodia_anita_%28Hewitson%2C_1862%29_-_Purple_Leaf_Blue_%28Male%29_gathering_nutrients_from_bird_dropping_WLB.jpg/500px-Close_wing_posture_of_Amblypodia_anita_%28Hewitson%2C_1862%29_-_Purple_Leaf_Blue_%28Male%29_gathering_nutrients_from_bird_dropping_WLB.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003enutritional\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: nutritional Wikipedia URL: Nutritional Nutrition is the biochemical and physiological process by which an organism uses food and water to support its life . The intake of these substances provides organisms with nutrients (divided into macro- and micro- ) which can be metabolized to create energy and chemical structures; too much or too little of an essential nutrient can cause malnutrition . Nutritional science , the study of nutrition as a hard science , typically emphasizes human...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "odors", "label": "odors", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/67/Jan_Brueghel_d._O._-_Allegorie_van_de_geur.jpg/330px-Jan_Brueghel_d._O._-_Allegorie_van_de_geur.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eodors\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: odors Wikipedia URL: Odors An odor ( American English ) or odour ( Commonwealth English ; see spelling differences ) is a smell or a scent caused by one or more volatilized chemical compounds generally found in low concentrations that humans and many animals can perceive via their olfactory system . While smell can refer to pleasant and unpleasant odors, the terms scent , aroma , and fragrance are usually reserved for pleasant-smelling odors and are frequently used in the food and c...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "oids", "label": "oids", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/en/thumb/e/e7/Oids_Coverart.png/250px-Oids_Coverart.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eoids\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: oids Wikipedia URL: Oids Oids is a multidirectional shooter developed and self-published by FTL Games in 1987. The game was originally released on the Atari ST , followed by a B\u0026W version for the classic 68k Macintosh in 1990. The Atari ST version, written by Dan Hewitt, was a cult favourite in the UK , where it received rave reviews.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "olfaction", "label": "olfaction", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/81/David_Ryckaert_%28III%29_-_Old_women_smelling_a_carnation_%28Allegory_of_smell%29.jpg/330px-David_Ryckaert_%28III%29_-_Old_women_smelling_a_carnation_%28Allegory_of_smell%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eolfaction\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: olfaction Wikipedia URL: Olfaction The sense of smell , or olfaction , is the special sense through which smells (or odors ) are perceived. The sense of smell has many functions, including detecting desirable foods, hazards, and pheromones , and plays a role in taste.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "open access article", "label": "open access article", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/77/Open_Access_logo_PLoS_transparent.svg/250px-Open_Access_logo_PLoS_transparent.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eopen access article\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: open access article Wikipedia URL: Open access article Open access ( OA ) is a set of principles and a range of practices through which nominally copyrightable publications are delivered to readers free of access charges or other barriers. With open access strictly defined (according to the 2001 definition), or libre open access, barriers to copying or reuse are also reduced or removed by applying an open license for copyright, which regulates post-publication uses of the work. Open...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "oph", "label": "oph", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/65/Ophiuchus_IAU.svg/330px-Ophiuchus_IAU.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eoph\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: oph Wikipedia URL: Oph Ophiuchus ( / \u02cc \u0252 f i \u02c8 ju\u02d0 k \u0259 s / ) is a large constellation straddling the celestial equator . Its name comes from the Ancient Greek \u1f40\u03c6\u03b9\u03bf\u1fe6\u03c7\u03bf\u03c2 ( ophio\u00fbkhos ), meaning \"serpent-bearer\", and it is commonly represented as a man grasping a snake. The serpent is represented by the constellation Serpens . Ophiuchus was one of the 48 constellations listed by the 2nd-century astronomer Ptolemy , and it remains one of the 88 modern constellations . An old alternative...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "oral bacteria", "label": "oral bacteria", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Oral_thrush_Aphthae_Candida_albicans._PHIL_1217_lores.jpg/250px-Oral_thrush_Aphthae_Candida_albicans._PHIL_1217_lores.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eoral bacteria\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: oral bacteria Wikipedia URL: Oral bacteria Oral microbiology is the study of the microorganisms (microbiota) of the oral cavity and their interactions between oral microorganisms or with the host. The environment present in the human mouth is suited to the growth of characteristic microorganisms found there. It provides a source of water and nutrients, as well as a moderate temperature. Resident microbes of the mouth adhere to the teeth and gums to resist mechanical flushing from th...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Organic Compounds", "label": "Organic Compounds", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/9/92/Methane-2D-stereo.svg/250px-Methane-2D-stereo.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eOrganic Compounds\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Organic Compounds Wikipedia URL: Organic Compounds Organic compounds are a subclass of chemical compounds of carbon . Little consensus exists among chemists on the exact definition of organic compound; the only universally accepted definition is the quasi-tautological \"organic compounds are the subject matter of organic chemistry \". Methane ( CH 4 ) is among the simplest organic compounds.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "organisms", "label": "organisms", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/8b/Basilikumwurzling.jpg/250px-Basilikumwurzling.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eorganisms\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: organisms Wikipedia URL: Organisms An organism is any living thing that functions as an individual . Such a definition raises more problems than it solves, not least because the concept of an individual is also difficult. Several criteria, few of which are widely accepted, have been proposed to define what constitutes an organism. Among the most common is that an organism has autonomous reproduction , growth , and metabolism . This would exclude viruses , even though they evolve lik...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "oviposition", "label": "oviposition", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/GrassHopperOviPositor.jpg/250px-GrassHopperOviPositor.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eoviposition\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: oviposition Wikipedia URL: Oviposition The ovipositor is a tube-like organ used by some animals , especially insects , for the laying of eggs . In insects, an ovipositor consists of a maximum of three pairs of appendages. The details and morphology of the ovipositor vary, but typically its form is adapted to functions such as preparing a place for the egg, transmitting the egg, and then placing it properly. For most insects, the organ is used merely to attach the egg to some surface...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "oxidative stress", "label": "oxidative stress", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/7c/Free_Radical_Toxicity.svg/500px-Free_Radical_Toxicity.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eoxidative stress\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: oxidative stress Wikipedia URL: Oxidative stress Oxidative stress reflects an imbalance between the systemic manifestation of reactive oxygen species and a biological system\u0027s ability to readily detoxify the reactive intermediates or to repair the resulting damage. Disturbances in the normal redox state of cells can cause toxic effects through the production of peroxides and free radicals that damage all components of the cell, including proteins , lipids , and DNA . Oxidative stres...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "paired data", "label": "paired data", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epaired data\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: paired data Wikipedia URL: Paired data Scientific experiments often require comparing two (or more) sets of data. In some cases, the data sets are paired , meaning there is an obvious and meaningful one-to-one correspondence between the data in the first set and the data in the second set, compare Blocking (statistics) .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "palps", "label": "palps", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Pedipalp_in_green.png/250px-Pedipalp_in_green.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epalps\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: palps Wikipedia URL: Palps Pedipalps (commonly shortened to palps or palpi ) are the secondary pair of forward appendages among chelicerates \u2013 a group of arthropods including spiders , scorpions , horseshoe crabs , and sea spiders . The pedipalps are lateral to the chelicerae (\"jaws\") and anterior to the first pair of walking legs. Green-shaded pedipalps in an illustrated dorsal view of a whip scorpion\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Parafilm", "label": "Parafilm", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/Parafilm.jpg/250px-Parafilm.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eParafilm\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Parafilm Wikipedia URL: Parafilm Parafilm is a semi-transparent, flexible film composed of a blend of waxes and polyolefins . It is a ductile , malleable , non-toxic, tasteless, odorless , and self-sealing thermoplastic . It has been manufactured by the company Amcor since its acquisition of Bemis Company, Inc in 2018. It comes in two colors, natural (colorless) and purple. A carton box with Parafilm.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "parasitoid", "label": "parasitoid", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/0/04/CSIRO_ScienceImage_2357_Spotted_alfalfa_aphid_being_attacked_by_parasitic_wasp.jpg/330px-CSIRO_ScienceImage_2357_Spotted_alfalfa_aphid_being_attacked_by_parasitic_wasp.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eparasitoid\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: parasitoid Wikipedia URL: Parasitoid In evolutionary ecology , a parasitoid is an organism that lives in close association with its host at the host\u0027s expense, eventually resulting in the death of the host. Parasitoidism is one of six major evolutionary strategies within parasitism , distinguished by the fatal prognosis for the host, which makes the strategy close to predation . A parasitoid wasp ( Trioxys complanatus , Aphidiinae ) ovipositing into the body of a spotted alfalfa aph...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "parasitoid wasps", "label": "parasitoid wasps", "shape": "dot", "size": 13.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/1c/Ichneumon_wasp_%28Megarhyssa_macrurus_lunato%29_%287686081848%29.jpg/330px-Ichneumon_wasp_%28Megarhyssa_macrurus_lunato%29_%287686081848%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eparasitoid wasps\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: parasitoid wasps Wikipedia URL: Parasitoid wasps Parasitoid wasps are a large group of hymenopteran superfamilies , with all but the wood wasps ( Orussoidea ) being in the wasp-waisted Apocrita . As parasitoids , they lay their eggs on or in the bodies of other arthropods , sooner or later causing the death of these hosts . Different species specialise in hosts from different insect orders, most often Lepidoptera , though some select beetles , flies , or bugs ; the spider wasps ( Po...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "pathogenic bacteria", "label": "pathogenic bacteria", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/8e/Neisseria_gonorrhoea_in_pus_-_Gram_stain.jpg/250px-Neisseria_gonorrhoea_in_pus_-_Gram_stain.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epathogenic bacteria\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: pathogenic bacteria Wikipedia URL: Pathogenic bacteria Pathogenic bacteria are bacteria that can cause disease . This article focuses on the bacteria that are pathogenic to humans. Most species of bacteria are harmless and many are beneficial but others can cause infectious diseases . The number of these pathogenic species in humans is estimated to be fewer than a hundred. By contrast, several thousand species are considered part of the gut flora , with a few hundred species present...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "pathogens", "label": "pathogens", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/29/Shigella_stool.jpg/330px-Shigella_stool.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epathogens\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: pathogens Wikipedia URL: Pathogens In biology , a pathogen ( Greek : \u03c0\u03ac\u03b8\u03bf\u03c2 , pathos \"suffering\", \"passion\" and -\u03b3\u03b5\u03bd\u03ae\u03c2 , -gen\u0113s \"producer of\"), in the oldest and broadest sense, is any organism , agent or micro-organism that can produce disease . A pathogen may also be referred to as an infectious agent , or simply a germ . A photomicrograph of a stool that has shigella dysentery. These bacteria typically cause foodborne illness.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "pectinase", "label": "pectinase", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epectinase\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: pectinase Wikipedia URL: Pectinase Pectinases are a group of enzymes that breaks down pectin , a polysaccharide found in plant cell walls, through hydrolysis, transelimination and deesterification reactions. Commonly referred to as pectic enzymes, they include pectolyase , pectozyme, and polygalacturonase , one of the most studied and widely used [ citation needed ] commercial pectinases. It is useful because pectin is the jelly-like matrix which helps cement plant cells together an...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "peptides", "label": "peptides", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/37/Drosomycin.svg/250px-Drosomycin.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epeptides\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: peptides Wikipedia URL: Peptides Peptides are short chains of amino acids linked by peptide bonds . A polypeptide is a longer, continuous, unbranched peptide chain. Polypeptides that have a molecular mass of 10,000 Da or more are called proteins . Chains of fewer than twenty amino acids are called oligopeptides , and include dipeptides , tripeptides , and tetrapeptides . Proteins are polypeptides, i.e. large peptides. Drosomycin , an example of a peptide\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Perception", "label": "Perception", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/46/Multistability.svg/250px-Multistability.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ePerception\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Perception Wikipedia URL: Perception Perception (from Latin perceptio \u0027 gathering, receiving \u0027 ) is the organization, identification, and interpretation of ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Photorhabdus luminescens", "label": "Photorhabdus luminescens", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/28/Photorhabdus_luminescens_%2801%29.tif/lossy-page1-250px-Photorhabdus_luminescens_%2801%29.tif.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ePhotorhabdus luminescens\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Photorhabdus luminescens Wikipedia URL: Photorhabdus luminescens Xenorhabdus luminescens\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "physiology", "label": "physiology", "shape": "dot", "size": 13.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/22/Claude_Bernard_and_his_pupils._Oil_painting_after_L%C3%A9on-Augus_Wellcome_V0017769.jpg/500px-Claude_Bernard_and_his_pupils._Oil_painting_after_L%C3%A9on-Augus_Wellcome_V0017769.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ephysiology\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: physiology Wikipedia URL: Physiology Physiology ( / \u02cc f \u026a z i \u02c8 \u0252 l \u0259 d\u0292 i / ; from Ancient Greek \u03c6\u03cd\u03c3\u03b9\u03c2 ( ph\u00fasis ) \u0027 nature, origin \u0027 and -\u03bb\u03bf\u03b3\u03af\u03b1 ( -log\u00eda ) \u0027 study of \u0027 ) is the scientific study of functions and mechanisms in a living system . As a subdiscipline of biology , physiology focuses on how organisms , organ systems , individual organs , cells , and biomolecules carry out chemical and physical functions in a living system. According to the classes of organisms , the field ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "phytochemicals", "label": "phytochemicals", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/ac/Berries.jpg/250px-Berries.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ephytochemicals\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: phytochemicals Wikipedia URL: Phytochemicals Phytochemicals are naturally occurring chemicals present in or extracted from plants . Some phytochemicals are nutrients for the plant, while others are metabolites produced to enhance plant survivability and reproduction. Red, blue, and purple colors of berries derive mainly from polyphenol phytochemicals called anthocyanins .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Phytochemistry", "label": "Phytochemistry", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ePhytochemistry\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Phytochemistry Wikipedia URL: Phytochemistry Phytochemistry is the study of phytochemicals , which are chemicals derived from plants . Phytochemists strive to describe the structures of the large number of secondary metabolites found in plants, the functions of these compounds in human and plant biology, and the biosynthesis of these compounds. Plants synthesize phytochemicals for many reasons, including to protect themselves against insect attacks and plant diseases . The compounds...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Picea abies", "label": "Picea abies", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/9/9d/Kuusk_Keila-Paldiski_rdt_%C3%A4%C3%A4res.jpg/250px-Kuusk_Keila-Paldiski_rdt_%C3%A4%C3%A4res.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ePicea abies\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Picea abies Wikipedia URL: Picea abies Picea abies , the Norway spruce or European spruce , is a species of spruce native to Northern , Central and Eastern Europe .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Pl", "label": "Pl", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ePl\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Pl Wikipedia URL: Pl PL , P.L. , Pl , or .pl may ref ", "shape": "dot", "size": 13.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/Foxglove2.jpg/500px-Foxglove2.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eplant defenses\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: plant defenses Wikipedia URL: Plant defenses Plant defense against herbivory or host-plant resistance is a range of adaptations evolved by plants which improve their survival and reproduction by reducing the impact of herbivores . Many plants produce secondary metabolites , known as allelochemicals , that influence the behavior, growth, or survival of herbivores. These chemical defenses can act as repellents or toxins to herbivores or reduce plant digestibility. Another defensive st...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Plant Growth", "label": "Plant Growth", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e9/Cell_Elongation_in_Plants.svg/250px-Cell_Elongation_in_Plants.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ePlant Growth\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Plant Growth Wikipedia URL: Plant growth Important structures in plant development are buds , shoots , roots , leaves , and flowers ; plants produce these tissues and structures throughout their life from meristems located at the tips of organs , or between mature tissues. Thus, a living plant always has embryonic tissues. By contrast, an animal embryo will very early produce all of the body parts that it will ever have in its life. When the animal is born (or hatches from its egg),...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "plant material", "label": "plant material", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/db/Celery_cross_section.jpg/250px-Celery_cross_section.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eplant material\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: plant material Wikipedia URL: Plant material Vascular tissue is a complex transporting tissue , formed of more than one cell type, found in vascular plants . The primary components of vascular tissue are the xylem and phloem . These two tissues transport fluid and nutrients internally. There are also two meristems associated with vascular tissue: the vascular cambium and the cork cambium . All the vascular tissues within a particular plant together constitute the vascular tissue sys...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "plant toxin", "label": "plant toxin", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/7d/Amanita-muscaria-mushroom20151014-1336-ex6cst.jpg/500px-Amanita-muscaria-mushroom20151014-1336-ex6cst.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eplant toxin\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: plant toxin Wikipedia URL: Plant toxin A toxin is a naturally occurring poison produced by metabolic activities of living cells or organisms . They occur especially as proteins , often conjugated . The term was first used by organic chemist Ludwig Brieger (1849\u20131919), derived from toxic . The Amanita muscaria mushroom, an iconic toxic mushroom.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "plants", "label": "plants", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/37/Cosmarium201512081550.JPG/250px-Cosmarium201512081550.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eplants\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: plants Wikipedia URL: Plants Plants are the eukaryotic organisms that constitute the kingdom Plantae . They are predominantly photosynthetic , meaning that they obtain their energy from sunlight . They do that using the green pigment chlorophyll in their chloroplasts to produce sugars from carbon dioxide and water. Exceptions are parasitic plants that have lost the genes for chlorophyll and photosynthesis, and obtain their energy from other plants or fungi. Most plants are multicell...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Plutella xylostella", "label": "Plutella xylostella", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/44/Plutella.xylostella.7383.jpg/250px-Plutella.xylostella.7383.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ePlutella xylostella\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Plutella xylostella Wikipedia URL: Plutella xylostella The diamondback moth ( Plutella xylostella ), sometimes called the cabbage moth , is a moth species of the family Plutellidae and genus Plutella . The small, grayish-brown moth sometimes has a cream-colored band that forms a diamond along its back. The species may have originated in Europe , South Africa , or the Mediterranean region, but it has now spread worldwide.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Plutellidae", "label": "Plutellidae", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/44/Plutella.xylostella.7383.jpg/250px-Plutella.xylostella.7383.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ePlutellidae\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Plutellidae Wikipedia URL: Plutellidae The Plutellidae are a family of the nightshade family Solanaceae . Morphology of the potato plant; tubers are forming from stolons .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "practice", "label": "practice", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epractice\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: practice Wikipedia URL: Practice Practice or practise may refer to:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "protease inhibitor", "label": "protease inhibitor", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eprotease inhibitor\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: protease inhibitor Wikipedia URL: Protease inhibitor Protease inhibitor can refer to:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "protease inhibitors", "label": "protease inhibitors", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/AIDS_diagnoses_and_deaths_in_the_U.S._1981%E2%80%932008.svg/960px-AIDS_diagnoses_and_deaths_in_the_U.S._1981%E2%80%932008.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eprotease inhibitors\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: protease inhibitors Wikipedia URL: Protease inhibitors Protease inhibitors ( PIs ) are medications that act by interfering with enzymes that cleave proteins . Some of the most well known are antiviral drugs widely used to treat HIV/AIDS , hepatitis C and COVID-19 . These protease inhibitors prevent viral replication by selectively binding to viral proteases (e.g. HIV-1 protease ) and blocking proteolytic cleavage of protein precursors that are necessary for the production of infecti...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Proteobacteria", "label": "Proteobacteria", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/E._coli_Bacteria_%287316101966%29.jpg/250px-E._coli_Bacteria_%287316101966%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eProteobacteria\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Proteobacteria Wikipedia URL: Proteobacteria Pseudomonadota (synonym \"Proteobacteria\" ) is a major phylum of gram-negative bacteria . They include pathogenic and free-living (non- parasitic ) genera. The phylum comprises six classes Acidithiobacillia , Alphaproteobacteria , Betaproteobacteria , Gammaproteobacteria , Hydrogenophilia , and Zetaproteobacteria . The Pseudomonadota are widely diverse, with differences in morphology , metabolic processes, relevance to humans, and ecologic...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Proteomics", "label": "Proteomics", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/5/5b/Protein_pattern_analyzer.jpg/330px-Protein_pattern_analyzer.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eProteomics\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Proteomics Wikipedia URL: Proteomics Proteomics is the large-scale study of proteins . It is an interdisciplinary domain that has benefited greatly from the genetic information of various genome projects, including the Human Genome Project . It covers the exploration of proteomes from the overall level of protein composition, structure, and activity, and is an important component of functional genomics . The proteome is the entire set of proteins produced or modified by an organism ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Proteus vulgaris", "label": "Proteus vulgaris", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/2c/Proteus_McConkey.jpg/250px-Proteus_McConkey.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eProteus vulgaris\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Proteus vulgaris Wikipedia URL: Proteus vulgaris Proteus vulgaris is a rod-shaped , nitrate-reducing, indole -positive and catalase -positive, hydrogen sulfide -producing, Gram-negative bacterium that inhabits the intestinal tracts of humans and animals. It can be found in soil, water, and fecal matter. It is grouped with the Morganellaceae and is an opportunistic pathogen of humans. It is known to cause wound infections and other species of its genera are known to cause urinary tra...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Pseudomonas", "label": "Pseudomonas", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/85/Pseudomonas_aeruginosa_01.jpg/250px-Pseudomonas_aeruginosa_01.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ePseudomonas\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Pseudomonas Wikipedia URL: Pseudomonas Pseudomonas is a genus of Gram-negative bacteria belonging to the family Pseudomonadaceae in the class Gammaproteobacteria . The 348 members of the genus demonstrate a great deal of metabolic diversity and consequently are able to colonize a wide range of niches and hosts. Their ease of culture in vitro and availability of an increasing number of Pseudomonas strain genome sequences has made the genus an excellent focus for scientific research; ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Pseudomonas fluorescens", "label": "Pseudomonas fluorescens", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://up
