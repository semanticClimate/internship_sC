 beetles).\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "reactive oxygen species", "label": "reactive oxygen species", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/Reactive_oxygen_species_%28ROS%29_%E2%80%93_some_examples_with_Lewis_structures.png/250px-Reactive_oxygen_species_%28ROS%29_%E2%80%93_some_examples_with_Lewis_structures.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ereactive oxygen species\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: reactive oxygen species Wikipedia URL: Reactive oxygen species In chemistry and biology , reactive oxygen species ( ROS ) are highly reactive chemicals formed from diatomic oxygen ( O 2 ), water , and hydrogen peroxide . Some prominent ROS are hydroperoxide , superoxide (O 2 \u2212 ), hydroxyl radical (OH . ), and singlet oxygen ( 1 O 2 ). ROS are pervasive because they are readily produced from O 2 , which is abundant. ROS are important in many ways, both beneficial and otherwise. ROS f...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "reliability", "label": "reliability", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ereliability\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: reliability Wikipedia URL: Reliability Reliability , reliable , or unreliable may  is a cereal grain and in its domesticated form is the staple food of over half of the world\u0027s population , particularly in Asia and Africa . Rice is the seed of the grass species Oryza sativa (Asian rice)\u2014or, much less commonly, Oryza glaberrima (African rice). Asian rice was domesticated in China some 13,500 to 8,200 years ago; African rice was domesticated in Africa about 3,000 years ago. Rice has become commonplace in many cultures worldwide; in 2023...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "ro", "label": "ro", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ero\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: ro Wikipedia URL: Ro RO or Ro may refer to:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "rostratum", "label": "rostratum", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/17/MCR_-_colonna_rostrata_di_C_Duilio_1150130.JPG/250px-MCR_-_colonna_rostrata_di_C_Duilio_1150130.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003erostratum\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: rostratum Wikipedia URL: Rostratum Rostratus (masculine), rostrata (feminine) or rostratum (neuter) is a Latin adjective meaning \"beaked, curved, hooked, with a crooked point, or with a curved front\". Reproduction re they lay their eggs. The name is associated especially with the Tenthredinoidea , by far the largest superfamily in the suborder, with about 7,000 known species in the entire suborder. There are 8,000 described species in more than 800 gen...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "scarab beetles", "label": "scarab beetles", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/f4/Reitter-1908_table74.jpg/250px-Reitter-1908_table74.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003escarab beetles\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: scarab beetles Wikipedia URL: Scarab beetles The family Scarabaeidae , as currently defined, consists of over 35,000 species of beetles worldwide; they are often called scarabs or scarab beetles . The classification of this family has undergone significant change. Several groups formerly treated as subfamilies have been elevated to family rank (e.g., Bolboceratidae , Geotrupidae , Glaresidae , Glaphyridae , Hybosoridae , Ochodaeidae , and Pleocomidae ), and some reduced to lower ran...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "secondary metabolites", "label": "secondary metabolites", "shape": "dot", "size": 13.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/Structural_formula_of_pipecolic_acid.svg/250px-Structural_formula_of_pipecolic_acid.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003esecondary metabolites\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: secondary metabolites Wikipedia URL: Secondary metabolites Secondary metabolites , also called specialised metabolites , secondary products , or natural products , are organic compounds produced by any lifeform, e.g. bacteria , archaea , fungi , animals , or plants , which are not directly involved in the normal growth , development , or reproduction of the organism. Instead, they generally mediate ecological interactions , which may produce a selective advantage for the organism by...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "selection", "label": "selection", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eselection\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: selection Wikipedia URL: Selection Selection may refer to:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "sex", "label": "sex", "shape": "dot", "size": 13.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/5/51/Sexual_cycle.svg/250px-Sexual_cycle.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003esex\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: sex Wikipedia URL: Sex Sex is the biological trait of a reproducing organism in producing gametes of one of two different sizes or shapes \u2014 male or female gametes. Thus, the typical classification for such organisms, their sex, is also known as either male or female. During sexual reproduction, a male and a female gamete fuse to form a zygote , which develops into an offspring that inherits traits from each parent. By convention, organisms that produce smaller gametes ( spermatozoa ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "sex pheromones", "label": "sex pheromones", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/b0/Utetheisa_bella.jpg/250px-Utetheisa_bella.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003esex pheromones\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: sex pheromones Wikipedia URL: Sex pheromones Sex pheromones are pheromones released by an organism to attract an individual of the same species, encourage it to mate with it, or perform some other function closely related with sexual reproduction . Sex pheromones specifically focus on indicating females for breeding, attracting the opposite sex, and conveying information on species, age, sex and genotype. Non-volatile pheromones, or cuticular contact pheromones, are more closely rel...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "sexual dimorphism", "label": "sexual dimorphism", "shape": "dot", "size": 12.4, "title x (intersexual selection) to mate with, and compete with members of the same sex for access to members of the opposite sex (intrasexual selection). These two forms of selection mean that some individuals have greater reproductive success than others within a population , for example because they are more attractive or prefer more attr...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "signaling", "label": "signaling", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/83/William_Powell_Frith_The_signal_1858.jpg/250px-William_Powell_Frith_The_signal_1858.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003esignaling\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: signaling Wikipedia URL: Signaling A signal is both the process and the result of transmission of data over some media accomplished by embedding some variation. Signals are important in multiple subject fields, including signal processing , information theory and biology . In The Signal by William Powell Frith , a woman sends a signal by waving a white handkerchief.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Sinapis alba", "label": "Sinapis alba", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/83/Sinapis_alba_-_K%C3%B6hler%E2%80%93s_Medizinal-Pflanzen-265.jpg/250px-Sinapis_alba_-_K%C3%B6hler%E2%80%93s_Medizinal-Pflanzen-265.jp ical Analysis Wikipedia URL: Statistical Analysis Statistics (from German : Statistik , orig. \"description of a state , a country\") is the discipline that concerns the collection, organization, analysis, interpretation, and presentation of data . In applying statistics to a scientific, industrial, or social problem, it is conventional to begin with a statistical population or a statistical model to be studied. Populations can be diverse groups of people or objects such as \"al...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "statistical computing", "label": "statistical computing", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/London_School_of_Economics_Statistics_Machine_Room_1964.jpg/250px-London_School_of_Economics_Statistics_Machine_Room_1964.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003estatistical computing\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: statistical computing Wikipedia URL: Statistical computing Computational statistics , or statistical computing , is the study which is the intersection of statistics and computer science , and refers to the statistical methods that are enabled by using computational methods. It is the area of computational science (or scientific computing) specific to the mathematical science of statistics . This area is fast developing. The view that the broader concept of computing must be taught ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "stink bugs", "label": "stink bugs", "shape": "dot", "size": 10.6, "tit     \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: symbionts Wikipedia URL: Symbionts Symbiosis is any close and long-term biological interaction between two organisms of different species . In 1879, Heinrich Anton de Bary defined symbiosis as \"the living together of unlike organisms\". The term is sometimes more exclusively used in a restricted, mutualistic sense, where both symbionts contribute to each other\u0027s subsistence. This means that they benefit each other in some way. In a cleaning symbiosis , the clownfish feeds on small in...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "symbiotic bacteria", "label": "symbiotic bacteria", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003esymbiotic bacteria\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: symbiotic bacteria Wikipedia URL: Symbiotic bacteria Symbiotic bacteria are bacteria living in symbiosis with another organism or each other. For example, rhizobia living in root nodules of legumes provide nitrogen fixing activity for these plants.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "system", "label": "system", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/13/Diagram_Systems.svg/330px-Diagram_Systems.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003esystem\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: system Wikipedia URL: System A system is a group of interacting or interrelated elements that act according to a set of rules to form a unified whole. A system, surrounded and influenced by its environment , is described by its boundaries, structure and purpose and is expressed in its functioning. Systems are the subjects of study of systems theory and other systems sciences . Systems can be isolated, closed, or open.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "t", "label": "t", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/da/Latin_letter_T.svg/250px-Latin_letter_T.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003et\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: t Wikipedia URL: T T , or t , is the twentieth letter of the Latin alphabet , used in the modern English alphabet , the alphabets of other western European languages and others worldwide. Its name in English is tee (pronounced / \u02c8 t i\u02d0 / \u24d8 ), plural tees .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "tannase", "label": "tannase", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003etannase\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: \u0027\u003esearch term: taste Wikipedia URL: Taste The gustatory system or sense of taste is the sensory system that is partially responsible for the perception of taste. Taste is the perception stimulated when a substance in the mouth reacts chemically with taste receptor cells located on taste buds in the oral cavity , mostly on the tongue . Taste, along with the sense of smell and trigeminal nerve stimulation (registering texture, pain, and temperature), determines flavors of food and other substances. ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "taxonomic groups", "label": "taxonomic groups", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/bf/Huang-Quan-Xie-sheng-zhen-qin-tu.jpg/500px-Huang-Quan-Xie-sheng-zhen-qin-tu.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003etaxonomic groups\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: taxonomic groups Wikipedia URL: Taxonomic groups In biology , taxonomy (from Ancient Greek \u03c4\u03ac\u03be\u03b9\u03c2 ( taxis ) \u0027 arrangement \u0027 and -\u03bd\u03bf\u03bc\u03af\u03b1 ( -nomia ) \u0027 method \u0027 ) is the scientific study of naming, defining ( circumscribing ) and classifying groups of biological organisms based on shared characteristics. Organisms are grouped into taxa (singular: taxon), and these groups are given a taxonomic rank ; groups of a given rank can be aggregated to form a more inclusive group of higher rank, t...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "temperature", "label": "temperature", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/23/Thermally_Agitated_Molecule.gif/250px-Thermally_Agitated_Molecule.gif\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003etemperature\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: temperature Wikipedia URL: Temperature Temperature quantitatively expresses the attribute of hotness or coldness . Temperature is measured with a thermometer . It reflects the average kinetic energy of the vibrating and colliding atoms making up a substance.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Tenthredinidae", "label": "Tenthredinidae", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Tenthredopsis_sordida_female.jpg/250px-Tenthredopsis_sordida_female.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eTenthredinidae\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Tenthredinidae Wikipedia URL: Tenthredinidae Allantinae Blennocampinae Heterarthrinae Nematinae Selandriinae - (includes Dolerinae) Susaninae Tenthredininae\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "termites", "label": "termites", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/d3/Coptotermes_formosanus_shiraki_USGov_k8204-7.jpg/250px-Coptotermes_formosanus_shiraki_USGov_k8204-7.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003etermites\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: termites Wikipedia URL: Termites Termites are a group of detritophagous eusocial cockroaches which consume a variety of decaying plant material , generally in the form of wood , leaf litter , and soil humus . They are distinguished by their moniliform antennae and the soft-bodied, unpigmented worker caste for which they have been commonly termed \" white ants \"; however, they are not ants but highly derived cockroaches. About 2,997 extant species are currently described, 2,125 of whi...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Terpenes", "label": "Terpenes", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/R%C3%A9sine.jpg/250px-R%C3%A9sine.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eTerpenes\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Terpenes Wikipedia URL: Terpenes Terpenes ( / \u02c8 t \u025c\u02d0r p i\u02d0 n z / TUR -peenz ) are a large and diverse class of natural products with the general formula (C 5 H 8 ) n , where n \u2265 2. They serve as crucial biosynthetic building blocks in many organisms, particularly plants. Comprising more than 30,000 compounds, these unsaturated hydrocarbons are produced predominantly by plants , particularly conifers . In plants, terpenes and terpenoids are important mediators of ecological interacti...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "terpenoids", "label": "terpenoids", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eterpenoids\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: terpenoids Wikipedia URL: Terpenoids The terpenoids , also known as isoprenoids , are a class of naturally occurring organic chemicals derived from the 5-carbon compound isoprene and its derivatives called terpenes , diterpenes , etc. While sometimes used interchangeably with \"terpenes\", terpenoids contain additional functional groups , usually containing oxygen. When combined with the hydrocarbon terpenes, terpenoids comprise about 80,000 compounds. They are the largest class of pl...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "terrestrial ecosystems", "label": "terrestrial ecosystems", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eterrestrial ecosystems\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: terrestrial ecosystems Wikipedia URL: Terrestrial ecosystems Terrestrial ecosystems are ecosystems that are found on land. Examples include tundra , taiga , temperate deciduous forest , tropical rain forest , grassland , deserts .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "tomato", "label": "tomato", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/1d/Naturalis_Biodiversity_Center_-_Solanum_lycopersicum_var._lycopersicum_-_old_tomato_herbarium_sheet.jpg/250px-Naturalis_Biodiversity_Center_-_Solanum_lycopersicum_var._lycopersicum_-_old_tomato_herbarium_sheet.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003etomato\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: tomato Wikipedia URL: Tomato The tomato ( US : / t \u0259 \u02c8 m e\u026a t o\u028a / , UK : / t \u0259 \u02c8 m \u0251\u02d0 t o\u028a / ; Solanum lycopersicum ) is a plant whose fruit is an edible berry that is eaten as a vegetable. The tomato is a member of the nightshade family that includes tobacco , potato , and chili peppers . It originated from western South America , and may have been domesticated there or in Mexico (Central America). It was introduced to the Old World by the Spanish in the Columbian exchange in the ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "toxicity", "label": "toxicity", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/0/06/Skull_and_Crossbones.svg/250px-Skull_and_Crossbones.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003etoxicity\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: toxicity Wikipedia URL: Toxicity Toxicity is the degree to which a chemical substance or a particular mixture of substances can damage an organism . Toxicity can refer to the effect on a whole organism, such as an animal , bacterium , or plant , as well as the effect on a substructure of the organism, such as a cell ( cytotoxicity ) or an organ such as the liver ( hepatotoxicity ). Sometimes the word is more or less synonymous with poisoning in everyday usage.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "tricosane", "label": "tricosane", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e9/Tetracosane_structure.png/330px-Tetracosane_structure.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003etricosane\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: tricosane Wikipedia URL: Tricosane Higher alkanes are alkanes with a high number of carbon atoms. It is common jargon. One definition says higher alkanes are alkanes having nine or more carbon atoms. Thus, according to this definition, nonane is the lightest higher alkane. As pure substances, higher alkanes are rarely significant, but they are major components of useful lubricants and fuels. Tetracosane is a representative higher alkane\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "turnip sawfly", "label": "turnip sawfly", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Athalia_rosae_2006.08.12_15.36.24-p8120093.jpg/250px-Athalia_rosae_2006.08.12_15.36.24-p8120093.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eturnip sawfly\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: turnip sawfly Wikipedia URL: Turnip sawfly Athalia rosae , the turnip sawfly , cabbage leaf sawfly or beet sawfly , is a typical sawfly with dark green or blackish 18\u201325 mm long larvae that feed on plants of the brassica family, and can sometimes be a pest. It winters below the ground, emerging in early summer as a 7\u20138 mm adult with a mainly orange body and a black head. The adult feeds on nectar .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "university", "label": "university", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/4d/Columbia_University%2C_NYC_%28June_2014%29_-_09.JPG/250px-Columbia_University%2C_NYC_%28June_2014%29_-_09.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003euniversity\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: university Wikipedia URL: University A university (from Latin universitas \u0027 a whole \u0027 ) is an institution of tertiary education and research which awards academic degrees in several academic disciplines . University is derived from the Latin phrase universitas magistrorum et scholarium , which roughly means \"community of teachers and scholars\". Universities typically offer both undergraduate and postgraduate programs. Alma Mater by Daniel Chester French , Columbia University . The a...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "vegan", "label": "vegan", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/20/Gandhi_LVS_1931.jpg/330px-Gandhi_LVS_1931.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003evegan\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: vegan Wikipedia URL: Vegan Veganism is the practice of abstaining from the use of animal products and the consumption of animal source foods , and an associated philosophy that rejects the commodity status of animals . A person who practices veganism is known as a vegan ; the word is also used to describe foods and materials that are compatible with veganism. Mahatma Gandhi , London Vegetarian Society , 20 November 1931, with Henry S. Salt on his right\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "verification", "label": "verification", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027                   // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  
                      network.on("stabilizationProgress", function(params) {
                          document.getElementById('loadingBar').removeAttribute("style");
                          var maxWidth = 496;
                          var minWidth = 20;
                          var widthFactor = params.iterations/params.total;
                          var width = Math.max(minWidth,maxWidth * widthFactor);
                          document.getElementById('bar').style.width = width + 'px';
                          document.getElementById('text').innerHTML = Math.round(widthFactor*100) + '%';
                      });
                      network.once("stabilizationIterationsDone", function() {
                          document.getElementById('text').innerHTML = '100%';
                          document.getElementById('bar').style.width = '496px';
                          document.getElementById('loadingBar').style.opacity = 0;
                          // really clean the dom element
                          setTimeout(function () {document.getElementById('loadingBar').style.display = 'none';}, 500);
                      });
                  

                  return network;

              }
              drawGraph();
        </script>

<script>
document.getElementById('searchButton').onclick = function() {
  var query = document.getElementById('searchInput').value.trim().toLowerCase();
  if (!query) return;
  var nodes = network.body.data.nodes.get();
  var found = nodes.find(n => n.label.toLowerCase() === query);
  if (found) {
    network.focus(found.id, {scale: 1.5, animation: true});
    network.selectNodes([found.id]);
  }
  document.getElementById('searchInput').value = '';
};
document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('searchButton').click();
});
</script>
