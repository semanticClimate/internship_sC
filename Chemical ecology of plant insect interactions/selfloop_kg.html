d as tinctures or absolutes or dried and powdered. Vanilla extract\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "factors", "label": "factors", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003efactors\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: factors Wikipedia URL: Factors Factor ( Latin , \u0027 who/which acts \u0027 ) may refer to:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "fatty alcohol", "label": "fatty alcohol", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/Oleyl_alcohol_Structural_Formula_V1.svg/250px-Oleyl_alcohol_Structural_Formula_V1.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003efatty alcohol\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: fatty alcohol Wikipedia URL: Fatty alcohol Fatty alcohols (or long-chain alcohols ) are usually high-molecular mass, straight-chain primary alcohols , but can also range from as few as 4\u20136 carbon atoms to as many as 22\u201326, derived from natural fats and oils. The precise chain length varies with the source. Some commercially important fatty alcohols are lauryl , stearyl , and oleyl alcohol . They are colourless oily liquids (for smaller carbon numbers) or waxy solids, although impure...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "feeding", "label": "feeding", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/29/Amandines_de_Provence%2C_poster_by_Leonetto_Cappiello%2C_1900.jpg/330px-Amandines_de_Provence%2C_poster_by_Leonetto_Cappiello%2C_1900.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003efeeding\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: feeding Wikipedia URL: Feeding Eating (also known as consuming ) is the ingestion of food . In biology, this is typically done to provide a heterotrophic organism with energy and nutrients and to allow for growth. Animals and other heterotrophs must eat in order to survive \u2013 carnivores eat other animals, herbivores eat plants, omnivores consume a mixture of both plant and animal matter, and detritivores eat detritus . Fungi digest organic matter outside their bodies as opposed to an...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "feeding behavior", "label": "feeding behavior", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/9/98/Feeding_behaviours_Circular_Dendrogram.svg/250px-Feeding_behaviours_Circular_Dendrogram.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003efeeding behavior\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: feeding behavior Wikipedia URL: Feeding behavior Feeding is the process by which organisms, typically animals , obtain food . Terminology often uses either the suffixes -vore, -vory, or -vorous from Latin vorare , meaning \"to devour\", or -phage, -phagy, or -phagous from Greek \u03c6\u03b1\u03b3\u03b5\u1fd6\u03bd ( phagein ), meaning \"to eat\". Circular dendrogram of feeding behaviours\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "females", "label": "females", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/66/Venus_symbol.svg/250px-Venus_symbol.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003efemales\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: females Wikipedia URL: Females An organism \u0027s sex is female ( symbol : \u2640 ) if it produces, or is organized to produce, the ovum (egg cell), the type of gamete (sex cell) that fuses with the male gamete (sperm cell) during sexual reproduction . The symbol of the Roman goddess Venus is used to represent the female sex in biology.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Firmicutes", "label": "Firmicutes", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/b9/Bacillus_subtilis_Gram.jpg/250px-Bacillus_subtilis_Gram.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eFirmicutes\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Firmicutes Wikipedia URL: Firmicutes The Bacillota (synonym \"Firmicutes\" ) are a phylum of bacteria , most of which have Gram-positive cell wall structure. They have round cells, called cocci (singular coccus), or rod-like forms (bacillus). [ citation needed ] A few Bacillota, such as Megasphaera , Pectinatus , Selenomonas , and Zymophilus from the class Negativicutes , have a porous pseudo-outer membrane that causes them to stain Gram-negative . [ citation needed ] Many Bacillota p...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "flow rate", "label": "flow rate", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eflow rate\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: flow rate Wikipedia URL: Flow rate Flow rate (interchangeable with \u0027flowrate\u0027) may refer to:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "food", "label": "food", "shape": "dot", "size": 13.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/6d/Good_Food_Display_-_NCI_Visuals_Online.jpg/500px-Good_Food_Display_-_NCI_Visuals_Online.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003efood\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: food Wikipedia URL: Food Food is any substance consumed by an organism for nutritional support. Food usually consists of plant, animal, or fungal origin and contains essential nutrients such as carbohydrates , fats , proteins , vitamins , or minerals . The substance is ingested by an organism and assimilated by the organism\u0027s cells to provide energy, maintain life, or support growth. Different species of animals have different feeding behaviours that satisfy the needs of their metab...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Formal", "label": "Formal", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eFormal\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Formal Wikipedia URL: Formal Formal , formality , informal or informality imply the complying with, or not complying with, some set of requirements ( forms , in Ancient Greek ). They may refer to:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Formicidae", "label": "Formicidae", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Fire_ants_01.jpg/250px-Fire_ants_01.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eFormicidae\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Formicidae Wikipedia URL: Formicidae Ants are eusocial insects of the family Formicidae and, along with the related wasps and bees , belong to the order Hymenoptera . Ants evolved from vespoid wasp ancestors in the Cretaceous period. More than 13,800 of an estimated total of 22,000 species have been classified. They are easily identified by their geniculate (elbowed) antennae and the distinctive node-like structure that forms their slender waists.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Friedman test", "label": "Friedman test", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eFriedman test\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Friedman test Wikipedia URL: Friedman test The Friedman test is a non-parametric statistical test developed by Milton Friedman . Similar to the parametric repeated measures ANOVA , it is used to detect differences in treatments across multiple test attempts. The procedure involves ranking each row (or block ) together, and then considering the values of ranks by columns. Applicable to complete block designs , it is thus a special case of the Durbin test .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "functional traits", "label": "functional traits", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/c/cd/Megachile_pugnata_pugnata_female.jpg/250px-Megachile_pugnata_pugnata_female.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003efunctional traits\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: functional traits Wikipedia URL: Functional traits Functional ecology is a branch of ecology that focuses on the roles, or functions, that species play in the community or ecosystem in which they occur. In this approach, physiological, anatomical, and life history characteristics of the species are emphasized. The term \"function\" is used to emphasize certain physiological processes rather than discrete properties, describe an organism\u0027s role in a trophic system, or illustrate the ef...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "gall midge", "label": "gall midge", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/Fly_December_2007-4.jpg/250px-Fly_December_2007-4.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egall midge\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: gall midge Wikipedia URL: Gall midge Cecidomyiidae is a family of flies known as gall midges or gall gnats . As the name implies, the larvae of most gall midges feed within plant tissue, creating abnormal plant growths called galls . Cecidomyiidae are very fragile small insects usually only 2\u20133 mm (0.079\u20130.118 in) in length; many are less than 1 mm (0.039 in) long. They are characterised by hairy wings, unusual in the order Diptera , and have long antennae . Some Cecidomyiids are al...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "gallic acid", "label": "gallic acid", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/en/thumb/8/8a/OOjs_UI_icon_edit-ltr-progressive.svg/20px-OOjs_UI_icon_edit-ltr-progressive.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egallic acid\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: gallic acid Wikipedia URL: Gallic acid Gallic acid (also known as 3,4,5-trihydroxybenzoic acid ) is a trihydroxybenzoic acid with the formula C 6 H 2 ( OH ) 3 CO 2 H. It is classified as a phenolic acid . It is found in gallnuts , sumac , witch hazel , tea leaves, oak bark , and other plants . It is a white solid, although samples are typically brown owing to partial oxidation. Salts and esters of gallic acid are termed \"gallates\".\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "gas chromatography", "label": "gas chromatography", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/4a/Gaschromatograph.jpg/250px-Gaschromatograph.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egas chromatography\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: gas chromatography Wikipedia URL: Gas chromatography Gas chromatography ( GC ) is a common type of chromatography used in analytical chemistry for separating and analyzing compounds that can be vaporized without decomposition . Typical uses of GC include testing the purity of a particular substance or separating the different components of a mixture. In preparative chromatography , GC can be used to prepare pure compounds from a mixture.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Gene Expression", "label": "Gene Expression", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/21/Simple_transcription_elongation1.svg/500px-Simple_transcription_elongation1.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eGene Expression\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Gene Expression Wikipedia URL: Gene Expression Gene expression is the process by which the information contained within a gene is used to produce a functional gene product, such as a protein or a functional RNA molecule. This process involves multiple steps, including the transcription of the gene\u0027s sequence into RNA. For protein-coding genes, this RNA is further translated into a chain of amino acids that folds into a protein, while for non-coding genes, the resulting RNA itself se...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "genetic diversity", "label": "genetic diversity", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Human_karyotype.svg/500px-Human_karyotype.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egenetic diversity\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: genetic diversity Wikipedia URL: Genetic diversity Genetic diversity is the total number of genetic characteristics in the genetic makeup of a species. It ranges widely, from the number of species to differences within species , and can be correlated to the span of survival for a species. It is distinguished from genetic variability , which describes the tendency of genetic characteristics to vary. A graphical representation of the typical human karyotype .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "genetic variance", "label": "genetic variance", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/aa/Youngronaldfisher2.JPG/250px-Youngronaldfisher2.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egenetic variance\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: genetic variance Wikipedia URL: Genetic variance Genetic variance is a concept outlined by the English biologist and statistician Ronald Fisher in his fundamental theorem of natural selection . In his 1930 book The Genetical Theory of Natural Selection , Fisher postulates that the rate of change of biological fitness can be calculated by the genetic variance of the fitness itself. Fisher tried to give a statistical formula about how the change of fitness in a population can be attri...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "genetics", "label": "genetics", "shape": "dot", "size": 13.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/Festetics_Imre-Oelenhainz.jpg/250px-Festetics_Imre-Oelenhainz.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egenetics\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: genetics Wikipedia URL: Genetics Genetics is the study of genes , genetic variation , and heredity in organisms . It is an important branch in biology because heredity is vital to organisms\u0027 evolution . Gregor Mendel , a Moravian Augustinian friar working in the 19th century in Brno , was the first to study genetics scientifically. Mendel studied \"trait inheritance\", patterns in the way traits are handed down from parents to offspring over time. He observed that organisms (pea plant...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "gland", "label": "gland", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a1/Gray1026.png/330px-Gray1026.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egland\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: gland Wikipedia URL: Gland A gland is a cell or an organ in an animal\u0027s body that produces and secretes different substances that the organism needs, either into the bloodstream or into a body cavity or outer surface. A gland may also function to remove unwanted substances such as urine from the body.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "glass slide", "label": "glass slide", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/ab/MicroscopeSlides.jpg/250px-MicroscopeSlides.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eglass slide\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: glass slide Wikipedia URL: Glass slide A microscope slide is a thin flat piece of glass , typically 75 by 26 mm (3 by 1 inches) and about 1 mm thick, used to hold objects for examination under a microscope . Typically the object is mounted (secured) on the slide, and then both are inserted together in the microscope for viewing. This arrangement allows several slide-mounted objects to be quickly inserted and removed from the microscope, labeled, transported, and stored in appropriat...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "glucose", "label": "glucose", "shape": "dot", "size": 13.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/4d/D-glucose_lineal.svg/250px-D-glucose_lineal.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eglucose\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: glucose Wikipedia URL: Glucose Glucose is a sugar with the molecular formula C 6 H 12 O 6 . It is the most abundant monosaccharide , a subcategory of carbohydrates . It is made from water and carbon dioxide during photosynthesis by plants and most algae . It is used by plants to make cellulose , the most abundant carbohydrate in the world, for use in cell walls , and by all living organisms to make adenosine triphosphate (ATP), which is used by the cell as energy. Glucose is often a...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Glucose Oxidase", "label": "Glucose Oxidase", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Poly-%281-4%29-alpha-D-Glucose.svg/250px-Poly-%281-4%29-alpha-D-Glucose.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eGlucose Oxidase\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Glucose Oxidase Wikipedia URL: Glucose oxidase The glucose oxidase enzyme ( GOx or GOD ) also known as notatin (EC number 1.1.3.4) is an oxidoreductase that catalyses the oxidation of glucose to hydrogen peroxide and D-glucono-\u03b4-lactone . This enzyme is produced by certain species of fungi and insects and displays antibacterial activity when oxygen and glucose are present.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "glycosidic bonds", "label": "glycosidic bonds", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/f5/Ethyl-glucoside.png/960px-Ethyl-glucoside.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eglycosidic bonds\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: glycosidic bonds Wikipedia URL: Glycosidic bonds A glycosidic bond or glycosidic linkage is a type of ether bond that joins a carbohydrate (sugar) molecule to another group, which may or may not be another carbohydrate. Formation of ethyl glucoside: Glucose and ethanol combine to form ethyl glucoside and water . The reaction often favors formation of the \u03b1-glycosidic bond as shown due to the anomeric effect .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "green leaf volatiles", "label": "green leaf volatiles", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/8d/LyaseNonenalHemiAc.png/500px-LyaseNonenalHemiAc.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egreen leaf volatiles\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: green leaf volatiles Wikipedia URL: Green leaf volatiles Green leaf volatiles ( GLV ) are organic compounds released by plants. Some of these chemicals function as signaling compounds between either plants of the same species, of other species, or even different lifeforms like insects. Pathway for biosynthesis of the GLV cis-3-hexenal from linolenic acid . The first step involves formation of the hydroperoxide by the action of a lipoxygenase . Subsequently a hydroperoxide lyase indu...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Gut", "label": "Gut", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eGut\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Gut Wikipedia URL: Gut Gut , GUT or guts may refer to:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "gut microbes", "label": "gut microbes", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egut microbes\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: gut microbes Wikipedia URL: Gut Microbes Gut Microbes is a peer-reviewed , open access scientific journal covering research on all aspects of the microorganisms inhabiting the intestines , including their broader effects on the physiology of human and model organism hosts . The journal publishes basic , translational , and clinical research. It was established in 2010 and is published by Taylor \u0026 Francis . The journal became fully open access in 2020. Its editor-in-chief is Beth McC...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "gut symbionts", "label": "gut symbionts", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/E._coli_Bacteria_%287316101966%29.jpg/250px-E._coli_Bacteria_%287316101966%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egut symbionts\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: gut symbionts Wikipedia URL: Gut symbionts Gut microbiota , gut microbiome , or gut flora are the microorganisms , including bacteria , archaea , fungi , and viruses , that live in the digestive tracts of animals . The gastrointestinal metagenome is the aggregate of all the genomes of the gut microbiota . The gut is the main location of the human microbiome . The gut microbiota has broad impacts, including effects on colonization , resistance to pathogens , maintaining the intestina...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "habitat", "label": "habitat", "shape": "dot", "size": 13.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/5/52/Rotjan_-_Enderbury_Day_1_-_2nd_half_%2862%29.JPG/250px-Rotjan_-_Enderbury_Day_1_-_2nd_half_%2862%29.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ehabitat\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: habitat Wikipedia URL: Habitat In ecology , habitat refers to the array of resources, biotic factors that are present in an area, such as to support the survival and reproduction of a particular species . A species\u0027 habitat can be seen as the physical manifestation of its ecological niche . Thus \"habitat\" is a species-specific term, fundamentally different from concepts such as environment or vegetation assemblages, for which the term \"habitat-type\" is more appropriate. This coral r...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Heliconius Erato", "label": "Heliconius Erato", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/75/RedPostman.jpg/250px-RedPostman.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eHeliconius Erato\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Heliconius Erato Wikipedia URL: Heliconius erato Heliconius erato , or the red postman , is one of about 40 neotropical species of butterfly belonging to the genus Heliconius . It is also commonly known as the small postman , the red passion flower butterfly , or the crimson-patched longwing . It was described by Carl Linnaeus in his 1758 10th edition of Systema Naturae .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Helicoverpa zea", "label": "Helicoverpa zea", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/ee/Helicoverpa_zea_-_Corn_Earworm_Moth_%2814609135305%29.jpg/250px-Helicoverpa_zea_-_Corn_Earworm_Moth_%2814609135305%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eHelicoverpa zea\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Helicoverpa zea Wikipedia URL: Helicoverpa zea Helicoverpa zea , commonly known as the corn earworm , is a species (formerly in the genus Heliothis ) in the family Noctuidae . The larva of the moth Helicoverpa zea is a major agricultural pest . Since it is polyphagous (feeds on many different plants) during the larval stage, the species has been given many different common names , including the cotton bollworm and the tomato fruitworm . It also consumes a wide variety of other crops...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "hemocoel", "label": "hemocoel", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/29/Circulatory_System_en.svg/330px-Circulatory_System_en.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ehemocoel\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: hemocoel Wikipedia URL: Hemocoel In vertebrates , the circulatory system is a system of organs that includes the heart , blood vessels , and blood which is circulated throughout the body. It includes the cardiovascular system , or vascular system, that consists of the heart and blood vessels (from Greek kardia meaning heart , and Latin vascula meaning vessels ). The circulatory system has two divisions, a systemic circulation or circuit , and a pulmonary circulation or circuit . Som...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "herbivores", "label": "herbivores", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/c/cb/White-tailed_deer_%28Odocoileus_virginianus%29_grazing_-_20050809.jpg/250px-White-tailed_deer_%28Odocoileus_virginianus%29_grazing_-_20050809.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eherbivores\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: herbivores Wikipedia URL: Herbivores A herbivore is an animal anatomically and physiologically evolved to feed on plants , especially upon vascular tissues such as foliage , fruits or seeds , as the main component of its diet . These more broadly also encompass animals that eat non-vascular autotrophs such as mosses , algae and lichens , but do not include those feeding on decomposed plant matters (i.e. detritivores ) or macrofungi (i.e. fungivores ). A deer and two fawns feeding on...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "herbivorous insect", "label": "herbivorous insect", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u002 pg/250px-POxy_v0017_n2099_a_01_hires_-_cropped.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ehistory\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: history Wikipedia URL: History History is the systematic study of the past , focusing primarily on the human past . As an academic discipline , it analyses and interprets evidence to construct narratives about what happened and explain why it happened. Some theorists categorize history as a social science , while others see it as part of the humanities or consider it a hybrid discipline. Similar debates surround the purpose of history\u2014for example, whether its main aim is theoretical...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "honeydew", "label": "honeydew", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ehoneydew\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: honeydew Wikipedia URL: Honeydew Honeydew may refer to:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "host", "label": "host", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ehost\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: host Wikipedia URL: Host A host is a person responsible for guests at an event or for providing hospitality during it.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "host adaptation", "label": "host adaptation", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ehost adaptation\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: host adaptation Wikipedia URL: Host adaptation When considering pathogens , host adaptation can have varying descriptions. For example, in the case of Salmonella , host adaptation is used to describe the \"ability of a pathogen to circulate and cause disease in a particular host population.\" Another usage of host adaptation, still considering the case of Salmonella , refers to the evolution of a pathogen such that it can infect, cause disease, and circulate in another host species.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "host specificity", "label": "host specificity", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a3/Roof_rat-%28rattus_rattus%29.jpg/330px-Roof_rat-%28rattus_rattus%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ehost specificity\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: host specificity Wikipedia URL: Host specificity In biology and medicine , a host is a larger organism that harbours a smaller organism ; whether a parasitic , a mutualistic , or a commensalist guest ( symbiont ). The guest is typically provided with nourishment and shelter. Examples include animals playing host to parasitic worms (e.g. nematodes ), cells harbouring pathogenic (disease-causing) viruses , or a bean plant hosting mutualistic (helpful) nitrogen-fixing bacteria . More s...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "humidity", "label": "humidity", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/RH_wiki.png/250px-RH_wiki.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ehumidity\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: humidity Wikipedia URL: Humidity Humidity is the concentration of water vapor present in the air. Water vapor, the gaseous state of water, is generally invisible to the naked eye. Humidity indicates the likelihood for precipitation , dew , or fog to be present. Global distribution of relative humidity at the surface averaged over the years 1981\u20132010 from the CHELSA-BIOCLIM+ data set\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Hungary", "label": "Hungary", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/60/EU-Hungary.svg/250px-EU-Hungary.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eHu tion are reversible.)\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "hydrolytic enzymes", "label": "hydrolytic enzymes", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ehydrolytic enzymes\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: hydrolytic enzymes Wikipedia URL: Hydrolytic enzymes In biochemistry , hydrolases constitute a class of enzymes that commonly function as biochemical catalysts that use water to break a chemical bond :\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Hylobius abietis", "label": "Hylobius abietis", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Hylobius_abietis_3_bialowieza_forest_beentree.jpg/250px-Hylobius_abietis_3_bialowieza_forest_beentree.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eHylobius abietis\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Hylobius abietis Wikipedia URL: Hylobius abietis Hylobius abietis or the large pine weevil is a beetle belonging to family Curculionidae . This species is widely regarded as the most important pest of most commercially important coniferous trees in European plantations. Seedlings planted or arising from natural regeneration (germinated seed-fall) after clear felling operations are especially at risk. The adult weevils cause damage by eating the bark of seedlings around the \u0027collar\u0027 ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "Hymenoptera", "label": "Hymenoptera", "shape": "dot", "size": 13.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/f5/Hymenoptera.jpg/330px-Hymenoptera.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eHymenoptera\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Hymenoptera Wikipedia URL: Hymenoptera Hymenoptera is a large order of insects , comprising the sawflies , wasps , bees , and ants . Over 150,000 living species of Hymenoptera have been described, in addition to over 2,000 extinct ones. Many of the species are parasitic . Females typically have a special ovipositor for inserting eggs into hosts or places that are otherwise inaccessible. This ovipositor is often modified into a stinger . The young develop through holometabolism (comp...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Hyphantria cunea", "label": "Hyphantria cunea", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/c/c7/Hyphantria_cunea%2C_adult.jpg/250px-Hyphantria_cunea%2C_adult.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eHyphantria cunea\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Hyphantria cunea Wikipedia URL: Hyphantria cunea The fall webworm ( Hyphantria cunea ) is a moth in the family Erebidae known principally for its larval stage, which creates the characteristic webbed nests on the tree limbs of a wide variety of hardwoods in the late summer and fall. It is considered a pest but does not harm otherwise healthy trees. It is well known to commercial tree services and arboriculturists . Fall webworms are an invasive species in East Asia.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "i", "label": "i", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Latin_letter_I.svg/250px-Latin_letter_I.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ei\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: i Wikipedia URL: I I , or i , is the ninth letter and the third vowel letter of the Latin alphabet , used in the modern English alphabet , the alphabets of other western European languages and others worldwide. Its name in English is i (pronounced / \u02c8 a\u026a / \u24d8 ), plural i\u0027s or is .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "identification", "label": "identification", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eidentification\u003c/h3\u003e\n            \u003cdiv style=\u0027f  kleptopharmacophagy Wikipedia URL: Kleptopharmacophagy Kleptopharmacophagy is a term used for describing the ecological relationship between two different organisms, where the first is stealing the second\u0027s chemical compounds and consuming them. This scientific term was proposed by Australian, Singaporean, and American biologists in September 2021 in an article that was published in the journal Ecology by the Ecological Society of America . The phenomenon was first noticed in milkwe...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "L", "label": "L", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/ad/Latin_letter_L.svg/250px-Latin_letter_L.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eL\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: L Wikipedia URL: L L , or l , is the twelfth letter of the Latin alphabet , used in the modern English alphabet , the alphabets of other western European languages and others worldwide. Its name in English is el (pronounced / \u02c8 \u025b l / \u24d8 EL ), plural els .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Lamiaceae", "label": "Lamiaceae", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/Lamium_purpureum_jamestown1.jpg/250px-Lamium_purpureum_jamestown1.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eLamiaceae\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Lamiaceae Wikipedia URL: Lamiaceae Lamiaceae or Labiatae are a family of flowering plants commonly known as mints , deadnettles , or sages . Many of species in Lamiaceae are aromatic, and the family includes many widely used culinary herbs like basil , mint , rosemary , sage , savory , marjoram , oregano , hyssop , thyme , lavender , and perilla , as well as traditional medicines such as catnip , skullcap , bee balm , wild dagga , and oriental motherwort .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Lamiales", "label": "Lamiales", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/Galeopsis_speciosa_%28Zellwald%29.jpg/250px-Galeopsis_speciosa_%28Zellwald%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eLamiales\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Lamiales Wikipedia URL: Lamiales The Lamiales (also known as the mint order ) are an order of flowering plants in the asterids clade of the Eudicots . Under the APG IV system of flowering plant classification the order consists of 24 families, and includes about 23,810 species and 1,059 genera with representatives found all over the world. Well-known or economically important members of this order include aromatic, culinary, and medicinal herbs such as basil , mint , rosemary , sage...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "leaf beetle", "label": "leaf beetle", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/fb/Scarlet_lily_beetle_lilioceris_lilii.jpg/250px-Scarlet_lily_beetle_lilioceris_lilii.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eleaf beetle\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: leaf beetle Wikipedia URL: Leaf beetle The beetle family Chrysomelidae , commonly known as leaf beetles , includes over 37,000 (and probably at least 50,000) [ citation needed ] species in more than 2,500 genera , making it one of the largest and most commonly encountered of all beetle families. Numerous subfamilies are recognized, but the specifics of leaf beetle taxonomy and systematics are likely to change with ongoing research.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "learning", "label": "learning", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/Cooking_contest_140418-N-OX321-101.jpg/500px-Cooking_contest_140418-N-OX321-101.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003elearning\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: learning Wikipedia URL: Learning Learning is the process of acquiring new understanding , knowledge , behaviors , skills , values , attitudes , and preferences . The ability to learn is possessed by humans , non-human animals , and some machines ; there is also evidence for some kind of learning in certain plants . Some learning is immediate, induced by a single event (e.g. being burned by a hot stove ), but much skill and knowledge accumulate from repeated experiences. The changes ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "leaves", "label": "leaves", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/de/Leaf_Varieties_%2815_sp%29.png/500px-Leaf_Varieties_%2815_sp%29.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eleaves\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: leaves Wikipedia URL: Leaves A leaf ( pl. : leaves ) is a principal appendage of the stem of a vascular plant , usually borne laterally above ground and specialized for photosynthesis . Leaves are collectively called foliage , as in \"autumn foliage\", while the leaves, stem, flower , and fruit collectively form the shoot system. In most leaves, the primary photosynthetic tissue is the palisade mesophyll and is located on the upper side of the blade or lamina of the leaf, but in some ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Lepidoptera", "label": "Lepidoptera", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a6/Peacock_butterfly_%28Aglais_io%29_2.jpg/250px-Peacock_butterfly_%28Aglais_io%29_2.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eLepidoptera\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Lepidoptera Wikipedia URL: Lepidoptera Aglossata Glossata Heterobathmiina Zeugloptera\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "License", "label": "License", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/Vertical_California_Drivers_License.jpg/250px-Vertical_California_Drivers_License.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eLicense\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: License Wikipedia URL: License A license ( American English ) or licence ( Commonwealth English ) is an official permission or permit to do, use, or own something (as well as the document of that permission or permit). Governments issue driver\u0027s licenses to people who are allowed to drive motor vehicles on public roads .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "licking", "label": "licking", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/Canine_lick_granuloma.jpg/250px-Canine_lick_granuloma.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003elicking\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: licking Wikipedia URL: Licking Licking is the action of passing the tongue over a surface, typically either to deposit saliva onto the surface, or to collect liquid, food or minerals onto the tongue for ingestion , or to communicate with other animals . Many animals both groom themselves , eat or drink by licking. Lick granuloma on a dog\u0027s paw\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Life history", "label": "Life history", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eLife history\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Life history Wikipedia URL: Life history Life history may refer to:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "lifespan", "label": "lifespan", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003elifespan\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: lifespan Wikipedia URL: Lifespan Lifespan or life span may refer to:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "lignin", "label": "lignin", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/ee/Lignin_structure.svg/500px-Lignin_structure.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003elignin\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: lignin Wikipedia URL: Lignin Lignin is a class of complex organic polymers that form key structural materials in the support tissues of most plants. Lignins are particularly important in the formation of cell walls , especially in wood and bark , because they lend rigidity and do not rot easily. Chemically, lignins are polymers made by the cross-linking of phenolic precursors. Idealized structure of lignin from a softwood\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "ligninase", "label": "ligninase", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eligninase\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: ligninase Wikipedia URL: Ligninase Lignin-modifying enzymes ( LMEs ) are various types of enzymes produced by fungi and bacteria that catalyze the breakdown of lignin , a biopolymer commonly found in the cell walls of plants . The terms ligninases and lignases are older names for the same class, but the name \"lignin-modifying enzymes\" is now preferred, given that these enzymes are not hydrolytic but rather oxidative (electron withdrawing) by their enzymatic mechanisms. LMEs include ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Linepithema humile", "label": "Linepithema humile", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/Linepithema_Argentine_ant.jpg/250px-Linepithema_Argentine_ant.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eLinepithema humile\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Linepithema humile Wikipedia URL: Linepithema humile The Argentine ant ( Linepithema humile , formerly Iridomyrmex humilis ) is an ant native to northern Argentina , Uruguay , Paraguay , Bolivia and southern Brazil . This invasive species was inadvertently introduced by humans on a global scale and has become established in many Mediterranean climate areas, including South Africa , New Zealand , Japan , Easter Island , Australia, the Azores , Europe , Hawaii , and the continental Un...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "longhorn beetles", "label": "longhorn beetles", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/9/93/Batus_barbicornis_MHNT_femelle.jpg/250px-Batus_barbicornis_MHNT_femelle.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003elonghorn beetles\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: longhorn beetles Wikipedia URL: Longhorn beetles The longhorn beetles ( Cerambycidae ), also known as long-horned or longicorns (whose larvae are often referred to as roundheaded borers ), are a large family of beetles , with over 35,000 species described.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Lycopersicon", "label": "Lycopersicon", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/Colorful_Red_and_Yellow_Tomatoes_2816px.jpg/250px-Colorful_Red_and_Yellow_Tomatoes_2816px.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eLycopersicon\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Lycopersicon Wikipedia URL: Lycopersicon Lycopersicon was a genus in the flowering plant family Solanaceae (the nightshades and relatives). It contained about 13 species in the tomato group of nightshades. First removed from the genus Solanum by Philip Miller in 1754, its removal leaves the latter genus paraphyletic , so modern botanists generally accept the names in Solanum . The name Lycopersicon (from Greek \u03bb\u03c5\u03ba\u03bf\u03c0\u03ad\u03c1\u03c3\u03b9\u03ba\u03bf\u03bd meaning \"wolf peach\") is a reference to German folklore abou...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "males", "label": "males", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/b7/Mars_symbol.svg/250px-Mars_symbol.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emales\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: males Wikipedia URL: Males Male ( symbol : \u2642 ) is the sex of an organism that produces, or is organized to produce, the gamete (sex cell) known as sperm , which fuses with the larger female gamete, or ovum , in the process of fertilisation . A male organism cannot reproduce sexually without access to at least one ovum from a female, but some organisms can reproduce both sexually and asexually . Most male mammals , including male humans, have a Y chromosome , which codes for the prod...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Mandelonitrile", "label": "Mandelonitrile", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/en/thumb/8/8a/OOjs_UI_icon_edit-ltr-progressive.svg/20px-OOjs_UI_icon_edit-ltr-progressive.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eMandelonitrile\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Mandelonitrile Wikipedia URL: Mandelonitrile In organic chemistry , mandelonitrile is the nitrile of mandelic acid , or the cyanohydrin derivative of benzaldehyde . Small amounts of mandelonitrile occur in the pits of some fruits.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "mangoes", "label": "mangoes", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/74/Mangos_-_single_and_halved.jpg/500px-Mangos_-_single_and_halved.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emangoes\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: mangoes Wikipedia URL: Mangoes A mango is an edible stone fruit produced by the tropical tree Mangifera indica . It originated in the northeastern part of the Indian subcontinent , in what is now Bangladesh, northeastern India and Myanmar. M. indica has been cultivated in South and Southeast Asia since ancient times, resulting in two modern mango cultivar lineages: the \"Indian\" and the \"Southeast Asian\" types. Other species in the genus Mangifera also produce edible fruits called \"m...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "mass spectra", "label": "mass spectra", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/0/01/Dempster_mass_spectrum.gif/330px-Dempster_mass_spectrum.gif\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emass spectra\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: mass spectra Wikipedia URL: Mass spectra A mass spectrum is a histogram plot of intensity vs. mass-to-charge ratio ( m/z ) in a chemical sample, usually acquired using an instrument called a mass spectrometer . Not all mass spectra of a given substance are the same; for example, some mass spectrometers break the analyte molecules into fragments ; others observe the intact molecular masses with little fragmentation. A mass spectrum can represent many different types of information ba...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "mating", "label": "mating", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/c/c0/Blue-tailed_damselflies_%28Ischnura_elegans%29_mating%2C_female_typica_2.jpg/250px-Blue-tailed_damselflies_%28Ischnura_elegans%29_mating%2C_female_typica_2.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emating\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: mating Wikipedia URL: Mating In biology , mating is the pairing of either opposite-sex or hermaphroditic organisms for the purposes of sexual reproduction . Fertilization is the fusion of two gametes . Copulation is the union of the sex organs of two sexually reproducing animals for insemination and subsequent internal fertilization . Mating may also lead to external fertilization , as seen in amphibians , bony fishes and plants. For most species, mating is between two individuals o...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "mating behavior", "label": "mating behavior", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emating behavior\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: mating behavior Wikipedia URL: Mating behavior Mating rituals may refer to:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "mating preferences", "label": "mating preferences", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emating preferences\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: mating preferences Wikipedia URL: Mating preferences Mating preferences are qualities that one desires in a romantic or sexual partner . Research across many domains, such as evolutionary biology , psychology , and anthropology , shows that humans display both widely shared (consensual) preferences \u2013 like preferences for kindness, intelligence, and health \u2013 as well as sex-differentiated preferences shaped by ancestral selection pressures. These preferences are understood within the ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "MDPI", "label": "MDPI", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/en/thumb/9/9f/MDPI-logo.png/120px-MDPI-logo.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eMDPI\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: MDPI Wikipedia URL: MDPI MDPI ( Multidisciplinary Digital Publishing Institute ) is a publisher of open-access scientific journals . It publishes over 390 peer-reviewed, open-access journals. MDPI is among the largest publishers in the world in terms of journal article output, and was the largest publisher of open access articles in 2020.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Mechanisms", "label": "Mechanisms", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eMechanisms\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Mechanisms Wikipedia URL: Mechanisms Mechanism may refer to:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "medians", "label": "medians", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/62/Hottenroth_I-021_-_28_-_Median_male.jpg/250px-Hottenroth_I-021_-_28_-_Median_male.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emedians\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: medians Wikipedia URL: Medians The Medes were an Iron Age Iranian people who spoke the Median language and who inhabited an area known as Media between western and northern Iran . Around the 11th century BC, they occupied the mountainous region of northwestern Iran and the northeastern and eastern region of Mesopotamia in the vicinity of Ecbatana (present-day Hamadan ). Their consolidation in Iran is believed to have occurred during the 8th century BC. In the 7th century BC, all of ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "memory", "label": "memory", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/5/58/Memory.gif/250px-Memory.gif\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ememory\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: memory Wikipedia URL: Memory Memory is the faculty of the mind by which data or information is encoded , stored, and retrieved when needed. It is the retention of information over time for the purpose of influencing future action . If past events could not be remembered, it would be impossible for language, relationships, or personal identity to develop. Memory loss is usually described as forgetfulness or amnesia . Overview of the forms and functions of memory\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "metabolic pathways", "label": "metabolic pathways", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/Net_reactions_for_glycolysis_of_glucose%2C_oxidative_decarboxylation_of_pyruvate%2C_and_Krebs_cycle..png/960px-Net_reactions_for_glycolysis_of_glucose%2C_oxidative_decarboxylation_of_pyruvate%2C_and_Krebs_cycle..png\
