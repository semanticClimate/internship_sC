ite is an intermediate or end product of metabolism . The term is usually used for small molecules . Metabolites have various functions, including fuel, structure, signaling, stimulatory and inhibitory effects on enzymes , catalytic activity of their own (usually as a cofactor to an enzyme), defense, and interactions with other organisms (e.g. pigments , odorants , and pheromones )."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Proteobacteria", "label": "Proteobacteria", "shape": "dot", "size": 12, "title": "search term: Proteobacteria Wikipedia URL: Proteobacteria Pseudomonadota (synonym \"Proteobacteria\" ) is a major phylum of gram-negative bacteria . They include pathogenic and free-living (non- parasitic ) genera. The phylum comprises six classes Acidithiobacillia , Alphaproteobacteria , Betaproteobacteria , Gammaproteobacteria , Hydrogenophilia , and Zetaproteobacteria . The Pseudomonadota are widely diverse, with differences in morphology , metabolic processes, relevance to humans, and ecological influence."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Firmicutes", "label": "Firmicutes", "shape": "dot", "size": 12, "title": "search term: Firmicutes Wikipedia URL: Firmicutes The Bacillota (synonym \"Firmicutes\" ) are a phylum of bacteria , most of which have Gram-positive cell wall structure. They have round cells, called cocci (singular coccus), or rod-like forms (bacillus). [ citation needed ] A few Bacillota, such as Megasphaera , Pectinatus , Selenomonas , and Zymophilus from the class Negativicutes , have a porous pseudo-outer membrane that causes them to stain Gram-negative . [ citation needed ] Many Bacillota produce endospores , which are resistant to desiccation and can survive extreme conditions. [ citation needed ] They are found in various environments, and the group includes some notable pathogens. [ citation needed ] Those in one family, the Heliobacteria , produce energy through anoxygenic photosynthesis . [ citation needed ] Bacillota play an important role in beer, wine, and cider spoilage. [ citation needed ]"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "glycosidic bonds", "label": "glycosidic bonds", "shape": "dot", "size": 12, "title": "search term: glycosidic bonds Wikipedia URL: Glycosidic bonds A glycosidic bond or glycosidic linkage is a type of ether bond that joins a carbohydrate (sugar) molecule to another group, which may or may not be another carbohydrate. Formation of ethyl glucoside: Glucose and ethanol combine to form ethyl glucoside and water . The reaction often favors formation of the \u03b1-glycosidic bond as shown due to the anomeric effect ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Psylliodes chrysocephala", "label": "Psylliodes chrysocephala", "shape": "dot", "size": 12, "title": "search term: Psylliodes chrysocephala Wikipedia URL: Psylliodes chrysocephala Psylliodes chrysocephala or Psylliodes chrysocephalus , commonly known as the cabbage-stem flea beetle , is a species of leaf beetle situated in the subfamily Galerucinae and the tribe Alticini (flea beetles)."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "host adaptation", "label": "host adaptation", "shape": "dot", "size": 12, "title": "search term: host adaptation Wikipedia URL: Host adaptation When considering pathogens , host adaptation can have varying descriptions. For example, in the case of Salmonella , host adaptation is used to describe the \"ability of a pathogen to circulate and cause disease in a particular host population.\" Another usage of host adaptation, still considering the case of Salmonella , refers to the evolution of a pathogen such that it can infect, cause disease, and circulate in another host species."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Hylobius abietis", "label": "Hylobius abietis", "shape": "dot", "size": 12, "title": "search term: Hylobius abietis Wikipedia URL: Hylobius abietis Hylobius abietis or the large pine weevil is a beetle belonging to family Curculionidae . This species is widely regarded as the most important pest of most commercially important coniferous trees in European plantations. Seedlings planted or arising from natural regeneration (germinated seed-fall) after clear felling operations are especially at risk. The adult weevils cause damage by eating the bark of seedlings around the \u0027collar\u0027 of the stem, thus \u0027ring-barking\u0027 the tree seedling which usually results in its demise."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Metasequoia", "label": "Metasequoia", "shape": "dot", "size": 12, "title": "search term: Metasequoia Wikipedia URL: Metasequoia Metasequoia , or dawn redwood , is a genus of fast-growing coniferous trees. It contains one extant (living) species, Metasequoia glyptostroboides , which is one of three extant species of conifers known as redwoods in the world. Metasequoia glyptostroboides is native to Lichuan county in Hubei , China. Although the shortest of the redwoods , it grows to at least 165 feet (50 meters) in height. Local villagers refer to the original tree from which most others derive as Shu\u01d0sh\u0101n (\u6c34\u6749), or \"water fir\", which is part of a local shrine. Since its rediscovery in 1944, the dawn redwood has become a popular ornamental, with examples found in various parks in a variety of countries."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "metabolic pathways", "label": "metabolic pathways", "shape": "dot", "size": 14, "title": "search term: metabolic pathways Wikipedia URL: Metabolic pathways In biochemistry , a metabolic pathway is a linked series of chemical reactions occurring within a cell . The reactants , products, and intermediates of an enzymatic reaction are known as metabolites , which are modified by a sequence of chemical reactions catalyzed by enzymes . In most cases of a metabolic pathway, the product of one enzyme acts as the substrate for the next. However, side products are considered waste and removed from the cell. Net reactions of common metabolic pathways"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "antimicrobial", "label": "antimicrobial", "shape": "dot", "size": 16, "title": "search term: antimicrobial Wikipedia URL: Antimicrobial An antimicrobial is an agent that kills microorganisms ( microbicide ) or stops their growth ( bacteriostatic agent ). Antimicrobial medicines can be grouped according to the microorganisms they are used to treat. For example, antibiotics are used against bacteria , and antifungals are used against fungi . They can also be classified according to their function. Antimicrobial medicines to treat infection are known as antimicrobial chemotherapy , while antimicrobial drugs are used to prevent infection, which known as antimicrobial prophylaxis . Hand sanitizer is a common consumer-level antimicrobial product"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "pathogenic bacteria", "label": "pathogenic bacteria", "shape": "dot", "size": 14, "title": "search term: pathogenic bacteria Wikipedia URL: Pathogenic bacteria Pathogenic bacteria are bacteria that can cause disease . This article focuses on the bacteria that are pathogenic to humans. Most species of bacteria are harmless and many are beneficial but others can cause infectious diseases . The number of these pathogenic species in humans is estimated to be fewer than a hundred. By contrast, several thousand species are considered part of the gut flora , with a few hundred species present in each individual human\u0027s digestive tract ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "antimicrobial peptides", "label": "antimicrobial peptides", "shape": "dot", "size": 12, "title": "search term: antimicrobial peptides Wikipedia URL: Antimicrobial peptides Antimicrobial peptides ( AMPs ), also called host defence peptides ( HDPs ) are part of the innate immune response found among all classes of life. Fundamental differences exist between prokaryotic and eukaryotic cells that may represent targets for antimicrobial peptides . These peptides are potent, broad spectrum antimicrobials which demonstrate potential as novel therapeutic agents. Antimicrobial peptides have been demonstrated to kill Gram negative and Gram positive bacteria, enveloped viruses, fungi and even transformed or cancerous cells. Unlike the majority of conventional antibiotics it appears that antimicrobial peptides frequently destabilize biological membranes , can form transmembrane channels , and may also have the ability to enhance immunity by functioning as immunomodulators . Various structures of antimicrobial peptides"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Acinetobacter guillouiae", "label": "Acinetobacter guillouiae", "shape": "dot", "size": 12, "title": "search term: Acinetobacter guillouiae Wikipedia URL: Acinetobacter guillouiae Acinetobacter guillouiae is a gram-negative , strictly aerobic bacterium from the genus Acinetobacter isolated from gasworks effluent."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "toxicity", "label": "toxicity", "shape": "dot", "size": 14, "title": "search term: toxicity Wikipedia URL: Toxicity Toxicity is the degree to which a chemical substance or a particular mixture of substances can damage an organism . Toxicity can refer to the effect on a whole organism, such as an animal , bacterium , or plant , as well as the effect on a substructure of the organism, such as a cell ( cytotoxicity ) or an organ such as the liver ( hepatotoxicity ). Sometimes the word is more or less synonymous with poisoning in everyday usage."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "plant defenses", "label": "plant defenses", "shape": "dot", "size": 18, "title": "search term: plant defenses Wikipedia URL: Plant defenses Plant defense against herbivory or host-plant resistance is a range of adaptations evolved by plants which improve their survival and reproduction by reducing the impact of herbivores . Many plants produce secondary metabolites , known as allelochemicals , that influence the behavior, growth, or survival of herbivores. These chemical defenses can act as repellents or toxins to herbivores or reduce plant digestibility. Another defensive strategy of plants is changing their attractiveness. Plants can sense being touched , and they can respond with strategies to defend against herbivores. Plants alter their appearance by changing their size or quality in a way that prevents overconsumption by large herbivores, reducing the rate at which they are consumed. Foxgloves produce toxic chemicals such as digoxin in order to deter herbivory."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Pseudomonas fluorescens", "label": "Pseudomonas fluorescens", "shape": "dot", "size": 12, "title": "search term: Pseudomonas fluorescens Wikipedia URL: Pseudomonas fluorescens Bacillus fluorescens liquefaciens Fl\u00fcgge 1886 Bacillus fluorescens Trevisan 1889 Bacterium fluorescens (Trevisan 1889) Lehmann and Neumann 1896 Liquidomonas fluorescens (Trevisan 1889) Orla-Jensen 1909 Pseudomonas lemonnieri (Lasseur) Breed 1948 Pseudomonas schuylkilliensis Chester 1952 Pseudomonas washingtoniae (Pine) Elliott"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "ligninase", "label": "ligninase", "shape": "dot", "size": 16, "title": "search term: ligninase Wikipedia URL: Ligninase Lignin-modifying enzymes ( LMEs ) are various types of enzymes produced by fungi and bacteria that catalyze the breakdown of lignin , a biopolymer commonly found in the cell walls of plants . The terms ligninases and lignases are older names for the same class, but the name \"lignin-modifying enzymes\" is now preferred, given that these enzymes are not hydrolytic but rather oxidative (electron withdrawing) by their enzymatic mechanisms. LMEs include peroxidases , such as lignin peroxidase ( EC 1.11.1.14 ), manganese peroxidase ( EC 1.11.1.13 ), versatile peroxidase ( EC 1.11.1.16 ), and many phenoloxidases of the laccase type."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "blattodea", "label": "blattodea", "shape": "dot", "size": 12, "title": "search term: blattodea Wikipedia URL: Blattodea Blattodea is an order of insects that contains cockroaches and termites . Collectively, Blattodea and the mantis order Mantodea are considered part of the superorder Dictyoptera . Formerly, termites were considered the separate order Isoptera , but genetic and molecular evidence suggests they evolved from within the cockroach lineage, which renders them cockroaches cladistically ; the group of termites were subsumed into Blattodea and they are considered by some to be a divergent group of cockroaches. Blattodea includes approximately 4,400 species of cockroach in almost 500 genera, and about 3,000 species in around 300 genera within the termite clade ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "actinomycetes", "label": "actinomycetes", "shape": "dot", "size": 12, "title": "search term: actinomycetes Wikipedia URL: Actinomycetes Actinomycetes is a class of bacteria ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Cassida rubiginosa", "label": "Cassida rubiginosa", "shape": "dot", "size": 12, "title": "search term: Cassida rubiginosa Wikipedia URL: Cassida rubiginosa The thistle tortoise beetle ( Cassida rubiginosa ) is a species of beetle in the subfamily Cassidinae (tortoise beetles) and the genus Cassida . The thistle tortoise beetle can be recognized by its green, rounded back and it can be found on thistle plants in many regions of North America and Europe . The thistle tortoise beetle was first discovered in 1902 in L\u00e9vis , Quebec . In 1931, Nellie F. Paterson was the first to document the mature larva . Later, the instar larva of this species was first recorded in 2004 by Jolanta \u015awi\u0119toja\u0144ska. The thistle tortoise beetle exhibits multiple defense behaviors, such as a flexible shield, providing a barrier against the mandibles of predators, and an excretion that protects the eggs as well."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "termites", "label": "termites", "shape": "dot", "size": 12, "title": "search term: termites Wikipedia URL: Termites Termites are a group of detritophagous eusocial cockroaches which consume a variety of decaying plant material , generally in the form of wood , leaf litter , and soil humus . They are distinguished by their moniliform antennae and the soft-bodied, unpigmented worker caste for which they have been commonly termed \" white ants \"; however, they are not ants but highly derived cockroaches. About 2,997 extant species are currently described, 2,125 of which are members of the family Termitidae ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "metabolic waste", "label": "metabolic waste", "shape": "dot", "size": 16, "title": "search term: metabolic waste Wikipedia URL: Metabolic waste Metabolic wastes or excrements are substances left over from metabolic processes (such as cellular respiration ) which cannot be used by the organism (they are surplus or toxic ), and must therefore be excreted . This includes nitrogen compounds, water , CO 2 , phosphates , sulphates , etc. Animals treat these compounds as excretes. Plants have metabolic pathways which transform some of them (primarily the oxygen compounds) into useful substances. Placental mammals expel urine from the bladder through the urethra during urination ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Metasequoia glyptostroboides", "label": "Metasequoia glyptostroboides", "shape": "dot", "size": 14, "title": "search term: Metasequoia glyptostroboides Wikipedia URL: Metasequoia glyptostroboides Metasequoia glyptostroboides , the dawn redwood , is a fast-growing, endangered deciduous conifer . It is the sole living species of the genus Metasequoia , one of three genera in the subfamily Sequoioideae of the family Cupressaceae. It now survives in the wild only in wet lower slopes and montane river and stream valleys in the border region of Hubei and Hunan provinces and Chongqing municipality in south-central China , notably in Lichuan county in Hubei. Although the shortest of the redwoods, it can grow to 167 ft (51 m) in height."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "immune status", "label": "immune status", "shape": "dot", "size": 12, "title": "search term: immune status Wikipedia URL: Immune status In immunology , immunocompetence is the ability of the body to produce a normal immune response following exposure to an antigen . Immunocompetence is the opposite of immunodeficiency (also known as immuno-incompetence or being immuno-compromised )."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "nutritional", "label": "nutritional", "shape": "dot", "size": 14, "title": "search term: nutritional Wikipedia URL: Nutritional Nutrition is the biochemical and physiological process by which an organism uses food and water to support its life . The intake of these substances provides organisms with nutrients (divided into macro- and micro- ) which can be metabolized to create energy and chemical structures; too much or too little of an essential nutrient can cause malnutrition . Nutritional science , the study of nutrition as a hard science , typically emphasizes human nutrition . A purple leaf blue butterfly ( Amblypodia anita ) gathering nutrients from guano"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Coevolution", "label": "Coevolution", "shape": "dot", "size": 14, "title": "search term: Coevolution Wikipedia URL: Coevolution In biology, coevolution occurs when two or more species reciprocally affect each other\u0027s evolution through the process of natural selection. The term sometimes is used for two traits in the same species affecting each other\u0027s evolution, as well as gene-culture coevolution . The pollinating wasp Dasyscolia ciliata in pseudocopulation with a flower of Ophrys speculum"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Immune Response", "label": "Immune Response", "shape": "dot", "size": 14, "title": "search term: Immune Response Wikipedia URL: Immune response An immune response is a physiological reaction which occurs within an organism in the context of inflammation for the purpose of defending against exogenous factors. These include a wide variety of different toxins , viruses , intra- and extracellular bacteria , protozoa , helminths , and fungi which could cause serious problems to the health of the host organism if not cleared from the body. Innate immune response to a gram-negative bacteria invasion"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Glucose Oxidase", "label": "Glucose Oxidase", "shape": "dot", "size": 12, "title": "search term: Glucose Oxidase Wikipedia URL: Glucose oxidase The glucose oxidase enzyme ( GOx or GOD ) also known as notatin (EC number 1.1.3.4) is an oxidoreductase that catalyses the oxidation of glucose to hydrogen peroxide and D-glucono-\u03b4-lactone . This enzyme is produced by certain species of fungi and insects and displays antibacterial activity when oxygen and glucose are present."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Microbiomes", "label": "Microbiomes", "shape": "dot", "size": 14, "title": "search term: Microbiomes Wikipedia URL: Microbiomes A microbiome (from Ancient Greek \u03bc\u03b9\u03ba\u03c1\u03cc\u03c2 (mikr\u00f3s) \u0027 small \u0027 and \u03b2\u03af\u03bf\u03c2 (b\u00edos) \u0027 life \u0027 ) is the community of microorganisms that can usually be found living together in any given habitat . It was defined more precisely in 1988 by Whipps et al. as \"a characteristic microbial community occupying a reasonably well-defined habitat which has distinct physio-chemical properties. The term thus not only refers to the microorganisms involved but also encompasses their theatre of activity\". In 2020, an international panel of experts published the outcome of their discussions on the definition of the microbiome. They proposed a definition of the microbiome based on a revival of the \"compact, clear, and comprehensive description of the term\" as originally provided by Whipps et al. , but supplemented with two explanatory paragraphs, the first pronouncing the dynamic character of the microbiome, and the second clearly separating the term microbiota fr"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "feeding behavior", "label": "feeding behavior", "shape": "dot", "size": 12, "title": "search term: feeding behavior Wikipedia URL: Feeding behavior Feeding is the process by which organisms, typically animals , obtain food . Terminology often uses either the suffixes -vore, -vory, or -vorous from Latin vorare , meaning \"to devour\", or -phage, -phagy, or -phagous from Greek \u03c6\u03b1\u03b3\u03b5\u1fd6\u03bd ( phagein ), meaning \"to eat\". Circular dendrogram of feeding behaviours"}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "ecology", "label": "ecology", "shape": "dot", "size": 22, "title": "search term: ecology Wikipedia URL: Ecology Ecology (from Ancient Greek \u03bf\u1f36\u03ba\u03bf\u03c2 ( o\u00eekos ) \u0027 house \u0027 and -\u03bb\u03bf\u03b3\u03af\u03b1 ( -log\u00eda ) \u0027 study of \u0027 ) is the natural science of the relationships among living organisms and their environment . Ecology considers organisms at the individual, population , community , ecosystem , and biosphere levels. Ecology overlaps with the closely related sciences of biogeography , evolutionary biology , genetics , ethology , and natural history ."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "evolution", "label": "evolution", "shape": "dot", "size": 22, "title": "search term: evolution Wikipedia URL: Evolution Evolution is the change in the heritable characteristics of biological populations over successive generations. It occurs when evolutionary processes such as genetic drift and natural selection act on genetic variation, resulting in certain characteristics becoming more or less common within a population over successive generations. The process of evolution has given rise to biodiversity at every level of biological organisation ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "commensal bacteria", "label": "commensal bacteria", "shape": "dot", "size": 12, "title": "search term: commensal bacteria Wikipedia URL: Commensal bacteria Commensalism is a long-term biological interaction ( symbiosis ) in which members of one species gain benefits while those of the other species neither benefit nor are harmed. This is in contrast with mutualism , in which both organisms benefit from each other; amensalism , where one is harmed while the other is unaffected; and parasitism , where one is harmed and the other benefits. Remora are specially adapted to attach themselves to larger fish (or other animals, in this case a sea turtle) that provide locomotion and food."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Proteomics", "label": "Proteomics", "shape": "dot", "size": 12, "title": "search term: Proteomics Wikipedia URL: Proteomics Proteomics is the large-scale study of proteins . It is an interdisciplinary domain that has benefited greatly from the genetic information of various genome projects, including the Human Genome Project . It covers the exploration of proteomes from the overall level of protein composition, structure, and activity, and is an important component of functional genomics . The proteome is the entire set of proteins produced or modified by an organism or system. Robotic preparation of MALDI mass spectrometry samples on a sample carrier"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Plutellidae", "label": "Plutellidae", "shape": "dot", "size": 12, "title": "search term: Plutellidae Wikipedia URL: Plutellidae The Plutellidae are a family of moths commonly known as the diamondback moths , named after the diamondback moth ( Plutella xylostella ) of European origin. It was once considered to have three subfamilies: Plutellinae, Praydinae, and Scythropiinae . Praydinae was later elevated to its own family, Praydidae , while Scythropiinae has variously been moved to Yponomeutidae or also elevated to its own family."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "tomato", "label": "tomato", "shape": "dot", "size": 12, "title": "search term: tomato Wikipedia URL: Tomato The tomato ( US : / t \u0259 \u02c8 m e\u026a t o\u028a / , UK : / t \u0259 \u02c8 m \u0251\u02d0 t o\u028a / ; Solanum lycopersicum ) is a plant whose fruit is an edible berry that is eaten as a vegetable. The tomato is a member of the nightshade family that includes tobacco , potato , and chili peppers . It originated from western South America , and may have been domesticated there or in Mexico (Central America). It was introduced to the Old World by the Spanish in the Columbian exchange in the 16th century. Solanum lycopersicum var. lycopersicum : one of the oldest surviving tomato specimens. Page from the En Tibi Herbarium , 1558. Naturalis Leiden."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Lycopersicon", "label": "Lycopersicon", "shape": "dot", "size": 14, "title": "search term: Lycopersicon Wikipedia URL: Lycopersicon Lycopersicon was a genus in the flowering plant family Solanaceae (the nightshades and relatives). It contained about 13 species in the tomato group of nightshades. First removed from the genus Solanum by Philip Miller in 1754, its removal leaves the latter genus paraphyletic , so modern botanists generally accept the names in Solanum . The name Lycopersicon (from Greek \u03bb\u03c5\u03ba\u03bf\u03c0\u03ad\u03c1\u03c3\u03b9\u03ba\u03bf\u03bd meaning \"wolf peach\") is a reference to German folklore about members of the nightshade family being used to summon werewolves, and still used by gardeners, farmers, and seed companies. Collectively, the species in this group apart from the common cultivated plant are called wild tomatoes . Fruit of three cultivars of the common tomato ( Solanum lycopersicum )"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Comparative genomics", "label": "Comparative genomics", "shape": "dot", "size": 16, "title": "search term: Comparative genomics Wikipedia URL: Comparative genomics Comparative genomics is a branch of biological research that examines genome sequences across a spectrum of species , spanning from humans and mice to a diverse array of organisms from bacteria to chimpanzees . This large-scale holistic approach compares two or more genomes to discover the similarities and differences between the genomes and to study the biology of the individual genomes. Comparison of whole genome sequences provides a highly detailed view of how organisms are related to each other at the gene level. By comparing whole genome sequences, researchers gain insights into genetic relationships between organisms and study evolutionary changes . The major principle of comparative genomics is that common features of two organisms will often be encoded within the DNA that is evolutionarily conserved between them. Therefore, Comparative genomics provides a powerful tool for studying evolutionary changes among "}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "BMC Genom", "label": "BMC Genom", "shape": "dot", "size": 12, "title": "search term: BMC Genom Wikipedia URL: BMC Genom BMC Genomics is an open-access scientific journal covering all areas of genomics and proteomics . The journal was established in 2000 and is published by BioMed Central . Its 2024 impact factor is 3.7."}]);
