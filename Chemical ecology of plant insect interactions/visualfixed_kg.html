        <script type="text/javascript">

              // initialize global variables.
              var edges;

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Chemical Ecology", "label": "Chemical Ecology", "shape": "dot", "size": 12, "title": "search term: Chemical Ecology Wikipedia URL: Chemical ecology Chemical ecology is a vast and interdisciplinary field utilizing biochemistry , biology , ecology , and organic chemistry for explaining observed interactions of living things and their environment through chemical compounds (e.g. ecosystem resilience and biodiversity). Early examples of the field trace back to experiments with the same plant genus in different environments, interaction of plants and butterflies, and the behavioral effect of catnip. Chemical ecologists seek to identify the specific molecules (i.e. semiochemicals ) that function as signals mediating community or ecosystem processes and to understand the evolution of these signals. The chemicals behind such roles are typically small, readily-diffusible organic molecules that act over various distances that are dependent on the environment (i.e. terrestrial or aquatic) but can also include larger molecules and small peptides. Monarch butterfly caterpillar on mi"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "sawflies", "label": "sawflies", "shape": "dot", "size": 14, "title": "search term: sawflies Wikipedia URL: Sawflies Sawflies are wasp -like insects that are in the suborder Symphyta within the order Hymenoptera . The common name comes from the saw-like appearance of the ovipositor , which females use to cut into the plants where they lay their eggs. The name is associated especially with the Tenthredinoidea , by far the largest superfamily in the suborder, with about 7,000 known species in the entire suborder. There are 8,000 described species in more than 800 genera."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "cuticular hydrocarbons", "label": "cuticular hydrocarbons", "shape": "dot", "size": 12, "title": "search term: cuticular hydrocarbons Wikipedia URL: Cuticular hydrocarbons Insects (from Latin insectum ) are hexapod invertebrates of the class Insecta . They are the largest group within the arthropod phylum . Insects have a chitinous exoskeleton , a three-part body ( head , thorax and abdomen ), three pairs of jointed legs , compound eyes , and a pair of antennae . Insects are the most diverse group of animals, with more than a million described species ; they represent more than half of all animal species."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "mating", "label": "mating", "shape": "dot", "size": 12, "title": "search term: mating Wikipedia URL: Mating In biology , mating is the pairing of either opposite-sex or hermaphroditic organisms for the purposes of sexual reproduction . Fertilization is the fusion of two gametes . Copulation is the union of the sex organs of two sexually reproducing animals for insemination and subsequent internal fertilization . Mating may also lead to external fertilization , as seen in amphibians , bony fishes and plants. For most species, mating is between two individuals of opposite sexes. However, for some hermaphroditic species, copulation is not required because the parent organism is capable of self-fertilization ( autogamy ); for example, banana slugs . Blue-tailed damselflies ( Ischnura elegans ) mating"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "conspecifics", "label": "conspecifics", "shape": "dot", "size": 12, "title": "search term: conspecifics Wikipedia URL: Conspecifics Biological specificity is the tendency of a characteristic such as a behavior or a biochemical variation to occur in a particular species . Biochemist Linus Pauling stated that \"Biological specificity is the set of characteristics of living organisms or constituents of living organisms of being special or doing something special. Each animal or plant species is special. It differs in some way from all other species...biological specificity is the major problem about understanding life.\""}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "females", "label": "females", "shape": "dot", "size": 12, "title": "search term: females Wikipedia URL: Females An organism \u0027s sex is female ( symbol : \u2640 ) if it produces, or is organized to produce, the ovum (egg cell), the type of gamete (sex cell) that fuses with the male gamete (sperm cell) during sexual reproduction . The symbol of the Roman goddess Venus is used to represent the female sex in biology."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "organisms", "label": "organisms", "shape": "dot", "size": 12, "title": "search term: organisms Wikipedia URL: Organisms An organism is any living thing that functions as an individual . Such a definition raises more problems than it solves, not least because the concept of an individual is also difficult. Several criteria, few of which are widely accepted, have been proposed to define what constitutes an organism. Among the most common is that an organism has autonomous reproduction , growth , and metabolism . This would exclude viruses , even though they evolve like organisms. One criterion proposes that an organism cannot be divided without losing functionality. This basil plant cutting is however developing new adventitious roots from a small bit of stem , forming a new plant."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "turnip sawfly", "label": "turnip sawfly", "shape": "dot", "size": 12, "title": "search term: turnip sawfly Wikipedia URL: Turnip sawfly Athalia rosae , the turnip sawfly , cabbage leaf sawfly or beet sawfly , is a typical sawfly with dark green or blackish 18\u201325 mm long larvae that feed on plants of the brassica family, and can sometimes be a pest. It winters below the ground, emerging in early summer as a 7\u20138 mm adult with a mainly orange body and a black head. The adult feeds on nectar ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "sex", "label": "sex", "shape": "dot", "size": 20, "title": "search term: sex Wikipedia URL: Sex Sex is the biological trait of a reproducing organism in producing gametes of one of two different sizes or shapes \u2014 male or female gametes. Thus, the typical classification for such organisms, their sex, is also known as either male or female. During sexual reproduction, a male and a female gamete fuse to form a zygote , which develops into an offspring that inherits traits from each parent. By convention, organisms that produce smaller gametes ( spermatozoa , sperm ) are called male , while organisms that produce larger gametes ( ova , often called egg cells) are called female . An organism that produces both types of gamete is a hermaphrodite . The life cycle of a sexually reproducing species cycles through haploid and diploid stages"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Petri dish", "label": "Petri dish", "shape": "dot", "size": 12, "title": "search term: Petri dish Wikipedia URL: Petri dish A Petri dish (alternatively known as a Petri plate or cell-culture dish ) is a shallow transparent lidded dish that biologists use to hold growth medium in which cells can be cultured , originally, cells of bacteria , fungi , and small mosses . The container is named after its inventor, German bacteriologist Julius Richard Petri . It is the most common type of culture plate . The Petri dish is one of the most common items in biology laboratories and has entered popular culture . The term is sometimes written in lower case, especially in non-technical literature. A glass Petri dish with culture"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Hymenoptera", "label": "Hymenoptera", "shape": "dot", "size": 20, "title": "search term: Hymenoptera Wikipedia URL: Hymenoptera Hymenoptera is a large order of insects , comprising the sawflies , wasps , bees , and ants . Over 150,000 living species of Hymenoptera have been described, in addition to over 2,000 extinct ones. Many of the species are parasitic . Females typically have a special ovipositor for inserting eggs into hosts or places that are otherwise inaccessible. This ovipositor is often modified into a stinger . The young develop through holometabolism (complete metamorphosis )\u2014that is, they have a wormlike larval stage and an inactive pupal stage before they reach adulthood."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Perception", "label": "Perception", "shape": "dot", "size": 12, "title": "search term: Perception Wikipedia URL: Perception Perception (from Latin perceptio \u0027 gathering, receiving \u0027 ) is the organization, identification, and interpretation of sensory information, in order to represent and understand the presented information or environment. All perception involves signals that go through the nervous system , which in turn result from physical or chemical stimulation of the sensory system . Vision involves light striking the retina of the eye ; smell is mediated by odor molecules ; and hearing involves pressure waves . The Necker cube and Rubin vase can be perceived in more than one way."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Brassicaceae", "label": "Brassicaceae", "shape": "dot", "size": 14, "title": "search term: Brassicaceae Wikipedia URL: Brassicaceae See list of Brassicaceae genera"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "oviposition", "label": "oviposition", "shape": "dot", "size": 12, "title": "search term: oviposition Wikipedia URL: Oviposition The ovipositor is a tube-like organ used by some animals , especially insects , for the laying of eggs . In insects, an ovipositor consists of a maximum of three pairs of appendages. The details and morphology of the ovipositor vary, but typically its form is adapted to functions such as preparing a place for the egg, transmitting the egg, and then placing it properly. For most insects, the organ is used merely to attach the egg to some surface, but for many parasitic species (primarily in wasps and other Hymenoptera ), it is a piercing organ as well. Ovipositor of long-horned grasshopper (the two cerci are also visible)"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "males", "label": "males", "shape": "dot", "size": 12, "title": "search term: males Wikipedia URL: Males Male ( symbol : \u2642 ) is the sex of an organism that produces, or is organized to produce, the gamete (sex cell) known as sperm , which fuses with the larger female gamete, or ovum , in the process of fertilisation . A male organism cannot reproduce sexually without access to at least one ovum from a female, but some organisms can reproduce both sexually and asexually . Most male mammals , including male humans, have a Y chromosome , which codes for the production of larger amounts of testosterone to develop male reproductive organs . The symbol of the Roman god Mars (god of war) is often used to represent the male sex. It also stands for the planet Mars and is the alchemical symbol for iron ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "mating preferences", "label": "mating preferences", "shape": "dot", "size": 12, "title": "search term: mating preferences Wikipedia URL: Mating preferences Mating preferences are qualities that one desires in a romantic or sexual partner . Research across many domains, such as evolutionary biology , psychology , and anthropology , shows that humans display both widely shared (consensual) preferences \u2013 like preferences for kindness, intelligence, and health \u2013 as well as sex-differentiated preferences shaped by ancestral selection pressures. These preferences are understood within the framework of sexual selection (first proposed by Charles Darwin in 1871) and more contemporary theories that draw on evolutionary explanations , cultural variation , and evidence from actual mating behaviors. These theories account for the variation in desires for certain traits, the divergence of preference between men and women, and the adoption of short-term vs long-term mating strategies. Together, these approaches explain the origins, adaptive functions, and real-word outcomes of human mate"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Formicidae", "label": "Formicidae", "shape": "dot", "size": 14, "title": "search term: Formicidae Wikipedia URL: Formicidae Ants are eusocial insects of the family Formicidae and, along with the related wasps and bees , belong to the order Hymenoptera . Ants evolved from vespoid wasp ancestors in the Cretaceous period. More than 13,800 of an estimated total of 22,000 species have been classified. They are easily identified by their geniculate (elbowed) antennae and the distinctive node-like structure that forms their slender waists."}, {"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "species", "label": "species", "shape": "dot", "size": 64, "title": "search term: species Wikipedia URL: Species A species ( pl. species ) is the basic unit of classification and a taxonomic rank of an organism, as well as a unit of biodiversity . It can be defined as the largest group of organisms in which any two individuals of the appropriate sexes or mating types can produce fertile offspring , typically by sexual reproduction . Other ways of defining species include their karyotype , DNA sequence, morphology , behaviour, or ecological niche . In addition, palaeontologists use the concept of the chronospecies since fossil reproduction cannot be examined. The most recent rigorous estimate for the total number of species of eukaryotes is between 8 and 8.7 million. About 14% of these had been described by 2011. All species (except viruses ) are given a two-part name , a \"binomen\". The first part of a binomen is the name of a genus to which the species belongs. The second part is called the specific name or the specific epithet (in botanical nomenclatur"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "genetics", "label": "genetics", "shape": "dot", "size": 20, "title": "search term: genetics Wikipedia URL: Genetics Genetics is the study of genes , genetic variation , and heredity in organisms . It is an important branch in biology because heredity is vital to organisms\u0027 evolution . Gregor Mendel , a Moravian Augustinian friar working in the 19th century in Brno , was the first to study genetics scientifically. Mendel studied \"trait inheritance\", patterns in the way traits are handed down from parents to offspring over time. He observed that organisms (pea plants) inherit traits by way of discrete \"units of inheritance\". This term, still used today, is a somewhat ambiguous definition of what is referred to as a gene. Portrait of Imre Festetics , the first geneticist and ethologist . His concepts of selection and evolution were later formulated in Charles Darwin\u0027s theory of evolution ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "physiology", "label": "physiology", "shape": "dot", "size": 18, "title": "search term: physiology Wikipedia URL: Physiology Physiology ( / \u02cc f \u026a z i \u02c8 \u0252 l \u0259 d\u0292 i / ; from Ancient Greek \u03c6\u03cd\u03c3\u03b9\u03c2 ( ph\u00fasis ) \u0027 nature, origin \u0027 and -\u03bb\u03bf\u03b3\u03af\u03b1 ( -log\u00eda ) \u0027 study of \u0027 ) is the scientific study of functions and mechanisms in a living system . As a subdiscipline of biology , physiology focuses on how organisms , organ systems , individual organs , cells , and biomolecules carry out chemical and physical functions in a living system. According to the classes of organisms , the field can be divided into medical physiology , animal physiology , plant physiology , cell physiology , and comparative physiology . Oil painting depicting Claude Bernard , the father of modern physiology, with his pupils"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "taste", "label": "taste", "shape": "dot", "size": 16, "title": "search term: taste Wikipedia URL: Taste The gustatory system or sense of taste is the sensory system that is partially responsible for the perception of taste. Taste is the perception stimulated when a substance in the mouth reacts chemically with taste receptor cells located on taste buds in the oral cavity , mostly on the tongue . Taste, along with the sense of smell and trigeminal nerve stimulation (registering texture, pain, and temperature), determines flavors of food and other substances. Humans have taste receptors on taste buds and other areas, including the upper surface of the tongue and the epiglottis . The gustatory cortex is responsible for the perception of taste. Taste bud"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Tenthredinidae", "label": "Tenthredinidae", "shape": "dot", "size": 12, "title": "search term: Tenthredinidae Wikipedia URL: Tenthredinidae Allantinae Blennocampinae Heterarthrinae Nematinae Selandriinae - (includes Dolerinae) Susaninae Tenthredininae"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Apiaceae", "label": "Apiaceae", "shape": "dot", "size": 12, "title": "search term: Apiaceae Wikipedia URL: Apiaceae Apiaceae ( / \u02cc e\u026a p i \u02c8 e\u026a s i . i\u02d0 , - \u02cc a\u026a / \u24d8 ), also called Umbelliferae , is a family of mostly aromatic flowering plants named after the type genus Apium , and commonly known as the celery , carrot , or parsley family , or simply as umbellifers . It is the 16th-largest family of flowering plants, with more than 3,800 species in about 446 genera , including such well-known, and economically important plants as ajwain , angelica , anise , asafoetida , caraway , carrot , celery , chervil , coriander , cumin , dill , fennel , lovage , cow parsley , parsley , parsnip and sea holly , as well as silphium , a plant whose exact identity is unclear and which may be extinct."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "leaves", "label": "leaves", "shape": "dot", "size": 12, "title": "search term: leaves Wikipedia URL: Leaves A leaf ( pl. : leaves ) is a principal appendage of the stem of a vascular plant , usually borne laterally above ground and specialized for photosynthesis . Leaves are collectively called foliage , as in \"autumn foliage\", while the leaves, stem, flower , and fruit collectively form the shoot system. In most leaves, the primary photosynthetic tissue is the palisade mesophyll and is located on the upper side of the blade or lamina of the leaf, but in some species, including the mature foliage of Eucalyptus , palisade mesophyll is present on both sides and the leaves are said to be isobilateral. The leaf is an integral part of the stem system, and most leaves are flattened and have distinct upper ( adaxial ) and lower ( abaxial ) surfaces that differ in color, hairiness , the number of stomata (pores that intake and output gases), the amount and structure of epicuticular wax , and other features. Leaves are mostly green in color due to the presenc"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Brassica rapa", "label": "Brassica rapa", "shape": "dot", "size": 12, "title": "search term: Brassica rapa Wikipedia URL: Brassica rapa Brassica rapa is an annual to biennial plant species native to Eurasia that is from the Brassicaceae family . It has been widely cultivated into many forms, including the turnip (a root vegetable ), komatsuna , Chinese cabbage , bomdong , pak choi / bok choy , and rapini . Its domesticated forms include turnips and leafy greens, such as bok choy and napa cabbage. The oilseed types are grown for food and industrial uses. Genetic studies indicate that B. rapa was one of the earliest domesticated brassicas, with turnip-like forms arising first and additional morphotypes developing independently across Eurasia. Wild, feral, and cultivated populations are found worldwide, making the species important agriculturally, economically, and ecologically."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "acclimatization", "label": "acclimatization", "shape": "dot", "size": 12, "title": "search term: acclimatization Wikipedia URL: Acclimatization Acclimatization or acclimatisation ( also called acclimation or acclimatation ) is the process in which an individual organism adjusts to a change in its environment (such as a change in altitude, temperature, humidity, photoperiod , or pH ), allowing it to maintain fitness across a range of environmental conditions. Acclimatization occurs in a short period of time (hours to weeks), and within the organism\u0027s lifetime (compared to adaptation , which is evolution, taking place over many generations). This may be a discrete occurrence (for example, when mountaineers acclimate to high altitude over hours or days) or may instead represent part of a periodic cycle, such as a mammal shedding heavy winter fur in favor of a lighter summer coat. Organisms can adjust their morphological, behavioral, physical, and/or biochemical traits in response to changes in their environment. While the capacity to acclimate to novel environments has b"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "taxonomic groups", "label": "taxonomic groups", "shape": "dot", "size": 12, "title": "search term: taxonomic groups Wikipedia URL: Taxonomic groups In biology , taxonomy (from Ancient Greek \u03c4\u03ac\u03be\u03b9\u03c2 ( taxis ) \u0027 arrangement \u0027 and -\u03bd\u03bf\u03bc\u03af\u03b1 ( -nomia ) \u0027 method \u0027 ) is the scientific study of naming, defining ( circumscribing ) and classifying groups of biological organisms based on shared characteristics. Organisms are grouped into taxa (singular: taxon), and these groups are given a taxonomic rank ; groups of a given rank can be aggregated to form a more inclusive group of higher rank, thus creating a taxonomic hierarchy. The principal ranks in modern use are domain , kingdom , phylum ( division is sometimes used in botany in place of phylum ), class , order , family , genus , and species . The Swedish botanist Carl Linnaeus is regarded as the founder of the current system of taxonomy, having developed a ranked system known as Linnaean taxonomy for categorizing organisms. Description of rare animals (\u5199\u751f\u73cd\u79bd\u56fe), by Song dynasty painter Huang Quan (903\u2013965)"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "sexual dimorphism", "label": "sexual dimorphism", "shape": "dot", "size": 16, "title": "search term: sexual dimorphism Wikipedia URL: Sexual dimorphism Sexual dimorphism is the condition where different sexes of the same species exhibit different morphological characteristics, including characteristics not directly involved in reproduction . The condition occurs in most dioecious species, which consist of most animals and some plants. Differences may include secondary sex characteristics , size, weight, color, markings, or behavioral or cognitive traits. Male-male reproductive competition has evolved a diverse array of sexually dimorphic traits. Aggressive utility traits such as \"battle\" teeth and blunt heads reinforced as battering rams are used as weapons in aggressive interactions between rivals. Passive displays such as ornamental feathering or song-calling have also evolved mainly through sexual selection. These differences may be subtle or exaggerated and may be subjected to sexual selection and natural selection . The opposite of dimorphism is monomorphism , when b"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "sexual selection", "label": "sexual selection", "shape": "dot", "size": 20, "title": "search term: sexual selection Wikipedia URL: Sexual selection Sexual selection is a mechanism of evolution in which members of one sex chooses mates of the other sex (intersexual selection) to mate with, and compete with members of the same sex for access to members of the opposite sex (intrasexual selection). These two forms of selection mean that some individuals have greater reproductive success than others within a population , for example because they are more attractive or prefer more attractive partners to produce offspring . Successful males benefit from frequent mating and monopolizing access to one or more fertile females. Females can maximise the return on the energy they invest in reproduction by selecting and mating with the best males. Sexual selection creates colourful differences between sexes in Goldie\u0027s bird-of-paradise . Male above; female below. Painting by John Gerrard Keulemans ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "leaf beetle", "label": "leaf beetle", "shape": "dot", "size": 14, "title": "search term: leaf beetle Wikipedia URL: Leaf beetle The beetle family Chrysomelidae , commonly known as leaf beetles , includes over 37,000 (and probably at least 50,000) [ citation needed ] species in more than 2,500 genera , making it one of the largest and most commonly encountered of all beetle families. Numerous subfamilies are recognized, but the specifics of leaf beetle taxonomy and systematics are likely to change with ongoing research."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "diterpenoids", "label": "diterpenoids", "shape": "dot", "size": 14, "title": "search term: diterpenoids Wikipedia URL: Diterpenoids Diterpenes are a class of terpenes composed of four isoprene units, often with the molecular formula C 20 H 32 . They are biosynthesized by plants, animals and fungi via the HMG-CoA reductase pathway , with geranylgeranyl pyrophosphate being a primary intermediate. Diterpenes form the basis for biologically important compounds such as retinol , retinal , and phytol . Some diterpenes are antimicrobial and anti-inflammatory . Geranylgeranyl pyrophosphate, the starting material for the biosynthesis of diterpenes"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "addictive behavior", "label": "addictive behavior", "shape": "dot", "size": 12, "title": "search term: addictive behavior Wikipedia URL: Addictive behavior An addictive behavior is a behavior, or a stimulus related to a behavior (e.g., sex or food), that is both rewarding and reinforcing , and is associated with the development of an addiction . There are two main forms of addiction: substance use disorders (including alcohol, tobacco, and cannabis) and behavioral addiction (including sex, gambling, eating, and shoplifting). The parallels and distinctions between behavioral addictions and other compulsive behavior disorders like bulimia nervosa and obsessive-compulsive disorder (OCD) are still being researched by behavioral scientists."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Creative Commons", "label": "Creative Commons", "shape": "dot", "size": 12, "title": "search term: Creative Commons Wikipedia URL: Creative Commons Creative Commons ( CC ) is an American non-profit organization and international network devoted to educational access and expanding the range of creative works available for others to build upon legally and to share. The organization has released several copyright licenses , known as Creative Commons licenses , free of charge to the public, to allow authors of creative works to communicate which rights they reserve and which rights they waive for the benefit of recipients or other creators. Content owners still maintain their copyright, but Creative Commons licenses give standard releases that replace the individual negotiations for specific rights between copyright owner (licensor) and licensee , that are necessary under an \" all rights reserved \" copyright management."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Terpenes", "label": "Terpenes", "shape": "dot", "size": 12, "title": "search term: Terpenes Wikipedia URL: Terpenes Terpenes ( / \u02c8 t \u025c\u02d0r p i\u02d0 n z / TUR -peenz ) are a large and diverse class of natural products with the general formula (C 5 H 8 ) n , where n \u2265 2. They serve as crucial biosynthetic building blocks in many organisms, particularly plants. Comprising more than 30,000 compounds, these unsaturated hydrocarbons are produced predominantly by plants , particularly conifers . In plants, terpenes and terpenoids are important mediators of ecological interactions , while some insects use some terpenes as a form of defense. Other functions of terpenoids include cell growth modulation and plant elongation, light harvesting and photoprotection, and membrane permeability and fluidity control. Many terpenes are derived commercially from conifer resins, such as those made by this pine ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "terpenoids", "label": "terpenoids", "shape": "dot", "size": 12, "title": "search term: terpenoids Wikipedia URL: Terpenoids The terpenoids , also known as isoprenoids , are a class of naturally occurring organic chemicals derived from the 5-carbon compound isoprene and its derivatives called terpenes , diterpenes , etc. While sometimes used interchangeably with \"terpenes\", terpenoids contain additional functional groups , usually containing oxygen. When combined with the hydrocarbon terpenes, terpenoids comprise about 80,000 compounds. They are the largest class of plant secondary metabolites , representing about 60% of known natural products . Many terpenoids have substantial pharmacological bioactivity and are therefore of interest to medicinal chemists."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "genetic diversity", "label": "genetic diversity", "shape": "dot", "size": 14, "title": "search term: genetic diversity Wikipedia URL: Genetic diversity Genetic diversity is the total number of genetic characteristics in the genetic makeup of a species. It ranges widely, from the number of species to differences within species , and can be correlated to the span of survival for a species. It is distinguished from genetic variability , which describes the tendency of genetic characteristics to vary. A graphical representation of the typical human karyotype ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "habitat", "label": "habitat", "shape": "dot", "size": 20, "title": "search term: habitat Wikipedia URL: Habitat In ecology , habitat refers to the array of resources, biotic factors that are present in an area, such as to support the survival and reproduction of a particular species . A species\u0027 habitat can be seen as the physical manifestation of its ecological niche . Thus \"habitat\" is a species-specific term, fundamentally different from concepts such as environment or vegetation assemblages, for which the term \"habitat-type\" is more appropriate. This coral reef in the Phoenix Islands Protected Area provides habitat for numerous marine species."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Bombus terrestris", "label": "Bombus terrestris", "shape": "dot", "size": 12, "title": "search term: Bombus terrestris Wikipedia URL: Bombus terrestris Bombus terrestris , the buff-tailed bumblebee or large earth bumblebee , is one of the most numerous bumblebee species in Europe . It is one of the main species used in greenhouse pollination , and so can be found in many countries and areas where it is not native, such as Tasmania . Moreover, it is a eusocial insect with an overlap of generations, a division of labour, and cooperative brood care. The queen is monogamous which means she mates with only one male. B. terrestris workers learn flower colours and forage efficiently."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "chemistry", "label": "chemistry", "shape": "dot", "size": 14, "title": "search term: chemistry Wikipedia URL: Chemistry Chemistry is the scientific study of the properties and behavior of matter . It is a physical science within the natural sciences that studies the chemical elements that make up matter and compounds made of atoms , molecules and ions : their composition, structure, properties, behavior and the changes they undergo during reactions with other substances . Chemistry also addresses the nature of chemical bonds in chemical compounds ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Phenotypic plasticity", "label": "Phenotypic plasticity", "shape": "dot", "size": 12, "title": "search term: Phenotypic plasticity Wikipedia URL: Phenotypic plasticity Phenotypic plasticity refers to some of the changes in an organism \u0027s behavior, morphology and physiology in response to a unique environment. Fundamental to the way in which organisms cope with environmental variation, phenotypic plasticity encompasses all types of environmentally induced changes (e.g. morphological , physiological , behavioural , phenological ) that may or may not be permanent throughout an individual\u0027s lifespan. Phenotypic plasticity is the ability of one genotype to produce more than one phenotype when exposed to different environments. Each line here represents a genotype. Horizontal lines show that the phenotype is the same in different environments; slanted lines show that there are different phenotypes in different environments, and thus indicate plasticity."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "olfaction", "label": "olfaction", "shape": "dot", "size": 12, "title": "search term: olfaction Wikipedia URL: Olfaction The sense of smell , or olfaction , is the special sense through which smells (or odors ) are perceived. The sense of smell has many functions, including detecting desirable foods, hazards, and pheromones , and plays a role in taste."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "parasitoid wasps", "label": "parasitoid wasps", "shape": "dot", "size": 18, "title": "search term: parasitoid wasps Wikipedia URL: Parasitoid wasps Parasitoid wasps are a large group of hymenopteran superfamilies , with all but the wood wasps ( Orussoidea ) being in the wasp-waisted Apocrita . As parasitoids , they lay their eggs on or in the bodies of other arthropods , sooner or later causing the death of these hosts . Different species specialise in hosts from different insect orders, most often Lepidoptera , though some select beetles , flies , or bugs ; the spider wasps ( Pompilidae ) exclusively attack spiders . Megarhyssa macrurus ( Ichneumonidae ), a parasitoid , ovipositing into its host through the wood of a tree. The body of a female is c. 2 inches (50 mm) long, with an ovipositor c. 4 inches (100 mm) long."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "adaptation", "label": "adaptation", "shape": "dot", "size": 16, "title": "search term: adaptation Wikipedia URL: Adaptation Collective intelligence Collective action Self-organized criticality Herd mentality Phase transition Agent-based modelling Synchronization Ant colony optimization Particle swarm optimization Swarm behaviour The second of Jean-Baptiste Lamarck \u0027s two factors (the first being a complexifying force) was an adaptive force that causes animals with a given body plan to adapt to circumstances by inheritance of acquired characteristics , creating a diversity of species and genera ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "butterfly", "label": "butterfly", "shape": "dot", "size": 14, "title": "search term: butterfly Wikipedia URL: Butterfly Butterflies are winged insects from the lepidopteran superfamily Papilionoidea , characterised by large, often brightly coloured wings that often fold together when at rest, and a conspicuous, fluttering flight. The oldest butterfly fossils have been dated to the Paleocene , about 56 million years ago, though molecular evidence suggests that they likely originated in the Cretaceous ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Heliconius Erato", "label": "Heliconius Erato", "shape": "dot", "size": 12, "title": "search term: Heliconius Erato Wikipedia URL: Heliconius erato Heliconius erato , or the red postman , is one of about 40 neotropical species of butterfly belonging to the genus Heliconius . It is also commonly known as the small postman , the red passion flower butterfly , or the crimson-patched longwing . It was described by Carl Linnaeus in his 1758 10th edition of Systema Naturae ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "agriculture", "label": "agriculture", "shape": "dot", "size": 12, "title": "search term: agriculture Wikipedia URL: Agriculture Agriculture is the practice of cultivating the soil, planting, raising, and harvesting both food and non-food crops, as well as livestock production. Broader definitions also include forestry and aquaculture . Agriculture was a key factor in the rise of sedentary human civilization , whereby farming of domesticated plants and animals created food surpluses that enabled people to live in the cities. While humans started gathering grains at least 105,000 years ago, nascent farmers only began planting them around 11,500 years ago. Sheep, goats, pigs, and cattle were domesticated around 10,000 years ago. Plants were independently cultivated in at least 11 regions of the world. In the 20th century, industrial agriculture based on large-scale monocultures came to dominate agricultural output. Modern agriculture: a center pivot irrigation system on a field"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "species recognition", "label": "species recognition", "shape": "dot", "size": 12, "title": "search term: species recognition Wikipedia URL: Species recognition Intra-species recognition is the recognition by a member of an animal species of a conspecific (another member of the same species). In many species, such recognition is necessary for procreation."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "addiction", "label": "addiction", "shape": "dot", "size": 12, "title": "search term: addiction Wikipedia URL: Addiction Addiction is a neuropsychological disorder characterized by a persistent and intense urge to use a drug or engage in a behavior that produces an immediate psychological reward, despite substantial harm and other negative consequences. Repetitive drug use can alter brain function in synapses similar to natural rewards like food or falling in love in ways that perpetuate craving and weakens self-control for people with pre-existing vulnerabilities. This phenomenon \u2013 drugs reshaping brain function \u2013 has led to an understanding of addiction as a brain disorder with a complex variety of psychosocial as well as neurobiological factors that are implicated in the development of addiction. While mice given cocaine showed the compulsive and involuntary nature of addiction, for humans this is more complex, related to behavior or personality traits. Acute confusional state caused by alcohol withdrawal , otherwise known as delirium tremens"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "ecological communities", "label": "ecological communities", "shape": "dot", "size": 12, "title": "search term: ecological communities Wikipedia URL: Ecological communities In ecology, a community is a group or association of populations of two or more different species occupying the same geographical area at the same time, also known as a biocoenosis , biotic community , biological community , ecological community , or life assemblage . The term community has a variety of uses. In its simplest form it refers to groups of organisms in a specific place or time, for example, \"the fish community of Lake Ontario before industrialization\". A bear with a salmon. Interspecific interactions such as predation are a key aspect of community ecology."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "information theory", "label": "information theory", "shape": "dot", "size": 12, "title": "search term: information theory Wikipedia URL: Information theory Information theory is the mathematical study of the quantification , storage , and communication of a particular type of mathematically defined information . The field was established and formalized by Claude Shannon in the 1940s, though early contributions were made in the 1920s through the works of Harry Nyquist and Ralph Hartley . It is at the intersection of electronic engineering , mathematics , statistics , computer science , neurobiology , physics , and electrical engineering . The entropy of a Bernoulli trial as a function of success probability, often called the binary entropy function , H b ( p ) . The entropy is maximized at 1 bit per trial when the two possible outcomes are equally probable, as in an unbiased coin toss."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "gut symbionts", "label": "gut symbionts", "shape": "dot", "size": 14, "title": "search term: gut symbionts Wikipedia URL: Gut symbionts Gut microbiota , gut microbiome , or gut flora are the microorganisms , including bacteria , archaea , fungi , and viruses , that live in the digestive tracts of animals . The gastrointestinal metagenome is the aggregate of all the genomes of the gut microbiota . The gut is the main location of the human microbiome . The gut microbiota has broad impacts, including effects on colonization , resistance to pathogens , maintaining the intestinal epithelium , metabolizing dietary and pharmaceutical compounds, controlling immune function, and even behavior through the gut\u2013brain axis . Imbalances in the gut microbiota ( dysbiosis ) have been associated with numerous diseases, including inflammatory bowel disease, certain cancers, and even neurological disorders, prompting increased efforts to develop microbiome-targeted therapies. Escherichia coli , one of the many species of bacteria present in the human gut"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "microbiota", "label": "microbiota", "shape": "dot", "size": 16, "title": "search term: microbiota Wikipedia URL: Microbiota Microbiota are the range of microorganisms that may be commensal , mutualistic , or pathogenic found in and on all multicellular organisms , including plants . Microbiota include bacteria , archaea , protists , fungi , and viruses , and have been found to be crucial for immunologic, hormonal, and metabolic homeostasis of their host. Diverse microbial communities of characteristic microbiota are part of plant microbiomes , and are found on the outside surfaces and in the internal tissues of the host plant, as well as in the surrounding soil."}, {"color": "#00FF99", "font": {"color": "#FFFFFF"}, "id": "bacteria", "label": "bacteria", "shape": "dot", "size": 44, "title": "search term: bacteria Wikipedia URL: Bacteria And see text"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "symbionts", "label": "symbionts", "shape": "dot", "size": 12, "title": "search term: symbionts Wikipedia URL: Symbionts Symbiosis is any close and long-term biological interaction between two organisms of different species . In 1879, Heinrich Anton de Bary defined symbiosis as \"the living together of unlike organisms\". The term is sometimes more exclusively used in a restricted, mutualistic sense, where both symbionts contribute to each other\u0027s subsistence. This means that they benefit each other in some way. In a cleaning symbiosis , the clownfish feeds on small invertebrates, that otherwise have potential to harm the sea anemone , and the fecal matter from the clownfish provides nutrients to the sea anemone. The clownfish is protected from predators by the anemone\u0027s stinging cells, to which the clownfish is immune. The relationship is therefore classified as mutualistic ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "reactive oxygen species", "label": "reactive oxygen species", "shape": "dot", "size": 14, "title": "search term: reactive oxygen species Wikipedia URL: Reactive oxygen species In chemistry and biology , reactive oxygen species ( ROS ) are highly reactive chemicals formed from diatomic oxygen ( O 2 ), water , and hydrogen peroxide . Some prominent ROS are hydroperoxide , superoxide (O 2 \u2212 ), hydroxyl radical (OH . ), and singlet oxygen ( 1 O 2 ). ROS are pervasive because they are readily produced from O 2 , which is abundant. ROS are important in many ways, both beneficial and otherwise. ROS function as signals, that turn on and off biological functions. They are intermediates in the redox behavior of O 2 , which is central to fuel cells . ROS are central to the photodegradation of organic pollutants in the atmosphere. Most often, however, ROS are discussed in a biological context, ranging from their effects on aging and their role in causing dangerous genetic mutations. Lewis structure of some of the reactive oxygen species. A : hydroxyl radical ( HO \u2022 ); B : hydroxide ion ( HO \u2212 );"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "rice", "label": "rice", "shape": "dot", "size": 12, "title": "search term: rice Wikipedia URL: Rice Rice is a cereal grain and in its domesticated form is the staple food of over half of the world\u0027s population , particularly in Asia and Africa . Rice is the seed of the grass species Oryza sativa (Asian rice)\u2014or, much less commonly, Oryza glaberrima (African rice). Asian rice was domesticated in China some 13,500 to 8,200 years ago; African rice was domesticated in Africa about 3,000 years ago. Rice has become commonplace in many cultures worldwide; in 2023, 800 million tons were produced, placing it third after sugarcane and maize . Only some 8% of rice is traded internationally. China, India, and Indonesia are the largest consumers of rice. A substantial amount of the rice produced in developing nations is lost after harvest through factors such as poor transport and storage. Rice yields can be reduced by pests including insects , rodents , and birds , as well as by weeds , and by diseases such as rice blast . Traditional rice polycultures such "}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Bombyx mori", "label": "Bombyx mori", "shape": "dot", "size": 12, "title": "search term: Bombyx mori Wikipedia URL: Bombyx mori Bombyx mori , commonly known as the domestic silk moth , is a domesticated moth species belonging to the family Bombycidae . It is the closest relative of Bombyx mandarina , the wild silk moth. Silkworms are the larvae of silk moths. The silkworm is of particular economic value, being a primary producer of silk . The silkworm\u0027s preferred food are the leaves of white mulberry , though they may eat other species of mulberry, and even leaves of other plants. Domestic silk moths are entirely dependent on humans for reproduction, as a result of millennia of selective breeding. Wild silk moths, which are other species of Bombyx , are not as commercially viable in the production of silk."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Plutella xylostella", "label": "Plutella xylostella", "shape": "dot", "size": 12, "title": "search term: Plutella xylostella Wikipedia URL: Plutella xylostella The diamondback moth ( Plutella xylostella ), sometimes called the cabbage moth , is a moth species of the family Plutellidae and genus Plutella . The small, grayish-brown moth sometimes has a cream-colored band that forms a diamond along its back. The species may have originated in Europe , South Africa , or the Mediterranean region, but it has now spread worldwide."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "secondary metabolites", "label": "secondary metabolites", "shape": "dot", "size": 18, "title": "search term: secondary metabolites Wikipedia URL: Secondary metabolites Secondary metabolites , also called specialised metabolites , secondary products , or natural products , are organic compounds produced by any lifeform, e.g. bacteria , archaea , fungi , animals , or plants , which are not directly involved in the normal growth , development , or reproduction of the organism. Instead, they generally mediate ecological interactions , which may produce a selective advantage for the organism by increasing its survivability or fecundity . Specific secondary metabolites are often restricted to a narrow set of species within a phylogenetic group. Secondary metabolites often play an important role in plant defense against herbivory and other interspecies defenses. Humans use secondary metabolites as medicines, flavourings, pigments, and recreational drugs. Structural formula for the amino acid pipecolic acid , which contrary to other amino acids is not used as a building block in proteins"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Lepidoptera", "label": "Lepidoptera", "shape": "dot", "size": 14, "title": "search term: Lepidoptera Wikipedia URL: Lepidoptera Aglossata Glossata Heterobathmiina Zeugloptera"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "detoxification", "label": "detoxification", "shape": "dot", "size": 12, "title": "search term: detoxification Wikipedia URL: Detoxification Detoxification or detoxication ( detox for short) is the physiological or medicinal removal of toxic substances from a living organism , including the human body, which is mainly carried out by the liver . Additionally, it can refer to the period of drug withdrawal during which an organism returns to homeostasis after long-term use of an addictive substance. In medicine , detoxification can be achieved by decontamination of poison ingestion and the use of antidotes as well as techniques such as dialysis and (in a limited number of cases) chelation therapy ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "plants", "label": "plants", "shape": "dot", "size": 16, "title": "search term: plants Wikipedia URL: Plants Plants are the eukaryotic organisms that constitute the kingdom Plantae . They are predominantly photosynthetic , meaning that they obtain their energy from sunlight . They do that using the green pigment chlorophyll in their chloroplasts to produce sugars from carbon dioxide and water. Exceptions are parasitic plants that have lost the genes for chlorophyll and photosynthesis, and obtain their energy from other plants or fungi. Most plants are multicellular , except for some green algae. The desmid Cosmarium botrytis is a single cell."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "herbivores", "label": "herbivores", "shape": "dot", "size": 12, "title": "search term: herbivores Wikipedia URL: Herbivores A herbivore is an animal anatomically and physiologically evolved to feed on plants , especially upon vascular tissues such as foliage , fruits or seeds , as the main component of its diet . These more broadly also encompass animals that eat non-vascular autotrophs such as mosses , algae and lichens , but do not include those feeding on decomposed plant matters (i.e. detritivores ) or macrofungi (i.e. fungivores ). A deer and two fawns feeding on foliage"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "microorganisms", "label": "microorganisms", "shape": "dot", "size": 14, "title": "search term: microorganisms Wikipedia URL: Microorganisms A microorganism , or microbe , is an organism of microscopic size, which may exist in its single-celled form or as a colony of cells . The possible existence of unseen microbial life was suspected from antiquity, with an early attestation in Jain literature authored in 6th-century BC India. The scientific study of microorganisms began with their observation under the microscope in the 1670s by Anton van Leeuwenhoek . In the 1850s, Louis Pasteur found that microorganisms caused food spoilage , debunking the theory of spontaneous generation . In the 1880s, Robert Koch discovered that microorganisms caused the diseases tuberculosis , cholera , diphtheria , and anthrax . A cluster of Escherichia coli bacteria magnified 10,000 times"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "feeding", "label": "feeding", "shape": "dot", "size": 12, "title": "search term: feeding Wikipedia URL: Feeding Eating (also known as consuming ) is the ingestion of food . In biology, this is typically done to provide a heterotrophic organism with energy and nutrients and to allow for growth. Animals and other heterotrophs must eat in order to survive \u2013 carnivores eat other animals, herbivores eat plants, omnivores consume a mixture of both plant and animal matter, and detritivores eat detritus . Fungi digest organic matter outside their bodies as opposed to animals that digest their food inside their bodies. Amandines de Provence, poster by Leonetto Cappiello , 1900, which shows a woman eating almond cookies"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Spodoptera frugiperda", "label": "Spodoptera frugiperda", "shape": "dot", "size": 12, "title": "search term: Spodoptera frugiperda Wikipedia URL: Spodoptera frugiperda The fall armyworm ( Spodoptera frugiperda ) is a species in the order Lepidoptera and one of the species of the fall armyworm moths distinguished by their larval life stage. The term \"armyworm\" can refer to several species, often describing the large-scale invasive behavior of the species\u0027 larval stage. It is regarded as a pest and can damage and destroy a wide variety of crops , which causes large economic damage. Its scientific name derives from frugiperda, which is Latin for lost fruit , named because of the species\u0027 ability to destroy crops. Because of its propensity for destruction, the fall armyworm\u0027s habits and possibilities for crop protection have been studied in depth. It is also a notable case for studying sympatric speciation , as it appears to be diverging into two species currently. Another remarkable trait of the larva is that they consistently practice cannibalism , despite its fitness costs."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Acinetobacter", "label": "Acinetobacter", "shape": "dot", "size": 12, "title": "search term: Acinetobacter Wikipedia URL: Acinetobacter Acinetobacter albensis Acinetobacter apis Acinetobacter baumannii Acinetobacter baylyi Acinetobacter beijerinckii Acinetobacter bereziniae Acinetobacter bohemicus Acinetobacter boissieri Acinetobacter bouvetii Acinetobacter brisouii Acinetobacter calcoaceticus Acinetobacter celticus Acinetobacter chengduensis Acinetobacter colistiniresistens Acinetobacter courvalinii Acinetobacter cumulans Acinetobacter defluvii Acinetobacter dispersus Acinetobacter dijkshoorniae Acinetobacter equi Acinetobacter gandensis Acinetobacter gerneri Acinetobacter guangdongensis Acinetobacter guerrae Acinetobacter guillouiae Acinetobacter gyllenbergii Acinetobacter haemolyticus Acinetobacter harbinensis Acinetobacter indicus Acinetobacter junii Acinetobacter kookii Acinetobacter lactucae Acinetobacter lanii Acinetobacter larvae Acinetobacter lwoffii Acinetobacter modestus Acinetobacter nectaris Acinetobacter nosocomialis Acinetobacter oryzae Acinetobacte"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Pseudomonas", "label": "Pseudomonas", "shape": "dot", "size": 12, "title": "search term: Pseudomonas Wikipedia URL: Pseudomonas Pseudomonas is a genus of Gram-negative bacteria belonging to the family Pseudomonadaceae in the class Gammaproteobacteria . The 348 members of the genus demonstrate a great deal of metabolic diversity and consequently are able to colonize a wide range of niches and hosts. Their ease of culture in vitro and availability of an increasing number of Pseudomonas strain genome sequences has made the genus an excellent focus for scientific research; the best studied species include P. aeruginosa in its role as an opportunistic human pathogen , the plant pathogen P. syringae , the soil bacterium P. putida , and the plant growth-promoting P. fluorescens , P. lini , P. migulae , and P. graminis ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "lignin", "label": "lignin", "shape": "dot", "size": 12, "title": "search term: lignin Wikipedia URL: Lignin Lignin is a class of complex organic polymers that form key structural materials in the support tissues of most plants. Lignins are particularly important in the formation of cell walls , especially in wood and bark , because they lend rigidity and do not rot easily. Chemically, lignins are polymers made by the cross-linking of phenolic precursors. Idealized structure of lignin from a softwood"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "microbial communities", "label": "microbial communities", "shape": "dot", "size": 12, "title": "search term: microbial communities Wikipedia URL: Microbial communities Microbial population biology is the application of the principles of population biology to microorganisms ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "bacteriocins", "label": "bacteriocins", "shape": "dot", "size": 12, "title": "search term: bacteriocins Wikipedia URL: Bacteriocins Bacteriocins are proteinaceous or peptidic toxins produced by bacteria to inhibit the growth of similar or closely related bacterial strain(s). They are similar to yeast and paramecium killing factors, and are structurally, functionally, and ecologically diverse. Applications of bacteriocins are being tested to assess their application as narrow-spectrum antibiotics . The bacteriocin Putidacin L1 provides robust disease protection against Pseudomonas syringae when expressed in Nicotiana benthamiana (commonly known as Australian dwarf tobacco)."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Cry1Ac", "label": "Cry1Ac", "shape": "dot", "size": 12, "title": "search term: Cry1Ac Wikipedia URL: Cry1Ac Cry1Ac protoxin is a crystal protein produced by the gram-positive bacterium , Bacillus thuringiensis (Bt) during sporulation . Cry1Ac is one of the delta endotoxins produced by this bacterium which act as insecticides . Because of this, the genes for these have been introduced into commercially important crops by genetic engineering (such as cotton and corn) in order to confer pest resistance on those plants."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "enzymes", "label": "enzymes", "shape": "dot", "size": 14, "title": "search term: enzymes Wikipedia URL: Enzymes An enzyme is a biological macromolecule , usually a protein , that acts as a biological catalyst , accelerating chemical reactions without being consumed in the process. The molecules on which enzymes act are called substrates , which are converted into products . Nearly all metabolic processes within a cell depend on enzyme catalysis to occur at biologically relevant rates. A metabolic pathway is typically composed of a series of enzyme-catalyzed steps. The study of enzymes is known as enzymology , and a related field focuses on pseudoenzymes \u2014proteins that have lost catalytic activity but may retain regulatory or scaffolding functions, often indicated by alterations in their amino acid sequences or unusual \u0027pseudocatalytic\u0027 behavior. The enzyme glucosidase converts the sugar maltose into two glucose sugars. Active site residues in red, maltose substrate in black, and NAD cofactor in yellow. ( PDB : 1OBB \u200b)"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "cellulase", "label": "cellulase", "shape": "dot", "size": 14, "title": "search term: cellulase Wikipedia URL: Cellulase Cellulase ( EC 3.2.1.4 ; systematic name 4-\u03b2- D -glucan 4-glucanohydrolase ) is any of several enzymes produced chiefly by fungi , bacteria , and protozoans that catalyze cellulolysis , the decomposition of cellulose and of some related polysaccharides : Ribbon representation of the Streptomyces lividans \u03b2-1,4-endoglucanase catalytic domain - an example from the family 12 glycoside hydrolases"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "coleoptera", "label": "coleoptera", "shape": "dot", "size": 12, "title": "search term: coleoptera Wikipedia URL: Coleoptera See subgroups of the order Coleoptera"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Bactrocera dorsalis", "label": "Bactrocera dorsalis", "shape": "dot", "size": 12, "title": "search term: Bactrocera dorsalis Wikipedia URL: Bactrocera dorsalis Bactrocera dorsalis , previously known as Dacus dorsalis and commonly referred to as the oriental fruit fly , is a species of tephritid fruit fly that is endemic to Southeast Asia . It is one of the major pest species in the genus Bactrocera with a broad host range of cultivated and wild fruits. Male B. dorsalis respond strongly to methyl eugenol , which is used to monitor and estimate populations, as well as to annihilate males as a form of pest control. They are also important pollinators and visitors of wild orchids, Bulbophyllum cheiri and Bulbophyllum vinaceum in Southeast Asia, which lure the flies using methyl eugenol."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "gut microbes", "label": "gut microbes", "shape": "dot", "size": 14, "title": "search term: gut microbes Wikipedia URL: Gut Microbes Gut Microbes is a peer-reviewed , open access scientific journal covering research on all aspects of the microorganisms inhabiting the intestines , including their broader effects on the physiology of human and model organism hosts . The journal publishes basic , translational , and clinical research. It was established in 2010 and is published by Taylor \u0026 Francis . The journal became fully open access in 2020. Its editor-in-chief is Beth McCormick ( UMass Chan Medical School )."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Bacillus thuringiensis", "label": "Bacillus thuringiensis", "shape": "dot", "size": 14, "title": "search term: Bacillus thuringiensis Wikipedia URL: Bacillus thuringiensis Bacillus thuringiensis (or Bt ) is a gram-positive , soil-dwelling bacterium , and is the most commonly used biological pesticide worldwide. B. thuringiensis also occurs naturally in the gut of caterpillars of various types of moths and butterflies , as well as on leaf surfaces, aquatic environments, animal feces, insect-rich environments, flour mills and grain-storage facilities. It has also been observed to parasitize moths such as Cadra calidella \u2014in laboratory experiments working with C. calidella , many of the moths were diseased due to this parasite."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Bactrocera", "label": "Bactrocera", "shape": "dot", "size": 12, "title": "search term: Bactrocera Wikipedia URL: Bactrocera B. correcta B. dorsalis B. oleae B. tryoni B. zonata B. divenderi Hundreds more"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Curculionidae", "label": "Curculionidae", "shape": "dot", "size": 12, "title": "search term: Curculionidae Wikipedia URL: Curculionidae The Curculionidae are a family of weevils , commonly called snout beetles or true weevils . They are one of the largest animal families with 6,800 genera and 83,000 species described worldwide. They are the sister group to the family Brentidae ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "License", "label": "License", "shape": "dot", "size": 12, "title": "search term: License Wikipedia URL: License A license ( American English ) or licence ( Commonwealth English ) is an official permission or permit to do, use, or own something (as well as the document of that permission or permit). Governments issue driver\u0027s licenses to people who are allowed to drive motor vehicles on public roads ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "immune system", "label": "immune system", "shape": "dot", "size": 12, "title": "search term: immune system Wikipedia URL: Immune system The immune system is a network of biological systems that protects an organism from diseases . It detects and responds to a wide variety of pathogens , such as viruses , bacteria , and parasites , as well as cancer cells and objects, such as wood splinters \u2014distinguishing them from the organism\u0027s own healthy tissue . Many species have two major subsystems of the immune system. The innate immune system provides a preconfigured response to broad groups of situations and stimuli. The adaptive immune system provides a tailored response to each stimulus by learning to recognize molecules it has previously encountered. Both use molecules and cells to perform their functions."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "molecular ecology", "label": "molecular ecology", "shape": "dot", "size": 12, "title": "search term: molecular ecology Wikipedia URL: Molecular ecology Molecular ecology is a subdiscipline of ecology that is concerned with applying molecular genetic techniques to ecological questions (e.g., population structure, phylogeography, conservation, speciation, hybridization, biodiversity). It is virtually synonymous with the field of \" Ecological Genetics \" as pioneered by Theodosius Dobzhansky , E. B. Ford , Godfrey M. Hewitt , and others. Molecular ecology is related to the fields of population genetics and conservation genetics ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "ecological niche", "label": "ecological niche", "shape": "dot", "size": 18, "title": "search term: ecological niche Wikipedia URL: Ecological niche In ecology , a niche is the match of a species to a specific environmental condition. It describes how an organism or population responds to the distribution of resources and competitors (for example, by growing when resources are abundant, and when predators , parasites and pathogens are scarce) and how it, in turn, alters those same factors (for example, limiting access to resources by other organisms, acting as a food source for predators and a consumer of prey). \"The type and number of variables comprising the dimensions of an environmental niche vary from one species to another [and] the relative importance of particular environmental variables for a species may vary according to the geographic and biotic contexts\". The flightless dung beetle occupies an ecological niche: exploiting animal droppings as a food source."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "excretion", "label": "excretion", "shape": "dot", "size": 14, "title": "search term: excretion Wikipedia URL: Excretion Excretion is elimination of metabolic waste , which is an essential process in all organisms . In vertebrates , this is primarily carried out by the lungs , kidneys , and skin . This is in contrast with secretion , where the substance may have specific tasks after leaving the cell . For example, placental mammals expel urine from the bladder through the urethra , which is part of the excretory system . Unicellular organisms discharge waste products directly through the surface of the cell. Another example would be how mammals release solid waste (feces) through the anus during defecation. Mammals excrete urine through the urinary system ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "natural enemies", "label": "natural enemies", "shape": "dot", "size": 12, "title": "search term: natural enemies Wikipedia URL: Natural enemies Biological control or biocontrol is a method of controlling pests , whether pest animals such as insects and mites , weeds , or pathogens affecting animals or plants by using other organisms . It relies on predation , parasitism , herbivory , or other natural mechanisms, but typically also involves an active human management role. It can be an important component of integrated pest management (IPM) programs. Invertebrates and other macroorganisms are registered as biological control agents by the authorities in the US and Europe very differently to microorganisms, which are registered as biopesticides . Syrphus hoverfly larva (below) feed on aphids (above), making them natural biological control agents."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Arabidopsis", "label": "Arabidopsis", "shape": "dot", "size": 12, "title": "search term: Arabidopsis Wikipedia URL: Arabidopsis Arabidopsis ( rockcress ) is a genus of small flowering plants in the cabbage and mustard family, Brassicaceae . Arabidopsis species are native to temperate and subarctic Eurasia and North America, North Africa, and the mountains of eastern tropical Africa. This genus is of great interest since it contains thale cress ( Arabidopsis thaliana ), one of the model organisms used for studying plant biology and the first plant to have its entire genome sequenced. Changes in thale cress are easily observed, making it a very useful model."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Helicoverpa zea", "label": "Helicoverpa zea", "shape": "dot", "size": 14, "title": "search term: Helicoverpa zea Wikipedia URL: Helicoverpa zea Helicoverpa zea , commonly known as the corn earworm , is a species (formerly in the genus Heliothis ) in the family Noctuidae . The larva of the moth Helicoverpa zea is a major agricultural pest . Since it is polyphagous (feeds on many different plants) during the larval stage, the species has been given many different common names , including the cotton bollworm and the tomato fruitworm . It also consumes a wide variety of other crops ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "food", "label": "food", "shape": "dot", "size": 20, "title": "search term: food Wikipedia URL: Food Food is any substance consumed by an organism for nutritional support. Food usually consists of plant, animal, or fungal origin and contains essential nutrients such as carbohydrates , fats , proteins , vitamins , or minerals . The substance is ingested by an organism and assimilated by the organism\u0027s cells to provide energy, maintain life, or support growth. Different species of animals have different feeding behaviours that satisfy the needs of their metabolisms and have evolved to fill specific ecological niches within specific geographical contexts. Display of various foods"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "pathogens", "label": "pathogens", "shape": "dot", "size": 14, "title": "search term: pathogens Wikipedia URL: Pathogens In biology , a pathogen ( Greek : \u03c0\u03ac\u03b8\u03bf\u03c2 , pathos \"suffering\", \"passion\" and -\u03b3\u03b5\u03bd\u03ae\u03c2 , -gen\u0113s \"producer of\"), in the oldest and broadest sense, is any organism , agent or micro-organism that can produce disease . A pathogen may also be referred to as an infectious agent , or simply a germ . A photomicrograph of a stool that has shigella dysentery. These bacteria typically cause foodborne illness."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Nilaparvata lugens", "label": "Nilaparvata lugens", "shape": "dot", "size": 14, "title": "search term: Nilaparvata lugens Wikipedia URL: Nilaparvata lugens The brown planthopper ( BPH ), Nilaparvata lugens (St\u00e5l) (Hemiptera: Delphacidae) is a planthopper species that feeds on rice plants ( Oryza sativa L.). These insects are among the most important pests of rice, which is the major staple crop for about half the world\u0027s population. They damage rice directly through feeding and also by transmitting two viruses, rice ragged stunt virus and rice grassy stunt virus . Up to 60% yield loss is common in susceptible rice cultivars attacked by the insect."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "parasitoid", "label": "parasitoid", "shape": "dot", "size": 12, "title": "search term: parasitoid Wikipedia URL: Parasitoid In evolutionary ecology , a parasitoid is an organism that lives in close association with its host at the host\u0027s expense, eventually resulting in the death of the host. Parasitoidism is one of six major evolutionary strategies within parasitism , distinguished by the fatal prognosis for the host, which makes the strategy close to predation . A parasitoid wasp ( Trioxys complanatus , Aphidiinae ) ovipositing into the body of a spotted alfalfa aphid ( Therioaphis maculata , Calaphidinae ), a behaviour that is used in biological pest control"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "wasps", "label": "wasps", "shape": "dot", "size": 14, "title": "search term: wasps Wikipedia URL: Wasps A wasp is any insect of the narrow-waisted suborder Apocrita of the order Hymenoptera which is neither a bee nor an ant ; this excludes the broad-waisted sawflies (Symphyta), which look somewhat like wasps, but are in a separate suborder. The wasps do not constitute a clade , a complete natural group with a single ancestor, as bees and ants are deeply nested within the wasps, having evolved from wasp ancestors. Wasps that are members of the clade Aculeata can sting their prey."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "spiders", "label": "spiders", "shape": "dot", "size": 14, "title": "search term: spiders Wikipedia URL: Spiders Spiders ( order Araneae ) are air-breathing arthropods that have eight limbs, chelicerae with fangs generally able to inject venom , and spinnerets that extrude silk . They are the largest order of arachnids and rank seventh in total species diversity among all orders of organisms . Spiders are found worldwide on every continent except Antarctica , and have become established in nearly every land habitat . As of January 2026 [update] , 53,680 spider species in 139 families have been recorded by taxonomists . However, there has been debate among scientists about how families should be classified, with over 20 different classifications proposed since 1900."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "signaling", "label": "signaling", "shape": "dot", "size": 12, "title": "search term: signaling Wikipedia URL: Signaling A signal is both the process and the result of transmission of data over some media accomplished by embedding some variation. Signals are important in multiple subject fields, including signal processing , information theory and biology . In The Signal by William Powell Frith , a woman sends a signal by waving a white handkerchief."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Klebsiella", "label": "Klebsiella", "shape": "dot", "size": 12, "title": "search term: Klebsiella Wikipedia URL: Klebsiella Klebsiella is a genus of Gram-negative , oxidase-negative , rod-shaped bacteria with a prominent polysaccharide -based capsule ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "hydrolysis", "label": "hydrolysis", "shape": "dot", "size": 12, "title": "search term: hydrolysis Wikipedia URL: Hydrolysis Hydrolysis ( / h a\u026a \u02c8 d r \u0252 l \u026a s \u026a s / ; from Ancient Greek hydro- \u0027 water \u0027 and lysis \u0027 to unbind \u0027 ) is any chemical reaction in which a molecule of water breaks one or more chemical bonds. The term is used broadly for substitution and elimination reactions in which water is the nucleophile . Generic hydrolysis reaction. (The 2-way yield symbol indicates a chemical equilibrium in which hydrolysis and condensation are reversible.)"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "oxidative stress", "label": "oxidative stress", "shape": "dot", "size": 14, "title": "search term: oxidative stress Wikipedia URL: Oxidative stress Oxidative stress reflects an imbalance between the systemic manifestation of reactive oxygen species and a biological system\u0027s ability to readily detoxify the reactive intermediates or to repair the resulting damage. Disturbances in the normal redox state of cells can cause toxic effects through the production of peroxides and free radicals that damage all components of the cell, including proteins , lipids , and DNA . Oxidative stress from oxidative metabolism causes base damage, as well as strand breaks in DNA . Base damage is mostly indirect and caused by the reactive oxygen species generated, e.g., O \u2212 2 ( superoxide radical), OH ( hydroxyl radical) and H 2 O 2 ( hydrogen peroxide ). Further, some reactive oxidative species act as cellular messengers in redox signaling. Thus, oxidative stress can cause disruptions in normal mechanisms of cellular signaling . [ citation needed ] Oxidative stress mechanisms in tissue injur"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "glucose", "label": "glucose", "shape": "dot", "size": 18, "title": "search term: glucose Wikipedia URL: Glucose Glucose is a sugar with the molecular formula C 6 H 12 O 6 . It is the most abundant monosaccharide , a subcategory of carbohydrates . It is made from water and carbon dioxide during photosynthesis by plants and most algae . It is used by plants to make cellulose , the most abundant carbohydrate in the world, for use in cell walls , and by all living organisms to make adenosine triphosphate (ATP), which is used by the cell as energy. Glucose is often abbreviated as Glc ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Bacillus", "label": "Bacillus", "shape": "dot", "size": 14, "title": "search term: Bacillus Wikipedia URL: Bacillus Bacillus , from Latin \"bacillus\", meaning \"little staff, wand\", is a genus of Gram-positive , rod-shaped bacteria , a member of the phylum Bacillota , with 266 named species . The term is also used to describe the shape (rod) of other so-shaped bacteria; and the plural Bacilli is the name of the class of bacteria to which this genus belongs. Bacillus species can be either obligate aerobes which are dependent on oxygen , or facultative anaerobes which can survive in the absence of oxygen. Cultured Bacillus species test positive for the enzyme catalase if oxygen has been used or is present."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "metabolites", "label": "metabolites", "shape": "dot", "size": 12, "title": "search term: metabolites Wikipedia URL: Metabolites In biochemistry , a metabol
