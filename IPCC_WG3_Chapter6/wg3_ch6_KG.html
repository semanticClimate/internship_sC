l energy necessary to fuel their metabolism . The term photosynthesis usually refers to oxygenic photosynthesis , a process that releases oxygen as a byproduct of w...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "photovoltaics", "label": "photovoltaics", "shape": "dot", "size": 13.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/b8/SoSie%2BSoSchiff_Ansicht.jpg/330px-SoSie%2BSoSchiff_Ansicht.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ephotovoltaics\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: photovoltaics Wikipedia URL: Photovoltaics Photovoltaics ( PV ) is the conversion of light into electricity using semiconducting materials that exhibit the photovoltaic effect , a phenomenon studied in physics , photochemistry , and electrochemistry . The photovoltaic effect is commercially used for electricity generation and as photosensors . The Solar Settlement , a sustainable housing community project in Freiburg , Germany\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "place attachment", "label": "place attachment", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/12/Ladakh_Ancient_Monestary_Door_%28128043647%29.jpg/250px-Ladakh_Ancient_Monestary_Door_%28128043647%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eplace attachment\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: place attachment Wikipedia URL: Place attachment Place attachment is the emotional bond between person and place, and one way of describing the relationship between people and spatial settings. It is highly influenced by an individual and his or her personal experiences. There is a considerable amount of research dedicated to defining what makes a place \"meaningful\" enough for place attachment to occur. Schroeder (1991) notably discussed the difference between \"meaning\" and \"prefere...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "planetary boundaries", "label": "planetary boundaries", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e2/The_Planetary_Boundaries_diagram.pdf/page1-250px-The_Planetary_Boundaries_diagram.pdf.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eplanetary boundaries\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: planetary boundaries Wikipedia URL: Planetary boundaries Planetary boundaries are a framework to describe limits to the impacts of human activities on the Earth system . Beyond these limits, the environment may not be able to continue to self-regulate. This would mean the Earth system would leave the period of stability of the Holocene , in which human society developed. The \"Planetary Boundaries (PBs) diagram visually represents the current status of the nine PB processes that regu...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "planning", "label": "planning", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/Schizophrenia_PET_scan.jpg/224px-Schizophrenia_PET_scan.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eplanning\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: planning Wikipedia URL: Planning Planning is the process of thinking regarding the activities required to achieve a desired goal . Planning is based on foresight, the fundamental capacity for mental time travel . Some researchers regard the evolution of forethought - the capacity to think ahead - as a prime mover in human evolution . Planning is a fundamental property of intelligent behavior. [ citation needed ] It involves the use of logic and imagination to visualize not only a de...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "PLoS One", "label": "PLoS One", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/PLOS_ONE_logo_2012.svg/330px-PLOS_ONE_logo_2012.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ePLoS One\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: PLoS One Wikipedia URL: PLoS One PLOS One (stylized \u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Policy Wikipedia URL: Policy Policy is a deliberate system of guidelines to guide decisions and achieve rational outcomes. A policy is a statement of intent and is implemented as a procedure or protocol. Policies are generally adopted by a governance body within an organization . Policies can assist in both subjective and objective decision making . Policies used in subjective decision-making usually assist senior management with decisions that must be based on the relative merits o...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "political economy", "label": "political economy", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/Rousseau_-_Discours_sur_l%27oeconomie_politique%2C_1758_-_5884558.tif/lossy-page1-250px-Rousseau_-_Discours_sur_l%27oeconomie_politique%2C_1758_-_5884558.tif.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epolitical economy\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: political economy Wikipedia URL: Political economy Prescriptive and policy Jean-Jacques Rousseau , Discours sur l\u0027oeconomie politique , 1758\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "population growth", "label": "population growth", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Nuvola_apps_kaboodle.svg/20px-Nuvola_apps_kaboodle.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epopulation growth\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: population growth Wikipedia URL: Population growth Population growth is the increase in the number of people in a population or dispersed group. The global population has grown from 1 billion in 1800 to 8.2 billion in 2025. Actual global human population growth amounts to around 70 million annually, or 0.85% per year. As of 2024, The United Nations projects that global population will peak in the mid-2080s at around 10.3 billion. The UN\u0027s estimates have decreased strongly in recent ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "poverty", "label": "poverty", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/39/Global-inequality-in-1800-1975-and-2015.png/250px-Global-inequality-in-1800-1975-and-2015.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epoverty\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: poverty Wikipedia URL: Poverty Poverty is a state or condition in which an individual lacks the financial resources and essentials for a basic standard of living . Poverty can have diverse environmental , legal , social , economic , and political causes and effects. When evaluating poverty in statistics or economics there are two main measures: absolute poverty which compares income against the amount needed to meet basic personal needs , such as food , clothing , and shelter ; seco...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "power sector", "label": "power sector", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/84/NIGU_Strain_tower.JPG/250px-NIGU_Strain_tower.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epower sector\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: power sector Wikipedia URL: Power sector The electric power industry covers the generation , transmission , distribution and sale of electric power to the general public and industry. The commercial distribution of electric power started in 1882 when electricity was produced for electric lighting . In the 1880s and 1890s, growing economic and safety concerns lead to the regulation of the industry. What was once an expensive novelty limited to the most densely populated areas, reliab...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "precipitation", "label": "precipitation", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e9/ERA5_global_precipitation_sum.png/500px-ERA5_global_precipitation_sum.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eprecipitation\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: precipitation Wikipedia URL: Precipitation In meteorology , precipitation is any product of the condensation of atmospheric water vapor that falls from clouds due to gravitational pull. The main forms of precipitation include drizzle , rain , rain and snow mixed (\"sleet\" in Commonwealth usage), snow , ice pellets , graupel and hail . Precipitation occurs when a portion of the atmosphere becomes saturated with water vapor (reaching 100% relative humidity ), so that the water condense...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "price", "label": "price", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/b4/The_competitive_price_system_adapted_from_Samuelson%2C_1961.jpg/250px-The_competitive_price_system_adapted_from_Samuelson%2C_1961.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eprice\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: price Wikipedia URL: Price Prescriptive and policy The competitive price system according to Paul Samuelson\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "price dispersion", "label": "price dispersion", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eprice dispersion\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: price dispersion Wikipedia URL: Price dispersion In economics , price dispersion is variation in prices across sellers of the same item, holding fixed the item\u0027s characteristics. Price dispersion can be viewed as a measure of trading frictions (or, tautologically, as a violation of the law of one price ). It is often attributed to consumer search costs or unmeasured attributes (such as the reputation) of the retailing outlets involved. There is a difference between price dispersion ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Pricing", "label": "Pricing", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/16/Price_tag_of_a_Marks_%26_Spencer_product_01.jpg/250px-Price_tag_of_a_Marks_%26_Spencer_product_01.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ePricing\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Pricing Wikipedia URL: Pricing Pricing is the process whereby a business sets and displays the price at which it will sell its products and services and may be part of the business\u0027s marketing plan . In setting prices, the business will take into account the price at which it could acquire the goods, the manufacturing cost , the marketplace , competition, market condition, brand , and quality of the product. A price tag is a highly visual and objective guide to value.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "primary energy", "label": "primary energy", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/78/Global_primary_energy_consumption_by_source_1900_-_2021.png/250px-Global_primary_energy_consumption_by_source_1900_-_2021.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eprimary energy\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: primary energy Wikipedia URL: Primary energy Primary energy ( PE ) is the energy found in nature that has not been subjected to any human engineered conversion process. It encompasses energy contained in raw fuels and other forms of energy, including waste, received as input to a system . Primary energy can be non-renewable or renewable . Global primary energy consumption by source\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "process heat", "label": "process heat", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/9/9c/HiResBetterCrop.png/250px-HiResBetterCrop.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eprocess heat\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: process heat Wikipedia URL: Process heat Process heat refers to the application of heat during industrial processes . Some form of process heat is used during the manufacture of many common products, from concrete to glass to steel to paper . Where byproducts or wastes of the overall industrial process are available, those are often used to provide process heat. Examples include black liquor in papermaking or bagasse in sugarcane processing. Process heating: Precious-metal tubing is...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "production costs", "label": "production costs", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eproduction costs\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: production costs Wikipedia URL: Production costs Cost of goods sold ( COGS ) (also cost of products sold ( COPS ), or cost of sales ) is the carrying value of goods sold during a particular period.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "profitability", "label": "profitability", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a6/Economist_Versus_Accountants.pdf/page1-250px-Economist_Versus_Accountants.pdf.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eprofitability\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: profitability Wikipedia URL: Profitability Prescriptive and policy Difference between how accountants and economists view a firm\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Public Participation", "label": "Public Participation", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ePublic Participation\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Public Participation Wikipedia URL: Public participation Public participation , also known as citizen participation or patient and public involvement , is the inclusion of the public in the activities of any organization or project. Public participation is similar to but more inclusive than stakeholder engagement . Video segment in 2011: \"Without people participation development actions fail\". - S.Kumar\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "public perception", "label": "public perception", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/17/17th_century_coffeehouse_england_1-580x400.jpg/250px-17th_century_coffeehouse_england_1-580x400.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epublic perception\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: public perception Wikipedia URL: Public perception Public opinion , or popular opinion , is the collective opinion on a specific topic or voting intention relevant to society. It is the people\u0027s views on matters affecting them. Coffeehouse in 17th century London\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Public Procurement", "label": "Public Procurement", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/13/BSG_LOGO_for_word.jpg/250px-BSG_LOGO_for_word.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ePublic Procurement\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Public Procurement Wikipedia URL: Public Procurement Government procurement or public procurement is the purchase of goods, works ( construction ), or services by the state, such as by a government agency or a state-owned enterprise . In 2019, public procurement accounted for approximately 12% of GDP in OECD countries. In 2021, the World Bank Group estimated that public procurement made up about 15% of global GDP. Therefore, government procurement accounts for a substantial part of ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Public support", "label": "Public support", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/2e/Hand_holding_a_red_fundraising_box.jpg/250px-Hand_holding_a_red_fundraising_box.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ePublic support\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Public support Wikipedia URL: Public support Fundraising or fund-raising is the process of seeking and gathering voluntary financial contributions by engaging individuals , businesses , charitable foundations , or governmental agencies . Although fundraising typically refers to efforts to gather money for non-profit organizations , it is sometimes used to refer to the identification and solicitation of investors or other sources of capital for for-profit enterprises. Door to door fu...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "public transportation", "label": "public transportation", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/81/Plan_de_la_ville_de_Paris_repr%C3%A9sentant_les_nouvelles_voitures_publiques_-_Entreprise_g%C3%A9n%C3%A9rale_des_Omnibus.jpg/250px-Plan_de_la_ville_de_Paris_repr%C3%A9sentant_les_nouvelles_voitures_publiques_-_Entreprise_g%C3%A9n%C3%A9rale_des_Omnibus.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epublic transportation\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: public transportation Wikipedia URL: Public transportation Public transport (also known as public transportation , public transit , mass transit , or simply transit ) refers to forms of transport made available for use by the general public . Public transport systems typically operate on fixed routes and schedules and charge a standardized fare intended to cover operating costs, often supplemented by public funding where required. An omnibus design from 1828, Paris\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "PV cells", "label": "PV cells", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/9/90/Solar_cell.png/250px-Solar_cell.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ePV cells\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: PV cells Wikipedia URL: PV cells A solar cell, also known as a photovoltaic cell ( PV cell ), is an electronic device that converts the energy of light directly into electricity by using the photovoltaic effect . It is a type of photoelectric cell, a device whose electrical characteristics (such as current , voltage , or resistance ) vary when it is exposed to light. Individual solar cell devices are often the electrical building blocks of photovoltaic modules , known colloquially a...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "pyrolysis", "label": "pyrolysis", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/5/5d/Fire_1873.JPG/250px-Fire_1873.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epyrolysis\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: pyrolysis Wikipedia URL: Pyrolysis Pyrolysis ( / p a\u026a \u02c8 r \u0252 l \u026a s \u026a s / ; from Ancient Greek \u03c0 ectrification_Graph.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003erural electrification\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: rural electrification Wikipedia URL: Rural electrification Rural electrification is the process of bringing electrical power to rural and remote areas. Rural communities are suffering from colossal market failures as the national grids fall short of their demand for electricity. As of 2019, 770 million people live without access to electricity \u2013 10.2% of the global population. Electrification typically begins in cities and towns and gradually extends to rural areas, however, this pr...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "scalability", "label": "scalability", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/6f/Horizontal_vs_vertical_scaling.svg/250px-Horizontal_vs_vertical_scaling.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003escalability\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: scalability Wikipedia URL: Scalability Collective intelligence Collective action Self-organized criticality Herd mentality Phase transition Agent-based modelling Synchronization Ant colony optimization Particle swarm optimization Swarm behaviour Horizontal scaling adds new nodes to a computing cluster, while vertical scaling adds resources to existing nodes.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "SDG 1", "label": "SDG 1", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/5/50/Sustainable_Development_Goal_01NoPoverty.svg/330px-Sustainable_Development_Goal_01NoPoverty.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eSDG 1\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: SDG 1 Wikipedia URL: SDG 1 The Sustainable Development Goal 1 ( abbr. SDG 1 or Global Goal 1 ), one of the 17 Sustainable Development Goals established by the United Nations in 2015, calls for the end of poverty in all forms. The official wording is: \"No Poverty\". Member countries have pledged to \"Leave No One Behind\": underlying the goal is a \"powerful commitment to leave no one behind and to reach those farthest behind first\".\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "SDG 12", "label": "SDG 12", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/65/Sustainable_Development_Goal_12ResponsibleConsumption.svg/250px-Sustainable_Development_Goal_12ResponsibleConsumption.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eSDG 12\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: SDG 12 Wikipedia URL: SDG 12 Sustainable Development Goal 12 ( SDG 12 or Global Goal 12 ), titled \"responsible consumption and production\", is one of the 17 Sustainable Development Goals established by the United Nations in 2015. The official wording of SDG 12 is \"Ensure sustainable consumption and production patterns\". SDG 12 is meant to ensure good use of resources , improve energy efficiency and sustainable infrastructure , provide access to basic services, create green and decen...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "SDG 6", "label": "SDG 6", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/de/Sustainable_Development_Goal_06CleanWaterSanitation.svg/250px-Sustainable_Development_Goal_06CleanWaterSanitation.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eSDG 6\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: SDG 6 Wikipedia URL: SDG 6 Sustainable Development Goal 6 ( SDG 6 or Global Goal 6 ) declares the importance of achieving \"clean water and sanitation for all\". It is one of the 17 Sustainable Development Goals established by the United Nations General Assembly to succeed the former Millennium Development Goals (MDGs). According to the United Nations, the overall goal is to: \"Ensure availability and sustainable management of water and sanitation for all.\" The goal has eight targets t...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "SDG 7", "label": "SDG 7", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/aa/Sustainable_Development_Goal_07CleanEnergy.svg/330px-Sustainable_Development_Goal_07CleanEnergy.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eSDG 7\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: SDG 7 Wikipedia URL: SDG 7 Sustainable Development Goal 7 ( SDG 7 or Global Goal 7 ) is one of 17 Sustainable Development Goals established by the United Nations General Assembly in 2015. It aims to \"Ensure access to affordable, reliable, sustainable and modern energy for all.\" Access to energy is an important pillar for the wellbeing of the people as well as for economic development and poverty alleviation.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "SDGs", "label": "SDGs", "shape": "dot", "size": 13.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/en/thumb/3/31/Sustainable_Development_Goals_logo.svg/250px-Sustainable_Development_Goals_logo.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eSDGs\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: SDGs Wikipedia URL: SDGs The 2030 Agenda for Sustainable Development , adopted by all United Nations (UN) members in 2015, created 17 world Sustainable Development Goals ( abbr. SDGs ). The aim of these global goals is \"peace and prosperity for people and the planet\" \u ykamias_Lesvos_Greece_2.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003esecurity\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: security Wikipedia URL: Security Security is protection from, or resilience against, potential harm (or other unwanted coercion ). Beneficiaries (technically referents ) of security may be persons and social groups, objects and institutions, ecosystems, or any other entity or phenomenon vulnerable to unwanted change. Refugees fleeing war and insecurity in Iraq and Syria arrive at Lesbos Island , supported by Spanish volunteers, 2015\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Shared Socioeconomic Pathways", "label": "Shared Socioeconomic Pathways", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/33/Atmospheric_CO%E2%82%82_concentrations_by_SSP_across_the_21st_century.svg/500px-Atmospheric_CO%E2%82%82_concentrations_by_SSP_across_the_21st_century.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eShared Socioeconomic Pathways\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Shared Socioeconomic Pathways Wikipedia URL: Shared Socioeconomic Pathways Shared Socioeconomic Pathways ( SSPs ) are climate change scenarios of projected socioeconomic global changes up to 2100 as defined in the IPCC Sixth Assessment Report on climate change in 2021. They are used to derive greenhouse gas emissions sce {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Small Modular Reactors", "label": "Small Modular Reactors", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/6f/Figure_4_Illustration_of_a_light_water_small_modular_nuclear_reactor_%28SMR%29_%2820848048201%29.jpg/250px-Figure_4_Illustration_of_a_light_water_small_modular_nuclear_reactor_%28SMR%29_%2820848048201%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eSmall Modular Reactors\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Small Modular Reactors Wikipedia URL: Small Modular Reactors A small modular reactor ( SMR ) is a type of nuclear fission reactor with a rated electrical power of 300 MW e or less. SMRs are designed to be factory-fabricated and transported to the installation site as prefabricated modules, allowing for streamlined construction, enhanced scalability, and potential integration into multi-unit configurations. The term SMR refers to the size, capacity and modular construction approach. ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Smart Grid", "label": "Smart Grid", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/84/Staying_big_or_getting_smaller.jpg/500px-Staying_big_or_getting_smaller.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-siz px;color:#66b2ff;font-size:16px\u0027\u003esolar energy\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: solar energy Wikipedia URL: Solar energy Solar energy is the radiant energy from the Sun \u0027s light and heat , which can be harnessed using a range of technologies such as solar electricity , solar thermal energy (including solar water heating ) and solar architecture . It is an essential source of renewable energy , and its technologies are broadly characterized as either passive solar or active solar depending on how they capture and distribute solar energy or convert it into solar ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "solar fuels", "label": "solar fuels", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/bc/Photo_Electric_Cell_Evolving_Hydrogen_and_Oxygen.jpg/250px-Photo_Electric_Cell_Evolving_Hydrogen_and_Oxygen.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003esolar fuels\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: solar fuels Wikipedia URL: Solar fuels A solar fuel is a synthetic fuel produced using solar energy , through photochemical (i.e. photon activation of certain chemical reactions ), photobiological (i.e., artificial photosynthesis ), electrochemical (i.e. using solar electricity to drive an endogenic reaction such as hydroelectrolysis ), or thermochemical methods (i.e., through the use of solar heat supplied by concentrated solar thermal energy to drive a chemical reaction). Sunlight...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "solar insolation", "label": "solar insolation", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/85/RSDS_wiki.png/250px-RSDS_wiki.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003esolar insolation\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: solar insolation Wikipedia URL: Solar insolation Solar irradiance is the power per unit area ( surface power density ) received from the Sun in the form of electromagnetic radiation in the wavelength range of the measuring instrument. Solar irradiance is measured in watts per square metre (W/m 2 ) in SI units . Global distribution of incoming shortwave solar radiation averaged over the years 1981\u20132010 from the CHELSA-BIOCLIM+ data set\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "solar panels", "label": "solar panels", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/31/Dji_fly_20230602_13826_PM_27_1719032149374_photo_optimized.jpg/330px-Dji_fly_20230602_13826_PM_27_1719032149374_photo_optimized.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003esolar panels\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: solar panels Wikipedia URL: Solar panels A solar panel is a device that converts sunlight into electricity by using multiple solar modules that consist of photovoltaic (PV) cells. PV cells are made of materials that produce excited electrons when exposed to light. These electrons flow through a circuit and produce direct current electricity, which can be used to power various devices or be stored in batteries . Solar panels can be known as solar cell panels , or solar electric panel...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "solar PV", "label": "solar PV", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/20/PV-system-schematics-residential-Eng.png/500px-PV-system-schematics-residential-Eng.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003esolar PV\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: solar PV Wikipedia URL: Solar PV Solar power , also known as solar electricity , is the conversion of energy from sunlight into electricity , either directly using photovoltaics (PV) or indirectly using concentrated solar power . Solar panels use the photovoltaic effect to convert light into an electric current . Concentrated solar power systems use lenses or mirrors and solar tracking systems to focus a large area of sunlight to a hot spot, often to drive a steam turbine . Schemati...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "solar water heaters", "label": "solar water heaters", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/f8/Water_collectors.jpg/250px-Water_collectors.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003esolar water heaters\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: solar water heaters Wikipedia URL: Solar water heaters Solar water heating ( SWH ) is heating water by sunlight , using a solar thermal collector . A variety of configurations are available at varying cost to provide solutions in different climates and latitudes. SWHs are widely used for residential and some industrial applications. Solar water collectors installed in Spain\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "solid fuels", "label": "solid fuels", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Coal_and_Fire.JPG/250px-Coal_and_Fire.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003esolid fuels\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: solid fuels Wikipedia URL: Solid fuels Solid fuel refers to various forms of solid material that can be burnt to release energy, providing heat and light through the process of combustion . Solid fuels can be contrasted with liquid fuels and gaseous fuels . Common examples of solid fuels include wood , charcoal , peat , coal , hexamine fuel tablets , dry dung , wood pellets , corn , whea environment, economy, society, and culture. It is rooted in the co...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "Sustainable Development", "label": "Sustainable Development", "shape": "dot", "size": 13.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Visualization_of_pillars_of_sustainability.webp/250px-Visualization_of_pillars_of_sustainability.webp.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eSustainable Development\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Sustainable Development Wikipedia URL: Sustainable Development Sustainable development is an approach to growth and human development that aims to meet the needs of the present without compromising the ability of future generations to meet their own needs. The aim is to have a society where living conditions and resources meet human needs without undermining planetary integrity . Sustainable development aims to balance the needs of the economy , environment , and society. Sustainabl...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Sweden", "label": "Sweden", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/ac/Vendel_I_helmet_456057.jpg/250px-Vendel_I_helmet_456057.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u e term synergy comes from the Attic Greek word \u03c3\u03c5\u03bd\u03b5\u03c1\u03b3\u03af\u03b1 synergia from synergos , \u03c3\u03c5\u03bd\u03b5\u03c1\u03b3\u03cc\u03c2 , meaning \"working together\". Synergy is similar in concept to emergence .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "syngas", "label": "syngas", "shape": "dot", "size": 16.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003esyngas\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: syngas Wikipedia URL: Syngas Syngas , or synthesis gas , is a mixture of hydrogen and carbon monoxide in various ratios. The gas often contains some carbon dioxide and methane . It is principally used for producing ammonia or methanol . Syngas is combustible and can be used as a fuel. Historically, it has been used as a replacement for gasoline when gasoline supply has been limited; for example, wood gas was used to power cars in Europe during WWII (in Germany alone, half a million ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "synthetic fuels", "label": "synthetic fuels", "shape": "dot", "size": 13.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/5/57/NREL_FT_diesel_vs_conventional_diesel_photo.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003esynthetic fuels\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: synthetic fuels Wikipedia URL: Synthetic fuels Synthetic fuel or synfuel is a liquid fuel , or sometimes gaseous fuel , obtained from syngas , a mixture of carbon monoxide and hydrogen , in which the syngas was derived from gasification of solid feedstocks such as coal or biomass or by reforming of natural gas . Side-by-side comparison of FT synthetic fuel and conventional fuel. The synthetic fuel is extremely clear because of the near-total absence of sulfur and aromatics.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "systems", "label": "systems", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/13/Diagram_Systems.svg/330px-Diagram_Systems.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003esystems\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: systems Wikipedia URL: Systems A system is a group of interacting or interrelated elements that act according to a set of rules to form a unified whole. A system, surrounded and influenced by its environment , is described by its boundaries, structure and purpose and is expressed in its functioning. Systems are the subjects of study of systems theory and other systems sciences . Systems can be isolated, closed, or open.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "technological change", "label": "technological change", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/common        \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: technological maturity Wikipedia URL: Technological maturity A mature technology is a technology that has been in use for long enough that most of its initial faults and inherent problems have been removed or reduced by further development. In some contexts, it may also refer to technology that has not seen widespread use, but whose scientific background is well understood. Its performance characteristics are also expected to be well understood with well-established design specifica...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "technologies", "label": "technologies", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/79/Dampfturbine_Montage01.jpg/500px-Dampfturbine_Montage01.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003etechnologies\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: technologies Wikipedia URL: Technologies Technology is the application of conceptual knowledge to achieve practical goals, especially in a reproducible way. The word technology can also mean the products resulting from such efforts, including both tangible tools such as utensils or machines , and intangible ones such as software . Technology plays a critical role in science , engineering , and everyday life . A steam turbine with the case opened, an example of energy technology\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "temperature", "label": "temperature", "shape": "dot", "size": 14.2, "ti  \\eta _{\\rm {th}}} ) is a dimensionless performance measure of a device that uses thermal energy , such as an internal combustion engine , steam turbine , steam engine , boiler , furnace , refrigerator , ACs etc. Output (mechanical) energy is always lower than input energy\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "thermal energy storage", "label": "thermal energy storage", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/0/09/Fernw%C3%A4rmespeicher_Theiss.jpg/250px-Fernw%C3%A4rmespeicher_Theiss.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ethermal energy storage\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: thermal energy storage Wikipedia URL: Thermal energy storage Thermal energy storage ( TES ) is the storage of thermal energy for later reuse. Employing widely different technologies, it allows thermal energy to be stored for hours, days, or months. Scale both of storage and use vary from small to large \u2013 from individual processes to district, town, or region. Usage examples are the balancing of energy demand between daytime and nighttime, storing summer heat for winter heating, or w...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "thermal power plants", "label": "thermal power plants", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/4a/Coal_fired_power_plant_diagr ntrolled synthesis of materials as thin films (a process referred to as deposition) is a fundamental step in many applications. A familiar example is the household mirror , which typically has a thin metal coating on the back of a sheet of glass to form a reflective interface. The process of silvering was once commonly...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "toxicity", "label": "toxicity", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/0/06/Skull_and_Crossbones.svg/250px-Skull_and_Crossbones.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003etoxicity\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: toxicity Wikipedia URL: Toxicity Toxicity is the degree to which a chemical substance or a particular mixture of substances can damage an organism . Toxicity can refer to the effect on a whole organism, such as an animal , bacterium , or plant , as well as the effect on a substructure of the organism, such as a cell ( cytotoxicity ) or an organ such as the liver ( hepatotoxicity ). Sometimes the word is more or less synonymous with poisoning in everyday usage.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "trade", "label": "trade", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/24/Kaufmann-1568.png/250px-Kaufmann-1568.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003etrade\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: trade Wikipedia URL: Trade Trade involves the transfer of goods and services from one person or entity to another, often in exchange for money . Economists refer to a system or network that allows trade as a market . Two traders in 16th-century Germany\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "transmission", "label": "transmission", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003etransmission\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: transmission Wikipedia URL: Transmission Transmission or transmit may refer to:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "transport", "label": "transport", "shape": "dot", "size": 14.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/81/Manchester_Transport_Montage.jpg/250px-Manchester_Transport_Montage.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003etransport\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: transport Wikipedia URL: Transport Transport (in British English ) or transportation (in American English ) is the intentional movement of humans, ty", "label": "uncertainty", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/8b/Blank_Fork.png/250px-Blank_Fork.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003euncertainty\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: uncertainty Wikipedia URL: Uncertainty Uncertainty or incertitude refers to situations involving imperfect or unknown information . It applies to predictions of future events, to physical measurements that are already made, or to the unknown, and is particularly relevant for decision-making . Uncertainty arises in partially observable or stochastic or complex or dynamic environments, as well as due to ignorance , indolence , or both. It arises in any number of fields, including insu...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#66b2ff", "font": {"color": "#FFFFFF"}, "id": "United Nations", "label": "United Nations", "shape": "dot", "size": 16.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/16/Emperor_Haile_Selassie_League_of_Nations_speech.png/250px-Emperor_Haile_Selassie_League_of_Nations_speech.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eUnited Nations\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: United Nations Wikipedia URL: United Nations The United Nations ( UN ) is a glob   <div class="legend-item"><span class="legend-dot legend-green"></span>Highly Connected Nodes</div>

  <div class="legend-item"><span class="legend-dot legend-orange"></span>Subfields / Categories</div>
  <div class="legend-item"><span class="legend-dot legend-red"></span>Related Concepts</div>
</div>

<script>
document.getElementById('searchButton').onclick = function() {
  var query = document.getElementById('searchInput').value.trim().toLowerCase();
  if (!query) return;
  var nodes = network.body.data.nodes.get();
  var found = nodes.find(n => n.label.toLowerCase() === query);
  if (found) {
    network.focus(found.id, {scale: 1.5, animation: true});
    network.selectNodes([found.id]);
  }
  document.getElementById('searchInput').value = '';
};
document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('searchButton').click();
});
</script>
