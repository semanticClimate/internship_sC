              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "global warming", "label": "global warming", "shape": "dot", "size": 18, "title": "\u003cb\u003eglobal warming\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: global warming Wikipedia URL: Global warming Present-day climate change includes both global warming \u2014the ongoing increase in global average temperature \u2014and its wider effects on Earth\u0027s climate system . Climate change in a broader sense also includes previous long-term changes to Earth\u0027s climate . The modern-day rise in global temperatures is driven by human activities , especially fossil fuel ( coal , oil and natural gas ) burning since the Industrial Revolution . Fossil fuel use, deforestation , and some agricultural and industrial practices release greenhouse gases . These gases absorb some of the heat that the Earth radiates after it warms from sunlight, warming the lower atmosphere. Earth\u0027s atmosphere now has roughly 50% more carbon dioxide , the main gas driving global warming, than it did at the end of the pre-industrial era , reaching levels not seen for millions of years. Global surface temperature reconstruction over the past 2000 years using proxy data from tre"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "global warming level", "label": "global warming level", "shape": "dot", "size": 12, "title": "\u003cb\u003eglobal warming level\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: global warming level Wikipedia URL: Global warming level A climate change scenario is a hypothetical future based on a \"set of key driving forces\". Scenarios explore the long-term effectiveness of mitigation and adaptation . Scenarios help to understand what the future may hold. They can show which decisions will have the most meaningful effects on mitigation and adaptation . Four climate change scenarios, based on 2015 data. Left: emissions pathways following the scenarios of (1) no policy, (2) current policy, (3) meeting the governments\u2019 announcements with constant country decarbonization rates past 2030, and (4) meeting the governments\u2019 announcements with higher rates of decarbonization past 2030. Right: global temperatures, depending on the amount of greenhouse gases emitted in each of the four scenarios."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "global surface temperature", "label": "global surface temperature", "shape": "dot", "size": 14, "title": "\u003cb\u003eglobal surface temperature\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: global surface temperature Wikipedia URL: Global surface temperature Global surface temperature ( GST ) is the average temperature of Earth \u0027s surface at a given time. It is a combination of sea surface temperature and the near-surface air temperature over land, weighted by their respective areas. Temperature data comes mainly from weather stations and satellites . To estimate data in the distant past, proxy data can be used for example from tree rings , corals , and ice cores . Observing the rising GST over time is one of the many lines of evidence supporting the scientific consensus on climate change , which is that human activities are causing climate change . Alternative terms for the same concept are global mean surface temperature ( GMST ) or global average surface temperature . The blue line represents global surface temperature reconstructed over the last 2,000 years using proxy data from tree rings , corals , and ice cores . The red line shows direct surface tempe"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "temperature extremes", "label": "temperature extremes", "shape": "dot", "size": 12, "title": "\u003cb\u003etemperature extremes\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: temperature extremes Wikipedia URL: Temperature extremes The list of weather records includes the most extreme occurrences of weather phenomena for various categories. Many weather records are measured under specific conditions\u2014such as surface temperature and wind speed\u2014to keep consistency among measurements around the Earth. Each of these records is understood to be the record value officially observed, as these records may have been exceeded before modern weather instrumentation was invented, or in remote areas without an official weather station . This list does not include remotely sensed observations such as satellite measurements, since those values are not considered official records. In recent decades, new high temperature records have substantially outpaced new low temperature records on a growing portion of Earth\u0027s surface. Comparison shows seasonal variability for record increases."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "heatwaves", "label": "heatwaves", "shape": "dot", "size": 12, "title": "\u003cb\u003eheatwaves\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: heatwaves Wikipedia URL: Heatwaves A heat wave or heatwave , sometimes described as extreme heat , is a period of abnormally hot weather and natural disaster that lasts for multiple days. A heat wave is usually measured relative to the usual climate in the area and to normal temperatures for the season. The main difficulties with this broad definition emerge when one must quantify what the \u0027normal\u0027 temperature state is, and what the spatial extent of the event may or must be. Temperatures that humans from a hotter climate consider normal can be regarded as a heat wave in a cooler area. This would be the case if the warm temperatures are outside the normal climate pattern for that area. Heat waves have become more frequent, and more intense over land, across almost every area on Earth since the 1950s, the increase in frequency and duration being caused by climate change . According to the World Meteorological Organization, heat waves continued to intensify in 2024, with rec"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "extreme precipitation", "label": "extreme precipitation", "shape": "dot", "size": 14, "title": "\u003cb\u003eextreme precipitation\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: extreme precipitation Wikipedia URL: Extreme precipitation Extreme weather includes unexpected, unusual, severe , or unseasonal weather ; weather at the extremes of the historical distribution\u2014the range that has been seen in the past. Extreme events are based on a location\u0027s recorded weather history. The main types of extreme weather include heat waves , cold waves , droughts , and heavy precipitation or storm events, such as tropical cyclones . Extreme weather can have various effects, from natural hazards such as floods and landslides to social costs on human health and the economy. Severe weather is a particular type of extreme weather which poses risks to life and property. A tornado is an example of an extreme weather event."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "floods", "label": "floods", "shape": "dot", "size": 16, "title": "\u003cb\u003efloods\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: floods Wikipedia URL: Floods A flood is an overflow of water ( or rarely other fluids ) that submerges land that is usually dry. In the sense of \"flowing water\", the word may also be applied to the inflow of the tide . Floods are of significant concern in agriculture , civil engineering and public health . Human changes to the environment often increase the intensity and frequency of flooding. Examples for human changes are land use changes such as deforestation and removal of wetlands , changes in waterway course or flood controls such as with levees . Global environmental issues also influence causes of floods, namely climate change which causes an intensification of the water cycle and sea level rise . For example, climate change makes extreme weather events more frequent and stronger. This leads to more intense floods and increased flood risk. Urban flooding in a street in Morpeth , England, 2008"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "flash floods", "label": "flash floods", "shape": "dot", "size": 12, "title": "\u003cb\u003eflash floods\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: flash floods Wikipedia URL: Flash floods A flash flood is a rapid flooding of low-lying areas: washes , rivers , dry lakes and depressions . It may be caused by heavy rain associated with a severe thunderstorm , hurricane , or tropical storm , or by meltwater from ice and snow . Flash floods may also occur after the collapse of a natural ice or debris dam , or a human structure such as a man-made dam , as occurred before the Johnstown Flood of 1889. Flash floods are distinguished from regular floods by having a timescale of fewer than six hours between rainfall and the onset of flooding. An underpass in Charlottesville, Virginia , United States during normal conditions (upper) and after fifteen minutes of heavy rain (lower) in 2017"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "drought", "label": "drought", "shape": "dot", "size": 18, "title": "\u003cb\u003edrought\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: drought Wikipedia URL: Drought A drought is a period of drier-than-normal conditions. A drought can last for days, months or years. Drought often has large impacts on the ecosystems and agriculture of affected regions, and causes harm to the local economy . Annual dry seasons in the tropics significantly increase the chances of a drought developing, with subsequent increased wildfire risks. Heat waves can significantly worsen drought conditions by increasing evapotranspiration . This dries out forests and other vegetation, and increases the amount of fuel for wildfires. Fields outside Benambra , Australia suffering from drought in 2006."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Standardized Precipitation Evapotranspiration Index", "label": "Standardized Precipitation Evapotranspiration Index", "shape": "dot", "size": 14, "title": "\u003cb\u003eStandardized Precipitation Evapotranspiration Index\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Standardized Precipitation Evapotranspiration Index Wikipedia URL: Standardized Precipitation Evapotranspiration Index The Standardized Precipitation Evapotranspiration Index ( SPEI ) is a multiscalar drought index based on climatic data. It was developed by Vicente-Serrano et al. (2010) at the Pyrenean Institute of Ecology in Zaragoza, Spain . It can be used for determining the onset, duration and magnitude of drought conditions with respect to normal conditions in a variety of natural and managed systems such as crops, ecosystems, rivers, water resources, etc."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "soil moisture", "label": "soil moisture", "shape": "dot", "size": 12, "title": "\u003cb\u003esoil moisture\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: soil moisture Wikipedia URL: Soil moisture Soil moisture is the water content of the soil . It can be expressed in terms of volume or weight. Soil moisture measurement can be based on in situ probes (e.g., capacitance probes , neutron probes ) or remote sensing methods. A historic surface soil moisture change in the Horn of Africa from August 2020 - December 2022"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "tropical cyclones", "label": "tropical cyclones", "shape": "dot", "size": 14, "title": "\u003cb\u003etropical cyclones\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: tropical cyclones Wikipedia URL: Tropical cyclones A tropical cyclone is a rapidly rotating storm system with a low-pressure area , a closed low-level atmospheric circulation , strong winds, and a spiral arrangement of thunderstorms that produce heavy rain and squalls . Depending on its location and strength, a tropical cyclone is called a hurricane ( / \u02c8 h \u028cr \u026a k \u0259n , - k e\u026a n / ), typhoon ( / t a\u026a \u02c8 f u\u02d0 n / ), tropical storm , cyclonic storm , tropical depression , or simply cyclone . A hurricane is a strong tropical cyclone that occurs in the Atlantic Ocean or northeastern Pacific Ocean . A typhoon is the same thing which occurs in the northwestern Pacific Ocean. In the Indian Ocean and South Pacific, comparable storms are referred to as \"tropical cyclones\". In modern times, on average around 80 to 90 named tropical cyclones form each year around the world, over half of which develop hurricane-force winds of 65 kn (120 km/h; 75 mph) or more. Hurricane Florence viewed f"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "extratropical cyclones", "label": "extratropical cyclones", "shape": "dot", "size": 12, "title": "\u003cb\u003eextratropical cyclones\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: extratropical cyclones Wikipedia URL: Extratropical cyclones Extratropical cyclones , sometimes called mid-latitude cyclones or wave cyclones are low-pressure areas which, along with anticyclones , drive the weather over much of the mid-latitudes of the Earth. Extratropical cyclones are capable of producing a range of weather conditions from wind, cloudiness and mild showers to severe hail , thunderstorms , blizzards , and tornadoes . This type of cyclone is thus defined as a large scale (synoptic) low pressure weather system occurring in the middle latitudes of the Earth. In contrast with tropical cyclones , extratropical cyclones produce rapid changes in temperature and dew point along broad lines called weather fronts , which are present about the center of the cyclone. A powerful extratropical cyclone over the North Atlantic Ocean on 20 March 2022; Greenland at the top left, and Iceland at the top right"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "wind speed", "label": "wind speed", "shape": "dot", "size": 12, "title": "\u003cb\u003ewind speed\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: wind speed Wikipedia URL: Wind speed In meteorology , wind speed , or wind flow speed , is a fundamental atmospheric quantity caused by air moving from high to low pressure , usually due to changes in temperature. Wind speed is now commonly measured with an anemometer . An anemometer is commonly used to measure wind speed."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "storm surge", "label": "storm surge", "shape": "dot", "size": 12, "title": "\u003cb\u003estorm surge\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: storm surge Wikipedia URL: Storm surge A storm surge is a coastal flood or tsunami -like phenomenon of rising water commonly associated with low-pressure weather systems, such as tropical cyclones . Alternatively, it may be known as a storm flood , tidal surge , or storm tide . It is measured as the rise in water level above the normal tidal level, and does not include waves. Storm surge of the North Sea on February 9, 2014, as seen on the South Beach (S\u00fcdstrand) in Wilhelmshaven, Germany."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "extreme events", "label": "extreme events", "shape": "dot", "size": 16, "title": "\u003cb\u003eextreme events\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: extreme events Wikipedia URL: Extreme Events Rare or extreme events are events that occur with low frequency, and often refers to infrequent events that have a widespread effect and which might destabilize systems (for example, stock markets, ocean wave intensity or optical fibers or society). Rare events encompass natural phenomena (major earthquakes, tsunamis, hurricanes, floods, asteroid impacts, solar flares, etc.), anthropogenic hazards ( warfare and related forms of violent conflict, acts of terrorism , industrial accidents, financial and commodity market crashes, etc.), as well as phenomena for which natural and anthropogenic factors interact in complex ways (epidemic disease spread, global warming -related changes in climate and weather, etc.). One way of judging which events are extreme involves selecting events that exceed a certain threshold of intensity (or frequency, or impact, etc., not shown). This threshold might select events lying above a certain percenti"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "greenhouse gases", "label": "greenhouse gases", "shape": "dot", "size": 12, "title": "\u003cb\u003egreenhouse gases\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: greenhouse gases Wikipedia URL: Greenhouse gases Greenhouse gases ( GHGs ) are the gases in an atmosphere that trap heat, raising the surface temperature of astronomical bodies such as Earth. Unlike other gases, greenhouse gases absorb the radiations that a planet emits , resulting in the greenhouse effect . The Earth is warmed by sunlight, causing its surface to radiate heat , which is then mostly absorbed by greenhouse gases. Without greenhouse gases in the atmosphere, the average temperature of Earth\u0027s surface would be about \u221218 \u00b0C (0 \u00b0F), rather than the present average of 15 \u00b0C (59 \u00b0F). Human-induced warming has been increasing at an unprecedented rate since it has started being measured, reaching 0.27\u00b10.1 \u00b0C per decade over 2015\u20132024. This high rate of warming is caused by a combination of greenhouse gas emissions being at an all-time high of 53.6\u00b15.2 Gt CO2e per year over the last decade (2014\u20132023), as well as reductions in the strength of aerosol cooling. Greenhou"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "aerosols", "label": "aerosols", "shape": "dot", "size": 12, "title": "\u003cb\u003eaerosols\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: aerosols Wikipedia URL: Aerosols An aerosol is a suspension of fine solid particles or liquid droplets in air or another gas . Aerosols can be generated from natural or human causes . The scientific term aerosol refers to the mixture of particulates in gas, and not to the particulate matter alone. The liquid or solid particles in an aerosol have diameters typically less than 1 \u03bcm . Larger particles with a significant settling speed make the mixture a suspension, although the distinction is not clear. Mist and fog are aerosols"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "radiative forcing", "label": "radiative forcing", "shape": "dot", "size": 16, "title": "\u003cb\u003eradiative forcing\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: radiative forcing Wikipedia URL: Radiative forcing Radiative forcing (or climate forcing ) is a concept used to quantify a change to the balance of energy flowing through a planetary atmosphere. Various factors contribute to this change in energy balance, such as concentrations of greenhouse gases and aerosols , and changes in surface albedo and solar irradiance . In more technical terms, it is defined as \"the change in the net, downward minus upward, radiative flux (expressed in W/m 2 ) due to a change in an external driver of climate change.\" These external drivers are distinguished from feedbacks and variability that are internal to the climate system , and that further influence the direction and magnitude of imbalance . Radiative forcing on Earth is meaningfully evaluated at the tropopause and at the top of the stratosphere . It is quantified in units of watts per square meter , and often summarized as an average over the total surface area of the globe. The assessmen"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "human activities", "label": "human activities", "shape": "dot", "size": 12, "title": "\u003cb\u003ehuman activities\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: human activities Wikipedia URL: Human activities 1800s: Martineau \u00b7 Tocqueville \u00b7 Marx \u00b7 Spencer \u00b7 Le Bon \u00b7 Ward \u00b7 Pareto \u00b7 T\u00f6nnies \u00b7 Veblen \u00b7 Simmel \u00b7 Durkheim \u00b7 Addams \u00b7 Mead \u00b7 Weber \u00b7 Du Bois \u00b7 Mannheim \u00b7 Elias Social interaction and creative expression are forms of human behavior"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "climate system", "label": "climate system", "shape": "dot", "size": 18, "title": "\u003cb\u003eclimate system\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: climate system Wikipedia URL: Climate system Earth\u0027s climate system is a complex system with five interacting components: the atmosphere (air), the hydrosphere (water), the cryosphere (ice and permafrost), the lithosphere (earth\u0027s upper rocky layer) and the biosphere (living things). Climate is the statistical characterization of the climate system. It represents the average weather , typically over a period of 30 years, and is determined by a combination of processes, such as ocean currents and wind patterns. Circulation in the atmosphere and oceans transports heat from the tropical regions to regions that receive less energy from the Sun. Solar radiation is the main driving force for this circulation. The water cycle also moves energy throughout the climate system. In addition, certain chemical elements are constantly moving between the components of the climate system. Two examples for these biochemical cycles are the carbon and nitrogen cycles . The five components of "}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "climate variability", "label": "climate variability", "shape": "dot", "size": 12, "title": "\u003cb\u003eclimate variability\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: climate variability Wikipedia URL: Climate variability Climate variability includes all the variations in the climate that last longer than individual weather events, whereas the term climate change only refers to those variations that persist for a longer period of time, typically decades or more. Climate change may refer to any time in Earth\u0027s history, but the term is now commonly used to describe contemporary climate change, often popularly referred to as global warming. Since the Industrial Revolution , the climate has increasingly been affected by human activities . There is seasonal variability in how new high temperature records have outpaced new low temperature records."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "atmospheric circulation", "label": "atmospheric circulation", "shape": "dot", "size": 14, "title": "\u003cb\u003eatmospheric circulation\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: atmospheric circulation Wikipedia URL: Atmospheric circulation Atmospheric circulation is the large-scale movement of air and together with ocean circulation is the means by which thermal energy is redistributed on the surface of Earth . Earth\u0027s atmospheric circulation varies from year to year, but the large-scale structure of its circulation remains fairly constant. The smaller-scale weather systems \u2013 mid-latitude depressions , or tropical convective cells \u2013 occur chaotically, and long-range weather predictions of those cannot be made beyond ten days in practice, or a month in theory (see chaos theory and the butterfly effect ). Idealised depiction (at equinox ) of large-scale atmospheric circulation on Earth"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "atmospheric dynamics", "label": "atmospheric dynamics", "shape": "dot", "size": 12, "title": "\u003cb\u003eatmospheric dynamics\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: atmospheric dynamics Wikipedia URL: Atmospheric dynamics Meteorology is the scientific study of the Earth \u0027s atmosphere and short-term atmospheric phenomena (i.e., weather ), with a focus on weather forecasting . It has applications in the military , aviation , energy production , transport , agriculture , construction , weather warnings , and disaster management . Parhelion (sundog) in Savoie"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "hydrological cycle", "label": "hydrological cycle", "shape": "dot", "size": 14, "title": "\u003cb\u003ehydrological cycle\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: hydrological cycle Wikipedia URL: Hydrological cycle The water cycle (or hydrologic cycle or hydrological cycle ) is a biogeochemical cycle that involves the continuous change in form of water on, above and below the surface of the Earth across different reservoirs. The mass of water on Earth remains fairly constant over time. However, the partitioning of the water into the major reservoirs of ice , fresh water , salt water and atmospheric water is variable and depends on climatic variables . The water moves from one reservoir to another, such as from river to ocean , or from the ocean to the atmosphere due to a variety of physical and chemical processes. The processes that drive these movements, or fluxes , are evaporation , transpiration , condensation , precipitation , sublimation , infiltration , surface runoff , and subsurface flow. In doing so, the water goes through different phases: liquid, solid ( ice ) and vapor . The ocean plays a key role in the water cycle as "}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "evapotranspiration", "label": "evapotranspiration", "shape": "dot", "size": 18, "title": "\u003cb\u003eevapotranspiration\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: evapotranspiration Wikipedia URL: Evapotranspiration Evapotranspiration ( ET ) refers to the combined processes which move water from the Earth\u0027s surface (open water and ice surfaces, bare soil and vegetation ) into the atmosphere . It covers both water evaporation (movement of water to the air directly from soil, canopies , and water bodies) and transpiration (evaporation that occurs through the stomata , or openings, in plant leaves). Evapotranspiration is an important part of the local water cycle and climate , and measurement of it plays a key role in water resource management and agricultural irrigation . Water cycle of the Earth\u0027s surface, showing the individual components of transpiration and evaporation that make up evapotranspiration. Other closely related processes shown are runoff and groundwater recharge ."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "aridity", "label": "aridity", "shape": "dot", "size": 12, "title": "\u003cb\u003earidity\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: aridity Wikipedia URL: Aridity Aridity is the condition of geographical regions which make up approximately 43% of total global available land area, characterized by low annual precipitation, increased temperatures, and limited water availability. These areas tend to fall upon degraded soils, and their health and functioning are key necessities of regulating ecosystems\u2019 atmospheric components. Arid regions of the Western United States as mapped in 1893"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "relative humidity", "label": "relative humidity", "shape": "dot", "size": 14, "title": "\u003cb\u003erelative humidity\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: relative humidity Wikipedia URL: Relative humidity Humidity is the concentration of water vapor present in the air. Water vapor, the gaseous state of water, is generally invisible to the naked eye. Humidity indicates the likelihood for precipitation , dew , or fog to be present. Global distribution of relative humidity at the surface averaged over the years 1981\u20132010 from the CHELSA-BIOCLIM+ data set"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "water vapour", "label": "water vapour", "shape": "dot", "size": 12, "title": "\u003cb\u003ewater vapour\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: water vapour Wikipedia URL: Water vapour Water vapor , water vapour , or aqueous vapor is the gaseous phase of water . It is one state of water within the hydrosphere . Water vapor can be produced from the evaporation or boiling of liquid water or from the sublimation of ice . Water vapor is transparent, like most constituents of the atmosphere. Under typical atmospheric conditions, water vapor is continuously generated by evaporation and removed by condensation . It is less dense than most of the other constituents of air and triggers convection currents that can lead to clouds and fog. The amount of water vapor in Earth\u0027s atmosphere has risen over recent decades, making heavy rainfall events more severe."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "sea level rise", "label": "sea level rise", "shape": "dot", "size": 14, "title": "\u003cb\u003esea level rise\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: sea level rise Wikipedia URL: Sea level rise The sea level has been rising since the end of the Last Glacial Maximum , which was around 20,000 years ago. Between 1901 and 2018, the average sea level rose by 15\u201325 cm (6\u201310 in), with an increase of 2.3 mm (0.091 in) per year since the 1970s. This was faster than the sea level had ever risen over at least the past 3,000 years. The rate accelerated to 4.62 mm (0.182 in)/yr for the decade 2013\u20132022. Climate change due to human activities is the main cause of this persistent acceleration. Between 1993 and 2018, melting ice sheets and glaciers accounted for 44% of sea level rise, with another 42% resulting from thermal expansion of water . The global average sea level has risen about 25 centimetres (9.8 in) since 1880."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "sea surface temperatures", "label": "sea surface temperatures", "shape": "dot", "size": 12, "title": "\u003cb\u003esea surface temperatures\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: sea surface temperatures Wikipedia URL: Sea surface temperatures Sea surface temperature (or ocean surface temperature ) is the temperature of ocean water close to the surface. The exact meaning of surface varies in the literature and in practice. It is usually between 1 millimetre (0.04 in) and 20 metres (70 ft) below the sea surface. Sea surface temperatures greatly modify air masses in the Earth\u0027s atmosphere within a short distance of the shore. The thermohaline circulation has a major impact on average sea surface temperature throughout most of the world\u0027s oceans. Sea-surface temperature since 1979 in the extrapolar region (between 60 degrees south and 60 degrees north latitude)"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "land use", "label": "land use", "shape": "dot", "size": 12, "title": "\u003cb\u003eland use\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: land use Wikipedia URL: Land use Land use is an umbrella term to describe what happens on a parcel of land . It concerns the benefits derived from using the land, and also the land management actions that humans carry out there. The following categories are used for land use: forest land , cropland ( agricultural land ), grassland , wetlands , settlements and other lands. The way humans use land, and how land use is changing, has many impacts on the environment . Effects of land use choices and changes by humans include, for example, urban sprawl , soil erosion , soil degradation , land degradation and desertification . Land use and land management practices have a major impact on natural resources including water , soil , nutrients , plants and animals . Cumulative CO2 emissions from land-use change (as of 2021). Emissions from land-use change can be positive or negative depending on whether these changes emit (positive, brown on the map) or sequester (negative) carbon (g"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "irrigation", "label": "irrigation", "shape": "dot", "size": 14, "title": "\u003cb\u003eirrigation\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: irrigation Wikipedia URL: Irrigation Irrigation is the practice of applying controlled amounts of water to land to help grow crops , landscape plants , and lawns . Irrigation has been a key aspect of agriculture for over 5,000 years and has been developed by many cultures around the world. Irrigation helps to grow crops, maintain landscapes, and revegetate disturbed soils in dry areas and during times of below-average rainfall. In addition to these uses, irrigation is also employed to protect crops from frost , suppress weed growth in grain fields, and prevent soil consolidation . It is also used to cool livestock , reduce dust , dispose of sewage , and support mining operations. Drainage , which involves the removal of surface and sub-surface water from a given location, is often studied in conjunction with irrigation. Irrigation of agricultural fields in Andalusia , Spain. Irrigation canal on the left."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "deforestation", "label": "deforestation", "shape": "dot", "size": 14, "title": "\u003cb\u003edeforestation\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: deforestation Wikipedia URL: Deforestation Deforestation or forest clearance is the removal and destruction of a forest or stand of trees from land that is then converted to non-forest use. Deforestation can involve conversion of forest land to farms , ranches , or urban use. About 31% of Earth\u0027s land surface is covered by forests at present. This is one-third less than the forest cover before the expansion of agriculture, with half of that loss occurring in the last century. On average 2,400 trees are cut down each minute. Estimates vary widely as to the extent of deforestation in the tropics . In 2019, nearly a third of the overall tree cover loss, or 3.8 million hectares, occurred within humid tropical primary forests . These are areas of mature rainforest that are especially important for biodiversity and carbon storage . Deforestation of the Amazon rainforest in Brazil\u0027s Maranh\u00e3o state, 2016"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "El Ni\u00f1o", "label": "El Ni\u00f1o", "shape": "dot", "size": 12, "title": "\u003cb\u003eEl Ni\u00f1o\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: El Ni\u00f1o Wikipedia URL: El Ni%C3%B1o El Ni\u00f1o\u2013Southern Oscillation ( ENSO ) is a global climate phenomenon that emerges from variation in winds and sea surface temperatures over the tropical Pacific Ocean . Those variations have an irregular pattern but do have some semblance of cycles. The occurrence of ENSO is not predictable. It affects the climate of much of the tropics and subtropics , and has links ( teleconnections ) to higher-latitude regions of the world. The warming phase of the sea surface temperature is known as \" El Ni\u00f1o \" and the cooling phase as \" La Ni\u00f1a \". The Southern Oscillation is the accompanying atmospheric oscillation , which is coupled with the sea temperature change. Southern Oscillation Index timeseries from 1876 to 2025. The Southern Oscillation is the atmospheric component of El Ni\u00f1o. This component is an oscillation in surface air pressure between the tropical eastern and the western Pacific Ocean waters."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "North Atlantic Oscillation", "label": "North Atlantic Oscillation", "shape": "dot", "size": 12, "title": "\u003cb\u003eNorth Atlantic Oscillation\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: North Atlantic Oscillation Wikipedia URL: North Atlantic Oscillation The North Atlantic Oscillation ( NAO ) is a weather phenomenon over the North Atlantic Ocean of fluctuations in the difference of atmospheric pressure at sea level (SLP) between the Icelandic Low and the Azores High . Through fluctuations in the strength of the Icelandic Low and the Azores High, it controls the strength and direction of westerly winds and location of storm tracks across the North Atlantic."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "climate models", "label": "climate models", "shape": "dot", "size": 14, "title": "\u003cb\u003eclimate models\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: climate models Wikipedia URL: Climate models Numerical climate models (or climate system models ) are mathematical models that can simulate the interactions of important drivers of climate . These drivers are the atmosphere , oceans , land surface and ice . Scientists use climate models to study the dynamics of the climate system and to make projections of future climate and of climate change . Climate models can also be qualitative (i.e. not numerical) models and contain narratives, largely descriptive, of possible futures. Climate models apply knowledge in various sciences to process extensive sets of input climate data, executing differential equations among grid elements in a three-dimensional model of Earth\u0027s climate system . The models produce simulated climates having an array of climatic and weather elements, such as heatwaves and storms. Each element may be described by several attributes, including intensity, frequency, and impacts. Climate models support adaptat"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "global climate models", "label": "global climate models", "shape": "dot", "size": 14, "title": "\u003cb\u003eglobal climate models\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: global climate models Wikipedia URL: Global climate models A general circulation model ( GCM ) is a type of climate model . It employs a mathematical model of the general circulation of a planetary atmosphere or ocean. It uses the Navier\u2013Stokes equations on a rotating sphere with thermodynamic terms for various energy sources ( radiation , latent heat ). These equations are the basis for computer programs used to simulate the Earth\u0027s atmosphere or oceans. Atmospheric and oceanic GCMs (AGCM and OGCM ) are key components along with sea ice and land-surface components. Climate models are systems of differential equations based on the basic laws of physics , fluid motion , and chemistry . To \"run\" a model, scientists divide the planet into a 3-dimensional grid, apply the basic equations, and evaluate the results. Atmospheric models calculate winds , heat transfer , radiation , relative humidity , and surface hydrology within each grid and evaluate interactions with neighboring"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Coupled Model Intercomparison Project", "label": "Coupled Model Intercomparison Project", "shape": "dot", "size": 12, "title": "\u003cb\u003eCoupled Model Intercomparison Project\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Coupled Model Intercomparison Project Wikipedia URL: Coupled Model Intercomparison Project In climatology , the Coupled Model Intercomparison Project (CMIP) is a collaborative framework designed to improve knowledge of climate change . It was organized in 1995 by the Working Group on Coupled Modelling (WGCM) of the World Climate Research Programme (WCRP). It is developed in phases to foster the climate model improvements but also to support national and international assessments of climate change. A related project is the Atmospheric Model Intercomparison Project (AMIP) for global coupled ocean-atmosphere general circulation models (GCMs). SSP-RF scenario matrix, utilizing CMIP6"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "CORDEX", "label": "CORDEX", "shape": "dot", "size": 12, "title": "\u003cb\u003eCORDEX\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: CORDEX Wikipedia URL: CORDEX Downscaling is any procedure to infer high-resolution information from low-resolution variables. This technique is based on dynamical or statistical approaches commonly used in several disciplines, especially meteorology , climatology and remote sensing . The term downscaling usually refers to an increase in spatial resolution , but it is often also used for temporal resolution . This is not to be confused with image downscaling which is a process of reducing an image from a higher resolution to a lower resolution."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "model evaluation", "label": "model evaluation", "shape": "dot", "size": 12, "title": "\u003cb\u003emodel evaluation\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: model evaluation Wikipedia URL: Model evaluation In statistics , model validation is the task of evaluating whether a chosen statistical model is appropriate or not. Oftentimes in statistical inference, inferences from models that appear to fit their data may be flukes, resulting in a misunderstanding by researchers of the actual relevance of their model. To combat this, model validation is used to test whether a statistical model can hold up to permutations in the data. Model validation is also called model criticism or model evaluation. Data (black dots), which was generated via the straight line and some added noise, is perfectly fitted by a curvy polynomial ."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "projections", "label": "projections", "shape": "dot", "size": 12, "title": "\u003cb\u003eprojections\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: projections Wikipedia URL: Projections Projection or projections may refer to:"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "simulations", "label": "simulations", "shape": "dot", "size": 12, "title": "\u003cb\u003esimulations\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: simulations Wikipedia URL: Simulations A simulation is an imitative representation of a process or system that could exist in the real world. In this broad sense, simulation can often be used interchangeably with model . Sometimes a clear distinction between the two terms is made, in which simulations require the use of models; the model represents the key characteristics or behaviors of the selected system or process, whereas the simulation represents the evolution of the model over time. Another way to distinguish between the terms is to define simulation as experimentation with the help of a model. This definition includes time-independent simulations. Often, computers are used to execute the simulation . Human-in-the-loop simulation of outer space"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "reanalysis", "label": "reanalysis", "shape": "dot", "size": 12, "title": "\u003cb\u003ereanalysis\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: reanalysis Wikipedia URL: Reanalysis Reanalysis is a new analysis of something. It may refer to:"}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Africa", "label": "Africa", "shape": "dot", "size": 20, "title": "\u003cb\u003eAfrica\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMain Topic\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Africa Wikipedia URL: Africa Africa is the world\u0027s second-largest and second-most populous continent after Asia . At about 30.3 million km 2 (11.7 million square miles) including adjacent islands, it covers around 20% of Earth \u0027s land area and 6% of its total surface area. With nearly 1.4 billion people as of 2021, it accounts for about 18% of the world\u0027s human population . Africa\u0027s population is the youngest among all the continents; the median age in 2012 was 19.7, when the worldwide median age was 30.4. Based on 2024 projections, Africa\u0027s population will exceed 3.8 billion people by 2100. Africa is the least wealthy inhabited continent per capita and second-least wealthy by total wealth, ahead of Oceania . Scholars have attributed this to different factors including geography , climate , corruption , colonialism , the Cold War , and neocolonialism . Despite this low concentration of wealth, recent economic expansion and a large and young population make Africa an import"}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "Asia", "label": "Asia", "shape": "dot", "size": 20, "title": "\u003cb\u003eAsia\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMain Topic\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Asia Wikipedia URL: Asia Asia ( / \u02c8 e\u026a \u0292 \u0259 / \u24d8 AY -zh\u0259 , UK also / \u02c8 e\u026a \u0283 \u0259 / AY -sh\u0259 ) is the largest continent in the world by both land area and population. It covers an area of more than 44 million square kilometres, about 30% of Earth\u0027s total land area and 8% of Earth\u0027s total surface area. The continent, which has long been home to the majority of the human population , was the site of many of the first civilisations . Its 4.7 billion people constitute roughly 60% of the world\u0027s population."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Europe", "label": "Europe", "shape": "dot", "size": 18, "title": "\u003cb\u003eEurope\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Europe Wikipedia URL: Europe Europe is a continent located entirely in the Northern Hemisphere and mostly in the Eastern Hemisphere . It is bordered by the Arctic Ocean to the north, the Atlantic Ocean to the west, the Mediterranean Sea to the south, and Asia to the east. Europe shares the landmass of Eurasia with Asia, and of Afro-Eurasia with both Africa and Asia. Europe is commonly considered to be separated from Asia by the watershed of the Ural Mountains , the Ural River , the Caspian Sea , the Greater Caucasus , the Black Sea , and the Turkish straits . Reconstruction of an early world map made by Anaximander of the 6th century BCE, dividing the known world into three large landmasses, one of which was named Europe"}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "North America", "label": "North America", "shape": "dot", "size": 18, "title": "\u003cb\u003eNorth America\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: North America Wikipedia URL: North America North America is a continent in the Northern and Western hemispheres. North America is bordered to the north by the Arctic Ocean , to the east by the Atlantic Ocean , to the southeast by South America and the Caribbean Sea , and to the south and west by the Pacific Ocean . The region includes Middle America comprising the Caribbean , Central America , and Northern America ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "South America", "label": "South America", "shape": "dot", "size": 16, "title": "\u003cb\u003eSouth America\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: South America Wikipedia URL: South America South America is a continent entirely in the Western Hemisphere and mostly in the Southern Hemisphere , with a considerably smaller portion in the Northern Hemisphere . It can also be described as the southern subregion of the Americas ."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Australia", "label": "Australia", "shape": "dot", "size": 14, "title": "\u003cb\u003eAustralia\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Australia Wikipedia URL: Australia Australia , officially the Commonwealth of Australia , is a country comprising the mainland of the Australian continent , the island of Tasmania and numerous smaller islands . It has a total area of 7,688,287 km 2 (2,968,464 sq mi), making it the sixth-largest country in the world and the largest in Oceania . Australia is the world\u0027s flattest and driest inhabited continent. It is a megadiverse country , and its size gives it a wide variety of landscapes and climates including deserts in the interior and tropical rainforests along the coast . Aboriginal rock art in the Kimberley region of Western Australia"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "New Zealand", "label": "New Zealand", "shape": "dot", "size": 14, "title": "\u003cb\u003eNew Zealand\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: New Zealand Wikipedia URL: New Zealand New Zealand is an island country in the southwestern Pacific Ocean . It consists of two main landmasses\u2014the North Island ( Te Ika-a-M\u0101ui ) and the South Island ( Te Waipounamu )\u2014and over 600 smaller islands . It is the sixth-largest island country by area and lies east of Australia across the Tasman Sea and south of the islands of New Caledonia , Fiji , and Tonga . The country\u0027s varied topography and sharp mountain peaks, including the Southern Alps ( K\u0101 Tiritiri o te Moana ), owe much to tectonic uplift and volcanic eruptions. New Zealand\u0027s capital city is Wellington , and its most populous city is Auckland ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "China", "label": "China", "shape": "dot", "size": 16, "title": "\u003cb\u003eChina\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: China Wikipedia URL: China China , officially the People\u0027s Republic of China ( PRC ), is a country in East Asia . It is the second-most populous country after India , with a population exceeding 1.4 billion, representing 17% of the world\u0027s population. China borders fourteen countries by land across an area of 9.6 million square kilometers (3,700,000 sq mi), making it the third-largest country by area . The country is divided into 33 province-level divisions : 22 provinces , 5 autonomous regions , 4 municipalities , and 2 semi-autonomous special administrative regions . Beijing is the capital, while Shanghai is the most populous city by urban area and largest financial center ."}, {"color": "#66B2FF", "font": {"color": "#FFFFFF"}, "id": "India", "label": "India", "shape": "dot", "size": 20, "title": "\u003cb\u003eIndia\u003c/b\u003e\u003cbr\u003e\u003ci\u003eMain Topic\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: India Wikipedia URL: India India , officially the Republic of India , is a country in South Asia . It is the seventh-largest country by area ; the most populous country since 2023; and, since its independence in 1947, the world\u0027s most populous democracy. Bounded by the Indian Ocean on the south, the Arabian Sea on the southwest, and the Bay of Bengal on the southeast, it shares land borders with Pakistan to the west; China , Nepal , and Bhutan to the north; and Bangladesh and Myanmar to the east. In the Indian Ocean , India is near Sri Lanka and the Maldives ; its Andaman and Nicobar Islands share a maritime border with Myanmar, Thailand , and Indonesia ."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Japan", "label": "Japan", "shape": "dot", "size": 14, "title": "\u003cb\u003eJapan\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Japan Wikipedia URL: Japan Japan is an island country in East Asia . Located in the Pacific Ocean off the northeast coast of the Asian mainland , it is bordered to the west by the Sea of Japan and extends from the Sea of Okhotsk in the north to the East China Sea in the south. The Japanese archipelago consists of four major islands alongside 14,121 smaller islands . Japan is divided into 47 administrative prefectures and eight traditional regions , and around 75% of its terrain is mountainous and heavily forested, concentrating its agriculture and highly urbanized population along its eastern coastal plains . With a population of almost 123 million as of 2026, it is the world\u0027s 11th most populous country . Tokyo is the country\u0027s capital and largest city ."}, {"color": "#FF9933", "font": {"color": "#FFFFFF"}, "id": "Pakistan", "label": "Pakistan", "shape": "dot", "size": 18, "title": "\u003cb\u003ePakistan\u003c/b\u003e\u003cbr\u003e\u003ci\u003eSubfield / Category\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Pakistan Wikipedia URL: Pakistan Pakistan , officially the Islamic Republic of Pakistan , is a country in South Asia . It is the fifth-most populous country , with a population of over 241.5 million, having the second-largest Muslim population as of 2023. Islamabad is the nation\u0027s capital, while Karachi is its largest city and financial centre . Pakistan is the 33rd-largest country by area . Bounded by the Arabian Sea on the south, the Gulf of Oman on the southwest, and the Sir Creek on the southeast, it shares land borders with India to the east; Afghanistan to the west; Iran to the southwest; and China to the northeast. It shares a maritime border with Oman in the Gulf of Oman, and is separated from Tajikistan in the northwest by Afghanistan\u0027s narrow Wakhan Corridor ."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "United States", "label": "United States", "shape": "dot", "size": 14, "title": "\u003cb\u003eUnited States\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: United States Wikipedia URL: United States The United States of America ( USA ), also known as the United States ( U.S. ) or America , is a country primarily located in North America . It is a federal republic of 50 states and a federal capital district , Washington, D.C. The 48 contiguous states border Canada to the north and Mexico to the south, with the semi-exclave of Alaska in the northwest and the archipelago of Hawaii in the Pacific Ocean . The United States also asserts sovereignty over five major island territories and various uninhabited islands in Oceania and the Caribbean . It is a megadiverse country , with the world\u0027s third-largest land area and third-largest population , exceeding 341 million. Cliff Palace , a settlement of ancestors of the Native American Pueblo peoples in present-day Montezuma County, Colorado , built between c. 1200 and 1275"}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "United Kingdom", "label": "United Kingdom", "shape": "dot", "size": 12, "title": "\u003cb\u003eUnited Kingdom\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: United Kingdom Wikipedia URL: United Kingdom The United Kingdom of Great Britain and Northern Ireland , commonly known as the United Kingdom ( UK ) or Britain , is a country in northwestern Europe , off the coast of the continental mainland . It comprises England , Scotland , Wales and Northern Ireland , with a population of over 69 million in 2024. The UK includes the island of Great Britain , the north-eastern part of the island of Ireland , and most of the smaller islands within the British Isles , covering 94,354 square miles (244,376 km 2 ). It shares a land border with the Republic of Ireland and is surrounded by the Atlantic Ocean , the North Sea , the English Channel , the Celtic Sea and the Irish Sea , while maintaining sovereignty over the Crown Dependencies and the British Overseas Territories . The capital and largest city of England and the UK is London ; Edinburgh , Cardiff and Belfast are the national capitals of Scotland, Wales and Northern Ireland."}, {"color": "#FF5555", "font": {"color": "#FFFFFF"}, "id": "Mediterranean", "label": "Mediterranean", "shape": "dot", "size": 12, "title": "\u003cb\u003eMediterranean\u003c/b\u003e\u003cbr\u003e\u003ci\u003eRelated Concept\u003c/i\u003e\u003cbr\u003e\u003cbr\u003esearch term: Mediterranean Wikipedia URL: Mediterranean For other countries, click here ."}, {"color": "#FF <script>
// Search functionality
document.getElementById("searchButton").onclick = function() {
  var query = document.getElementById("searchInput").value.trim().toLowerCase();
  if (!query) return;

  var nodes = network.body.data.nodes.get();
  var found = nodes.find(n => n.label.toLowerCase() === query);

  if (found) {
    network.focus(found.id, {scale: 1.6, animation: true});
    network.selectNodes([found.id]);
  }

  document.getElementById("searchInput").value = "";
};

document.getElementById("searchInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    document.getElementById("searchButton").click();
  }
});
</script>
