"}, "id": "capacity building", "label": "capacity building", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/76/Launching_of_the_%E2%80%9CStrengthening_Capacity_and_Institutional_Reform_for_Green_Growth_and_Sustainable_Development_in_Vietnam%E2%80%9D_Project_%2816143587120%29.jpg/250px-Launching_of_the_%E2%80%9CStrengthening_Capacity_and_Institutional_Reform_for_Green_Growth_and_Sustainable_Development_in_Vietnam%E2%80%9D_Project_%2816143587120%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecapacity building\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: capacity building Wikipedia URL: Capacity building Capacity building (or capacity development, capacity strengthening ) is the improvement in an individual\u0027s or organization\u0027s facility (or capability) \"to produce, perform or deploy\". The terms capacity building and capacity development have often been used interchangeably, although a publication by OECD-DAC stated in 2006 that capacity development was the preferable term. Since the 1950s, international organizations, governments, no...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "carbon capture", "label": "carbon capture", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecarbon capture\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: carbon capture Wikipedia URL: Carbon capture Carbon capture may refer to:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "carbon footprint", "label": "carbon footprint", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/d3/Environmental-impact-of-food-by-life-cycle-stage.png/250px-Environmental-impact-of-food-by-life-cycle-stage.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecarbon footprint\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: carbon footprint Wikipedia URL: Carbon footprint A carbon footprint (or greenhouse gas footprint ) is a calculated value or index that makes it possible to compare the total amount of greenhouse gases that an activity, product, company or country adds to the atmosphere . Carbon footprints are usually reported in tonnes of emissions ( CO 2 -equivalent ) per unit of comparison. Such units can be for example tonnes CO 2 -eq per year , per kilogram of protein for consumption , per kilom...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "carbon lock-in", "label": "carbon lock-in", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/EricksonEtAl_2015_AssessingCarbonLockin_EnvironmentalResearchLetters.jpg/500px-EricksonEtAl_2015_AssessingCarbonLockin_EnvironmentalResearchLetters.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecarbon lock-in\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: carbon lock-in Wikipedia URL: Carbon lock-in Carbon lock-in refers to the self-perpetuating inertia created by large fossil fuel -based energy systems that inhibits public and private efforts to introduce alternative energy technologies. Related to the concept of technological lock-in , the concept is most used in relation to the challenge of altering the current energy infrastructure to respond to global climate change . According to an assessment proposed by Erickson et al. (2015)...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "carbon neutrality", "label": "carbon neutrality", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/13/Global_CO2_Pathways_Using_Remaining_Carbon_Budgets.svg/330px-Global_CO2_Pathways_Using_Remaining_Carbon_Budgets.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecarbon neutrality\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: carbon neutrality Wikipedia URL: Carbon neutrality Global net-zero emissions are reached when greenhouse gas emissions and removals due to human activities are in balance. Net-zero emissions is often shortened to net zero . Once global net zero is achieved, further global warming is expected to significantly slow down, but the effects of existing atmospheric greenhouse gases will still contribute to continued warming. Different climate targets and the corresponding date to reach net...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "carbon sinks", "label": "carbon sinks", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/62/1850-_Global_carbon_budget_-_Global_Carbon_Project_-_offset-stacked_bar_chart.svg/500px-1850-_Global_carbon_budget_-_Global_Carbon_Project_-_offset-stacked_bar_chart.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecarbon sinks\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: carbon sinks Wikipedia URL: Carbon sinks A carbon sink is a natural or artificial carbon sequestration process that \"removes a greenhouse gas , an aerosol or a precursor of a greenhouse gas from the atmosphere \". These sinks form an important part of the natural carbon cycle . An overarching term is carbon pool , which is all the places where carbon on Earth can be, i.e. the atmosphere , oceans , soil , florae , fossil fuel reservoirs and so forth. A carbon sink is a type of carbon ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "carbon stocks", "label": "carbon stocks", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Diagram_of_natural_resource_flows-en.svg/250px-Diagram_of_natural_resource_flows-en.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecarbon stocks\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: carbon stocks Wikipedia URL: Carbon stocks Prescriptive and policy\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "carbon storage", "label": "carbon storage", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/Carbon_sequestration-2009-10-07.svg/330px-Carbon_sequestration-2009-10-07.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecarbon storage\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: carbon storage Wikipedia URL: Carbon storage Carbon sequestration is a natural process of storing carbon in a carbon pool . It plays a crucial role in effectively managing the global carbon cycle and limiting climate change by reducing the amount of carbon dioxide in the atmosphere . There are two main types of carbon sequestration: biologic (also called biosequestration ) and geologic. Geologic and biologic carbon sequestration of excess carbon dioxide in the atmosphere emitted by ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Caribbean", "label": "Caribbean", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Central_America_and_the_Caribbean_Shaded_Relief_Map.png/330px-Central_America_and_the_Caribbean_Shaded_Relief_Map.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eCaribbean\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Caribbean Wikipedia URL: Caribbean The Caribbean is a region in the middle of the Americas centered around the Caribbean Sea in the North Atlantic Ocean , mostly overlapping with the West Indies . Bordered by North America to the north and also the west through Central America , and South America to the south, it comprises numerous islands , cays, islets, reefs, and banks.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "cement", "label": "cement", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/USMC-110806-M-IX060-148.jpg/250px-USMC-110806-M-IX060-148.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecement\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: cement Wikipedia URL: Cement A cement is a binder , a chemical substance used for construction that sets , hardens, and adheres to other materials to bind them together. Cement is seldom used on its own, but rather to bind sand and gravel ( aggregate ) together. Cement mixed with fine aggregate produces mortar for masonry, or with sand and gravel , produces concrete . Concrete is the most widely used material in existence and is behind only water as the planet\u0027s most-consumed resour...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "central government", "label": "central government", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecentral government\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: central government Wikipedia URL: Central government A central government is the government that is a controlling power over a unitary state . Another distinct but sovereign political entity is a federal government , which may have distinct powers at various levels of government, authorized or delegated to it by the federation and mutually agreed upon by each of the federated states .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "China", "label": "China", "shape": "dot", "size": 13.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/CHN_orthographic.svg/250px-CHN_orthographic.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eChina\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: China Wikipedia URL: China China , officially the People\u0027s Republic of China ( PRC ), is a country in East Asia . It is the second-most populous country after India , with a population exceeding 1.4 billion, representing 17% of the world\u0027s population. China borders fourteen countries by land across an area of 9.6 million square kilometers (3,700,000 sq mi), making it the third-largest country by area . The country is divided into 33 province-level divisions : 22 provinces , 5 autono...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Chinese Cities", "label": "Chinese Cities", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/Cities_in_China.png/500px-Cities_in_China.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eChinese Cities\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Chinese Cities Wikipedia URL: Chinese Cities According to the administrative divisions of the People\u0027s Republic of China , there are three levels of cities: provincial-level cities (consisting of directly-administered municipalities and the special administrative regions of Hong Kong and Macau ), prefecture-level cities , and county-level cities . As of January 2024, the PRC has a total of 707 cities: 4 municipalities, 2 SARs, 293 prefecture-level cities (including the 15 sub-provin...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "circular economy", "label": "circular economy", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/67/Linia_kontra%C5%AD_Cirkulero.svg/500px-Linia_kontra%C5%AD_Cirkulero.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecircular economy\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: circular economy Wikipedia URL: Circular economy Circular economy (CE), also referred to as circularity , is a model of resource production and consumption that involves sharing , leasing, reusing , repairing, refurbishing, and recycling materials and products, to extend product life cycle for as long as possible. The concept aims to tackle global challenges such as climate change , biodiversity loss , waste , and pollution by emphasizing the design-based implementation of the three...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "city blocks", "label": "city blocks", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/be/City_block.PNG/250px-City_block.PNG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecity blocks\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: city blocks Wikipedia URL: City blocks In urban planning and urban design , a city block , residential block , urban block , houseblock , or simply block is the smallest group of buildings that is surrounded by streets . City blocks are the space for buildings within the street pattern of a city, and form the basic unit of a city\u0027s urban fabric. City blocks may be subdivided into any number of smaller land lots usually in private ownership, though in some cases, it may be other form...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "city regions", "label": "city regions", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/fc/City-Region_of_Toulouse%2C_France_-_1_hour.png/500px-City-Region_of_Toulouse%2C_France_-_1_hour.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecity regions\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: city regions Wikipedia URL: City regions City region is a term used by urbanists , economists and urban planners to refer to how one or more core cities are linked to a hinterland by functional ties, such as economic, housing-market, commuting , marketing or retail catchment factors. This concept emphasizes the importance of these functional relationships in understanding urban areas and their surrounding regions, often providing more insightful perspectives than the arbitrary bound...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "climate adaptation", "label": "climate adaptation", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/Wetland_restoration_in_Australia.jpg/250px-Wetland_restoration_in_Australia.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eclimate adaptation\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: climate adaptation Wikipedia URL: Climate adaptation Climate change adaptation is the process of adjusting to the effects of climate change , both current and anticipated. Adaptation aims to moderate or avoid harm for people, and is usually done alongside climate change mitigation . It also aims to exploit opportunities. Adaptation can involve interventions to help natural systems cope with changes. Wetland restoration in Australia\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "climate change impacts", "label": "climate change impacts", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/4c/20200118_Global_warming_and_climate_change_-_vertical_block_diagram_-_causes_effects_feedback.svg/500px-20200118_Global_warming_and_climate_change_-_vertical_block_diagram_-_causes_effects_feedback.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eclimate change impacts\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: climate change impacts Wikipedia URL: Climate change impacts Effects of climate change are well documented and growing for Earth\u0027s natural environment and human societies. Changes to the climate system include an overall warming trend , changes to precipitation patterns , and more extreme weather . As the climate changes it impacts the natural environment with effects such as more intense forest fires , thawing permafrost , and desertification . These changes impact ecosystems and s...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "climate finance", "label": "climate finance", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/db/2015-_Investment_in_clean_energy_-_IEA.svg/500px-2015-_Investment_in_clean_energy_-_IEA.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eclimate finance\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: climate finance Wikipedia URL: Climate finance Climate finance is an umbrella term for financial resources such as loans, grants, or domestic budget allocations for climate change mitigation , adaptation or resiliency . Finance can come from private and public sources. It can be channeled by various intermediaries such as multilateral development banks or other development agencies. Those agencies are particularly important for the transfer of public resources from developed to deve...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "climate policy", "label": "climate policy", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/5/54/COP21_participants_-_30_Nov_2015_%2823430273715%29.jpg/250px-COP21_participants_-_30_Nov_2015_%2823430273715%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eclimate policy\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: climate policy Wikipedia URL: Climate policy The politics of climate change results from different perspectives on how to respond to climate change . Global warming is driven largely by the emissions of greenhouse gases due to human activity, especially the burning of fossil fuels , certain industries like cement and steel production, and land use for agriculture and forestry . Since the Industrial Revolution , fossil fuels have provided the main source of energy for economic and te...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "CMIP6", "label": "CMIP6", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/SSPs-CMIP6.svg/250px-SSPs-CMIP6.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eCMIP6\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: CMIP6 Wikipedia URL: CMIP6 In climatology , the Coupled Model Intercomparison Project (CMIP) is a collaborative framework designed to improve knowledge of climate change . It was organized in 1995 by the Working Group on Coupled Modelling (WGCM) of the World Climate Research Programme (WCRP). It is developed in phases to foster the climate model improvements but also to support national and international assessments of climate change. A related project is the Atmospheric Model Inter...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Communities", "label": "Communities", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/39/A_community_townhall_at_Mak ods and services bought for consumption purposes by households. It is calculated as the weighted average price of a market basket of consumer goods and services . Changes in CPI track changes in prices over time. The items in the basket are updated periodically to reflect changes in consumer spending habits. The prices of the goods and services in the basket are collected (oft...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "crowding", "label": "crowding", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecrowding\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: crowding Wikipedia URL: Crowding A crowd is a large and definable group of people.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "cycling", "label": "cycling", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/d0/Cycliste_%C3%A0_place_d%27Italie-Paris_crop.jpg/250px-Cycliste_%C3%A0_place_d%27Italie-Paris_crop.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecycling\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: cycling Wikipedia URL: Cycling Cycling , also known as bicycling or biking , is the activity of riding a bicycle or other types of pedal -driven human-powered vehicles such as balance bikes , unicycles , tricycles , and quadricycles . Cycling is pract x;color:#ddd;line-height:1.4;\u0027\u003esearch term: GHG emissions Wikipedia URL: GHG emissions Greenhouse gas emissions ( GHG emissions ) from human activities intensify the greenhouse effect which contributes to climate change . Carbon dioxide (CO 2 ) from burning fossil fuels (such as coal , oil , and natural gas ) is the main cause of climate change. The largest annual emissions are from China followed by the United States, which has higher emissions per capita . The main producers fueling the emissions globally are large oil and ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "GHGs", "label": "GHGs", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/0/04/Greenhouse-effect-t2.svg/500px-Greenhouse-effect-t2.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eGHGs\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: GHGs Wikipedia URL: GHGs Greenhouse gases ( GHGs ) are the gases in an atmosphere that trap heat, raising the surface temperature of astronomical bodies such as Earth. Unlike other gases, greenhouse gases absorb the radiations that a planet emits , resulting in the greenhouse effect . The Earth is warmed by sunlight, causing its surface to radiate heat , which is then mostly absorbed by greenhouse gases. Without greenhouse gases in the atmosphere, the average temperature of Earth\u0027s ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "global cities", "label": "global cities", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width: ation Reports , ranking it 4th out of 265 journ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Global Human Settlement Layer", "label": "Global Human Settlement Layer", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eGlobal Human Settlement Layer\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Global Human Settlement Layer Wikipedia URL: Global Human Settlement Layer The Global Human Settlement Layer ( GHSL ) is a project from the European Commission that creates global geographical data about the evolution of human habitation on Earth. This in the form of population density maps, built-up maps , and settlement maps. This information is produced using new geographic data mining tools and knowledge and analytics based on empirical data.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "global networks", "label": "global networks", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/7d/World_map_of_submarine_cables.png/330px-World_map_of_submarine_cables.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eglobal networks\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: global networks Wikipedia URL: Global networks A global network is any communication network that spans the entire Earth . The term, as used in this article nd natural gas ) burning since the Industrial Revolution . Fossil fuel use,...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "grasslands", "label": "grasslands", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/ff/%D0%9A%D1%80%D0%B0%D1%81%D0%BD%D0%BE%D0%BA%D0%BE%D0%B2%D1%8B%D0%BB%D1%8C%D0%BD%D0%B0%D1%8F_%D1%81%D1%82%D0%B5%D0%BF%D1%8C_%D0%B2_%D0%B1%D0%B0%D1%81%D1%81%D0%B5%D0%B9%D0%BD%D0%B5_%D0%9A%D1%83%D0%BA%D1%83%D0%B9%D0%BA%D0%B8_%D0%B2_%D0%9A%D1%83%D1%80%D1%8C%D0%B8%D0%BD%D1%81%D0%BA%D0%BE%D0%BC_%D1%80%D0%B0%D0%B9%D0%BE%D0%BD%D0%B5.JPG/500px-%D0%9A%D1%80%D0%B0%D1%81%D0%BD%D0%BE%D0%BA%D0%BE%D0%B2%D1%8B%D0%BB%D1%8C%D0%BD%D0%B0%D1%8F_%D1%81%D1%82%D0%B5%D0%BF%D1%8C_%D0%B2_%D0%B1%D0%B0%D1%81%D1%81%D0%B5%D0%B9%D0%BD%D0%B5_%D0%9A%D1%83%D0%BA%D1%83%D0%B9%D0%BA%D0%B8_%D0%B2_%D0%9A%D1%83%D1%80%D1%8C%D0%B8%D0%BD%D1%81%D0%BA%D0%BE%D0%BC_%D1%80%D0%B0%D0%B9%D0%BE%D0%BD%D0%B5.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egrasslands\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: grasslands Wikipedia URL: Grasslands A grassland is an area (or ecosystem) where the vegetation is dominated by grasses . Sedges and rushes can also be found along with some of legumes such as clover , and other herbs . Grasslands occur naturally on all continents except Antarctica and are found in most ecoregions of the Earth. Furthermore, grasslands are one of the largest biomes on Earth, covering 31\u201369% of the Earth\u0027s land area. There are different types of grasslands: natural gr...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933" u003esearch term: Green roofs Wikipedia URL: Green roofs A green roof or living roof is a roof of a building that is partially or completely covered with vegetation and a growing medium, planted over a waterproofing membrane . It may also include additional layers such as a root barrier and drainage , and irrigation systems. Container gardens on roofs, where plants are maintained in pots, are not generally considered to be true green roofs, although this is debated. Rooftop ponds are another form of ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "green walls", "label": "green walls", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Green-Wall-Blusson-Hall-SFU-Burnaby-British-Columbia-Canada-01-A.jpg/250px-Green-Wall-Blusson-Hall-SFU-Burnaby-British-Columbia-Canada-01-A.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egreen walls\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: green walls Wikipedia URL: Green walls A green wall is a vertical built structure intentionally covered by vegetation . Green walls include a vertically applied growth medium such as soil , substitute substrate , or hydroculture felt ; as well as an integrated hydration and fertigation delivery system. They are also referred to as living walls or vertical gardens , and widely associated with the delivery of many beneficial ecosystem services . Green wall at the Simon Fraser Universi...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "greenways", "label": "greenways", "shape": "dot", "size": 10 ) and the United Nations Environment Programme (UNEP) set up the IPCC in 1988. The UN endorsed the creation of the IPCC later that year. It has a secretariat in Geneva , Switzerland,...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Islam", "label": "Islam", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/79/The_Kaaba_during_Hajj.jpg/330px-The_Kaaba_during_Hajj.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eIslam\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Islam Wikipedia URL: Islam Islam is an Abrahamic monotheistic religion based on the Quran and the teachings of Muhammad . The religion\u0027s adherents, called Muslims , are estimated to number 2 billion worldwide and are the world\u0027s second-largest religious population , after Christians .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Japan", "label": "Japan", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/62/Japan_%28orthographic_projection%29.svg/250px-Japan_%28orthographic_projection%29.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eJapan\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Japan Wikipedia URL:      \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/db/Co2-land-use_%28OWID_0189%29.png/250px-Co2-land-use_%28OWID_0189%29.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eland use\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: land use Wikipedia URL: Land use Land use is an umbrella term to describe what happens on a parcel of land . It concerns the benefits derived from using the land, and also the land management actions that humans carry out there. The following categories are used for land use: forest land , cropland ( agricultural land ), grassland , wetlands , settlements and other lands. The way humans use land, and how land use is changing, has many impacts on the environment . Effects of land use...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Land use policy", "label": "Land use policy", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eLand use policy\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: Land use policy Wikipedia URL: Land use policy Land use policy is a monthly peer-reviewed scientific journal covering various aspects of land use research. It is published by Elsevier and was established in 2004. The editors-in-chief are Uchendu Chigbu ( Namibia University of Science and Technology ) and Xiaoling Zhang ( University of Hong Kong ).\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "landfills", "label": "landfills", "shape": "dot", "size": 11.2, "title": ze (usually denoted N ) is a countable quantity representing the number of individual organisms in a population . Population size is directly associated with amount of genetic drift , and is the underlying cause of effects like population bottlenecks and the founder effect . Genetic drift is the major source of decrease of genetic diversity within populations which drives fixa...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "poverty", "label": "poverty", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/39/Global-inequality-in-1800-1975-and-2015.png/250px-Global-inequality-in-1800-1975-and-2015.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epoverty\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: poverty Wikipedia URL: Poverty Poverty is a state or condition in which an individual lacks the financial resources and essentials for a basic standard of living . Poverty can have diverse environmental , legal , social , economic , and political causes and effects. When evaluating poverty in statistics or economics there are two main measures: absolute poverty which compares income against the amount needed to meet basic personal needs , such as food , clothing , and shelter ; seco...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "pricing", "label": "pricing", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/16/Price_tag_of_a_Marks_%26_Spencer_product_01.jpg/250px-Price_tag_of_a_Marks_%26_Spencer_product_01.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epricing\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: pricing Wikipedia URL: Pricing Pricing is the process whereby a business sets and displays the price at which it will sell its products and services and may be part of the business\u0027s marketing plan . In setting prices, the business will take into account the price at which it could acquire the goods, the manufacturing cost , the marketplace , competition, market condition, brand , and quality of the product. A price tag is a highly visual and objective guide to value.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "productivity", "label": "productivity", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/3b/Labour_productivity_levels_in_europe.svg/250px-Labour_productivity_levels_in_europe.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eproductivity\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003esearch term: productivity Wikipedia URL: Productivity Prescriptive and policy Labour productivity levels in 2012 in Europe. OECD\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "projections", "label": "projections", "shape": "dot", "size": 10.6, "title": "\n <style>
#searchBox {
  position: fixed; top: 20px; left: 20px; z-index: 9999;
  background: rgba(0,0,0,0.6); padding: 10px 15px;
  border-radius: 8px; border: 1px solid #66b2ff;
}
#searchInput {
  width: 160px; padding: 5px; border: none; outline: none;

}
#searchButton {
  padding: 5px 8px; background: #66b2ff; color: #000;
  border: none; border-radius: 4px; cursor: pointer;
}
#legendBox {
  position: fixed; top: 20px; right: 20px; background: rgba(0,0,0,0.6);
  border: 1px solid #66b2ff; border-radius: 8px; padding: 10px 14px;
  z-index: 9999; color: #fff; font-family: system-ui, Helvetica, Arial;
  font-size: 13px; max-width: 200px; line-height: 1.6;
}
.legend-item { display: flex; align-items: center; margin-bottom: 5px; }
.legend-dot { width: 14px; height: 14px; border-radius: 50%; margin-right: 8px; }
.legend-blue { background: #66b2ff; }
.legend-orange { background: #ff9933; }
.legend-red { background: #ff5555; }
.legend-green { background: #00ff99; }
</style>

<div id="searchBox">
  <input id="searchInput" type="text" placeholder="Search node...">
  <button id="searchButton">Go</button>
</div>

<div id="legendBox">
  <div style="font-weight:bold;margin-bottom:5px;">🗺️ Node Colors</div>
  <div class="legend-item"><span class="legend-dot legend-green"></span>Highly Connected Nodes</div>
  <div class="legend-item"><span class="legend-dot legend-blue"></span>Main Topics</div>
  <div class="legend-item"><span class="legend-dot legend-orange"></span>Subfields / Categories</div>
  <div class="legend-item"><span class="legend-dot legend-red"></span>Related Concepts</div>
</div>

<script>
document.getElementById('searchButton').onclick = function() {
  var query = document.getElementById('searchInput').value.trim().toLowerCase();
  if (!query) return;
  var nodes = network.body.data.nodes.get();
  var found = nodes.find(n => n.label.toLowerCase() === query);
  if (found) {
    network.focus(found.id, {scale: 1.5, animation: true});
    network.selectNodes([found.id]);
  }
  document.getElementById('searchInput').value = '';
};
document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('searchButton').click();
});
</script>
